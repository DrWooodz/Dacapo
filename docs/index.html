// ---- music/moodtools.js ----
/* Tools for improvising in a mood (pure): the left-hand patterns, each written out over a voice-led
   progression with fingers; how to read what the left hand played; and the right hand's ideas (color
   note, targets, motif and sequence, thirds and sixths, call and response) with what each listens for. */

const pc12 = m => ((m % 12) + 12) % 12;

/* ---------- the left hand ----------
   Each pattern is one bar of 4/4 over one chord: [{b, ms, f, d}]: the beat it starts on, its notes, their
   fingers (null where the hand has a choice) and how many beats it lasts. Chords are voiced so each takes
   the inversion nearest the one before: the hand barely moves while the harmony changes. */
const LH_PATTERNS = [
  { id: 'fifth', n: 'Root and fifth', how: 'Root and fifth together on beat 1, held. Simple and strong.' },
  { id: 'octave', n: 'Octaves', how: 'The root in octaves on beats 1 and 3: a big, open floor.' },
  {
    id: 'block',
    n: 'Chord on the beat',
    how: 'The chord on beats 1 and 3, each the nearest shape to the last.',
  },
  {
    id: 'broken',
    n: 'Broken chord',
    how: 'Root, fifth, octave, fifth, one note per beat: the left hand keeps moving.',
  },
  {
    id: 'oompah',
    n: 'Bass and chord',
    how: 'The root alone on 1, the chord above it on 2, 3 and 4. Jump, and land.',
  },
  {
    id: 'alberti',
    n: 'Alberti bass',
    how: 'The chord broken low, high, middle, high in even eighths: the classical accompaniment.',
  },
  {
    id: 'tenth',
    n: 'Open tenth',
    how: 'Root, fifth, then the third an octave up: the tenth. A wide, warm sound, the ballad left hand.',
  },
  {
    id: 'sweep',
    n: 'Sweep',
    how: 'Root, fifth, octave, tenth and back down, six even notes a bar: the hand rolls, finger 2 crossing over the thumb.',
  },
  {
    id: 'walking',
    n: 'Walking bass',
    how: 'Root, third, fifth, then the note a half step below the next chord: the bass walks into each change.',
  },
  {
    id: 'pedal',
    n: 'Pedal point',
    how: 'The home note stays in the bass, in octaves, while the chords change above it: tension against a floor.',
  },
];
const LH_BY = Object.fromEntries(LH_PATTERNS.map(p => [p.id, p]));

// the left hand's chords for a progression: a close voicing from C3 up, and the root from E2 to D♯3
const lhVoicing = (mood, pc, chords) => voiceProgression(mood, pc, chords, { lo: 47, hi: 55 });

// one bar of a pattern over chord i of a voiced progression V
function patternBar(id, V, i, tonicPc) {
  const v = V[i];
  const next = V[(i + 1) % V.length];
  const R = v.root;
  const [, third, fifth] = CHORD_TONES[v.info.type];
  const ch = v.right;
  const q = (ms, f) => ms.map((m, k) => ({ b: k, ms: [m], f: [f[k]], d: 1 }));
  switch (id) {
    case 'fifth':
      return [{ b: 0, ms: [R, R + fifth], f: [5, 1], d: 4 }];
    case 'octave':
      return [0, 2].map(b => ({ b, ms: [R, R + 12], f: [5, 1], d: 1.8 }));
    case 'block':
      return [0, 2].map(b => ({ b, ms: ch, f: [5, 3, 1], d: 1.8 }));
    case 'broken':
      return q([R, R + fifth, R + 12, R + fifth], [5, 2, 1, 2]);
    case 'oompah':
      return [{ b: 0, ms: [R], f: [5], d: 1 }, ...[1, 2, 3].map(b => ({ b, ms: ch, f: [5, 3, 1], d: 0.9 }))];
    case 'alberti':
      return [0, 2, 1, 2, 0, 2, 1, 2].map((k, j) => ({ b: j / 2, ms: [ch[k]], f: [[5, 3, 1][k]], d: 0.5 }));
    case 'tenth':
      return q([R, R + fifth, R + 12 + third, R + fifth], [5, 2, 1, 2]);
    case 'sweep':
      return [R, R + fifth, R + 12, R + 12 + third, R + 12, R + fifth].map((m, j) => ({
        b: (j * 2) / 3,
        ms: [m],
        f: [[5, 2, 1, 2, 1, 2][j]],
        d: 2 / 3,
      }));
    case 'walking': {
      // the half step below the next root, in the octave nearest the fifth (above it when the chord repeats)
      const target = next.root === R ? R + 1 : next.root - 1;
      const approach = R + fifth + ((((pc12(target) - pc12(R + fifth) + 6) % 12) + 12) % 12) - 6;
      return q([R, R + third, R + fifth, approach], [5, 3, 1, null]);
    }
    case 'pedal': {
      const T = 40 + pc12(tonicPc - 40);
      return [{ b: 0, ms: [T, T + 12], f: [5, 1], d: 4 }];
    }
    default:
      return [];
  }
}

/* what one left-hand gesture was (notes struck within a moment of each other): a chord, an octave, root
   and fifth, a broken chord tone (3rd or 7th), the home note held under another chord (a pedal), or a
   passing note outside the chord (walking) */
function lhKind(ms, rootPc, type, tonicPc) {
  const tones = CHORD_TONES[type].map(x => pc12(rootPc + x));
  const pcs = [...new Set(ms.map(pc12))];
  if (ms.length >= 2) {
    if (pcs.length === 1)
      return pcs[0] === pc12(tonicPc) && pc12(rootPc) !== pc12(tonicPc) ? 'pedal' : 'octaves';
    if (pcs.length === 2 && pcs.every(p => p === tones[0] || p === tones[2])) return 'rootFifth';
    return 'chords';
  }
  const p = pcs[0];
  if (p === pc12(tonicPc) && pc12(rootPc) !== pc12(tonicPc)) return 'pedal';
  if (p === tones[0] || p === tones[2]) return 'rootFifth';
  if (tones.includes(p)) return 'broken';
  return 'passing';
}
const LH_KINDS = ['chords', 'octaves', 'rootFifth', 'broken', 'pedal', 'passing'];

/* ---------- the right hand ---------- */
const RH_TOOLS = [
  { id: 'free', n: 'Free' },
  { id: 'color', n: 'Color note' },
  { id: 'targets', n: 'Targets' },
  { id: 'motif', n: 'Motif and sequence' },
  { id: 'dyads', n: 'Thirds and sixths' },
  { id: 'call', n: 'Call and response' },
];

// the mood's color note in this key: {pc, name, what, tip}
function colorNote(mood, pc) {
  const M = MOOD_BY[mood];
  const [semis, what, tip] = M.color;
  const scale = moodScale(mood, pc);
  const i = M.semis.indexOf(semis);
  const n = scale[i];
  return { pc: pc12(midiOf(n)), name: nameOf(n, false), what, tip };
}

function toolHow(id, mood, pc) {
  const c = colorNote(mood, pc);
  return {
    free: 'Anything with the lit keys. A good start: a few notes, a rest, the same few notes again.',
    color: `${c.name} is ${c.what}: ${c.tip}. It is marked on the keyboard.`,
    targets:
      'Land on a note of the chord (marked) on beats 1 and 3; anything in the scale between them. The melody follows the harmony.',
    motif:
      'Play a short idea, three or four notes, then play it again starting a step higher or lower: a sequence. Most melodies are built this way.',
    dyads:
      'Two notes at once from the scale, a third or a sixth apart (skip one note, or five). Move them together: instant harmony.',
    call: 'Tap Play a call: DaCapo plays a short phrase, then you answer it. Echo its rhythm, and end on the home note.',
  }[id];
}

// where a note sits in the scale, counted in scale steps from the tonic (across octaves); null if outside
function degreeOf(m, semis, tonicPc) {
  const rel = m - tonicPc;
  const i = semis.indexOf(pc12(rel));
  return i < 0 ? null : Math.floor(rel / 12) * semis.length + i;
}

/* a motif came back: the last three notes have the same shape (in scale steps) as three notes just before
   them. 'sequence' when it starts on another note, 'repeat' when on the same one; else null */
function motifEcho(degrees) {
  const n = degrees.length;
  if (n < 6) return null;
  const shape = (k, j) => [degrees[k + 1] - degrees[k], degrees[k + 2] - degrees[k + 1], j];
  const [a, b] = shape(n - 3);
  // (a plain run up or down the scale is not a motif: every three notes of it have the same shape)
  if ((a === 0 && b === 0) || (a === b && Math.abs(a) === 1)) return null;
  for (let k = Math.max(0, n - 12); k <= n - 6; k++) {
    const [x, y] = shape(k);
    if (x === a && y === b) return degrees[k] === degrees[n - 3] ? 'repeat' : 'sequence';
  }
  return null;
}

// two right-hand notes at once: a third or a sixth (or their octave-up versions), else null
function dyadKind(ms) {
  if (ms.length !== 2) return null;
  const d = Math.abs(ms[1] - ms[0]) % 12;
  return d === 3 || d === 4 ? 'third' : d === 8 || d === 9 ? 'sixth' : null;
}

/* a call: a short phrase in the scale, mostly steps, that ends away from home (on the 2nd, 5th or 7th
   degree) so it asks for an answer. rnd is a function returning [0, 1). [{m, b, d}] in beats. */
function callPhrase(mood, pc, rnd = Math.random) {
  const M = MOOD_BY[mood];
  const tonic = 60 + pc12(midiOf(moodScale(mood, pc)[0]));
  const L = M.semis.length;
  const at = d => tonic + Math.floor(d / L) * 12 + M.semis[((d % L) + L) % L];
  const RHYTHMS = [
    [0, 0.5, 1, 2],
    [0, 1, 1.5, 2],
    [0, 0.5, 1, 1.5, 2],
    [0, 1, 2, 2.5, 3],
  ];
  const rh = RHYTHMS[Math.floor(rnd() * RHYTHMS.length)];
  let d = Math.floor(rnd() * 3) + Math.floor(L / 2) - 1; // start around the middle of the scale
  // (it stays between home and an octave and a half up, in the right hand)
  const degs = rh.map((_, i) => {
    if (i) {
      const s = [-2, -1, -1, 1, 1, 2][Math.floor(rnd() * 6)];
      d += d + s < 0 || d + s > L + (L >> 1) ? -s : s;
    }
    return d;
  });
  // end on a degree that wants to move: the scale's 2nd or 5th-ish note, or the one below home
  const ends = [1, Math.round(L * 0.6), L - 1];
  const last = degs[degs.length - 2];
  const end = ends
    .map(e => e + Math.max(0, Math.round((last - e) / L)) * L)
    .filter(e => e !== last)
    .sort((x, y) => Math.abs(x - last) - Math.abs(y - last))[0];
  degs[degs.length - 1] = end;
  return rh.map((b, i) => ({ m: at(degs[i]), b, d: (rh[i + 1] ?? b + 1) - b }));
}

// an answer: how many notes, and whether it ended on the home note (or at least on a scale note)
function judgeAnswer(ms, semis, tonicPc) {
  const last = ms[ms.length - 1];
  return {
    n: ms.length,
    home: ms.length > 0 && pc12(last) === pc12(tonicPc),
    inScale: ms.length > 0 && semis.includes(pc12(last - tonicPc)),
  };
}

/* ---------- ear: which mood? ----------
   A phrase in a mood: its first progression under the scale rising, then the color note held and home. */
function earPhrase(mood, pc, bar = 1.6) {
  const M = MOOD_BY[mood];
  const chords = M.progs[0].chords;
  const V = voiceProgression(mood, pc, chords);
  const out = [];
  for (let i = 0; i < 4; i++) {
    const v = V[i % V.length];
    out.push({ m: v.root, t: i * bar, d: bar, v: 0.45 });
    v.right.forEach(m => out.push({ m, t: i * bar, d: bar, v: 0.25 }));
  }
  const top = Math.max(...V.flatMap(v => v.right));
  const tonic = top + 1 + pc12(midiOf(moodScale(mood, pc)[0]) - top - 1); // the first tonic above the chords
  const run = [...M.semis.map(s => tonic + s), tonic + 12];
  const step = (bar * 2) / run.length;
  run.forEach((m, i) => out.push({ m, t: i * step, d: step, v: 0.55 }));
  // the color note, then the nearest home
  out.push({ m: tonic + M.color[0], t: bar * 2, d: bar * 0.9, v: 0.6 });
  out.push({ m: tonic + (M.color[0] > 6 ? 12 : 0), t: bar * 3, d: bar, v: 0.55 });
  return out;
}

// a round: a mood (the ones you miss come back more), a key, and four choices from more than one family
function earRound(by = {}, rnd = Math.random, pool = Object.keys(MOOD_BY)) {
  const weight = id => {
    const [n = 0, right = 0] = by[id] || [];
    return 1 + (n - right) * 2 + (n < 2 ? 1 : 0);
  };
  const total = pool.reduce((a, id) => a + weight(id), 0);
  let x = rnd() * total;
  const mood = pool.find(id => (x -= weight(id)) < 0) || pool[0];
  const pick = list => list.splice(Math.floor(rnd() * list.length), 1)[0];
  const fam = MOOD_BY[mood].fam;
  const same = pool.filter(id => id !== mood && MOOD_BY[id].fam === fam);
  const other = pool.filter(id => MOOD_BY[id].fam !== fam);
  const options = [mood];
  if (same.length) options.push(pick(same));
  while (options.length < 4 && other.length) options.push(pick(other));
  // shuffle
  for (let i = options.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [options[i], options[j]] = [options[j], options[i]];
  }
  return { mood, pc: Math.floor(rnd() * 12), options };
}

// ---- learn/moods.js ----
/* Moods: where you are with each scale, what a run counts for, and what to play next.
   A key of a mood (C♯ Phrygian) is
     met          once you have practiced it
     comfortable  after three clean runs with each hand (any help switched on)
     solid        after a check passed on two different days: both hands together, two octaves, no help,
                  every note right and even at your own pace. Checks only happen when you ask.
   A mood is yours once three of its keys are solid, one of them a black-key one. That is a suggestion,
   not a gate: every mood and key is open from the start.
   Practice is free: you choose the hand, the octaves and the help. Nothing moves on by itself. */

const COMFORT_RUNS = 3;
const CHECK_DAYS = 2;
const EVEN = 0.35; // a check's notes may spread this much around your own pace (spread of gaps / mean)

const M = () => Store.s.moods;
const prefs = () => M().prefs;
const keyOf = (mood, pc) => `${mood}:${pc}`;
const keyState = (mood, pc) => M().keys[keyOf(mood, pc)] || null;
function ensureKey(mood, pc) {
  const k = keyOf(mood, pc);
  if (!M().keys[k])
    M().keys[k] = { met: todayKey(), clean: { rh: 0, lh: 0, ht: 0 }, checks: [], last: todayKey() };
  return M().keys[k];
}

// 'new' | 'met' | 'comfortable' | 'solid'
function keyStatus(mood, pc) {
  const k = keyState(mood, pc);
  if (!k) return 'new';
  if (new Set(k.checks).size >= CHECK_DAYS) return 'solid';
  if (k.clean.rh >= COMFORT_RUNS && k.clean.lh >= COMFORT_RUNS) return 'comfortable';
  return 'met';
}
const STATUS_WORD = { new: 'not yet', met: 'met', comfortable: 'comfortable', solid: 'solid' };

// a mood is yours: three solid keys, one of them a black-key one
function moodOwned(mood) {
  const solid = PCS.filter(pc => keyStatus(mood, pc) === 'solid');
  return solid.length >= 3 && solid.some(pc => blackKey(mood, pc));
}
const moodCounts = mood => {
  const c = { new: 0, met: 0, comfortable: 0, solid: 0 };
  PCS.forEach(pc => c[keyStatus(mood, pc)]++);
  return c;
};

/* ---------- drills for the player ----------
   id: m:<mood>:<pc>:<hand>:<octaves>[:<what>], what: (the scale) | check | arp<semis>.<type> | prog<n> */
const runId = (mood, pc, hand, octs, what = '') =>
  `m:${mood}:${pc}:${hand}:${octs}${what ? ':' + what : ''}`;
function parseRun(id) {
  const [, mood, pc, hand, octs, what = ''] = id.split(':');
  const arp = /^arp(\d+)\.(\w+)$/.exec(what);
  const prog = /^prog(\d+)$/.exec(what);
  return {
    mood,
    pc: +pc,
    hand,
    octs: +octs,
    check: what === 'check',
    arp: arp ? [+arp[1], arp[2]] : null,
    prog: prog ? +prog[1] : null,
  };
}
const HAND_WORD = { rh: 'right hand', lh: 'left hand', ht: 'hands together' };
const cap = s => s[0].toUpperCase() + s.slice(1);

// what a drill plays: a scale run, an arpeggio, or a progression of chords
function drillOf(r) {
  if (r.arp) {
    const run = arpeggioRun(r.mood, r.pc, r.arp, r.hand, r.octs);
    return {
      title: `${run.info.name} arpeggio`,
      sub: `${HAND_WORD[r.hand]} · ${r.octs} octave${r.octs > 1 ? 's' : ''}`,
      run,
      kind: 'arp',
    };
  }
  if (r.prog != null) {
    const run = progressionRun(r.mood, r.pc, r.prog, r.hand);
    return {
      title: run.steps.map(s => s.chord).join(' – '),
      sub: r.hand === 'ht' ? 'right hand chords, left hand roots' : HAND_WORD[r.hand],
      run,
      kind: 'chords',
    };
  }
  const run = moodRun(r.mood, r.pc, r.hand, r.octs);
  return {
    title: r.check ? 'Check' : cap(HAND_WORD[r.hand]),
    sub: `${r.check ? 'hands together · ' : ''}${r.octs} octave${r.octs > 1 ? 's' : ''}`,
    run,
    kind: 'scale',
  };
}

// the player's source for a Moods drill: free practice, with the help you choose; checks are strict
function moodSource({ onAbout = () => {} } = {}) {
  return {
    def(id) {
      const r = parseRun(id);
      if (!MOOD_BY[r.mood]) return null;
      const D = drillOf(r);
      return {
        kind: { scale: 'scale', arp: 'arp', chords: 'pattern' }[D.kind], // (the player's cues for each)
        title: D.title,
        sub: D.sub,
        phases: [r.hand],
        target: prefs().bpm,
        build: () => {
          const npb = D.kind === 'chords' ? 0.5 : 2;
          return {
            ...D.run,
            npb,
            even: true,
            beats: D.run.steps.length / npb,
            meter: [4, 4],
            unit: 1,
            clicks: 4,
          };
        },
      };
    },
    plan(id) {
      const r = parseRun(id);
      const p = prefs();
      return {
        mode: p.tempo && !r.check ? 'tempo' : 'wait',
        hand: r.hand,
        hints: r.check ? false : p.keys,
        fingers: r.check ? false : p.fingers,
        bpm: p.bpm,
        label: r.check ? 'Check: no help. Every note right, evenly, at your own pace.' : null,
      };
    },
    record: (id, rep) => recordRun(id, rep),
    state: () => null,
    stage: id => (parseRun(id).check ? { text: 'Check', cls: 'brass' } : { text: '', cls: '' }),
    criterion: id => criterionOf(parseRun(id)),
    about: () => onAbout(),
  };
}

function criterionOf({ mood, pc, hand, check, arp, prog }) {
  const k = keyState(mood, pc) || { clean: { rh: 0, lh: 0 }, checks: [], extra: {} };
  if (arp || prog != null) {
    const n = (k.extra || {})[extraKey({ arp, prog, hand })] || 0;
    return n ? `Played clean ${n} time${n > 1 ? 's' : ''}` : 'Not played clean yet';
  }
  const days = new Set(k.checks).size;
  if (check) return `Checks passed: ${days} of ${CHECK_DAYS} days`;
  const st = keyStatus(mood, pc);
  if (st === 'solid') return 'Solid';
  if (st === 'comfortable') return `Comfortable · checks: ${days} of ${CHECK_DAYS} days`;
  if (hand === 'ht') return `Together: ${k.clean.ht || 0} clean run${k.clean.ht === 1 ? '' : 's'}`;
  return `Clean runs, ${HAND_WORD[hand]}: ${Math.min(COMFORT_RUNS, k.clean[hand] || 0)} of ${COMFORT_RUNS}`;
}
// arpeggios and progressions count separately: they add to what you know, not to the scale's status
const extraKey = ({ arp, prog, hand }) => (arp ? `arp${arp.join('.')}` : `prog${prog}`) + ':' + hand;

// a run is done: count it, and (for a check) see whether it passes
function recordRun(id, rep) {
  const r = parseRun(id);
  const k = ensureKey(r.mood, r.pc);
  const before = keyStatus(r.mood, r.pc);
  k.last = todayKey();
  const sit = sitting(r.mood, r.pc);
  if (r.arp || r.prog != null) {
    const what = r.arp ? 'arpeggios' : 'chords';
    sit.runs[what] = (sit.runs[what] || 0) + 1;
    if (rep.clean && rep.valid !== false) {
      k.extra = k.extra || {};
      const x = extraKey(r);
      k.extra[x] = (k.extra[x] || 0) + 1;
    }
    Store.save();
    return { msg: rep.clean ? 'Clean.' : rep.msg || 'Again.', tone: rep.clean ? 'ok' : 'bad', change: null };
  }
  sit.runs[r.hand] = (sit.runs[r.hand] || 0) + 1;
  if (rep.clean && rep.valid !== false) {
    k.clean[r.hand] = (k.clean[r.hand] || 0) + 1;
    sit.clean = (sit.clean || 0) + 1;
  }
  let msg = '';
  let tone = rep.clean ? 'ok' : 'bad';
  if (r.check) {
    const even = rep.cv == null || rep.cv <= EVEN;
    const pass = rep.clean && even && rep.valid !== false;
    if (pass && !k.checks.includes(todayKey())) k.checks.push(todayKey());
    const days = new Set(k.checks).size;
    msg = pass
      ? days >= CHECK_DAYS
        ? 'Check passed. Solid.'
        : `Check passed. One more on another day makes it solid.`
      : !rep.valid
        ? 'Checks count only from your piano (MIDI or microphone).'
        : !rep.clean
          ? 'Not this time: a check needs every note right with no help.'
          : 'Every note right, but uneven: let the notes come at a steady pace.';
    tone = pass ? 'ok' : 'bad';
  }
  const after = keyStatus(r.mood, r.pc);
  if (after !== before && after === 'comfortable')
    msg = `${moodName(r.mood, r.pc)} is comfortable. Check it with both hands when you like.`;
  if (after !== before && after === 'solid' && moodOwned(r.mood))
    msg = `${moodName(r.mood, r.pc)} is solid, and ${MOOD_BY[r.mood].n} is yours.`;
  Store.save();
  return {
    msg: msg || (rep.clean ? 'Clean.' : rep.msg || 'Again.'),
    tone,
    change: after !== before ? 'stage' : null,
  };
}

/* ---------- sittings: what you did each time you sat down ---------- */
const MAX_SITTINGS = 300;
// the sitting for this mood and key today (one per key per day)
function sitting(mood, pc) {
  const list = M().sittings;
  const d = todayKey();
  let s = list.find(x => x.d === d && x.mood === mood && x.pc === pc);
  if (!s) {
    s = { d, at: Date.now(), mood, pc, runs: {}, clean: 0 };
    list.push(s);
    if (list.length > MAX_SITTINGS) list.splice(0, list.length - MAX_SITTINGS);
  }
  s.at = Date.now();
  ensureKey(mood, pc);
  return s;
}
const lastSitting = () =>
  M()
    .sittings.slice()
    .sort((a, b) => b.at - a.at)[0] || null;

// improvising in a sitting: how long, how many notes, how many in the scale, what each hand did, and the
// left-hand pattern and right-hand idea last chosen. Counts add up across the sitting.
function recordImprovising(mood, pc, stats) {
  const s = sitting(mood, pc);
  const add = (a = {}, b = {}) => {
    const out = { ...a };
    for (const [k, v] of Object.entries(b)) out[k] = (out[k] || 0) + v;
    return out;
  };
  const prev = s.imp || {};
  s.imp = {
    ...add(
      { ms: prev.ms, notes: prev.notes, inScale: prev.inScale, pedalMs: prev.pedalMs },
      {
        ms: stats.ms,
        notes: stats.notes,
        inScale: stats.inScale,
        pedalMs: stats.pedalMs,
      },
    ),
    lh: add(prev.lh, stats.lh),
    rh: add(prev.rh, stats.rh),
    pattern: stats.pattern || prev.pattern,
    tool: stats.tool || prev.tool,
    patterns: [...new Set([...(prev.patterns || []), stats.pattern].filter(Boolean))],
  };
  Store.save();
}

/* ---------- what to play next ---------- */
const FAMILY_ORDER = MOOD_FAMILIES.map(f => f.id); // dark first: the moody ones
const moodsInOrder = () => FAMILY_ORDER.flatMap(f => MOODS.filter(m => m.fam === f));

// the next key of a mood, the way you browse: by hand shape (a key that shares the fingering of one you
// know) or by neighbor (one note different, around the circle)
function nextKey(mood, way) {
  const open = pc => keyStatus(mood, pc) === 'new' || keyStatus(mood, pc) === 'met';
  if (way === 'shape') {
    const known = PCS.filter(pc => !open(pc));
    const groups = handShapes(mood);
    const g =
      groups.find(x => x.pcs.some(pc => known.includes(pc)) && x.pcs.some(open)) ||
      groups.find(x => x.pcs.some(open));
    const pc = g && g.pcs.find(open);
    return pc == null
      ? null
      : {
          pc,
          why:
            known.length && g.pcs.some(p => known.includes(p))
              ? 'same hand shape as a key you know'
              : 'a new hand shape',
        };
  }
  const played = M()
    .sittings.filter(s => s.mood === mood)
    .sort((a, b) => b.at - a.at);
  // a mood starts from its plainest key (the fewest black keys: A for natural minor, C for major)
  const plain = plainestKey(mood);
  if (!played.length && open(plain)) return { pc: plain, why: 'its plainest key, nearly all white keys' };
  const from = played.length ? CIRCLE.indexOf(played[0].pc) : CIRCLE.indexOf(plain) - 1;
  for (let i = 1; i <= 12; i++) {
    const pc = CIRCLE[(from + i + 12) % 12];
    if (open(pc)) return { pc, why: 'one note different from the last key' };
  }
  return null;
}

// the key of a mood with the fewest black keys (ties: the first around the circle from C)
function plainestKey(mood) {
  const blacks = pc => MOOD_BY[mood].semis.filter(x => [1, 3, 6, 8, 10].includes((pc + x) % 12)).length;
  return CIRCLE.reduce((best, pc) => (blacks(pc) < blacks(best) ? pc : best), CIRCLE[0]);
}

// {mood, pc, why}: the suggested next sitting
function suggestNext() {
  const last = lastSitting();
  const way = prefs().browse === 'shape' ? 'shape' : 'neighbor';
  if (last && keyStatus(last.mood, last.pc) === 'met' && last.d >= addDays(todayKey(), -21))
    return { mood: last.mood, pc: last.pc, why: 'Pick up where you left off.' };
  // stay with the mood you were in until it is yours, else the next one (dark moods first)
  const order = moodsInOrder().map(m => m.id);
  const start = prefs().mood || (last && last.mood) || order[0];
  const moods = [start, ...order.filter(m => m !== start)].filter(m => !moodOwned(m));
  for (const mood of moods) {
    const nk = nextKey(mood, way);
    if (nk) {
      const why =
        mood === start && last && last.mood === mood
          ? `More ${MOOD_BY[mood].n}: ${nk.why}.`
          : `${MOOD_BY[mood].feel[0].toUpperCase()}${MOOD_BY[mood].feel.slice(1)}: ${nk.why}.`;
      return { mood, pc: nk.pc, why };
    }
  }
  return { mood: order[0], pc: 0, why: 'Everything is solid. Pick any key to keep it warm.' };
}

/* insights from your playing, a few at most: {text} */
function insights() {
  const out = [];
  const recent = M()
    .sittings.slice()
    .sort((a, b) => b.at - a.at);
  const withImp = recent.find(s => s.imp && s.imp.notes >= 30);
  if (withImp) {
    const { lh, rh = {}, notes, inScale, pedalMs, ms } = withImp.imp;
    // a left-hand pattern you have not tried in any sitting
    const tried = new Set(recent.flatMap(s => (s.imp ? s.imp.patterns || [s.imp.pattern] : [])));
    const untried = LH_PATTERNS.find(p => !tried.has(p.id));
    const next = untried
      ? ` Next time try ${untried.id === 'alberti' ? untried.n : untried.n.toLowerCase()}.`
      : '';
    if (lh.n < notes * 0.1)
      out.push({ text: `Your right hand did nearly all the playing. Give the left hand a pattern.${next}` });
    else if (lh.rootFifth > lh.n * 0.7)
      out.push({
        text: `Your left hand stayed on roots and fifths.${next || ' Try breaking the chord up.'}`,
      });
    else if (lh.chords > lh.n * 0.6)
      out.push({ text: `Your left hand mostly played block chords.${next || ' Try breaking them up.'}` });
    const W = MOOD_BY[withImp.mood];
    if (rh.color === 0 && notes >= 60)
      out.push({
        text: `You never played ${W.color[1]} of ${W.n.toLowerCase()}: the note that gives it its color. Try the Color note idea.`,
        mood: withImp.mood,
        pc: withImp.pc,
      });
    else if (rh.strong >= 12 && rh.onChord < rh.strong * 0.5)
      out.push({
        text: 'On the strong beats you mostly avoided the chord tones. Landing on them makes a melody fit its chords: try Targets.',
      });
    if (pedalMs > ms * 0.9 && ms > 60000)
      out.push({
        text: 'The pedal was down nearly the whole time. Lift and press it again as each chord changes, so the chords stay clear.',
      });
    if (inScale < notes * 0.8)
      out.push({
        text: `About ${Math.round((1 - inScale / notes) * 100)}% of your notes were outside the scale. On purpose is fine; if not, keep the lit keys in view.`,
      });
  }
  const week = addDays(todayKey(), -5);
  for (const [k, v] of Object.entries(M().keys)) {
    const [mood, pc] = k.split(':');
    if (keyStatus(mood, +pc) === 'comfortable' && v.last <= week && out.length < 3) {
      out.push({
        text: `${moodName(mood, +pc)} has been comfortable for a while: check it when you like.`,
        mood,
        pc: +pc,
      });
      break;
    }
  }
  return out.slice(0, 3);
}

// the weeks of your practice: minutes per week (from playing) and solid keys over time, newest last
function trajectory(weeks = 12) {
  const t = todayKey();
  const out = [];
  for (let w = weeks - 1; w >= 0; w--) {
    const end = addDays(t, -7 * w);
    const days = Array.from({ length: 7 }, (_, i) => addDays(end, -i));
    const min = days.reduce((a, d) => a + ((Store.s.days[d] || {}).min || 0), 0);
    const solid = Object.values(M().keys).filter(k => {
      const ds = [...new Set(k.checks)].sort();
      return ds.length >= CHECK_DAYS && ds[CHECK_DAYS - 1] <= end;
    }).length;
    out.push({ end, min: Math.round(min), solid });
  }
  return out;
}

// ---- learn/moodplay.js ----
/* Improvising in a mood: the scale lit on the keyboard, a backing (a held drone, or one of the mood's
   progressions), an idea for the right hand and a pattern for the left. DaCapo listens and says what it
   heard: how much was in the scale, whether the color note came and resolved, chord tones on the strong
   beats, motifs that came back, what the left hand did against its pattern, how long the pedal was down.
   That is saved with the sitting and becomes the suggestions on Home. Nothing here is scored. */

const SPLIT = 60; // below middle C is the left hand
const TOGETHER = 50; // ms: notes this close are one gesture (a chord, a dyad)
const blankStats = () => ({
  ms: 0,
  notes: 0,
  inScale: 0,
  pedalMs: 0,
  lh: Object.fromEntries(['n', 'fit', ...LH_KINDS].map(k => [k, 0])),
  rh: {
    color: 0,
    resolved: 0,
    strong: 0,
    onChord: 0,
    sequences: 0,
    repeats: 0,
    thirds: 0,
    sixths: 0,
    calls: 0,
    answers: 0,
    home: 0,
  },
});

const MoodPlay = {
  mount(root, { mood, pc }) {
    const M = MOOD_BY[mood];
    const scale = moodScale(mood, pc);
    const tonic = midiOf(scale[0]);
    const tPc = pc12(tonic);
    const scalePcs = new Set(scale.map(n => pc12(midiOf(n))));
    const color = colorNote(mood, pc);
    // this sitting's left-hand pattern: the next one after last time's, unless you choose
    const sits = Store.s.moods.sittings.filter(x => x.imp && x.imp.pattern);
    const lastPattern = sits.length ? sits[sits.length - 1].imp.pattern : null;
    const ids = LH_PATTERNS.map(p => p.id);
    const st = {
      pattern: ids[(ids.indexOf(lastPattern) + 1) % ids.length],
      tool: 'free',
      backing: 'off',
      prog: 0,
      bpm: 72,
      bars: [], // the backing's bars as they sound: {t (performance ms), i (chord)}
      nextBar: 0,
      bar: 0,
      held: [], // the drone's sounding notes
      call: null, // {until (performance ms), ms: the answer so far}
    };
    const S = blankStats();
    let saved = blankStats();
    let lastNote = 0;
    let lastTick = performance.now();
    let lhGroup = null;
    let rhGroup = null;
    const degrees = [];
    let lastRh = null; // the previous right-hand note, to hear the color note resolve
    const timers = [];

    const prog = () => M.progs[st.prog].chords;
    const voiced = () => voiceProgression(mood, pc, prog());
    const lhVoiced = () => lhVoicing(mood, pc, prog());
    // the chord sounding at a moment (performance ms): the backing's when it plays, else the home chord
    const chordAt = t => {
      if (st.backing !== 'chords' || !st.bars.length) return { i: 0, beat: null };
      let b = st.bars[0];
      for (const x of st.bars) if (x.t <= t + 80) b = x;
      return { i: b.i, beat: (t - b.t) / (60000 / st.bpm) };
    };
    const chordOf = i => {
      const [s, type] = prog()[i];
      return { rootPc: pc12(tonic + s), type };
    };

    root.innerHTML = `
      <div class="card stack">
        <div class="row between"><h2 class="h2">Improvise</h2><span class="small mono" id="mpTime"></span></div>
        <p class="small">The lit keys are the scale. Pick an idea for each hand, or none: DaCapo only listens.
          Left hand below middle C.</p>
        <div class="stack" style="gap:6px">
          <span class="eyebrow">Backing</span>
          <div class="row" id="mpBack"></div>
          <div id="mpProg"></div>
        </div>
        <div class="stack" style="gap:6px">
          <span class="eyebrow">Right hand</span>
          <div id="mpTool"></div>
          <p class="small" id="mpToolHow"></p>
          <p class="small mono" id="mpRh"></p>
        </div>
        <div class="stack" style="gap:6px">
          <span class="eyebrow">Left hand</span>
          <div id="mpPat"></div>
          <div class="row"><p class="small grow" id="mpHow"></p>
            <button class="btn sm ghost" type="button" id="mpHearLh">Hear it</button></div>
          <p class="small mono" id="mpLh"></p>
        </div>
        <div class="kbwrap scrollx"><div id="mpKb" class="widekb"></div></div>
        <p class="small" id="mpInfo">Start playing whenever you like.</p>
      </div>`;

    /* ---------- drawing ---------- */
    const paintKb = () => {
      const { i } = chordAt(performance.now());
      const { rootPc, type } = chordOf(i);
      const tones = new Set(CHORD_TONES[type].map(x => pc12(rootPc + x)));
      const marks = {};
      for (let m = SPLIT; m <= 84; m++) {
        if (!scalePcs.has(m % 12)) continue;
        const special =
          (st.tool === 'color' && m % 12 === color.pc) || (st.tool === 'targets' && tones.has(m % 12));
        marks[m] = { cls: special ? 'color' : 'rh' };
      }
      for (let m = 28; m < SPLIT; m++) if (scalePcs.has(m % 12)) marks[m] = { cls: 'soft' };
      patternBar(st.pattern, lhVoiced(), i, tPc).forEach(g =>
        g.ms.forEach((m, k) => (marks[m] = { cls: 'lh', f: g.f[k] })),
      );
      $('#mpKb', root).innerHTML = kbSVG({ from: 28, to: 84, marks, h: 110, interactive: false });
    };
    const paintProg = () => {
      const box = $('#mpProg', root);
      if (st.backing !== 'chords') {
        box.innerHTML = '';
        return;
      }
      const V = voiced();
      const { i } = chordAt(performance.now());
      box.innerHTML = `
        ${seg(
          'mpProgs',
          M.progs.map((p, k) => [String(k), p.chords.map(c => chordInfo(mood, pc, c).num).join(' – ')]),
          String(st.prog),
          'sm wrap',
        )}
        <p class="small">${esc(M.progs[st.prog].why)}.</p>
        <div class="row between">
          <div class="improv-chords" id="mpChords">${V.map((v, k) => `<span class="chip" aria-pressed="${k === i}">${esc(v.info.name)}</span>`).join('')}</div>
          <span class="row" style="gap:4px"><span class="small mono">♩ ${st.bpm}</span>
            <button class="btn sm ghost" type="button" data-mpbpm="-6" aria-label="Slower">−</button>
            <button class="btn sm ghost" type="button" data-mpbpm="6" aria-label="Faster">+</button></span>
        </div>`;
      $$('[data-mpbpm]', box).forEach(b => {
        b.onclick = () => {
          st.bpm = Math.max(48, Math.min(132, st.bpm + +b.dataset.mpbpm));
          restartBacking();
        };
      });
      bindSegs(box, {
        mpProgs: v => {
          st.prog = +v;
          restartBacking();
        },
      });
    };
    const paintChordChips = () => {
      const { i } = chordAt(performance.now());
      $$('#mpChords .chip', root).forEach((el, k) => el.setAttribute('aria-pressed', String(k === i)));
    };
    const paintControls = () => {
      $('#mpBack', root).innerHTML =
        seg(
          'mpBacking',
          [
            ['off', 'Off'],
            ['drone', 'Drone'],
            ['chords', 'Chords'],
          ],
          st.backing,
          'sm',
        ) + (Sounds.on() ? '' : '<span class="small">Sound is off in Settings.</span>');
      $('#mpTool', root).innerHTML = seg(
        'mpTools',
        RH_TOOLS.map(t => [t.id, t.n]),
        st.tool,
        'sm wrap',
      );
      $('#mpToolHow', root).innerHTML =
        esc(toolHow(st.tool, mood, pc)) +
        (st.tool === 'call' ? ' <button class="btn sm" type="button" id="mpCall">Play a call</button>' : '');
      $('#mpPat', root).innerHTML = seg(
        'mpPattern',
        LH_PATTERNS.map(p => [p.id, p.n]),
        st.pattern,
        'sm wrap',
      );
      $('#mpHow', root).textContent = LH_BY[st.pattern].how;
      const call = $('#mpCall', root);
      if (call) call.onclick = playCall;
      bindSegs(root, {
        mpBacking: v => {
          st.backing = v;
          restartBacking();
        },
        mpTools: v => {
          st.tool = v;
          // landing on chord tones needs chords to land on
          if (v === 'targets' && st.backing !== 'chords') {
            st.backing = 'chords';
            restartBacking();
          }
          paintControls();
          paintKb();
          feedback();
        },
        mpPattern: v => {
          st.pattern = v;
          paintControls();
          paintKb();
          feedback();
        },
      });
      paintProg();
    };

    /* ---------- the backing: a pad that holds, a bass that plays ---------- */
    const stopSound = () => {
      st.held.forEach(h => Sounds.stop(h));
      st.held = [];
      Sounds.stopAll();
    };
    const playBar = (t, i) => {
      const V = voiced();
      const v = V[i];
      const spb = 60 / st.bpm;
      v.right.forEach(m => {
        const h = Sounds.start('pad', m, 0.5, t);
        if (h) Sounds.stop(h, t + spb * 4 - 0.05);
      });
      [0, 2].forEach(b => {
        const h = Sounds.start('bass', v.root, b ? 0.45 : 0.6, t + b * spb);
        if (h) Sounds.stop(h, t + (b + 1.7) * spb);
      });
    };
    const schedule = () => {
      if (st.backing !== 'chords') return;
      const now = AudioEngine.now();
      const bar = (60 / st.bpm) * 4;
      while (st.nextBar < now + 0.3) {
        const at = Math.max(now, st.nextBar);
        const i = st.bar % prog().length;
        playBar(at, i);
        st.bars.push({ t: AudioEngine.toPerf(at), i });
        if (st.bars.length > 8) st.bars.shift();
        timers.push(setTimeout(() => (paintChordChips(), paintKb()), Math.max(0, (at - now) * 1000)));
        st.nextBar = at + bar;
        st.bar++;
      }
    };
    const restartBacking = () => {
      stopSound();
      timers.splice(0).forEach(clearTimeout);
      st.bars = [];
      st.bar = 0;
      if (st.backing !== 'off') AudioEngine.ensure();
      st.nextBar = AudioEngine.now() + 0.1;
      if (st.backing === 'drone') {
        // home and its fifth, held, in the middle of the piano where any speaker can play them
        const r = 48 + pc12(tPc - 48);
        st.held = [r, r + 7, r + 12].map(m => Sounds.start('pad', m, 0.55)).filter(Boolean);
      }
      paintControls();
      paintKb();
    };

    // the left-hand pattern over the progression, once, on the piano voice
    const hearLh = () => {
      AudioEngine.ensure();
      const V = lhVoiced();
      const spb = 60 / st.bpm;
      const t0 = AudioEngine.now() + 0.1;
      V.forEach((_, i) =>
        patternBar(st.pattern, V, i, tPc).forEach(g =>
          g.ms.forEach(m => AudioEngine.note(m, t0 + (i * 4 + g.b) * spb, g.d * spb, 0.55)),
        ),
      );
    };
    $('#mpHearLh', root).onclick = hearLh;

    // call and response: a phrase from DaCapo, then a window as long again for your answer
    function playCall() {
      AudioEngine.ensure();
      const phrase = callPhrase(mood, pc);
      const spb = 60 / st.bpm;
      const t0 = AudioEngine.now() + 0.1;
      phrase.forEach(n => AudioEngine.note(n.m, t0 + n.b * spb, n.d * spb * 0.95, 0.6));
      const len = (phrase[phrase.length - 1].b + phrase[phrase.length - 1].d) * spb;
      const start = AudioEngine.toPerf(t0 + len);
      st.call = { from: start, until: start + (len + 2 * spb) * 1000, ms: [] };
      S.rh.calls++;
      $('#mpRh', root).textContent = 'Your turn: answer when the call ends.';
    }
    const closeCall = () => {
      const c = st.call;
      st.call = null;
      const a = judgeAnswer(c.ms, M.semis, tPc);
      if (a.n) S.rh.answers++;
      if (a.home) S.rh.home++;
      $('#mpRh', root).textContent = !a.n
        ? 'No answer heard. Play a call again when you are ready.'
        : `Answered with ${a.n} note${a.n > 1 ? 's' : ''}${a.home ? ', home at the end. Settled.' : a.inScale ? '; it ended away from home, a question answered with a question. Try ending on the home note.' : '.'}`;
    };

    /* ---------- listening ---------- */
    const countLh = g => {
      const { i } = chordAt(g.t);
      const { rootPc, type } = chordOf(i);
      const kind = lhKind(g.ms, rootPc, type, tPc);
      S.lh.n++;
      S.lh[kind]++;
      const want = new Set(patternBar(st.pattern, lhVoiced(), i, tPc).flatMap(x => x.ms.map(pc12)));
      if (g.ms.every(m => want.has(pc12(m)))) S.lh.fit++;
    };
    const countRh = g => {
      const d = dyadKind(g.ms);
      if (d === 'third') S.rh.thirds++;
      if (d === 'sixth') S.rh.sixths++;
    };
    const onNote = ev => {
      if (ev.m == null) return;
      const t = ev.t || performance.now();
      lastNote = performance.now();
      S.notes++;
      const inScale = scalePcs.has(ev.m % 12);
      if (inScale) S.inScale++;
      flashKey($('#mpKb svg', root), ev.m, inScale ? 'down' : 'bad', 260);
      if (ev.m < SPLIT) {
        if (lhGroup && t - lhGroup.t < TOGETHER) lhGroup.ms.push(ev.m);
        else {
          if (lhGroup) countLh(lhGroup);
          lhGroup = { t, ms: [ev.m] };
        }
        return;
      }
      // the right hand
      if (rhGroup && t - rhGroup.t < TOGETHER) rhGroup.ms.push(ev.m);
      else {
        if (rhGroup) countRh(rhGroup);
        rhGroup = { t, ms: [ev.m] };
      }
      if (lastRh != null && pc12(lastRh) === color.pc && Math.abs(ev.m - lastRh) <= 2 && ev.m !== lastRh)
        S.rh.resolved++;
      if (pc12(ev.m) === color.pc) S.rh.color++;
      lastRh = ev.m;
      const { i, beat } = chordAt(t);
      if (beat != null) {
        const off = Math.abs(beat % 2 < 1 ? beat % 2 : (beat % 2) - 2); // distance to beat 1 or 3
        if (off < 0.25) {
          S.rh.strong++;
          const { rootPc, type } = chordOf(i);
          if (CHORD_TONES[type].some(x => pc12(rootPc + x) === pc12(ev.m))) S.rh.onChord++;
        }
      }
      const deg = degreeOf(ev.m, M.semis, tPc);
      if (deg != null) {
        degrees.push(deg);
        if (degrees.length > 16) degrees.shift();
        const echo = motifEcho(degrees);
        if (echo) {
          S.rh[echo === 'sequence' ? 'sequences' : 'repeats']++;
          degrees.splice(0, degrees.length - 3); // count each return once
        }
      }
      if (st.call && t >= st.call.from - 150) st.call.ms.push(ev.m);
    };
    const offs = [Input.on(onNote)];

    // what DaCapo heard, for the idea and the pattern you chose
    const feedback = () => {
      const r = S.rh;
      const lh = S.lh;
      const pct = (a, b) => `${Math.round((a / b) * 100)}%`;
      if (st.tool !== 'call' || !st.call) {
        $('#mpRh', root).textContent = {
          free: '',
          color: r.color
            ? `${color.name} ${r.color} time${r.color > 1 ? 's' : ''}, resolved ${r.resolved}`
            : `${color.name} not played yet`,
          targets:
            st.backing !== 'chords'
              ? 'Needs the chords backing.'
              : r.strong
                ? `On beats 1 and 3: ${r.onChord} of ${r.strong} notes were chord tones`
                : 'Nothing on beats 1 and 3 yet',
          motif:
            r.sequences + r.repeats ? `${r.sequences} sequences · ${r.repeats} repeats` : 'No motif back yet',
          dyads: r.thirds + r.sixths ? `${r.thirds} thirds · ${r.sixths} sixths` : 'No thirds or sixths yet',
          call: r.calls ? `${r.answers} of ${r.calls} calls answered · ${r.home} ended home` : '',
        }[st.tool];
      }
      $('#mpLh', root).textContent = lh.n ? `${pct(lh.fit, lh.n)} on the pattern · ${lhWord(lh)}` : '';
      $('#mpTime', root).textContent = S.ms > 1000 ? fmtTime(S.ms / 1000) : '';
      if (S.notes)
        $('#mpInfo', root).textContent = `${S.notes} notes · ${pct(S.inScale, S.notes)} in the scale`;
    };
    const lhWord = lh => {
      const top = LH_KINDS.reduce((a, k) => (lh[k] > lh[a] ? k : a), LH_KINDS[0]);
      return lh[top] < lh.n * 0.5
        ? 'a mix'
        : {
            chords: 'mostly chords',
            octaves: 'mostly octaves',
            rootFifth: 'mostly roots and fifths',
            broken: 'moving through the chords',
            pedal: 'holding home under the chords',
            passing: 'walking between chord tones',
          }[top];
    };

    const flush = () => {
      if (lhGroup) countLh(lhGroup);
      if (rhGroup) countRh(rhGroup);
      lhGroup = rhGroup = null;
    };
    const save = () => {
      flush();
      const diff = (a, b) => Object.fromEntries(Object.keys(a).map(k => [k, a[k] - b[k]]));
      const d = {
        ms: S.ms - saved.ms,
        notes: S.notes - saved.notes,
        inScale: S.inScale - saved.inScale,
        pedalMs: S.pedalMs - saved.pedalMs,
        lh: diff(S.lh, saved.lh),
        rh: diff(S.rh, saved.rh),
        pattern: st.pattern,
        tool: st.tool,
      };
      if (d.notes > 0) recordImprovising(mood, pc, d);
      saved = JSON.parse(JSON.stringify(S));
    };
    const tick = setInterval(
      Log.guard('moodplay tick', () => {
        const now = performance.now();
        const dt = now - lastTick;
        lastTick = now;
        // time counts while you play (a note in the last four seconds)
        if (now - lastNote < 4000) {
          S.ms += dt;
          if (Input.pedal) S.pedalMs += dt;
        }
        // a gesture is over once nothing joins it
        if (lhGroup && now - lhGroup.t > 200) (countLh(lhGroup), (lhGroup = null));
        if (rhGroup && now - rhGroup.t > 200) (countRh(rhGroup), (rhGroup = null));
        if (st.call && now > st.call.until) closeCall();
        schedule();
        feedback();
      }),
      100,
    );
    const autosave = setInterval(save, 20000);
    paintControls();
    paintKb();
    Log.ev('moodplay start', { mood, pc, pattern: st.pattern });
    return {
      stats: () => S,
      destroy() {
        clearInterval(tick);
        clearInterval(autosave);
        timers.forEach(clearTimeout);
        save();
        offs.forEach(f => f());
        stopSound();
        AudioEngine.stopAll();
        Log.ev('moodplay stop', { mood, pc, ms: Math.round(S.ms), notes: S.notes });
      },
    };
  },
};

// ---- views/mood.js ----
/* A sitting with one mood in one key: hear it, run the scale (each hand, or together), learn its chords
   and progressions, its arpeggios, and improvise in it. You move between the steps freely. Help is yours to switch: keys lit on the keyboard, finger numbers,
   and tempo (a metronome, off unless you want it). "Check me" is the one strict moment: both hands, two
   octaves, no help. */

const STEPS = [
  ['listen', 'Listen'],
  ['scale', 'Scale'],
  ['chords', 'Chords'],
  ['arps', 'Arpeggios'],
  ['play', 'Improvise'],
];
const HANDS = [
  ['rh', 'Right'],
  ['lh', 'Left'],
  ['ht', 'Both'],
];

const moodView = (page, params) => {
  const mood = MOOD_BY[params.mood] ? params.mood : 'natural';
  const pc = Number.isInteger(+params.pc) ? +params.pc % 12 : 0;
  const M = MOOD_BY[mood];
  const chords = moodChords(mood, pc);
  // (an older link may name a hand as the step)
  const handStep = ['rh', 'lh', 'ht'].includes(params.step);
  const st = {
    step: handStep ? 'scale' : STEPS.some(x => x[0] === params.step) ? params.step : 'listen',
    hand: handStep ? params.step : 'rh',
    check: false,
    prog: 0,
    arp: chords[0].semis + '.' + chords[0].type,
  };
  let player = null;
  let play = null;
  const unmount = () => {
    if (player) player.destroy();
    if (play) play.destroy();
    player = play = null;
  };
  onUnmount(unmount);
  sitting(mood, pc); // you met it
  Store.s.moods.prefs.mood = mood;
  Store.save();
  Log.ev('mood open', { mood, pc });

  page.innerHTML = `
    <section class="session">
      <div class="sess-top">
        <button class="btn sm ghost" type="button" id="mdBack">← Home</button>
        <span class="small" id="mdStatus"></span>
      </div>
      <div class="stack" style="gap:2px">
        <h1 class="h1 pagetitle">${esc(moodName(mood, pc))}</h1>
        <p class="small">${esc(M.feel[0].toUpperCase() + M.feel.slice(1))} · think ${esc(M.hear)}</p>
      </div>
      <div id="mdSteps"></div>
    </section>
    ${connectNotice()}
    <div id="mdHelp"></div>
    <div id="mdBody" style="position:relative"></div>`;
  bindConnect();
  $('#mdBack', page).onclick = () => go('home');

  const status = () => {
    const k = keyState(mood, pc) || { clean: { rh: 0, lh: 0 }, checks: [] };
    const s = keyStatus(mood, pc);
    const n = h => Math.min(COMFORT_RUNS, k.clean[h] || 0);
    $('#mdStatus', page).innerHTML =
      `<span class="pill ${s === 'solid' ? 'ok' : s === 'comfortable' ? 'brass' : ''}">${STATUS_WORD[s]}</span> ` +
      (s === 'solid'
        ? ''
        : s === 'comfortable'
          ? `checks ${new Set(k.checks).size} of ${CHECK_DAYS} days`
          : `clean runs: right ${n('rh')}/${COMFORT_RUNS}, left ${n('lh')}/${COMFORT_RUNS}`);
  };

  // the help switches (keys lit, finger numbers, tempo), the hand, and the octaves where they apply
  const paintHelp = () => {
    const box = $('#mdHelp', page);
    const p = prefs();
    if (!['scale', 'chords', 'arps'].includes(st.step)) {
      box.innerHTML = '';
      return;
    }
    if (st.check) {
      box.innerHTML = `<div class="notice row between"><span><b>Check:</b> both hands, two octaves, no help.
        Every note right, evenly, at your own pace.</span>
        <button class="btn sm ghost" type="button" id="mdCancel">Back to practice</button></div>`;
      $('#mdCancel', box).onclick = () => {
        st.check = false;
        draw();
      };
      return;
    }
    const chip = (id, on, label) =>
      `<button type="button" class="chip" data-help="${id}" aria-pressed="${on}">${label}</button>`;
    box.innerHTML = `<div class="helpbar">
      ${seg('mdHand', HANDS, st.hand, 'sm')}
      ${chip('keys', p.keys, 'Keys lit')}
      ${chip('fingers', p.fingers, 'Finger numbers')}
      ${chip('tempo', p.tempo, p.tempo ? `Tempo ♩ ${p.bpm}` : 'Tempo')}
      ${p.tempo ? `<span class="row" style="gap:4px"><button class="btn sm ghost" type="button" data-bpm="-5" aria-label="Slower">−</button><button class="btn sm ghost" type="button" data-bpm="5" aria-label="Faster">+</button></span>` : ''}
      ${
        st.step === 'chords'
          ? ''
          : seg(
              'mdOct',
              [
                ['1', '1 octave'],
                ['2', '2 octaves'],
              ],
              String(p.octs),
              'sm',
            )
      }
      ${st.step === 'scale' ? '<button class="btn sm cover" type="button" id="mdCheck">Check me</button>' : ''}
    </div>`;
    $$('[data-help]', box).forEach(b => {
      b.onclick = () => {
        p[b.dataset.help] = !p[b.dataset.help];
        Store.save();
        draw();
      };
    });
    $$('[data-bpm]', box).forEach(b => {
      b.onclick = () => {
        p.bpm = Math.max(30, Math.min(160, p.bpm + +b.dataset.bpm));
        Store.save();
        draw();
      };
    });
    bindSegs(box, {
      mdHand: v => {
        st.hand = v;
        draw();
      },
      mdOct: v => {
        p.octs = +v;
        Store.save();
        draw();
      },
    });
    const check = $('#mdCheck', box);
    if (check)
      check.onclick = () => {
        st.check = true;
        draw();
      };
  };

  /* ---------- sound ---------- */
  // chords, voiced so each moves as little as possible from the last, with the root below
  const hearChords = (list, { bar = 1.8, melody = false } = {}) => {
    AudioEngine.ensure();
    AudioEngine.stopAll();
    const V = voiceProgression(mood, pc, list);
    const scale = moodScale(mood, pc).map(midiOf);
    const t0 = AudioEngine.now() + 0.1;
    V.forEach((v, i) => {
      const t = t0 + i * bar;
      AudioEngine.note(v.root, t, bar, 0.45);
      AudioEngine.chord(v.right, t, bar, 0.28);
      // a few scale notes above, stepping toward a chord tone
      if (melody)
        [0, 1, 2].forEach(j =>
          AudioEngine.note(scale[(i * 2 + j * 2) % scale.length] + 12, t + j * (bar / 3), bar / 3, 0.4),
        );
    });
  };

  const listen = body => {
    const run = moodRun(mood, pc, 'rh', 1);
    const up = run.steps.slice(0, Math.ceil(run.steps.length / 2));
    const staff = staffSVG({
      clef: 'treble',
      sig: run.sig,
      items: up.map(s => ({ notes: s.notes })),
      spacing: 34,
      top: 36,
      bottom: 36,
    });
    const marks = {};
    const fr = moodFingering(mood, pc, 'rh', 1);
    up.forEach((s, i) => (marks[s.midis[0]] = { cls: 'rh', f: fr[i] }));
    const color = colorNote(mood, pc);
    const owned = moodOwned(mood);
    body.innerHTML = `<div class="card stack">
      <div class="staffwrap"><div style="max-width:520px;margin:0 auto">${staff.svg}</div></div>
      <div class="kbwrap scrollx">${kbSVG({ from: up[0].midis[0] - 3, to: up[up.length - 1].midis[0] + 3, marks, h: 92, interactive: false })}</div>
      <div class="row">
        <button class="btn" type="button" id="mdHearScale">Hear the scale</button>
        <button class="btn" type="button" id="mdHearMood">Hear the mood</button>
      </div>
      <p>${esc(M.how)}</p>
      <p><b>Color note: ${esc(color.name)}</b>, ${esc(color.what)}: ${esc(color.tip)}.</p>
      <p class="small">${blackKey(mood, pc) ? 'A black-key one: the hand sits further in, over the black keys. ' : ''}${
        owned
          ? `${esc(M.n)} is yours: solid in three keys.`
          : `${esc(M.n)} becomes yours when three keys are solid, one of them a black-key one.`
      }</p>
    </div>`;
    $('#mdHearScale', body).onclick = () => {
      AudioEngine.ensure();
      AudioEngine.seq(
        run.steps.map(s => s.midis[0]),
        0.32,
        0.6,
        0.55,
      );
    };
    $('#mdHearMood', body).onclick = () => hearChords(M.progs[0].chords, { bar: 2.2, melody: true });
  };

  const mountDrill = (host, id) => {
    player = Player.mount(host, {
      id,
      source: moodSource({ onAbout: () => aboutMood(mood) }),
      onEvent: ev => {
        if (ev.type === 'rep') status();
      },
    });
  };

  // the chords the scale makes, and the progressions that make the mood
  const chordsStep = body => {
    const P = M.parent ? MOOD_BY[M.parent] : null;
    const row = (c, k) => `<tr class="${c.signature ? 'sig' : ''}">
        <td class="mono">${esc(c.num)}</td>
        <td><b>${esc(c.name)}</b>${c.signature ? ' <span class="pill brass">signature</span>' : ''}
          <span class="small">${esc(c.word)}</span></td>
        <td class="small">${c.notes.map(noteLabel).join(' ')}</td>
        <td class="small">${c.seventh ? esc(c.seventh.name) : ''}</td>
        <td><button class="btn sm ghost" type="button" data-hearc="${k}" aria-label="Hear ${esc(c.name)}">Hear</button></td>
      </tr>`;
    const progs = M.progs.map((p, k) => {
      const V = voiceProgression(mood, pc, p.chords);
      return `<div class="progrow ${k === st.prog ? 'on' : ''}">
        <div class="grow"><b>${V.map(v => esc(v.info.name)).join(' – ')}</b>
          <span class="small mono">${V.map(v => esc(v.info.num)).join(' – ')}</span>
          <span class="small">${esc(p.why)}</span></div>
        <button class="btn sm ghost" type="button" data-hearp="${k}">Hear</button>
        <button class="btn sm ${k === st.prog ? 'cover' : ''}" type="button" data-prog="${k}">Play it</button>
      </div>`;
    });
    body.innerHTML = `<div class="card stack">
        <h2 class="h2">Chords of ${esc(moodName(mood, pc))}</h2>
        ${P ? `<p class="small">These are the chords of ${esc(P.n.toLowerCase())}, the scale ${esc(M.n.toLowerCase())} comes from: the pentatonic leaves out the notes most likely to clash, so it fits over nearly all of them.</p>` : ''}
        <div class="scrollx"><table class="chordtable"><thead><tr><th></th><th>Chord</th><th>Notes</th><th>With 7th</th><th></th></tr></thead><tbody>${chords.map(row).join('')}</tbody></table></div>
        <h3 class="h3">Progressions</h3>
        <div class="stack" style="gap:6px">${progs.join('')}</div>
        <p class="small">Chords move by their nearest shape: the right hand barely moves, and the left plays the roots.</p>
      </div>
      <div id="mdDrill"></div>`;
    $$('[data-hearc]', body).forEach(b => {
      b.onclick = () => {
        const c = chords[+b.dataset.hearc];
        hearChords([[c.semis, c.type]], { bar: 1.6 });
      };
    });
    $$('[data-hearp]', body).forEach(b => {
      b.onclick = () => hearChords(M.progs[+b.dataset.hearp].chords);
    });
    $$('[data-prog]', body).forEach(b => {
      b.onclick = () => {
        st.prog = +b.dataset.prog;
        draw();
      };
    });
    mountDrill($('#mdDrill', body), runId(mood, pc, st.hand, 1, `prog${st.prog}`));
  };

  // arpeggios: the home chord, the signature chord, any chord of the scale
  const arpsStep = body => {
    const chip = c => {
      const v = `${c.semis}.${c.type}`;
      const tag = c === chords[0] ? 'home' : c.signature ? 'signature' : '';
      return `<button type="button" class="chip" data-arp="${v}" aria-pressed="${v === st.arp}">${esc(c.name)}${tag ? ` · ${tag}` : ''}</button>`;
    };
    const lead = chords.filter((c, k) => k === 0 || c.signature);
    body.innerHTML = `<div class="card stack">
        <div class="row" style="gap:6px;flex-wrap:wrap">${lead.map(chip).join('')}
          <details class="morechords"><summary class="small">Every chord</summary>
            <div class="row" style="gap:6px;flex-wrap:wrap">${chords
              .filter(c => !lead.includes(c))
              .map(chip)
              .join('')}</div>
          </details></div>
        <p class="small">The chord's notes one at a time, up and back. The same shape your left hand breaks
          when it accompanies, and your right hand's fastest way across the keys.</p>
      </div>
      <div id="mdDrill"></div>`;
    $$('[data-arp]', body).forEach(b => {
      b.onclick = () => {
        st.arp = b.dataset.arp;
        draw();
      };
    });
    mountDrill($('#mdDrill', body), runId(mood, pc, st.hand, prefs().octs, `arp${st.arp}`));
  };

  const draw = () => {
    unmount();
    status();
    $('#mdSteps', page).innerHTML = seg('mdStep', STEPS, st.step, 'wrap');
    bindSegs($('#mdSteps', page), {
      mdStep: v => {
        st.step = v;
        st.check = false;
        draw();
      },
    });
    paintHelp();
    const body = $('#mdBody', page);
    if (st.step === 'listen') return listen(body);
    if (st.step === 'chords') return chordsStep(body);
    if (st.step === 'arps') return arpsStep(body);
    if (st.step === 'play') {
      play = MoodPlay.mount(body, { mood, pc });
      return;
    }
    mountDrill(body, st.check ? runId(mood, pc, 'ht', 2, 'check') : runId(mood, pc, st.hand, prefs().octs));
  };
  draw();
};

const noteLabel = n => esc('CDEFGAB'[n.l] + (n.a > 0 ? '♯'.repeat(n.a) : n.a < 0 ? '♭'.repeat(-n.a) : ''));

// the mood, explained: what it is, what it sounds like, where you know it from
function aboutMood(mood) {
  const M = MOOD_BY[mood];
  const fam = MOOD_FAMILIES.find(f => f.id === M.fam);
  openSheet(
    `<div class="sheethead"><h2 class="h2">${esc(M.n)}</h2>${closeBtn}</div>
     <p><b>${esc(fam.n)}:</b> ${esc(M.feel)}.</p>
     <p>${esc(M.how)}</p>
     <p class="small">Where you have heard it: ${esc(M.hear)}.</p>
     <p class="small">Moods are conventions of Western music and film, not physics: trust your own ear.
       On a modern piano every key of a mood sounds the same apart from how high it is; the keys train
       your hands.</p>`,
    null,
    { label: M.n },
  );
}

// ---- views/skills.js ----
/* The panels Home opens: a skill and its units, this week's focus, and your practice over time. */

const niceDate = d =>
  new Date(d + 'T12:00').toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
const shortDate = d =>
  new Date(d + 'T12:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });

// one milestone: notes learned, a goal reached, integrated, a review (with its date, when asked)
const MILESTONE = h =>
  h.e === 'done'
    ? 'integrated'
    : h.e === 'review'
      ? h.v === 'ok'
        ? 'review: still solid'
        : 'review: needs a refresh'
      : {
          tempo: 'notes learned, building tempo',
          pace: 'notes learned, building speed',
          check: 'goal reached',
        }[h.v] || 'back to building';
function milestoneRow(h, { date = false } = {}) {
  const d = itemDef(h.id);
  if (!d) return '';
  const dot = h.e === 'done' ? 'done' : h.v === 'check' ? 'check' : 'tempo';
  return `<div class="listrow">
    <span class="dot3 ${dot}"></span>
    <div class="grow">
      <div class="ttl">${esc(shortTitle(d))}</div>
      <div class="small">${esc(MILESTONE(h))}${date ? ' · ' + esc(shortDate(h.d)) : ''}</div>
    </div>
  </div>`;
}

function itemRow(id, now) {
  const d = itemDef(id);
  if (!d) return '';
  const it = itemState(id);
  return `<div class="listrow">
    <span class="dot3 ${it ? it.stage : ''}"></span>
    <div class="grow">
      <div class="ttl">${esc(shortTitle(d))}${now ? ' <span class="tag rh">now</span>' : ''}</div>
      <div class="small">${esc(it ? STAGE_TXT[it.stage] + ' · ' + criterion(id) : d.sub || 'Not started')}</div>
    </div>
    <button class="btn sm ghost" type="button" data-p="${esc(id)}">Practice</button>
  </div>`;
}

// the units of a skill, tier by tier: where it stands, and any of them to practice now
function skillSheet(skill) {
  const sk = SKILLS.find(x => x.id === skill);
  const st = skillStatus(skill);
  const now = id => id === st.focus || st.checks.includes(id);
  const body =
    (st.locked
      ? '<p class="notice">Sight-reading opens once you read the treble and bass staff up to an octave fluently.</p>'
      : '') +
    skillTiers(skill)
      .map(
        (tier, i) => `<h3 class="h3">Tier ${i + 1} · ${TIER_NAMES[i + 1]}</h3>
          <div class="stack" style="gap:0">${tier.map(id => itemRow(id, now(id))).join('')}</div>`,
      )
      .join('');
  const area = AREA_BY[sk.area];
  openSheet(
    `<div class="sheethead"><h2 class="h2">${esc(sk.n)}</h2>${closeBtn}</div>
     <p class="small">${esc(area ? area.d : '')} Each tier is a level: 1 Foundations, 2 Developing,
       3 Fluent. The session works on the first unfinished item and moves on when it is integrated; anything
       here can be practiced now as extra practice.</p>
     ${body}`,
    sheet => {
      sheet.querySelectorAll('[data-p]').forEach(b => {
        b.onclick = () => {
          closeSheet();
          go('practice', { item: b.dataset.p });
        };
      });
    },
    { label: sk.n },
  );
}

// choose this week's focus: the suggestion first, with its reason
function focusSheet(onChange) {
  const f = currentFocus();
  const ranked = rankAreas();
  // the suggestion waiting for your answer stays the suggestion
  const suggested = f && !f.confirmed ? f.area : ranked[0] && ranked[0].area;
  ranked.sort((a, b) => (b.area === suggested) - (a.area === suggested));
  const row =
    r => `<button type="button" class="pickrow" data-area="${r.area}" aria-pressed="${f && f.area === r.area}">
      <b>${esc(AREA_BY[r.area].n)}${r.area === suggested ? ' <span class="tag rh">suggested</span>' : ''}</b>
      <span class="small">${esc(r.area === (f && f.area) && f.reason ? f.reason : r.reason)}</span>
    </button>`;
  const off = AREAS.filter(a => !areaOn(a.id));
  openSheet(
    `<div class="sheethead"><h2 class="h2">This week's focus</h2>${closeBtn}</div>
     <p class="small">Most of each session goes to the focus for a week; the other areas get a few minutes of
       upkeep so nothing fades. Your choices teach the suggestions what matters to you.</p>
     <div class="stack" style="gap:8px">${ranked.map(row).join('')}</div>
     ${off.length ? `<p class="small">Switched off in Settings: ${off.map(a => esc(a.n)).join(', ')}.</p>` : ''}`,
    sheet => {
      sheet.querySelectorAll('[data-area]').forEach(b => {
        b.onclick = () => {
          chooseFocus(b.dataset.area);
          closeSheet();
          toast(`This week: ${AREA_BY[b.dataset.area].n}`);
          if (onChange) onChange();
        };
      });
    },
    { label: "This week's focus" },
  );
}

// your practice over time: the last two weeks, milestones, and every day played (a wrong day, when
// someone else played, can be removed, with undo)
function progressSheet() {
  const t = todayKey();
  const days = Store.s.days;
  const last14 = Array.from({ length: 14 }, (_, i) => addDays(t, i - 13));
  const mins = last14.map(d => (days[d] && days[d].min) || 0);
  const max = Math.max(10, ...mins);
  let streak = 0;
  for (let i = 0; i < 400; i++) {
    const d = addDays(t, -i);
    if (days[d] && days[d].min >= 1) streak++;
    else if (i > 0) break;
  }
  const dayBar = (d, i) => {
    const cls = [mins[i] < 1 ? 'zero' : '', d === t ? 'today' : ''].join(' ');
    const weekday = 'SMTWTFS'[new Date(d + 'T12:00').getDay()];
    return `<div class="c" title="${d}: ${Math.round(mins[i])} min">
      <div class="bar ${cls}" style="height:${Math.max(2, (mins[i] / max) * 70)}px"></div><span>${weekday}</span></div>`;
  };
  const f = currentFocus();
  const logRow = ([d, v]) => `<div class="listrow">
    <div class="grow">
      <div class="ttl">${shortDate(d)}</div>
      <div class="small">${Math.round(v.min || 0)} min · ${v.reps || 0} reps</div>
    </div>
    <button class="btn sm ghost" type="button" data-del="${d}">Remove</button>
  </div>`;
  const log = Object.entries(days)
    .sort((a, b) => b[0].localeCompare(a[0]))
    .slice(0, 60);
  const recent = Store.s.hist.slice(-12).reverse();
  openSheet(
    `<div class="sheethead"><h2 class="h2">Your practice</h2>${closeBtn}</div>
     ${f ? `<p class="small">Focus: <b>${esc(AREA_BY[f.area].n)}</b> until ${esc(niceDate(f.until))}.</p>` : ''}
     <div class="stats">
       <div class="stat"><b>${Math.round(mins.slice(-7).reduce((a, b) => a + b, 0))}</b><span>minutes in 7 days</span></div>
       <div class="stat"><b>${mins.slice(-7).filter(m => m >= 1).length}/7</b><span>days played</span></div>
       <div class="stat"><b>${streak}</b><span>day streak</span></div>
     </div>
     <div class="week" aria-label="Minutes played, last 14 days">${last14.map(dayBar).join('')}</div>
     <p class="small">Minutes count only while you play on your piano. Short daily sessions beat long
       occasional ones: memory for movement consolidates during sleep.</p>
     <h3 class="h3">Milestones</h3>
     ${
       recent.length
         ? `<div class="stack" style="gap:0">${recent.map(h => milestoneRow(h, { date: true })).join('')}</div>`
         : '<p class="small">Milestones appear here: notes learned, goals reached, integrated.</p>'
     }
     <details class="logdays">
       <summary class="small">Every day played</summary>
       <div class="stack" style="gap:0">${log.length ? log.map(logRow).join('') : '<p class="small">Nothing yet.</p>'}</div>
     </details>`,
    sheet => {
      sheet.querySelectorAll('[data-del]').forEach(b => {
        b.onclick = () => {
          const d = b.dataset.del;
          const old = Store.s.days[d];
          delete Store.s.days[d];
          Store.save();
          Log.ev('day removed', { d });
          progressSheet();
          toast('Day removed', 6000, {
            label: 'Undo',
            run: () => {
              Store.s.days[d] = old;
              Store.save();
              progressSheet();
            },
          });
        };
      });
    },
    { label: 'Your practice' },
  );
}

// ---- views/moodshome.js ----
/* Home on the Moods path: where you left off and what to play next, what DaCapo noticed in your playing,
   every mood and key you can learn (browsed by mood, by hand shape or by neighbor), and your trajectory.
   Tapping a key opens a sitting with it. */

const ago = d => {
  const n = Math.round((new Date(todayKey() + 'T12:00') - new Date(d + 'T12:00')) / 864e5);
  return n === 0 ? 'today' : n === 1 ? 'yesterday' : `${n} days ago`;
};

// one key of a mood as a tappable dot: its tonic, colored by where you are with it
const keyDot = (mood, pc, label = tonicName(mood, pc)) => {
  const s = keyStatus(mood, pc);
  return `<button type="button" class="keydot ${s}" data-mood="${mood}" data-pc="${pc}"
    title="${esc(moodName(mood, pc))}: ${STATUS_WORD[s]}">${esc(label)}</button>`;
};

/* ---------- pick up ---------- */
function pickupCard() {
  const last = lastSitting();
  const next = suggestNext();
  const N = MOOD_BY[next.mood];
  // what you did last time: a line of its own, or part of the suggestion when it is the same key
  const did = last
    ? (() => {
        const runs = Object.values(last.runs || {}).reduce((a, b) => a + b, 0);
        const imp = last.imp ? Math.round(last.imp.ms / 60000) : 0;
        const parts = [runs && `${runs} run${runs > 1 ? 's' : ''}`, imp && `${imp} min improvising`].filter(
          Boolean,
        );
        return `${parts.length ? parts.join(' · ') : 'listened'} · ${STATUS_WORD[keyStatus(last.mood, last.pc)]}`;
      })()
    : '';
  const same = last && last.mood === next.mood && last.pc === next.pc;
  const lastLine =
    last && !same
      ? `<button type="button" class="lastline" data-mood="${last.mood}" data-pc="${last.pc}">
          <span class="small">Last time · ${ago(last.d)}</span>
          <b>${esc(moodName(last.mood, last.pc))}</b>
          <span class="small">${did}</span>
        </button>`
      : '';
  return `<section class="card pickup">
    ${lastLine}
    <div class="stack" style="gap:4px">
      <span class="eyebrow">${same ? `Last time · ${ago(last.d)}` : last ? 'Next' : 'Start here'}</span>
      <h2 class="h2">${esc(moodName(next.mood, next.pc))}</h2>
      <p class="small">${same ? `${esc(did)}. ` : ''}${esc(next.why)} Think ${esc(N.hear)}.</p>
    </div>
    <button class="btn cover big" type="button" data-mood="${next.mood}" data-pc="${next.pc}">${same ? 'Continue' : 'Start'}</button>
    <p class="small">Or tap any key below.</p>
  </section>`;
}

function insightsCard() {
  const list = insights();
  if (!list.length) return '';
  return `<section class="card">
    <h2 class="h2">From your playing</h2>
    <div class="stack" style="gap:6px">${list
      .map(
        i =>
          `<p class="insight">${esc(i.text)}${i.mood ? ` <button class="linkbtn small" type="button" data-mood="${i.mood}" data-pc="${i.pc}">Open it</button>` : ''}</p>`,
      )
      .join('')}</div>
  </section>`;
}

/* ---------- the map ---------- */
function byMood(openMood) {
  return MOOD_FAMILIES.map(f => {
    const moods = MOODS.filter(m => m.fam === f.id);
    const row = m => {
      const c = moodCounts(m.id);
      return `<div class="moodrow">
        <div class="row between">
          <button type="button" class="linkbtn moodname" data-about="${m.id}"><b>${esc(m.n)}</b></button>
          <span class="small">${moodOwned(m.id) ? '<span class="pill ok">yours</span> ' : ''}${c.solid ? `${c.solid} solid` : c.met + c.comfortable ? `${c.met + c.comfortable} met` : ''}</span>
        </div>
        <span class="small">${esc(m.feel)}</span>
        <div class="keydots">${PCS.map(pc => keyDot(m.id, pc)).join('')}</div>
      </div>`;
    };
    const open = moods.some(m => m.id === openMood);
    return `<details class="family" ${open ? 'open' : ''}>
      <summary><b>${esc(f.n)}</b> <span class="small">${moods.map(m => m.n).join(', ')}</span></summary>
      ${moods.map(row).join('')}
    </details>`;
  }).join('');
}

function moodPicker(mood) {
  return `<label class="field">Mood<select class="input sm" id="mhMood">${MOODS.map(
    m => `<option value="${m.id}" ${m.id === mood ? 'selected' : ''}>${esc(m.n)}</option>`,
  ).join('')}</select></label>`;
}

function byShape(mood) {
  const groups = handShapes(mood);
  return `${moodPicker(mood)}
    <p class="small">Keys whose right hand uses the same fingers. Learn one, and the others in its group
      come quickly.</p>
    ${groups
      .map(
        g => `<div class="shape">
          <span class="small mono">Right hand ${g.fingers.split('').join(' ')}</span>
          <div class="keydots">${g.pcs.map(pc => keyDot(mood, pc)).join('')}</div>
        </div>`,
      )
      .join('')}`;
}

function byNeighbor(mood) {
  const pcsOf = pc => new Set(moodScale(mood, pc).map(n => ((midiOf(n) % 12) + 12) % 12));
  const changes = CIRCLE.map((pc, i) => {
    if (!i) return '';
    const before = pcsOf(CIRCLE[i - 1]);
    const added = moodScale(mood, pc).filter(n => !before.has(((midiOf(n) % 12) + 12) % 12));
    return added.map(n => 'CDEFGAB'[n.l] + (n.a > 0 ? '♯' : n.a < 0 ? '♭' : '')).join(' ');
  });
  return `${moodPicker(mood)}
    <p class="small">Around the circle of fifths: each key is one note different from the one before
      (shown under it). The easiest way to hear what a single note changes.</p>
    <div class="circle">${CIRCLE.map(
      (pc, i) =>
        `<div class="cstep">${keyDot(mood, pc)}<span class="small mono">${i ? '+' + esc(changes[i]) : 'start'}</span></div>`,
    ).join('')}</div>`;
}

function mapCard(openMood) {
  const p = prefs();
  const way = p.browse || 'mood';
  const mood = p.mood && MOOD_BY[p.mood] ? p.mood : openMood;
  return `<section class="card" id="mhMap">
    <div class="row between"><h2 class="h2">Moods</h2>
      <span class="small legend"><i class="keydot met"></i>met <i class="keydot comfortable"></i>comfortable <i class="keydot solid"></i>solid</span></div>
    ${seg(
      'mhWay',
      [
        ['mood', 'By mood'],
        ['shape', 'By hand shape'],
        ['neighbor', 'By neighbor'],
      ],
      way,
    )}
    <div id="mhWayBody">${way === 'shape' ? byShape(mood) : way === 'neighbor' ? byNeighbor(mood) : byMood(openMood)}</div>
  </section>`;
}

/* ---------- trajectory ---------- */
function trajectoryCard() {
  if (!Store.s.moods.sittings.length && !Object.keys(Store.s.moods.keys).length)
    return `<section class="card"><b class="h2">Your trajectory</b>
      <p class="small">After a few sittings, this shows the keys you have made solid, the moods that are
        yours, and how much you played each week.</p></section>`;
  const weeks = trajectory(12);
  const max = Math.max(30, ...weeks.map(w => w.min));
  const solid = weeks[weeks.length - 1].solid;
  const owned = MOODS.filter(m => moodOwned(m.id)).length;
  const sittings = Store.s.moods.sittings.filter(s => s.d > addDays(todayKey(), -28)).length;
  return `<button type="button" class="card trajcard" id="mhTraj">
    <div class="row between"><b class="h2">Your trajectory</b><span class="small">history ›</span></div>
    <div class="stats">
      <div class="stat"><b>${solid}</b><span>keys solid</span></div>
      <div class="stat"><b>${owned}</b><span>moods yours</span></div>
      <div class="stat"><b>${sittings}</b><span>sittings in 4 weeks</span></div>
    </div>
    <div class="minibars wide" aria-label="Minutes played per week, last 12 weeks">${weeks
      .map(
        w =>
          `<i class="${w.min < 1 ? 'zero' : ''}" style="height:${Math.max(3, (w.min / max) * 40)}px" title="Week to ${w.end}: ${w.min} min"></i>`,
      )
      .join('')}</div>
    <span class="small">Minutes per week, last 12 weeks</span>
  </button>`;
}

/* ---------- ear: which mood? ---------- */
function earCard() {
  const e = Store.s.moods.ear;
  return `<section class="card pathcard">
    <div class="grow"><b>Which mood?</b>
      <span class="small">${e.n ? `${e.right} of ${e.n} right. ` : ''}Hear a phrase, name its mood: the ear half of knowing a scale.</span></div>
    <button class="btn sm" type="button" id="mhEar">Listen</button>
  </section>`;
}

function earSheet() {
  const e = Store.s.moods.ear;
  let round = null;
  let answered = false;
  const play = () => {
    AudioEngine.ensure();
    AudioEngine.stopAll();
    const t0 = AudioEngine.now() + 0.1;
    earPhrase(round.mood, round.pc).forEach(n => AudioEngine.note(n.m, t0 + n.t, n.d, n.v));
  };
  const next = () => {
    round = earRound(e.by);
    answered = false;
    paint();
    play();
  };
  const paint = () => {
    const body = $('#earBody');
    if (!body) return;
    body.innerHTML = `
      <div class="row"><button class="btn" type="button" id="earAgain">Hear it again</button>
        <span class="small">${e.n ? `${e.right} of ${e.n} right` : ''}</span></div>
      <div class="earopts">${round.options
        .map(id => `<button class="btn" type="button" data-ear="${id}">${esc(MOOD_BY[id].n)}</button>`)
        .join('')}</div>
      <p id="earSay" class="small"></p>`;
    $('#earAgain', body).onclick = play;
    body.querySelectorAll('[data-ear]').forEach(b => {
      b.onclick = () => {
        if (answered) return;
        answered = true;
        const right = b.dataset.ear === round.mood;
        const R = MOOD_BY[round.mood];
        const c = colorNote(round.mood, round.pc);
        e.n++;
        if (right) e.right++;
        const by = e.by[round.mood] || [0, 0];
        e.by[round.mood] = [by[0] + 1, by[1] + (right ? 1 : 0)];
        Store.save();
        b.classList.add(right ? 'ok' : 'bad');
        body.querySelector(`[data-ear="${round.mood}"]`).classList.add('ok');
        $('#earSay', body).innerHTML =
          `${right ? 'Yes' : 'No'}: ${esc(moodName(round.mood, round.pc))}, ${esc(R.feel)}.
          The giveaway is ${esc(c.what)} (${esc(c.name)}), held near the end.
          <button class="btn sm cover" type="button" id="earNext">Next</button>`;
        $('#earNext', body).onclick = next;
      };
    });
  };
  openSheet(
    `<div class="sheethead"><h2 class="h2">Which mood?</h2>${closeBtn}</div>
     <p class="small">The mood's chords with its scale rising over them, then its color note and home.</p>
     <div id="earBody" class="stack"></div>`,
    next,
    { label: 'Which mood?' },
  );
}

function courseCard() {
  return `<section class="card pathcard">
    <div class="grow"><b>Also in DaCapo: the full course</b>
      <span class="small">Daily sessions across note reading, sight-reading, technique, theory, pieces and
        improvising, with spaced reviews.</span></div>
    <button class="btn sm" type="button" id="mhCourse">Switch to the full course</button>
  </section>`;
}

function moodsHome(page, head) {
  const next = suggestNext();
  page.innerHTML = `<div id="mhRoot" class="stack" style="gap:16px">
    ${head}
    <div class="homegrid">
      <div class="stack" style="gap:16px">${pickupCard()}${insightsCard()}${trajectoryCard()}</div>
      <div class="stack" style="gap:16px">${mapCard(next.mood)}${earCard()}${courseCard()}</div>
    </div></div>`;
  // (the listener goes on this render's own root, so it is never added twice)
  const root = $('#mhRoot', page);
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-mood][data-pc]');
    if (b) go('mood', { mood: b.dataset.mood, pc: +b.dataset.pc });
    const a = e.target.closest('[data-about]');
    if (a) aboutMood(a.dataset.about);
  });
  bindSegs(root, {
    mhWay: v => {
      prefs().browse = v;
      Store.save();
      $('#mhWayBody', page).innerHTML =
        v === 'shape'
          ? byShape(prefs().mood || next.mood)
          : v === 'neighbor'
            ? byNeighbor(prefs().mood || next.mood)
            : byMood(next.mood);
      bindPicker();
    },
  });
  const bindPicker = () => {
    const sel = $('#mhMood', page);
    if (sel)
      sel.onchange = () => {
        prefs().mood = sel.value;
        Store.save();
        const v = prefs().browse;
        $('#mhWayBody', page).innerHTML = v === 'shape' ? byShape(sel.value) : byNeighbor(sel.value);
        bindPicker();
      };
  };
  bindPicker();
  const traj = $('#mhTraj', page);
  if (traj) traj.onclick = progressSheet;
  $('#mhEar', page).onclick = earSheet;
  $('#mhCourse', page).onclick = () => {

     Your week      minutes and days played; tap for the full history
   Practicing happens on the Practice screen, which Home opens. */

const homeView = page => {
  if (!Store.s.profile.onboarded) return drawWelcome(page);
  const head = `
    <div class="homehead">
      <span class="eyebrow">${esc(new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }))}</span>
      <h1 class="h1">${greeting()}</h1>

    ${connectNotice()}`;
  if (Store.s.path !== 'course') {
