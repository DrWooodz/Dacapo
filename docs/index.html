/* The problem report: describe what happened and send it with the diagnostic log. */

function reportSheet(prefill = '') {
  const hint = IN_CLAUDE
    ? 'Send stores the report with this app so Claude can read it when you ask.'
    : 'Then paste it (or attach the file) in your conversation with Claude.';
  openSheet(
    `<div class="sheethead"><h2 class="h2">Report a problem</h2>${closeBtn}</div>
    <p class="small">Describe what happened and what you expected. The diagnostic log (what the app did,
      any errors, your device and browser, no personal data) is attached so the problem can be found.</p>
    <label class="field">What happened?<textarea class="input" id="rpText"
      placeholder="For example: I played the first note of the scale and nothing happened after the count-in…"
      >${esc(prefill)}</textarea></label>
    <label class="toggle">
      <input type="checkbox" id="rpLog" checked>
      <span><b>Attach the diagnostic log</b>
        <span class="small">${Log.buf.length} events, ${Log.errCount} errors this visit</span></span>
    </label>
    <div class="row">
      ${IN_CLAUDE ? '<button class="btn cover" type="button" id="rpSend">Send to Claude</button>' : ''}
      <button class="btn ${IN_CLAUDE ? '' : 'cover'}" type="button" id="rpCopy">Copy report</button>
      <button class="btn" type="button" id="rpSave">Save as file</button>
    </div>
    <p class="small" id="rpHint">${hint}</p>
    <details>
      <summary>Saved reports and log</summary>
      <div class="stack">
        <div id="rpSaved" class="small"></div>
        <div class="row"><button class="btn sm ghost" type="button" id="rpClear">Clear the log</button></div>
      </div>
    </details>`,
    sheet => {
      const text = () => Log.report($('#rpText', sheet).value, $('#rpLog', sheet).checked);
      const keep = rep => {
        try {
          const l = JSON.parse(localStorage.getItem('dacapo.reports') || '[]');
          l.unshift({ t: Date.now(), note: $('#rpText', sheet).value.slice(0, 200), size: rep.length });
          localStorage.setItem('dacapo.reports', JSON.stringify(l.slice(0, 10)));
        } catch (e) {}
      };
      const paintSaved = () => {
        let l = [];
        try {
          l = JSON.parse(localStorage.getItem('dacapo.reports') || '[]');
        } catch (e) {}
        $('#rpSaved', sheet).innerHTML = l.length
          ? l
              .map(x => `<div>${new Date(x.t).toLocaleString()} · ${esc(x.note || '(no description)')}</div>`)
              .join('')
          : 'No reports made yet.';
      };
      paintSaved();
      Log.ev('report opened');
      $('#rpCopy', sheet).onclick = async () => {
        const rep = text();
        Log.ev('report copied', { size: rep.length });
        try {
          await navigator.clipboard.writeText(rep);
          toast('Report copied. Paste it to Claude.');
          keep(rep);
          paintSaved();
        } catch (e) {
          const ta = document.createElement('textarea');
          ta.value = rep;
          ta.className = 'input';
          ta.style.minHeight = '160px';
          $('#rpHint', sheet).replaceWith(ta);
          ta.select();
          toast('Select all and copy the text below.');
        }
      };
      $('#rpSave', sheet).onclick = async () => {
        const rep = text();
        Log.ev('report saved as file');
        const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
        if (await saveFile(`dacapo-report-${stamp}.txt`, rep, 'text/plain')) {
          keep(rep);
          paintSaved();
        }
      };
      const send = $('#rpSend', sheet);
      if (send)
        send.onclick = async () => {
          const rep = text();
          try {
            if (!Store.db || !Store.uid) throw new Error('storage unavailable');
            const id = 'report-' + Date.now().toString(36);
            await Store.db.doc('data/users/' + Store.uid + '/' + id).set({
              text: rep.slice(0, 200000),
              at: Date.now(),
              note: $('#rpText', sheet).value.slice(0, 500),
              version: APP_VERSION,
            });
            Log.ev('report sent', { id });
            keep(rep);
            paintSaved();
            toast('Report sent. Ask Claude to read your DaCapo reports.');
            closeSheet();
          } catch (e) {
            Log.warn('report send failed', String((e && e.message) || e));
            toast('Could not send; use Copy instead.');
          }
        };
      $('#rpClear', sheet).onclick = () => {
        Log.clear();
        toast('Log cleared');
        closeSheet();
      };
    },
    { label: 'Report a problem' },
  );
}

function skillRow(sk) {
  const off = sk.area && !areaOn(sk.area);

  const pct = level == null ? 0 : (level / MAX_LEVEL) * 100;
  const value = off ? 'Off' : level == null ? 'Not measured yet' : `${level.toFixed(1)} · ${tierName(level)}`;
  const trendTxt = trend
    ? `<span class="trend ${trend > 0 ? 'up' : 'down'}">${trend > 0 ? '▲' : '▼'} ${Math.abs(trend)}</span>`
    : '';
  const detail = off ? '' : skillDetail(sk.id);
  const clickable = sk.id !== 'steadiness';
  return `<${clickable ? 'button type="button"' : 'div'} class="skillrow${off ? ' off' : ''}" role="listitem"

// ---- views/jam.js ----
/* Jam: a loop station. Pick a beat, record a layer on the piano (or on the screen), record another on top,
   and keep going. Sketches stay on this device, and save as a MIDI file for any music program. */

/* ---------- sketches, kept on this device (and in backup files) ---------- */
const CURRENT = 'dacapo.jam'; // the sketch on the Jam screen
const LIST = 'dacapo.sketches';
const MAX_SKETCHES = 20;

const Sketches = {
  read(key, fallback) {
    try {
      return JSON.parse(localStorage.getItem(key)) ?? fallback;
    } catch (e) {
      return fallback;
    }
  },
  write(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      Log.warn('sketch not saved', String(e));
      return false;
    }
  },
  list() {
    const l = this.read(LIST, []);
    return Array.isArray(l) ? l : [];
  },
  current() {
    return cleanLoop(this.read(CURRENT, null));
  },
  keep(L) {
    this.write(CURRENT, L);
  },
  save(L) {
    const l = this.list().filter(x => x.id !== L.id);
    l.unshift({ ...L, saved: Date.now() });
    if (!this.write(LIST, l.slice(0, MAX_SKETCHES))) toast('This browser is full; the sketch was not saved.');
  },
  remove(id) {
    this.write(
      LIST,
      this.list().filter(x => x.id !== id),
    );
  },
  // restoring a backup: sketches from the file are added to the ones here
  merge(list) {
    if (!Array.isArray(list)) return;
    const have = new Set(this.list().map(x => x.id));
    this.write(
      LIST,
      [...this.list(), ...list.filter(x => x && x.id && !have.has(x.id))].slice(0, MAX_SKETCHES),
    );
  },
};

const SOUND_CHOICES = [...SOUNDS.map(s => [s.id, s.n]), ['drums', 'Drum pads']];
const soundName = id => (id === 'drums' ? 'Drums' : SOUND_BY[id].n);

/* ---------- the screen ---------- */
function drawJam(body) {
  const L = Sketches.current();
  const ui = { sound: 'piano', play: 'keys', raf: 0 };
  const keep = () => Sketches.keep(L);
  if (!Transport.playing) Transport.L = L;
  // the screen keys play the sound you record with
  Input.touchSound = {
    on: (m, vel) => Sounds.start(ui.sound === 'drums' ? 'piano' : ui.sound, m, vel),
    off: h => Sounds.stop(h),
  };

  body.innerHTML = `
    <div class="card jam">
      <div class="row between">
        <div class="row">
          <button class="btn cover" type="button" id="jPlay">Play</button>
          <button class="btn rec" type="button" id="jRec" aria-pressed="false">Record</button>
        </div>
        <div class="row tempo">
          <button class="btn sm" type="button" data-bpm="-5" aria-label="Slower">−</button>
          <b class="mono" id="jBpm"></b>
          <button class="btn sm" type="button" data-bpm="5" aria-label="Faster">+</button>
        </div>
      </div>
      <div class="jam-bar" id="jBar" aria-hidden="true"></div>
      <div class="small" id="jMsg" aria-live="polite"></div>
      <div class="stack" style="gap:6px">
        <span class="small">Record with</span>
        <div class="chips" id="jSounds"></div>
      </div>
      <details class="jam-more">
        <summary class="small">Loop settings</summary>
        <div class="stack" style="gap:10px;margin-top:10px">
          <div class="row"><span class="small">Bars</span>${seg(
            'jBars',
            [1, 2, 4, 8].map(n => [n, n]),
            L.bars,
          )}</div>
          <div class="row"><span class="small">Meter</span>${seg(
            'jMeter',
            [
              [4, '4/4'],
              [3, '3/4'],
            ],
            L.beats,
          )}</div>
          <label class="row"><span class="small">Swing</span>
            <input type="range" id="jSwing" min="50" max="75" value="${Math.round(L.swing * 100)}"></label>
          <label class="toggle"><input type="checkbox" id="jClick" ${L.click ? 'checked' : ''}>
            <span><b>Click</b><span class="small">A metronome with the loop (there is always one bar of
              count-in before recording from a stop).</span></span></label>
        </div>
      </details>
    </div>

    <div class="card">
      <div class="cardhead"><h2 class="h2">Drums</h2><span class="small">One bar, repeated</span></div>
      <div class="chips" id="jBeats"></div>
      <div class="drumgrid scrollx" id="jGrid"></div>
    </div>

    <div class="card">
      <div class="cardhead"><h2 class="h2">Layers</h2><span class="small" id="jCount"></span></div>
      <div class="stack" style="gap:0" id="jLayers"></div>
      <div class="row">
        <button class="btn sm ghost" type="button" id="jUndo">Undo last layer</button>
        <button class="btn sm ghost" type="button" id="jClear">Clear all</button>
      </div>
    </div>

    <div class="card">
      <div class="cardhead">
        <h2 class="h2">Play here</h2>
        ${seg(
          'jPlayOn',
          [
            ['keys', 'Keys'],
            ['pads', 'Drum pads'],
          ],
          ui.play,
        )}
      </div>
      <div id="jHere"></div>
    </div>

    <div class="card">
      <div class="cardhead"><h2 class="h2">Sketches</h2></div>
      <div class="row">
        <input class="input" id="jName" placeholder="Name this sketch" maxlength="40" value="${esc(L.name)}">
      </div>
      <div class="row">
        <button class="btn sm cover" type="button" id="jSave">Save</button>
        <button class="btn sm" type="button" id="jMidi">Save as MIDI file</button>
        <button class="btn sm ghost" type="button" id="jOpen">Open…</button>
        <button class="btn sm ghost" type="button" id="jNew">New</button>
      </div>
      <p class="small">A MIDI file opens in any music program (GarageBand, FL Studio, MuseScore…) with
        each layer on its own track, played four times.${IN_CLAUDE ? ' The Claude app cannot save MIDI files: open DaCapo in your browser for that.' : ''}</p>
    </div>`;

  /* ---------- painting ---------- */
  const msg = t => ($('#jMsg', body).textContent = t);
  function paintTransport() {
    $('#jBpm', body).textContent = `♩ ${L.bpm}`;
    const play = $('#jPlay', body);
    play.textContent = Transport.playing ? 'Stop' : 'Play';
    const rec = $('#jRec', body);
    const on = !!(Transport.armed || Transport.rec);
    rec.setAttribute('aria-pressed', String(on));
    rec.textContent = Transport.rec ? 'Recording' : Transport.armed ? 'Waiting…' : 'Record';
    rec.disabled = L.layers.length >= MAX_LAYERS && !on;
    $('#jSounds', body).innerHTML = SOUND_CHOICES.map(
      ([id, n]) =>
        `<button type="button" class="chip" data-sound="${id}" aria-pressed="${ui.sound === id}">${esc(n)}</button>`,
    ).join('');
    $$('[data-sound]', body).forEach(b => {
      b.onclick = () => {
        ui.sound = b.dataset.sound;
        if (ui.sound === 'drums' && ui.play !== 'pads') setPlayOn('pads');
        paintTransport();
      };
    });
  }
  function paintBar() {
    const n = L.bars;
    const ticks = Array.from(
      { length: n * L.beats },
      (_, i) => `<i class="${i % L.beats ? '' : 'bar'}"></i>`,
    );
    $('#jBar', body).innerHTML = `${ticks.join('')}<b id="jHead"></b>`;
  }
  function paintBeats() {
    $('#jBeats', body).innerHTML = BEATS.filter(b => b.beats === L.beats || b.id === 'none')
      .map(
        b =>
          `<button type="button" class="chip" data-beat="${b.id}" aria-pressed="${L.beat === b.id}">${esc(b.n)}</button>`,
      )
      .join('');
    $$('[data-beat]', body).forEach(b => {
      b.onclick = () => {
        const B = BEAT_BY[b.dataset.beat];
        L.beat = B.id;
        L.drums = beatPattern(B.id);
        L.swing = B.swing;
        $('#jSwing', body).value = Math.round(L.swing * 100);
        changed();
        paintBeats();
        paintGrid();
      };
    });
  }
  function paintGrid() {
    const n = stepsPerBar(L);
    const cell = (d, i) => {
      const v = L.drums[d.id][i];
      return `<button type="button" class="cell${i % 4 ? '' : ' beat'}${v ? (v > 0.6 ? ' on' : ' soft') : ''}"
        data-d="${d.id}" data-i="${i}" aria-label="${esc(d.n)}, step ${i + 1}" aria-pressed="${!!v}"></button>`;
    };
    $('#jGrid', body).innerHTML = DRUMS.map(
      d => `<div class="drumrow"><span class="small">${esc(d.n)}</span>
        <div class="cells" style="--n:${n}">${Array.from({ length: n }, (_, i) => cell(d, i)).join('')}</div></div>`,
    ).join('');
    $$('#jGrid .cell', body).forEach(c => {
      c.onclick = () => {
        const row = L.drums[c.dataset.d];
        const i = +c.dataset.i;
        // off → on → soft → off
        row[i] = row[i] === 0 ? 0.9 : row[i] > 0.6 ? 0.45 : 0;
        if (row[i]) Sounds.drum(c.dataset.d, AudioEngine.ensure().currentTime, row[i]);
        L.beat = 'custom';
        changed();
        paintGrid();
        paintBeats();
      };
    });
  }
  function paintLayers() {
    $('#jCount', body).textContent = `${L.layers.length} of ${MAX_LAYERS}`;
    const len = loopBeats(L);
    const past = layer => layer.notes.filter(x => x.b >= len).length;
    const roll = layer => {
      const ms = layer.notes.map(x => x.m);
      const lo = Math.min(...ms);
      const span = Math.max(12, Math.max(...ms) - lo + 1);
      const bars = Array.from({ length: L.bars - 1 }, (_, i) => {
        const x = ((i + 1) * L.beats * 100) / len;
        return `<line x1="${x}" x2="${x}" y1="0" y2="24" class="barline"/>`;
      }).join('');
      const notes = layer.notes
        .filter(x => x.b < len)
        .map(x => {
          const y = 22 - ((x.m - lo) / span) * 20;
          return `<rect x="${((x.b / len) * 100).toFixed(2)}" y="${y.toFixed(1)}" width="${Math.max(0.6, (x.d / len) * 100).toFixed(2)}" height="2.2" rx="0.8"/>`;
        })
        .join('');
      return `<svg class="layer-roll" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true">${bars}${notes}</svg>`;
    };
    const row = (layer, k) => `
      <div class="listrow layer${layer.mute ? ' muted' : ''}">
        <div class="grow">
          <div class="row between">
            <b>${k + 1}. ${esc(soundName(layer.sound))}</b>
            <span class="small">${layer.notes.length} notes${past(layer) ? ` · ${past(layer)} past the end of the loop` : ''}</span>
          </div>
          ${roll(layer)}
          <div class="row">
            ${layer.sound === 'drums' ? '' : `<select class="input sm" data-lsound="${k}" aria-label="Sound">${SOUNDS.map(s => `<option value="${s.id}" ${s.id === layer.sound ? 'selected' : ''}>${esc(s.n)}</option>`).join('')}</select>`}
            <select class="input sm" data-lgrid="${k}" aria-label="Snap to grid">${GRIDS.map(([id, n]) => `<option value="${id}" ${id === layer.grid ? 'selected' : ''}>Snap: ${esc(n)}</option>`).join('')}</select>
            <button class="btn sm ghost" type="button" data-lmute="${k}" aria-pressed="${layer.mute}">${layer.mute ? 'Unmute' : 'Mute'}</button>
            <button class="btn sm ghost" type="button" data-ldel="${k}" aria-label="Delete layer ${k + 1}">Delete</button>
          </div>
        </div>
      </div>`;
    $('#jLayers', body).innerHTML = L.layers.length
      ? L.layers.map(row).join('')
      : `<p class="small">No layers yet. Press Record and play: one pass of the loop becomes a layer.
          Then record another on top.</p>`;
    $$('[data-lsound]', body).forEach(s => {
      s.onchange = () => {
        L.layers[+s.dataset.lsound].sound = s.value;
        changed();
      };
    });
    $$('[data-lgrid]', body).forEach(s => {
      s.onchange = () => {
        L.layers[+s.dataset.lgrid].grid = s.value;
        changed();
      };
    });
    $$('[data-lmute]', body).forEach(b => {
      b.onclick = () => {
        const layer = L.layers[+b.dataset.lmute];
        layer.mute = !layer.mute;
        changed();
        paintLayers();
      };
    });
    $$('[data-ldel]', body).forEach(b => {
      b.onclick = () => {
        L.layers.splice(+b.dataset.ldel, 1);
        changed();
        paintLayers();
        paintTransport();
      };
    });
    $('#jUndo', body).disabled = !L.layers.length;
    $('#jClear', body).disabled = !L.layers.length;
  }
  function setPlayOn(v) {
    ui.play = v;
    $$('[data-seg="jPlayOn"] [data-v]', body).forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.v === v)),
    );
    paintHere();
  }
  function paintHere() {
    const here = $('#jHere', body);
    if (ui.play === 'keys') {
      here.innerHTML = `<div class="kbwrap scrollx">${kbSVG({ from: 48, to: 76, h: 120 })}</div>
        <p class="small">Or play your piano: everything you play is recorded while Record is on.</p>`;
      return;
    }
    here.innerHTML = `<div class="pads">${DRUMS.map(d => `<button type="button" class="pad" data-pad="${d.gm}">${esc(d.n)}</button>`).join('')}</div>
      <p class="small">Choose "Drum pads" under Record with, then tap along to record a drum layer.</p>`;
    $$('[data-pad]', here).forEach(p => {
      p.addEventListener('pointerdown', e => {
        e.preventDefault();
        Transport.pad(+p.dataset.pad);
        p.classList.add('hit');
        setTimeout(() => p.classList.remove('hit'), 90);
      });
    });
  }
  // the playhead: where the loop is, as you hear it
  function animate() {
    const head = $('#jHead', body);
    const pos = Transport.position();
    if (head) {
      head.hidden = !pos || pos.beat < 0;
      if (pos && pos.beat >= 0) head.style.left = `${(pos.inLoop / loopBeats(L)) * 100}%`;
    }
    if (pos && pos.beat < 0) msg(`Count-in: ${Math.ceil(-pos.beat)}`);
    ui.raf = requestAnimationFrame(animate);
  }

  function changed() {
    Transport.changed();
    keep();
  }

  /* ---------- controls ---------- */
  $('#jPlay', body).onclick = () => {
    AudioEngine.ensure();
    if (Transport.playing) Transport.stop();
    else Transport.play(L);
    paintTransport();
  };
  $('#jRec', body).onclick = () => {
    AudioEngine.ensure();
    if (Transport.armed || Transport.rec) {
      Transport.disarm();
      msg('Recording cancelled.');
      return paintTransport();
    }
    if (!Transport.playing) {
      Transport.play(L, { countIn: L.beats });
      msg('One bar of count-in, then play.');
    } else msg('Recording starts at the top of the loop.');
    Transport.arm(ui.sound);
    paintTransport();
  };
  $$('[data-bpm]', body).forEach(b => {
    b.onclick = () => {
      Transport.setTempo(clamp(L.bpm + +b.dataset.bpm, 40, 200));
      keep();
      paintTransport();
    };
  });
  bindSegs(body, {
    jBars: v => {
      L.bars = +v;
      changed();
      paintBar();
      paintLayers();
    },
    jMeter: v => {
      setMeter(L, +v);
      L.beat = 'custom';
      changed();
      paintBar();
      paintBeats();
      paintGrid();
      paintLayers();
    },
    jPlayOn: v => setPlayOn(v),
  });
  $('#jSwing', body).oninput = e => {
    L.swing = +e.target.value / 100;
    changed();
  };
  $('#jClick', body).onchange = e => {
    L.click = e.target.checked;
    keep();
  };
  $('#jUndo', body).onclick = () => {
    L.layers.pop();
    changed();
    paintLayers();
    paintTransport();
  };
  $('#jClear', body).onclick = () => {
    const before = L.layers.slice();
    L.layers = [];
    changed();
    paintLayers();
    paintTransport();
    toast('Layers cleared', 6000, {
      label: 'Undo',
      run: () => {
        L.layers = before;
        changed();
        paintLayers();
        paintTransport();
      },
    });
  };
  $('#jName', body).oninput = e => {
    L.name = e.target.value.trim();
    keep();
  };
  $('#jSave', body).onclick = () => {
    if (!L.name) L.name = `Sketch ${new Date().toLocaleDateString()}`;
    $('#jName', body).value = L.name;
    Sketches.save(L);
    keep();
    toast('Sketch saved');
  };
  $('#jMidi', body).onclick = () => {
    if (!L.layers.length && !DRUMS.some(d => L.drums[d.id].some(Boolean)))
      return toast('Nothing to save yet: add a beat or record a layer.');
    const file = (L.name || 'dacapo-sketch').replace(/[^\w-]+/g, '-').toLowerCase();
    saveFile(`${file}.mid`, loopToMidi(L), 'audio/midi');
  };
  $('#jOpen', body).onclick = () => openSketchSheet(load);
  $('#jNew', body).onclick = () => {
    const had = L.layers.length > 0;
    if (had) Sketches.save(L.name ? L : { ...L, name: `Sketch ${new Date().toLocaleDateString()}` });
    load(newLoop());
    toast(had ? 'Started a new sketch; the last one was saved.' : 'New sketch');
  };
  // replace the loop on screen (the same object, so the transport and handlers keep it)
  function load(next) {
    Transport.stop();
    Object.keys(L).forEach(k => delete L[k]);
    Object.assign(L, cleanLoop(next));
    Transport.L = L;
    keep();
    $('#jName', body).value = L.name;
    $('#jSwing', body).value = Math.round(L.swing * 100);
    $('#jClick', body).checked = L.click;
    $$('[data-seg="jBars"] [data-v]', body).forEach(b =>
      b.setAttribute('aria-pressed', String(+b.dataset.v === L.bars)),
    );
    $$('[data-seg="jMeter"] [data-v]', body).forEach(b =>
      b.setAttribute('aria-pressed', String(+b.dataset.v === L.beats)),
    );
    paintAll();
  }

  const offT = Transport.on((kind, data) => {
    if (kind === 'recording')
      msg(`Recording ${soundName(Transport.rec.sound).toLowerCase()}: one pass of the loop.`);
    else if (kind === 'recorded') {
      msg(
        data
          ? `Layer ${L.layers.length} recorded. Record another on top, or listen.`
          : 'Nothing was played; no layer added.',
      );
      keep();
      paintLayers();
    } else if (kind === 'stop') msg('');
    paintTransport();
  });

  function paintAll() {
    paintTransport();
    paintBar();
    paintBeats();
    paintGrid();
    paintLayers();
    paintHere();
  }
  paintAll();
  animate();
  msg('Choose a beat (or none), then press Record and play.');

  return () => {
    cancelAnimationFrame(ui.raf);
    offT();
    Transport.stop(true);
    Input.touchSound = null;
    keep();
  };
}

function openSketchSheet(onOpen) {
  const list = Sketches.list();
  const when = t => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  const row = x => `<div class="listrow">
      <div class="grow">
        <div class="ttl">${esc(x.name || 'Untitled')}</div>
        <div class="small">${when(x.saved)} · ${(x.layers || []).length} layers · ♩ ${x.bpm}</div>
      </div>
      <button class="btn sm" type="button" data-open="${esc(x.id)}">Open</button>
      <button class="btn sm ghost" type="button" data-del="${esc(x.id)}" aria-label="Delete">Delete</button>
    </div>`;
  openSheet(
    `<div class="sheethead"><h2 class="h2">Your sketches</h2>${closeBtn}</div>
     <div class="stack" style="gap:0">${list.length ? list.map(row).join('') : '<p class="small">No saved sketches yet.</p>'}</div>
     <p class="small">Sketches are kept on this device, and in backup files.</p>`,
    sheet => {
      $$('[data-open]', sheet).forEach(b => {
        b.onclick = () => {
          const x = Sketches.list().find(s => s.id === b.dataset.open);
          closeSheet();
          if (x) onOpen(x);
        };
      });
      $$('[data-del]', sheet).forEach(b => {
        b.onclick = () => {
          Sketches.remove(b.dataset.del);
          openSketchSheet(onOpen);
        };
      });
    },
    { label: 'Your sketches' },
  );
}

/* Settings, backups and the About panel. */

function settingsSheet() {
  const S = Store.s.settings;
  const P = Store.s.profile;
  const toggle = (id, on, label, hint = '') => `
    <label class="toggle">
      <input type="checkbox" id="${id}" ${on ? 'checked' : ''}>
      <span><b>${label}</b>${hint ? `<span class="small">${hint}</span>` : ''}</span>
    </label>`;
  const modes = [
    ['midi', 'MIDI (USB)'],
    ['mic', 'Microphone'],
    ['touch', 'On-screen keys'],
  ];
  openSheet(
    `<div class="sheethead"><h2 class="h2">Settings</h2>${closeBtn}</div>
    <h3 class="h3">Your piano</h3>
    ${seg('sMode', modes, Input.mode)}
    <div id="sStatus" class="small"></div>
    <div class="prose small">
      <p><b>MIDI</b> hears exactly what you play: chords, timing, loudness, pedal. Use the piano's square
        "USB to Host" port with a data cable (USB-B to USB-C on a phone). Chrome or Edge on Android or a
        computer; iPhone and iPad browsers have no MIDI.</p>
      <p><b>Microphone</b> works with any piano but hears one note at a time, so chords and
        hands-together drills are practice only.</p>
      ${
        IN_CLAUDE
          ? `<p class="notice">Inside the Claude app, MIDI and the microphone are blocked. Open your hosted
               copy of DaCapo in Chrome to play with your piano; your progress syncs only within Claude.</p>`
          : ''
      }
    </div>
    <div id="sOut"></div>
    <button class="btn sm ghost" type="button" id="sGuide" style="align-self:flex-start">
      Guide to your piano →</button>
    <div class="divider"></div>
    <h3 class="h3">Areas</h3>
    <p class="small">Switch off an area you do not want to practice at all. For a lighter touch, choose
      another focus instead: everything else then gets only a few minutes of upkeep.</p>
    ${AREAS.map(a => toggle('ar_' + a.id, P.areas[a.id] !== false, a.n, a.d)).join('')}
    <div class="divider"></div>
    <h3 class="h3">Sound and screen</h3>
    ${toggle('sSnd', S.sound, 'App sounds', 'Examples, backing tracks and the Jam. The metronome always clicks.')}
    <label class="field">Volume<input type="range" id="sVol" min="0" max="1" step="0.05" value="${S.volume}"></label>
    ${toggle('sWake', S.keepAwake, 'Keep the screen on while practicing', 'Releases after 20 minutes without playing.')}
    ${toggle('sOct', S.octaveTolerant, 'Microphone: forgive octave mix-ups', 'Low piano notes are often heard an octave off.')}
    <div class="divider"></div>
    <h3 class="h3">Your data</h3>
    <p class="small">Progress is saved on this device${IN_CLAUDE ? ' and in your Claude account' : ''}.
      A backup file moves it to another device.</p>
    <div class="row">
      <button class="btn sm" type="button" id="sBackup">Save a backup file</button>
      <label class="btn sm" style="cursor:pointer">Restore from file<input type="file" id="sRestore"
        accept=".json,application/json" hidden></label>
    </div>
    <div class="divider"></div>
    <h3 class="h3">Help</h3>
    <div class="row">
      <button class="btn sm" type="button" id="sHow">How DaCapo works</button>
      <button class="btn sm" type="button" id="sBody">Body and hands</button>
      <button class="btn sm" type="button" id="sCheck">Placement check</button>
      <button class="btn sm" type="button" id="sReport">Report a problem</button>
      <button class="btn sm ghost" type="button" id="sAbout">About</button>
    </div>
    <details>
      <summary>Start over</summary>
      <div class="stack">
        <p class="small">Erases all progress on this device (save a backup first). Your imported files,
          recordings and Jam sketches stay.</p>
        <button class="btn sm bad" type="button" id="sReset">Erase my progress</button>
      </div>
    </details>
    <p class="small">DaCapo ${APP_VERSION} · ${BUILD}</p>`,
    sheet => {
      const status = () => {
        const connected = `<span class="tag ${Input.live ? 'ok' : ''}">${Input.live ? 'Connected' : 'Not connected'}</span>`;
        $('#sStatus', sheet).innerHTML = `${connected} ${esc(Input.lastErr || Input.status || '')}`;
        const o = $('#sOut', sheet);
        o.innerHTML =
          Input.mode === 'midi' && Input.live && MidiOut.port
            ? toggle(
                'sMidiOut',
                S.midiOut,
                "Play the app's sounds on the piano",
                "Examples and backing tracks come out of the piano's own speakers.",
              ) +
              toggle(
                'sClick',
                S.clickOnPiano,
                'Metronome on the piano too',
                "Uses the piano's drum sounds on channel 10 if it has them; otherwise leave this off.",
              )
            : '';
        const mo = $('#sMidiOut', sheet);
        if (mo)
          mo.onchange = e => {
            S.midiOut = e.target.checked;
            Store.save();
            Log.ev('midi out ' + S.midiOut);
          };
        const mc = $('#sClick', sheet);
        if (mc)
          mc.onchange = e => {
            S.clickOnPiano = e.target.checked;
            Store.save();
          };
      };
      status();
      let changed = false;
      bindSegs(sheet, {
        sMode: async v => {
          changed = true;
          AudioEngine.ensure();
          await Input.setMode(v);
          status();
        },
      });
      const offS = Store.on(k => {
        if (k === 'input') status();
      });
      $('#sGuide', sheet).onclick = pianoGuideSheet;
      AREAS.forEach(a => {
        $('#ar_' + a.id, sheet).onchange = e => {
          changed = true;
          P.areas[a.id] = e.target.checked;
          Log.ev('area ' + a.id + ' ' + e.target.checked);
          rebuildSession();
        };
      });
      $('#sSnd', sheet).onchange = e => {
        S.sound = e.target.checked;
        Store.save();
      };
      $('#sVol', sheet).oninput = e => {
        S.volume = +e.target.value;
        if (AudioEngine.master) AudioEngine.master.gain.value = S.volume;
      };
      $('#sVol', sheet).onchange = () => Store.save();
      $('#sWake', sheet).onchange = e => {
        S.keepAwake = e.target.checked;
        Store.save();
        if (!S.keepAwake) Wake.release();
      };
      $('#sOct', sheet).onchange = e => {
        S.octaveTolerant = e.target.checked;
        Store.save();
      };
      $('#sBackup', sheet).onclick = saveBackupFile;
      $('#sRestore', sheet).onchange = e => restoreFile(e.target.files[0]);
      $('#sHow', sheet).onclick = howSheet;
      $('#sBody', sheet).onclick = bodySheet;
      $('#sCheck', sheet).onclick = () => {
        closeSheet();
        go('assess');
      };
      $('#sReport', sheet).onclick = () => reportSheet();
      $('#sAbout', sheet).onclick = aboutSheet;
      $('#sReset', sheet).onclick = () => {
        if (!confirmTwice(sheet)) return;
        const keep = { settings: Store.s.settings, favorites: Store.s.profile.favorites };
        Store.s = DEFAULT_STATE();
        Store.s.settings = keep.settings;
        Store.s.profile.favorites = keep.favorites;
        Store.save();
        Log.ev('progress erased');
        closeSheet();
        go('practice');
        toast('Progress erased');
      };
      return () => {
        offS();
        if (changed && UI.view === 'practice') setTimeout(() => go('practice', UI.params), 0);
      };
    },
    { label: 'Settings' },
  );
}

function confirmTwice(sheet) {
  const b = $('#sReset', sheet);
  if (b.dataset.armed) return true;
  b.dataset.armed = '1';
  b.textContent = 'Tap again to erase';
  setTimeout(() => {
    if (b.isConnected) {
      delete b.dataset.armed;
      b.textContent = 'Erase my progress';
    }
  }, 4000);
  return false;
}

function saveBackupFile() {
  const data = JSON.stringify({
    dacapo: 4,
    state: Store.s,
    imports: Library.imports(),
    sketches: Sketches.list(),
  });
  saveFile(`dacapo-backup-${todayKey()}.json`, data);
}

function restoreFile(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      const st = o.state || o;
      if (!st || typeof st !== 'object' || !st.settings) throw new Error('This is not a DaCapo backup.');
      Store.s = migrate(st);
      Store.s.savedAt = Date.now();
      Store.save();
      if (Array.isArray(o.imports)) Library.saveImports(o.imports);
      Sketches.merge(o.sketches);
      Library.cache.clear();
      Store.emit(); // brings the restored items up to date (see app.js)
      Log.ev('restored backup', { v: st.v });
      closeSheet();
      go('practice');
      toast('Progress restored');
    } catch (e) {
      Log.warn('restore failed', String(e.message || e));
      toast(e.message || 'That file could not be read.');
    }
  };
  r.readAsText(file);
}

// ---- views/practice.js ----
/* Practice: open the app and today's session is already waiting. */

// active minutes per item per session, by kind of drill; upkeep and daily pieces get less
const TIMEBOX = {
  scale: 7,
  arp: 7,
  read: 6,
  rhythm: 4,
  section: 10,
  full: 14,
  pattern: 6,
  improv: 4,
  theory: 6,
};
const ROLE_BOX = { warm: 4, daily: 6 };
// how long the goal card waits before moving on by itself
const GOAL_WAIT_MS = 6000;

const isOpen = entry => entry.state !== 'done' && entry.state !== 'skipped';
const ROLE_PREFIX = { check: 'Check: ', review: 'Review: ', warm: 'Upkeep: ', daily: 'Daily: ' };

const practiceView = (page, params) => {
  let player = null;
  let tick = 0;
  let goalTimer = 0;
  const cleanup = () => {
    if (player) {
      player.destroy();
      player = null;
    }
    clearInterval(tick);
    clearTimeout(goalTimer);
  };
  onUnmount(cleanup);
  if (!Store.s.profile.onboarded) return drawWelcome();
  if (params.item) return drawExtra(params.item);
  const pieces = params.session === 'pieces';
  drawSession();

  // today's session, or the piece session you started
  function theSession() {
    if (pieces) {
      const s = Store.s.pieceSession;
      return s && s.day === todayKey() ? s : null;
    }
    return currentSession();
  }

  /* ---------- the session ---------- */
  function drawSession() {
    cleanup();
    const s = theSession();
    if (!s) return go('practice');
    const open = s.list.findIndex((e, i) => i >= s.idx && isOpen(e));
    if (open < 0 && s.list.length) return drawSummary(s);
    if (!s.list.length) return drawEmpty();
    s.idx = open;
    const e = s.list[s.idx];
    if (e.state === 'todo') {
      e.state = 'active';
      Store.save();
    }
    const mins = Math.round((Store.s.days[todayKey()] || {}).min || 0);
    const done = s.list.filter(x => x.state === 'done').length;
    const moreAfter = s.list.slice(s.idx + 1).some(isOpen);
    page.innerHTML = `
      ${pieces ? '' : focusBar() + placementOffer()}
      <section class="session">
        <div class="sess-top">
          <div class="grow">
            <b>${pieces ? `Piece session · ${s.minutes} min` : 'Today'}</b>
            <span class="small">· ${done} of ${s.list.length} done${mins ? ` · ${mins} min played` : ''}</span>
          </div>
          <button class="btn sm ghost" type="button" id="ssList">All</button>
        </div>
        <div class="sess-strip" id="ssStrip">${s.list.map((x, i) => stepChip(x, i, s.idx)).join('')}</div>
      </section>
      ${connectNotice()}
      <div id="plHost" style="position:relative"></div>
      <div class="sess-foot">
        <button class="btn sm ghost" type="button" id="ssSkip">Skip this</button>
        <button class="btn sm" type="button" id="ssNext">${moreAfter ? 'Next →' : 'Finish'}</button>
      </div>`;
    bindConnect();
    bindFocusBar();
    e.base = Activity.recent;
    e.goal = e.goal || false;
    player = Player.mount($('#plHost', page), {
      id: e.id,
      role: e.role === 'check' || e.role === 'review' ? e.role : 'focus',
      onEvent: ev => onPlayerEvent(s, e, ev),
    });
    tick = setInterval(
      Log.guard('session tick', () => {
        if (!e.goal && e.role !== 'check' && e.role !== 'review') checkTime(s, e);
      }),
      15000,
    );
    $('#ssSkip', page).onclick = () => {
      Log.ev('entry skipped', { id: e.id });
      e.state = 'skipped';
      advance(s);
    };
    $('#ssNext', page).onclick = () => {
      Log.ev('entry next', { id: e.id, goal: e.goal });
      e.state = e.reps ? 'done' : 'skipped';
      advance(s);
    };
    $('#ssList', page).onclick = () =>
      sessionSheet(s, i => {
        s.list[s.idx].state = s.list[s.idx].reps ? 'done' : 'todo';
        s.idx = i;
        s.list[i].state = 'active';
        Store.save();
        drawSession();
      });
  }

  // this week's focus: shown at the top; a new suggestion waits for a tap (but never blocks practice)
  function focusBar() {
    const f = currentFocus();
    if (!f) return '';
    const area = AREA_BY[f.area];
    if (f.confirmed)
      return `<div class="focusbar compact">
        <span class="small">This week's focus: <b>${esc(area.n)}</b></span>
        <button class="linkbtn" type="button" data-focus="change">Change</button>
      </div>`;
    return `<div class="focusbar card">
      <span class="eyebrow">This week's focus</span>
      <div class="row between">
        <div class="grow"><b class="h3">${esc(area.n)}</b><div class="small">${esc(f.reason || area.d)}</div></div>
      </div>
      <div class="row">
        <button class="btn sm cover" type="button" data-focus="keep">Sounds good</button>
        <button class="btn sm ghost" type="button" data-focus="change">Choose another</button>
      </div>
    </div>`;
  }
  function bindFocusBar() {
    $$('[data-focus]', page).forEach(b => {
      b.onclick = () => {
        if (b.dataset.focus === 'keep') {
          chooseFocus(currentFocus().area);
          return drawSession();
        }
        focusSheet(() => {
          rebuildSession();
          drawSession();
        });
      };
    });
    $$('[data-assess]', page).forEach(b => {
      b.onclick = () => {
        if (b.dataset.assess === 'go') return go('assess');
        Store.s.profile.assessDismissed = todayKey();
        Store.save();
        drawSession();
      };
    });
  }
  function placementOffer() {
    const P = Store.s.profile;
    if (P.assessed || P.assessDismissed) return '';
    return `<div class="card offer">
      <b>Find your starting points</b>
      <p class="small">An 8-minute check: a few notes to read in each clef, a scale, some chords and a steady
        pulse. It sets your skill levels so practice starts at the right place.</p>
      <div class="row">
        <button class="btn sm cover" type="button" data-assess="go">Start the check</button>
        <button class="btn sm ghost" type="button" data-assess="later">Not now</button>
      </div>
    </div>`;
  }

  function onPlayerEvent(s, e, ev) {
    if (ev.type === 'rep') {
      if (ev.r.valid) {
        e.reps = (e.reps || 0) + 1;
        if (ev.r.clean) e.ok = (e.ok || 0) + 1;
      }
      e.ms = Activity.recent - (e.base || 0);
      Store.save();
      if (e.goal) return; // already reached; you chose to keep going
      const out = ev.out || {};
      if (e.role === 'check' || e.role === 'review') {
        if (!ev.r.valid) return;
        if (out.change === 'pass' || out.change === 'done')
          return goal(s, e, out.change === 'done' ? 'Integrated.' : 'Cold check passed.');
        if (ev.r.mode === 'quiz') {
          // a theory cold check is the first few answers of the day: wait for its verdict, then a few warm
          if ((planFor(e.id) || {}).cold) return;
          if (out.change === 'fail' || e.warmFrom == null) e.warmFrom = e.reps;
          if (e.reps - e.warmFrom >= 3)
            return goal(s, e, 'Practiced warm. The cold check comes back next time.');
          return;
        }
        if (out.change === 'fail' && e.reps === 1) return; // practice it warm for a moment
        if (e.reps >= 3 || (e.reps >= 2 && ev.r.clean))
          return goal(s, e, 'Practiced warm. The cold check comes back next time.');
      } else {
        if (out.reached) {
          const why = { done: 'Integrated.', pass: 'Cold check passed. Another day to go.' }[out.change];
          return goal(s, e, why || 'Goal reached. Cold checks start next session.');
        }
        checkTime(s, e);
      }
    } else if (ev.type === 'goal' && !e.goal) goal(s, e, 'Enough improvising for today.');
    else if (ev.type === 'improv' && ev.res === 'done' && !e.goal) goal(s, e, 'Integrated.');
  }

  function checkTime(s, e) {
    const d = itemDef(e.id);
    if (!d) return;
    e.ms = Activity.recent - (e.base || 0);
    const box = e.box || ROLE_BOX[e.role] || TIMEBOX[d.kind] || 8;
    if (e.ms >= box * 60000 && !e.goal)
      goal(
        s,
        e,
        `${box} minutes of focused work: a good place to stop. Spacing it over days is what makes it stick.`,
      );
  }

  // the item is done for today: say so, then move on by itself unless you keep going
  function goal(s, e, why) {
    e.goal = true;
    Store.save();
    if (player) player.hold(true);
    const next = s.list.slice(s.idx + 1).find(isOpen);
    const nd = next && itemDef(next.id);
    Log.ev('entry goal', { id: e.id, why, next: next && next.id });
    const host = $('#plHost', page);
    if (!host) return;
    const card = document.createElement('div');
    card.className = 'goalcard';
    card.innerHTML = `
      <span class="eyebrow">Done for today</span>
      <div class="h2">${esc(why)}</div>
      ${
        nd
          ? `<p class="small">Next: <b>${esc(shortTitle(nd))}</b></p>
             <div class="goalbar"><i id="gcBar"></i></div>`
          : '<p class="small">That was the last one today.</p>'
      }
      <div class="row">
        <button class="btn" type="button" id="gcStay">Keep going</button>
        <button class="btn cover" type="button" id="gcNext">${nd ? 'Next now' : 'Finish'}</button>
      </div>`;
    host.appendChild(card);
    const bar = $('#gcBar', card);
    if (bar)
      requestAnimationFrame(() => {
        bar.style.transitionDuration = GOAL_WAIT_MS + 'ms';
        bar.style.width = '100%';
      });
    const moveOn = () => {
      clearTimeout(goalTimer);
      e.state = 'done';
      advance(s);
    };
    if (nd) goalTimer = setTimeout(moveOn, GOAL_WAIT_MS);
    $('#gcNext', card).onclick = moveOn;
    $('#gcStay', card).onclick = () => {
      clearTimeout(goalTimer);
      card.remove();
      Log.ev('entry keep going', { id: e.id });
      if (player) {
        player.hold(false);
        player.destroy();
      }
      player = Player.mount(host, { id: e.id, role: 'focus', onEvent: ev => onPlayerEvent(s, e, ev) });
    };
  }

  function advance(s) {
    clearTimeout(goalTimer);
    const nextIdx = s.list.findIndex((x, i) => i > s.idx && isOpen(x));
    s.idx = nextIdx >= 0 ? nextIdx : s.list.length;
    Store.save();
    drawSession();
  }

  /* ---------- after the last item ---------- */
  function drawSummary(s) {
    const t = todayKey();
    const day = Store.s.days[t] || {};
    const mins = Math.round(day.min || 0);
    const milestones = Store.s.hist
      .filter(h => h.d === t)
      .map(milestoneRow)
      .join('');
    const more = s.list
      .filter(x => x.role !== 'check' && x.role !== 'review' && itemDef(x.id))
      .map(
        x => `
          <div class="listrow">
            <div class="grow">
              <div class="ttl">${esc(shortTitle(itemDef(x.id)))}</div>
              <div class="small">${esc(criterion(x.id))}</div>
            </div>
            <button class="btn sm" type="button" data-more="${esc(x.id)}">Practice</button>
          </div>`,
      )
      .join('');
    const pieceButton =
      !pieces && workingPieces().length
        ? '<button class="btn" type="button" id="smPieces">A piece session</button>'
        : '';
    page.innerHTML = `
      <div class="card summary">
        <span class="eyebrow">${pieces ? 'Piece session' : 'Today'}</span>
        <h1 class="h1">Session <em>done</em>.</h1>
        <div class="stats">
          <div class="stat"><b>${mins}</b><span>minutes played</span></div>
          <div class="stat"><b>${day.reps || 0}</b><span>reps</span></div>
          <div class="stat"><b>${day.clean || 0}</b><span>clean reps</span></div>
        </div>
        ${
          milestones
            ? `<div class="stack" style="gap:0">${milestones}</div>`
            : `<p class="small">No stage changes today; that is how most days look.
                 Progress is in the reps; the milestones follow.</p>`
        }
        <p class="small">Next time starts with cold checks of what you reached today,
          then picks up where you left off.</p>
      </div>
      <div class="card">
        <div class="cardhead"><h2 class="h2">Want more?</h2></div>
        <div class="stack" style="gap:0">${more}</div>
        <div class="row">
          ${pieceButton}
          <button class="btn" type="button" id="smFree">Free play</button>
          <button class="btn" type="button" id="smLib">Library</button>
        </div>
      </div>`;
    page.querySelectorAll('[data-more]').forEach(b => {
      b.onclick = () => go('practice', { item: b.dataset.more });
    });
    $('#smFree', page).onclick = () => go('free');
    $('#smLib', page).onclick = () => go('library');
    const ps = $('#smPieces', page);
    if (ps) ps.onclick = () => go('library', { pieceSession: true });
  }

  function drawEmpty() {
    page.innerHTML = `
      ${focusBar()}
      <div class="card">
        <h2 class="h2">Nothing scheduled</h2>
        <p class="small">All your areas are switched off, or everything is waiting for its next cold
          check.</p>
        <div class="row">
          <button class="btn" type="button" id="emSet">Areas</button>
          <button class="btn" type="button" id="emLib">Choose a piece</button>
        </div>
      </div>`;
    bindFocusBar();
    $('#emSet', page).onclick = settingsSheet;
    $('#emLib', page).onclick = () => go('library');
  }

  /* ---------- practicing one item outside the session ---------- */
  function drawExtra(id) {
    cleanup();
    if (!itemDef(id)) {
      page.innerHTML = '<div class="card"><p>That item is not available.</p></div>';
      return;
    }
    page.innerHTML = `
      <div class="row between">
        <button class="btn sm ghost" type="button" id="exBack">← Today's session</button>
        <span class="small">Extra practice</span>
      </div>
      ${connectNotice()}
      <div id="plHost" style="position:relative"></div>`;
    bindConnect();
    $('#exBack', page).onclick = () => go('practice');
    player = Player.mount($('#plHost', page), { id, role: 'focus' });
  }

  /* ---------- first open ---------- */
  function drawWelcome() {
    const P = Store.s.profile;
    const fav = new Set(P.favorites);
    const matters = new Set(
      Object.entries(P.weights || {})
        .filter(([, w]) => w > 1)
        .map(([a]) => a),
    );
    let pick = null;
    const suggestions = () =>
      Library.all()
        .filter(p => p.c !== 'mine' && (fav.size ? fav.has(p.c) : true) && p.lvl <= 2)
        .slice(0, 8);
    const chip = (attr, key, on, label) =>
      `<button type="button" class="chip" data-${attr}="${key}" aria-pressed="${on}">${esc(label)}</button>`;
    const pieceCard = p => `
      <button type="button" class="pickcard" data-pick="${p.id}" aria-pressed="${pick === p.id}">
        <b>${esc(p.t)}</b>
        <span>${esc(COMPOSERS[p.c].short)}${p.sub ? ' · ' + esc(p.sub) : ''} · ${LEVEL_NAMES[p.lvl]}</span>
      </button>`;
    const paint = () => {
      page.innerHTML = `
        <div class="card welcome">
          <span class="eyebrow">Welcome to DaCapo</span>
          <h1 class="h1">Open it, and <em>play</em>.</h1>
          <ol class="small">
            <li>Each day DaCapo prepares a short session around one focus for the week, with a few minutes
              of upkeep for everything else.</li>
            <li>Each drill carries over from day to day until it is truly learned: right on the first try of
              the day, on two different days.</li>
            <li>It listens over MIDI and moves on by itself. You keep your hands on the keys.</li>
          </ol>
        </div>
        ${connectNotice(true)}
        <div class="card">
          <div class="cardhead">
            <h2 class="h2">What matters most to you?</h2>
            <span class="small">Choose any; it shapes the suggestions</span>
          </div>
          <div class="chips">${AREAS.map(a => chip('matter', a.id, matters.has(a.id), a.n)).join('')}</div>
        </div>
        <div class="card">
          <div class="cardhead"><h2 class="h2">Composers you love</h2></div>
          <div class="chips">${Object.entries(COMPOSERS)
            .filter(([k]) => k !== 'mine')
            .map(([k, c]) => chip('fav', k, fav.has(k), c.short))
            .join('')}</div>
          <span class="small">A piece to work on (optional; the Library has them all):</span>
          <div class="pickgrid">${suggestions().map(pieceCard).join('')}</div>
        </div>
        <button class="btn cover big" type="button" id="wcCheck">Start with an 8-minute check</button>
        <button class="btn big ghost" type="button" id="wcStart">Skip it and start practicing</button>`;
      bindConnect();
      const toggle = (attr, set) =>
        page.querySelectorAll(`[data-${attr}]`).forEach(b => {
          b.onclick = () => {
            const k = b.dataset[attr];
            if (set.has(k)) set.delete(k);
            else set.add(k);
            paint();
          };
        });
      toggle('matter', matters);
      toggle('fav', fav);
      page.querySelectorAll('[data-pick]').forEach(b => {
        b.onclick = () => {
          pick = pick === b.dataset.pick ? null : b.dataset.pick;
          paint();
        };
      });
      const finish = to => {
        P.favorites = [...fav];
        P.weights = Object.fromEntries(AREAS.map(a => [a.id, matters.has(a.id) ? 1.3 : 1]));
        P.onboarded = true;
        if (pick) workOnPiece(pick, { daily: true });
        Store.s.session = null;
        Store.s.focus = null;
        Store.save();
        Log.ev('onboarded', { matters: [...matters], fav: P.favorites, piece: pick });
        go(to);
      };
      $('#wcCheck', page).onclick = () => finish('assess');
      $('#wcStart', page).onclick = () => finish('practice');
    };
    paint();
  }
};

// one step of the session strip at the top
function stepChip(x, i, current) {
  const d = itemDef(x.id);
  const label = d ? (ROLE_PREFIX[x.role] || '') + shortTitle(d) : x.id;
  const cls = i === current && x.state !== 'done' ? 'now' : x.state;
  return `<span class="sess-step ${cls}" title="${esc(label)}">
    <i>${x.state === 'done' ? '✓' : i + 1}</i><span>${esc(label)}</span></span>`;
}

// one line of today's milestones in the summary
const MILESTONE_WORDS = {
  stage: v =>
    ({
      tempo: 'notes learned, building tempo',
      pace: 'notes learned, building speed',
      check: 'goal reached',
    })[v] || 'back to building',
  done: () => 'integrated',
  review: v => (v === 'ok' ? 'review: still solid' : 'review: needs a refresh'),
};
function milestoneRow(h) {

     <div class="stack" style="gap:0">${s.list.map(row).join('')}</div>

// ---- learn/echo.js ----
/* Echo: the app plays a short phrase, you play it back. Playing by ear, in small steps: a few notes close
   together first, then longer phrases, wider leaps, other keys and minor. Three right in a row moves up a
   level; two misses in a row moves down one, so it stays at the edge of what you can hear. */

const MAJOR = [0, 2, 4, 5, 7, 9, 11];
const MINOR = [0, 2, 3, 5, 7, 8, 10];
const PENTA = [0, 2, 4, 7, 9];

// len: notes; scale; span: highest scale step used (0 = the tonic); leap: largest step between notes
// (in scale steps); keys: tonics to choose from; gap: seconds between notes
const ECHO_LEVELS = [
  { len: 2, scale: PENTA, span: 2, leap: 1, keys: ['C'], gap: 0.6 },
  { len: 3, scale: PENTA, span: 2, leap: 1, keys: ['C'], gap: 0.6 },
  { len: 3, scale: PENTA, span: 3, leap: 2, keys: ['C'], gap: 0.55 },
  { len: 4, scale: PENTA, span: 4, leap: 2, keys: ['C', 'G', 'F'], gap: 0.55 },
  { len: 4, scale: MAJOR, span: 4, leap: 1, keys: ['C', 'G', 'F'], gap: 0.5 },
  { len: 5, scale: MAJOR, span: 7, leap: 2, keys: ['C', 'G', 'F', 'D'], gap: 0.5 },
  { len: 5, scale: MAJOR, span: 7, leap: 4, keys: ['C', 'G', 'F', 'D', 'Bb'], gap: 0.5 },
  { len: 5, scale: MINOR, span: 4, leap: 2, keys: ['A', 'D', 'E'], gap: 0.5 },
  { len: 6, scale: MINOR, span: 7, leap: 4, keys: ['A', 'D', 'E', 'G', 'C'], gap: 0.45 },
  { len: 6, scale: MAJOR, span: 9, leap: 5, keys: ['C', 'G', 'F', 'D', 'Bb', 'A', 'Eb'], gap: 0.45 },
  { len: 7, scale: MAJOR, span: 9, leap: 7, keys: ['C', 'G', 'F', 'D', 'Bb', 'A', 'Eb', 'E'], gap: 0.42 },
];
const MAX_ECHO = ECHO_LEVELS.length;

const TONIC = { C: 60, D: 62, E: 64, F: 65, G: 55, A: 57, Bb: 58, Eb: 63 };
const NAMES = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
const pcName = m => NAMES[((m % 12) + 12) % 12];

// a phrase for a level: {key, minor, tonic, notes: [midi], chord: [midi]}
function makePhrase(level, previous) {
  const L = ECHO_LEVELS[Math.max(1, Math.min(MAX_ECHO, level)) - 1];
  const key = pick(L.keys);
  const tonic = TONIC[key];
  const minor = L.scale === MINOR;
  // scale step k (may pass the octave) to midi
  const midi = k => tonic + 12 * Math.floor(k / L.scale.length) + L.scale[k % L.scale.length];
  for (let tries = 0; tries < 20; tries++) {
    const steps = [0]; // phrases start on the tonic at first, anywhere in the scale later
    if (level > 3) steps[0] = pick([0, 0, 2, 4].filter(k => k <= L.span));
    while (steps.length < L.len) {
      const last = steps[steps.length - 1];
      const options = [];
      for (let k = 0; k <= L.span; k++) if (k !== last && Math.abs(k - last) <= L.leap) options.push(k);
      steps.push(pick(options));
    }
    const notes = steps.map(midi);
    if (previous && notes.join() === previous.notes.join()) continue;
    const third = minor ? 3 : 4;
    return { key, minor, tonic, notes, chord: [tonic - 12, tonic - 12 + third, tonic - 12 + 7] };
  }
  return makePhrase(level, null);
}

// played: midis in order. Any octave counts; the order and the notes must match.
function judge(phrase, played) {
  const pc = m => ((m % 12) + 12) % 12;
  for (let i = 0; i < played.length; i++)
    if (i >= phrase.notes.length || pc(played[i]) !== pc(phrase.notes[i])) return { ok: false, wrongAt: i };
  return {
    ok: played.length === phrase.notes.length,
    wrongAt: -1,
    partial: played.length < phrase.notes.length,
  };
}

// the game's progress after an answer: {level, best, streak, misses}
function afterAnswer(g, ok) {
  const next = { level: g.level || 1, best: g.best || 1, streak: g.streak || 0, misses: g.misses || 0 };
  if (ok) {
    next.streak++;
    next.misses = 0;
    if (next.streak >= 3 && next.level < MAX_ECHO) {
      next.level++;
      next.streak = 0;
    }
  } else {
    next.streak = 0;
    next.misses++;
    if (next.misses >= 2 && next.level > 1) {
      next.level--;
      next.misses = 0;
    }
  }
  next.best = Math.max(next.best, next.level);
  return next;
}

// ---- views/echo.js ----
/* Echo, the call-and-response game (rules in learn/echo.js). */

const PAUSE_MS = { right: 1300, wrong: 3200 };

function drawEcho(body) {
  const games = (Store.s.games = Store.s.games || {});
  const g = (games.echo = Object.assign({ level: 1, best: 1, streak: 0, misses: 0 }, games.echo));
  const E = { phase: 'idle', phrase: null, played: [], timers: [] };
  const later = (fn, ms) => E.timers.push(setTimeout(fn, ms));
  const clear = () => {
    E.timers.forEach(clearTimeout);
    E.timers = [];
  };

  body.innerHTML = `
    <div class="card echo">
      <div class="row between">
        <div>
          <span class="eyebrow">Echo</span>
          <div class="h3" id="ecLevel"></div>
        </div>
        <div class="streak" id="ecStreak" aria-label="Right in a row"></div>
      </div>
      <p class="small">DaCapo plays a short phrase after a chord that sets the key. Play it back, in any
        octave. Three right in a row and the phrases grow.</p>
      <div class="echo-prompt" id="ecPrompt"></div>
      <div class="feedback pl-msg" id="ecMsg" aria-live="polite"></div>
      <div class="kbwrap scrollx"><div id="ecKb"></div></div>
      <div class="row">
        <button class="btn cover" type="button" id="ecGo">Play a phrase</button>
        <button class="btn" type="button" id="ecAgain" disabled>Hear it again</button>
      </div>
    </div>`;
  const msg = (t, cls = '') => {
    const e = $('#ecMsg', body);
    e.className = 'feedback pl-msg ' + cls;
    e.textContent = t;
  };
  const kb = (marks = {}) => ($('#ecKb', body).innerHTML = kbSVG({ from: 48, to: 84, marks, h: 110 }));

  function paintHead() {
    const L = ECHO_LEVELS[g.level - 1];
    $('#ecLevel', body).textContent = `Level ${g.level} of ${MAX_ECHO} · ${L.len} notes · best ${g.best}`;
    $('#ecStreak', body).innerHTML = [0, 1, 2]
      .map(i => `<i class="${i < g.streak ? 'on' : ''}"></i>`)
      .join('');
  }
  function prompt() {
    const p = E.phrase;
    $('#ecPrompt', body).innerHTML = p
      ? `<b>${esc(p.key.replace('b', '♭'))} ${p.minor ? 'minor' : 'major'}</b> · starts on ${esc(pcName(p.notes[0]))}
         · ${E.played.length} of ${p.notes.length}`
      : '';
  }

  // the key chord, then the phrase; listening starts when it has finished
  function playPhrase() {
    clear();
    const p = E.phrase;
    const L = ECHO_LEVELS[g.level - 1];
    E.phase = 'listen';
    E.played = [];
    const t = AudioEngine.now() + 0.08;
    AudioEngine.chord(p.chord, t, 0.9, 0.42);
    p.notes.forEach((m, i) => AudioEngine.note(m, t + 1.1 + i * L.gap, L.gap * 1.3, 0.62));
    const ends = (1.1 + p.notes.length * L.gap) * 1000;
    later(() => {
      E.phase = 'answer';
      msg('Your turn.');
    }, ends);
    msg('Listen…');
    $('#ecAgain', body).disabled = false;
    kb();
    prompt();
  }
  function newPhrase() {
    E.phrase = makePhrase(g.level, E.phrase);
    $('#ecGo', body).textContent = 'Skip';
    playPhrase();
    Log.ev('echo phrase', { level: g.level, notes: E.phrase.notes.length });
  }

  function answered(ok) {
    E.phase = 'shown';
    Object.assign(g, afterAnswer(g, ok));
    Store.save();
    const p = E.phrase;
    const marks = Object.fromEntries(p.notes.map(m => [m, { cls: 'rh' }]));
    kb(marks);
    if (ok) msg(g.streak === 0 && g.level > 1 ? `Right. Up to level ${g.level}.` : 'Right.', 'ok');
    else {
      msg(`It was ${p.notes.map(pcName).join(' – ')}. Listen once more.`, 'bad');
      const L = ECHO_LEVELS[Math.min(MAX_ECHO, g.level) - 1];
      const t = AudioEngine.now() + 0.5;
      p.notes.forEach((m, i) => AudioEngine.note(m, t + i * L.gap, L.gap * 1.3, 0.62));
    }
    paintHead();
    Log.ev('echo answer', { ok, level: g.level, streak: g.streak });
    later(newPhrase, ok ? PAUSE_MS.right : PAUSE_MS.wrong + p.notes.length * 400);
  }

  const off = Input.on(
    Log.guard('echo note', ev => {
      const svg = $('#ecKb svg', body);
      if (E.phase !== 'answer') return;
      E.played.push(ev.m);
      const r = judge(E.phrase, E.played);
      flashKey(svg, ev.m, r.wrongAt >= 0 ? 'bad' : 'ok', 260);
      prompt();
      if (r.wrongAt >= 0) answered(false);
      else if (r.ok) answered(true);
    }),
  );

  $('#ecGo', body).onclick = () => {
    AudioEngine.ensure();
    newPhrase();
  };
  $('#ecAgain', body).onclick = () => {
    if (!E.phrase) return;
    clear();
    playPhrase();
  };
  kb();
  paintHead();
  msg(Input.live ? 'Press "Play a phrase" when you are ready.' : 'Use your piano, or the keys below.');

  return () => {
    clear();
    off();
  };
}

// ---- views/takes.js ----
/* Recording yourself: takes kept on the device, with playback. */

/* ---------- takes: record what you play (any input), see it as a piano roll, play it back ---------- */
const Takes = {
  rec: null,
  offs: [],
  playing: null,
  list() {
    try {
      return JSON.parse(localStorage.getItem('dacapo.takes') || '[]');
    } catch (e) {
      return [];
    }
  },
  saveList(l) {
    try {
      localStorage.setItem('dacapo.takes', JSON.stringify(l.slice(0, 8)));
    } catch (e) {
      toast('This browser is full; older takes were not kept.');
    }
  },
  start() {
    this.stopRec(true);
    this.rec = { t0: performance.now(), ev: [] };
    this.offs = [
      Input.on(
        ev =>
          this.rec && this.rec.ev.push([Math.round(ev.t - this.rec.t0), 'n', ev.m, Math.round(ev.vel * 127)]),
      ),
      Input.onOff(ev => {
        if (!this.rec) return;
        if (ev.pedal != null) this.rec.ev.push([Math.round(ev.t - this.rec.t0), 'p', ev.pedal ? 1 : 0]);
        else this.rec.ev.push([Math.round(ev.t - this.rec.t0), 'f', ev.m]);
      }),
    ];
  },
  stopRec(discard) {
    this.offs.forEach(f => f());
    this.offs = [];
    const r = this.rec;
    this.rec = null;
    if (discard || !r) return null;
    const ev = r.ev.filter(e => e[0] >= -200).sort((a, b) => a[0] - b[0]);
    if (!ev.some(e => e[1] === 'n')) return null;
    const first = ev.find(e => e[1] === 'n')[0];
    ev.forEach(e => (e[0] -= first));
    const take = { id: 't' + Date.now().toString(36), d: Date.now(), ev, name: '' };
    const l = this.list();
    l.unshift(take);
    this.saveList(l);
    return take;
  },
  // pair note-ons with offs; the sustain pedal extends notes until it lifts
  notes(take) {
    const out = [],
      open = new Map();
    let pedal = false;
    const held = new Set();
    const pedalSpans = [];
    let pStart = 0;
    const end = take.ev.length ? take.ev[take.ev.length - 1][0] + 400 : 0;
    take.ev.forEach(([t, k, m, v]) => {
      if (k === 'n') {
        if (open.has(m)) {
          const o = open.get(m);
          o.dur = t - o.t;
          out.push(o);
        }
        open.set(m, { t, m, vel: v / 127, dur: 0 });
        held.add(m);
      } else if (k === 'f') {
        held.delete(m);
        if (!pedal && open.has(m)) {
          const o = open.get(m);
          o.dur = t - o.t;
          out.push(o);
          open.delete(m);
        }
      } else if (k === 'p') {
        if (m) {
          pedal = true;
          pStart = t;
        } else {
          pedal = false;
          pedalSpans.push([pStart, t]);
          open.forEach((o, mm) => {
            if (!held.has(mm)) {
              o.dur = t - o.t;
              out.push(o);
              open.delete(mm);
            }
          });
        }
      }
    });
    if (pedal) pedalSpans.push([pStart, end]);
    open.forEach(o => {
      o.dur = Math.max(300, end - o.t);
      out.push(o);
    });
    out.forEach(o => (o.dur = Math.max(60, o.dur)));
    return {
      notes: out.sort((a, b) => a.t - b.t),
      pedal: pedalSpans,
      dur: Math.max(end, ...out.map(o => o.t + o.dur)),
    };
  },
  play(take, onEnd) {
    this.stop();
    const { notes, dur } = this.notes(take);
    const t0 = AudioEngine.now() + 0.15;
    notes.forEach(n => AudioEngine.note(n.m, t0 + n.t / 1000, n.dur / 1000, clamp(n.vel, 0.08, 1)));
    const startPerf = performance.now() + 150;
    this.playing = {
      startPerf,
      dur,
      timer: setTimeout(() => {
        this.playing = null;
        onEnd && onEnd();
      }, dur + 400),
    };
    return startPerf;
  },
  stop() {
    if (this.playing) {
      clearTimeout(this.playing.timer);
      this.playing = null;
      AudioEngine.stopAll();
    }
  },
  stats(take) {
    const { notes, pedal, dur } = this.notes(take);
    if (!notes.length) return null;
    const vels = notes.map(n => n.vel);
    const lo = Math.min(...notes.map(n => n.m)),
      hi = Math.max(...notes.map(n => n.m));
    const onsets = groupSteps(
      notes.map(n => ({ t: n.t, m: n.m, vel: n.vel })),
      50,
    );
    let gap = 0;
    for (let i = 1; i < onsets.length; i++) gap = Math.max(gap, onsets[i].t - onsets[i - 1].t);
    const ped = pedal.reduce((a, [x, y]) => a + (y - x), 0);
    return {
      n: notes.length,
      dur,
      nps: notes.length / Math.max(1, dur / 1000),
      vlo: Math.min(...vels),
      vhi: Math.max(...vels),
      vavg: meanOf(vels),
      lo,
      hi,
      gap,
      pedalPct: dur ? ped / dur : 0,
    };
  },
  roll(take, w = 640) {
    const { notes, pedal, dur } = this.notes(take);
    if (!notes.length) return '';
    const lo = Math.min(...notes.map(n => n.m)) - 2,
      hi = Math.max(...notes.map(n => n.m)) + 2;
    const rows = hi - lo + 1;
    const rh = clamp(Math.floor(180 / rows), 3, 9);
    const H = rows * rh + 18;
    const sx = (w - 30) / Math.max(1, dur);
    let s = '';
    for (let m = lo; m <= hi; m++) {
      const y = (hi - m) * rh;
      if (isBlack(m)) s += `<rect x="28" y="${y}" width="${w - 28}" height="${rh}" fill="var(--sunk)"/>`;
      if (m % 12 === 0)
        s +=
          `<text x="0" y="${y + rh - 1}" font-size="8" fill="var(--muted)">C${m / 12 - 1}</text>` +
          `<line x1="28" x2="${w}" y1="${y + rh}" y2="${y + rh}" stroke="var(--line)"/>`;
    }
    for (let sec = 0; sec * 1000 < dur; sec += dur > 30000 ? 5 : 1) {
      const x = 30 + sec * 1000 * sx;
      s += `<line x1="${x}" x2="${x}" y1="0" y2="${rows * rh}" stroke="var(--line)" stroke-width=".5"/>`;
    }
    notes.forEach(n => {
      const y = (hi - n.m) * rh;
      const x = (30 + n.t * sx).toFixed(1);
      const width = Math.max(2, n.dur * sx).toFixed(1);
      const opacity = (0.25 + n.vel * 0.75).toFixed(2); // louder notes are darker
      s += `<rect x="${x}" y="${y + 0.5}" width="${width}" height="${rh - 1}" rx="1.5" fill="var(--rh)" fill-opacity="${opacity}"/>`;
    });
    pedal.forEach(([a, b]) => {
      const width = Math.max(2, (b - a) * sx);
      s += `<rect x="${30 + a * sx}" y="${rows * rh + 6}" width="${width}" height="6" rx="2" fill="var(--brass)"/>`;
    });
    const playhead = `<line class="playhead" x1="30" x2="30" y1="0" y2="${rows * rh}" stroke="var(--brass)" stroke-width="2" opacity="0"/>`;
    return `<svg class="roll" viewBox="0 0 ${w} ${H}" style="width:100%;height:auto" role="img"
      aria-label="Piano roll of the take"><g>${s}</g>${playhead}</svg>`;
  },
};

function takesCardHTML() {

    <div class="cardhead">

      <span class="small">Record, look, listen back</span>

    <div class="row">
