function b64bytes(s) {
  const bin = atob(s || '');
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function readVarints(bytes) {
  const out = [];
  let v = 0,
    sh = 0;
  for (const b of bytes) {
    v += (b & 0x7f) * Math.pow(2, sh);
    if (b & 0x80) sh += 7;
    else {
      out.push(v);
      v = 0;
      sh = 0;
    }
  }
  return out;
}

const unzz = n => (n % 2 ? -(n + 1) / 2 : n / 2);

const Library = {
  cache: new Map(),
  // your imported pieces, read from the device once and kept in memory (they are looked up constantly)
  mine: null,
  imports() {
    if (!this.mine)
      try {
        const list = JSON.parse(localStorage.getItem('dacapo.imports') || '[]');
        this.mine = Array.isArray(list) ? list : [];
      } catch (e) {
        this.mine = [];
      }
    return this.mine;
  },
  saveImports(list) {
    try {
      localStorage.setItem('dacapo.imports', JSON.stringify(list));
      this.mine = list;
      this.every = null;
      return true;
    } catch (e) {
      Log.err(e, 'save import');
      return false;
    }
  },
  // forget everything decoded for a piece (after it is removed or replaced)
  forget(id) {
    ['', 'bars:', 'secs:'].forEach(k => this.cache.delete(k + id));
  },
  every: null, // the built-in pieces, the tunes and your imports, in one list
  all() {
    if (!this.every) this.every = [].concat(LIBRARY_DATA || [], SONGS_DATA || [], this.imports());
    return this.every;
  },
  get(id) {
    return this.all().find(p => p.id === id) || null;
  },
  // decoded notes: [{t, d, m, acc, h, s, f}] with t, d in quarter-note beats
  notes(id) {
    if (this.cache.has(id)) return this.cache.get(id);
    const p = this.get(id);
    if (!p) return [];
    const out = this.decode(p);
    this.cache.set(id, out);
    return out;
  },
  decode(p) {
    const id = p.id;
    const bytes = b64bytes(p.notes);
    let pos = 0;
    const rv = () => {
      let val = 0,
        sh = 0;
      while (pos < bytes.length) {
        const b = bytes[pos++];
        val += (b & 0x7f) * Math.pow(2, sh);
        if (!(b & 0x80)) break;
        sh += 7;
      }
      return val;
    };
    const out = [];
    let t = 0;
    const prev = [60, 48];
    const shift = p.shift || 0;
    while (pos < bytes.length && out.length < p.n) {
      t += rv();
      const d = rv();
      const dz = rv();
      const flags = bytes[pos++];
      const h = Math.floor(flags / 5) % 2;
      const m = prev[h] + unzz(dz);
      prev[h] = m;
      out.push({
        t: t / p.tpq - shift,
        d: d / p.tpq,
        m,
        acc: (flags % 5) - 2,
        h,
        s: Math.floor(flags / 10) % 2,
        f: 0,
      });
    }
    const fv = readVarints(b64bytes(p.fing));
    let fi = 0;
    for (let k = 0; k + 1 < fv.length; k += 2) {
      fi += fv[k];
      if (out[fi]) out[fi].f = fv[k + 1];
    }
    if (out.length !== p.n) Log.warn('library decode count mismatch', { id, got: out.length, want: p.n });
    return out;
  },
  bars(id) {
    const p = this.get(id);
    const key = 'bars:' + id;
    if (this.cache.has(key)) return this.cache.get(key);
    const out = this.decodeBars(p);
    this.cache.set(key, out);
    return out;
  },
  decodeBars(p) {
    let acc = 0;
    return readVarints(b64bytes(p.bars)).map(x => (acc += x) / p.tpq - (p.shift || 0));
  },
  // the practice sections of a piece: bars a..z, the section it repeats (same, or -1), and how many notes
  // start in it (n; a section without any cannot be practiced on its own)
  sections(id) {
    const key = 'secs:' + id;
    if (this.cache.has(key)) return this.cache.get(key);
    const p = this.get(id);
    const out = ((p && p.secs) || []).map(([a, z, same], k) => ({
      k,
      a,
      z,
      same,
      n: this.range(id, a, z).length,
    }));
    this.cache.set(key, out);
    return out;
  },
  atBar(list, bar, def) {
    let v = def;
    (list || []).forEach(x => {
      if (x[0] <= bar) v = x;
    });
    return v;
  },
  timeAt(id, bar) {
    const p = this.get(id);
    const x = this.atBar(p.ts, bar, [0, 4, 4]);
    return [x[1], x[2]];
  },
  keyAt(id, bar) {
    const p = this.get(id);
    const x = this.atBar(p.keys, bar, [0, 0]);
    return x[1];
  },
  tempoAt(id, bar) {
    const p = this.get(id);
    let v = p.bpm;
    (p.tempos || []).forEach(([b, bpm]) => {
      if (b - 1 <= bar) v = bpm;
    });
    return v;
  },
  clefAt(id, staff, bar) {
    const p = this.get(id);
    let c = p.c === 'mine' && staff === 1 ? 'b' : 't';
    /* LilyPond's default clef is treble on every staff */ (p.clefs || []).forEach(([b, s, k]) => {
      if (s === staff && b <= bar) c = k;
    });
    return c;
  },
  // the notes of a bar range; grace notes just before the first bar belong to it
  range(id, a, z) {
    const bars = this.bars(id);
    const s0 = bars[a],
      s1 = bars[Math.min(z, bars.length - 1)];
    const eps = 0.2;
    return this.notes(id).filter(
      n =>
        n.t >= s0 - (n.d === 0 ? eps : 0) &&
        (n.t < s1 - (n.d === 0 ? eps : 0) || (z >= bars.length - 1 && n.t <= s1)),
    );
  },
  /* steps for practicing bars a..z with the given hands ('rh' | 'lh' | 'ht') */
  steps(id, a, z, hand) {
    const p = this.get(id);
    const bars = this.bars(id);
    const s0 = bars[a];
    const all = this.range(id, a, z);
    const want = hand === 'rh' ? [0] : hand === 'lh' ? [1] : [0, 1];
    const groups = new Map();
    all.forEach(n => {
      if (!want.includes(n.h)) return;
      const key = n.t.toFixed(4);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(n);
    });
    const steps = [...groups.entries()]
      .sort((x, y) => +x[0] - +y[0])
      .map(([k, ns]) => {
        const beat = +k - s0;
        const grace = ns.every(n => n.d === 0);
        return {
          midis: [...new Set(ns.map(n => n.m))].sort((x, y) => x - y),
          beat,
          grace,
          dur: Math.max(...ns.map(n => n.d)),
          notes: ns.map(n => ({
            n: spellAcc(n.m, n.acc),
            st: n.s ? 'b' : 't',
            f: n.f || '',
            fcls: n.h ? 'lh' : 'rh',
            d: n.d,
            t: n.t - s0,
          })),
        };
      });
    const ghost =
      hand === 'ht'
        ? []
        : all
            .filter(n => !want.includes(n.h))
            .map(n => ({ n: spellAcc(n.m, n.acc), st: n.s ? 'b' : 't', d: n.d, t: n.t - s0, ghost: true }));
    // a tune's chord symbols in these bars (the one sounding at the start included)
    const syms = (p.showSyms === false ? [] : p.syms || [])
      .filter(
        ([t], i, l) =>
          t < bars[Math.min(z, bars.length - 1)] - 1e-6 &&
          (t >= s0 - 1e-6 || (l[i + 1] || [Infinity])[0] > s0 + 1e-6),
      )
      .map(([t, text]) => ({ t: Math.max(0, t - s0), text }));
    return {
      steps,
      ghost,
      syms,
      bars: bars.slice(a, z + 1).map(b => b - s0),
      total: bars[Math.min(z, bars.length - 1)] - s0,
      sig: this.keyAt(id, a),
      time: this.timeAt(id, a),
      clefs: [this.clefAt(id, 0, a), this.clefAt(id, 1, a)],
      clefChanges: (p.clefs || [])
        .filter(([b]) => b > a && b < z)
        .map(([b, s, k]) => ({ t: bars[b] - s0, s, k })),
    };
  },
  // how a piece is counted: click unit in quarter notes, clicks per bar
  meter(id, bar) {
    const [n, d] = this.timeAt(id, bar);
    const unit = d === 8 ? 0.5 : 1;
    const clicks = d === 8 ? n : d === 2 ? n * 2 : n;
    return { n, d, unit, clicks, barBeats: (n * 4) / d };
  },
};

// ---- music/instruments.js ----
/* The keyboard sounds. How they sound is in sounds.js. */

const SOUNDS = [
  { id: 'piano', n: 'Piano' },
  { id: 'epiano', n: 'E-piano' },
  { id: 'pad', n: 'Pad' },
  { id: 'bass', n: 'Bass' },
  { id: 'harp', n: 'Harp' },
  { id: 'flute', n: 'Flute' },
];
const SOUND_BY = Object.fromEntries(SOUNDS.map(s => [s.id, s]));

// ---- music/sounds.js ----
/* A few keyboard sounds, synthesized so there is nothing to download (listed in instruments.js): the
   backing, and your piano played through this device. The piano is the app's own piano voice, which plays on your piano
   when "Sound on the piano" is set. */

const freq = m => 440 * Math.pow(2, (m - 69) / 12);

const Sounds = {
  noise: null,
  active: [], // everything sounding or scheduled: {gain, nodes, end}, so Stop can silence it at once
  track(gain, nodes, end) {
    const now = this.ctx().currentTime;
    this.active = this.active.filter(v => v.end > now);
    const v = { gain, nodes, end };
    this.active.push(v);
    return v;
  },
  // silence everything playing or scheduled
  stopAll() {
    const ctx = AudioEngine.ctx;
    if (!ctx) return;
    const now = ctx.currentTime;
    this.active.forEach(v => {
      try {
        v.gain.gain.cancelScheduledValues(0);
        v.gain.gain.setValueAtTime(0, now);
        v.nodes.forEach(o => o.stop(now + 0.01));
      } catch (e) {
        /* already stopped */
      }
    });
    this.active = [];
  },
  on() {
    return Store.s.settings.sound !== false;
  },
  ctx() {
    return AudioEngine.ensure();
  },
  out() {
    this.ctx();
    return AudioEngine.master;
  },
  noiseBuffer() {
    if (!this.noise) {
      const ctx = this.ctx();
      const b = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      this.noise = b;
    }
    return this.noise;
  },
  /* ---------- keyboard sounds ---------- */
  // start a note at t (or now); returns a handle for stop(). The piano is the app's piano voice, played
  // live here (scheduled piano notes go through play()).
  start(sound, m, vel = 0.7, t) {
    if (!this.on()) return null;
    const ctx = this.ctx();
    t = Math.max(t || 0, ctx.currentTime);
    if (sound === 'piano' || !SOUND_BY[sound]) return { piano: AudioEngine.noteOn(m, vel) };
    const f = freq(m);
    const out = ctx.createGain();
    out.connect(this.out());
    const nodes = [];
    const osc = (type, fr, detune = 0) => {
      const o = ctx.createOscillator();
      o.type = type;
      o.frequency.value = fr;
      o.detune.value = detune;
      nodes.push(o);
      return o;
    };
    let release = 0.1;
    if (sound === 'epiano') {
      // two-operator FM: a bright, bell-like attack that mellows, like a tine piano
      const car = osc('sine', f);
      const mod = osc('sine', f);
      const idx = ctx.createGain();
      idx.gain.setValueAtTime(f * 2.2 * vel, t);
      idx.gain.exponentialRampToValueAtTime(f * 0.25, t + 1.2);
      mod.connect(idx).connect(car.frequency);
      car.connect(out);
      const peak = 0.3 * (0.4 + vel);
      out.gain.setValueAtTime(0, t);
      out.gain.linearRampToValueAtTime(peak, t + 0.006);
      out.gain.exponentialRampToValueAtTime(peak * 0.3, t + 1.6);
      out.gain.exponentialRampToValueAtTime(0.001, t + 6);
      release = 0.25;
    } else if (sound === 'pad') {
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = Math.min(4000, 700 + f * 2);
      lp.Q.value = 0.6;
      [-8, 8].forEach(d => osc('sawtooth', f, d).connect(lp));
      osc('sine', f / 2).connect(lp);
      lp.connect(out);
      const peak = 0.11 * (0.5 + vel);
      out.gain.setValueAtTime(0, t);
      out.gain.linearRampToValueAtTime(peak, t + 0.35);
      release = 0.7;
    } else if (sound === 'harp') {
      // plucked: a bright attack through a closing low-pass, ringing on for a few seconds
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(Math.min(6000, f * 10), t);
      lp.frequency.exponentialRampToValueAtTime(Math.max(400, f * 2.5), t + 0.6);
      osc('triangle', f).connect(lp);
      const h2 = ctx.createGain();
      h2.gain.value = 0.25;
      osc('sine', f * 2)
        .connect(h2)
        .connect(lp);
      lp.connect(out);
      const peak = 0.28 * (0.4 + vel);
      out.gain.setValueAtTime(0, t);
      out.gain.linearRampToValueAtTime(peak, t + 0.003);
      out.gain.exponentialRampToValueAtTime(peak * 0.35, t + 0.5);
      out.gain.exponentialRampToValueAtTime(0.001, t + Math.max(1.5, 4.5 - (m - 48) / 12));
      release = 0.6;
    } else if (sound === 'flute') {
      // a soft sine with a little breath, and a gentle vibrato that sets in once the note is held
      const tone = osc('sine', f);
      const tri = ctx.createGain();
      tri.gain.value = 0.12;
      osc('triangle', f * 2)
        .connect(tri)
        .connect(out);
      const lfo = osc('sine', 5.2);
      const depth = ctx.createGain();
      depth.gain.setValueAtTime(0, t);
      depth.gain.linearRampToValueAtTime(f * 0.006, t + 0.6);
      lfo.connect(depth).connect(tone.frequency);
      tone.connect(out);
      const breath = ctx.createBufferSource();
      breath.buffer = this.noiseBuffer();
      breath.loop = true;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = Math.min(8000, f * 2);
      bp.Q.value = 2;
      const bg = ctx.createGain();
      bg.gain.setValueAtTime(0.05 * vel, t);
      bg.gain.exponentialRampToValueAtTime(0.008, t + 0.25);
      breath.connect(bp).connect(bg).connect(out);
      nodes.push(breath);
      const peak = 0.2 * (0.5 + vel);
      out.gain.setValueAtTime(0, t);
      out.gain.linearRampToValueAtTime(peak, t + 0.06);
      release = 0.12;
    } else {
      // bass: saw and square through a closing low-pass
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.Q.value = 4;
      lp.frequency.setValueAtTime(Math.min(3000, f * 8), t);
      lp.frequency.exponentialRampToValueAtTime(Math.max(140, f * 2), t + 0.25);
      osc('sawtooth', f).connect(lp);
      osc('square', f, -5).connect(lp);
      lp.connect(out);
      const peak = 0.22 * (0.5 + vel);
      out.gain.setValueAtTime(0, t);
      out.gain.linearRampToValueAtTime(peak, t + 0.005);
      out.gain.exponentialRampToValueAtTime(peak * 0.6, t + 0.3);
      release = 0.07;
    }
    nodes.forEach(o => o.start(t));
    const h = { out, nodes, release };
    h.v = this.track(out, nodes, Infinity); // until stop() says when it ends
    return h;
  },
  stop(h, t) {
    if (!h || h.stopped) return;
    h.stopped = true;
    const ctx = this.ctx();
    t = Math.max(t || 0, ctx.currentTime);
    if (h.piano !== undefined) return AudioEngine.noteOff(h.piano);
    const g = h.out.gain;
    if (g.cancelAndHoldAtTime) g.cancelAndHoldAtTime(t);
    else g.cancelScheduledValues(t);
    g.setTargetAtTime(0.0001, t, h.release / 3);
    h.nodes.forEach(o => o.stop(t + h.release * 2 + 0.05));
    h.v.end = t + h.release * 2 + 0.05;
  },
};

// ---- music/thru.js ----
/* Your piano played through this device: what you play on the piano sounds here with the Jam's sounds,
   one sound for the whole keyboard or one for each side of a split point (bass on the left, flute on the
   right, say). The piano sounds too unless its own volume is turned down. Settings are kept with the
   other settings: {on, split (the lowest key of the right side; 0 for no split), left, right}. */

const Thru = {
  offs: [],
  held: new Map(),
  pedal: false,
  sustained: new Map(), // keys released while the pedal is down: they ring until it comes up
  get cfg() {
    return Store.s.settings.thru;
  },
  // the sound a key plays: the right side's, or the left side's below the split
  soundFor(m) {
    const c = this.cfg;
    return c.split && m < c.split ? c.left : c.right;
  },
  // listen while a screen wants it (the Jam); returns the function that stops listening
  listen() {
    this.stop();
    this.offs = [Input.on(ev => this.noteOn(ev)), Input.onOff(ev => this.noteOff(ev))];
    return () => this.stop();
  },
  stop() {
    this.offs.forEach(f => f());
    this.offs = [];
    this.held.forEach(h => Sounds.stop(h));
    this.sustained.forEach(h => Sounds.stop(h));
    this.held.clear();
    this.sustained.clear();
    this.pedal = false;
  },
  // only the piano's notes: the screen keys already sound by themselves
  noteOn(ev) {
    if (!this.cfg.on || ev.src !== 'midi' || ev.m == null) return;
    Sounds.stop(this.held.get(ev.m));
    Sounds.stop(this.sustained.get(ev.m));
    this.sustained.delete(ev.m);
    this.held.set(ev.m, Sounds.start(this.soundFor(ev.m), ev.m, ev.vel));
  },
  noteOff(ev) {
    if (ev.src !== 'midi') return;
    if (ev.pedal != null) {
      this.pedal = ev.pedal;
      if (!ev.pedal) {
        this.sustained.forEach(h => Sounds.stop(h));
        this.sustained.clear();
      }
      return;
    }
    const h = this.held.get(ev.m);
    this.held.delete(ev.m);
    if (this.pedal && h) this.sustained.set(ev.m, h);
    else Sounds.stop(h);
  },
};

  [N(1, 0, 4)],
  [N(1, 1, 4), N(2, -1, 4)],
  [N(2, 0, 4)],
  [N(3, 0, 4)],

   they take the letters that read easiest: the fewest accidentals, a letter used twice only when it must
   be (B whole tone is B C♯ D♯ F G A, not B C♯ D♯ E♯ F𝄪 G𝄪). */
function spellFrom(tonic, mood) {
  if (mood.semis.length === 7) return mood.semis.map((s, i) => (i === 0 ? tonic : spellAbove(tonic, i, s)));
  let best = null;
  const walk = (i, prevL, out, cost) => {
    if (best && cost >= best.cost) return;
    if (i === mood.semis.length) {
      best = { cost, notes: out.slice() };
      return;
    }
    for (let L = prevL; L <= prevL + 2 && L <= 6; L++) {
      const n = spellAbove(tonic, L, mood.semis[i]);
      if (Math.abs(n.a) > 2) continue;
      // accidentals, a letter used twice, a letter other than the degree's usual one (a minor 3rd is a
      // 3rd, not a raised 2nd), and sharps mixed with flats all cost
      const mixed = n.a !== 0 && out.some(x => x.a !== 0 && Math.sign(x.a) !== Math.sign(n.a));

        (L === prevL ? 1.5 : 0) +
        Math.abs(L - (mood.usual ? mood.usual[i] : USUAL_LETTER[mood.semis[i]])) * 0.6 +

// the scale of a mood from pitch class pc, one octave up from the tonic (spelled notes, octave 4)
/* a mood in a key, spelled: of the tonic's two names (C♯ or D♭), the one whose scale needs fewer

  lydian: ['major', -5],

/* The other scales (pentatonics, blues, whole tone, diminished, Hirajoshi, double harmonic) have no

// fingers for keys played moving outward from the thumb (right hand up, left hand down), in that order
function fingerOutward(midis, hand = SCALE, { open = false, first = 0, end = 0 } = {}) {
  const n = midis.length;
  const last = open ? -1 : n - 1; // open: the last note is not an end, the run goes on from it
  const black = midis.map(onBlack);

  for (let f = 1; f <= 5; f++) {

    for (let f2 = 1; f2 <= 5; f2++)

/* fingers for a run of several octaves that repeats one octave's pattern, as published fingerings do.

  if (octs === 1 && reach !== ARP) return flip(fingerOutward(outward, reach)); // (arpeggios keep their 2-octave pattern)

    if (r && (!cyc || r.cost < cyc.cost)) cyc = r;

  const prev = seq[seq.length - 1];

    for (let f = prev + 1; f <= 5; f++)

      ['maj', 'min', 'dim', 'aug', 'sus4', 'sus2']
        .filter(t => CHORD_TONES[t].every(x => has(s + x)))
        .slice(0, 1)
        .map(t => ({ triad: [s, t], seventh: t === 'dim' && has(s + 9) ? [s, 'dim7'] : null })),
    );
  }
  return list
    .filter(c => c.triad[1])
    .map(c => ({
      ...chordInfo(moodId, pc, c.triad),
      seventh: c.seventh ? chordInfo(moodId, pc, c.seventh) : null,
      signature: c.triad[0] === M.sigChord,
    }));
}

/* ---------- voicings: chords that move as little as possible ----------
   Each chord takes the inversion (and octave) nearest the one before, so the hand stays in one place
   while the harmony changes: voice leading. Right hand around middle C; left hand from E2 to D♯3 for the
   root, the chord just above. */
function nearestVoicing(pcs, prev, lo, hi) {
  let best = null;
  for (let base = lo; base <= hi; base++) {
    if (pcs[0] !== base % 12 && !pcs.includes(base % 12)) continue;
    // a close voicing with its lowest note at base
    const start = pcs.indexOf(base % 12);
    const v = [];
    let m = base;
    for (let k = 0; k < pcs.length; k++) {
      const p = pcs[(start + k) % pcs.length];
      while (m % 12 !== p) m++;
      v.push(m);
    }
    const cost = prev
      ? v.reduce((a, x, i) => a + Math.abs(x - prev[Math.min(i, prev.length - 1)]), 0)
      : Math.abs(v[0] - (lo + hi) / 2);
    if (!best || cost < best.cost) best = { v, cost };
  }
  return best.v;
}
function voiceProgression(moodId, pc, chords, { lo = 55, hi = 66 } = {}) {
  const tonic = moodScale(moodId, pc)[0];
  const t = ((midiOf(tonic) % 12) + 12) % 12;
  let prev = null;
  return chords.map(([s, type]) => {
    const pcs = CHORD_TONES[type].slice(0, 3).map(x => (t + s + x) % 12);
    const right = nearestVoicing(pcs, prev, lo, hi);
    prev = right;
    const root = 40 + ((t + s - 40 + 120) % 12);
    return { right, root, info: chordInfo(moodId, pc, [s, type]) };
  });
}

/* ---------- drills: a progression, an arpeggio ---------- */
// the progression, one chord a step: the right hand's voiced chord, the left hand's root, or both
/* the fingers for a close triad, by its inversion: root position and 2nd inversion 1 3 5 (left hand 5 3 1
   and 5 2 1), 1st inversion 1 2 5 (left hand 5 3 1) */
function triadFingers(ms, hand) {
  const [a, b, c] = ms;
  // (the wide gap, a 4th or more, is at the top in 1st inversion and at the bottom in 2nd)
  const inv = c - b >= 5 && c - b > b - a ? 1 : b - a >= 5 && b - a > c - b ? 2 : 0;
  return hand === 'rh'
    ? [
        [1, 3, 5],
        [1, 2, 5],
        [1, 3, 5],
      ][inv]
    : [
        [5, 3, 1],
        [5, 3, 1],
        [5, 2, 1],
      ][inv];
}

function progressionRun(moodId, pc, prog, hand) {
  const V = voiceProgression(moodId, pc, MOOD_BY[moodId].progs[prog].chords);
  const sp = spellerFor(moodSig(moodId, pc));
  const steps = V.map((v, i) => {
    const notes = [];
    if (hand !== 'lh') v.right.forEach(m => notes.push({ n: sp(m), st: 't', fcls: 'rh' }));
    if (hand !== 'rh') notes.push({ n: sp(v.root), st: 'b', fcls: 'lh', f: 5 });
    if (hand !== 'lh') triadFingers(v.right, 'rh').forEach((f, k) => (notes[k].f = f));
    return { midis: notes.map(x => midiOf(x.n)), notes, beat: i * 2, chord: v.info.name };
  });
  return {
    steps,
    sig: moodSig(moodId, pc),
    clef: hand === 'ht' ? 'grand' : hand === 'rh' ? 'treble' : 'bass',
  };
}

// an arpeggio of one chord, root position, up `octs` octaves and back, with fingering for each hand:
// white-root major and minor triads use the standard fingering; the rest is worked out like the scales
function arpeggioRun(moodId, pc, chord, hand, octs) {
  const info = chordInfo(moodId, pc, chord);
  const tones = CHORD_TONES[chord[1]];
  const root = info.notes[0];
  const side = h => {
    const rm = midiOf(root);
    const shift = (rm > 64 ? -1 : 0) + (h === 'lh' ? -1 : 0);
    const up = [];
    for (let o = 0; o < octs; o++) info.notes.forEach(n => up.push(N(n.l, n.a, n.o + shift + o)));
    up.push(N(root.l, root.a, root.o + shift + octs));
    const ms = up.map(midiOf);
    let f;
    const triad = tones.length === 3 && (chord[1] === 'maj' || chord[1] === 'min') && !onBlack(ms[0]);
    if (triad && h === 'rh') f = ms.map((_, i) => (i === ms.length - 1 ? 5 : [1, 2, 3][i % 3]));
    else if (triad) {
      // the left hand takes 3 on a black third (D, A, E major), 4 otherwise
      const third = onBlack(ms[1]) ? 3 : 4;
      f = ms.map((_, i) => (i === 0 ? 5 : [1, third, 2][i % 3]));
    } else f = octaveFingers(ms.slice(0, tones.length + 1), octs, h, ARP);
    return { notes: up.concat(up.slice(0, -1).reverse()), fingers: f.concat(f.slice(0, -1).reverse()) };
  };
  const R = side('rh');
  const L = side('lh');
  const note = (S, h, i) => ({ n: S.notes[i], st: h === 'rh' ? 't' : 'b', f: S.fingers[i], fcls: h });
  const steps = R.notes.map((_, i) => {
    const notes =
      hand === 'ht' ? [note(R, 'rh', i), note(L, 'lh', i)] : [note(hand === 'rh' ? R : L, hand, i)];
    return { midis: notes.map(x => midiOf(x.n)), notes, beat: i / 2 };
  });
  return {
    steps,
    sig: moodSig(moodId, pc),
    clef: hand === 'ht' ? 'grand' : hand === 'rh' ? 'treble' : 'bass',
    info,
  };
}

/* a chord's inversions: root position, 1st, 2nd, root position an octave up, and back down. The right hand
   starts from the root between A3 and G♯4 (C at middle C), the left hand an octave lower */
function inversionRun(moodId, pc, [semis, type], hand) {
  const t = ((midiOf(moodScale(moodId, pc)[0]) % 12) + 12) % 12;
  const pcs = CHORD_TONES[type].slice(0, 3).map(x => (t + semis + x) % 12);
  const root = 57 + ((pcs[0] - 57 + 120) % 12);
  const sp = spellerFor(moodSig(moodId, pc));
  const shapes = [0, 1, 2, 3].map(inv => {
    const v = [];
    for (let k = 0; k < 3; k++) {
      let m = root + (inv === 3 ? 12 : 0);
      const p = pcs[((inv % 3) + k) % 3];
      if (inv < 3) while (((m % 12) + 12) % 12 !== p || (v.length && m <= v[v.length - 1])) m++;
      else m = root + 12 + CHORD_TONES[type][k];
      if (inv < 3 && k === 0) while (m - 12 >= root) m -= 12;
      v.push(m);
    }
    return v;
  });
  const order = [0, 1, 2, 3, 2, 1, 0];
  const steps = order.map((inv, i) => {
    const notes = [];
    const v = shapes[inv];
    if (hand !== 'lh') {
      const f = triadFingers(v, 'rh');
      v.forEach((m, k) => notes.push({ n: sp(m), st: 't', fcls: 'rh', f: f[k] }));
    }
    if (hand !== 'rh') {
      const f = triadFingers(v, 'lh');
      v.forEach((m, k) => notes.push({ n: sp(m - 12), st: 'b', fcls: 'lh', f: f[k] }));
    }
    return { midis: notes.map(x => midiOf(x.n)), notes, beat: i * 2 };
  });
  return {
    steps,
    sig: moodSig(moodId, pc),
    clef: hand === 'ht' ? 'grand' : hand === 'rh' ? 'treble' : 'bass',
    info: chordInfo(moodId, pc, [semis, type]),
  };
}

/* around the circle of fifths: each major key's home chord, C G D … F C, each the nearest shape to the
   last; the left hand plays the roots. Each chord is spelled in its own key (D♭, not C♯) */
function circleRun(hand) {
  let prev = null;
  const keys = [...CIRCLE, 0];
  const steps = keys.map((pc, i) => {
    const right = nearestVoicing([pc, (pc + 4) % 12, (pc + 7) % 12], prev, 55, 66);
    prev = right;
    const sp = spellerFor(moodSig('major', pc));
    const root = 40 + ((pc - 40 + 120) % 12);
    const notes = [];
    if (hand !== 'lh') {
      const f = triadFingers(right, 'rh');
      right.forEach((m, k) => notes.push({ n: sp(m), st: 't', fcls: 'rh', f: f[k] }));
    }
    if (hand !== 'rh') notes.push({ n: sp(root), st: 'b', fcls: 'lh', f: 5 });
    return { midis: notes.map(x => midiOf(x.n)), notes, beat: i * 2, chord: tonicName('major', pc) };
  });
  return { steps, sig: 0, clef: hand === 'ht' ? 'grand' : hand === 'rh' ? 'treble' : 'bass' };
}

/* ---------- how moods relate ----------
   one note different, same home: natural minor → harmonic minor raises the 7th. And the same notes from
   another home: A natural minor has C major's notes. */
const DEGREE_NAME = ['home', '2nd', '2nd', '3rd', '3rd', '4th', '', '5th', '6th', '6th', '7th', '7th'];
// (six half steps up is the raised 4th or the lowered 5th: which one depends on where it moves to)
const degreeName = (x, toward) => DEGREE_NAME[x] || (toward > x ? '5th' : '4th');
function moodNeighbors(id) {
  const A = MOOD_BY[id].semis;
  const out = [];
  for (const B of MOODS) {
    if (B.id === id) continue;
    const only = (P, Q) => P.semis.filter(x => !Q.includes(x));
    const a = A.filter(x => !B.semis.includes(x));
    const b = only(B, A);
    if (a.length === 1 && b.length === 1 && Math.abs(a[0] - b[0]) === 1)
      out.push({ id: B.id, change: `${b[0] > a[0] ? 'raise' : 'lower'} the ${degreeName(a[0], b[0])}` });
    else if (!a.length && b.length === 1) {
      const n = midiNameless(b[0]);
      out.push({ id: B.id, change: `add ${n}` });
    } else if (a.length === 1 && !b.length) out.push({ id: B.id, change: `leave out ${midiNameless(a[0])}` });
  }
  return out;
}
// "the low 5th", "the 6th": a note of a scale by its distance from home
const midiNameless = x =>
  ({ 1: 'the low 2nd', 3: 'the minor 3rd', 6: 'the low 5th', 8: 'the low 6th', 10: 'the low 7th' })[x] ||
  `the ${DEGREE_NAME[x]}`;

// the same notes from another home: [{id, semis}] (this mood's notes, played from semis above its home)
function moodRelatives(id) {
  const A = new Set(MOOD_BY[id].semis);
  const out = [];
  for (const B of MOODS.filter(x => x.id !== id))
    for (let o = 1; o < 12; o++)
      if (B.semis.length === A.size && A.has(o) && B.semis.every(x => A.has((x + o) % 12)))
        out.push({ id: B.id, semis: o });
  return out;
}

// the key of a mood with the fewest black keys (ties: the first around the circle from C): where a mood
// is easiest to see and to start
function plainestKey(mood) {
  const blacks = pc => MOOD_BY[mood].semis.filter(x => [1, 3, 6, 8, 10].includes((pc + x) % 12)).length;
  return CIRCLE.reduce((best, pc) => (blacks(pc) < blacks(best) ? pc : best), CIRCLE[0]);
}

// ---- music/render.js ----
/* Drawing music: staff notation for drills and real scores, rhythm lines and the keyboard. */

const SS = 10,
  GS = SS / 250; // staff space, glyph scale

function glyph(name, x, y, cls = 'gl', extra = '') {
  return `<path class="${cls}" d="${GLYPHS[name]}" transform="translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${GS},${-GS})" ${extra}/>`;
}

/* Staff geometry. Treble lines: dia 30..38 (E4..F5). Bass lines: dia 18..26 (G2..A3). */
function staffGeom(clef, opts = {}) {
  const top = opts.top ?? 40;
  const g = { clef, top };
  if (clef === 'treble') {
    g.yT = d => top + (38 - d) * 5;
    g.lines = [{ y: top }];
    g.h = top + 40 + (opts.bottom ?? 40);
  } else if (clef === 'bass') {
    g.yB = d => top + (26 - d) * 5;
    g.h = top + 40 + (opts.bottom ?? 40);
  } else {
    const yb = top + 90;
    g.yT = d => top + (38 - d) * 5;
    g.yB = d => yb + (26 - d) * 5;
    g.yb = yb;
    g.h = yb + 40 + (opts.bottom ?? 40);
  }
  g.y = (d, st) => ((st === 'b' ? g.yB : g.yT) || g.yT || g.yB)(d);
  return g;
}

function staffLines(g, x0, x1) {
  let s = '';
  const draw = ytop => {
    for (let i = 0; i < 5; i++)
      s += `<line class="ln" x1="${x0}" x2="${x1}" y1="${ytop + i * SS}" y2="${ytop + i * SS}"/>`;
  };
  if (g.clef === 'treble') draw(g.top);
  else if (g.clef === 'bass') draw(g.top);
  else {
    draw(g.top);
    draw(g.yb);
    s += `<line class="ln" x1="${x0}" x2="${x0}" y1="${g.top}" y2="${g.yb + 40}" style="stroke-width:1.4"/>`;
  }
  return s;
}

function clefsAndSig(g, sig, x = 6) {
  let s = '';
  const doClef = which => {
    if (which === 'treble') s += glyph('gClef', x, g.yT(32));
    else s += glyph('fClef', x, g.yB(24));
  };
  if (g.clef !== 'bass') doClef('treble');
  if (g.clef !== 'treble') doClef('bass');
  let xx = x + 34;
  const sigs = [];
  if (g.clef !== 'bass') sigs.push(['t', keySigNotes(sig, 'treble')]);
  if (g.clef !== 'treble') sigs.push(['b', keySigNotes(sig, 'bass')]);
  sigs.forEach(([st, arr]) =>
    arr.forEach((k, i) => {
      s += glyph(k.a > 0 ? 'sharp' : 'flat', xx + i * 9, g.y(k.d, st));
    }),
  );
  xx += Math.abs(sig) * 9 + (sig ? 8 : 0);
  return { s, x: xx };
}

function timeSig(g, top, bot, x) {
  let s = '';
  const put = (st, lineTop) => {
    s += glyph('t' + top, x, lineTop + 10) + glyph('t' + bot, x, lineTop + 30);
  };
  if (g.clef === 'bass') put('b', g.top);
  else {
    put('t', g.top);
    if (g.clef === 'grand') put('b', g.yb);
  }
  return s;
}

function ledgers(g, d, st, x) {
  let s = '';
  const L = yy =>
    (s += `<line class="ln" x1="${x - 4}" x2="${x + 16}" y1="${yy}" y2="${yy}" style="stroke-width:1.2"/>`);
  const lo = st === 'b' ? 18 : 30,
    hi = st === 'b' ? 26 : 38;
  for (let k = lo - 2; k >= d; k -= 2) L(g.y(k, st));
  for (let k = hi + 2; k <= d; k += 2) L(g.y(k, st));
  return s;
}

/* items: [{notes:[{n, st:'t'|'b', cls, f, fcls}], dur, x}] — notes in one item share an x (chord) */
function staffSVG({
  clef = 'treble',
  sig = 0,
  items = [],
  spacing = 30,
  minW = 0,
  showAcc = 'auto',
  time = null,
  startX = null,
  bottom,
  top,
  barEvery = 0,
  labels = false,
} = {}) {
  const g = staffGeom(clef, { bottom, top });
  const head = clefsAndSig(g, sig);
  let x = startX ?? head.x + 8;
  let body = head.s;
  if (time) {
    body += timeSig(g, time[0], time[1], head.x);
    x += 22;
  }
  const xs = [];
  // With bar lines, accidentals last to the end of the bar: a note needs a sign when it differs from what
  // is in force on its line or space (the key signature, or an earlier accidental in the same bar).
  // Without bar lines (scales, chords), every note differing from the key signature shows its sign.
  let inForce = new Map();
  const place = nn => `${nn.st || ''}:${diaOf(nn.n)}`;
  const current = nn =>
    barEvery && inForce.has(place(nn)) ? inForce.get(place(nn)) : sigAccidentalFor(sig, nn.n.l);
  items.forEach((it, i) => {
    const needAcc = nn => (showAcc === 'all' ? nn.n.a !== 0 : nn.n.a !== current(nn) || !!nn.natural);
    const nAcc = (it.notes || []).filter(needAcc).length;
    if (it.x == null && nAcc) x += nAcc > 1 ? 18 : 9;
    const ix = it.x ?? x;
    xs.push(ix);
    const sorted = (it.notes || []).slice().sort((a, b) => diaOf(a.n) - diaOf(b.n));
    let prevD = -99,
      prevShift = false;
    // accidentals stagger in columns from the top note down
    const accOrder = sorted.filter(needAcc).reverse();
    const accX = new Map();
    accOrder.forEach((nn, k) => accX.set(nn, ix - 12 - (k % 2) * 9));
    // fingers for a chord in one hand are stacked beside it (low to high), not one per note head
    const stOf = nn => nn.st || (diaOf(nn.n) >= 28 && clef !== 'bass' ? 't' : clef === 'treble' ? 't' : 'b');
    const handOf = (nn, st) => nn.fcls || (st === 'b' ? 'lh' : 'rh');
    const fingered = sorted.filter(nn => nn.f);
    const stacked = new Set(
      ['rh', 'lh'].filter(h => fingered.filter(nn => handOf(nn, stOf(nn)) === h).length > 1),
    );
    sorted.forEach(nn => {
      const st = stOf(nn);
      const d = diaOf(nn.n);
      const y = g.y(d, st);
      const shift = d - prevD === 1 && !prevShift;
      prevShift = shift;
      prevD = d; // seconds: displace the upper note
      const hx = shift ? ix + 11.4 : ix;
      body += ledgers(g, d, st, ix) + (shift ? ledgers(g, d, st, ix + 11.4) : '');
      if (needAcc(nn)) {
        const nm = nn.n.a > 0 ? 'sharp' : nn.n.a < 0 ? 'flat' : 'natural';
        body += glyph(nm, accX.get(nn), y, 'gl note ' + (nn.cls || ''));
      }
      const head = it.dur === 'w' ? 'nhW' : it.dur === 'h' ? 'nhH' : 'nhB';
      body += glyph(head, hx, y, 'note ' + (nn.cls || ''));
      if (nn.f && !stacked.has(handOf(nn, st))) {
        const isL = (nn.fcls || '') === 'lh' || (nn.fcls == null && st === 'b');
        const fy = isL
          ? Math.max(y + 18, (st === 'b' ? g.yB(18) : g.yT(30)) + 14)
          : Math.min(y - 12, (st === 'b' ? g.yB(26) : g.yT(38)) - 8);
        body += `<text class="fing ${nn.fcls || (isL ? 'lh' : 'rh')}" x="${ix + 6}" y="${fy}">${nn.f}</text>`;
      }
      if (labels && nn.lbl) body += `<text class="lbl" x="${ix + 6}" y="${g.h - 8}">${esc(nn.lbl)}</text>`;
    });
    stacked.forEach(h => {
      const ns = fingered.filter(nn => handOf(nn, stOf(nn)) === h);
      const st = stOf(ns[0]);
      const ys = ns.map(nn => g.y(diaOf(nn.n), st));
      ns.forEach((nn, k) => {
        const fy =
          h === 'lh'
            ? Math.max(Math.max(...ys) + 18, (st === 'b' ? g.yB(18) : g.yT(30)) + 14) +
              (ns.length - 1 - k) * 10
            : Math.min(Math.min(...ys) - 12, (st === 'b' ? g.yB(26) : g.yT(38)) - 8) - k * 10;
        body += `<text class="fing ${h}" x="${ix + 6}" y="${fy}">${nn.f}</text>`;
      });
    });
    if (it.fstack && sorted.length) {
      // chord fingering, low→high, stacked
      const isL = it.fcls === 'lh';
      const st = sorted[0].st || (clef === 'bass' ? 'b' : 't');
      const lowY = g.y(diaOf(sorted[0].n), st),
        highY = g.y(diaOf(sorted[sorted.length - 1].n), st);
      it.fstack.forEach((f, k) => {
        const fy = isL
          ? Math.max(lowY + 18, (st === 'b' ? g.yB(18) : g.yT(30)) + 14) + (it.fstack.length - 1 - k) * 10
          : Math.min(highY - 12, (st === 'b' ? g.yB(26) : g.yT(38)) - 8) - k * 10;
        body += `<text class="fing ${it.fcls || 'rh'}" x="${ix + 6}" y="${fy}">${f}</text>`;
      });
    }
    if (it.stem && sorted.length) {
      // stem up, single notes only
      const nn = sorted[sorted.length - 1];
      const st = nn.st || 't';
      const y = g.y(diaOf(nn.n), st);
      body += `<line class="stem" x1="${ix + 11.3}" x2="${ix + 11.3}" y1="${y - 1}" y2="${y - 34}"/>`;
    }
    (it.notes || []).forEach(nn => inForce.set(place(nn), nn.n.a));
    if (barEvery && (i + 1) % barEvery === 0) inForce = new Map();
    if (barEvery && (i + 1) % barEvery === 0 && i < items.length - 1) {
      const bx = ix + spacing / 2 + 4;
      body += `<line class="ln" x1="${bx}" x2="${bx}" y1="${g.top}" y2="${clef === 'grand' ? g.yb + 40 : g.top + 40}"/>`;
    }
    if (it.x == null) x += spacing;
  });
  const W = Math.max(minW, (xs.length ? Math.max(...xs) : x) + 30);
  const lines = staffLines(g, 2, W - 2);
  return {
    svg: `<svg class="staff" viewBox="0 0 ${W} ${g.h}" role="img" aria-label="Staff notation">${lines}${body}</svg>`,
    W,
    g,
    xs,
  };
}

/* ---------- keyboard ---------- */
const isBlack = m => [1, 3, 6, 8, 10].includes(((m % 12) + 12) % 12);

function kbSVG({ from = 48, to = 72, marks = {}, interactive = true, cLabels = true, h = 100 } = {}) {
  while (isBlack(from)) from--;
  while (isBlack(to)) to++;
  const WW = 24,
    BW = 14,
    BH = h * 0.62;
  let whites = '',
    blacks = '',
    labels = '',
    wi = 0;
  const wx = {};
  for (let m = from; m <= to; m++)
    if (!isBlack(m)) {
      wx[m] = wi * WW;
      wi++;
    }
  const W = wi * WW;
  for (let m = from; m <= to; m++) {
    const mk = marks[m] || {};
    const cls = mk.cls || '';
    if (!isBlack(m)) {
      const x = wx[m];
      whites += `<rect class="w ${cls}" data-m="${m}" x="${x + 0.5}" y="0.5" width="${WW - 1}" height="${h - 1}" rx="2"/>`;
      if (mk.f != null) labels += fingerLabel(x + WW / 2, h - 16, 8, mk.fc || cls, mk.f);
      else if (cLabels && m % 12 === 0)
        labels += `<text class="cl" x="${x + WW / 2}" y="${h - 7}">C${m / 12 - 1}</text>`;
    } else {
      const x = wx[m - 1] + WW - BW / 2;
      blacks += `<rect class="b ${cls}" data-m="${m}" x="${x}" y="0" width="${BW}" height="${BH}" rx="1.5"/>`;
      if (mk.f != null) labels += fingerLabel(x + BW / 2, BH - 12, 7, mk.fc || cls, mk.f, 'font-size:9px');
    }
  }
  const style = `max-width:${Math.round(W * 1.7)}px;margin:0 auto`;
  return `<svg class="kb" viewBox="0 0 ${W} ${h}" style="${style}" ${interactive ? 'data-play="1"' : ''}
    role="img" aria-label="Piano keyboard">${whites}${blacks}${labels}</svg>`;
}

// a finger number in a circle on a key
function fingerLabel(cx, cy, r, cls, finger, style = '') {
  return (
    `<circle class="fc ${cls}" cx="${cx}" cy="${cy}" r="${r}"/>` +
    `<text class="fn ${cls}" x="${cx}" y="${cy}"${style ? ` style="${style}"` : ''}>${esc(finger)}</text>`
  );
}

// fit a range around a list of midis, padded to whole octaves-ish
function kbRange(midis, pad = 2, minSpan = 24) {
  let lo = Math.min(...midis) - pad,
    hi = Math.max(...midis) + pad;
  while (hi - lo < minSpan) {
    lo--;
    hi++;
  }
  return { from: lo, to: hi };
}

function flashKey(svg, m, cls = 'down', ms = 260) {
  if (!svg) return;
  const el = svg.querySelector(`[data-m="${m}"]`);
  if (!el) return;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), ms);
}

/* ---------- real music on a grand staff ----------
   Horizontal position follows time (with a minimum gap), bar lines are drawn, note heads show long
   values (whole and half notes open), accidentals follow the bar rules, clefs follow the score. */
function pieceStaffSVG({
  steps = [],
  ghost = [],
  bars = [],
  total = 0,
  sig = 0,
  time = null,
  clefs = ['t', 'b'],
  clefChanges = [],
  syms = [],
  hl = {},
  ppb = 34,
} = {}) {
  const top0 = 44,
    gap = 52;
  const tops = [top0, top0 + 40 + gap];
  const H = tops[1] + 40 + 46;
  const clefAt = (s, t) => {
    let c = clefs[s];
    clefChanges.forEach(ch => {
      if (ch.s === s && ch.t <= t + 1e-6) c = ch.k;
    });
    return c;
  };
  const topLine = c => (c === 't' ? 38 : 26);
  const yOf = (s, d, t) => tops[s] + (topLine(clefAt(s, t)) - d) * 5;
  // header: clefs, key signature, time signature
  let body = '';
  let x = 8;
  [0, 1].forEach(s => {
    const c = clefs[s];
    body += c === 't' ? glyph('gClef', x, tops[s] + 30) : glyph('fClef', x, tops[s] + 10);
  });
  x += 34;
  [0, 1].forEach(s => {
    const c = clefs[s];
    keySigNotes(sig, c === 't' ? 'treble' : 'bass').forEach((k, i) => {
      body += glyph(k.a > 0 ? 'sharp' : 'flat', x + i * 9, tops[s] + (topLine(c) - k.d) * 5);
    });
  });
  x += Math.abs(sig) * 9 + (sig ? 8 : 0);
  if (time) {
    [0, 1].forEach(s => {
      const n = String(time[0]),
        d = String(time[1]);
      body +=
        [...n].map((ch, i) => glyph('t' + ch, x + i * 11, tops[s] + 10)).join('') +
        [...d].map((ch, i) => glyph('t' + ch, x + i * 11, tops[s] + 30)).join('');
    });
    x += 12 + 11 * Math.max(String(time[0]).length, String(time[1]).length);
  }
  const x0 = x + 10;
  // columns by time
  const cols = new Map();
  const key = t => (Math.round(t * 1000) / 1000).toFixed(3);
  const addCol = (t, n) => {
    const k = key(t);
    if (!cols.has(k)) cols.set(k, { t: +k, notes: [] });
    cols.get(k).notes.push(n);
  };
  steps.forEach((s, i) => s.notes.forEach(n => addCol(s.beat, { ...n, step: i })));
  ghost.forEach(n => addCol(n.t, { ...n, step: -1 }));
  const barSet = bars
    .slice(1)
    .filter(b => b < total - 1e-6)
    .map(b => +key(b));
  const times = [...new Set([...cols.keys()].map(Number).concat(barSet))].sort((a, b) => a - b);
  // accidentals: per bar and staff, the key signature first, then what was written
  const sigAcc = l => sigAccidentalFor(sig, l);
  let accState = new Map();
  const pos = new Map();
  let cx = x0;
  let lastT = null;
  const xBar = new Map();
  times.forEach(t => {
    const k = key(t);
    const isBar = barSet.includes(t) && !xBar.has(k);
    const col = cols.get(k);
    if (isBar) {
      cx = Math.max(cx + (lastT == null ? 0 : 8), x0 + t * ppb - 6);
      xBar.set(k, cx);
      cx += 12;
    }
    if (col) {
      // which notes need an accidental, given the bar so far
      if (isBar || bars.slice(1).some(b => Math.abs(b - t) < 1e-6)) accState = new Map();
      const needs = col.notes.map(n => {
        const sk = (n.st === 'b' ? 1 : 0) + ':' + diaOf(n.n);
        const cur = accState.has(sk) ? accState.get(sk) : sigAcc(n.n.l);
        const need = n.n.a !== cur || n.natural;
        return need;
      });
      col.notes.forEach((n, j) => {
        const sk = (n.st === 'b' ? 1 : 0) + ':' + diaOf(n.n);
        accState.set(sk, n.n.a);
        n.acc = needs[j];
      });
      const accW = col.notes.some(n => n.acc) ? 12 : 0;
      const want = x0 + t * ppb;
      cx = Math.max(want, lastT == null ? x0 : cx + 22) + accW;
      pos.set(k, cx);
      lastT = t;
      cx += 2;
    }
  });
  const W = Math.max(cx + 30, 300);
  // staff lines and the brace line
  let lines = '';
  [0, 1].forEach(s => {
    for (let i = 0; i < 5; i++)
      lines += `<line class="ln" x1="2" x2="${W - 2}" y1="${tops[s] + i * SS}" y2="${tops[s] + i * SS}"/>`;
  });
  // the system's opening and closing bar lines
  lines += `<line class="ln" x1="2" x2="2" y1="${tops[0]}" y2="${tops[1] + 40}" style="stroke-width:1.6"/>`;
  lines += `<line class="ln" x1="${W - 2}" x2="${W - 2}" y1="${tops[0]}" y2="${tops[1] + 40}"/>`;
  xBar.forEach(bx => {
    lines += `<line class="ln bar" x1="${bx}" x2="${bx}" y1="${tops[0]}" y2="${tops[1] + 40}"/>`;
  });
  clefChanges.forEach(ch => {
    const bx = (xBar.get(key(ch.t)) ?? x0 + ch.t * ppb) + 2;
    body +=
      ch.k === 't'
        ? glyph('gClef', bx, tops[ch.s] + 30, 'gl small')
        : glyph('fClef', bx, tops[ch.s] + 10, 'gl small');
  });
  const xs = steps.map(s => pos.get(key(s.beat)));
  // notes
  cols.forEach((col, k) => {
    const ix = pos.get(k);
    if (ix == null) return;
    [0, 1].forEach(s => {
      const ns = col.notes.filter(n => (n.st === 'b' ? 1 : 0) === s).sort((a, b) => diaOf(a.n) - diaOf(b.n));
      let prevD = -99,
        prevShift = false;
      let accCol = 0;
      ns.slice()
        .reverse()
        .forEach(n => {
          if (n.acc) {
            n.ax = ix - 12 - (accCol % 2) * 9;
            accCol++;
          }
        });
      ns.forEach(n => {
        const d = diaOf(n.n);
        const y = yOf(s, d, col.t);
        const shift = d - prevD === 1 && !prevShift;
        prevShift = shift;
        prevD = d;
        const hx = shift ? ix + 11.4 : ix;
        const c = clefAt(s, col.t);
        const lo = topLine(c) - 8,
          hi = topLine(c);
        for (let dd = lo - 2; dd >= d; dd -= 2)
          lines += `<line class="ln" x1="${ix - 4}" x2="${ix + 16 + (shift ? 11 : 0)}" y1="${yOf(s, dd, col.t)}" y2="${yOf(s, dd, col.t)}" style="stroke-width:1.2"/>`;
        for (let dd = hi + 2; dd <= d; dd += 2)
          lines += `<line class="ln" x1="${ix - 4}" x2="${ix + 16 + (shift ? 11 : 0)}" y1="${yOf(s, dd, col.t)}" y2="${yOf(s, dd, col.t)}" style="stroke-width:1.2"/>`;
        const cls =
          n.step < 0
            ? 'ghost'
            : hl.bad && hl.bad.has(n.step)
              ? 'bad'
              : hl.ok && hl.ok.has(n.step)
                ? 'ok'
                : hl.cur === n.step
                  ? 'cur'
                  : '';
        if (n.acc) {
          const nm =
            n.n.a > 0
              ? n.n.a > 1
                ? 'dsharp'
                : 'sharp'
              : n.n.a < 0
                ? n.n.a < -1
                  ? 'dflat'
                  : 'flat'
                : 'natural';
          body += glyph(
            GLYPHS[nm] ? nm : n.n.a > 0 ? 'sharp' : n.n.a < 0 ? 'flat' : 'natural',
            n.ax,
            y,
            'gl note ' + cls,
          );
        }
        const dur = n.d || 0;
        const head = dur >= 3.9 ? 'nhW' : dur >= 1.9 ? 'nhH' : 'nhB';
        if (dur === 0 && n.step >= 0)
          body += `<g transform="translate(${hx + 3} ${y}) scale(.68) translate(${-hx - 3} ${-y})">${glyph('nhB', hx, y, 'note ' + cls)}</g>`;
        else body += glyph(head, hx, y, 'note ' + cls);
        if (n.f && n.step >= 0) {
          const above = s === 0;
          const fy = above ? Math.min(y - 12, tops[0] - 6) : Math.max(y + 18, tops[1] + 52);
          body += `<text class="fing ${n.fcls || ''}" x="${ix + 6}" y="${fy}">${n.f}</text>`;
        }
      });
    });
  });
  // chord symbols above the treble staff, at the note they start on (or where that time falls)
  const xAt = t => {
    if (pos.has(key(t))) return pos.get(key(t));
    const before = times.filter(u => u <= t + 1e-6 && pos.has(key(u)));
    return before.length ? pos.get(key(before[before.length - 1])) : x0;
  };
  let lastX = -99;
  syms.forEach(c => {
    const sx = Math.max(xAt(c.t), lastX + 8 * c.text.length);
    body += `<text class="csym" x="${sx}" y="14">${esc(c.text)}</text>`;
    lastX = sx;
  });
  return {
    svg: `<svg class="staff piece" viewBox="0 0 ${W} ${H}" role="img" aria-label="Score">${lines}${body}</svg>`,
    W,
    H,
    xs,
    x0,
    ppb,
  };
}

// ---- music/technique.js ----
/* What a scale or arpeggio run says about technique, from MIDI timing and loudness alone.
   The app cannot see your hands, but some habits leave clear traces:
     hands not together  one hand consistently later than the other on the same beat
     late crossings      the note after a thumb-under (or a finger crossing over the thumb) comes late
     accented thumb      thumb notes louder than the others (the thumb drops instead of playing)
   One run proves little, so advice appears only when a trace shows up in most of the last few runs. */

const CROSSINGS = new Set(['3>1', '4>1', '1>3', '1>4']);
const LIMITS = { lag: 30, cross: 25, accent: 1.18 }; // ms, ms, loudness ratio

// a straight line through (beat, time) points; returns each point's distance from it in ms
function residuals(points) {
  const xs = points.map(p => p.beat);
  const ys = points.map(p => p.t);
  const mx = meanOf(xs);
  const my = meanOf(ys);
  let num = 0;
  let den = 0;
  xs.forEach((x, i) => {
    num += (x - mx) * (ys[i] - my);
    den += (x - mx) ** 2;
  });
  const b = den ? num / den : 0;
  return points.map(p => p.t - (my + b * (p.beat - mx)));
}

// one run: {lag:{hand, ms}, cross:{hand, ms}, accent:{hand, ratio}} for whatever stands out (or null)
function techniqueReport(an, drill) {
  if (!drill || !drill.even || drill.steps.length < 8 || !an) return null;
  const hands = { rh: [], lh: [] };
  for (const r of an.res) {
    if (!r.ok || !r.notes) continue;
    const s = drill.steps[r.i];
    s.notes.forEach((x, j) => {
      const hit = r.notes.find(n => n.m === s.midis[j]);
      if (hit && hands[x.fcls])
        hands[x.fcls].push({ i: r.i, beat: s.beat, t: hit.t, vel: hit.vel, f: +x.f || 0 });
    });
  }
  const out = {};
  // hands together: compare the two hands on the same steps
  if (hands.rh.length >= 6 && hands.lh.length >= 6) {
    const lh = new Map(hands.lh.map(p => [p.i, p.t]));
    const lags = hands.rh.filter(p => lh.has(p.i)).map(p => lh.get(p.i) - p.t);
    const m = median(lags);
    if (lags.length >= 6 && Math.abs(m) >= LIMITS.lag)
      out.lag = { hand: m > 0 ? 'lh' : 'rh', ms: Math.round(Math.abs(m)) };
  }
  for (const hand of ['rh', 'lh']) {
    const pts = hands[hand];
    if (pts.length < 8 || pts.some(p => !p.f)) continue;
    const res = residuals(pts);
    const cross = [];
    const other = [];
    pts.forEach((p, k) => (k && CROSSINGS.has(`${pts[k - 1].f}>${p.f}`) ? cross : other).push(res[k]));
    if (cross.length >= 2 && other.length >= 4) {
      const late = meanOf(cross) - meanOf(other);
      if (late >= LIMITS.cross && (!out.cross || late > out.cross.ms))
        out.cross = { hand, ms: Math.round(late) };
    }
    const thumb = pts.filter(p => p.f === 1).map(p => p.vel);
    const rest = pts.filter(p => p.f !== 1).map(p => p.vel);
    if (thumb.length >= 3 && rest.length >= 4 && meanOf(rest) > 0) {
      const ratio = meanOf(thumb) / meanOf(rest);
      if (ratio >= LIMITS.accent && (!out.accent || ratio > out.accent.ratio))
        out.accent = { hand, ratio: Math.round(ratio * 100) / 100 };
    }
  }
  return out;
}

const HAND = { rh: 'right hand', lh: 'left hand' };

// advice from the last few runs: {lesson, text} for the most persistent trace, or null
function techniqueAdvice(history) {
  const recent = (history || []).slice(-4);
  if (recent.length < 3) return null;
  const seen = kind => recent.filter(r => r && r[kind]).length >= 3;
  const last = kind => recent.filter(r => r && r[kind]).pop()[kind];
  if (seen('lag')) {
    const { hand, ms } = last('lag');
    return {
      lesson: 'together',
      text: `The ${HAND[hand]} is about ${ms} ms behind the other. Aim both thumbs at the same moment; play slower until the hands land as one.`,
    };
  }
  if (seen('cross')) {
    const { hand, ms } = last('cross');
    return {
      lesson: 'thumb',
      text: `In the ${HAND[hand]}, the notes where the thumb passes under (or a finger crosses over) come about ${ms} ms late. Move the thumb under early, while the 2nd and 3rd fingers play, so it is already waiting over its key.`,
    };
  }
  if (seen('accent')) {
    const { hand } = last('accent');
    return {
      lesson: 'thumb',
      text: `Thumb notes in the ${HAND[hand]} are louder than the rest. Let the thumb play from close to the key with the same small motion as the fingers, not a drop.`,
    };
  }
  return null;
}

// ---- learn/drill.js ----
/* What a drill is made of: the notes to play (steps), the meter, the tempo unit and the count-in. Moods
   drills bring their own notes; a piece's section is read from the library. */

function buildDrill(def, plan) {
  if (def.build) return def.build(plan); // a drill that brings its own notes (Moods)
  const k = def.kind;
  const hand = plan.hand || 'ht';
  if (k === 'section' || k === 'full') {
    const pid = def.pid;
    let a = k === 'full' ? 0 : def.sec.a;
    const z = k === 'full' ? Library.get(pid).nb : def.sec.z;
    // with the metronome, hands together: start a bar early to practice the join
    if (k === 'section' && a > 0 && plan.mode === 'tempo' && hand === 'ht') a -= 1;
    const r = Library.steps(pid, a, z, hand);
    const m = Library.meter(pid, a);
    return {
      ...r,
      piece: true,
      a,
      z,
      beats: r.total,
      meter: [m.n, m.d],
      unit: m.unit,
      clicks: m.clicks > 8 ? m.clicks / 2 : m.clicks,
      lead: a < (def.sec ? def.sec.a : 0) ? Library.bars(pid)[def.sec.a] - Library.bars(pid)[a] : 0,
    };
  }
  return null;
}

// ---- learn/pieces.js ----
/* Learning a piece, a section of about four bars at a time, then the whole piece.
     learn  - in wait mode (the app waits for the right notes): each hand alone, then together, two clean
              runs each
     tempo  - with the metronome: two clean runs out of the last three raise the tempo about 5%; a run with
              wrong notes lowers it 10%. Uneven timing alone never lowers it
     done   - at the piece's tempo. Play it whenever you like
   When a section stops moving (many runs, few clean), the approach changes instead of repeating the same
   thing. Only playing on a real piano counts (MIDI, or the microphone for single notes). */

const STAGE_TXT = { learn: 'Learning', tempo: 'Building tempo', done: 'At tempo' };

const handWord = h => ({ rh: 'right hand', lh: 'left hand', ht: 'hands together' })[h] || '';
const Cap = s => s[0].toUpperCase() + s.slice(1);
const addDays = (d, n) => todayKey(new Date(new Date(d + 'T12:00').getTime() + n * DAY));

// how many runs without progress before the approach changes, and the clean share that counts as stuck
const STALL_REPS = 10;
const STALL_CLEAN = 0.4;

/* ---------- what there is to learn in a piece ---------- */
// the pieces you are learning: [{pid}]
const workingPieces = () => (Store.s.piece.working || []).filter(w => Library.get(w.pid));

function startPiece(pid) {
  if (!Library.get(pid) || workingPieces().some(w => w.pid === pid)) return;
  Store.s.piece.working = [...workingPieces(), { pid }];
  Store.save();
}
function stopPiece(pid) {
  Store.s.piece.working = workingPieces().filter(w => w.pid !== pid);
  Store.save();
}

// the sections of one piece (a repeat shares its first time's item), then the whole piece
function pieceOrder(pid) {
  if (!Library.get(pid)) return [];
  return Library.sections(pid)
    .filter(s => s.n > 0)
    .map(s => `p:${pid}:${s.k}`)
    .filter(id => sectionOriginal(id) === id)
    .concat([`p:${pid}:full`]);
}

function sectionOriginal(id) {
  const p = id.split(':');
  if (p[0] !== 'p' || p[2] === 'full') return id;
  const s = Library.sections(p[1])[+p[2]];
  return s && s.same >= 0 ? `p:${p[1]}:${s.same}` : id;
}

// a section or the whole piece: p:<piece>:<section number | full>
function itemDef(id) {
  const p = id.split(':');
  if (p[0] !== 'p') return null;
  const pid = p[1];
  const P = Library.get(pid);
  if (!P) return null;
  const base = { id, pid, title: P.t, about: P.tip, level: P.lvl || 1 };
  if (p[2] === 'full')
    return {
      ...base,
      kind: 'full',
      sub: 'The whole piece',
      phases: [],
      start: Math.max(30, Math.round(P.bpm * 0.85)),
      target: P.bpm,
    };
  const k = +p[2];
  const sec = Library.sections(pid)[k];
  if (!sec || !sec.n) return null;
  const tgt = Library.tempoAt(pid, sec.a);
  const label = P.pickup
    ? sec.a === 0
      ? `bars 1–${sec.z - 1}`
      : `bars ${sec.a}–${sec.z - 1}`
    : `bars ${sec.a + 1}–${sec.z}`;
  const hands = ['rh', 'lh'].filter(h =>
    Library.range(pid, sec.a, sec.z).some(n => n.h === (h === 'rh' ? 0 : 1)),
  );
  return {
    ...base,
    kind: 'section',
    k,
    sec,
    sub: `Section ${k + 1} of ${Library.sections(pid).length} · ${label}`,
    phases: hands.length === 2 ? ['rh', 'lh', 'ht'] : hands.length === 1 ? [hands[0]] : ['ht'],
    start: Math.max(30, Math.round(tgt * 0.55)),
    target: tgt,
  };
}

/* ---------- state ---------- */
const itemState = id => Store.s.items[id] || null;

function ensureItem(id) {
  const def = itemDef(id);
  if (!def) return null;
  let it = Store.s.items[id];
  if (!it) {
    it = Store.s.items[id] = {
      stage: def.kind === 'full' ? 'tempo' : 'learn',
      phase: def.phases[0] || null,
      pc: 0,
      bpm: def.start,
      target: def.target,
      cl: 0,
      mess: 0,
      first: todayKey(),
      last: null,
      reps: 0,
      clean: 0,
      log: [],
      hintsOff: false,
      recent: [], // the last results: 'c' clean, 's' slips, 'm' messy
      since: 0, // runs since the item last moved forward
    };
    Log.ev('item started', { id, stage: it.stage });
  }
  if (def.target && it.target !== def.target) it.target = def.target; // targets can change with app updates
  // (stages from older versions: a cold check or a review is simply at tempo now)
  if (!['learn', 'tempo', 'done'].includes(it.stage)) it.stage = it.stage === 'check' ? 'done' : 'tempo';
  if (it.stage === 'tempo' && !(it.bpm > 0)) it.bpm = def.start;
  if (it.stage === 'learn' && def.phases.length && !def.phases.includes(it.phase)) it.phase = def.phases[0];
  for (const k of ['recent', 'log', 'tech']) if (it[k] != null && !Array.isArray(it[k])) it[k] = [];
  if (!it.recent) it.recent = [];
  if (!it.log) it.log = [];
  return it;
}

// bring saved items up to date with the current definitions (after loading, or an app update)
function refreshItems() {
  Object.keys(Store.s.items).forEach(id => itemDef(id) && ensureItem(id));
}

/* ---------- plans: how the next rep should run ---------- */
function planFor(id) {
  const def = itemDef(id);
  const it = ensureItem(id);
  if (!def || !it) return null;
  const base = { id, kind: def.kind, bpm: it.bpm, target: it.target, hints: false, hand: 'ht' };
  if (it.stage === 'learn') {
    const ph = it.phase || def.phases[0] || 'ht';
    return {
      ...base,
      mode: 'wait',
      hand: ph,
      hints: !it.hintsOff,
      label: `Learn the notes, ${handWord(ph)}. Take your time; the app waits for you.`,
    };
  }
  const hand = def.phases.length === 1 ? def.phases[0] : 'ht';
  if (it.stage === 'tempo') {
    if (it.solo)
      return {
        ...base,
        mode: 'tempo',
        hand: it.solo,
        label: `${Cap(handWord(it.solo))} alone at ♩ ${it.bpm}, then back to both hands.`,
      };
    return { ...base, mode: 'tempo', hand, label: `♩ ${it.bpm} on the way to ${it.target}.` };
  }
  return {
    ...base,
    mode: 'tempo',
    hand,
    bpm: it.target,
    label: `At tempo: ♩ ${it.target}. Play it as music.`,
  };
}

function criterion(id) {
  const def = itemDef(id);
  const it = itemState(id);
  if (!def) return '';
  if (!it) return 'Not started';
  if (it.stage === 'learn') return `Learning ${handWord(it.phase)}: ${it.pc || 0} of 2 clean`;
  if (it.stage === 'tempo') return `♩ ${it.bpm} → ${it.target}`;
  return `At tempo, ♩ ${it.target}`;
}

/* ---------- recording ---------- */
function logDay(it, clean, bpm) {
  const t = todayKey();
  let L = it.log[it.log.length - 1];
  if (!L || L.d !== t) {
    L = { d: t, reps: 0, clean: 0, bpm: 0 };
    it.log.push(L);
    if (it.log.length > 30) it.log.shift();
  }
  L.reps++;
  if (clean) L.clean++;
  if (bpm) L.bpm = Math.max(L.bpm, bpm);
  const day = dayRec(t);
  day.reps = (day.reps || 0) + 1;
  if (clean) day.clean = (day.clean || 0) + 1;
}

function tempoUp(bpm, target) {
  const s = Math.max(3, Math.round((bpm * 0.05) / 2) * 2);
  return Math.min(target, bpm + s);
}
const twoOfThree = marks => marks.slice(-3).filter(x => x === 'c').length >= 2;
const FORWARD = new Set(['phase', 'stage', 'tempo', 'done']);

/* r (from the player): {mode, hand, clean, rating 'clean'|'slips'|'messy', acc, wrong, hes, hinted, pace,
   bpm, played, adopt, valid, weak, msg}
   returns {msg, tone, change}. change is null, a step forward ('phase' 'stage' 'tempo' 'done'), or a step
   back ('slower' 'stall') */
function recordRep(id, r) {
  const def = itemDef(id);
  const it = ensureItem(id);
  if (!def || !it) return { msg: '', tone: '' };
  if (!r.valid)
    return {
      msg: r.clean
        ? 'Clean. (Practice only: connect your piano to count it.)'
        : 'Practice only: connect your piano to count this.',
      tone: r.clean ? 'ok' : '',
      change: null,
    };
  it.reps++;
  if (r.clean) it.clean++;
  it.last = todayKey();
  logDay(it, r.clean, r.mode === 'tempo' && r.clean ? r.played || r.bpm : 0);
  it.recent = (it.recent || []).concat(r.rating[0]).slice(-8);
  it.since = (it.since || 0) + 1;
  if (r.tech) it.tech = (it.tech || []).concat([r.tech]).slice(-6); // traces of technique, see music/technique.js
  let out =
    it.stage === 'learn'
      ? learnStep(def, it, r)
      : it.stage === 'tempo'
        ? tempoStep(id, def, it, r)
        : { msg: r.clean ? 'Clean at tempo.' : r.msg || 'Again.' };
  if (out.change === 'stage' || out.change === 'phase') it.recent = []; // a new kind of run starts fresh
  if (FORWARD.has(out.change)) it.since = 0;
  else {
    const stall = stallStep(id, def, it);
    if (stall) out = stall;
  }
  Store.save();
  return { tone: r.clean ? 'ok' : 'bad', ...out };
}

function learnStep(def, it, r) {
  const ph = it.phase || def.phases[0];
  if (r.clean) {
    it.pc = (it.pc || 0) + 1;
    it.hintsOff = true;
  } else {
    it.pc = 0;
    it.hintsOff = (r.wrong || 0) <= 1 && it.hintsOff;
  }
  if (it.pc < 2)
    return {
      msg: r.clean
        ? it.hintsOff
          ? 'Clean. Once more, without the key hints.'
          : 'Clean. Once more.'
        : r.msg || 'Again, slowly.',
    };
  const next = def.phases[def.phases.indexOf(ph) + 1];
  it.pc = 0;
  it.hintsOff = false;
  if (next && !it.reentry) {
    it.phase = next;
    return { msg: `Two clean. Now ${handWord(next)}.`, change: 'phase' };
  }
  // after a step back (reentry), one clean phase is enough to return to the metronome
  it.stage = 'tempo';
  it.phase = null;
  it.reentry = false;
  return { msg: `Notes learned. Now with the metronome at ♩ ${it.bpm}.`, change: 'stage' };
}

function tempoStep(id, def, it, r) {
  // right notes and steady, but steadily faster than the click: that is your tempo now
  if (r.adopt && r.played > it.bpm) {
    it.bpm = Math.min(it.target, r.played);
    it.recent = [];
    it.mess = 0;
    return {
      msg: `Right notes and steady at ♩ ${r.played}: that is your tempo now${it.bpm >= it.target ? ' (the target)' : ''}.`,
      change: 'tempo',
      tone: 'ok',
    };
  }
  if (r.rating === 'clean') {
    it.mess = 0;
    if ((r.bpm || 0) < it.bpm) return { msg: `Clean at ♩ ${r.bpm}.` };
    if (it.solo) {
      it.cl = (it.cl || 0) + 1;
      if (it.cl < 2) return { msg: 'Clean. Once more alone.' };
      const msg = `${Cap(handWord(it.solo))} is clean at ♩ ${it.bpm}. Both hands again.`;
      it.solo = null;
      it.cl = 0;
      return { msg, change: 'phase' };
    }
    if (!twoOfThree(it.recent))
      return {
        msg:
          it.bpm >= it.target
            ? 'Clean at the target tempo. Once more and it is yours.'
            : `Clean at ♩ ${it.bpm}. One more moves the tempo up.`,
      };
    it.recent = [];
    if (it.bpm >= it.target) {
      it.stage = 'done';
      Store.s.hist.push({ d: todayKey(), t: Date.now(), id, e: 'done' });
      Log.ev('milestone done', { id });
      return { msg: 'Two clean runs at the target tempo: this one is at tempo.', change: 'done', tone: 'ok' };
    }
    const nb = tempoUp(it.bpm, it.target);
    it.bpm = nb;
    return { msg: `Two clean runs. Tempo up to ♩ ${nb}.`, change: 'tempo' };
  }
  if (r.rating === 'slips') {
    it.mess = 0;
    return { msg: r.msg || 'Small slips. Same tempo, once more.' };
  }
  it.mess = (it.mess || 0) + 1;
  const floor = Math.max(24, Math.round(def.start * 0.75));
  const nb = Math.max(floor, Math.round(it.bpm * 0.9));
  const dropped = nb < it.bpm;
  it.bpm = nb;
  // three rough runs hands together: fix the weaker hand alone, then come back
  if (it.mess >= 3 && def.phases.length > 1 && r.weak && !it.solo) {
    it.solo = r.weak;
    it.mess = 0;
    it.cl = 0;
    return {
      msg: `Three rough runs. Let's fix the ${handWord(r.weak)} alone at ♩ ${it.bpm}.`,
      change: 'phase',
    };
  }
  return {
    msg:
      (r.msg ? r.msg + ' ' : '') +
      (dropped ? `Down to ♩ ${nb}: clean runs teach, messy ones teach mistakes.` : 'Slow and clean wins.'),
    change: dropped ? 'slower' : null,
  };
}

/* ---------- stuck: change the approach instead of repeating it ---------- */
function stallStep(id, def, it) {
  if (it.since < STALL_REPS) return null;
  const marks = it.recent.slice(-8);
  if (marks.filter(x => x === 'c').length / marks.length >= STALL_CLEAN) return null;
  it.since = 0;
  it.recent = [];
  it.stalls = (it.stalls || 0) + 1;
  Log.ev('stall', { id, stage: it.stage, bpm: it.bpm });
  if (it.stage === 'tempo' && def.phases.length) {
    // back to wait mode with the keys shown; the metronome returns after a clean run or two
    const weakest = it.solo || (def.phases.includes('ht') ? 'ht' : def.phases[0]);
    Object.assign(it, { stage: 'learn', phase: weakest, pc: 0, hintsOff: false, reentry: true, solo: null });
    return {
      msg: `This has not moved for a while, so let's change the approach: a few runs in wait mode with the keys shown (${handWord(weakest)}), then the metronome again. Speed comes once the notes are automatic.`,
      change: 'stall',
      tone: '',
    };
  }
  if (it.stage === 'tempo') {
    it.bpm = Math.max(30, Math.round(it.bpm * 0.85));
    return {
      msg: `Let's make it easier: ♩ ${it.bpm}. Tap "Hear it" first and listen once before you play.`,
      change: 'stall',
      tone: '',
    };
  }
  if (it.stage === 'learn' && def.phases.length > 1 && it.phase !== def.phases[0]) {
    const hand = def.phases[0];
    Object.assign(it, { phase: hand, pc: 0, hintsOff: false });
    return {
      msg: `Let's make it smaller: ${handWord(hand)} alone first, with the keys shown.`,
      change: 'stall',
      tone: '',
    };
  }
  return null;
}

// which notes fit which kind of drill, most useful first
const FOR_KIND = {
  scale: ['thumb', 'release', 'together', 'hand', 'sitting'],
  arp: ['arpeggio', 'thumb', 'release', 'hand'],
  section: ['tone', 'leaps', 'rotation', 'release', 'sitting'],

  pattern: ['rotation', 'leaps', 'release'],

function lessonFor(kind, dayNumber) {
  const ids = FOR_KIND[kind];
  return ids ? LESSON_BY[ids[dayNumber % ids.length]] : null;
}

/* The player: one drill, rep after rep, hands on the keys
   One state machine with one timer slot, so nothing can be left half-switched:
     ready -> (first note) -> wait -> review -> ready ...          wait mode
     ready -> countin -> tempo -> review -> countin ...            metronome mode
     paused (nothing played for two reps) -> any key -> countin
   Every transition is logged. The drill's source (a piece, or a Moods drill) decides what the next rep
   should be. */

const CUES = {
  scale: [
    'Move the thumb early and silently',
    'Wrist level and loose; no twisting',
    'Listen for even spacing between every note',
    'Crescendo up, diminuendo down',
    'Play from the key surface',
    'Eyes on the staff, not your hands',
  ],
  arp: [
    'Let the wrist and elbow travel with the line',
    'Thumb passes close to the keys',
    'Same loudness on the top note',
    'Listen for even spacing',
  ],
  section: [
    'Listen to the top line',
    'Keep the hand close to the keys',
    'Slow enough that nothing surprises you',
    'Shape the phrase, even when slow',
    'Breathe at the end of the phrase',
  ],
  pattern: [
    'Bass deepest, chord lighter',
    'Move early to the next position',
    'Feel the distance; glance only to check',
  ],
  full: [
    'Keep going, whatever happens',
    'Play it as music: shape and color',
    'Listen as if someone else were playing',
  ],
};

const sentence = parts => {
  const t = parts.filter(Boolean).join(', ');
  return t ? t[0].toUpperCase() + t.slice(1) + '.' : '';
};

// timing scatter limits for a clean run (fraction of a beat or of the note spacing). Up to FAIR times the
// limit still counts as clean, with a word about it; beyond that it is a slip. Timing alone is never messy.
const LIMIT = { even: 0.08, evenMic: 0.12, piece: 0.1 };
const FAIR = 1.6;
// the click and you may differ this much before it is mentioned
const TEMPO_TOLERANCE = 0.12;

// "2 wrong notes, 1 hint." for a wait-mode rep that was not clean
function waitModeSlips(wrong, hinted) {
  const plural = (n, word) => `${n} ${word}${n > 1 ? 's' : ''}`;
  return (
    [wrong && plural(wrong, 'wrong note'), hinted && plural(hinted, 'hint')].filter(Boolean).join(', ') + '.'
  );
}

// where you played, relative to the written note: "an octave higher", "two octaves lower"
const octaves = semis =>
  `${Math.abs(semis) === 12 ? 'an octave' : 'two octaves'} ${semis > 0 ? 'higher' : 'lower'}`;

/* Where a drill comes from and where its reps go: a piece's section by default; Moods supplies its own
   (a scale you practice freely, with checks only when you ask). about(id), if given, opens a panel on it. */
const PIECES = {
  def: id => itemDef(id),
  plan: id => planFor(id),
  record: (id, r) => recordRep(id, r),
  state: id => itemState(id),
  stage: id => {
    const it = itemState(id) || {};
    return { text: STAGE_TXT[it.stage] || '', cls: it.stage === 'done' ? 'ok' : '' };
  },
  criterion: id => criterion(id),
};

const Player = {
  mount(root, { id, onEvent = () => {}, source = PIECES, about = null }) {
    const src = source;
    const P = {
      id,
      root,
      def: src.def(id),
      plan: null,
      drill: null,
      phase: 'idle',
      timer: 0,
      offs: [],
      dead: false,
      idle: 0,
      repN: 0,
    };
    const $p = s => root.querySelector(s);
    const log = (m, d) => Log.ev('player ' + m, Object.assign({ id }, d || {}));
    const later = (fn, ms) => {
      clearTimeout(P.timer);
      P.timer = setTimeout(
        Log.guard('player timer', () => {
          if (!P.dead) fn();
        }),
        ms,
      );
    };
    const cancel = () => {
      clearTimeout(P.timer);
      P.timer = 0;
    };
    const setPhase = (ph, why) => {
      if (P.phase !== ph) log(`${P.phase} → ${ph}`, why ? { why } : undefined);
      P.phase = ph;
      paintBar();
    };
    if (!P.def) {
      root.innerHTML = '<div class="card"><p>This drill is no longer available.</p></div>';
      return { destroy() {} };
    }

    /* ---------- layout ---------- */
    const k = P.def.kind;
    root.innerHTML = `
      <div class="player card" data-kind="${k}">
        <div class="pl-head">
          <div class="pl-title"><b id="plTitle"></b><span class="small" id="plSub"></span></div>
          <button class="iconbtn" type="button" id="plAbout" aria-label="About this drill" title="About this drill" ${about || src.about ? '' : 'hidden'}>
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
          </button>
        </div>
        <div class="pl-stagebar">
          <span class="pill" id="plStage"></span>
          <span class="small" id="plCrit"></span>
        </div>
        <div class="pl-stage">
          <div class="staffwrap scrollx" id="plStaffWrap"><div id="plStaff"></div></div>
          <div class="countin" id="plCount" hidden></div>
        </div>
        <div class="beats pl-beats" id="plBeats" hidden></div>
        <div class="feedback pl-msg" id="plMsg" aria-live="polite"></div>
        <div class="cue" id="plCue"></div>
        <div class="kbwrap scrollx" id="plKbWrap"><div id="plKb"></div></div>
        <div class="st-bar pl-bar">
          <button class="iconbtn" type="button" id="plHear" aria-label="Hear it" title="Hear it">
            <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
          </button>
          <span class="small" id="plInfo"></span>
          <button class="btn cover sm" type="button" id="plGo"></button>
        </div>
      </div>`;
    const msg = (t, cls = '') => {
      const e = $p('#plMsg');
      if (e) {
        e.className = 'feedback pl-msg ' + cls;
        e.textContent = t;
      }
    };

    /* ---------- painting ---------- */
    let staffRes = null;
    let hl = { cur: -1, ok: new Set(), bad: new Set() };
    function paintStaff(follow) {
      const d = P.drill;
      if (!d) return;
      const wrap = $p('#plStaffWrap');
      const box = $p('#plStaff');
      if (!wrap || !box) return;
      if (d.piece) {
        // long music (a whole piece) is drawn a window of bars at a time around where you are
        P.win = null;
        if (d.steps.length > 140) {
          const at = clamp(follow == null ? P.winAt || 0 : follow, 0, d.steps.length - 1);
          P.winAt = at;
          const t0 = d.steps[Math.max(0, at - 6)].beat;
          let bi = 0;
          while (bi + 1 < d.bars.length && d.bars[bi + 1] <= t0 + 1e-6) bi++;
          const base = d.bars[bi];
          const bj = Math.min(d.bars.length - 1, bi + 6);
          const end = d.bars[bj];
          const idx = [];
          d.steps.forEach((x, i) => {
            if (x.beat >= base - 0.3 && x.beat < end - 0.01) idx.push(i);
          });
          const w0 = idx[0] ?? 0;
          const sub = idx.map(i => ({ ...d.steps[i], beat: d.steps[i].beat - base }));
          const map = new Map(idx.map((i, j) => [i, j]));
          const loc = set => new Set([...set].filter(i => map.has(i)).map(i => map.get(i)));
          P.win = { w0, w1: w0 + idx.length, map };
          staffRes = pieceStaffSVG({
            steps: sub,
            ghost: (d.ghost || []).filter(n => n.t >= base && n.t < end).map(n => ({ ...n, t: n.t - base })),
            bars: d.bars.slice(bi, bj + 1).map(b => b - base),
            total: end - base,
            sig: Library.keyAt(d.pid || P.def.pid, d.a + bi),
            time: null,
            clefs: [
              Library.clefAt(d.pid || P.def.pid, 0, d.a + bi),
              Library.clefAt(d.pid || P.def.pid, 1, d.a + bi),
            ],
            clefChanges: [],
            syms: (d.syms || [])
              .filter(
                (c, i, l) =>
                  c.t < end - 1e-6 && (c.t >= base - 1e-6 || !(l[i + 1] && l[i + 1].t <= base + 1e-6)),
              )
              .map(c => ({ ...c, t: Math.max(0, c.t - base) })),
            hl: { cur: map.has(hl.cur) ? map.get(hl.cur) : -1, ok: loc(hl.ok), bad: loc(hl.bad) },
            ppb: 30,
          });
          staffRes.xs = d.steps.map((_, i) => (map.has(i) ? staffRes.xs[map.get(i)] : null));
        } else
          staffRes = pieceStaffSVG({
            steps: d.steps,
            ghost: d.ghost,
            bars: d.bars,
            total: d.total,
            sig: d.sig,
            time: d.time,
            clefs: d.clefs,
            clefChanges: d.clefChanges,
            syms: d.syms,
            hl,
            ppb: d.steps.length > 60 ? 30 : 38,
          });
      } else {
        const items = d.steps.map((s, i) => ({
          notes: s.notes.map(x => ({
            ...x,
            f:
              P.plan.fingers !== false &&
              ((P.plan.mode === 'wait' && P.plan.hints) || k === 'scale' || k === 'arp')
                ? x.f
                : '',
            cls: hl.bad.has(i) ? 'bad' : hl.ok.has(i) ? 'ok' : hl.cur === i ? 'cur' : '',
          })),
          fstack: s.fstack,
          fcls: s.fcls,
        }));
        staffRes = staffSVG({
          clef: d.clef,
          sig: d.sig,
          items,
          spacing: d.spacing || 28,
          top: 40,
          bottom: 44,
          barEvery: d.barEvery || 0,
        });
      }
      const big = staffRes.W > 560;
      const w = Math.round(staffRes.W * (big ? 1.1 : 1.6));
      box.innerHTML = `<div style="width:${big ? w + 'px' : '100%'};max-width:${big ? 'none' : w + 'px'};margin:0 auto">${staffRes.svg}</div>`;
      if (big && follow != null) scrollTo(follow);
    }
    function scrollTo(i) {
      const wrap = $p('#plStaffWrap');
      if (!wrap || !staffRes || staffRes.xs[i] == null) return;
      const w = wrap.scrollWidth;
      const px = (staffRes.xs[i] / staffRes.W) * w;
      const target = Math.max(0, px - wrap.clientWidth * 0.35);
      if (Math.abs(wrap.scrollLeft - target) > wrap.clientWidth * 0.25)
        wrap.scrollTo({ left: target, behavior: 'smooth' });
    }
    function paintKb(stepIdx, showHint) {
      const kb = $p('#plKb');
      if (!kb) return;
      const d = P.drill;
      const all = d.steps.flatMap(s => s.midis).concat((d.ghost || []).map(n => midiOf(n.n)));
      const r = all.length ? kbRange(all, 2, 17) : { from: 48, to: 72 };
      const marks = {};
      const s = d.steps[stepIdx];
      if (showHint && s)
        s.notes.forEach((x, j) => {
          const m = midiOf(x.n);
          marks[m] = { cls: x.fcls || 'rh', f: x.f || x.kf || (s.fstack ? s.fstack[j] : '') };
          if (!marks[m].f || P.plan.fingers === false) delete marks[m].f;
        });
      kb.innerHTML = kbSVG({ ...r, marks, h: 104 });
      if (s && showHint) {
        const wrap = $p('#plKbWrap');
        const key = kb.querySelector(`[data-m="${s.midis[0]}"]`);
        if (wrap && key) {
          const kr = key.getBoundingClientRect(),
            wr = wrap.getBoundingClientRect();
          if (kr.left < wr.left || kr.right > wr.right) wrap.scrollLeft += kr.left - wr.left - wr.width / 2;
        }
      }
    }
    function paintHead() {
      const d = P.def;
      $p('#plTitle').textContent = d.title;
      $p('#plSub').textContent =
        d.sub + (P.plan && P.plan.hand && d.phases.length > 1 ? ' · ' + handWord(P.plan.hand) : '');
      const st = $p('#plStage');
      const stage = src.stage(id, P.plan);
      st.textContent = stage.text;
      st.className = 'pill ' + stage.cls;
      st.hidden = !stage.text;
      $p('#plCrit').textContent = src.criterion(id);
      paintCue();
    }
    // the line under the staff: technique advice when a habit shows up, a note on body and hands once a
    // day, otherwise what this rep is about
    function paintCue() {
      const cue = $p('#plCue');
      if (!cue || !P.plan) return;
      const advice = techniqueAdvice((src.state(id) || {}).tech);
      const seen = (Store.s.lessonsSeen = Store.s.lessonsSeen || {});
      const lesson =
        !advice &&
        P.repN === 0 &&
        seen[P.def.kind] !== todayKey() &&
        lessonFor(P.def.kind, Store.s.sessions || 0);
      if (advice || lesson) {
        const l = advice ? LESSON_BY[advice.lesson] : lesson;
        cue.innerHTML = `<span>${advice ? 'Technique' : 'Before you start'}</span> ${esc(advice ? advice.text : l.cue)}
          <button class="linkbtn" type="button" data-lesson="${l.id}">More</button>`;
        cue.querySelector('[data-lesson]').onclick = () => lessonSheet(l.id);
        if (lesson) seen[P.def.kind] = todayKey();
        return;
      }
      const cues = CUES[P.def.kind] || CUES.scale;
      cue.innerHTML = `<span>${P.plan.mode === 'tempo' ? 'This rep' : 'Focus'}</span> ${esc(P.plan.label || cues[P.repN % cues.length])}`;
    }
    function paintBar() {
      const go = $p('#plGo');
