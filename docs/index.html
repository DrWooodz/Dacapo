const THEORY_BY_ID = Object.fromEntries(THEORY_UNITS.map(u => [u.id, u]));

// a new question for a unit, different from the previous one when possible
function makeQuestion(unitId, previous) {
  const U = THEORY_BY_ID[unitId];
  let q = U.make();
  for (let i = 0; i < 6 && previous && q.prompt === previous.prompt; i++) q = U.make();
  return q;
}

/* ---------- checking an answer ---------- */
const pcSet = midis => new Set(midis.map(m => ((m % 12) + 12) % 12));

// does one group of notes form the chord? (any octave and inversion; an allowed extra note, e.g. a 7th)
function chordMatches(group, want) {
  const played = pcSet(group);
  const need = new Set(want.pcs);
  if (![...need].every(p => played.has(p))) return false;
  const rest = [...played].filter(p => !need.has(p));
  if (rest.length > (want.extra != null ? 1 : 0)) return false;
  if (rest.length && rest[0] !== want.extra) return false;
  if (want.bass != null && ((Math.min(...group) % 12) + 12) % 12 !== want.bass) return false;
  return true;
}

// how many groups of notes an answer takes: 'one per note' for melodies, 'one per chord' for chords
function answerSize(q) {
  if (q.kind === 'many') return q.answer.count;
  if (q.kind === 'pair') return 2;
  if (q.kind === 'seq') return q.answer.pcs.length;
  if (q.kind === 'chord') return 1;
  return q.answer.chords.length;
}
const answersInChords = q => q.kind === 'chord' || q.kind === 'chords';

// groups: arrays of midi numbers, in the order played. Returns { ok, wrongAt }.
function check(q, groups) {
  const A = q.answer;
  if (q.kind === 'many') {
    const ms = groups.map(g => g[0]);
    const ok = ms.every(m => m % 12 === A.pc) && new Set(ms).size >= A.count;
    return { ok, wrongAt: ok ? -1 : ms.findIndex(m => m % 12 !== A.pc) };
  }
  if (q.kind === 'pair') {
    const [a, b] = groups.map(g => g[0]);
    const okFirst = a % 12 === A.from;
    return { ok: okFirst && b - a === A.semis, wrongAt: okFirst ? 1 : 0 };
  }
  if (q.kind === 'seq') {
    const ms = groups.map(g => g[0]);
    for (let i = 0; i < ms.length; i++) {
      if (ms[i] % 12 !== A.pcs[i]) return { ok: false, wrongAt: i };
      if (A.ascending && i && ms[i] <= ms[i - 1]) return { ok: false, wrongAt: i };
    }
    return { ok: ms.length === A.pcs.length, wrongAt: -1 };
  }
  if (q.kind === 'chord') {
    const ok = chordMatches(groups[0] || [], A);
    return { ok, wrongAt: ok ? -1 : 0 };
  }
  // chords
  for (let i = 0; i < A.chords.length; i++) {
    if (!groups[i] || !chordMatches(groups[i], A.chords[i])) return { ok: false, wrongAt: i };
    if (A.smoothTop && i && Math.abs(Math.max(...groups[i]) - Math.max(...groups[i - 1])) > 2)
      return { ok: false, wrongAt: i, smooth: true };
  }
  return { ok: true, wrongAt: -1 };
}

// is a partly played answer already wrong? (so the player can say so at once)
function wrongSoFar(q, groups) {
  if (!groups.length) return false;
  if (q.kind === 'chords' || q.kind === 'chord') {
    const i = groups.length - 1;
    const want = q.kind === 'chord' ? q.answer : q.answer.chords[i];
    return !chordMatches(groups[i], want) || (q.kind === 'chords' && check(q, groups).smooth === true);
  }
  const r = check(q, groups);
  return r.wrongAt >= 0 && r.wrongAt < groups.length;
}

// ---- learn/areas.js ----
/* What there is to learn: the areas, their units in tiers, and what each item is.
   An item id says what it is: r:<unit> reading, t:sc|ar:<type>:<key> technique, h:<unit> theory,
   p:<piece>:<section>|full a piece, i:pat|imp:<palette> improvisation.
   Each area's units are ordered and grouped in tiers: tier 1 is the foundation, and a session only
   works on the first unfinished unit of an area, so deeper material waits until the basics hold. */

// the areas you can focus on (and switch off in Settings)
const AREAS = [
  { id: 'reading', n: 'Reading', d: 'Notes on the treble and bass staff: find them right away.' },
  { id: 'sight', n: 'Sight-reading', d: 'Reading in time: both hands, rhythms, then real music.' },
  { id: 'technique', n: 'Technique', d: 'Scales and arpeggios: fingering, evenness, hands together.' },
  { id: 'theory', n: 'Theory', d: 'Keys, intervals, chords and progressions, heard and played.' },
  { id: 'pieces', n: 'Pieces', d: 'The music you are working on, section by section.' },
  { id: 'improv', n: 'Improvisation', d: "The masters' harmony under your hands, then your own melodies." },
];
const AREA_BY = Object.fromEntries(AREAS.map(a => [a.id, a]));

const TIER_NAMES = ['', 'Foundations', 'Developing', 'Fluent'];

/* ---------- units per area, in tiers ---------- */
const r = units => units.map(u => 'r:' + u);
const READING = {
  treble: [r(['r1', 'r3', 'r5']), r(['r8t', 'r9t', 'r10t']), r(['r11'])],
  bass: [r(['r2', 'r4', 'r6']), r(['r8b', 'r9b', 'r10b']), r(['r11b'])],
};
const SIGHT = [r(['r7', 'ry1', 'ry2']), r(['r12', 'r13', 'ry3']), r(['r14', 'ry4', 'r15'])];
// sight-reading starts once both clefs are readable up to an octave
const SIGHT_NEEDS = ['r:r3', 'r:r4'];

const TECH_TIERS = [
  [
    ['C', 'A'],
    ['G', 'E'],
    ['F', 'D'],
  ],
  [
    ['D', 'B'],
    ['Bb', 'G'],
    ['A', 'F#'],
    ['Eb', 'C'],
  ],
  [
    ['E', 'C#'],
    ['Ab', 'F'],
    ['B', 'G#'],
    ['Db', 'Bb'],
    ['F#', 'Eb'],
  ],
].map(pairs =>
  pairs.flatMap(([M, m]) => [`t:sc:major:${M}`, `t:sc:harmonic:${m}`, `t:ar:major:${M}`, `t:ar:minor:${m}`]),
);

const THEORY_TIERS = [1, 2, 3].map(t => THEORY_UNITS.filter(u => u.tier === t).map(u => 'h:' + u.id));

const IMPROV_TIERS = [
  ['satie', 'penta'],
  ['chopin', 'debussy', 'drone', 'mixo'],
  ['rach', 'folkminor', 'dorian'],
].map(ids => ids.filter(id => PAL_BY_ID[id]).flatMap(id => [`i:pat:${id}`, `i:imp:${id}`]));

// the ordered units of a skill, grouped in tiers (pieces are ordered per piece, see piecesOrder)
function skillTiers(skill) {
  if (skill === 'treble' || skill === 'bass') return READING[skill];
  if (skill === 'sight') return SIGHT;
  if (skill === 'theory') return THEORY_TIERS;
  if (skill === 'improv') return IMPROV_TIERS;
  if (skill === 'technique') return TECH_TIERS;
  return [];
}
const skillOrder = skill => skillTiers(skill).flat();

// pieces you are working on: [{pid, daily}]
const workingPieces = () => (Store.s.piece.working || []).filter(w => Library.get(w.pid));

// the sections of one piece (repeats share an item), then the whole piece
function pieceOrder(pid) {
  if (!Library.get(pid)) return [];
  return Library.sections(pid)
    .filter(s => s.n > 0)
    .map(s => `p:${pid}:${s.k}`)
    .filter(id => sectionOriginal(id) === id)
    .concat([`p:${pid}:full`]);
}

function sectionOriginal(id) {
  const p = id.split(':');
  if (p[0] !== 'p' || p[2] === 'full') return id;
  const s = Library.sections(p[1])[+p[2]];
  return s && s.same >= 0 ? `p:${p[1]}:${s.same}` : id;
}

// technique starts in the key of the first piece you are working on: technique that serves your music
function techniqueOrder() {
  const all = TECH_TIERS.flat();
  const w = workingPieces()[0];
  const P = w && Library.get(w.pid);
  if (!P) return all;
  const sig = (P.keys && P.keys[0] && P.keys[0][1]) || 0;
  const inKey = id => {
    const d = itemDef(id);
    const pc = pcOfName(d.key);
    const majorSigs = { 0: 0, 7: 1, 2: 2, 9: 3, 4: 4, 11: 5, 6: 6, 1: -5, 8: -4, 3: -3, 10: -2, 5: -1 };
    // a minor key shares its signature with the major key a minor 3rd above
    return majorSigs[d.type === 'major' ? pc : (pc + 3) % 12] === sig;
  };
  const first = all.filter(inKey).slice(0, 4);
  return first.concat(all.filter(x => !first.includes(x)));
}

/* ---------- item definitions ---------- */
function itemDef(id) {
  const p = id.split(':');
  if (p[0] === 't') return techniqueDef(id, p);
  if (p[0] === 'r') return readingDef(id, p[1]);
  if (p[0] === 'h') return theoryDef(id, p[1]);
  if (p[0] === 'i') return improvDef(id, p);
  if (p[0] === 'p') return pieceDef(id, p);
  return null;
}

function techniqueDef(id, p) {
  const kind = p[1] === 'sc' ? 'scale' : 'arp';
  const type = p[2];
  const key = p[3];
  const minor = type !== 'major';
  const nm = prettyKey(key) + (minor ? ' minor' : ' major');
  return {
    id,
    area: 'technique',
    skill: 'technique',
    kind,
    type,
    key,
    title: kind === 'scale' ? `${nm} scale` : `${nm} arpeggio`,
    sub:
      kind === 'scale' ? (minor ? 'Harmonic minor · 2 octaves' : '2 octaves') : 'Root position · 2 octaves',
    phases: ['probe', 'rh', 'lh', 'ht'],
    npb: 2,
    start: kind === 'scale' ? 52 : 48,
    target: kind === 'scale' ? 80 : 72,
    review: true,
  };
}

// note-reading units train speed of recognition (paced, no metronome); sight-reading units are played in time
function readingDef(id, u) {
  const tier = (tiers, x) => tiers.findIndex(t => t.includes(x)) + 1;
  const skill = ['treble', 'bass'].find(sk => skillOrder(sk).includes(id)) || 'sight';
  const base = { id, area: skill === 'sight' ? 'sight' : 'reading', skill, unit: u, review: true };
  if (RHY_UNITS[u]) {
    const U = RHY_UNITS[u];
    return {
      ...base,
      kind: 'rhythm',
      title: U.t,
      sub: 'Tap the rhythm on any key',
      phases: [],
      start: 60,
      target: U.level >= 4 ? 66 : U.level === 3 ? 76 : 84,
      about: U.d,
      tier: tier(SIGHT, id),
    };
  }
  const U = READ_UNITS[u];
  if (!U) return null;
  const inTime = skill === 'sight' && (U.real || U.ht);
  const slow = U.dyads || U.triads || U.ht;
  return {
    ...base,
    kind: 'read',
    title: U.t,
    sub: U.real ? 'Two new bars every time' : 'A new line every time',
    phases: [],
    paced: !inTime, // wait mode with a speed goal per note, instead of the metronome
    pace: slow ? { start: 2600, target: 1300 } : { start: 1800, target: 800 },
    start: U.real ? 36 : 40,
    target: U.real ? (U.real === 'ht' ? 50 : 56) : 60,
    about: U.d,
    tier: tier(skill === 'sight' ? SIGHT : READING[skill], id),
  };
}

function theoryDef(id, u) {
  const U = THEORY_BY_ID[u];
  if (!U) return null;
  return {
    id,
    area: 'theory',
    skill: 'theory',
    kind: 'theory',
    unit: u,
    title: U.t,
    sub: `Theory · tier ${U.tier}`,
    phases: [],
    goal: U.goal,
    about: U.about,
    use: U.use,
    tier: U.tier,
    review: true,
  };
}

function improvDef(id, p) {
  const P = PAL_BY_ID[p[2]] || PALETTES[0];
  const base = { id, area: 'improv', skill: 'improv', pal: P.id, title: P.t, about: P.how };
  if (p[1] === 'pat')
    return {
      ...base,
      kind: 'pattern',
      sub: 'Learn the left-hand pattern',
      phases: ['lh'],
      start: Math.round(P.bpm * 0.7),
      target: P.bpm,
      review: true,
    };
  return {
    ...base,
    kind: 'improv',
    sub: 'Improvise over it',
    phases: [],
    start: P.bpm,
    target: P.bpm,
    review: false,
    minutes: 8,
  };
}

function pieceDef(id, p) {
  const pid = p[1];
  const P = Library.get(pid);
  if (!P) return null;
  const base = { id, area: 'pieces', skill: 'pieces', pid, title: P.t, about: P.tip, level: P.lvl || 1 };
  if (p[2] === 'full')
    return {
      ...base,
      kind: 'full',
      sub: 'The whole piece',
      phases: [],
      start: Math.max(30, Math.round(P.bpm * 0.85)),
      target: P.bpm,
      review: true,
    };
  const k = +p[2];
  const sec = Library.sections(pid)[k];
  if (!sec || !sec.n) return null;
  const tgt = Library.tempoAt(pid, sec.a);
  const label = P.pickup
    ? sec.a === 0
      ? `bars 1–${sec.z - 1}`
      : `bars ${sec.a}–${sec.z - 1}`
    : `bars ${sec.a + 1}–${sec.z}`;
  const hands = ['rh', 'lh'].filter(h =>
    Library.range(pid, sec.a, sec.z).some(n => n.h === (h === 'rh' ? 0 : 1)),
  );
  return {
    ...base,
    kind: 'section',
    k,
    sec,
    sub: `Section ${k + 1} of ${Library.sections(pid).length} · ${label}`,
    phases: hands.length === 2 ? ['rh', 'lh', 'ht'] : hands.length === 1 ? [hands[0]] : ['ht'],
    start: Math.max(30, Math.round(tgt * 0.55)),
    target: tgt,
    review: false,
    nbars: sec.z - sec.a,
  };
}

// ---- learn/curriculum.js ----
/* The curriculum's rules: when an item moves on, and when it counts as learned.
   Every item moves through stages:
     learn  - slowly, in wait mode (the app waits for the right notes), hands separately where it helps
     pace   - note reading and theory: the same, faster. A goal time per note (or per answer) tightens
              as you reach it; no metronome
     tempo  - with the metronome: two clean runs out of the last three raise the tempo about 5%; a run with
              wrong notes lowers it 10%. Uneven timing alone never lowers it
     check  - the goal, as the FIRST attempt of the day (cold), on two different days = integrated
     done   - integrated; it comes back for a cold review after 3, 7, 15, 30, 60 and then every 120 days
   When an item stops moving (many reps, few clean), the approach changes instead of repeating the same thing.
   Only playing on a real piano counts (MIDI, or the microphone for single notes). */

const STAGE_TXT = {
  learn: 'Learning',
  pace: 'Building speed',
  tempo: 'Building tempo',
  check: 'Checking',
  done: 'Integrated',
  create: 'Improvising',
};

const handWord = h => ({ rh: 'right hand', lh: 'left hand', ht: 'hands together' })[h] || '';
const Cap = s => s[0].toUpperCase() + s.slice(1);
// "3 wrong notes", "1 long pause", or '' for none
const count = (n, word) => (n ? `${n} ${word}${n > 1 ? 's' : ''}` : '');
const secs = ms => `${(ms / 1000).toFixed(1)} s`;
const addDays = (d, n) => todayKey(new Date(new Date(d + 'T12:00').getTime() + n * DAY));
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / DAY);

// how many runs without progress before the approach changes, and the clean share that counts as stuck
const STALL_REPS = 10;
const STALL_CLEAN = 0.4;
// a theory cold check is the first few questions of the day
const COLD_QUESTIONS = 5;
// theory answers without progress before the approach changes
const THEORY_STALL = 12;
// days between spaced reviews of an integrated item: each review that holds moves one step along
const REVIEW_DAYS = [3, 7, 15, 30, 60, 120];
const nextInterval = ivl => REVIEW_DAYS.find(d => d > (ivl || 0)) || REVIEW_DAYS[REVIEW_DAYS.length - 1];

/* ---------- item state ---------- */
const itemState = id => Store.s.items[id] || null;

const firstStage = def =>
  def.kind === 'rhythm' || def.kind === 'full' ? 'tempo' : def.kind === 'improv' ? 'create' : 'learn';

function ensureItem(id) {
  const def = itemDef(id);
  if (!def) return null;
  let it = Store.s.items[id];
  if (!it) {
    it = Store.s.items[id] = {
      stage: firstStage(def),
      phase: def.phases[0] || null,
      pc: 0,
      bpm: def.start,
      target: def.target,
      cl: 0,
      mess: 0,
      passes: [],
      fails: 0,
      ivl: 0,
      due: null,
      first: todayKey(),
      last: null,
      lastCold: null,
      reps: 0,
      clean: 0,
      mins: 0,
      log: [],
      hintsOff: false,
      recent: [], // the last results: 'c' clean, 's' slips, 'm' messy
      since: 0, // runs since the item last moved forward
    };
    Log.ev('item started', { id, stage: it.stage });
  }
  if (def.target && it.target !== def.target) it.target = def.target; // targets can change with app updates
  if (def.paced && it.stage === 'tempo') {
    // note reading used to be played with the metronome (before version 4); it now trains speed
    Object.assign(it, { stage: 'pace', pace: def.pace.start, recent: [], since: 0 });
    Log.ev('item moved to pace', { id });
  }
  normalize(id, def, it);
  return it;
}

// a saved item whose stage this kind of drill cannot have (old or damaged data) is put somewhere it can be
function normalize(id, def, it) {
  const building = def.kind === 'improv' ? 'create' : def.paced || def.kind === 'theory' ? 'pace' : 'tempo';
  const allowed = def.kind === 'improv' ? ['create', 'done'] : ['learn', building, 'check', 'done'];
  if (!allowed.includes(it.stage)) {
    const was = it.stage;
    it.stage = ['pace', 'tempo', 'create'].includes(was) ? building : firstStage(def);
    Log.warn('item stage repaired', { id, was, now: it.stage });
  }
  if (it.stage === 'pace' && !(it.pace > 0)) it.pace = def.paced ? def.pace.start : def.goal * 2;
  if (it.stage === 'tempo' && !(it.bpm > 0)) it.bpm = def.start;
  if (it.stage === 'learn' && def.phases.length && !def.phases.includes(it.phase)) it.phase = def.phases[0];
  for (const k of ['recent', 'passes', 'log', 'answers', 'paces', 'paceMarks', 'tech'])
    if (it[k] != null && !Array.isArray(it[k])) it[k] = [];
  if (!it.recent) it.recent = [];
  if (!it.passes) it.passes = [];
  if (!it.log) it.log = [];
}

// bring saved items up to date with the current definitions (after loading, or an app update)
function refreshItems() {
  Object.keys(Store.s.items).forEach(id => itemDef(id) && ensureItem(id));
}

// set an item to a stage directly (the placement check uses this)
function placeItem(id, stage, extra = {}) {
  const it = ensureItem(id);
  if (!it) return;
  Object.assign(it, { stage, phase: null, pc: 0, cl: 0, recent: [], since: 0 }, extra);
  if (stage === 'done') {
    it.ivl = 7;
    it.due = addDays(todayKey(), 7);
  }
}

/* ---------- plans: how the next rep should run ---------- */
function planFor(id) {
  const def = itemDef(id);
  const it = ensureItem(id);
  if (!def || !it) return null;
  const t = todayKey();
  const due = it.stage === 'check' || (it.stage === 'done' && it.due && it.due <= t);
  const cold = due && it.lastCold !== t;
  const base = { id, kind: def.kind, bpm: it.bpm, target: it.target, hints: false, cold: false, hand: 'ht' };
  if (def.kind === 'improv') return { ...base, mode: 'improv', bpm: def.target };
  if (def.kind === 'theory') {
    return {
      ...base,
      mode: 'quiz',
      hints: it.stage === 'learn',
      cold,
      pace: it.stage === 'pace' ? it.pace : null,
      label: cold
        ? 'Cold check: the first five questions today, no hints.'
        : it.stage === 'learn'
          ? 'Take your time. The answer appears if you need it.'
          : it.stage === 'pace'
            ? `Aim for under ${secs(it.pace)} per answer.`
            : 'Keep it fresh.',
    };
  }
  if (def.kind === 'read' && def.paced) {
    if (it.stage === 'learn')
      return { ...base, mode: 'wait', label: 'Read and play each note. No hints: find it from the staff.' };
    const goal = it.stage === 'pace' ? it.pace : def.pace.target;
    return {
      ...base,
      mode: 'wait',
      paced: true,
      pace: goal,
      cold,
      label: cold
        ? `Cold check: one line at under ${secs(goal * 1.15)} per note, first try today.`
        : `Aim for under ${secs(goal)} per note. Read ahead; let your hands follow.`,
    };
  }
  if (def.kind === 'read' || def.kind === 'rhythm') {
    if (it.stage === 'learn')
      return { ...base, mode: 'wait', label: 'Read and play each note. No hints: find it from the staff.' };
    const bpm = it.stage === 'check' || it.stage === 'done' ? it.target : it.bpm;
    const verb = def.kind === 'rhythm' ? 'Tap the rhythm' : 'Read in time';
    return {
      ...base,
      mode: 'tempo',
      bpm,
      cold,
      label: cold
        ? `Cold check at ♩ ${bpm}: keep going, do not stop for mistakes.`
        : `${verb} at ♩ ${bpm}. Keep going; do not stop for mistakes.`,
    };
  }
  if (it.stage === 'learn') {
    const ph = it.phase || def.phases[0] || 'ht';
    if (ph === 'probe')
      return {
        ...base,
        mode: 'wait',
        label: 'First, try it hands together. If it is already in your hands, you skip ahead.',
      };
    return {
      ...base,
      mode: 'wait',
      hand: ph,
      hints: !it.hintsOff,
      label: `Learn the notes, ${handWord(ph)}. Take your time; the app waits for you.`,
    };
  }
  const hand = def.phases.length === 1 ? def.phases[0] : 'ht';
  if (it.stage === 'tempo') {
    if (it.solo)
      return {
        ...base,
        mode: 'tempo',
        hand: it.solo,
        label: `${Cap(handWord(it.solo))} alone at ♩ ${it.bpm}, then back to both hands.`,
      };
    return { ...base, mode: 'tempo', hand, label: `♩ ${it.bpm} on the way to ${it.target}.` };
  }
  return {
    ...base,
    mode: 'tempo',
    hand,
    bpm: it.target,
    cold,
    label: cold
      ? it.stage === 'done'
        ? 'Review: one cold run at the target tempo.'
        : `Cold check: first try today, ♩ ${it.target}, no hints.`
      : `Polish at ♩ ${it.target}.`,
  };
}

/* ---------- the criterion, in words ---------- */
function criterion(id) {
  const def = itemDef(id);
  const it = itemState(id);
  if (!def) return '';
  if (!it) return 'Not started';
  if (def.kind === 'improv')
    return `${Math.round(it.mins || 0)} of ${def.minutes} minutes improvised${
      it.land != null ? `, ${it.land}% chord tones on strong beats` : ''
    }`;
  if (it.stage === 'learn') {
    if (def.kind === 'theory') return `Right answers: ${okCount(it, 8)} of the last 8 (7 needed)`;
    if (def.kind === 'read') return `Clean lines: ${it.pc || 0} of 3`;
    return it.phase === 'probe'
      ? 'First try hands together'
      : `Learning ${handWord(it.phase)}: ${it.pc || 0} of 2 clean`;
  }
  if (it.stage === 'pace') {
    const goal = def.kind === 'theory' ? def.goal : def.pace.target;
    return `Goal ${secs(it.pace)} per ${def.kind === 'theory' ? 'answer' : 'note'} → ${secs(goal)}`;
  }
  if (it.stage === 'tempo') return `♩ ${it.bpm} → ${it.target}`;
  if (it.stage === 'check') return `Cold check: ${(it.passes || []).length} of 2 days`;
  if (it.stage === 'done')
    return it.due
      ? `Integrated · review ${it.due <= todayKey() ? 'today' : 'in ' + daysBetween(todayKey(), it.due) + ' days'}`
      : 'Integrated';
  return '';
}
const okCount = (it, n) => (it.answers || []).slice(-n).filter(a => a.ok).length;

/* ---------- recording ---------- */
function milestone(id, e, v) {
  Store.s.hist.push({ d: todayKey(), t: Date.now(), id, e, v });
  Log.ev('milestone ' + e, { id, v });
}

function logDay(it, clean, bpm) {
  const t = todayKey();
  let L = it.log[it.log.length - 1];
  if (!L || L.d !== t) {
    L = { d: t, reps: 0, clean: 0, bpm: 0 };
    it.log.push(L);
    if (it.log.length > 30) it.log.shift();
  }
  L.reps++;
  if (clean) L.clean++;
  if (bpm) L.bpm = Math.max(L.bpm, bpm);
  const day = dayRec(t);
  day.reps = (day.reps || 0) + 1;
  if (clean) day.clean = (day.clean || 0) + 1;
}

function tempoUp(bpm, target) {
  const s = Math.max(3, Math.round((bpm * 0.05) / 2) * 2);
  return Math.min(target, bpm + s);
}
const twoOfThree = marks => marks.slice(-3).filter(x => x === 'c').length >= 2;

function toCheck(id, it, t) {
  it.stage = 'check';
  it.passes = [];
  it.fails = 0;
  it.cl = 0;
  it.lastCold = t; // checks start next session: today it is warm
  milestone(id, 'stage', 'check');
}

/* r (from the player): {mode, hand, clean, rating 'clean'|'slips'|'messy', acc, wrong, hes, hinted, pace,
   bpm, played, adopt, valid, weak, msg}
   returns {msg, tone, change, reached}. change is null, a step forward ('phase' 'stage' 'tempo' 'pace' 'pass'
   'done'), or a step back ('slower' 'fail' 'stall') */
function recordRep(id, r) {
  const def = itemDef(id);
  const it = ensureItem(id);
  const t = todayKey();
  if (!def || !it) return { msg: '', tone: '' };
  if (!r.valid)
    return {
      msg: r.clean
        ? 'Clean. (Practice only: connect your piano to count it.)'
        : 'Practice only: connect your piano to count this.',
      tone: r.clean ? 'ok' : '',
      change: null,
      practice: true,
    };
  const wasCold = it.lastCold !== t;
  it.reps++;
  if (r.clean) it.clean++;
  it.last = t;
  logDay(it, r.clean, r.mode === 'tempo' && r.clean ? r.played || r.bpm : 0);
  it.recent = (it.recent || []).concat(r.rating[0]).slice(-8);
  it.since = (it.since || 0) + 1;
  if (r.tech) it.tech = (it.tech || []).concat([r.tech]).slice(-6); // traces of technique, see music/technique.js
  const step =
    it.stage === 'learn'
      ? learnStep
      : it.stage === 'pace'
        ? paceStep
        : it.stage === 'tempo'
          ? tempoStep
          : it.stage === 'check'
            ? checkStep
            : reviewStep;
  let out = step(id, def, it, r, { t, wasCold });
  if (out.change === 'stage' || out.change === 'phase') it.recent = []; // a new kind of run starts fresh
  if (FORWARD.has(out.change)) it.since = 0;
  else {
    const stall = stallStep(id, def, it, r);
    if (stall) out = stall;
  }
  Store.save();
  return {
    tone: r.clean ? 'ok' : 'bad',
    ...out,
    reached:
      (out.change === 'stage' && it.stage === 'check') || out.change === 'done' || out.change === 'pass',
  };
}

const FORWARD = new Set(['phase', 'stage', 'tempo', 'pace', 'pass', 'done']);

function learnStep(id, def, it, r) {
  if (def.kind === 'read') {
    if (r.clean) {
      it.pc = (it.pc || 0) + 1;
      if (r.pace) it.paces = (it.paces || []).concat(r.pace).slice(-5);
    }
    if (it.pc < 3) {
      const slips = [count(r.wrong, 'wrong note'), count(r.hinted, 'hint')].filter(Boolean).join(', ');
      return {
        msg: r.clean
          ? `Clean line (${it.pc} of 3)${r.pace ? `, ${secs(r.pace)} per note` : ''}.`
          : `${slips ? Cap(slips) + '.' : r.msg || 'Not quite clean.'} Next line.`,
      };
    }
    it.pc = 0;
    milestone(id, 'stage', def.paced ? 'pace' : 'tempo');
    if (def.paced) {
      // start from the speed you already read at, within the unit's range
      const now = median(it.paces || []) || def.pace.start;
      it.pace = roundPace(Math.min(def.pace.start, Math.max(def.pace.target, now)));
      it.stage = 'pace';
      return {
        msg: `Three clean lines. Now for speed: aim for under ${secs(it.pace)} per note.`,
        change: 'stage',
      };
    }
    it.stage = 'tempo';
    return {
      msg: `Three clean lines. Now in time: ♩ ${it.bpm}, and keep going through mistakes.`,
      change: 'stage',
    };
  }
  const ph = it.phase || def.phases[0];
  if (ph === 'probe') {
    if (r.clean) {
      it.stage = 'tempo';
      it.phase = null;
      milestone(id, 'stage', 'tempo');
      return { msg: `Already in your hands. Straight to the metronome at ♩ ${it.bpm}.`, change: 'stage' };
    }
    it.phase = def.phases[1] || 'ht';
    it.pc = 0;
    it.hintsOff = false;
    return {
      msg: `Let's build it: ${handWord(it.phase)} first, with the keys shown.`,
      change: 'phase',
      tone: '',
    };
  }
  if (r.clean) {
    it.pc = (it.pc || 0) + 1;
    it.hintsOff = true;
  } else {
    it.pc = 0;
    it.hintsOff = (r.wrong || 0) <= 1 && it.hintsOff;
  }
  if (it.pc < 2)
    return {
      msg: r.clean
        ? it.hintsOff
          ? 'Clean. Once more, without the key hints.'
          : 'Clean. Once more.'
        : r.msg || 'Again, slowly.',
    };
  const next = def.phases[def.phases.indexOf(ph) + 1];
  it.pc = 0;
  it.hintsOff = false;
  if (next && !it.reentry) {
    it.phase = next;
    return { msg: `Two clean. Now ${handWord(next)}.`, change: 'phase' };
  }
  // after a step back (reentry), one clean phase is enough to return to the metronome
  it.stage = 'tempo';
  it.phase = null;
  it.reentry = false;
  milestone(id, 'stage', 'tempo');
  return { msg: `Notes learned. Now with the metronome at ♩ ${it.bpm}.`, change: 'stage' };
}

const roundPace = ms => Math.round(ms / 50) * 50;

// note reading and theory: a time goal that tightens as you reach it
function paceStep(id, def, it, r, { t }) {
  const onPace = r.clean && r.pace && r.pace <= it.pace;
  it.paceMarks = (it.paceMarks || []).concat(onPace ? 'c' : 'x').slice(-3);
  const what = `${secs(r.pace || 0)} per note`;
  if (!onPace)
    return {
      msg: r.clean
        ? `Clean, ${what}. Goal: ${secs(it.pace)}. Look one note ahead.`
        : `${Cap([count(r.wrong, 'wrong note'), count(r.hinted, 'hint')].filter(Boolean).join(', ') || 'Not quite clean')}. Next line.`,
    };
  if (!twoOfThree(it.paceMarks)) return { msg: `On pace: ${what}. One more and the goal tightens.` };
  it.paceMarks = [];
  if (it.pace <= def.pace.target) {
    toCheck(id, it, t);
    return {
      msg: `Two lines on pace at the goal. From tomorrow: cold checks, one line on the first try of the day.`,
      change: 'stage',
    };
  }
  it.pace = roundPace(Math.max(def.pace.target, it.pace * 0.88));
  return { msg: `Two lines on pace. New goal: ${secs(it.pace)} per note.`, change: 'pace' };
}

function tempoStep(id, def, it, r) {
  // right notes and steady, but steadily faster than the click: that is your tempo now
  if (r.adopt && r.played > it.bpm) {
    it.bpm = Math.min(it.target, r.played);
    it.recent = [];
    it.mess = 0;
    return {
      msg: `Right notes and steady at ♩ ${r.played}: that is your tempo now${it.bpm >= it.target ? ' (the target)' : ''}.`,
      change: 'tempo',
      tone: 'ok',
    };
  }
  if (r.rating === 'clean') {
    it.mess = 0;
    if ((r.bpm || 0) < it.bpm) return { msg: `Clean at ♩ ${r.bpm}.` };
    if (it.solo) {
      it.cl = (it.cl || 0) + 1;
      if (it.cl < 2) return { msg: 'Clean. Once more alone.' };
      const msg = `${Cap(handWord(it.solo))} is clean at ♩ ${it.bpm}. Both hands again.`;
      it.solo = null;
      it.cl = 0;
      return { msg, change: 'phase' };
    }
    if (!twoOfThree(it.recent))
      return {
        msg:
          it.bpm >= it.target
            ? 'Clean at the target tempo. One more, and the cold checks start next session.'
            : `Clean at ♩ ${it.bpm}. One more moves the tempo up.`,
      };
    it.recent = [];
    if (it.bpm >= it.target) {
      toCheck(id, it, todayKey());
      return {
        msg: "Clean at the target tempo. From tomorrow: cold checks. Two clean first tries on different days and it's integrated.",
        change: 'stage',
      };
    }
    const nb = tempoUp(it.bpm, it.target);
    it.bpm = nb;
    return { msg: `Two clean runs. Tempo up to ♩ ${nb}.`, change: 'tempo' };
  }
  if (r.rating === 'slips') {
    it.mess = 0;
    return { msg: r.msg || 'Small slips. Same tempo, once more.' };
  }
  it.mess = (it.mess || 0) + 1;
  const floor = Math.max(24, Math.round(def.start * 0.75));
  const nb = Math.max(floor, Math.round(it.bpm * 0.9));
  const dropped = nb < it.bpm;
  it.bpm = nb;
  // three rough runs hands together: fix the weaker hand alone, then come back
  if (it.mess >= 3 && def.phases.length > 1 && r.weak && !it.solo) {
    it.solo = r.weak;
    it.mess = 0;
    it.cl = 0;
    return {
      msg: `Three rough runs. Let's fix the ${handWord(r.weak)} alone at ♩ ${it.bpm}.`,
      change: 'phase',
    };
  }
  return {
    msg:
      (r.msg ? r.msg + ' ' : '') +
      (dropped ? `Down to ♩ ${nb}: clean runs teach, messy ones teach mistakes.` : 'Slow and clean wins.'),
    change: dropped ? 'slower' : null,
  };
}

function coldPassed(def, it, r) {
  if (def.kind === 'read' && def.paced) return r.clean && r.pace && r.pace <= def.pace.target * 1.15;
  return r.clean && r.mode === 'tempo' && (r.bpm || 0) >= it.target;
}

function checkStep(id, def, it, r, { t, wasCold }) {
  if (!wasCold)
    return {
      msg: r.clean ? 'Clean (warm). The cold check next session is what counts.' : r.msg || 'Again.',
    };
  return coldCheck(id, def, it, coldPassed(def, it, r), t);
}

function reviewStep(id, def, it, r, { t, wasCold }) {
  if (!(wasCold && it.due && it.due <= t)) return { msg: r.clean ? 'Clean.' : r.msg || 'Again.' };
  return coldReview(id, def, it, coldPassed(def, it, r), t);
}

// the outcome of a cold check (first try of the day) for an item in the check stage
function coldCheck(id, def, it, passed, t) {
  it.lastCold = t;
  if (passed) {
    it.passes = (it.passes || []).filter(d => d !== t).concat([t]);
    it.fails = 0;
    if (it.passes.length < 2)
      return { msg: "Clean cold check. One more on another day and it's integrated.", change: 'pass' };
    it.stage = 'done';
    it.ivl = 3;
    it.due = addDays(t, 3);
    milestone(id, 'done');
    return {
      msg: 'Clean cold, on a second day: integrated. It will come back for a quick review in 3 days.',
      change: 'done',
      tone: 'ok',
    };
  }
  it.passes = [];
  it.fails = (it.fails || 0) + 1;
  if (it.fails < 3)
    return {
      msg: 'Not clean cold yet. That is normal: practice it warm now; the check comes back next session.',
      change: 'fail',
    };
  it.fails = 0;
  rebuild(it, def);
  milestone(id, 'stage', it.stage);
  return {
    msg: "Three cold checks in a row didn't hold. Back a step: it needs more consolidation.",
    change: 'fail',
  };
}

// the outcome of a spaced review of an integrated item
function coldReview(id, def, it, passed, t) {
  it.lastCold = t;
  if (passed) {
    it.ivl = nextInterval(it.ivl);
    it.due = addDays(t, it.ivl);
    milestone(id, 'review', 'ok');
    return { msg: `Still clean cold. Next review in ${it.ivl} days.`, change: 'pass' };
  }
  rebuild(it, def);
  it.ivl = 0;
  it.due = null;
  milestone(id, 'review', 'fail');
  return {
    msg: 'It slipped since the last review. Rebuilding; this usually comes back quickly.',
    change: 'fail',
  };
}

// back to building, a little below the goal
function rebuild(it, def) {
  if (def.paced || def.kind === 'theory') {
    it.stage = 'pace';
    it.pace = roundPace((def.paced ? def.pace.target : def.goal) * 1.25);
  } else {
    it.stage = 'tempo';
    it.bpm = Math.max(def.start, Math.round(it.target * 0.9));
  }
  it.recent = [];
}

/* ---------- stuck: change the approach instead of repeating it ---------- */
function stallStep(id, def, it) {
  if (it.since < STALL_REPS) return null;
  const marks = it.recent.slice(-8);
  if (marks.filter(x => x === 'c').length / marks.length >= STALL_CLEAN) return null;
  it.since = 0;
  it.recent = [];
  it.stalls = (it.stalls || 0) + 1;
  Log.ev('stall', { id, stage: it.stage, bpm: it.bpm, pace: it.pace });
  if (it.stage === 'tempo' && def.phases.length) {
    // back to wait mode with the keys shown; the metronome returns after a clean run or two
    const weakest = it.solo || (def.phases.includes('ht') ? 'ht' : def.phases[0]);
    Object.assign(it, { stage: 'learn', phase: weakest, pc: 0, hintsOff: false, reentry: true, solo: null });
    return {
      msg: `This has not moved for a while, so let's change the approach: a few runs in wait mode with the keys shown (${handWord(weakest)}), then the metronome again. Speed comes once the notes are automatic.`,
      change: 'stall',
      tone: '',
    };
  }
  if (it.stage === 'tempo' && def.kind === 'read') {
    Object.assign(it, { stage: 'learn', pc: 0 });
    return {
      msg: 'Reading in time is not clicking yet, so back to reading at your own speed for three clean lines. Then the metronome again.',
      change: 'stall',
      tone: '',
    };
  }
  if (it.stage === 'tempo') {
    it.bpm = Math.max(30, Math.round(it.bpm * 0.85));
    return {
      msg: `Let's make it easier: ♩ ${it.bpm}. Tap "Hear it" first and listen once before you play.`,
      change: 'stall',
      tone: '',
    };
  }
  if (it.stage === 'pace') {
    const start = def.paced ? def.pace.start : def.goal * 2;
    it.pace = roundPace(Math.min(start * 1.2, it.pace * 1.15));
    return {
      msg: `Speed is not moving today, which is normal: it often jumps after a night's sleep. The goal is a little easier now: ${secs(it.pace)}.`,
      change: 'stall',
      tone: '',
    };
  }
  if (it.stage === 'learn' && def.phases.length > 1 && it.phase !== def.phases[1]) {
    const hand = def.phases.includes('rh') ? 'rh' : def.phases[0];
    Object.assign(it, { phase: hand, pc: 0, hintsOff: false });
    return {
      msg: `Let's make it smaller: ${handWord(hand)} alone first, with the keys shown.`,
      change: 'stall',
      tone: '',
    };
  }
  return null;
}

/* ---------- theory answers ---------- */
// a: {ok, ms, valid}
function recordAnswer(id, a) {
  const def = itemDef(id);
  const it = ensureItem(id);
  const t = todayKey();
  if (!def || !it) return { msg: '' };
  if (!a.valid)
    return { msg: a.ok ? 'Right. (Practice only: connect your piano to count it.)' : '', practice: true };
  it.reps++;
  if (a.ok) it.clean++;
  it.last = t;
  logDay(it, a.ok, 0);
  it.answers = (it.answers || []).concat({ ok: a.ok, ms: a.ms }).slice(-12);
  it.since = (it.since || 0) + 1;
  if (it.guided > 0) it.guided--;
  let out = { msg: '' };
  const last = n => it.answers.slice(-n);
  const okMs = n =>
    median(
      last(n)
        .filter(x => x.ok)
        .map(x => x.ms),
    );
  if (it.stage === 'learn') {
    if (last(8).length >= 6 && okCount(it, 8) >= 7) {
      it.stage = 'pace';
      it.pace = roundPace(Math.min(def.goal * 2, Math.max(def.goal, okMs(8) || def.goal * 2)));
      it.answers = [];
      it.since = 0;
      milestone(id, 'stage', 'pace');
      out = { msg: `You know this. Now for speed: under ${secs(it.pace)} per answer.`, change: 'stage' };
    } else if (it.since >= THEORY_STALL && okCount(it, 8) < 4) {
      // not clicking: show how it works again, with the answer appearing early for a few questions
      it.since = 0;
      it.stalls = (it.stalls || 0) + 1;
      it.guided = 4;
      Log.ev('stall', { id, stage: 'learn' });
      out = {
        msg: "Let's look at how it works again. For the next few questions the answer appears sooner: watch it, then play it.",
        change: 'stall',
      };
    }
  } else if (it.stage === 'pace') {
    if (last(10).length >= 8 && okCount(it, 10) >= 9 && okMs(6) <= it.pace) {
      it.answers = [];
      it.since = 0;
      if (it.pace <= def.goal) {
        toCheck(id, it, t);
        out = { msg: 'Quick and sure. From tomorrow: a cold check of five questions.', change: 'stage' };
      } else {
        it.pace = roundPace(Math.max(def.goal, it.pace * 0.85));
        out = { msg: `Quicker now. New goal: ${secs(it.pace)} per answer.`, change: 'pace' };
      }
    } else if (it.since >= THEORY_STALL * 2) {
      it.since = 0;
      it.stalls = (it.stalls || 0) + 1;
      it.pace = roundPace(Math.min(def.goal * 2, it.pace * 1.15));
      Log.ev('stall', { id, stage: 'pace' });
      out = {
        msg: `Speed often jumps after a night's sleep. The goal is a little easier for now: ${secs(it.pace)}.`,
        change: 'stall',
      };
    }
  } else if (it.lastCold !== t && (it.stage === 'check' || (it.stage === 'done' && it.due && it.due <= t))) {
    // the cold check: the first five answers of the day, four of them right
    if (!it.coldSet || it.coldSet.d !== t) it.coldSet = { d: t, n: 0, ok: 0 };
    it.coldSet.n++;
    if (a.ok) it.coldSet.ok++;
    if (it.coldSet.n >= COLD_QUESTIONS) {
      const passed = it.coldSet.ok >= COLD_QUESTIONS - 1;
      out = (it.stage === 'check' ? coldCheck : coldReview)(id, def, it, passed, t);
    }
  }
  Store.save();
  return {
    ...out,
    reached:
      (out.change === 'stage' && it.stage === 'check') || out.change === 'done' || out.change === 'pass',
  };
}

/* ---------- improvisation minutes ---------- */
function recordImprov(id, ms, land, bars) {
  const def = itemDef(id);
  const it = ensureItem(id);
  const t = todayKey();
  if (!it || !def) return null;
  it.mins = Math.round(((it.mins || 0) + ms / 60000) * 10) / 10;
  it.last = t;
  if (land != null && bars >= 4) {
    it.land = Math.round(land);
    it.days = Array.from(new Set([...(it.days || []), t])).slice(-10);
  }
  if (it.stage !== 'done' && it.mins >= def.minutes && (it.days || []).length >= 2 && (it.land || 0) >= 55) {
    it.stage = 'done';
    milestone(id, 'done');
    Store.save();
    return 'done';
  }
  Store.save();
  return null;
}

// ---- music/render.js ----
/* Drawing music: staff notation for drills and real scores, rhythm lines and the keyboard. */

const SS = 10,
  GS = SS / 250; // staff space, glyph scale

function glyph(name, x, y, cls = 'gl', extra = '') {
  return `<path class="${cls}" d="${GLYPHS[name]}" transform="translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${GS},${-GS})" ${extra}/>`;
}

/* Staff geometry. Treble lines: dia 30..38 (E4..F5). Bass lines: dia 18..26 (G2..A3). */
function staffGeom(clef, opts = {}) {
  const top = opts.top ?? 40;
  const g = { clef, top };
  if (clef === 'treble') {
    g.yT = d => top + (38 - d) * 5;
    g.lines = [{ y: top }];
    g.h = top + 40 + (opts.bottom ?? 40);
  } else if (clef === 'bass') {
    g.yB = d => top + (26 - d) * 5;
    g.h = top + 40 + (opts.bottom ?? 40);
  } else {
    const yb = top + 90;
    g.yT = d => top + (38 - d) * 5;
    g.yB = d => yb + (26 - d) * 5;
    g.yb = yb;
    g.h = yb + 40 + (opts.bottom ?? 40);
  }
  g.y = (d, st) => ((st === 'b' ? g.yB : g.yT) || g.yT || g.yB)(d);
  return g;
}

function staffLines(g, x0, x1) {
  let s = '';
  const draw = ytop => {
    for (let i = 0; i < 5; i++)
      s += `<line class="ln" x1="${x0}" x2="${x1}" y1="${ytop + i * SS}" y2="${ytop + i * SS}"/>`;
  };
  if (g.clef === 'treble') draw(g.top);
  else if (g.clef === 'bass') draw(g.top);
  else {
    draw(g.top);
    draw(g.yb);
    s += `<line class="ln" x1="${x0}" x2="${x0}" y1="${g.top}" y2="${g.yb + 40}" style="stroke-width:1.4"/>`;
  }
  return s;
}

function clefsAndSig(g, sig, x = 6) {
  let s = '';
  const doClef = which => {
    if (which === 'treble') s += glyph('gClef', x, g.yT(32));
    else s += glyph('fClef', x, g.yB(24));
  };
  if (g.clef !== 'bass') doClef('treble');
  if (g.clef !== 'treble') doClef('bass');
  let xx = x + 34;
  const sigs = [];
  if (g.clef !== 'bass') sigs.push(['t', keySigNotes(sig, 'treble')]);
  if (g.clef !== 'treble') sigs.push(['b', keySigNotes(sig, 'bass')]);
  sigs.forEach(([st, arr]) =>
    arr.forEach((k, i) => {
      s += glyph(k.a > 0 ? 'sharp' : 'flat', xx + i * 9, g.y(k.d, st));
    }),
  );
  xx += Math.abs(sig) * 9 + (sig ? 8 : 0);
  return { s, x: xx };
}

function timeSig(g, top, bot, x) {
  let s = '';
  const put = (st, lineTop) => {
    s += glyph('t' + top, x, lineTop + 10) + glyph('t' + bot, x, lineTop + 30);
  };
  if (g.clef === 'bass') put('b', g.top);
  else {
    put('t', g.top);
    if (g.clef === 'grand') put('b', g.yb);
  }
  return s;
}

function ledgers(g, d, st, x) {
  let s = '';
  const L = yy =>
    (s += `<line class="ln" x1="${x - 4}" x2="${x + 16}" y1="${yy}" y2="${yy}" style="stroke-width:1.2"/>`);
  const lo = st === 'b' ? 18 : 30,
    hi = st === 'b' ? 26 : 38;
  for (let k = lo - 2; k >= d; k -= 2) L(g.y(k, st));
  for (let k = hi + 2; k <= d; k += 2) L(g.y(k, st));
  return s;
}

/* items: [{notes:[{n, st:'t'|'b', cls, f, fcls}], dur, x}] — notes in one item share an x (chord) */
function staffSVG({
  clef = 'treble',
  sig = 0,
  items = [],
  spacing = 30,
  minW = 0,
  showAcc = 'auto',
  time = null,
  startX = null,
  bottom,
  top,
  barEvery = 0,
  labels = false,
} = {}) {
  const g = staffGeom(clef, { bottom, top });
  const head = clefsAndSig(g, sig);
  let x = startX ?? head.x + 8;
  let body = head.s;
  if (time) {
    body += timeSig(g, time[0], time[1], head.x);
    x += 22;
  }
  const xs = [];
  // With bar lines, accidentals last to the end of the bar: a note needs a sign when it differs from what
  // is in force on its line or space (the key signature, or an earlier accidental in the same bar).
  // Without bar lines (scales, chords), every note differing from the key signature shows its sign.
  let inForce = new Map();
  const place = nn => `${nn.st || ''}:${diaOf(nn.n)}`;
  const current = nn =>
    barEvery && inForce.has(place(nn)) ? inForce.get(place(nn)) : sigAccidentalFor(sig, nn.n.l);
  items.forEach((it, i) => {
    const needAcc = nn => (showAcc === 'all' ? nn.n.a !== 0 : nn.n.a !== current(nn) || !!nn.natural);
    const nAcc = (it.notes || []).filter(needAcc).length;
    if (it.x == null && nAcc) x += nAcc > 1 ? 18 : 9;
    const ix = it.x ?? x;
    xs.push(ix);
    const sorted = (it.notes || []).slice().sort((a, b) => diaOf(a.n) - diaOf(b.n));
    let prevD = -99,
      prevShift = false;
    // accidentals stagger in columns from the top note down
    const accOrder = sorted.filter(needAcc).reverse();
    const accX = new Map();
    accOrder.forEach((nn, k) => accX.set(nn, ix - 12 - (k % 2) * 9));
    sorted.forEach(nn => {
      const st = nn.st || (diaOf(nn.n) >= 28 && clef !== 'bass' ? 't' : clef === 'treble' ? 't' : 'b');
      const d = diaOf(nn.n);
      const y = g.y(d, st);
      const shift = d - prevD === 1 && !prevShift;
      prevShift = shift;
      prevD = d; // seconds: displace the upper note
      const hx = shift ? ix + 11.4 : ix;
      body += ledgers(g, d, st, ix) + (shift ? ledgers(g, d, st, ix + 11.4) : '');
      if (needAcc(nn)) {
        const nm = nn.n.a > 0 ? 'sharp' : nn.n.a < 0 ? 'flat' : 'natural';
        body += glyph(nm, accX.get(nn), y, 'gl note ' + (nn.cls || ''));
      }
      const head = it.dur === 'w' ? 'nhW' : it.dur === 'h' ? 'nhH' : 'nhB';
      body += glyph(head, hx, y, 'note ' + (nn.cls || ''));
      if (nn.f) {
        const isL = (nn.fcls || '') === 'lh' || (nn.fcls == null && st === 'b');
        const fy = isL
          ? Math.max(y + 18, (st === 'b' ? g.yB(18) : g.yT(30)) + 14)
          : Math.min(y - 12, (st === 'b' ? g.yB(26) : g.yT(38)) - 8);
        body += `<text class="fing ${nn.fcls || (isL ? 'lh' : 'rh')}" x="${ix + 6}" y="${fy}">${nn.f}</text>`;
      }
      if (labels && nn.lbl) body += `<text class="lbl" x="${ix + 6}" y="${g.h - 8}">${esc(nn.lbl)}</text>`;
    });
    if (it.fstack && sorted.length) {
      // chord fingering, low→high, stacked
      const isL = it.fcls === 'lh';
      const st = sorted[0].st || (clef === 'bass' ? 'b' : 't');
      const lowY = g.y(diaOf(sorted[0].n), st),
        highY = g.y(diaOf(sorted[sorted.length - 1].n), st);
      it.fstack.forEach((f, k) => {
        const fy = isL
          ? Math.max(lowY + 18, (st === 'b' ? g.yB(18) : g.yT(30)) + 14) + (it.fstack.length - 1 - k) * 10
          : Math.min(highY - 12, (st === 'b' ? g.yB(26) : g.yT(38)) - 8) - k * 10;
        body += `<text class="fing ${it.fcls || 'rh'}" x="${ix + 6}" y="${fy}">${f}</text>`;
      });
    }
    if (it.stem && sorted.length) {
      // stem up, single notes only
      const nn = sorted[sorted.length - 1];
      const st = nn.st || 't';
      const y = g.y(diaOf(nn.n), st);
      body += `<line class="stem" x1="${ix + 11.3}" x2="${ix + 11.3}" y1="${y - 1}" y2="${y - 34}"/>`;
    }
    (it.notes || []).forEach(nn => inForce.set(place(nn), nn.n.a));
    if (barEvery && (i + 1) % barEvery === 0) inForce = new Map();
    if (barEvery && (i + 1) % barEvery === 0 && i < items.length - 1) {
      const bx = ix + spacing / 2 + 4;
      body += `<line class="ln" x1="${bx}" x2="${bx}" y1="${g.top}" y2="${clef === 'grand' ? g.yb + 40 : g.top + 40}"/>`;
    }
    if (it.x == null) x += spacing;
  });
  const W = Math.max(minW, (xs.length ? Math.max(...xs) : x) + 30);
  const lines = staffLines(g, 2, W - 2);
  return {
    svg: `<svg class="staff" viewBox="0 0 ${W} ${g.h}" role="img" aria-label="Staff notation">${lines}${body}</svg>`,
    W,
    g,
    xs,
  };
}

/* ---------- rhythm notation on a single line ---------- */
// events: [{d: beats, rest:bool}] ; timing in quarter-beats
function rhythmSVG(events, { beats = 4, marks = [], width = 420, cur = -1, total = 0 } = {}) {
  const H = 90,
    y = 52,
    x0 = 46,
    x1 = width - 16;
  const span = x1 - x0;
  const len = total || events.reduce((a, e) => a + e.d, 0) || beats; // time on the line, in beats
  let s = `<line class="ln" x1="8" x2="${width - 6}" y1="${y}" y2="${y}"/>`;
  s += `<line class="ln" x1="8" x2="8" y1="${y - 20}" y2="${y + 20}"/>`;
  s += `<line class="ln" x1="${width - 6}" x2="${width - 6}" y1="${y - 20}" y2="${y + 20}"/>`;
  s += glyph('t' + beats, 14, y - 10) + glyph('t4', 14, y + 10);
  let t = 0;
  const pos = [];
  events.forEach((e, i) => {
    pos.push({ x: x0 + 6 + (t / len) * span, t, e, i });
    t += e.d;
  });
  // beaming: consecutive eighths within same beat
  pos.forEach((p, k) => {
    const e = p.e;
    const cls = marks[k] || (k === cur ? 'cur' : '');
    if (e.rest) {
      const name = e.d >= 4 ? 'rW' : e.d >= 2 ? 'rH' : e.d >= 1 ? 'rQ' : 'r8';
      const ry = name === 'rW' ? y - 10 : name === 'rH' ? y : name === 'rQ' ? y : y;
      s += glyph(name, p.x, ry, 'note ' + cls);
      if (e.dot) s += glyph('dot', p.x + 14, y - 5, 'note ' + cls);
      return;
    }
    const head = e.d >= 4 ? 'nhW' : e.d >= 2 ? 'nhH' : 'nhB';
    s += glyph(head, p.x, y, 'note ' + cls);
    if (e.dot) s += glyph('dot', p.x + 16, y - 3, 'note ' + cls);
    if (e.d < 4)
      s += `<line class="stem" x1="${p.x + 11.3}" x2="${p.x + 11.3}" y1="${y - 1}" y2="${y - 32}"/>`;
    if (e.d <= 0.5 && !e.beam) s += glyph('flag8', p.x + 10.6, y - 32, 'gl');
  });
  // beams: a group runs from 'start' to 'end'; b2 marks notes that also take a second (16th) beam
  pos.forEach((p, k) => {
    if (p.e.beam !== 'start') return;
    let z = k;
    while (pos[z + 1] && pos[z].e.beam !== 'end') z++;
    const q = pos[z];
    s += `<rect x="${p.x + 10.6}" y="${y - 34}" width="${q.x - p.x + 0.8}" height="4.5" class="gl"/>`;
    for (let j = k; j < z; j++)
      if (pos[j].e.b2 && pos[j + 1].e.b2)
        s += `<rect x="${pos[j].x + 10.6}" y="${y - 27}" width="${pos[j + 1].x - pos[j].x + 0.8}" height="4" class="gl"/>`;
    if (p.e.tup)
      s += `<text x="${(p.x + q.x) / 2 + 11}" y="${y - 40}" text-anchor="middle" font-size="11" font-style="italic" font-weight="700" fill="var(--ink)">${p.e.tup}</text>`;
  });
  for (let b = 1; b < len; b++) {
    const bx = x0 + (b / len) * span;
    if (b % beats === 0) s += `<line x1="${bx}" x2="${bx}" y1="${y - 20}" y2="${y + 20}" class="ln"/>`;
    else s += `<line x1="${bx + 6}" x2="${bx + 6}" y1="${y + 26}" y2="${y + 30}" class="ln"/>`;
  }
  return `<svg class="staff" viewBox="0 0 ${width} ${H}" role="img" aria-label="Rhythm">${s}</svg>`;
}

/* ---------- keyboard ---------- */
const isBlack = m => [1, 3, 6, 8, 10].includes(((m % 12) + 12) % 12);

function kbSVG({ from = 48, to = 72, marks = {}, interactive = true, cLabels = true, h = 100 } = {}) {
  while (isBlack(from)) from--;
  while (isBlack(to)) to++;
  const WW = 24,
    BW = 14,
    BH = h * 0.62;
  let whites = '',
    blacks = '',
    labels = '',
    wi = 0;
  const wx = {};
  for (let m = from; m <= to; m++)
    if (!isBlack(m)) {
      wx[m] = wi * WW;
      wi++;
    }
  const W = wi * WW;
  for (let m = from; m <= to; m++) {
    const mk = marks[m] || {};
    const cls = mk.cls || '';
    if (!isBlack(m)) {
      const x = wx[m];
      whites += `<rect class="w ${cls}" data-m="${m}" x="${x + 0.5}" y="0.5" width="${WW - 1}" height="${h - 1}" rx="2"/>`;
      if (mk.f != null) labels += fingerLabel(x + WW / 2, h - 16, 8, mk.fc || cls, mk.f);
      else if (cLabels && m % 12 === 0)
        labels += `<text class="cl" x="${x + WW / 2}" y="${h - 7}">C${m / 12 - 1}</text>`;
    } else {
      const x = wx[m - 1] + WW - BW / 2;
      blacks += `<rect class="b ${cls}" data-m="${m}" x="${x}" y="0" width="${BW}" height="${BH}" rx="1.5"/>`;
      if (mk.f != null) labels += fingerLabel(x + BW / 2, BH - 12, 7, mk.fc || cls, mk.f, 'font-size:9px');
    }
  }
  const style = `max-width:${Math.round(W * 1.7)}px;margin:0 auto`;
  return `<svg class="kb" viewBox="0 0 ${W} ${h}" style="${style}" ${interactive ? 'data-play="1"' : ''}
    role="img" aria-label="Piano keyboard">${whites}${blacks}${labels}</svg>`;
}

// a finger number in a circle on a key
function fingerLabel(cx, cy, r, cls, finger, style = '') {
  return (
    `<circle class="fc ${cls}" cx="${cx}" cy="${cy}" r="${r}"/>` +
    `<text class="fn ${cls}" x="${cx}" y="${cy}"${style ? ` style="${style}"` : ''}>${esc(finger)}</text>`
  );
}

// fit a range around a list of midis, padded to whole octaves-ish
function kbRange(midis, pad = 2, minSpan = 24) {
  let lo = Math.min(...midis) - pad,
    hi = Math.max(...midis) + pad;
  while (hi - lo < minSpan) {
    lo--;
    hi++;
  }
  return { from: lo, to: hi };
}

function flashKey(svg, m, cls = 'down', ms = 260) {
  if (!svg) return;
  const el = svg.querySelector(`[data-m="${m}"]`);
  if (!el) return;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), ms);
}

/* ---------- real music on a grand staff ----------
   Horizontal position follows time (with a minimum gap), bar lines are drawn, note heads show long
   values (whole and half notes open), accidentals follow the bar rules, clefs follow the score. */
function pieceStaffSVG({
  steps = [],
  ghost = [],
  bars = [],
  total = 0,
  sig = 0,
  time = null,
  clefs = ['t', 'b'],
  clefChanges = [],
  hl = {},
  ppb = 34,
} = {}) {
  const top0 = 44,
    gap = 52;
  const tops = [top0, top0 + 40 + gap];
  const H = tops[1] + 40 + 46;
  const clefAt = (s, t) => {
    let c = clefs[s];
    clefChanges.forEach(ch => {
      if (ch.s === s && ch.t <= t + 1e-6) c = ch.k;
    });
    return c;
  };
  const topLine = c => (c === 't' ? 38 : 26);
  const yOf = (s, d, t) => tops[s] + (topLine(clefAt(s, t)) - d) * 5;
  // header: clefs, key signature, time signature
  let body = '';
  let x = 8;
  [0, 1].forEach(s => {
    const c = clefs[s];
    body += c === 't' ? glyph('gClef', x, tops[s] + 30) : glyph('fClef', x, tops[s] + 10);
  });
  x += 34;
  [0, 1].forEach(s => {
    const c = clefs[s];
    keySigNotes(sig, c === 't' ? 'treble' : 'bass').forEach((k, i) => {
      body += glyph(k.a > 0 ? 'sharp' : 'flat', x + i * 9, tops[s] + (topLine(c) - k.d) * 5);
    });
  });
  x += Math.abs(sig) * 9 + (sig ? 8 : 0);
  if (time) {
    [0, 1].forEach(s => {
      const n = String(time[0]),
        d = String(time[1]);
      body +=
        [...n].map((ch, i) => glyph('t' + ch, x + i * 11, tops[s] + 10)).join('') +
        [...d].map((ch, i) => glyph('t' + ch, x + i * 11, tops[s] + 30)).join('');
    });
    x += 12 + 11 * Math.max(String(time[0]).length, String(time[1]).length);
  }
  const x0 = x + 10;
  // columns by time
  const cols = new Map();
  const key = t => (Math.round(t * 1000) / 1000).toFixed(3);
  const addCol = (t, n) => {
    const k = key(t);
    if (!cols.has(k)) cols.set(k, { t: +k, notes: [] });
    cols.get(k).notes.push(n);
  };
  steps.forEach((s, i) => s.notes.forEach(n => addCol(s.beat, { ...n, step: i })));
  ghost.forEach(n => addCol(n.t, { ...n, step: -1 }));
  const barSet = bars
    .slice(1)
    .filter(b => b < total - 1e-6)
    .map(b => +key(b));
  const times = [...new Set([...cols.keys()].map(Number).concat(barSet))].sort((a, b) => a - b);
  // accidentals: per bar and staff, the key signature first, then what was written
  const sigAcc = l => sigAccidentalFor(sig, l);
  let accState = new Map();
  const pos = new Map();
  let cx = x0;
  let lastT = null;
  const xBar = new Map();
  times.forEach(t => {
    const k = key(t);
    const isBar = barSet.includes(t) && !xBar.has(k);
    const col = cols.get(k);
    if (isBar) {
      cx = Math.max(cx + (lastT == null ? 0 : 8), x0 + t * ppb - 6);
      xBar.set(k, cx);
      cx += 12;
    }
    if (col) {
      // which notes need an accidental, given the bar so far
      if (isBar || bars.slice(1).some(b => Math.abs(b - t) < 1e-6)) accState = new Map();
      const needs = col.notes.map(n => {
        const sk = (n.st === 'b' ? 1 : 0) + ':' + diaOf(n.n);
        const cur = accState.has(sk) ? accState.get(sk) : sigAcc(n.n.l);
        const need = n.n.a !== cur || n.natural;
        return need;
      });
      col.notes.forEach((n, j) => {
        const sk = (n.st === 'b' ? 1 : 0) + ':' + diaOf(n.n);
        accState.set(sk, n.n.a);
        n.acc = needs[j];
      });
      const accW = col.notes.some(n => n.acc) ? 12 : 0;
      const want = x0 + t * ppb;
      cx = Math.max(want, lastT == null ? x0 : cx + 22) + accW;
      pos.set(k, cx);
      lastT = t;
      cx += 2;
    }
  });
  const W = Math.max(cx + 30, 300);
  // staff lines and the brace line
  let lines = '';
  [0, 1].forEach(s => {
    for (let i = 0; i < 5; i++)
      lines += `<line class="ln" x1="2" x2="${W - 2}" y1="${tops[s] + i * SS}" y2="${tops[s] + i * SS}"/>`;
  });
  // the system's opening and closing bar lines
  lines += `<line class="ln" x1="2" x2="2" y1="${tops[0]}" y2="${tops[1] + 40}" style="stroke-width:1.6"/>`;
  lines += `<line class="ln" x1="${W - 2}" x2="${W - 2}" y1="${tops[0]}" y2="${tops[1] + 40}"/>`;
  xBar.forEach(bx => {
    lines += `<line class="ln bar" x1="${bx}" x2="${bx}" y1="${tops[0]}" y2="${tops[1] + 40}"/>`;
  });
  clefChanges.forEach(ch => {
    const bx = (xBar.get(key(ch.t)) ?? x0 + ch.t * ppb) + 2;
    body +=
      ch.k === 't'
        ? glyph('gClef', bx, tops[ch.s] + 30, 'gl small')
        : glyph('fClef', bx, tops[ch.s] + 10, 'gl small');
  });
  const xs = steps.map(s => pos.get(key(s.beat)));
  // notes
  cols.forEach((col, k) => {
    const ix = pos.get(k);
    if (ix == null) return;
    [0, 1].forEach(s => {
      const ns = col.notes.filter(n => (n.st === 'b' ? 1 : 0) === s).sort((a, b) => diaOf(a.n) - diaOf(b.n));
      let prevD = -99,
        prevShift = false;
      let accCol = 0;
      ns.slice()
        .reverse()
        .forEach(n => {
          if (n.acc) {
            n.ax = ix - 12 - (accCol % 2) * 9;
            accCol++;
          }
        });
      ns.forEach(n => {
        const d = diaOf(n.n);
        const y = yOf(s, d, col.t);
        const shift = d - prevD === 1 && !prevShift;
        prevShift = shift;
        prevD = d;
        const hx = shift ? ix + 11.4 : ix;
        const c = clefAt(s, col.t);
        const lo = topLine(c) - 8,
          hi = topLine(c);
        for (let dd = lo - 2; dd >= d; dd -= 2)
          lines += `<line class="ln" x1="${ix - 4}" x2="${ix + 16 + (shift ? 11 : 0)}" y1="${yOf(s, dd, col.t)}" y2="${yOf(s, dd, col.t)}" style="stroke-width:1.2"/>`;
        for (let dd = hi + 2; dd <= d; dd += 2)
          lines += `<line class="ln" x1="${ix - 4}" x2="${ix + 16 + (shift ? 11 : 0)}" y1="${yOf(s, dd, col.t)}" y2="${yOf(s, dd, col.t)}" style="stroke-width:1.2"/>`;
        const cls =
          n.step < 0
            ? 'ghost'
            : hl.bad && hl.bad.has(n.step)
              ? 'bad'
              : hl.ok && hl.ok.has(n.step)
                ? 'ok'
                : hl.cur === n.step
                  ? 'cur'
                  : '';
        if (n.acc) {
          const nm =
            n.n.a > 0
              ? n.n.a > 1
                ? 'dsharp'
                : 'sharp'
              : n.n.a < 0
                ? n.n.a < -1
                  ? 'dflat'
                  : 'flat'
                : 'natural';
          body += glyph(
            GLYPHS[nm] ? nm : n.n.a > 0 ? 'sharp' : n.n.a < 0 ? 'flat' : 'natural',
            n.ax,
            y,
            'gl note ' + cls,
          );
        }
        const dur = n.d || 0;
        const head = dur >= 3.9 ? 'nhW' : dur >= 1.9 ? 'nhH' : 'nhB';
        if (dur === 0 && n.step >= 0)
          body += `<g transform="translate(${hx + 3} ${y}) scale(.68) translate(${-hx - 3} ${-y})">${glyph('nhB', hx, y, 'note ' + cls)}</g>`;
        else body += glyph(head, hx, y, 'note ' + cls);
        if (n.f && n.step >= 0) {
          const above = s === 0;
          const fy = above ? Math.min(y - 12, tops[0] - 6) : Math.max(y + 18, tops[1] + 52);
          body += `<text class="fing ${n.fcls || ''}" x="${ix + 6}" y="${fy}">${n.f}</text>`;
        }
      });
    });
  });
  return {
    svg: `<svg class="staff piece" viewBox="0 0 ${W} ${H}" role="img" aria-label="Score">${lines}${body}</svg>`,
    W,
    H,
    xs,
    x0,
    ppb,
  };
}

// ---- music/technique.js ----
/* What a scale or arpeggio run says about technique, from MIDI timing and loudness alone.
   The app cannot see your hands, but some habits leave clear traces:
     hands not together  one hand consistently later than the other on the same beat
     late crossings      the note after a thumb-under (or a finger crossing over the thumb) comes late
     accented thumb      thumb notes louder than the others (the thumb drops instead of playing)
   One run proves little, so advice appears only when a trace shows up in most of the last few runs. */

const CROSSINGS = new Set(['3>1', '4>1', '1>3', '1>4']);
const LIMITS = { lag: 30, cross: 25, accent: 1.18 }; // ms, ms, loudness ratio

// a straight line through (beat, time) points; returns each point's distance from it in ms
function residuals(points) {
  const xs = points.map(p => p.beat);
  const ys = points.map(p => p.t);
  const mx = meanOf(xs);
  const my = meanOf(ys);
  let num = 0;
  let den = 0;
  xs.forEach((x, i) => {
    num += (x - mx) * (ys[i] - my);
    den += (x - mx) ** 2;
  });
  const b = den ? num / den : 0;
  return points.map(p => p.t - (my + b * (p.beat - mx)));
}

// one run: {lag:{hand, ms}, cross:{hand, ms}, accent:{hand, ratio}} for whatever stands out (or null)
function techniqueReport(an, drill) {
  if (!drill || !drill.even || drill.steps.length < 8 || !an) return null;
  const hands = { rh: [], lh: [] };
  for (const r of an.res) {
    if (!r.ok || !r.notes) continue;
    const s = drill.steps[r.i];
    s.notes.forEach((x, j) => {
      const hit = r.notes.find(n => n.m === s.midis[j]);
      if (hit && hands[x.fcls])
        hands[x.fcls].push({ i: r.i, beat: s.beat, t: hit.t, vel: hit.vel, f: +x.f || 0 });
    });
  }
  const out = {};
  // hands together: compare the two hands on the same steps
  if (hands.rh.length >= 6 && hands.lh.length >= 6) {
    const lh = new Map(hands.lh.map(p => [p.i, p.t]));
    const lags = hands.rh.filter(p => lh.has(p.i)).map(p => lh.get(p.i) - p.t);
    const m = median(lags);
    if (lags.length >= 6 && Math.abs(m) >= LIMITS.lag)
      out.lag = { hand: m > 0 ? 'lh' : 'rh', ms: Math.round(Math.abs(m)) };
  }
  for (const hand of ['rh', 'lh']) {
    const pts = hands[hand];
    if (pts.length < 8 || pts.some(p => !p.f)) continue;
    const res = residuals(pts);
    const cross = [];
    const other = [];
    pts.forEach((p, k) => (k && CROSSINGS.has(`${pts[k - 1].f}>${p.f}`) ? cross : other).push(res[k]));
    if (cross.length >= 2 && other.length >= 4) {
      const late = meanOf(cross) - meanOf(other);
      if (late >= LIMITS.cross && (!out.cross || late > out.cross.ms))
        out.cross = { hand, ms: Math.round(late) };
    }
    const thumb = pts.filter(p => p.f === 1).map(p => p.vel);
    const rest = pts.filter(p => p.f !== 1).map(p => p.vel);
    if (thumb.length >= 3 && rest.length >= 4 && meanOf(rest) > 0) {
      const ratio = meanOf(thumb) / meanOf(rest);
      if (ratio >= LIMITS.accent && (!out.accent || ratio > out.accent.ratio))
        out.accent = { hand, ratio: Math.round(ratio * 100) / 100 };
    }
  }
  return out;
}

const HAND = { rh: 'right hand', lh: 'left hand' };

// advice from the last few runs: {lesson, text} for the most persistent trace, or null
function techniqueAdvice(history) {
  const recent = (history || []).slice(-4);
  if (recent.length < 3) return null;
  const seen = kind => recent.filter(r => r && r[kind]).length >= 3;
  const last = kind => recent.filter(r => r && r[kind]).pop()[kind];
  if (seen('lag')) {
    const { hand, ms } = last('lag');
    return {
      lesson: 'together',
      text: `The ${HAND[hand]} is about ${ms} ms behind the other. Aim both thumbs at the same moment; play slower until the hands land as one.`,
    };
  }
  if (seen('cross')) {
    const { hand, ms } = last('cross');
    return {
      lesson: 'thumb',
      text: `In the ${HAND[hand]}, the notes where the thumb passes under (or a finger crosses over) come about ${ms} ms late. Move the thumb under early, while the 2nd and 3rd fingers play, so it is already waiting over its key.`,
    };
  }
  if (seen('accent')) {
    const { hand } = last('accent');
    return {
      lesson: 'thumb',
      text: `Thumb notes in the ${HAND[hand]} are louder than the rest. Let the thumb play from close to the key with the same small motion as the fingers, not a drop.`,
    };
  }
  return null;
}

// ---- learn/drill.js ----
/* What a drill is made of: the notes to play (steps), the meter, the tempo unit and the count-in,
   built from an item of the curriculum and the plan for the next rep. */

function buildDrill(def, plan) {
  if (def.build) return def.build(plan); // a drill that brings its own notes (Moods)
  const k = def.kind;
  const hand = plan.hand || 'ht';
  if (k === 'scale') {
    const r = scaleSteps(def.type, def.key, hand, 2, 2);
    return { ...r, npb: 2, even: true, beats: r.steps.length / 2, meter: [4, 4], unit: 1, clicks: 4 };
  }
  if (k === 'arp') {
    const r = arpSteps(def.type === 'major' ? 'major' : 'minor', def.key, hand, 2);
    return { ...r, npb: 2, even: true, beats: r.steps.length / 2, meter: [4, 4], unit: 1, clicks: 4 };
  }
  if (k === 'read') {
    const real = READ_UNITS[def.unit] && READ_UNITS[def.unit].real;
    if (real) {
      const r = realExcerpt(real);
      if (r) return { ...r, fresh: true };
    }
    // no excerpt found (rare): a generated line of the same kind instead
    const r = readingLine(real ? (real === 'ht' ? 'r12' : 'r5') : def.unit);
    return {
      ...r,
      npb: 1,
      even: true,
      beats: r.steps.length,
      meter: [4, 4],
      unit: 1,
      clicks: 4,
      fresh: true,
      barEvery: 4,
    };
  }
  if (k === 'rhythm') {
    const U = RHY_UNITS[def.unit];
    const meter = pick(U.meters);
    const bars = [rhythmBar(U.level, meter), rhythmBar(U.level, meter)];
    const events = bars.flat();
    const steps = rhythmSteps(events);
    return {
      kind: 'rhythm',
      events,
      bars,
      steps,
      beats: meter * 2,
      meter: [meter, 4],
      unit: 1,
      clicks: meter,
      fresh: true,
      any: true,
    };
  }
  if (k === 'pattern') {
    const r = patternSteps(PAL_BY_ID[def.pal]);
    const P = PAL_BY_ID[def.pal];
    return { ...r, even: true, beats: r.beats, meter: [P.meter, 4], unit: 1, clicks: P.meter, spacing: 40 };
  }
  if (k === 'section' || k === 'full') {
    const pid = def.pid;
    let a = k === 'full' ? 0 : def.sec.a;
    const z = k === 'full' ? Library.get(pid).nb : def.sec.z;
    // with the metronome, hands together: start a bar early to practice the join
    if (k === 'section' && a > 0 && plan.mode === 'tempo' && hand === 'ht') a -= 1;
    const r = Library.steps(pid, a, z, hand);
    const m = Library.meter(pid, a);
    return {
      ...r,
      piece: true,
      a,
      z,
      beats: r.total,
      meter: [m.n, m.d],
      unit: m.unit,
      clicks: m.clicks > 8 ? m.clicks / 2 : m.clicks,
      lead: a < (def.sec ? def.sec.a : 0) ? Library.bars(pid)[def.sec.a] - Library.bars(pid)[a] : 0,
    };
  }
  return null;
}

const notesOf = s => s.split(/\s+/).map(parseNote);

// the groups of notes a step shows, in order: one group for a chord, one per note or per chord in turn
function stepGroups(step) {
  if (step.notes) return [notesOf(step.notes)];
  if (step.seq) return notesOf(step.seq).map(n => [n]);
  if (step.chords) return step.chords.map(notesOf);
  return [];
}

// ---- views/guide.js ----
/* A walkthrough shown step by step: what to notice, on the staff and the keyboard, and to hear.
   guideBox() draws it into a box (the theory player shows it above the first question); guideSheet()
   opens it as a panel. Moving to the next step plays its example. */

const hasGuide = unitId => !!GUIDES[unitId];

function hear(step) {
  const groups = stepGroups(step).map(g => g.map(midiOf));
  if (!groups.length) return;
  AudioEngine.ensure();
  AudioEngine.stopAll();
  if (step.notes) AudioEngine.chord(groups[0], AudioEngine.now() + 0.05, 1.8, 0.5);
  else if (step.seq)
    AudioEngine.seq(
      groups.map(g => g[0]),
      0.42,
      0.8,
      0.55,
    );
  else AudioEngine.seq(groups, 0.95, 0.9, 0.45);
}

function picture(step) {
  const groups = stepGroups(step);
  if (!groups.length) return '';
  // a chord stays on one staff: the treble unless it sits mostly below middle C
  const staffOf = g => (g.reduce((a, n) => a + midiOf(n), 0) / g.length >= 59 ? 't' : 'b');
  const items = groups.map(g => ({ notes: g.map(n => ({ n, st: staffOf(g), cls: 'ok' })) }));
  const staff = staffSVG({ clef: 'grand', sig: 0, items, spacing: 34, minW: 260, top: 30, bottom: 30 }).svg;
  const marks = {};
  groups.flat().forEach(n => (marks[midiOf(n)] = { cls: 'rh' }));
  const ms = Object.keys(marks).map(Number);
  const from = Math.min(48, Math.min(...ms) - 2);
  const to = Math.max(72, Math.max(...ms) + 2);
  return `<div class="staffwrap"><div style="max-width:520px;margin:0 auto">${staff}</div></div>
    <div class="kbwrap scrollx">${kbSVG({ from, to, marks, h: 80, interactive: false })}</div>`;
}

// box: the element to draw into; title: shown on top; onDone: after the last step (omit for no button)
function guideBox(box, unitId, { title = '', onDone = null } = {}) {
  const steps = GUIDES[unitId];
  if (!steps) return;
  let i = 0;
  const paint = () => {
    const step = steps[i];
    const last = i === steps.length - 1;
    box.innerHTML = `<div class="guide stack" style="gap:8px">
      <div class="row between"><b>${esc(title)}</b><span class="small">Step ${i + 1} of ${steps.length}</span></div>
      <p>${esc(step.say)}</p>
      ${picture(step)}
      <div class="row">
        ${i ? '<button class="btn sm ghost" type="button" data-g="back">Back</button>' : ''}
        ${stepGroups(step).length ? '<button class="btn sm" type="button" data-g="hear">Hear it</button>' : ''}
        ${
          !last
            ? '<button class="btn sm cover" type="button" data-g="next">Next</button>'
            : onDone
              ? '<button class="btn sm cover" type="button" data-g="done">Got it: on to the questions</button>'
              : ''
        }
      </div>
    </div>`;
  };
  box.onclick = e => {
    const b = e.target.closest('[data-g]');
    if (!b) return;
    const what = b.dataset.g;
    if (what === 'hear') return hear(steps[i]);
    if (what === 'done') return onDone();
    i = Math.max(0, Math.min(steps.length - 1, i + (what === 'next' ? 1 : -1)));
    paint();
    if (what === 'next') hear(steps[i]);
  };
  paint();
}

function guideSheet(unitId, title) {
  openSheet(
    `<div class="sheethead"><h2 class="h2">How it works</h2>${closeBtn}</div><div id="gdBox"></div>`,
    sheet => {
      guideBox($('#gdBox', sheet), unitId, { title });
      return () => AudioEngine.stopAll();
    },
    { label: 'How it works' },
  );
}
