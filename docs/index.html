    <script>
(() => {
'use strict';
// ---- env.js ----
/* Facts about this copy of the app. python3 build.py fills in BUILD and APP_VERSION;
   running straight from src/ shows 'dev'. */
const BUILD = 'site';
const APP_VERSION = '1.1.1';
// opened inside the Claude app (artifact viewer), where progress syncs to the Claude account
const IN_CLAUDE = !!(window.claude && window.claude.use);

// ---- core/util.js ----
/* Small DOM, formatting and statistics helpers, and the toast message. */

const $ = (s, r = document) => r.querySelector(s);

const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const esc = s =>
  String(s ?? '').replace(
    /[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
  );

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const rnd = n => Math.floor(Math.random() * n);

const pick = a => a[rnd(a.length)];

const DAY = 86400000;

// A practice day runs from 4 in the morning to 4 the next morning, so a late evening session that goes past
// midnight stays one day: one session, one cold check, and two "different days" are really different days.
const DAY_STARTS_AT_HOUR = 4;

const todayKey = (date = new Date()) => {
  const d = new Date(date.getTime() - DAY_STARTS_AT_HOUR * 3600000);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};

const fmtTime = s => {
  s = Math.max(0, Math.round(s));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
};

function toast(msg, ms = 2200, action) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div');
  t.className = 'toast';
  t.setAttribute('role', 'status');
  const sp = document.createElement('span');
  sp.textContent = msg;
  t.appendChild(sp);
  if (action) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = action.label;
    b.onclick = () => {
      action.run();
      t.remove();
    };
    t.appendChild(b);
    ms = Math.max(ms, 6000);
  }
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}

const meanOf = a => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0);

const median = a => {
  if (!a.length) return 0;
  const s = a.slice().sort((x, y) => x - y);
  const h = s.length >> 1;
  return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2;
};

// ---- core/log.js ----
/* Diagnostics: a persistent event log and bug reports
   Everything that matters for debugging a real practice session is written here: errors, app
   events (navigation, session and drill transitions, rep results), input and audio events.
   The log survives reloads (localStorage), so a report made after a problem still shows what
   led up to it. Nothing leaves the device unless you copy, download or send a report.
   The log depends only on the build facts and the toast, so it starts first and catches errors
   anywhere. The app tells it how to describe the rest (setContext). */

const Log = {
  KEY: 'dacapo.log',
  MAX: 900,
  buf: [],
  sid: Math.random().toString(36).slice(2, 8),
  t0: Date.now(),
  timer: 0,
  errCount: 0,
  lastErrToast: 0,
  midi: { on: 0, off: 0, cc: 0, other: 0, raw: [] },
  ctx: { env: () => ({}), state: () => null, openReport: null },
  // env(): extra fields for the environment summary; state(): a digest of the learning state;
  // openReport(): show the report form
  setContext(ctx) {
    Object.assign(this.ctx, ctx);
  },
  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      if (raw) {
        const o = JSON.parse(raw);
        if (Array.isArray(o.buf)) this.buf = o.buf.slice(-this.MAX);
      }
    } catch (e) {
      this.buf = [];
    }
  },
  add(k, m, d) {
    const e = { t: Date.now(), s: this.sid, k, m: String(m).slice(0, 300) };
    if (d !== undefined) {
      try {
        const j = JSON.stringify(d);
        e.d = j.length > 1200 ? j.slice(0, 1200) + '…' : j;
      } catch (err) {
        e.d = '[unserializable]';
      }
    }
    this.buf.push(e);
    if (this.buf.length > this.MAX) this.buf.splice(0, this.buf.length - this.MAX);
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.persist(), k === 'err' ? 50 : 1500);
    return e;
  },
  ev(m, d) {
    return this.add('ev', m, d);
  },
  warn(m, d) {
    return this.add('warn', m, d);
  },
  err(e, where = '') {
    this.errCount++;
    const msg = e && e.message ? e.message : String(e);
    const stack = e && e.stack ? String(e.stack).split('\n').slice(0, 6).join(' | ') : '';
    this.add('err', (where ? where + ': ' : '') + msg, stack ? { stack } : undefined);
    this.offerReport();
  },
  persist() {
    try {
      localStorage.setItem(this.KEY, JSON.stringify({ v: 1, buf: this.buf.slice(-this.MAX) }));
    } catch (e) {
      /* storage full: keep in memory */
    }
  },
  clear() {
    this.buf = [];
    this.errCount = 0;
    this.persist();
  },
  // run a function and log (not throw) any error: used around every event handler
  guard(where, fn) {
    return (...a) => {
      try {
        return fn(...a);
      } catch (e) {
        this.err(e, where);
      }
    };
  },
  offerReport() {
    const now = Date.now();
    if (now - this.lastErrToast < 30000 || !this.ctx.openReport) return;
    this.lastErrToast = now;
    try {
      toast('Something went wrong. It was logged.', 7000, {
        label: 'Report',
        run: () => this.ctx.openReport(),
      });
    } catch (e) {}
  },
  midiMsg(data, ts) {
    const st = data[0] & 0xf0;
    if (st === 0x90 && data[2] > 0) this.midi.on++;
    else if (st === 0x80 || st === 0x90) this.midi.off++;
    else if (st === 0xb0) this.midi.cc++;
    else this.midi.other++;
    if (this.midi.raw.length < 40 && data[0] !== 0xfe && data[0] !== 0xf8)
      this.midi.raw.push([Math.round(ts), ...Array.from(data).slice(0, 3)]);
  },
  // compact environment summary for reports
  env() {
    let extra = {};
    try {
      extra = this.ctx.env() || {};
    } catch (e) {
      extra = { error: String(e) };
    }
    return {
      app: APP_VERSION,
      build: BUILD,
      inClaude: IN_CLAUDE,
      ua: navigator.userAgent,
      lang: navigator.language,
      screen: `${screen.width}x${screen.height}@${window.devicePixelRatio || 1}`,
      viewport: `${innerWidth}x${innerHeight}`,
      tz: new Date().getTimezoneOffset(),
      now: new Date().toISOString(),
      up: Math.round((Date.now() - this.t0) / 1000),
      ...extra,
      midiCounts: { ...this.midi, raw: undefined },
      midiFirst: this.midi.raw,
      errors: this.errCount,
      storage: (() => {
        try {
          return {
            state: (localStorage.getItem('dacapo.v1') || '').length,
            log: (localStorage.getItem(this.KEY) || '').length,
          };
        } catch (e) {
          return null;
        }
      })(),
    };
  },
  digest() {
    try {
      return this.ctx.state();
    } catch (e) {
      return { error: String(e) };
    }
  },
  report(note = '', includeLog = true) {
    const head = [
      'DACAPO PROBLEM REPORT',
      `When: ${new Date().toString()}`,
      '',
      'What happened:',
      note.trim() || '(no description)',
      '',
    ].join('\n');
    const body = {
      env: this.env(),
      state: this.digest(),
      log: includeLog
        ? this.buf.slice(-600).map(e => [new Date(e.t).toISOString().slice(5, 23), e.s, e.k, e.m, e.d || ''])
        : [],
    };
    return (
      head + '\n--- diagnostic data (JSON) ---\n' + JSON.stringify(body, null, 0).replace(/\],\["/g, '],\n["')
    );
  },
};

Log.load();

Log.ev('page load', {
  url: location.protocol + '//' + location.host + location.pathname,
  ref: document.referrer ? 'yes' : 'no',
});

window.addEventListener('error', e => {
  Log.err(
    e.error || new Error(e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno),
    'uncaught',
  );
});

window.addEventListener('unhandledrejection', e => {
  Log.err(e.reason || new Error('unhandled rejection'), 'promise');
});

(() => {
  // keep console errors and warnings too
  const ce = console.error.bind(console),
    cw = console.warn.bind(console);
  console.error = (...a) => {
    try {
      Log.add(
        'err',
        a
          .map(x => (x && x.message ? x.message : String(x)))
          .join(' ')
          .slice(0, 300),
        a[0] && a[0].stack ? { stack: String(a[0].stack).split('\n').slice(0, 5).join(' | ') } : undefined,
      );
    } catch (e) {}
    ce(...a);
  };
  console.warn = (...a) => {
    try {
      Log.add('warn', a.map(String).join(' ').slice(0, 300));
    } catch (e) {}
    cw(...a);
  };
})();

document.addEventListener('visibilitychange', () => Log.ev('visibility ' + document.visibilityState));

window.addEventListener('pagehide', () => {
  Log.ev('page hide');
  Log.persist();
});

// ---- core/store.js ----
/* Your progress: the saved state, migration from older versions, sync to a Claude account,
 * and practice time counted from actual playing. */

/* ---------- state + sync ---------- */
const STATE_VERSION = 4;

const DEFAULT_STATE = () => ({
  v: STATE_VERSION,
  savedAt: 0,
  settings: {
    input: 'touch',
    octaveTolerant: true,
    micLatency: 70,
    midiLatency: 0,
    sound: true,
    volume: 0.8,
    midiOut: false,
    clickOnPiano: false,
    keepAwake: true,
    instrument: 'other', // which guide to show: 'cdp-s360', 'acoustic' or any other digital piano
  },
  profile: {
    favorites: [], // composers you love
    areas: { reading: true, sight: true, technique: true, theory: true, pieces: true, improv: true },
    weights: {}, // how much each area matters to you, learned from the focus you choose (1 = neutral)
    onboarded: false,
    assessed: null, // date of the placement check
    assessDismissed: null, // date the placement offer was put off
  },
  items: {}, // item id -> progress (see learn/curriculum.js)
  piece: { working: [], added: {} }, // pieces you are working on [{pid, daily}], and when each was started
  focus: null, // this week's focus area (see learn/skills.js)
  session: null, // today's session: {day, n, list:[{id, role, ...}], idx}
  pieceSession: null, // a longer sitting with your pieces, when you start one
  sessions: 0, // sessions started
  days: {}, // 'YYYY-MM-DD' -> {min, reps, clean}
  hist: [], // milestones: {d, id, e, v}
  timing: [], // timing scatter of recent metronome runs, for the steadiness skill
  steadyBase: null, // the steady-beat result of the placement check: {d, sd}
  lessonsSeen: {}, // kind of drill -> the day its body-and-hands note was last shown
  skillHist: {}, // 'YYYY-MM-DD' -> {skill: level}, for trends
  games: {}, // Free play games: best levels and scores
  legacy: null, // set when the state came from version 1 or 2
});

const Store = {
  s: DEFAULT_STATE(),
  db: null,
  uid: null,
  ref: null,
  writing: false,
  dirty: false,
  timer: null,
  listeners: new Set(),
  saves: 0,
  loadLocal() {
    let raw = null;
    try {
      raw = localStorage.getItem('dacapo.v1');
    } catch (e) {
      Log.warn('localStorage unavailable', String(e));
    }
    if (!raw) return;
    try {
      this.s = migrate(JSON.parse(raw));
      Log.ev('state loaded', { v: this.s.v, bytes: raw.length, items: Object.keys(this.s.items).length });
    } catch (e) {
      Log.err(e, 'state load');
      try {
        localStorage.setItem('dacapo.broken.' + Date.now(), raw);
      } catch (e2) {}
      this.s = DEFAULT_STATE();
    }
  },
  async connect() {
    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      this.db = db;
      this.uid = uid;
      this.ref = db.doc('data/users/' + uid + '/progress');
      Log.ev('sync connected');
      await this.pull();
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') this.pull();
      });
    } catch (e) {
      Log.warn('sync unavailable', String((e && e.message) || e));
    }
  },
  async pull() {
    if (!this.ref) return;
    try {
      const snap = await this.ref.get();
      if (snap.exists) {
        const remote = JSON.parse(snap.data().json || '{}');
        if ((remote.savedAt || 0) > (this.s.savedAt || 0)) {
          this.s = migrate(remote);
          this.saveLocal();
          Log.ev('sync pulled newer state', { savedAt: remote.savedAt });
          this.emit();
        } else if ((remote.savedAt || 0) < (this.s.savedAt || 0)) this.queue();
      } else if (this.s.savedAt) this.queue();
      this.emit('sync');
    } catch (e) {
      Log.warn('sync pull failed', String((e && e.message) || e));
    }
  },
  saveLocal() {
    try {
      localStorage.setItem('dacapo.v1', JSON.stringify(this.s));
    } catch (e) {
      Log.warn('local save failed; pruning', String(e));
      pruneState(this.s, true);
      try {
        localStorage.setItem('dacapo.v1', JSON.stringify(this.s));
      } catch (e2) {
        Log.err(e2, 'local save');
      }
    }
  },
  save() {
    this.s.savedAt = Date.now();
    if (++this.saves % 25 === 1) pruneState(this.s);
    this.saveLocal();
    this.queue();
  },
  queue() {
    if (!this.ref) return;
    this.dirty = true;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 1500);
  },
  async flush() {
    if (!this.ref || this.writing || !this.dirty) return;
    this.writing = true;
    this.dirty = false;
    try {
      let json = JSON.stringify(this.s);
      if (json.length > 230000) {
        pruneState(this.s, true);
        json = JSON.stringify(this.s);
      }
      await this.ref.set({ json, savedAt: this.s.savedAt });
    } catch (e) {
      Log.warn('sync write failed', String((e && e.message) || e));
      if (e && e.code === 'unavailable') {
        this.dirty = true;
        setTimeout(() => this.flush(), 2000 + Math.random() * 2000);
      }
    } finally {
      this.writing = false;
      if (this.dirty) this.queue();
    }
  },
  on(fn) {
    this.listeners.add(fn);
    return () => this.listeners.delete(fn);
  },
  emit(kind = 'state') {
    this.listeners.forEach(f => {
      try {
        f(kind);
      } catch (e) {
        Log.err(e, 'store listener');
      }
    });
  },
};

// Old saved states are brought up to date one version at a time.
function migrate(o) {
  if (!o || typeof o !== 'object') return DEFAULT_STATE();
  const from = o.v || 1;
  let s = from < 3 ? fromVersion2(o) : deepMerge(DEFAULT_STATE(), o);
  if (from < 4) s = toVersion4(s, o);
  s.v = STATE_VERSION;
  if (from < STATE_VERSION) Log.ev('migrated state', { from, to: STATE_VERSION });
  return s;
}

// Version 1 or 2: keep settings and practice minutes; the curriculum starts fresh.
function fromVersion2(o) {
  const s = DEFAULT_STATE();
  for (const k of Object.keys(s.settings))
    if (o.settings && o.settings[k] !== undefined) s.settings[k] = o.settings[k];
  for (const d in o.days || {}) {
    const m = +(o.days[d].min || 0);
    if (m > 0) s.days[d] = { min: Math.round(m * 10) / 10, reps: 0, clean: 0 };
  }
  s.legacy = { from: o.v || 1 };
  s.savedAt = o.savedAt || 0;
  return s;
}

// Version 3 → 4: tracks became areas (theory is new), the one active piece became a list of pieces you
// work on, and sessions are now built around a weekly focus.
function toVersion4(s, o) {
  const tracks = (o.profile && o.profile.tracks) || {};
  const on = k => tracks[k] !== false;
  s.profile.areas = {
    reading: on('reading'),
    sight: on('reading'),
    technique: on('technique'),
    theory: true,
    pieces: on('piece'),
    improv: on('improv'),
  };
  const active = o.piece && o.piece.active;
  s.piece.working = active ? [{ pid: active, daily: false }] : [];
  for (const k of ['tracks', 'note']) delete s.profile[k];
  delete s.piece.active;
  delete s.settings.seenVersion;
  delete s.imports;
  s.session = null;
  return s;
}

// Keep the saved document small enough to sync for years.
function pruneState(s, hard = false) {
  const cap = (arr, n) => {
    if (arr && arr.length > n) arr.splice(0, arr.length - n);
  };
  cap(s.hist, hard ? 150 : 400);
  Object.values(s.items || {}).forEach(it => cap(it.log, hard ? 12 : 30));
  const cutoff = todayKey(new Date(Date.now() - (hard ? 200 : 800) * DAY));
  for (const d in s.days) if (d < cutoff) delete s.days[d];
}

// defaults filled in from base; a saved value of the wrong shape (damaged data) keeps the default
function deepMerge(base, over) {
  if (over === undefined) return base;
  if (base === null) return over; // no default shape (e.g. today's session): taken as saved, checked where used
  if (Array.isArray(base)) return Array.isArray(over) ? over : base;
  if (typeof base !== 'object') return typeof over === typeof base ? over : base;
  if (!over || typeof over !== 'object' || Array.isArray(over)) return base;
  const out = { ...base };
  for (const k in over) out[k] = k in base ? deepMerge(base[k], over[k]) : over[k];
  return out;
}

/* ---------- practice time: counted from playing, not from the screen being open ---------- */
function dayRec(d = todayKey()) {
  return Store.s.days[d] || (Store.s.days[d] = { min: 0, reps: 0, clean: 0 });
}

const Activity = {
  last: 0,
  acc: 0,
  recent: 0, // recent: ms of activity in the current focus window (read by the session)
  note(ev) {
    if (ev && ev.src === 'touch') return; // on-screen keys are for trying things out, not practice time
    const now = Date.now();
    const gap = now - this.last;
    if (this.last && gap < 20000) {
      this.acc += gap;
      this.recent += gap;
    }
    this.last = now;
    if (this.acc >= 30000) {
      const d = dayRec();
      d.min = Math.round((d.min + this.acc / 60000) * 10) / 10;
      this.acc = 0;
      Store.save();
    }
  },
  flush() {
    if (this.acc > 5000) {
      const d = dayRec();
      d.min = Math.round((d.min + this.acc / 60000) * 10) / 10;
      this.acc = 0;
      Store.save();
    }
  },
};

window.addEventListener('pagehide', () => {
  try {
    Activity.flush();
  } catch (e) {}
});

// ---- core/input.js ----
/* What you play: MIDI over USB, the microphone (pitch detection) and the on-screen keys.
 * Every source emits the same note events. */

const Input = {
  listeners: new Set(),
  offListeners: new Set(),
  held: new Map(),
  pedal: false,
  mode: 'touch',
  midiAccess: null,
  midiNames: [],
  mic: null,
  status: 'Touch only',
  live: false,
  lastErr: '',
  touchSound: null, // see KeyTouch below
  on(fn) {
    this.listeners.add(fn);
    return () => this.listeners.delete(fn);
  },
  emit(ev) {
    Activity.note(ev);
    Wake.ensure();
    if (ev.src === 'mic')
      this.held.forEach((v, k) => {
        if (v.src === 'mic') this.held.delete(k);
      });
    this.held.set(ev.m, ev);
    this.listeners.forEach(f => {
      try {
        f(ev);
      } catch (e) {
        Log.err(e, 'note listener');
      }
    });
  },
  // releases: {m, t, src}; pedal changes arrive as {pedal:true|false}
  onOff(fn) {
    this.offListeners.add(fn);
    return () => this.offListeners.delete(fn);
  },
  emitOff(ev) {
    if (ev.m != null) this.held.delete(ev.m);
    this.offListeners.forEach(f => {
      try {
        f(ev);
      } catch (e) {
        Log.err(e, 'release listener');
      }
    });
  },
  // ev: {m, vel, t (performance ms, latency-corrected), src}
  async setMode(mode) {
    Log.ev('input mode ' + mode);
    this.stopMic();
    this.mode = mode;
    Store.s.settings.input = mode;
    Store.save();
    this.lastErr = '';
    if (mode === 'midi') await this.startMidi();
    else if (mode === 'mic') await this.startMic();
    else {
      this.live = false;
      this.status = 'Touch only';
    }
    this.paint();
  },
  paint() {
    const label =
      this.mode === 'midi'
        ? this.live
          ? 'Piano'
          : 'Connect'
        : this.mode === 'mic'
          ? this.live
            ? 'Listening'
            : 'Mic off'
          : 'Connect';
    const t = $('#inputChipTxt');
    if (t) t.textContent = label;
    const d = $('#inputDot');
    if (d) d.classList.toggle('live', this.live);
    const c = $('#inputChip');
    if (c) {
      c.classList.toggle('on', this.live);
      c.title = this.status;
    }
    Store.emit('input');
  },
  /* ---- MIDI ---- */
  async startMidi() {
    this.live = false;
    if (!navigator.requestMIDIAccess) {
      this.lastErr =
        'This browser has no Web MIDI. Use Chrome or Edge on a computer or Android, with the offline copy of this app.';
      this.status = 'Unavailable';
      return;
    }
    try {
      // one MIDI access for the life of the page: asking again (Connect, or switching modes) would bind the
      // same keyboard twice and every note would arrive twice
      this.midiAccess = this.midiAccess || (await navigator.requestMIDIAccess({ sysex: false }));
      const bind = () => {
        this.midiNames = [];
        this.midiAccess.inputs.forEach(inp => {
          if (inp.state === 'disconnected') return;
          this.midiNames.push(inp.name);
          inp.onmidimessage = e => this.onMidi(e);
        });
        this.live = this.midiNames.length > 0;
        // keys held when the cable came out will never send their release
        if (!this.live) this.held.forEach((ev, m) => ev.src === 'midi' && this.held.delete(m));
        this.status = this.live
          ? this.midiNames.join(', ')
          : 'No MIDI keyboard found. Plug it in by USB, then reopen this panel.';
        this.paint();
      };
      bind();
      MidiOut.pick(this.midiAccess);
      Log.ev('midi ready', { inputs: this.midiNames, output: MidiOut.port && MidiOut.port.name });
      this.midiAccess.onstatechange = e => {
        const was = this.live;
        bind();
        MidiOut.pick(this.midiAccess);
        Log.ev('midi state change', {
          port: e && e.port && e.port.name,
          state: e && e.port && e.port.state,
          live: this.live,
        });
        if (was !== this.live) toast(this.live ? 'Piano connected' : 'Piano disconnected', 1800);
      };
    } catch (e) {
      this.lastErr =
        'MIDI access was refused in this view. Open the hosted copy in Chrome or Edge to use your keyboard.';
      this.status = 'Refused';
      Log.warn('midi refused', String((e && e.message) || e));
    }
  },
  onMidi(e) {
    Log.midiMsg(e.data, e.timeStamp);
    if (this.mode !== 'midi') return; // the keyboard stays bound while another input is chosen
    const [st, d1, d2] = e.data;
    const cmd = st & 0xf0;
    const t = e.timeStamp - (Store.s.settings.midiLatency || 0);
    if ((st & 0x0f) === 9) return; // percussion channel (our own metronome clicks, if echoed)
    if (cmd === 0x90 && d2 > 0) {
      const r = MidiOut.recent.get(d1);
      if (r && Math.abs(e.timeStamp - r) < 60) return;
      this.emit({ m: d1, vel: d2 / 127, t, src: 'midi' });
    } else if (cmd === 0x80 || (cmd === 0x90 && d2 === 0)) this.emitOff({ m: d1, t, src: 'midi' });
    else if (cmd === 0xb0 && d1 === 64) {
      const on = d2 >= 64;
      if (on !== this.pedal) {
        this.pedal = on;
        this.emitOff({ pedal: on, t, src: 'midi' });
      }
    }
  },
  /* ---- microphone (monophonic YIN) ---- */
  async startMic() {
    this.live = false;
    if (!navigator.mediaDevices?.getUserMedia) {
      this.lastErr = 'No microphone API in this view.';
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
      });
      const ctx = AudioEngine.ensure();
      const src = ctx.createMediaStreamSource(stream);
      const an = ctx.createAnalyser();
      an.fftSize = 2048;
      an.smoothingTimeConstant = 0;
      src.connect(an);
      this.mic = {
        stream,
        src,
        an,
        buf: new Float32Array(an.fftSize),
        cand: null,
        count: 0,
        candT: 0,
        lastEmit: null,
        minRms: 1,
        quiet: 0,
        rms: 0,
        f0: 0,
        raf: 0,
        frame: 0,
        noise: 0.004,
      };
      this.live = true;
      this.status = 'Microphone on. Single notes are detected; chords are not.';
      Log.ev('mic on');
      const loop = () => {
        if (!this.mic) return;
        this.micFrame();
        this.mic.raf = requestAnimationFrame(loop);
      };
      this.mic.raf = requestAnimationFrame(loop);
    } catch (e) {
      this.lastErr =
        'Microphone access was refused in this view. Open the hosted copy of the app in your own browser to use listening.';
      this.status = 'Refused';
      Log.warn('mic refused', String((e && e.message) || e));
    }
  },
  stopMic() {
    if (!this.mic) return;
    cancelAnimationFrame(this.mic.raf);
    try {
      this.mic.stream.getTracks().forEach(t => t.stop());
      this.mic.src.disconnect();
    } catch (e) {}
    this.mic = null;
    this.live = false;
  },
  micFrame() {
    const M = this.mic;
    M.frame++;
    if (M.frame % 2) return; // ~30 analyses/s keeps phones cool
    M.an.getFloatTimeDomainData(M.buf);
    let rms = 0;
    for (let i = 0; i < M.buf.length; i++) rms += M.buf[i] * M.buf[i];
    rms = Math.sqrt(rms / M.buf.length);
    M.rms = rms;
    const gate = Math.max(0.012, M.noise * 3);
    const now = performance.now();
    if (rms < gate) {
      M.quiet++;
      if (M.quiet > 4) {
        if (M.lastEmit != null) this.emitOff({ m: M.lastEmit, t: performance.now(), src: 'mic' });
        M.lastEmit = null;
        M.cand = null;
        M.count = 0;
      }
      M.noise = M.noise * 0.98 + rms * 0.02;
      M.minRms = Math.min(M.minRms, rms);
      return;
    }
    M.quiet = 0;
    const r = yin(M.buf, AudioEngine.ctx.sampleRate);
    if (!r || r.clarity < 0.82 || r.f < 26 || r.f > 4300) {
      M.minRms = Math.min(M.minRms, rms);
      return;
    }
    M.f0 = r.f;
    const m = Math.round(69 + 12 * Math.log2(r.f / 440));
    if (m >= 85 && m <= 94 && Metro.nearClick(now - 30)) return; // ignore the metronome's own click
    if (m === M.cand) M.count++;
    else {
      M.cand = m;
      M.count = 1;
      M.candT = now;
    }
    const restrike = M.lastEmit === m && rms > M.minRms * 1.9 && rms > gate * 1.5;
    if (M.count === 2 && (M.lastEmit !== m || restrike)) {
      M.lastEmit = m;
      M.minRms = rms;
      this.emit({
        m,
        vel: clamp(rms * 6, 0.1, 1),
        t: M.candT - 33 - (Store.s.settings.micLatency || 0),
        src: 'mic',
      });
    } else if (M.count > 2 && restrike) {
      M.minRms = rms;
      this.emit({
        m,
        vel: clamp(rms * 6, 0.1, 1),
        t: now - 33 - (Store.s.settings.micLatency || 0),
        src: 'mic',
      });
    } else M.minRms = Math.min(M.minRms * 1.0, rms);
  },
};

function yin(buf, sr) {
  const N = buf.length,
    half = N >> 1,
    thr = 0.12;
  const tauMin = Math.floor(sr / 4300),
    tauMax = Math.min(half - 1, Math.floor(sr / 26));
  const d = new Float32Array(tauMax + 2);
  for (let tau = 1; tau <= tauMax + 1; tau++) {
    let s = 0;
    for (let i = 0; i < half; i++) {
      const x = buf[i] - buf[i + tau];
      s += x * x;
    }
    d[tau] = s;
  }
  d[0] = 1;
  let run = 0;
  for (let tau = 1; tau <= tauMax + 1; tau++) {
    run += d[tau];
    d[tau] = run ? (d[tau] * tau) / run : 1;
  }
  let tau = -1;
  for (let t = Math.max(2, tauMin); t <= tauMax; t++) {
    if (d[t] < thr) {
      while (t + 1 <= tauMax && d[t + 1] < d[t]) t++;
      tau = t;
      break;
    }
  }
  if (tau < 0) {
    // fall back to global min if reasonably clear
    let best = 1,
      bt = -1;
    for (let t = Math.max(2, tauMin); t <= tauMax; t++)
      if (d[t] < best) {
        best = d[t];
        bt = t;
      }
    if (best > 0.25) return null;
    tau = bt;
  }
  const a = d[tau - 1],
    b = d[tau],
    c = d[tau + 1] ?? b;
  const den = a + c - 2 * b;
  const shift = den ? (a - c) / (2 * den) : 0;
  return { f: sr / (tau + shift), clarity: 1 - b };
}

// compare pitch with octave tolerance in mic mode
function sameNote(played, expected, src) {
  if (played === expected) return true;
  return src === 'mic' && Store.s.settings.octaveTolerant && (played - expected) % 12 === 0;
}

/* ---------- MIDI out: let the app's examples and clicks sound on the piano itself ---------- */
const MidiOut = {
  port: null,
  recent: new Map(),
  active() {
    return !!(this.port && Store.s.settings.midiOut && Input.mode === 'midi' && Input.live);
  },
  pick(access) {
    let best = null;
    access.outputs.forEach(o => {
      if (!best || Input.midiNames.includes(o.name)) best = o;
    });
    this.port = best;
  },
  send(bytes, at) {
    try {
      if (at && at > performance.now()) this.port.send(bytes, at);
      else this.port.send(bytes);
    } catch (e) {}
  },
  noteOn(m, vel = 0.6, at, ch = 0) {
    this.send([0x90 | ch, m, clamp(Math.round(vel * 127), 1, 127)], at);
    if (ch === 0) this.recent.set(m, at || performance.now());
  },
  noteOff(m, at, ch = 0) {
    this.send([0x80 | ch, m, 0], at);
  },
  panic() {
    if (this.port) for (let ch = 0; ch < 16; ch++) this.send([0xb0 | ch, 123, 0]);
  },
};

window.addEventListener('pagehide', () => MidiOut.panic());

/* ---------- on-screen keyboard: multi-touch, held notes, glissando ---------- */
const KeyTouch = {
  held: new Map(), // pointerId -> {m, v, el}
  keyAt(x, y) {
    const el = document.elementFromPoint(x, y);
    return el && el.closest ? el.closest('svg.kb[data-play] [data-m]') : null;
  },
  press(id, el) {
    const m = +el.dataset.m;
    el.classList.add('down');
    // a screen can choose the sound of its keys (Input.touchSound: {on(m, vel), off(handle)})
    const sound = Input.touchSound || {
      on: (k, vel) => AudioEngine.noteOn(k, vel),
      off: v => AudioEngine.noteOff(v),
    };
    const v = sound.on(m, 0.62);
    this.held.set(id, { m, v, el, off: sound.off });
    Input.emit({ m, vel: 0.62, t: performance.now(), src: 'touch' });
  },
  lift(id) {
    const h = this.held.get(id);
    if (!h) return;
    this.held.delete(id);
    h.off(h.v);
    h.el.classList.remove('down');
    Input.emitOff({ m: h.m, t: performance.now(), src: 'touch' });
  },
};

// warm up audio on the very first touch anywhere, so the first key isn't late
document.addEventListener(
  'pointerdown',
  () => {
    if (!AudioEngine.ctx || AudioEngine.ctx.state !== 'running') AudioEngine.ensure();
  },
  { capture: true },
);

document.addEventListener(
  'pointerdown',
  e => {
    const k = e.target.closest && e.target.closest('svg.kb[data-play] [data-m]');
    if (!k) return;
    e.preventDefault();
    try {
      e.target.releasePointerCapture && e.target.releasePointerCapture(e.pointerId);
    } catch (err) {}
    KeyTouch.lift(e.pointerId);
    KeyTouch.press(e.pointerId, k);
  },
  { passive: false },
);

document.addEventListener(
  'pointermove',
  e => {
    const h = KeyTouch.held.get(e.pointerId);
    if (!h) return;
    const k = KeyTouch.keyAt(e.clientX, e.clientY);
    if (!k) {
      KeyTouch.lift(e.pointerId);
      return;
    }
    if (+k.dataset.m !== h.m) {
      KeyTouch.lift(e.pointerId);
      KeyTouch.press(e.pointerId, k);
    } // slide to the next key
  },
  { passive: true },
);

['pointerup', 'pointercancel'].forEach(t =>
  document.addEventListener(t, e => KeyTouch.lift(e.pointerId), { passive: true }),
);

document.addEventListener('contextmenu', e => {
  if (e.target.closest && e.target.closest('svg.kb[data-play]')) e.preventDefault();
});

// ---- core/audio.js ----
/* Sound: a soft piano-like synth, the metronome (lookahead scheduler) and the screen wake lock. */

/* ---------- keep the screen on while practicing (phone next to the piano) ---------- */
const Wake = {
  lock: null,
  lastUse: Date.now(),
  async ensure() {
    this.lastUse = Date.now();
    if (
      this.lock ||
      !Store.s.settings.keepAwake ||
      document.visibilityState !== 'visible' ||
      !navigator.wakeLock
    )
      return;
    try {
      this.lock = await navigator.wakeLock.request('screen');
      this.lock.addEventListener('release', () => {
        this.lock = null;
      });
    } catch (e) {
      /* not allowed here */
    }
  },
  release() {
    if (this.lock) {
      this.lock.release().catch(() => {});
      this.lock = null;
    }
  },
};

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - Wake.lastUse < 20 * 60000) Wake.ensure();
});

setInterval(() => {
  if (Wake.lock && Date.now() - Wake.lastUse > 20 * 60000 && !Metro.running) Wake.release();
}, 60000);

/* ---------- audio: soft piano-ish synth ---------- */
const AudioEngine = {
  ctx: null,
  master: null,
  comp: null,
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC({ latencyHint: 'interactive' });
      this.comp = this.ctx.createDynamicsCompressor();
      this.comp.threshold.value = -14;
      this.comp.ratio.value = 3;
      this.master = this.ctx.createGain();
      this.master.gain.value = Store.s.settings.volume ?? 0.8;
      this.master.connect(this.comp).connect(this.ctx.destination);
      Log.ev('audio context created', { state: this.ctx.state, sr: this.ctx.sampleRate });
      this.ctx.onstatechange = () => Log.ev('audio ' + this.ctx.state);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  now() {
    return this.ensure().currentTime;
  },
  voices: [],
  MAX_VOICES: 14,
  // one piano-ish voice with a natural decay; returns a handle that can be released early
  voice(midi, t, vel) {
    const ctx = this.ctx;
    const now = ctx.currentTime;
    this.voices = this.voices.filter(v => v.end > now);
    // steal the oldest sounding voices when too many ring at once; notes scheduled for later are left alone
    const sounding = this.voices.filter(v => v.start <= now + 0.02);
    for (let i = 0; sounding.length - i >= this.MAX_VOICES; i++) {
      const old = sounding[i];
      this.release(old, 0.02);
      this.voices.splice(this.voices.indexOf(old), 1);
    }
    const f = 440 * Math.pow(2, (midi - 69) / 12);
    const decay = clamp(3.2 - (midi - 40) * 0.035, 0.7, 3.4);
    const out = ctx.createGain();
    out.gain.value = 0;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(Math.min(16000, f * (5 + vel * 9)), t);
    lp.frequency.exponentialRampToValueAtTime(Math.max(f * 1.5, 300), t + decay);
    lp.connect(out);
    out.connect(this.master);
    const oscs = [
      [1, 1, 'triangle'],
      [2, 0.35, 'sine'],
      [3, 0.12, 'sine'],
    ].map(([mul, g, type]) => {
      const o = ctx.createOscillator();
      o.type = type;
      o.frequency.value = f * mul;
      o.detune.value = (Math.random() - 0.5) * 4;
      const gg = ctx.createGain();
      gg.gain.value = g;
      o.connect(gg).connect(lp);
      o.start(t);
      return o;
    });
    const peak = 0.22 * (0.35 + vel);
    out.gain.setValueAtTime(0, t);
    out.gain.linearRampToValueAtTime(peak, t + 0.004);
    out.gain.exponentialRampToValueAtTime(peak * 0.35, t + 0.25);
    out.gain.exponentialRampToValueAtTime(0.0008, t + decay);
    const v = { out, oscs, end: t + decay + 0.1, midi, start: t };
    oscs.forEach(o => o.stop(v.end + 0.05));
    this.voices.push(v);
    return v;
  },
  release(v, tau = 0.06, at) {
    if (!v || v.released) return;
    v.released = true;
    if (v.start > this.ctx.currentTime + 0.02 && at == null) return;
    const ctx = this.ctx;
    const t = Math.max(at ?? ctx.currentTime, ctx.currentTime);
    const g = v.out.gain;
    if (at == null || at <= ctx.currentTime) {
      if (g.cancelAndHoldAtTime) g.cancelAndHoldAtTime(t);
      else {
        g.cancelScheduledValues(t);
        g.setValueAtTime(g.value, t);
      }
    }
    g.setTargetAtTime(0.0001, t, tau);
    const stopAt = t + tau * 7;
    v.end = Math.min(v.end, stopAt);
    v.oscs.forEach(o => {
      try {
        o.stop(stopAt);
      } catch (e) {}
    });
  },
  rawPerf(t) {
    return performance.now() + (t - this.ctx.currentTime) * 1000;
  }, // audio clock → performance.now(), no output latency (for MIDI)
  note(midi, when = 0, dur = 1.2, vel = 0.65) {
    if (!Store.s.settings.sound) return;
    const ctx = this.ensure();
    const t = Math.max(ctx.currentTime, when || ctx.currentTime);
    if (MidiOut.active()) {
      const at = this.rawPerf(t);
      MidiOut.noteOn(midi, vel, at);
      MidiOut.noteOff(midi, at + dur * 1000);
      return;
    }
    const v = this.voice(midi, t, vel);
    this.release(v, 0.08, t + dur);
    v.released = false; // allow stealing to cut it early
  },
  // live playing: sound starts now and lasts while the key is held
  noteOn(midi, vel = 0.62) {
    if (!Store.s.settings.sound) return null;
    if (MidiOut.active()) {
      MidiOut.noteOn(midi, vel);
      return { mo: midi };
    }
    const ctx = this.ensure();
    return this.voice(midi, ctx.currentTime, vel);
  },
  noteOff(v) {
    if (!v) return;
    if (v.mo != null) {
      MidiOut.noteOff(v.mo);
      return;
    }
    this.release(v, 0.07);
  },
  stopAll() {
    // silence everything, including notes scheduled for later
    if (this.ctx) {
      const now = this.ctx.currentTime;
      this.voices.forEach(v => {
        try {
          v.out.gain.cancelScheduledValues(0);
          v.out.gain.setValueAtTime(0, now);
          v.oscs.forEach(o => o.stop(now + 0.01));
        } catch (e) {}
      });
      this.voices = [];
    }
    MidiOut.panic();
  },
  chord(midis, when = 0, dur = 1.6, vel = 0.55) {
    midis.forEach(m => this.note(m, when, dur, vel));
  },
  seq(midis, gap = 0.45, dur = 0.9, vel = 0.6) {
    const t = this.now() + 0.05;
    midis.forEach((m, i) =>
      Array.isArray(m) ? this.chord(m, t + i * gap, dur, vel) : this.note(m, t + i * gap, dur, vel),
    );
    return t;
  },
  click(when, accent, vol = 1) {
    const ctx = this.ensure();
    if (Store.s.settings.clickOnPiano && MidiOut.active()) {
      const at = this.rawPerf(when);
      MidiOut.noteOn(accent ? 76 : 77, clamp(vol * (accent ? 0.9 : 0.6), 0.1, 1), at, 9);
      MidiOut.noteOff(accent ? 76 : 77, at + 80, 9);
      return;
    }
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'square';
    o.frequency.value = accent ? 1760 : 1175;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = accent ? 2400 : 1700;
    bp.Q.value = 3;
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime((accent ? 0.5 : 0.3) * vol, when + 0.001);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.045);
    o.connect(bp).connect(g).connect(this.master);
    o.start(when);
    o.stop(when + 0.06);
  },
  chime() {
    const t = this.now() + 0.02;
    [84, 88, 91].forEach((m, i) => this.note(m, t + i * 0.12, 1.4, 0.35));
  },
  // map audio-clock seconds to performance.now() ms, incl. output latency
  toPerf(audioTime) {
    const ctx = this.ensure();
    const lat = ctx.outputLatency || ctx.baseLatency || 0;
    return performance.now() + (audioTime - ctx.currentTime + lat) * 1000;
  },
};

/* ---------- metronome with lookahead scheduler ---------- */
const Metro = {
  bpm: 60,
  beats: 4,
  sub: 1,
  vol: 0.8,
  clicks: [],
  groups: [],
  nearClick(t) {
    return this.running && this.clicks.some(c => Math.abs(t - c) < 70);
  },
  running: false,
  nextTime: 0,
  beatIdx: 0,
  subIdx: 0,
  timer: null,
  startAudio: 0,
  queue: [],
  listeners: new Set(),
  countIn: 0,
  raf: 0,
  set(o) {
    Object.assign(this, o);
    this.bpm = clamp(Math.round(this.bpm), 20, 260);
    this.emit('set');
  },
  start(opts = {}) {
    const ctx = AudioEngine.ensure();
    this.stop(true);
    if (opts.bpm) this.bpm = opts.bpm;
    if (opts.beats) this.beats = opts.beats;
    if (opts.sub) this.sub = opts.sub;
    this.groups =
      opts.groups ||
      (this.beats === 6 ? [3] : this.beats === 9 ? [3, 6] : this.beats === 12 ? [3, 6, 9] : []);
    this.countIn = opts.countIn || 0;
    this.running = true;
    this.beatIdx = 0;
    this.subIdx = 0;
    this.nextTime = Math.max(ctx.currentTime + 0.02, opts.at || ctx.currentTime + 0.12);
    this.startAudio = this.nextTime;
    this.timer = setInterval(() => this.schedule(), 25);
    this.schedule();
    const loop = () => {
      this.drawTick();
      if (this.running) this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
    this.emit('start');
    Log.ev('metronome start', { bpm: this.bpm, beats: this.beats, countIn: this.countIn });
    // audio time of the first "real" downbeat, after the count-in
    return this.startAudio + (this.countIn * this.beats * 60) / this.bpm;
  },
  stop(silent) {
    const was = this.running;
    clearInterval(this.timer);
    cancelAnimationFrame(this.raf);
    this.running = false;
    this.queue = [];
    if (!silent) this.emit('stop');
    if (was) Log.ev('metronome stop');
  },
  toggle() {
    this.running ? this.stop() : this.start();
  },
  schedule() {
    const ctx = AudioEngine.ctx;
    const spb = 60 / this.bpm;
    const ahead = document.hidden ? 1.2 : 0.12; // timers are throttled in background tabs
    while (this.nextTime < ctx.currentTime + ahead) {
      const pos = this.beatIdx % this.beats;
      const accent = this.subIdx === 0 && (pos === 0 || this.groups.includes(pos));
      if (this.subIdx === 0) {
        this.clicks.push(AudioEngine.toPerf(this.nextTime));
        if (this.clicks.length > 16) this.clicks.shift();
      }
      if (this.subIdx === 0)
        AudioEngine.click(this.nextTime, accent, this.vol * (accent && pos !== 0 ? 0.75 : 1));
      else AudioEngine.click(this.nextTime, false, this.vol * 0.35);
      if (this.subIdx === 0)
        this.queue.push({ t: this.nextTime, beat: this.beatIdx % this.beats, idx: this.beatIdx });
      this.subIdx++;
      if (this.subIdx >= this.sub) {
        this.subIdx = 0;
        this.beatIdx++;
      }
      this.nextTime += spb / this.sub;
    }
  },
  drawTick() {
    const now = AudioEngine.ctx.currentTime;
    while (this.queue.length && this.queue[0].t <= now) {
      const q = this.queue.shift();
      this.emit('beat', q);
    }
  },
  on(fn) {
    this.listeners.add(fn);
    return () => this.listeners.delete(fn);
  },
  emit(kind, data) {
    this.listeners.forEach(f => {
      try {
        f(kind, data);
      } catch (e) {
        Log.err(e, 'metronome listener');
      }
    });
  },
  taps: [],
  tap() {
    const now = performance.now();
    this.taps = this.taps.filter(t => now - t < 2500);
    this.taps.push(now);
    if (this.taps.length >= 3) {
      const d = (this.taps[this.taps.length - 1] - this.taps[0]) / (this.taps.length - 1);
      this.set({ bpm: 60000 / d });
      if (this.running) this.start();
    }
  },
};

// ---- core/ui.js ----
/* The router, bottom sheets and shared controls. */

const UI = { view: 'practice', params: {}, cleanup: [] };

// a segmented control: opts [[value, label]], the current value; cls adds classes (e.g. 'wrap')
function seg(name, opts, val, cls = '') {
  const button = ([v, label]) =>
    `<button type="button" data-v="${esc(v)}" aria-pressed="${String(v) === String(val)}">${label}</button>`;
  return `<div class="seg ${cls}" role="group" data-seg="${name}">${opts.map(button).join('')}</div>`;
}

// delegate seg clicks inside root: handlers[name](value)
// One listener per root; re-binding replaces handlers by name instead of stacking duplicates.
function bindSegs(root, handlers) {
  if (!root._segs) {
    root._segs = {};
    root.addEventListener('click', e => {
      const b = e.target.closest('[data-seg] [data-v]');
      if (!b || !root.contains(b)) return;
      const g = b.closest('[data-seg]');
      const h = root._segs[g.dataset.seg];
      if (!h) return;
      $$('[data-v]', g).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      h(b.dataset.v);
    });
  }
  Object.assign(root._segs, handlers);
}

function onUnmount(fn) {
  UI.cleanup.push(fn);
}

function go(view, params = {}) {
  if (!views[view]) view = 'practice';
  UI.cleanup.forEach(f => {
    try {
      f();
    } catch (e) {
      Log.err(e, 'view cleanup');
    }
  });
  UI.cleanup = [];
  closeSheet();
  Log.ev('view ' + view, Object.keys(params).length ? params : undefined);
  UI.view = view;
  UI.params = params;
  $$('#tabs [data-view]').forEach(b =>
    b.setAttribute('aria-current', b.dataset.view === view ? 'page' : 'false'),
  );
  const page = $('#page');
  const fresh = page.cloneNode(false);
  page.replaceWith(fresh); // drop old listeners
  try {
    views[view](fresh, params);
  } catch (e) {
    Log.err(e, 'view ' + view);
    showViewError(fresh);
  }
  window.scrollTo({ top: 0 });
  try {
    sessionStorage.setItem('dacapo.view', view);
  } catch (e) {}
  if (!IN_CLAUDE)
    try {
      history.replaceState(null, '', '#' + view);
    } catch (e) {}
}

// the screens, registered by the app at boot: name -> (page element, params) => void
const views = {};

function registerViews(map) {
  Object.assign(views, map);
}

function hasView(name) {
  return !!views[name];
}

function showViewError(page) {
  page.innerHTML = `<div class="card">
    <h2 class="h2">This screen hit a problem</h2>
    <p class="small">It was logged. You can report it with the flag button at the top, then try again.</p>
    <div class="row">
    <button class="btn" type="button" data-act="home">Back to practice</button>
    <button class="btn" type="button" data-act="report">Report
    it</button></div></div>`;
  $('[data-act="home"]', page).onclick = () => go('practice');
  $('[data-act="report"]', page).onclick = () => Log.ctx.openReport && Log.ctx.openReport();
}

function openSheet(html, onMount, { label = 'Panel' } = {}) {
  closeSheet();
  const layer = $('#layer');
  layer.innerHTML = `<div class="scrim" data-close></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}" tabindex="-1">${html}</section>`;
  const sheet = $('.sheet', layer);
  // keyboard and screen-reader users land in the panel, and return where they were when it closes
  layer._return = document.activeElement;
  sheet.focus({ preventScroll: true });
  layer.querySelector('[data-close]').addEventListener('click', closeSheet);
  sheet.addEventListener('click', e => {
    if (e.target.closest('[data-closebtn]')) closeSheet();
  });
  if (onMount) {
    try {
      const off = onMount(sheet);
      if (typeof off === 'function') layer._off = off;
    } catch (e) {
      Log.err(e, 'sheet ' + label);
    }
  }
  return sheet;
}

function closeSheet() {
  const layer = $('#layer');
  if (!layer) return;
  if (layer._off) {
    try {
      layer._off();
    } catch (e) {
      Log.err(e, 'sheet cleanup');
    }
    layer._off = null;
  }
  const back = layer._return;
  layer._return = null;
  if (!layer.innerHTML) return;
  layer.innerHTML = '';
  if (back && back.isConnected && back.focus) back.focus({ preventScroll: true });
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
});

const closeBtn = `<button class="iconbtn" type="button" data-closebtn aria-label="Close">
  <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;

// ---- music/theory.js ----
/* Music theory: spelled notes, scales and fingerings, keys, intervals and chords. */

/* ---------- music math ---------- */
const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];

const LPC = [0, 2, 4, 5, 7, 9, 11];

const ACC_TXT = { '-2': '𝄫', '-1': '♭', 0: '', 1: '♯', 2: '𝄪' };

const PC_NAMES_SHARP = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];

const PC_NAMES_FLAT = ['C', 'D♭', 'D', 'E♭', 'E', 'F', 'G♭', 'G', 'A♭', 'A', 'B♭', 'B'];

// Spelled note {l:0-6, a:-2..2, o:octave}
const N = (l, a, o) => ({ l, a, o });

const midiOf = n => 12 * (n.o + 1) + LPC[n.l] + n.a;

const diaOf = n => n.o * 7 + n.l;

const nameOf = (n, oct = true) => LETTERS[n.l] + ACC_TXT[n.a] + (oct ? n.o : '');

const fromDia = (d, a = 0) => N(((d % 7) + 7) % 7, a, Math.floor(d / 7));

function parseNote(s) {
  // "C#4", "Eb3", "F4"
  const m = /^([A-G])(bb|b|#|x|##)?(-?\d)?$/.exec(s);
  if (!m) throw new Error('bad note ' + s);
  const a = { bb: -2, b: -1, '#': 1, '##': 2, x: 2 }[m[2]] || 0;
  return N(LETTERS.indexOf(m[1]), a, m[3] !== undefined ? +m[3] : 4);
}

function midiName(m, flats = false) {
  return (flats ? PC_NAMES_FLAT : PC_NAMES_SHARP)[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
}

function stepUp(n, semis) {
  // next letter, given semitone distance
  const l = (n.l + 1) % 7,
    o = n.o + (n.l === 6 ? 1 : 0);
  const target = midiOf(n) + semis;
  const natural = 12 * (o + 1) + LPC[l];
  return N(l, target - natural, o);
}

const SCALE_STEPS = {
  major: [2, 2, 1, 2, 2, 2, 1],
  natural: [2, 1, 2, 2, 1, 2, 2],
  harmonic: [2, 1, 2, 2, 1, 3, 1],
  melodic: [2, 1, 2, 2, 2, 2, 1],
};

// the note `letters` letter names and `semis` semitones above n, spelled correctly
// (spellAbove(F, 3, 5) is B♭, a perfect 4th above F; never A♯)
function spellAbove(n, letters, semis) {
  const l = n.l + letters;
  const L = ((l % 7) + 7) % 7;
  const o = n.o + Math.floor(l / 7);
  return N(L, midiOf(n) + semis - (12 * (o + 1) + LPC[L]), o);
}

// a scale from interval steps in semitones, one letter per degree (for 7-note scales)
function spellScale(tonic, semis) {
  let total = 0;
  return [tonic].concat(semis.map((s, i) => spellAbove(tonic, i + 1, (total += s))));
}

function buildScale(tonic, type, octaves = 1, descend = true) {
  const steps = SCALE_STEPS[type];
  const out = [tonic];
  let cur = tonic;
  for (let o = 0; o < octaves; o++)
    for (const s of steps) {
      cur = stepUp(cur, s);
      out.push(cur);
    }
  if (descend) {
    if (type === 'melodic') {
      // descend as natural minor
      const nat = buildScale(tonic, 'natural', octaves, false);
      for (let i = nat.length - 2; i >= 0; i--) out.push(nat[i]);
    } else for (let i = out.length - 2; i >= 0; i--) out.push(out[i]);
  }
  return out;
}

// Keys: tonic spelled + signature (+sharps / -flats)
const MAJOR_KEYS = [
  { k: 'C', t: 'C', sig: 0 },
  { k: 'G', t: 'G', sig: 1 },
  { k: 'D', t: 'D', sig: 2 },
  { k: 'A', t: 'A', sig: 3 },
  { k: 'E', t: 'E', sig: 4 },
  { k: 'B', t: 'B', sig: 5 },
  { k: 'F#', t: 'F#', sig: 6 },
  { k: 'Db', t: 'Db', sig: -5 },
  { k: 'Ab', t: 'Ab', sig: -4 },
  { k: 'Eb', t: 'Eb', sig: -3 },
  { k: 'Bb', t: 'Bb', sig: -2 },
  { k: 'F', t: 'F', sig: -1 },
];

const MINOR_KEYS = [
  { k: 'A', t: 'A', sig: 0 },
  { k: 'E', t: 'E', sig: 1 },
  { k: 'B', t: 'B', sig: 2 },
  { k: 'F#', t: 'F#', sig: 3 },
  { k: 'C#', t: 'C#', sig: 4 },
  { k: 'G#', t: 'G#', sig: 5 },
  { k: 'Eb', t: 'Eb', sig: -6 },
  { k: 'Bb', t: 'Bb', sig: -5 },
  { k: 'F', t: 'F', sig: -4 },
  { k: 'C', t: 'C', sig: -3 },
  { k: 'G', t: 'G', sig: -2 },
  { k: 'D', t: 'D', sig: -1 },
];

const prettyKey = k => k.replace('#', '♯').replace(/^([A-G])b/, '$1♭');

// Standard one-octave fingerings, ascending tonic→tonic (8 numbers). For more octaves the
// top/bottom finger becomes the crossing finger.
const FINGER = {
  major: {
    C: ['12312345', '54321321'],
    G: ['12312345', '54321321'],
    D: ['12312345', '54321321'],
    A: ['12312345', '54321321'],
    E: ['12312345', '54321321'],
    B: ['12312345', '43214321'],
    'F#': ['23412312', '43213214'],
    Db: ['23123412', '32143213'],
    Ab: ['34123123', '32143213'],
    Eb: ['31234123', '32143213'],
    Bb: ['41231234', '32143213'],
    F: ['12341234', '54321321'],
  },
  minor: {
    A: ['12312345', '54321321'],
    E: ['12312345', '54321321'],
    B: ['12312345', '43214321'],
    'F#': ['34123123', '43213214'],
    'C#': ['34123123', '32143213'],
    'G#': ['34123123', '32132143'],
    Eb: ['31234123', '21432132'],
    Bb: ['41231234', '21321432'],
    F: ['12341234', '54321321'],
    C: ['12312345', '54321321'],
    G: ['12312345', '54321321'],
    D: ['12312345', '54321321'],
  },
};

// expand fingering across octaves / descending
function scaleFingers(keyName, type, hand, octaves) {
  const fam = type === 'major' ? 'major' : 'minor';
  const f = (FINGER[fam][keyName] || ['12312345', '54321321'])[hand === 'lh' ? 1 : 0].split('').map(Number);
  // RH repeats f[0..6] per octave and ends on f[7]; LH starts on f[0] and repeats f[1..7] per octave.
  const up = [];
  if (hand === 'lh') {
    up.push(f[0]);
    for (let o = 0; o < octaves; o++) for (let i = 1; i < 8; i++) up.push(f[i]);
  } else {
    for (let o = 0; o < octaves; o++) for (let i = 0; i < 7; i++) up.push(f[i]);
    up.push(f[7]);
  }
  const down = up.slice(0, -1).reverse();
  return up.concat(down);
}

function keySigNotes(sig, clef) {
  // returns dia positions
  const sharpT = [38, 35, 39, 36, 33, 37, 34],
    flatT = [34, 37, 33, 36, 32, 35, 31];
  const off = clef === 'bass' ? -14 : 0;
  if (sig > 0) return sharpT.slice(0, sig).map(d => ({ d: d + off, a: 1 }));
  if (sig < 0) return flatT.slice(0, -sig).map(d => ({ d: d + off, a: -1 }));
  return [];
}

function sigAccidentalFor(sig, letter) {
  const sh = [3, 0, 4, 1, 5, 2, 6],
    fl = [6, 2, 5, 1, 4, 0, 3];
  if (sig > 0 && sh.slice(0, sig).includes(letter)) return 1;
  if (sig < 0 && fl.slice(0, -sig).includes(letter)) return -1;
  return 0;
}

const INTERVALS = [
  { s: 1, n: 'm2', long: 'minor 2nd' },
  { s: 2, n: 'M2', long: 'major 2nd' },
  { s: 3, n: 'm3', long: 'minor 3rd' },
  { s: 4, n: 'M3', long: 'major 3rd' },
  { s: 5, n: 'P4', long: 'perfect 4th' },
  { s: 6, n: 'TT', long: 'tritone' },
  { s: 7, n: 'P5', long: 'perfect 5th' },
  { s: 8, n: 'm6', long: 'minor 6th' },
  { s: 9, n: 'M6', long: 'major 6th' },
  { s: 10, n: 'm7', long: 'minor 7th' },
  { s: 11, n: 'M7', long: 'major 7th' },
  { s: 12, n: 'P8', long: 'octave' },
];

const CHORDS = {
  maj: { n: 'Major', s: [0, 4, 7], sym: '' },
  min: { n: 'Minor', s: [0, 3, 7], sym: 'm' },
  dim: { n: 'Diminished', s: [0, 3, 6], sym: '°' },
  aug: { n: 'Augmented', s: [0, 4, 8], sym: '+' },
  maj7: { n: 'Major 7th', s: [0, 4, 7, 11], sym: 'maj7' },
  dom7: { n: 'Dominant 7th', s: [0, 4, 7, 10], sym: '7' },
  min7: { n: 'Minor 7th', s: [0, 3, 7, 10], sym: 'm7' },
  hdim7: { n: 'Half-diminished 7th', s: [0, 3, 6, 10], sym: 'ø7' },
  dim7: { n: 'Diminished 7th', s: [0, 3, 6, 9], sym: '°7' },
};

// spell chord tones by stacking thirds from a spelled root
function spellChord(root, type) {
  const st = CHORDS[type].s;
  return st.map((semi, i) => {
    const l = (root.l + 2 * i) % 7,
      o = root.o + Math.floor((root.l + 2 * i) / 7);
    const nat = 12 * (o + 1) + LPC[l];
    return N(l, midiOf(root) + semi - nat, o);
  });
}

function keyInfo(type, k) {
  const list = type === 'major' ? MAJOR_KEYS : MINOR_KEYS;
  return list.find(x => x.k === k) || list[0];
}

function tonicOct(hand, pc, octs) {
  return hand === 'lh' ? (octs === 1 && pc <= 4 ? 3 : 2) : octs === 2 && pc >= 8 ? 3 : 4;
}

const pcOf = n => (((LPC[n.l] + n.a) % 12) + 12) % 12;

const pcOfName = t => pcOf(parseNote(t + '4'));

function spellMidi(m, preferFlat = false) {
  const pc = ((m % 12) + 12) % 12;
  const o = Math.floor(m / 12) - 1;
  const sharpMap = [
    [0, 0],
    [0, 1],
    [1, 0],
    [1, 1],
    [2, 0],
    [3, 0],
    [3, 1],
    [4, 0],
    [4, 1],
    [5, 0],
    [5, 1],
    [6, 0],
  ];
  const flatMap = [
    [0, 0],
    [1, -1],
    [1, 0],
    [2, -1],
    [2, 0],
    [3, 0],
    [4, -1],
    [4, 0],
    [5, -1],
    [5, 0],
    [6, -1],
    [6, 0],
  ];
  const [l, a] = (preferFlat ? flatMap : sharpMap)[pc];
  return N(l, a, o);
}

// spell a midi number inside a key signature
function spellerFor(sig = 0) {
  const maj = MAJOR_KEYS.find(k => k.sig === sig) || { t: { '-6': 'Gb', '-7': 'Cb', 7: 'C#' }[sig] || 'C' };
  const map = {};
  buildScale(parseNote(maj.t + '4'), 'major', 1, false)
    .slice(0, 7)
    .forEach(n => (map[pcOf(n)] = [n.l, n.a]));
  return m => {
    const pc = ((m % 12) + 12) % 12;
    let o = Math.floor(m / 12) - 1;
    const e = map[pc];
    if (!e) return spellMidi(m, sig < 0);
    const nat = LPC[e[0]] + e[1];
    if (nat >= 12) o--;
    if (nat < 0) o++;
    return N(e[0], e[1], o);
  };
}

// note from midi + accidental (-2..2), used by the library
function spellAcc(m, alt) {
  const pc = (((m - alt) % 12) + 12) % 12;
  const l = LPC.indexOf(pc);
  if (l < 0) return spellMidi(m);
  return N(l, alt, Math.floor((m - alt) / 12) - 1);
}

// ---- music/analysis.js ----
/* Listening: key and chord detection for Free play, and the timing analysis of a played rep. */

/* ---------- key and chord detection ---------- */
const KK_MAJ = [6.35, 2.23, 3.48, 2.33, 4.38, 4.09, 2.52, 5.19, 2.39, 3.66, 2.29, 2.88];

const KK_MIN = [6.33, 2.68, 3.52, 5.38, 2.6, 3.53, 2.54, 4.75, 3.98, 2.69, 3.34, 3.17];

function pearson(x, y) {
  const mx = meanOf(x),
    my = meanOf(y);
  let a = 0,
    b = 0,
    c = 0;
  for (let i = 0; i < x.length; i++) {
    a += (x[i] - mx) * (y[i] - my);
    b += (x[i] - mx) ** 2;
    c += (y[i] - my) ** 2;
  }
  return b && c ? a / Math.sqrt(b * c) : 0;
}

function detectKey(ms) {
  if (ms.length < 8) return null;
  const h = new Array(12).fill(0);
  ms.forEach(m => h[((m % 12) + 12) % 12]++);
  const rot = (prof, pc) => prof.map((_, i) => prof[(i - pc + 12) % 12]);
  const all = [
    ...MAJOR_KEYS.map(k => ({ ...k, mode: 'major', r: pearson(h, rot(KK_MAJ, pcOfName(k.t))) })),
    ...MINOR_KEYS.map(k => ({ ...k, mode: 'minor', r: pearson(h, rot(KK_MIN, pcOfName(k.t))) })),
  ].sort((a, b) => b.r - a.r);
  return { best: all[0], second: all[1], conf: all[0].r - all[1].r, hist: h };
}

const CHORD_T = [
  ...Object.entries(CHORDS).map(([k, v]) => ({ k, s: v.s, sym: v.sym, n: v.n })),
  { k: 'sus2', s: [0, 2, 7], sym: 'sus2', n: 'Suspended 2nd' },
  { k: 'sus4', s: [0, 5, 7], sym: 'sus4', n: 'Suspended 4th' },
  { k: 'six', s: [0, 4, 7, 9], sym: '6', n: 'Major 6th' },
  { k: 'm6', s: [0, 3, 7, 9], sym: 'm6', n: 'Minor 6th' },
  { k: 'add9', s: [0, 2, 4, 7], sym: 'add9', n: 'Major add 9' },
  { k: 'maj9', s: [0, 2, 4, 7, 11], sym: 'maj9', n: 'Major 9th' },
  { k: 'm9', s: [0, 2, 3, 7, 10], sym: 'm9', n: 'Minor 9th' },
  { k: 'dom9', s: [0, 2, 4, 7, 10], sym: '9', n: 'Dominant 9th' },
];

function detectChord(midis, spell) {
  const ms = [...new Set(midis)].sort((a, b) => a - b);
  if (!ms.length) return null;
  const pcs = [...new Set(ms.map(m => m % 12))];
  const bass = ms[0] % 12;
  const nm = m => nameOf(spell(m), false);
  if (pcs.length === 1) return { name: nm(ms[0]), long: ms.length > 1 ? 'Octave' : 'Single note' };
  if (pcs.length === 2) {
    const iv = INTERVALS.find(i => i.s === ((ms[ms.length - 1] - ms[0]) % 12 || 12));
    return {
      name: nm(ms[0]) + '–' + nm(ms[ms.length - 1]),
      long: iv.s === 7 ? 'Open 5th' : iv.long[0].toUpperCase() + iv.long.slice(1),
    };
  }
  let best = null;
  for (const r of pcs) {
    const iv = new Set(pcs.map(p => (p - r + 12) % 12));
    for (const T of CHORD_T) {
      const ts = new Set(T.s);
      const all = [...iv].every(x => ts.has(x));
      const exact = all && iv.size === ts.size;
      const no5 = !exact && all && T.s.length >= 4 && !iv.has(7) && iv.size === ts.size - 1;
      if (!exact && !no5) continue;
      const score = (exact ? 10 : 6) + (r === bass ? 3 : 0) - T.s.length * 0.1;
      if (!best || score > best.score) best = { r, T, score };
    }
  }
  if (!best) return { name: ms.map(nm).join(' '), long: 'Cluster or unusual voicing' };
  const rootM = ms.find(m => m % 12 === best.r);
  const rootName = nm(rootM);
  const bi = best.T.s.indexOf((bass - best.r + 12) % 12);
  const inv =
    bass === best.r
      ? 'root position'
      : ['root position', '1st inversion', '2nd inversion', '3rd inversion', '4th inversion'][bi] ||
        'inverted';
  return {
    name: rootName + best.T.sym + (bass !== best.r ? '/' + nm(ms[0]) : ''),
    long: `${rootName} ${best.T.n.toLowerCase()}, ${inv}`,
    root: best.r,
    type: best.T.k,
    rootName,
  };
}

const dynName = v =>
  v < 0.25 ? 'pp' : v < 0.4 ? 'p' : v < 0.55 ? 'mp' : v < 0.7 ? 'mf' : v < 0.85 ? 'f' : 'ff';

/* ---------- a rolling record of what you played, for the live view ---------- */
// recent notes and what the pedal is holding, for Free play (started once at boot)
const Live = { hist: [], sustained: new Set() };

function startLive() {
  Input.on(ev => {
    Live.hist.push({ m: ev.m, t: ev.t, vel: ev.vel, src: ev.src });
    if (Live.hist.length > 400) Live.hist.shift();
    Live.sustained.delete(ev.m);
  });
  Input.onOff(ev => {
    if (ev.pedal === false) Live.sustained.clear();
    else if (ev.m != null && Input.pedal) Live.sustained.add(ev.m);
  });
}

function groupSteps(evs, win = 70) {
  const out = [];
  evs.forEach(e => {
    const g = out[out.length - 1];
    if (g && e.t - g.t < win) {
      if (!g.ms.includes(e.m)) g.ms.push(e.m);
    } else out.push({ t: e.t, ms: [e.m], vel: e.vel });
  });
  return out;
}

/* ---------- timing analysis ----------
   Notes are matched to the steps in order (a missed or extra note is tolerated), then a straight line
   is fitted through the matched onset times against the written beat positions. Its slope is the tempo
   you actually played; the scatter around it is your timing error. When you started does not matter.
   Unmatched notes are wrong notes. */
function analyzeSeq(onsets, steps, msPerBeat, { any = false, one = false } = {}) {
  const ons = onsets.slice().sort((a, b) => a.t - b.t);
  const used = new Array(ons.length).fill(false);
  const gaps = [];
  for (let k = 1; k < steps.length; k++) {
    const g = steps[k].beat - steps[k - 1].beat;
    if (g > 0.01) gaps.push(g);
  }
  const gapBeats = gaps.length ? median(gaps) : 1;
  const win = Math.max(90, Math.min(260, msPerBeat * gapBeats * 0.45)); // notes of one chord or of both hands
  const res = [];
  let ptr = 0;
  const fits = (o, m) => any || sameNote(o.m, m, o.src);
  for (let k = 0; k < steps.length; k++) {
    const want = any ? [null] : steps[k].midis;
    let first = -1;
    if (one && want.length > 1) {
      // microphone: one note of a chord is all it can hear
      let x0 = -1;
      for (let x = ptr; x < Math.min(ons.length, ptr + 6); x++)
        if (!used[x] && want.some(m => fits(ons[x], m))) {
          x0 = x;
          break;
        }
      if (x0 >= 0) {
        used[x0] = true;
        const o = ons[x0];
        res.push({
          i: k,
          ok: true,
          t: o.t,
          spread: 0,
          vel: o.vel || 0,
          notes: [{ m: o.m, t: o.t, vel: o.vel || 0 }],
        });
        ptr = x0 + 1;
      } else res.push({ i: k, ok: false });
      continue;
    }
    for (let x = ptr; x < Math.min(ons.length, ptr + 4 + want.length * 2); x++)
      if (!used[x] && want.some(m => fits(ons[x], m))) {
        first = x;
        break;
      }
    if (first < 0) {
      res.push({ i: k, ok: false });
      continue;
    }
    const t0 = ons[first].t;
    const hits = [];
    let maxIdx = first;
    for (const m of want) {
      let idx = -1;
      for (let x = Math.max(0, first - 3); x < ons.length && ons[x].t <= t0 + win; x++)
        if (!used[x] && !hits.some(h => h.x === x) && fits(ons[x], m) && Math.abs(ons[x].t - t0) <= win) {
          idx = x;
          break;
        }
      if (idx >= 0) {
        hits.push({ x: idx, o: ons[idx] });
        maxIdx = Math.max(maxIdx, idx);
      }
    }
    if (hits.length === want.length) {
      hits.forEach(h => (used[h.x] = true));
      const ts = hits.map(h => h.o.t);
      res.push({
        i: k,
        ok: true,
        t: Math.min(...ts),
        spread: Math.max(...ts) - Math.min(...ts),
        vel: meanOf(hits.map(h => h.o.vel || 0)),
        notes: hits.map(h => ({ m: h.o.m, t: h.o.t, vel: h.o.vel || 0 })), // each note: for hand and finger analysis
      });
      ptr = maxIdx + 1;
    } else {
      hits.forEach(h => (used[h.x] = true));
      ptr = maxIdx + 1;
      res.push({ i: k, ok: false, partial: hits.length });
    } // an incomplete chord still belongs here: later steps must not take its notes
  }
  const hit = res.filter(r => r.ok && !steps[r.i].grace);
  let a = hit.length ? hit[0].t - steps[hit[0].i].beat * msPerBeat : 0,
    b = msPerBeat;
  if (hit.length >= 3) {
    const xs = hit.map(r => steps[r.i].beat),
      ys = hit.map(r => r.t),
      mx = meanOf(xs),
      my = meanOf(ys);
    let num = 0,
      den = 0;
    xs.forEach((x, q) => {
      num += (x - mx) * (ys[q] - my);
      den += (x - mx) ** 2;
    });
    if (den && num > 0) {
      b = num / den;
      a = my - b * mx;
    }
  }
  hit.forEach(r => (r.dev = r.t - (a + b * steps[r.i].beat)));
  const sd = hit.length > 2 ? Math.sqrt(hit.reduce((s, r) => s + r.dev ** 2, 0) / (hit.length - 2)) : 0;
  const maxDev = hit.length ? Math.max(...hit.map(r => Math.abs(r.dev))) : 0;
  const vels = hit.map(r => r.vel);
  const vm = meanOf(vels);
  const vsd =
    vels.length > 1 ? Math.sqrt(vels.reduce((s, v) => s + (v - vm) ** 2, 0) / (vels.length - 1)) : 0;
  const spreads = hit.filter(r => steps[r.i].midis.length > 1).map(r => r.spread);
  // unmatched notes are wrong notes, except a barely-touched key
  const extras = ons.filter((o, x) => !used[x] && (o.src !== 'midi' || (o.vel || 0) >= 0.1));
  const okCount = res.filter(r => r.ok).length;
  return {
    res,
    accuracy: okCount / steps.length,
    sdMs: sd,
    gapBeats,
    sdBeat: b > 0 ? sd / b : 0,
    sdGap: b > 0 ? sd / (b * gapBeats) : 0,
    maxDevBeat: b > 0 ? maxDev / b : 0,
    tempoRatio: b > 0 ? msPerBeat / b : 1,
    start: a,
    msPerBeatPlayed: b,
    velSd: vsd,
    spread: spreads.length ? meanOf(spreads) : null,
    wrong: extras.length,
    wrongNotes: extras.slice(0, 6).map(o => o.m),
    complete: res.length > 0 && res[res.length - 1].ok,
    matched: okCount,
  };
}

/* The built-in music. Pieces come from public-domain and Creative Commons editions typeset by
 * volunteers of the Mutopia Project (tools/build_library.py reads their LilyPond sources and checks
 * every bar). Note data is packed as base64 varints: per note, onset delta and duration in ticks,
 * pitch change per hand, and one byte with accidental, hand and staff. */

const COMPOSERS = {
  satie: { n: 'Erik Satie', short: 'Satie', life: '1866–1925' },
  chopin: { n: 'Frédéric Chopin', short: 'Chopin', life: '1810–1849' },
  debussy: { n: 'Claude Debussy', short: 'Debussy', life: '1862–1918' },
  rachmaninoff: { n: 'Sergei Rachmaninoff', short: 'Rachmaninoff', life: '1873–1943' },
  mine: { n: 'Your files', short: 'Imported', life: '' },
};

const LEVEL_NAMES = [
  '',
  'Early intermediate',
  'Intermediate',
  'Late intermediate',
  'Advanced',
  'Very advanced',
];

const listenUrl = p =>
  'https://www.youtube.com/results?search_query=' +
  encodeURIComponent(`${(COMPOSERS[p.c] || {}).short || ''} ${p.t} ${p.sub || ''} piano`);

const scoreUrl = p =>
  'https://imslp.org/index.php?search=' +
  encodeURIComponent(`${(COMPOSERS[p.c] || {}).short || ''} ${p.t} ${p.sub || ''}`);

function b64bytes(s) {
  const bin = atob(s || '');
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function readVarints(bytes) {
  const out = [];
  let v = 0,
    sh = 0;
  for (const b of bytes) {
    v += (b & 0x7f) * Math.pow(2, sh);
    if (b & 0x80) sh += 7;
    else {
      out.push(v);
      v = 0;
      sh = 0;
    }
  }
  return out;
}

const unzz = n => (n % 2 ? -(n + 1) / 2 : n / 2);

const Library = {
  cache: new Map(),
  // your imported pieces, read from the device once and kept in memory (they are looked up constantly)
  mine: null,
  imports() {
    if (!this.mine)
      try {
        const list = JSON.parse(localStorage.getItem('dacapo.imports') || '[]');
        this.mine = Array.isArray(list) ? list : [];
      } catch (e) {
        this.mine = [];
      }
    return this.mine;
  },
  saveImports(list) {
    try {
      localStorage.setItem('dacapo.imports', JSON.stringify(list));
      this.mine = list;
      return true;
    } catch (e) {
      Log.err(e, 'save import');
      return false;
    }
  },
  // forget everything decoded for a piece (after it is removed or replaced)
  forget(id) {
    ['', 'bars:', 'secs:'].forEach(k => this.cache.delete(k + id));
  },
  all() {
    return (typeof LIBRARY_DATA !== 'undefined' ? LIBRARY_DATA : []).concat(this.imports());
  },
  get(id) {
    return this.all().find(p => p.id === id) || null;
  },
  // decoded notes: [{t, d, m, acc, h, s, f}] with t, d in quarter-note beats
  notes(id) {
    if (this.cache.has(id)) return this.cache.get(id);
    const p = this.get(id);
    if (!p) return [];
    const out = this.decode(p);
    this.cache.set(id, out);
    return out;
  },
  decode(p) {
    const id = p.id;
    const bytes = b64bytes(p.notes);
    let pos = 0;
    const rv = () => {
      let val = 0,
        sh = 0;
      while (pos < bytes.length) {
        const b = bytes[pos++];
        val += (b & 0x7f) * Math.pow(2, sh);
        if (!(b & 0x80)) break;
        sh += 7;
      }
      return val;
    };
    const out = [];
    let t = 0;
    const prev = [60, 48];
    const shift = p.shift || 0;
    while (pos < bytes.length && out.length < p.n) {
      t += rv();
      const d = rv();
      const dz = rv();
      const flags = bytes[pos++];
      const h = Math.floor(flags / 5) % 2;
      const m = prev[h] + unzz(dz);
      prev[h] = m;
      out.push({
        t: t / p.tpq - shift,
        d: d / p.tpq,
        m,
        acc: (flags % 5) - 2,
        h,
        s: Math.floor(flags / 10) % 2,
        f: 0,
      });
    }
    const fv = readVarints(b64bytes(p.fing));
    let fi = 0;
    for (let k = 0; k + 1 < fv.length; k += 2) {
      fi += fv[k];
      if (out[fi]) out[fi].f = fv[k + 1];
    }
    if (out.length !== p.n) Log.warn('library decode count mismatch', { id, got: out.length, want: p.n });
    return out;
  },
  bars(id) {
    const p = this.get(id);
    const key = 'bars:' + id;
    if (this.cache.has(key)) return this.cache.get(key);
    let acc = 0;
    const out = readVarints(b64bytes(p.bars)).map(x => (acc += x) / p.tpq - (p.shift || 0));
    this.cache.set(key, out);
    return out;
  },
  // the practice sections of a piece: bars a..z, the section it repeats (same, or -1), and how many notes
  // start in it (n; a section without any cannot be practiced on its own)
  sections(id) {
    const key = 'secs:' + id;
    if (this.cache.has(key)) return this.cache.get(key);
    const p = this.get(id);
    const out = ((p && p.secs) || []).map(([a, z, same], k) => ({
      k,
      a,
      z,
      same,
      n: this.range(id, a, z).length,
    }));
    this.cache.set(key, out);
    return out;
  },
  atBar(list, bar, def) {
    let v = def;
    (list || []).forEach(x => {
      if (x[0] <= bar) v = x;
    });
    return v;
  },
  timeAt(id, bar) {
    const p = this.get(id);
    const x = this.atBar(p.ts, bar, [0, 4, 4]);
    return [x[1], x[2]];
  },
  keyAt(id, bar) {
    const p = this.get(id);
    const x = this.atBar(p.keys, bar, [0, 0]);
    return x[1];
  },
  tempoAt(id, bar) {
    const p = this.get(id);
    let v = p.bpm;
    (p.tempos || []).forEach(([b, bpm]) => {
      if (b - 1 <= bar) v = bpm;
    });
    return v;
  },
  clefAt(id, staff, bar) {
    const p = this.get(id);
    let c = p.c === 'mine' && staff === 1 ? 'b' : 't';
    /* LilyPond's default clef is treble on every staff */ (p.clefs || []).forEach(([b, s, k]) => {
      if (s === staff && b <= bar) c = k;
    });
    return c;
  },
  // the notes of a bar range; grace notes just before the first bar belong to it
  range(id, a, z) {
    const bars = this.bars(id);
    const s0 = bars[a],
      s1 = bars[Math.min(z, bars.length - 1)];
    const eps = 0.2;
    return this.notes(id).filter(
      n =>
        n.t >= s0 - (n.d === 0 ? eps : 0) &&
        (n.t < s1 - (n.d === 0 ? eps : 0) || (z >= bars.length - 1 && n.t <= s1)),
    );
  },
  /* steps for practicing bars a..z with the given hands ('rh' | 'lh' | 'ht') */
  steps(id, a, z, hand) {
    const p = this.get(id);
    const bars = this.bars(id);
    const s0 = bars[a];
    const all = this.range(id, a, z);
    const want = hand === 'rh' ? [0] : hand === 'lh' ? [1] : [0, 1];
    const groups = new Map();
    all.forEach(n => {
      if (!want.includes(n.h)) return;
      const key = n.t.toFixed(4);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(n);
    });
    const steps = [...groups.entries()]
      .sort((x, y) => +x[0] - +y[0])
      .map(([k, ns]) => {
        const beat = +k - s0;
        const grace = ns.every(n => n.d === 0);
        return {
          midis: [...new Set(ns.map(n => n.m))].sort((x, y) => x - y),
          beat,
          grace,
          dur: Math.max(...ns.map(n => n.d)),
          notes: ns.map(n => ({
            n: spellAcc(n.m, n.acc),
            st: n.s ? 'b' : 't',
            f: n.f || '',
            fcls: n.h ? 'lh' : 'rh',
            d: n.d,
            t: n.t - s0,
          })),
        };
      });
    const ghost =
      hand === 'ht'
        ? []
        : all
            .filter(n => !want.includes(n.h))
            .map(n => ({ n: spellAcc(n.m, n.acc), st: n.s ? 'b' : 't', d: n.d, t: n.t - s0, ghost: true }));
    return {
      steps,
      ghost,
      bars: bars.slice(a, z + 1).map(b => b - s0),
      total: bars[Math.min(z, bars.length - 1)] - s0,
      sig: this.keyAt(id, a),
      time: this.timeAt(id, a),
      clefs: [this.clefAt(id, 0, a), this.clefAt(id, 1, a)],
      clefChanges: (p.clefs || [])
        .filter(([b]) => b > a && b < z)
        .map(([b, s, k]) => ({ t: bars[b] - s0, s, k })),
    };
  },
  // how a piece is counted: click unit in quarter notes, clicks per bar
  meter(id, bar) {
    const [n, d] = this.timeAt(id, bar);
    const unit = d === 8 ? 0.5 : 1;
    const clicks = d === 8 ? n : d === 2 ? n * 2 : n;
    return { n, d, unit, clicks, barBeats: (n * 4) / d };
  },
};
