        b.onclick = () => b.dataset.arr !== pid && setTimeout(() => pieceSheet(b.dataset.arr));
      });
      const noodle = $('#psNoodle', sheet);
      if (noodle) noodle.onclick = () => go('play', { song: pid });
      const inMood = $('#psMood', sheet);
      if (inMood) inMood.onclick = () => go('play', { mood: p.mood, pc: p.pc });
      const del = $('#psDel', sheet);
      if (del) del.onclick = () => removeImport(pid);
      return () => AudioEngine.stopAll();
    },
    { label: p.t },
  );
}

/* ---------- a piece: its sections, and the one you are playing ---------- */
function piecePage(page, pid, itemParam) {
  const P = Library.get(pid);
  startPiece(pid);
  const ids = pieceOrder(pid);
  const st = { item: ids.includes(itemParam) ? itemParam : nextItem(pid) };
  let player = null;
  onUnmount(() => player && player.destroy());
  onUnmount(() => AudioEngine.stopAll());
  page.innerHTML = `
    <section class="session">
      <div class="sess-top">
        <button class="btn sm ghost" type="button" id="sgBack">← Songs</button>
        <button class="btn sm ghost" type="button" id="sgInfo">About the piece</button>
      </div>
      <h1 class="h1 pagetitle">${esc(P.t)}</h1>
      <p class="small">${esc(P.c === 'tunes' ? P.sub : (COMPOSERS[P.c] || {}).n || '')} · ♩ ${P.bpm} · ${esc(LEVEL_NAMES[P.lvl] || '')}</p>
      <div class="sections" id="sgSecs"></div>
    </section>
    ${connectNotice()}
    <div id="sgBody"></div>
    <div class="row">
      <button class="btn sm ghost" type="button" id="sgReset">Start this section over</button>
      <button class="btn sm ghost" type="button" id="sgStop">Stop learning this piece</button>
    </div>`;
  bindConnect();
  $('#sgBack', page).onclick = () => go('songs');
  $('#sgInfo', page).onclick = () => pieceSheet(pid);
  // a section that went wrong (stuck slow, or one hand alone) can start again from wait mode; two taps
  let resetArmed = false;
  $('#sgReset', page).onclick = e => {
    if (!resetArmed) {
      resetArmed = true;
      e.target.textContent = 'Tap again to start over';
      return;
    }
    resetArmed = false;
    e.target.textContent = 'Start this section over';
    delete Store.s.items[st.item];
    Store.save();
    toast('Started over');
    mount();
  };
  $('#sgStop', page).onclick = () => {
    stopPiece(pid);
    toast('Stopped. Its progress is kept.');
    go('songs');
  };
  const paintSecs = () => {
    $('#sgSecs', page).innerHTML = ids
      .map(id => {
        const d = itemDef(id);
        const it = itemState(id);
        const label = d.kind === 'full' ? 'Whole' : String(d.k + 1);
        return `<button type="button" class="secbtn ${it ? it.stage : ''}" data-item="${id}" aria-pressed="${id === st.item}"
          title="${esc(d.sub)}: ${it ? STAGE_TXT[it.stage] : 'not started'}">${label}</button>`;
      })
      .join('');
    $$('[data-item]', page).forEach(b => {
      b.onclick = () => {
        st.item = b.dataset.item;
        mount();
      };
    });
  };
  const mount = () => {
    if (player) player.destroy();
    paintSecs();
    player = Player.mount($('#sgBody', page), {
      id: st.item,
      about: () => sectionSheet(st.item),
      onEvent: ev => {
        if (ev.type === 'rep') paintSecs();
      },
    });
  };
  mount();
}

// a section: where it stands, and its recent days
function sectionSheet(id) {
  const d = itemDef(id);
  const it = itemState(id);
  if (!d) return;
  const recent = ((it && it.log) || []).slice(-10).reverse();
  openSheet(
    `<div class="sheethead"><h2 class="h2">${esc(d.title)}</h2>${closeBtn}</div>
     <p class="small">${esc(d.sub)}</p>
     ${d.about ? `<p>${esc(d.about)}</p>` : ''}
     <p><b>${esc(STAGE_TXT[it ? it.stage : ''] || 'Not started')}</b> · ${esc(criterion(id))}</p>
     <p class="small">A section is learned in wait mode (the app waits for the right notes): each hand, then
       together, two clean runs each. Then with the metronome: two clean runs out of three raise the tempo
       about 5%, a run with wrong notes lowers it 10%, until it is at the piece's tempo. The notation is
       simplified: spacing shows timing.</p>
     ${
       recent.length
         ? `<div class="stack" style="gap:4px"><span class="eyebrow">Recent days</span>${recent
             .map(
               h => `<div class="row between small"><span>${esc(h.d)}</span>
                 <span>${h.reps} runs · ${h.clean} clean${h.bpm ? ' · best ♩ ' + h.bpm : ''}</span></div>`,
             )
             .join('')}</div>`
         : ''
     }`,
    null,
    { label: 'About this section' },
  );
}

// the first four bars (plus a pickup), at the target tempo
function playOpening(p) {
  AudioEngine.ensure();
  const bars = Library.bars(p.id);
  const end = bars[Math.min(4 + (p.pickup ? 1 : 0), bars.length - 1)];
  const spb = 60 / p.bpm;
  const t0 = AudioEngine.now() + 0.1;
  for (const n of Library.notes(p.id)) {
    if (n.t >= end) continue;
    AudioEngine.note(n.m, t0 + Math.max(0, n.t) * spb, Math.max(0.15, n.d * spb), n.h ? 0.42 : 0.55);
  }
}

function removeImport(pid) {
  Library.saveImports(Library.imports().filter(x => x.id !== pid));
  Library.forget(pid);
  stopPiece(pid);
  for (const k of Object.keys(Store.s.items)) if (k.startsWith(`p:${pid}:`)) delete Store.s.items[k];
  Store.save();
  go('songs');
  toast('Removed');
}

// ---- learn/echo.js ----
/* Echo: the app plays a short phrase, you play it back. Playing by ear, in small steps: a few notes close
   together first, then longer phrases, wider leaps, other keys and minor. Three right in a row moves up a
   level; two misses in a row moves down one, so it stays at the edge of what you can hear. */

const MAJOR = [0, 2, 4, 5, 7, 9, 11];
const MINOR = [0, 2, 3, 5, 7, 8, 10];
const PENTA = [0, 2, 4, 7, 9];

// len: notes; scale; span: highest scale step used (0 = the tonic); leap: largest step between notes
// (in scale steps); keys: tonics to choose from; gap: seconds between notes
const ECHO_LEVELS = [
  { len: 2, scale: PENTA, span: 2, leap: 1, keys: ['C'], gap: 0.6 },
  { len: 3, scale: PENTA, span: 2, leap: 1, keys: ['C'], gap: 0.6 },
  { len: 3, scale: PENTA, span: 3, leap: 2, keys: ['C'], gap: 0.55 },
  { len: 4, scale: PENTA, span: 4, leap: 2, keys: ['C', 'G', 'F'], gap: 0.55 },
  { len: 4, scale: MAJOR, span: 4, leap: 1, keys: ['C', 'G', 'F'], gap: 0.5 },
  { len: 5, scale: MAJOR, span: 7, leap: 2, keys: ['C', 'G', 'F', 'D'], gap: 0.5 },
  { len: 5, scale: MAJOR, span: 7, leap: 4, keys: ['C', 'G', 'F', 'D', 'Bb'], gap: 0.5 },
  { len: 5, scale: MINOR, span: 4, leap: 2, keys: ['A', 'D', 'E'], gap: 0.5 },
  { len: 6, scale: MINOR, span: 7, leap: 4, keys: ['A', 'D', 'E', 'G', 'C'], gap: 0.45 },
  { len: 6, scale: MAJOR, span: 9, leap: 5, keys: ['C', 'G', 'F', 'D', 'Bb', 'A', 'Eb'], gap: 0.45 },
  { len: 7, scale: MAJOR, span: 9, leap: 7, keys: ['C', 'G', 'F', 'D', 'Bb', 'A', 'Eb', 'E'], gap: 0.42 },
];
const MAX_ECHO = ECHO_LEVELS.length;

const TONIC = { C: 60, D: 62, E: 64, F: 65, G: 55, A: 57, Bb: 58, Eb: 63 };
const NAMES = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
const pcName = m => NAMES[((m % 12) + 12) % 12];

// a phrase for a level: {key, minor, tonic, notes: [midi], chord: [midi]}
function makePhrase(level, previous) {
  const L = ECHO_LEVELS[Math.max(1, Math.min(MAX_ECHO, level)) - 1];
  const key = pick(L.keys);
  const tonic = TONIC[key];
  const minor = L.scale === MINOR;
  // scale step k (may pass the octave) to midi
  const midi = k => tonic + 12 * Math.floor(k / L.scale.length) + L.scale[k % L.scale.length];
  for (let tries = 0; tries < 20; tries++) {
    const steps = [0]; // phrases start on the tonic at first, anywhere in the scale later
    if (level > 3) steps[0] = pick([0, 0, 2, 4].filter(k => k <= L.span));
    while (steps.length < L.len) {
      const last = steps[steps.length - 1];
      const options = [];
      for (let k = 0; k <= L.span; k++) if (k !== last && Math.abs(k - last) <= L.leap) options.push(k);
      steps.push(pick(options));
    }
    const notes = steps.map(midi);
    if (previous && notes.join() === previous.notes.join()) continue;
    const third = minor ? 3 : 4;
    return { key, minor, tonic, notes, chord: [tonic - 12, tonic - 12 + third, tonic - 12 + 7] };
  }
  return makePhrase(level, null);
}

// played: midis in order. Any octave counts; the order and the notes must match.
function judge(phrase, played) {
  const pc = m => ((m % 12) + 12) % 12;
  for (let i = 0; i < played.length; i++)
    if (i >= phrase.notes.length || pc(played[i]) !== pc(phrase.notes[i])) return { ok: false, wrongAt: i };
  return {
    ok: played.length === phrase.notes.length,
    wrongAt: -1,
    partial: played.length < phrase.notes.length,
  };
}

// the game's progress after an answer: {level, best, streak, misses}
function afterAnswer(g, ok) {
  const next = { level: g.level || 1, best: g.best || 1, streak: g.streak || 0, misses: g.misses || 0 };
  if (ok) {
    next.streak++;
    next.misses = 0;
    if (next.streak >= 3 && next.level < MAX_ECHO) {
      next.level++;
      next.streak = 0;
    }
  } else {
    next.streak = 0;
    next.misses++;
    if (next.misses >= 2 && next.level > 1) {
      next.level--;
      next.misses = 0;
    }
  }
  next.best = Math.max(next.best, next.level);
  return next;
}

// ---- views/echo.js ----
/* Echo, the call-and-response game (rules in learn/echo.js). */

const PAUSE_MS = { right: 1300, wrong: 3200 };

function drawEcho(body) {
  const games = (Store.s.games = Store.s.games || {});
  const g = (games.echo = Object.assign({ level: 1, best: 1, streak: 0, misses: 0 }, games.echo));
  const E = { phase: 'idle', phrase: null, played: [], timers: [] };
  const later = (fn, ms) => E.timers.push(setTimeout(fn, ms));
  const clear = () => {
    E.timers.forEach(clearTimeout);
    E.timers = [];
  };

  body.innerHTML = `
    <div class="card echo">
      <div class="row between">
        <div>
          <span class="eyebrow">Echo</span>
          <div class="h3" id="ecLevel"></div>
        </div>
        <div class="streak" id="ecStreak" aria-label="Right in a row"></div>
      </div>
      <p class="small">DaCapo plays a short phrase after a chord that sets the key. Play it back, in any
        octave. Three right in a row and the phrases grow.</p>
      <div class="echo-prompt" id="ecPrompt"></div>
      <div class="feedback pl-msg" id="ecMsg" aria-live="polite"></div>
      <div class="kbwrap scrollx"><div id="ecKb"></div></div>
      <div class="row">
        <button class="btn cover" type="button" id="ecGo">Play a phrase</button>
        <button class="btn" type="button" id="ecAgain" disabled>Hear it again</button>
      </div>
    </div>`;
  const msg = (t, cls = '') => {
    const e = $('#ecMsg', body);
    e.className = 'feedback pl-msg ' + cls;
    e.textContent = t;
  };
  const kb = (marks = {}) => ($('#ecKb', body).innerHTML = kbSVG({ from: 48, to: 84, marks, h: 110 }));

  function paintHead() {
    const L = ECHO_LEVELS[g.level - 1];
    $('#ecLevel', body).textContent = `Level ${g.level} of ${MAX_ECHO} · ${L.len} notes · best ${g.best}`;
    $('#ecStreak', body).innerHTML = [0, 1, 2]
      .map(i => `<i class="${i < g.streak ? 'on' : ''}"></i>`)
      .join('');
  }
  function prompt() {
    const p = E.phrase;
    $('#ecPrompt', body).innerHTML = p
      ? `<b>${esc(p.key.replace('b', '♭'))} ${p.minor ? 'minor' : 'major'}</b> · starts on ${esc(pcName(p.notes[0]))}
         · ${E.played.length} of ${p.notes.length}`
      : '';
  }

  // the key chord, then the phrase; listening starts when it has finished
  function playPhrase() {
    clear();
    const p = E.phrase;
    const L = ECHO_LEVELS[g.level - 1];
    E.phase = 'listen';
    E.played = [];
    const t = AudioEngine.now() + 0.08;
    AudioEngine.chord(p.chord, t, 0.9, 0.42);
    p.notes.forEach((m, i) => AudioEngine.note(m, t + 1.1 + i * L.gap, L.gap * 1.3, 0.62));
    const ends = (1.1 + p.notes.length * L.gap) * 1000;
    later(() => {
      E.phase = 'answer';
      msg('Your turn.');
    }, ends);
    msg('Listen…');
    $('#ecAgain', body).disabled = false;
    kb();
    prompt();
  }
  function newPhrase() {
    E.phrase = makePhrase(g.level, E.phrase);
    $('#ecGo', body).textContent = 'Skip';
    playPhrase();
    Log.ev('echo phrase', { level: g.level, notes: E.phrase.notes.length });
  }

  function answered(ok) {
    E.phase = 'shown';
    Object.assign(g, afterAnswer(g, ok));
    Store.save();
    const p = E.phrase;
    const marks = Object.fromEntries(p.notes.map(m => [m, { cls: 'rh' }]));
    kb(marks);
    if (ok) msg(g.streak === 0 && g.level > 1 ? `Right. Up to level ${g.level}.` : 'Right.', 'ok');
    else {
      msg(`It was ${p.notes.map(pcName).join(' – ')}. Listen once more.`, 'bad');
      const L = ECHO_LEVELS[Math.min(MAX_ECHO, g.level) - 1];
      const t = AudioEngine.now() + 0.5;
      p.notes.forEach((m, i) => AudioEngine.note(m, t + i * L.gap, L.gap * 1.3, 0.62));
    }
    paintHead();
    Log.ev('echo answer', { ok, level: g.level, streak: g.streak });
    later(newPhrase, ok ? PAUSE_MS.right : PAUSE_MS.wrong + p.notes.length * 400);
  }

  const off = Input.on(
    Log.guard('echo note', ev => {
      const svg = $('#ecKb svg', body);
      if (E.phase !== 'answer') return;
      E.played.push(ev.m);
      const r = judge(E.phrase, E.played);
      flashKey(svg, ev.m, r.wrongAt >= 0 ? 'bad' : 'ok', 260);
      prompt();
      if (r.wrongAt >= 0) answered(false);
      else if (r.ok) answered(true);
    }),
  );

  $('#ecGo', body).onclick = () => {
    AudioEngine.ensure();
    newPhrase();
  };
  $('#ecAgain', body).onclick = () => {
    if (!E.phrase) return;
    clear();
    playPhrase();
  };
  kb();
  paintHead();
  msg(Input.live ? 'Press "Play a phrase" when you are ready.' : 'Use your piano, or the keys below.');

  return () => {
    clear();
    off();
  };
}

// ---- views/explore.js ----
/* Explore: look and listen, with nothing recorded. Find a mood by the feel you are after, see how keys fit
   together on the circle of fifths, train the ear, and see the whole of what there is to learn. A mood's
   page has everything about it: how it sounds, its scale and fingering, its color note, its chords and
   progressions, and its neighbors (one note different). From there: noodle in it, or practice it. */

const TABS = [
  ['feel', 'By feel'],
  ['circle', 'Circle of fifths'],
  ['ear', 'Ear'],
  ['map', 'The map'],
];

const exploreView = (page, params = {}) => {
  if (params.mood && MOOD_BY[params.mood]) return moodPage(page, params.mood, params.pc);
  const tab = TABS.some(t => t[0] === params.tab) ? params.tab : UI.exploreTab || 'feel';
  UI.exploreTab = tab;
  page.innerHTML = `
    <h1 class="h1 pagetitle">Explore</h1>
    ${seg('exTab', TABS, tab, 'wrap')}
    <div id="exBody" class="stack" style="gap:16px"></div>`;
  bindSegs(page, { exTab: v => go('explore', { tab: v }) });
  const body = $('#exBody', page);
  const off = { feel: feelTab, circle: circleTab, ear: earTab, map: mapTab }[tab](body, params);
  if (typeof off === 'function') onUnmount(off);
  onUnmount(() => AudioEngine.stopAll());
};

/* ---------- by feel ---------- */
const VIBES = [
  'brooding',
  'tragic',
  'melancholy',
  'yearning',
  'ominous',
  'haunting',
  'tension',
  'twisting',
  'noir',
  'mystical',
  'fiery',
  'dreamy',
  'bittersweet',
  'hopeful',
  'gritty',
  'wondrous',
  'triumphant',
  'peaceful',
];

// how well a mood fits the words you typed: each word that one of its vibes, its feel or its name starts
// with (or contains, for longer words)
function score(M, words) {
  const hay = [
    ...M.vibes,
    ...M.feel.split(/[\s,;]+/),
    M.n.toLowerCase(),
    MOOD_FAMILIES.find(f => f.id === M.fam).n.toLowerCase(),
  ];
  return words.reduce(
    (a, w) => a + (hay.some(h => h.startsWith(w) || (w.length >= 4 && h.includes(w))) ? 1 : 0),
    0,
  );
}

// the words for a mood's feel that its description does not already say
const vibesBeyond = M => M.vibes.filter(v => !M.feel.toLowerCase().includes(v));

function moodCard(M) {
  return `<div class="moodcard">
    <div class="grow">
      <b>${esc(M.n)}</b>
      <span class="small">${esc(M.feel)}</span>
      <span class="small vibes">${vibesBeyond(M).slice(0, 5).map(esc).join(' · ')}</span>
    </div>
    <button class="btn sm ghost" type="button" data-hear="${M.id}" aria-label="Hear ${esc(M.n)}">▶ Hear</button>
    <button class="btn sm" type="button" data-open="${M.id}">Open</button>
  </div>`;
}

function feelTab(body) {
  const q = UI.exploreQuery || '';
  body.innerHTML = `
    <section class="card stack">
      <label class="field">What do you want to sound like?
        <input class="input" id="exQ" type="search" value="${esc(q)}" placeholder="brooding, tragic, eerie, triumphant…" autocomplete="off">
      </label>
      <div class="chips">${VIBES.map(v => `<button type="button" class="chip" data-vibe="${v}" aria-pressed="${q.split(/\s+/).includes(v)}">${v}</button>`).join('')}</div>
    </section>
    <div id="exList" class="stack" style="gap:16px"></div>`;
  const list = $('#exList', body);
  const paint = () => {
    const words = (UI.exploreQuery || '')
      .toLowerCase()
      .split(/[\s,]+/)
      .filter(Boolean);
    if (!words.length) {
      list.innerHTML = MOOD_FAMILIES.map(
        f => `<section class="card"><h2 class="h2">${esc(f.n)}</h2>
          <div class="stack" style="gap:0">${MOODS.filter(m => m.fam === f.id)
            .map(moodCard)
            .join('')}</div></section>`,
      ).join('');
      return;
    }
    const ranked = MOODS.map(M => ({ M, s: score(M, words) }))
      .filter(x => x.s > 0)
      .sort((a, b) => b.s - a.s);
    list.innerHTML = ranked.length
      ? `<section class="card"><div class="stack" style="gap:0">${ranked.map(x => moodCard(x.M)).join('')}</div></section>`
      : `<section class="card"><p class="small">No mood matches those words. Try one of the feels above,
          or a word like dark, sad, tense, dreamy, exotic or bright.</p></section>`;
  };
  const setQ = v => {
    UI.exploreQuery = v;
    $$('[data-vibe]', body).forEach(b =>
      b.setAttribute('aria-pressed', String(v.split(/\s+/).includes(b.dataset.vibe))),
    );
    paint();
  };
  $('#exQ', body).oninput = e => setQ(e.target.value);
  $$('[data-vibe]', body).forEach(b => {
    b.onclick = () => {
      const words = (UI.exploreQuery || '').split(/\s+/).filter(Boolean);
      const v = b.dataset.vibe;
      const next = words.includes(v) ? words.filter(w => w !== v) : [...words, v];
      $('#exQ', body).value = next.join(' ');
      setQ(next.join(' '));
    };
  });
  body.addEventListener('click', e => {
    const h = e.target.closest('[data-hear]');
    if (h) hearPhrase(h.dataset.hear, plainestKey(h.dataset.hear));
    const o = e.target.closest('[data-open]');
    if (o) go('explore', { mood: o.dataset.open });
  });
  paint();
}

/* ---------- a mood ---------- */
const noteLabel = n => esc('CDEFGAB'[n.l] + (n.a > 0 ? '♯'.repeat(n.a) : n.a < 0 ? '♭'.repeat(-n.a) : ''));

function moodPage(page, mood, pcParam) {
  const M = MOOD_BY[mood];
  const p = prefs();
  const pc =
    Number.isInteger(+pcParam) && pcParam !== '' && pcParam != null
      ? +pcParam % 12
      : p.mood === mood && p.pc != null
        ? p.pc
        : plainestKey(mood);
  const fam = MOOD_FAMILIES.find(f => f.id === M.fam);
  const run = moodRun(mood, pc, 'rh', 1);
  const up = run.steps.slice(0, Math.ceil(run.steps.length / 2));
  const fr = moodFingering(mood, pc, 'rh', 1);
  const marks = {};
  up.forEach((s, i) => (marks[s.midis[0]] = { cls: 'rh', f: fr[i] }));
  const color = colorNote(mood, pc);
  marks[up.find(s => ((s.midis[0] % 12) + 12) % 12 === color.pc).midis[0]].cls = 'color';
  const staff = staffSVG({
    clef: 'treble',
    sig: run.sig,
    items: up.map(s => ({ notes: s.notes })),
    spacing: 34,
    top: 36,
    bottom: 36,
  });
  const chords = moodChords(mood, pc);
  const P = M.parent ? MOOD_BY[M.parent] : null;
  const neighbors = moodNeighbors(mood);
  const relatives = moodRelatives(mood).filter(r => MOOD_BY[r.id].semis.length >= 5);
  const chordRow = (c, k) => `<tr class="${c.signature ? 'sig' : ''}">
      <td class="mono">${esc(c.num)}</td>
      <td><b>${esc(c.name)}</b>${c.signature ? ' <span class="pill brass">signature</span>' : ''}
        <span class="small">${esc(c.word)}</span></td>
      <td class="small">${c.notes.map(noteLabel).join(' ')}</td>
      <td class="small">${c.seventh ? esc(c.seventh.name) : ''}</td>
      <td><button class="btn sm ghost" type="button" data-hearc="${k}" aria-label="Hear ${esc(c.name)}">Hear</button></td>
    </tr>`;
  const progRow = (pr, k) => {
    const V = voiceProgression(mood, pc, pr.chords);
    return `<div class="progrow">
      <div class="grow"><b>${V.map(v => esc(v.info.name)).join(' – ')}</b>
        <span class="small mono">${V.map(v => esc(v.info.num)).join(' – ')}</span>
        <span class="small">${esc(pr.why)}</span></div>
      <button class="btn sm ghost" type="button" data-hearp="${k}">Hear</button>
    </div>`;
  };
  page.innerHTML = `
    <section class="session">
      <div class="sess-top">
        <button class="btn sm ghost" type="button" id="mpBack">← Explore</button>
        <span class="pill">${esc(fam.n)}</span>
      </div>
      <div class="stack" style="gap:2px">
        <h1 class="h1 pagetitle">${esc(moodName(mood, pc))}</h1>
        <p class="small">${esc(M.feel[0].toUpperCase() + M.feel.slice(1))}${vibesBeyond(M).length ? ' · ' + vibesBeyond(M).map(esc).join(' · ') : ''}</p>
      </div>
      <div class="keychips" aria-label="Key">${PCS.map(
        x =>
          `<button type="button" class="chip" data-pc="${x}" aria-pressed="${x === pc}">${esc(tonicName(mood, x))}</button>`,
      ).join('')}</div>
      <div class="row">
        <button class="btn cover" type="button" id="mpPlay">Noodle in this</button>
        <button class="btn" type="button" id="mpPractice">Practice this</button>
      </div>
    </section>
    <section class="card stack">
      <h2 class="h2">The sound</h2>
      <div class="row">
        <button class="btn" type="button" id="mpHearMood">Hear the mood</button>
        <button class="btn" type="button" id="mpHearScale">Hear the scale</button>
      </div>
      <p>${esc(M.how)}</p>
      <p><b>Color note: ${esc(color.name)}</b>, ${esc(color.what)}: ${esc(color.tip)}.</p>
      <p class="small">Where you have heard it: ${esc(M.hear)}.</p>
    </section>
    ${musicIn(mood)}
    <section class="card stack">
      <h2 class="h2">The scale</h2>
      <div class="staffwrap"><div style="max-width:520px;margin:0 auto">${staff.svg}</div></div>
      <div class="kbwrap scrollx">${kbSVG({ from: up[0].midis[0] - 3, to: up[up.length - 1].midis[0] + 3, marks, h: 92, interactive: false })}</div>
      <p class="small">Right-hand fingering shown; the color note is marked.${blackKey(mood, pc) ? ' A black-key one: the hand sits further in, over the black keys.' : ''}</p>
    </section>
    <section class="card stack">
      <h2 class="h2">Chords</h2>
      ${P ? `<p class="small">These are the chords of ${esc(P.n.toLowerCase())}, the scale ${esc(M.n.toLowerCase())} comes from: the pentatonic leaves out the notes most likely to clash, so it fits over nearly all of them.</p>` : ''}

  $('#mpHearMood', page).onclick = () => hearChords(mood, pc, M.progs[0].chords, { bar: 2.2, melody: true });
  $('#mpHearScale', page).onclick = () => hearScale(mood, pc);
  page.addEventListener('click', e => {
    const t = e.target.closest('button');
    if (!t) return;
    const d = t.dataset;
    if (d.pc != null && t.closest('.keychips')) go('explore', { mood, pc: +d.pc });
    else if (d.hearc != null) {

    } else if (d.hearp != null) hearChords(mood, pc, M.progs[+d.hearp].chords);
    else if (d.hearn) hearPhrase(d.hearn, pc);
    else if (d.hearr) hearPhrase(d.hearr, +d.rpc);
    else if (d.go) go('explore', { mood: d.go, pc: +d.gopc });

  // remembered for Play and Practice
  Object.assign(p, { mood, pc });

}

/* music clearly in this mood: pieces and tunes tagged with it (learn/pieces), any key. Minor-key music
   uses both minors (the natural one in its melodies, the raised 7th of harmonic minor in its chords), so
   each of those pages lists the other's pieces too. */
const MINORS = ['natural', 'harmonic'];
function musicIn(mood) {
  const all = Library.all().filter(p => p.mood && p.c !== 'mine' && !(p.pair && p.id.endsWith('-4')));
  const order = (a, b) => a.lvl - b.lvl || a.t.localeCompare(b.t);
  const mine = all.filter(p => p.mood === mood).sort(order);
  const other = MINORS.includes(mood)
    ? all.filter(p => p.mood !== mood && MINORS.includes(p.mood)).sort(order)
    : [];
  if (!mine.length && !other.length) return '';
  const row = p => `<button type="button" class="piecerow" data-piece="${esc(p.id)}">
      <span class="grow"><span class="ttl">${esc(p.t)}</span>
        <span class="small">${esc((COMPOSERS[p.c] || {}).short || '')} · ${esc(moodName(p.mood, p.pc))} · ${esc(LEVEL_NAMES[p.lvl] || '')}</span></span>
      <span class="chev" aria-hidden="true">›</span></button>`;
  return `<section class="card stack">
      <h2 class="h2">Music in this mood</h2>
      <p class="small">Tap one to hear it, learn it, or noodle in its key.</p>
      <div class="stack" style="gap:0">${mine.map(row).join('')}</div>
      ${
        other.length
          ? `<p class="small">Minor-key music mixes both minors: the natural minor in its melodies, the raised
        7th of harmonic minor in its chords. Also in a minor key:</p>
      <div class="stack" style="gap:0">${other.map(row).join('')}</div>`
          : ''
      }
    </section>`;
}

/* ---------- the circle of fifths ---------- */
const SHARPS = 'F C G D A E B'.split(' ');
const FLATS = 'B E A D G C F'.split(' ');
const sigWords = sig =>
  !sig
    ? 'no sharps or flats'
    : sig > 0
      ? `${sig} sharp${sig > 1 ? 's' : ''} (${SHARPS.slice(0, sig).join('♯ ')}♯)`
      : `${-sig} flat${sig < -1 ? 's' : ''} (${FLATS.slice(0, -sig).join('♭ ')}♭)`;
const minorOf = pc => (pc + 9) % 12;

function circleSVG(sel) {
  const cx = 160;
  const cy = 160;
  const arc = (r0, r1, a0, a1) => {
    const p = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    const [x0, y0] = p(r1, a0);
    const [x1, y1] = p(r1, a1);
    const [x2, y2] = p(r0, a1);
    const [x3, y3] = p(r0, a0);
    return `M${x0} ${y0}A${r1} ${r1} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 0 0 ${x3} ${y3}Z`;
  };
  const i0 = CIRCLE.indexOf(sel);
  const near = new Set([(i0 + 11) % 12, (i0 + 1) % 12]); // IV and V beside I
  let s = '';
  CIRCLE.forEach((pc, i) => {
    const a = ((i * 30 - 90 - 15) * Math.PI) / 180;
    const b = ((i * 30 - 90 + 15) * Math.PI) / 180;
    const mid = (i * 30 - 90) * (Math.PI / 180);
    const cls = i === i0 ? 'sel' : near.has(i) ? 'near' : '';
    const t = (r, text, k) =>
      `<text x="${cx + r * Math.cos(mid)}" y="${cy + r * Math.sin(mid) + 5}" text-anchor="middle" class="${k}">${text}</text>`;
    const sig = moodSig('major', pc);
    const maj = pc === 6 ? 'F♯/G♭' : tonicName('major', pc);
    s += `<g class="wedge ${cls}" data-cpc="${pc}" role="button" aria-label="${esc(maj)} major">
      <path d="${arc(108, 152, a, b)}" class="outer"/>
      <path d="${arc(64, 106, a, b)}" class="inner"/>
      ${t(134, esc(maj), pc === 6 ? 'nm sm' : 'nm')}
      ${t(116, sig ? Math.abs(sig) + (sig > 0 ? '♯' : '♭') : '', 'sg')}
      ${t(85, esc(tonicName('natural', minorOf(pc))) + 'm', 'mn')}
    </g>`;
  });
  return `<svg class="cof" viewBox="0 0 320 320" aria-label="The circle of fifths">${s}
    <text x="160" y="156" text-anchor="middle" class="ctr">major outside</text>
    <text x="160" y="172" text-anchor="middle" class="ctr">minor inside</text></svg>`;
}

function circleTab(body) {
  const sel = UI.circlePc != null ? UI.circlePc : 0;
  const i = CIRCLE.indexOf(sel);
  const IV = CIRCLE[(i + 11) % 12];
  const V = CIRCLE[(i + 1) % 12];
  const name = pc => tonicName('major', pc);
  const minor = pc => tonicName('natural', minorOf(pc));
  const m = pc => minor(pc) + 'm';
  body.innerHTML = `
    <section class="card stack">
      <div class="cofwrap">${circleSVG(sel)}</div>
      <div class="stack" style="gap:6px">
        <h2 class="h2">${esc(name(sel))} major · ${esc(minor(sel))} minor</h2>
        <p>${esc(sigWords(moodSig('major', sel)))}. ${esc(minor(sel))} minor is its relative: the same notes, home on the 6th.</p>
        <p class="small">Its family: ${esc(name(IV))} (IV) and ${esc(name(V))} (V) beside it, ${esc(m(IV))} (ii),
          ${esc(m(V))} (iii) and ${esc(m(sel))} (vi) inside them. Those six chords, plus one diminished chord,
          are every chord of ${esc(name(sel))} major.</p>
        <div class="row">
          <button class="btn sm" type="button" data-prog="0,maj 5,maj 7,maj 0,maj">Hear I – IV – V – I</button>
          <button class="btn sm" type="button" data-prog="9,min 2,min 7,maj 0,maj">Hear vi – ii – V – I</button>
          <button class="btn sm ghost" type="button" id="cfAround">Hear the circle</button>
        </div>
        <div class="row">
          <button class="btn sm" type="button" data-go="major">Explore ${esc(name(sel))} major</button>
          <button class="btn sm" type="button" data-go="natural">Explore ${esc(minor(sel))} minor</button>
          <button class="btn sm cover" type="button" id="cfPractice">Practice the circle</button>
        </div>
      </div>
    </section>
    <section class="card stack">
      <h2 class="h2">How it works</h2>
      <p>Each step clockwise is a fifth up and adds one sharp: the new sharp is the 7th note of the new key
        (G major adds F♯). Each step the other way adds a flat. So a key's signature is just how far round it is.</p>
      <p>Neighbors share all but one note, so moving to a neighboring key sounds smooth, and the chords
        beside a key (IV and V) are its strongest. V to I, one step counter-clockwise, is the strongest pull
        in Western music.</p>
      <p>Progressions often walk the circle home: vi – ii – V – I is three steps counter-clockwise. Inside,
        each minor key sits under its relative major.</p>
    </section>`;
  body.querySelector('.cof').addEventListener('click', e => {
    const w = e.target.closest('[data-cpc]');
    if (!w) return;
    UI.circlePc = +w.dataset.cpc;
    circleTab(body);
  });
  $$('[data-prog]', body).forEach(b => {
    b.onclick = () =>
      hearChords(
        'major',
        sel,
        b.dataset.prog.split(' ').map(x => {
          const [s, t] = x.split(',');
          return [+s, t];
        }),
      );
  });
  $('#cfAround', body).onclick = () => {
    AudioEngine.ensure();
    AudioEngine.stopAll();
    const t0 = AudioEngine.now() + 0.1;
    circleRun('ht').steps.forEach((st, k) => AudioEngine.chord(st.midis, t0 + k * 0.9, 0.9, 0.3));
  };
  $$('[data-go]', body).forEach(b => {
    b.onclick = () =>
      go('explore', { mood: b.dataset.go, pc: b.dataset.go === 'natural' ? minorOf(sel) : sel });
  });
  $('#cfPractice', body).onclick = () => go('practice', { circle: 1 });
}

function earSheet() {
  const e = Store.s.moods.ear;
  let round = null;
  let answered = false;
  const next = () => {
    round = earRound(e.by);
    answered = false;
    paint();
    hearPhrase(round.mood, round.pc);
  };
  const paint = () => {
    const body = $('#earBody');
    if (!body) return;
    body.innerHTML = `
      <div class="row"><button class="btn" type="button" id="earAgain">Hear it again</button>
        <span class="small">${e.n ? `${e.right} of ${e.n} right` : ''}</span></div>
      <div class="earopts">${round.options
        .map(id => `<button class="btn" type="button" data-ear="${id}">${esc(MOOD_BY[id].n)}</button>`)
        .join('')}</div>
      <p id="earSay" class="small"></p>`;
    $('#earAgain', body).onclick = () => hearPhrase(round.mood, round.pc);
    $$('[data-ear]', body).forEach(b => {
      b.onclick = () => {
        if (answered) return;
        answered = true;
        const right = b.dataset.ear === round.mood;
        const R = MOOD_BY[round.mood];
        const c = colorNote(round.mood, round.pc);
        e.n++;
        if (right) e.right++;
        const by = e.by[round.mood] || [0, 0];
        e.by[round.mood] = [by[0] + 1, by[1] + (right ? 1 : 0)];
        Store.save();
        b.classList.add(right ? 'ok' : 'bad');
        body.querySelector(`[data-ear="${round.mood}"]`).classList.add('ok');
        $('#earSay', body).innerHTML =
          `${right ? 'Yes' : 'No'}: ${esc(moodName(round.mood, round.pc))}, ${esc(R.feel)}.
          The giveaway is ${esc(c.what)} (${esc(c.name)}), held near the end.
          <button class="btn sm cover" type="button" id="earNext">Next</button>`;
        $('#earNext', body).onclick = next;
      };
    });
  };
  openSheet(
    `<div class="sheethead"><h2 class="h2">Which mood?</h2>${closeBtn}</div>
     <p class="small">The mood's chords with its scale rising over them, then its color note and home.</p>
     <div id="earBody" class="stack"></div>`,
    () => {
      next();
      return () => AudioEngine.stopAll();
    },
    { label: 'Which mood?' },
  );
}

/* Practice: when you want to work on something. The core first (major and minor in every key, and the
   circle of fifths), everything else when you like. A key has three steps, in any order: its scale (right,
   left or both hands), its chords (inversions, progressions, left-hand patterns) and its arpeggios. Help is
   yours to switch: keys lit, finger numbers, a metronome, the exact octave. "Check me" is the one strict
   moment: both hands, two octaves, no help; passing it once makes the key known. */

const STEPS = [

function helpBar(box, { hand, step, check, onChange, onCheck }) {
  const p = prefs();
  const chip = (id, on, label) =>
    `<button type="button" class="chip" data-help="${id}" aria-pressed="${on}">${label}</button>`;
  box.innerHTML = `<div class="helpbar">
    ${step === 'lh' ? '' : seg('prHand', HANDS, hand, 'sm')}
    ${chip('keys', p.keys, 'Keys lit')}
    ${chip('fingers', p.fingers, 'Finger numbers')}
    ${chip('exactOctave', p.exactOctave, 'Exact octave')}
    ${chip('tempo', p.tempo, p.tempo ? `Tempo ♩ ${p.bpm}` : 'Tempo')}
    ${p.tempo ? `<span class="row" style="gap:4px"><button class="btn sm ghost" type="button" data-bpm="-5" aria-label="Slower">−</button><button class="btn sm ghost" type="button" data-bpm="5" aria-label="Faster">+</button></span>` : ''}
    ${
      step === 'scale' || step === 'arps'
        ? seg(
            'prOct',
            [
              ['1', '1 octave'],
              ['2', '2 octaves'],
            ],
            String(p.octs),
            'sm',
          )
        : ''
    }
    ${check ? '<button class="btn sm cover" type="button" id="prCheck">Check me</button>' : ''}
  </div>`;
  $$('[data-help]', box).forEach(b => {
    b.onclick = () => {
      p[b.dataset.help] = !p[b.dataset.help];
      Store.save();
      onChange({});
    };
  });
  $$('[data-bpm]', box).forEach(b => {
    b.onclick = () => {
      p.bpm = Math.max(30, Math.min(160, p.bpm + +b.dataset.bpm));
      Store.save();
      onChange({});
    };
  });
  bindSegs(box, {
    prHand: v => onChange({ hand: v }),
    prOct: v => {
      p.octs = +v;
      Store.save();
      onChange({});
    },
  });
  const c = $('#prCheck', box);
  if (c) c.onclick = onCheck;
}

/* ---------- a key ---------- */
function keyPage(page, params) {
  const mood = params.mood;
  const pc = Number.isInteger(+params.pc) ? +params.pc % 12 : plainestKey(mood);
  const M = MOOD_BY[mood];
  const chords = moodChords(mood, pc);
  const st = {
    step: STEPS.some(x => x[0] === params.step) ? params.step : 'scale',
    hand: 'rh',
    check: false,
    prog: 0,
    // the chords step plays one of: a progression, a chord's inversions, a left-hand pattern
    chordWhat: 'prog',
    inv: `${chords[0].semis}.${chords[0].type}`,
    lh: 'fifth',
    arp: `${chords[0].semis}.${chords[0].type}`,
  };
  let player = null;
  const unmount = () => {
    if (player) player.destroy();
    player = null;
  };
  onUnmount(unmount);
  onUnmount(() => AudioEngine.stopAll());
  Object.assign(prefs(), { mood, pc });
  Store.save();
  Log.ev('practice open', { mood, pc });

  page.innerHTML = `
    <section class="session">
      <div class="sess-top">
        <button class="btn sm ghost" type="button" id="prBack">← Practice</button>
        <span class="small" id="prStatus"></span>
      </div>
      <div class="stack" style="gap:2px">
        <h1 class="h1 pagetitle">${esc(moodName(mood, pc))}</h1>
        <p class="small">${esc(M.feel[0].toUpperCase() + M.feel.slice(1))} ·
          <button type="button" class="linkbtn small" id="prAbout">about it</button></p>
      </div>
      <div id="prSteps"></div>
    </section>
    ${connectNotice()}
    <div id="prHelp"></div>
    <div id="prBody" style="position:relative"></div>`;
  bindConnect();
  $('#prBack', page).onclick = () => go('practice');
  $('#prAbout', page).onclick = () => go('explore', { mood, pc });

  const status = () => {
    $('#prStatus', page).innerHTML = isKnown(mood, pc)
      ? '<span class="pill ok">known</span>'
      : '<span class="small">A check makes it known</span>';
  };
  const mountDrill = (host, id) => {
    player = Player.mount(host, {
      id,
      source: moodSource(),
      about: () => go('explore', { mood, pc }),
      onEvent: ev => {
        if (ev.type === 'rep') status();
      },
    });
  };

  const chordsStep = body => {
    const what = [
      ['prog', 'Progressions'],
      ['inv', 'Inversions'],
      ['lh', 'Left-hand patterns'],
    ];
    const progs = M.progs.map((p, k) => {
      const V = voiceProgression(mood, pc, p.chords);
      return `<div class="progrow ${k === st.prog ? 'on' : ''}">
        <div class="grow"><b>${V.map(v => esc(v.info.name)).join(' – ')}</b>
          <span class="small mono">${V.map(v => esc(v.info.num)).join(' – ')}</span>
          <span class="small">${esc(p.why)}</span></div>
        <button class="btn sm ghost" type="button" data-hearp="${k}">Hear</button>
        <button class="btn sm ${k === st.prog ? 'cover' : ''}" type="button" data-prog="${k}">${st.chordWhat === 'lh' ? 'Use' : 'Play it'}</button>
      </div>`;
    });
    const chordChip = (c, attr, on) =>
      `<button type="button" class="chip" ${attr}="${c.semis}.${c.type}" aria-pressed="${on === `${c.semis}.${c.type}`}">${esc(c.name)} <span class="small">${esc(c.num)}</span></button>`;
    const coreLh = LH_PATTERNS.filter(x => CORE_LH.includes(x.id));
    const moreLh = LH_PATTERNS.filter(x => !CORE_LH.includes(x.id));
    const lhChip = x =>
      `<button type="button" class="chip" data-lh="${x.id}" aria-pressed="${x.id === st.lh}">${esc(x.n)}</button>`;
    body.innerHTML = `<div class="card stack">
        ${seg('prChordWhat', what, st.chordWhat, 'sm')}
        ${
          st.chordWhat === 'inv'
            ? `<div class="chips">${chords.map(c => chordChip(c, 'data-inv', st.inv)).join('')}</div>
               <p class="small">Root position, 1st and 2nd inversion, and back: the same chord in three
                 shapes, so you can always reach the nearest one.</p>`
            : st.chordWhat === 'lh'
              ? `<div class="chips">${coreLh.map(lhChip).join('')}</div>
                 <details class="morechords"><summary class="small">More patterns</summary>
                   <div class="chips">${moreLh.map(lhChip).join('')}</div></details>
                 <p class="small">${esc(LH_PATTERNS.find(x => x.id === st.lh).how)}</p>
                 <p class="small">Over this progression:</p>
                 <div class="stack" style="gap:6px">${progs.join('')}</div>`
              : `<div class="stack" style="gap:6px">${progs.join('')}</div>
                 <p class="small">Chords move by the nearest shape: the right hand barely moves, and the
                   left plays the roots.</p>`
        }
      </div>
      <div id="prDrill"></div>`;
    bindSegs(body, {
      prChordWhat: v => {
        st.chordWhat = v;
        draw();
      },
    });
    $$('[data-hearp]', body).forEach(b => {
      b.onclick = () => hearChords(mood, pc, M.progs[+b.dataset.hearp].chords);
    });
    $$('[data-prog]', body).forEach(b => {
      b.onclick = () => {
        st.prog = +b.dataset.prog;
        draw();
      };
    });
    $$('[data-inv]', body).forEach(b => {
      b.onclick = () => {
        st.inv = b.dataset.inv;
        draw();
      };
    });
    $$('[data-lh]', body).forEach(b => {
      b.onclick = () => {
        st.lh = b.dataset.lh;
        draw();
      };
    });
    const host = $('#prDrill', body);
    if (st.chordWhat === 'inv') mountDrill(host, runId(mood, pc, st.hand, 1, `inv${st.inv}`));
    else if (st.chordWhat === 'lh') mountDrill(host, runId(mood, pc, 'lh', 1, `lh${st.lh}.${st.prog}`));
    else mountDrill(host, runId(mood, pc, st.hand, 1, `prog${st.prog}`));
  };

  // arpeggios: the home chord, the signature chord, any chord of the scale
  const arpsStep = body => {
    const chip = c => {
      const v = `${c.semis}.${c.type}`;
      const tag = c === chords[0] ? 'home' : c.signature ? 'signature' : '';
      return `<button type="button" class="chip" data-arp="${v}" aria-pressed="${v === st.arp}">${esc(c.name)}${tag ? ` · ${tag}` : ''}</button>`;
    };
    const lead = chords.filter((c, k) => k === 0 || c.signature);
    body.innerHTML = `<div class="card stack">
        <div class="chips">${lead.map(chip).join('')}</div>
        <details class="morechords"><summary class="small">Every chord</summary>
          <div class="chips">${chords
            .filter(c => !lead.includes(c))
            .map(chip)
            .join('')}</div>
        </details>
        <p class="small">The chord's notes one at a time, up and back: the shape your left hand breaks when
          it accompanies, and your right hand's fastest way across the keys.</p>
      </div>
      <div id="prDrill"></div>`;
    $$('[data-arp]', body).forEach(b => {
      b.onclick = () => {
        st.arp = b.dataset.arp;
        draw();
      };
    });
    mountDrill($('#prDrill', body), runId(mood, pc, st.hand, prefs().octs, `arp${st.arp}`));
  };

  const paintHelp = () => {
    const box = $('#prHelp', page);
    if (st.check) {
      box.innerHTML = `<div class="notice row between"><span><b>Check:</b> both hands, two octaves, no help.
        Every note right, evenly, at your own pace.</span>
        <button class="btn sm ghost" type="button" id="prCancel">Back to practice</button></div>`;
      $('#prCancel', box).onclick = () => {
        st.check = false;
        draw();
      };
      return;
    }
    helpBar(box, {
      hand: st.hand,
      step: st.step === 'chords' && st.chordWhat === 'lh' ? 'lh' : st.step,
      check: st.step === 'scale',
      onChange: ch => {
        Object.assign(st, ch);
        draw();
      },
      onCheck: () => {
        st.check = true;
        draw();
      },
    });
  };

  const draw = () => {
    unmount();
    status();
    $('#prSteps', page).innerHTML = seg('prStep', STEPS, st.step, 'wrap');
    bindSegs($('#prSteps', page), {
      prStep: v => {
        st.step = v;
        st.check = false;
        draw();
      },
    });
    paintHelp();
    const body = $('#prBody', page);
    if (st.step === 'chords') return chordsStep(body);
    if (st.step === 'arps') return arpsStep(body);
    mountDrill(body, st.check ? runId(mood, pc, 'ht', 2, 'check') : runId(mood, pc, st.hand, prefs().octs));
  };
  draw();
}

/* ---------- around the circle ---------- */
function circlePage(page) {
  const st = { hand: 'rh' };
  let player = null;
  onUnmount(() => player && player.destroy());
  page.innerHTML = `
    <section class="session">
      <div class="sess-top"><button class="btn sm ghost" type="button" id="prBack">← Practice</button></div>
      <h1 class="h1 pagetitle">Around the circle of fifths</h1>
      <p class="small">C, G, D … F and home: each major key's home chord, a fifth up each time, in the shape
        nearest the last. Say each key's name as you play it, and you learn the circle with your hands.</p>
    </section>
    ${connectNotice()}
    <div id="prHelp"></div>
    <div id="prBody"></div>`;
  bindConnect();
  $('#prBack', page).onclick = () => go('practice');
  const draw = () => {
    if (player) player.destroy();
    helpBar($('#prHelp', page), {
      hand: st.hand,
      step: 'circle',
      onChange: ch => {
        Object.assign(st, ch);
        draw();
      },
    });
    player = Player.mount($('#prBody', page), {
      id: runId('major', 0, st.hand, 1, 'circle'),
      source: moodSource(),
      about: () => go('explore', { tab: 'circle' }),
    });
  };
  draw();
}

// ---- app.js ----
/* The entry point: wires the parts together and starts the app. */

/* ---------- boot ---------- */
// what a problem report says about the app, beyond the browser itself
function describeApp() {
  const s = Store.s;
  let audio = null;
  try {
    const c = AudioEngine.ctx;
    audio = c
      ? { state: c.state, sr: c.sampleRate, out: c.outputLatency || 0, base: c.baseLatency || 0 }
      : null;
  } catch (e) {}
  return {
    input: {
      mode: Input.mode,
      live: Input.live,
      devices: Input.midiNames,
      status: Input.status,
      err: Input.lastErr,
    },
    midiOut: { port: MidiOut.port ? MidiOut.port.name : null, on: !!s.settings.midiOut },
    audio,
    view: UI.view,
  };
}

function describeLearning() {
  const s = Store.s;
  const items = Object.entries(s.items || {}).map(([id, it]) =>
    [
      `${id} ${it.stage}${it.phase ? '/' + it.phase : ''}`,
      `bpm${it.bpm || '-'}${it.target ? '→' + it.target : ''}`,
      `last${it.last || '-'}`,
    ].join(' '),
  );
  return {
    v: s.v,
    savedAt: s.savedAt,
    pieces: s.piece && s.piece.working,
    moods: Object.keys(s.moods.keys).length,
    prefs: s.moods.prefs,
    items: items.slice(0, 80),
    days: Object.keys(s.days || {}).length,
  };
}

function boot() {
  try {
    Log.setContext({ env: describeApp, state: describeLearning, openReport: () => reportSheet() });
    registerViews({ play: playView, explore: exploreView, practice: practiceView, songs: songsView });
    startLive();
    Thru.listen(); // your piano through this device, when it is switched on in Settings
    Store.loadLocal();
    refreshItems();
    Log.ev('boot', {
      version: APP_VERSION,
      build: BUILD,
      inClaude: IN_CLAUDE,
      input: Store.s.settings.input,
      onboarded: Store.s.profile.onboarded,
    });
    $$('#tabs [data-view]').forEach(b => (b.onclick = () => go(b.dataset.view)));
    $('#inputChip').onclick = settingsSheet;
    $('#settingsBtn').onclick = settingsSheet;
    Input.mode = Store.s.settings.input || 'touch';
    if (Input.mode === 'midi') Input.setMode('midi');
    else if (Input.mode === 'mic') {
      Input.status = 'Microphone is off. Turn it on in Settings.';
      Input.live = false;
    }
    Input.paint();
    // a reload comes back to the same screen; a fresh start to Play
    let start = 'play';
    try {
      start = sessionStorage.getItem('dacapo.view') || 'play';
    } catch (e) {}
    const hv = (location.hash || '').slice(1);
    if (hasView(hv)) start = hv;
    go(start);
    // a newer state (from your Claude account, or a restored backup): redraw from it, so no screen keeps
    // working on objects from the old one
    Store.on(kind => {
      if (kind !== 'state') return;
      refreshItems();
      go(UI.view, UI.params);
    });
    Store.connect();
  } catch (e) {
    Log.err(e, 'boot');
    const p = document.getElementById('page');
    if (p)
      p.innerHTML =
        '<div class="card"><h2 class="h2">DaCapo could not start</h2><p class="small">The problem was logged. Reload the page; if it happens again, Settings → Report a problem includes the log.</p></div>';
  }
}

// A handle on the app's parts for the browser console and the end-to-end tests (tests/).
window.DaCapo = {
  // parts
  Store,
  Log,
  Input,
  Library,
  Player,
  Sounds,
  AudioEngine,
  Metro,
  Activity,
  UI,
  // navigation and panels
  go,
  closeSheet,
  settingsSheet,
  reportSheet,
  // pieces
  todayKey,
  addDays,
  itemDef,
  itemState,
  ensureItem,
  planFor,
  // Play's sittings
  SITTING,
  MOOD_BY,
};

boot();
})();
