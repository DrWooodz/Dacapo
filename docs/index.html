function bindTakes(root) {
  const recBtn = $('#tkRec', root),
    timeEl = $('#tkTime', root),
    list = $('#tkList', root);
  let tick = 0;
  const paint = () => {
    const l = Takes.list();
    list.innerHTML = l.length
      ? l
          .map((t, i) => {
            const st = Takes.stats(t);
            if (!st) return '';
            const when = new Date(t.d).toLocaleString(undefined, {
              month: 'short',
              day: 'numeric',
              hour: 'numeric',
              minute: '2-digit',
            });
            const facts = [
              fmtTime(st.dur / 1000),
              `${st.n} notes`,
              `${midiName(st.lo, true)}–${midiName(st.hi, true)}`,
              st.vhi > 0 && `dynamics ${dynName(st.vlo)}–${dynName(st.vhi)}`,
              st.pedalPct && `pedal down ${Math.round(st.pedalPct * 100)}%`,
              st.gap > 2500 && `longest stop ${(st.gap / 1000).toFixed(1)}s`,
            ];
            return `<div class="take" data-id="${t.id}">
              <div class="row between">
                <b>${esc(t.name || when)}</b>
                <div class="row">
                  <button class="btn sm" type="button" data-play="${t.id}">▶ Play</button>
                  <button class="btn sm ghost" type="button" data-del="${t.id}" aria-label="Delete take">Delete</button>
                </div>
              </div>
              ${i === 0 ? `<div class="rollwrap">${Takes.roll(t)}</div>` : ''}
              <div class="small">${facts.filter(Boolean).join(' · ')}</div>
            </div>`;
          })
          .join('')
      : '<p class="small">No takes yet.</p>';
    list.querySelectorAll('[data-play]').forEach(
      b =>
        (b.onclick = () => {
          const t = Takes.list().find(x => x.id === b.dataset.play);
          if (!t) return;
          if (Takes.playing) {
            Takes.stop();
            paint();
            return;
          }
          b.textContent = '■ Stop';
          const start = Takes.play(t, paint);
          const svg = b.closest('.take').querySelector('svg.roll');
          if (svg) {
            const ph = svg.querySelector('.playhead');
            const W = svg.viewBox.baseVal.width;
            const dur = Takes.playing.dur;
            ph.setAttribute('opacity', 1);
            const anim = () => {
              if (!Takes.playing) {
                ph.setAttribute('opacity', 0);
                return;
              }
              const x = 30 + clamp((performance.now() - start) / dur, 0, 1) * (W - 30);
              ph.setAttribute('x1', x);
              ph.setAttribute('x2', x);
              requestAnimationFrame(anim);
            };
            requestAnimationFrame(anim);
          }
        }),
    );
    list.querySelectorAll('[data-del]').forEach(
      b =>
        (b.onclick = () => {
          const all = Takes.list();
          const i = all.findIndex(x => x.id === b.dataset.del);
          const [gone] = all.splice(i, 1);
          Takes.saveList(all);
          paint();
          toast('Take deleted', 6000, {
            label: 'Undo',
            run: () => {
              const a = Takes.list();
              a.splice(i, 0, gone);
              Takes.saveList(a);
              paint();
            },
          });
        }),
    );
  };
  recBtn.onclick = () => {
    if (Takes.rec) {
      clearInterval(tick);
      const t = Takes.stopRec();
      recBtn.textContent = '● Record';
      recBtn.classList.remove('bad');
      timeEl.textContent = '';
      if (!t) toast('Nothing was played, so nothing was saved.');
      paint();
      return;
    }
    AudioEngine.ensure();
    Takes.start();
    recBtn.textContent = '■ Stop';
    recBtn.classList.add('bad');
    const t0 = performance.now();
    tick = setInterval(() => {
      timeEl.textContent =
        '● ' +
        fmtTime((performance.now() - t0) / 1000) +
        (Takes.rec ? ` · ${Takes.rec.ev.filter(e => e[1] === 'n').length} notes` : '');
    }, 250);
  };
  paint();
  return () => {
    clearInterval(tick);
    if (Takes.rec) {
      const t = Takes.stopRec();
      if (t) toast('Take saved');
    }
    Takes.stop();
  };
}

// ---- views/free.js ----
/* Free play: play anything. DaCapo names what it hears, keeps a loop going (Jam), plays ear games (Echo),
   backs your improvising, records you, and keeps time. */

const freeView = (page, params) => {
  const st = Object.assign({ tab: 'live', pal: 'satie' }, UI.freeState || {}, params);
  UI.freeState = st;
  const tabs = [
    ['live', 'Listen'],
    ['jam', 'Jam'],
    ['echo', 'Echo'],
    ['improv', 'Improvise'],
    ['takes', 'Record'],
    ['metro', 'Metronome'],
  ];
  page.innerHTML = `
    <div class="stack">
      <span class="eyebrow">Free play</span>
      <h1 class="h1">Just <em>play</em>.</h1>
    </div>
    ${seg('ftab', tabs, st.tab, 'wrap')}
    <div id="fBody" class="stack" style="gap:16px"></div>`;
  let off = null;
  const cleanup = () => {
    if (off) {
      try {
        off();
      } catch (e) {
        Log.err(e, 'free cleanup');
      }
      off = null;
    }
  };
  onUnmount(cleanup);
  bindSegs(page, {
    ftab: v => {
      st.tab = v;
      draw();
    },
  });
  const body = $('#fBody', page);
  const draw = () => {
    cleanup();
    const draws = {
      live: drawLive,
      jam: () => drawJam(body),
      echo: () => drawEcho(body),
      improv: drawImprov,
      takes: drawTakes,
      metro: drawMetro,
    };
    off = (draws[st.tab] || drawLive)();
  };
  draw();

  function drawLive() {
    body.innerHTML = `${connectNotice()}
      <div class="card">
        <div class="readout">
          <div class="stack" style="gap:2px;min-width:0">
            <div class="chordname" id="lvChord">–</div>
            <div class="small" id="lvLong">Play a chord or a few notes</div>
          </div>
          <div class="stack" style="align-items:flex-end;gap:4px">
            <span class="tag" id="lvPedal">Pedal up</span>
            <span class="small mono" id="lvVel"></span>
          </div>
        </div>
        <div class="kbwrap scrollx" id="lvKbWrap">
          <div class="kb88" id="lvKb">${kbSVG({ from: 21, to: 108, h: 120 })}</div>
        </div>
        <div class="staffwrap" id="lvStaff"></div>
        <p class="small" id="lvKey"></p>
      </div>`;
    bindConnect();
    const wrap = $('#lvKbWrap', body);
    const kb = () => $('#lvKb svg', body);
    requestAnimationFrame(() => {
      const k = kb() && kb().querySelector('[data-m="60"]');
      if (k && wrap.scrollWidth > wrap.clientWidth)
        wrap.scrollLeft =
          k.getBoundingClientRect().left -
          wrap.getBoundingClientRect().left -
          wrap.clientWidth / 2 +
          wrap.scrollLeft;
    });
    let keyNow = null,
      lastChord = null,
      raf = 0,
      keyT = 0;
    // spell notes in the detected key once it is reasonably clear
    const keySig = () => (keyNow && keyNow.conf > 0.04 ? keyNow.best.sig : 0);
    const speller = () => spellerFor(keySig());
    const paint = () => {
      const svg = kb();
      if (!svg) return;
      svg.querySelectorAll('.held,.sus').forEach(e => e.classList.remove('held', 'sus'));
      Live.sustained.forEach(m => {
        const e = svg.querySelector(`[data-m="${m}"]`);
        if (e) e.classList.add('sus');
      });
      Input.held.forEach((_, m) => {
        const e = svg.querySelector(`[data-m="${m}"]`);
        if (e) {
          e.classList.remove('sus');
          e.classList.add('held');
        }
      });
      $('#lvPedal', body).textContent = Input.pedal ? 'Pedal down' : 'Pedal up';
      $('#lvPedal', body).className = 'tag ' + (Input.pedal ? 'lh' : '');
      const sounding = [...new Set([...Input.held.keys(), ...Live.sustained])];
      if (sounding.length) lastChord = detectChord(sounding, speller());
      $('#lvChord', body).textContent = lastChord ? lastChord.name : '–';
      $('#lvLong', body).textContent = lastChord ? lastChord.long : 'Play a chord or a few notes';
      $('#lvStaff', body).innerHTML = recentStaff();
    };
    // your last notes on a grand staff, the newest highlighted
    const recentStaff = () => {
      const steps = groupSteps(Live.hist.slice(-40)).slice(-14);
      if (!steps.length)
        return `<p class="small" style="padding:10px">Your last notes are written here, so you can see
          what you played on the staff.</p>`;
      const sp = speller();
      const items = steps.map((g, k) => ({
        notes: g.ms.map(m => ({
          n: sp(m),
          st: m >= 60 ? 't' : 'b',
          cls: k === steps.length - 1 ? 'cur' : '',
        })),
      }));
      const svg = staffSVG({ clef: 'grand', sig: keySig(), items, spacing: 30, minW: 320, bottom: 40 }).svg;
      return `<div style="max-width:720px;margin:0 auto">${svg}</div>`;
    };
    const paintKey = () => {
      keyNow = detectKey(Live.hist.slice(-60).map(h => h.m));
      const e = $('#lvKey', body);
      if (!e) return;
      if (!keyNow) {
        e.textContent = 'Play for a little while and I will work out the key.';
        return;
      }
      const { best, second, conf } = keyNow;
      const how = conf > 0.08 ? 'Clearly' : conf > 0.03 ? 'Probably' : 'Possibly';
      const or = conf <= 0.08 ? ` (or ${prettyKey(second.k)} ${second.mode})` : '';
      e.textContent = `${how} in ${prettyKey(best.k)} ${best.mode}${or}, from your last ${Math.min(60, Live.hist.length)} notes.`;
    };
    const sched = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0;
        paint();
      });
    };
    const o1 = Input.on(ev => {
      sched();
      if (ev.src === 'midi')
        $('#lvVel', body).textContent = `${dynName(ev.vel)} · ${Math.round(ev.vel * 127)}`;
      clearTimeout(keyT);
      keyT = setTimeout(paintKey, 600);
    });
    const o2 = Input.onOff(sched);
    paint();
    paintKey();
    return () => {
      o1();
      o2();
      cancelAnimationFrame(raf);
      clearTimeout(keyT);
    };
  }
  function drawImprov() {
    const chip = p =>
      `<button type="button" class="chip" data-pal="${p.id}" aria-pressed="${p.id === st.pal}">${esc(p.t.split(':')[0])}</button>`;
    body.innerHTML = `
      <div class="card">
        <div class="chips">${PALETTES.map(chip).join('')}</div>
        <p class="small">Improvise over a backing in the style of each composer. Time you spend here counts
          toward that style in your improvisation skill.</p>
      </div>
      ${connectNotice()}
      <div id="fImp" style="position:relative"></div>`;
    bindConnect();
    body.querySelectorAll('[data-pal]').forEach(b => {
      b.onclick = () => {
        st.pal = b.dataset.pal;
        draw();
      };
    });
    const pl = Player.mount($('#fImp', body), { id: `i:imp:${st.pal}`, role: 'focus' });
    return () => pl.destroy();
  }
  function drawTakes() {
    body.innerHTML = `${connectNotice()}<div class="card" id="fTakes">${takesCardHTML()}</div>`;
    bindConnect();
    return bindTakes($('#fTakes', body));
  }
  function drawMetro() {
    let bpm = Metro.bpm || 72;
    let beats = Metro.beats || 4;
    const meters = ['2', '3', '4', '6'].map(n => [n, n]);
    body.innerHTML = `
      <div class="card">
        <div class="cardhead"><h2 class="h2">Metronome</h2></div>
        <div class="row between">
          <div class="chordname mono" id="mBpm">${bpm}</div>
          <div class="row">
            <button class="btn" type="button" data-d="-1">−</button>
            <button class="btn" type="button" data-d="1">+</button>
            <button class="btn" type="button" id="mTap">Tap</button>
          </div>
        </div>
        <input type="range" id="mRange" min="30" max="220" value="${bpm}">
        <div class="row"><span class="small">Beats per bar</span>${seg('mBeats', meters, beats)}</div>
        <div class="beats" id="mDots">${'<i></i>'.repeat(beats)}</div>
        <button class="btn cover big" type="button" id="mGo">${Metro.running ? 'Stop' : 'Start'}</button>
      </div>`;
    const set = v => {
      bpm = clamp(Math.round(v), 30, 220);
      $('#mBpm', body).textContent = bpm;
      $('#mRange', body).value = bpm;
      if (Metro.running) Metro.start({ bpm, beats, sub: 1 });
    };
    body.querySelectorAll('[data-d]').forEach(b => (b.onclick = () => set(bpm + +b.dataset.d)));
    $('#mRange', body).oninput = e => set(+e.target.value);
    $('#mTap', body).onclick = () => {
      Metro.tap();
      set(Metro.bpm);
    };
    bindSegs(body, {
      mBeats: v => {
        beats = +v;
        $('#mDots', body).innerHTML = '<i></i>'.repeat(beats);
        if (Metro.running) Metro.start({ bpm, beats, sub: 1 });
      },
    });
    $('#mGo', body).onclick = e => {
      AudioEngine.ensure();
      if (Metro.running) {
        Metro.stop();
        e.target.textContent = 'Start';
      } else {
        Metro.start({ bpm, beats, sub: 1 });
        e.target.textContent = 'Stop';
      }
    };
    const offB = Metro.on((k, q) => {
      if (k !== 'beat') return;
      $$('#mDots i', body).forEach((d, j) => {
        d.classList.toggle('on', j === q.beat);
        d.classList.toggle('acc', q.beat === 0);
      });
    });
    return () => {
      offB();
      Metro.stop();
    };
  }
};

// ---- views/assess.js ----
/* The placement check, step by step (the scoring is in learn/assess.js). Every step can be skipped. */

const QUESTION_MS = 25000; // a theory question left unanswered this long counts as not known
const PULSE = { bpm: 80, withClick: 8, alone: 8 };

const assessView = page => {
  const R = { reading: {}, theory: [] };
  let cleanups = [];
  const cleanup = () => {
    cleanups.forEach(f => f());
    cleanups = [];
  };
  onUnmount(cleanup);
  const listen = fn => cleanups.push(Input.on(Log.guard('assess note', fn)));
  const timer = (fn, ms) => {
    const t = setTimeout(fn, ms);
    cleanups.push(() => clearTimeout(t));
  };
  const speller = spellerFor(0);
  const STEPS = [
    intro,
    () => reading('treble'),
    () => reading('bass'),
    () => scale('rh'),
    () => scale('ht'),
    theory,
    pulse,
    result,
  ];
  let step = 0;
  const next = () => {
    cleanup();
    step++;
    Log.ev('assess step', { step });
    STEPS[step]();
  };
  intro();

  // the frame every step shares: a title, instructions, the area to play in, a keyboard, skip
  function frame(title, how, { body = '', keyboard = true, skip = true } = {}) {
    const n = STEPS.length - 2;
    page.innerHTML = `
      <div class="stack">
        <span class="eyebrow">Placement check${step > 0 && step <= n ? ` · step ${step} of ${n}` : ''}</span>
        <h1 class="h2">${esc(title)}</h1>
      </div>
      ${step > 0 ? connectNotice() : ''}
      <div class="card assess">
        <p class="small" id="asHow">${how}</p>
        <div id="asBody">${body}</div>
        <div class="feedback pl-msg" id="asMsg" aria-live="polite"></div>
        ${keyboard ? `<div class="kbwrap scrollx"><div id="asKb">${kbSVG({ from: 36, to: 96, h: 96 })}</div></div>` : ''}
        <div class="row between">
          <span class="small" id="asInfo"></span>
          ${skip ? '<button class="btn sm ghost" type="button" id="asSkip">Skip this part</button>' : ''}
        </div>
      </div>`;
    bindConnect();
    const sk = $('#asSkip', page);
    if (sk) sk.onclick = next;
  }
  const msg = (t, cls = '') => {
    const e = $('#asMsg', page);
    if (e) {
      e.className = 'feedback pl-msg ' + cls;
      e.textContent = t;
    }
  };
  const info = t => {
    const e = $('#asInfo', page);
    if (e) e.textContent = t;
  };
  const flash = (m, ok) => flashKey($('#asKb svg', page), m, ok ? 'ok' : 'bad', 220);

  /* ---------- steps ---------- */
  function intro() {
    frame(
      'Find your starting points',
      `About eight minutes at the piano. You will read a few notes in each clef, play a C major scale, answer
       some questions by playing, and keep a steady beat. Nothing here can go wrong: it only decides where
       practice starts. Skip anything you like.`,
      {
        keyboard: false,
        skip: false,
        body: '<button class="btn cover big" type="button" id="asGo">Start</button>',
      },
    );
    $('#asGo', page).onclick = () => {
      AudioEngine.ensure();
      next();
    };
  }

  function reading(clef) {
    const notes = readingNotes(clef);
    const answers = [];
    let i = 0;
    let shownAt = 0;
    frame(
      clef === 'treble' ? 'Reading: treble clef' : 'Reading: bass clef',
      `A note appears on the staff. Play it on the piano, in the octave where it is written. Take the time you
       need, but don't guess: speed only counts when the note is right.`,
    );
    const show = () => {
      const nt = notes[i];
      $('#asBody', page).innerHTML = `<div class="assess-note" data-midi="${nt.midi}">${
        staffSVG({
          clef,
          sig: 0,
          items: [{ notes: [{ n: nt.n, st: clef === 'treble' ? 't' : 'b', cls: 'cur' }] }],
          spacing: 40,
          minW: 200,
          top: 46,
          bottom: 46,
        }).svg
      }</div>`;
      info(`Note ${i + 1} of ${notes.length}`);
      shownAt = performance.now();
    };
    const misses = level => answers.filter(a => a.level === level && !a.ok).length;
    listen(ev => {
      const nt = notes[i];
      if (!nt) return;
      const ok = ev.m === nt.midi;
      answers.push({ level: nt.level, ok, ms: ev.t - shownAt });
      flash(ev.m, ok);
      msg(ok ? 'Right.' : `That was ${nameOf(speller(ev.m))}; this is ${nameOf(nt.n)}.`, ok ? 'ok' : 'bad');
      i++;
      // two misses in a level: the harder levels can wait
      if (i >= notes.length || misses(nt.level) >= 2) {
        R.reading[clef] = scoreReading(clef, answers);
        Log.ev('assess reading', { clef, levels: R.reading[clef].map(l => `${l.ok}/${l.tried} ${l.ms}`) });
        return timer(next, 900);
      }
      timer(show, 450);
    });
    show();
  }

  function scale(hands) {
    if (hands === 'ht' && (!R.scale || !R.scale.rh || R.scale.rh.right < R.scale.rh.of - 2)) return next();
    const want = hands === 'rh' ? 15 : 58;
    const notes = [];
    frame(
      hands === 'rh' ? 'Scale: right hand' : 'Scale: hands together',
      hands === 'rh'
        ? 'Play a C major scale with the right hand, one octave up and back down (C to C to C), at a speed that feels comfortable. No metronome.'
        : 'Now both hands together, two octaves up and back down, at a comfortable speed.',
    );
    info(hands === 'rh' ? 'Start whenever you are ready' : 'Both hands, two octaves');
    let quiet = 0;
    let finished = false;
    const done = () => {
      // once only: notes played after the scale (or the quiet timer) must not score it again and skip a step
      if (finished) return;
      finished = true;
      clearTimeout(quiet);
      R.scale = R.scale || {};
      R.scale[hands] = scoreScale(notes, hands);
      const s = R.scale[hands];
      Log.ev('assess scale', { hands, ...s });
      msg(
        `${s.right} of ${s.of} notes right${s.bpm ? ` · about ♩ ${s.bpm} (two notes per beat)` : ''}${s.cv != null ? ` · ${s.cv < 0.12 ? 'even' : s.cv < 0.2 ? 'fairly even' : 'uneven'}` : ''}.`,
        s.right >= s.of - 1 ? 'ok' : '',
      );
      timer(next, 1800);
    };
    listen(ev => {
      if (finished) return;
      notes.push({ m: ev.m, t: ev.t });
      flash(ev.m, true);
      info(`${hands === 'rh' ? notes.length : Math.round(notes.length / 2)} notes`);
      clearTimeout(quiet);
      if (notes.length >= want) return done();
      quiet = setTimeout(() => notes.length >= 6 && done(), 3000);
    });
    cleanups.push(() => clearTimeout(quiet));
  }

  function theory() {
    let k = 0;
    let missedInRow = 0;
    frame(
      'Theory, by playing',
      'Answer each question on the piano. If you do not know one, skip it: that is useful to know too.',
    );
    const ask = () => {
      if (k >= THEORY_STEPS.length || missedInRow >= 2) return next();
      const unit = THEORY_STEPS[k];
      const q = makeQuestion(unit);
      $('#asBody', page).innerHTML =
        `<div class="quiz-q"><div class="quiz-prompt">${esc(q.prompt)}</div><div class="small">${esc(q.sub)}</div></div>`;
      info(`Question ${k + 1}`);
      msg('');
      let answered = false;
      const finish = ok => {
        if (answered) return;
        answered = true;
        listener.stop();
        R.theory.push({ unit, ok });
        missedInRow = ok ? 0 : missedInRow + 1;
        msg(ok ? 'Right.' : q.explain, ok ? 'ok' : '');
        k++;
        timer(ask, ok ? 900 : 2400);
      };
      const listener = collectAnswer(q, groups => finish(check(q, groups).ok));
      cleanups.push(() => listener.stop());
      timer(() => finish(false), QUESTION_MS);
      $('#asSkip', page).textContent = 'I do not know this one';
      $('#asSkip', page).onclick = () => finish(false);
    };
    listen(ev => flash(ev.m, true));
    ask();
  }

  function pulse() {
    frame(
      'A steady beat',
      `Play any key along with the click. After ${PULSE.withClick} clicks it stops: keep going on your own for
       about ${PULSE.alone} more beats, as evenly as you can.`,
      { body: '<button class="btn cover" type="button" id="asBeat">Start the click</button>' },
    );
    $('#asBeat', page).onclick = () => {
      AudioEngine.ensure();
      $('#asBody', page).innerHTML = '';
      const taps = [];
      const msBeat = 60000 / PULSE.bpm;
      const first = AudioEngine.toPerf(Metro.start({ bpm: PULSE.bpm, beats: 4 }));
      const clicks = Array.from({ length: PULSE.withClick }, (_, i) => first + i * msBeat);
      cleanups.push(() => Metro.stop());
      timer(
        () => {
          Metro.stop();
          msg('Keep going…');
        },
        clicks[clicks.length - 1] - performance.now() + msBeat * 0.6,
      );
      listen(ev => {
        taps.push(ev.t);
        flash(ev.m, true);
      });
      timer(
        () => {
          R.pulse = scorePulse(taps, clicks, msBeat);
          Log.ev('assess pulse', R.pulse || { taps: taps.length });
          msg(
            R.pulse
              ? `On your own: ± ${Math.round(R.pulse.sd * 100)}% of a beat.`
              : 'Not enough beats to measure.',
          );
          timer(next, 1600);
        },
        clicks[clicks.length - 1] - performance.now() + msBeat * (PULSE.alone + 1.5),
      );
    };
  }

  function result() {
    applyPlacement(R);
    const lines = [];
    for (const clef of ['treble', 'bass']) {
      const levels = R.reading[clef];
      if (!levels) continue;
      const passed = levels.filter(l => l.passed);
      const name = clef === 'treble' ? 'Treble reading' : 'Bass reading';
      lines.push(
        passed.length
          ? `${name}: secure up to "${itemDef(passed[passed.length - 1].unit).title.split(': ')[1]}".`
          : `${name}: starts from the beginning, with the first five notes.`,
      );
    }
    if (R.scale && R.scale.rh)
      lines.push(
        `Scales: C major ${R.scale.ht && R.scale.ht.right >= R.scale.ht.of - 2 ? 'hands together' : R.scale.rh.right >= R.scale.rh.of - 1 ? 'right hand' : 'is a good place to start'}.`,
      );
    const right = R.theory.filter(a => a.ok).length;
    if (R.theory.length) lines.push(`Theory: ${right} of ${R.theory.length} questions right.`);
    if (R.pulse) lines.push(`Steadiness: ± ${Math.round(R.pulse.sd * 100)}% of a beat on your own.`);
    const best = rankAreas()[0];
    frame(
      'Your starting points',
      'Practice now starts from here. Anything marked as known comes back for a quick review in a week, which confirms it.',
      {
        keyboard: false,
        skip: false,
        body: `<ul class="small">${lines.map(l => `<li>${esc(l)}</li>`).join('') || '<li>Everything starts from the beginning.</li>'}</ul>
          ${
            best
              ? `<div class="focusbar card"><span class="eyebrow">Suggested focus for this week</span>
                   <b class="h3">${esc(AREA_BY[best.area].n)}</b><div class="small">${esc(best.reason)}</div></div>`
              : ''
          }
          <button class="btn cover big" type="button" id="asDone">Start practicing</button>
          ${best ? '<button class="btn ghost" type="button" id="asOther">Choose another focus</button>' : ''}`,
      },
    );
    $('#asDone', page).onclick = () => {
      if (best) chooseFocus(best.area);
      go('practice');
    };
    const other = $('#asOther', page);
    if (other) other.onclick = () => focusSheet(() => go('practice'));
  }
};

// ---- app.js ----
/* The entry point: wires the parts together and starts the app. */

/* ---------- boot ---------- */
// what a problem report says about the app, beyond the browser itself
function describeApp() {
  const s = Store.s;
  let audio = null;
  try {
    const c = AudioEngine.ctx;
    audio = c
      ? { state: c.state, sr: c.sampleRate, out: c.outputLatency || 0, base: c.baseLatency || 0 }
      : null;
  } catch (e) {}
  return {
    input: {
      mode: Input.mode,
      live: Input.live,
      devices: Input.midiNames,
      status: Input.status,
      err: Input.lastErr,
    },
    midiOut: { port: MidiOut.port ? MidiOut.port.name : null, on: !!s.settings.midiOut },
    audio,
    view: UI.view,
  };
}

function describeLearning() {
  const s = Store.s;
  const items = Object.entries(s.items || {}).map(([id, it]) =>
    [
      `${id} ${it.stage}${it.phase ? '/' + it.phase : ''}`,
      `bpm${it.bpm || '-'}${it.target ? '→' + it.target : ''}`,
      `pass${(it.passes || []).length}`,
      `last${it.last || '-'}`,
    ].join(' '),
  );
  return {
    v: s.v,
    savedAt: s.savedAt,
    session: s.session,
    pieces: s.piece && s.piece.working,
    focus: s.focus,
    prefs: s.profile,
    items: items.slice(0, 80),
    days: Object.keys(s.days || {}).length,
  };
}

function boot() {
  try {
    Log.setContext({ env: describeApp, state: describeLearning, openReport: () => reportSheet() });
    registerViews({
      practice: practiceView,
      skills: skillsView,
      library: libraryView,
      free: freeView,
      assess: assessView,
    });
    startLive();
    Store.loadLocal();
    refreshItems();
    Log.ev('boot', {
      version: APP_VERSION,
      build: BUILD,
      inClaude: IN_CLAUDE,
      input: Store.s.settings.input,
      onboarded: Store.s.profile.onboarded,
    });
    $$('#tabs [data-view]').forEach(b => (b.onclick = () => go(b.dataset.view)));
    $('#inputChip').onclick = settingsSheet;
    $('#settingsBtn').onclick = settingsSheet;
    $('#reportBtn').onclick = () => reportSheet();
    Input.mode = Store.s.settings.input || 'touch';
    if (Input.mode === 'midi') Input.setMode('midi');
    else if (Input.mode === 'mic') {
      Input.status = 'Microphone is off. Turn it on in Settings.';
      Input.live = false;
    }
    Input.paint();
    snapshotSkills();
    let start = 'practice';
    try {
      start = sessionStorage.getItem('dacapo.view') || 'practice';
    } catch (e) {}
    const hv = (location.hash || '').slice(1);
    if (hasView(hv)) start = hv;
    go(start);
    // a newer state (from your Claude account, or a restored backup): redraw from it, so no screen keeps
    // working on objects from the old one
    Store.on(kind => {
      if (kind !== 'state') return;
      refreshItems();
      go(UI.view, UI.params);
    });
    Store.connect();
    // coming back to the app on a new day: note where the skills stand, and rebuild the session
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible' || !Store.s.session || Store.s.session.day === todayKey())
        return;
      snapshotSkills();
      if (UI.view === 'practice') go('practice');
    });
  } catch (e) {
    Log.err(e, 'boot');
    const p = document.getElementById('page');
    if (p)
      p.innerHTML =
        '<div class="card"><h2 class="h2">DaCapo could not start</h2><p class="small">The problem was logged. Use the flag button at the top to report it.</p></div>';
  }
}

// A handle on the app's parts for the browser console and the end-to-end tests (tests/).
window.DaCapo = {
  // parts
  Store,
  Log,
  Input,
  Library,
  Player,
  Quiz,
  Transport,
  Sounds,
  AudioEngine,
  Metro,
  Activity,
  UI,
  // navigation and panels
  go,
  closeSheet,
  settingsSheet,
  reportSheet,
  pieceSheet,
  // the curriculum
  todayKey,
  addDays,
  itemDef,
  itemState,
  ensureItem,
  planFor,
  skillStatus,
  currentSession,
  rebuildSession,
  workOnPiece,
  setPieceDaily,
  pieceSession,
  // skills and focus
  skillLevel,
  rankAreas,
  currentFocus,
  chooseFocus,
  applyPlacement,
};

boot();
})();
</script>
