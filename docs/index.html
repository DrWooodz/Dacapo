// the other path: Moods
function movesCard() {
  return `<section class="card pathcard">
    <div class="grow"><b>Also in DaCapo: Moods</b>
      <span class="small">Scales to improvise in, by the sound they make, at your own pace. Made for
        short sittings whenever you have them.</span></div>
    <button class="btn sm" type="button" data-act="moods">Switch to Moods</button>
  </section>`;
}

function greeting() {

  return h < 4 || h >= 18
    ? 'Good <em>evening</em>.'
    : h < 12
      ? 'Good <em>morning</em>.'
      : 'Good <em>afternoon</em>.';
}

/* ---------- today ---------- */
function focusLine() {
  const f = currentFocus();
  if (!f) return '';
  const area = AREA_BY[f.area];
  if (f.confirmed)
    return `<button type="button" class="focusline" data-act="focus">
      <span class="small">Focus this week</span><b>${esc(area.n)}</b><span class="small link">Change</span>
    </button>`;
  // a new week: the suggestion waits for a yes (practice goes ahead either way)
  return `<div class="focusline suggest">
    <div class="grow"><span class="small">Suggested focus this week</span><b>${esc(area.n)}</b>
      <div class="small">${esc(f.reason || area.d)}</div></div>
    <div class="row">
      <button class="btn sm cover" type="button" data-act="keep">Keep</button>
      <button class="btn sm ghost" type="button" data-act="focus">Change</button>
    </div>
  </div>`;
}

function todayCard(s) {
  if (!s.list.length)
    return `<section class="card today">
      ${focusLine()}
      <h2 class="h2">Nothing to practice today</h2>
      <p class="small">Every area is switched off, or everything is waiting for its next cold check.
        Choose a piece in the Library, or switch an area back on.</p>
      <button class="btn" type="button" data-act="areas">Areas</button>
    </section>`;
  const open = s.list.filter(isOpen);
  const done = s.list.filter(e => e.state === 'done').length;
  const started = s.list.some(e => e.reps || e.state !== 'todo');
  const left = open.reduce((t, e) => t + entryMinutes(e), 0);
  const row = (e, i) => {
    const d = itemDef(e.id);
    if (!d) return '';
    const state = e.state === 'done' ? 'done' : e.state === 'skipped' ? 'skipped' : '';
    // any step can be started from here, a done one too (to go again)
    return `<button type="button" class="todayrow ${state}" data-start="${i}">
      <i class="num">${e.state === 'done' ? '✓' : i + 1}</i>
      <span class="grow"><b>${esc(shortTitle(d))}</b>
        <span class="small">${ROLE[e.role] || 'Focus'}${state === 'skipped' ? ' · skipped' : ''}${
          itemState(e.id) ? ' · ' + esc(criterion(e.id)) : ''
        }</span></span>
      <span class="small">${entryMinutes(e)} min</span>
    </button>`;
  };
  const day = Store.s.days[todayKey()] || {};
  const mins = Math.round(day.min || 0);
  const head = open.length
    ? `<div class="row between"><h2 class="h2">Today</h2>
         <span class="small">${done ? `${done} of ${s.list.length} done · ` : ''}about ${left} min${started ? ' left' : ''}</span></div>`
    : `<div class="row between"><h2 class="h2">Today: <em>done</em>.</h2>
         <span class="small">${mins} min · ${day.clean || 0} clean reps</span></div>`;
  const miles = Store.s.hist.filter(h => h.d === todayKey());
  return `<section class="card today">
    ${focusLine()}
    ${head}
    <div class="todaylist">${s.list.map(row).join('')}</div>
    ${
      open.length
        ? `<button class="btn cover big" type="button" data-act="start">${started ? 'Continue' : 'Start'}</button>`
        : `${miles.length ? `<div class="stack" style="gap:0">${miles.map(h => milestoneRow(h)).join('')}</div>` : ''}
           <p class="small">Tomorrow starts with cold checks of what you reached today. For more now, tap a
             step to go again, or a skill below.</p>`
    }
  </section>`;
}

/* ---------- where you are ---------- */
function nextOf(skill) {
  if (skill === 'pieces') {
    const w = workingPieces();
    if (!w.length) return 'No piece yet: choose one in the Library';
    const p = w.map(x => ({ x, st: skillStatus('p:' + x.pid) })).find(o => o.st.focus || o.st.checks.length);
    return `${w.length} piece${w.length > 1 ? 's' : ''}${p ? ` · next: ${shortTitle(itemDef(p.st.focus || p.st.checks[0]))}` : ''}`;
  }
  if (skill === 'steadiness') {
    const d = skillDetail('steadiness');
    return d ? d[0].toUpperCase() + d.slice(1) : 'Measured from your runs with the metronome';
  }
  const st = skillStatus(skill);
  if (st.locked) return 'Opens when both staffs read fluently';
  const id = st.focus || st.checks[0];
  const detail = skillDetail(skill);
  return (id ? `Next: ${shortTitle(itemDef(id))}` : 'All integrated') + (detail ? ` · ${detail}` : '');
}

function standingCard() {
  const P = Store.s.profile;
  const row = sk => {
    if (sk.area && !areaOn(sk.area)) return '';
    const level = skillLevel(sk.id);
    const trend = level == null ? null : skillTrend(sk.id);
    const value = level == null ? '–' : `${level.toFixed(1)}`;
    const pct = level == null ? 0 : (level / MAX_LEVEL) * 100;
    const tap = sk.id !== 'steadiness';
    return `<${tap ? `button type="button" data-skill="${sk.id}"` : 'div'} class="standrow">
      <b>${esc(sk.n)}</b>
      <span class="skill-track" aria-hidden="true"><i class="tick" style="left:33.3%"></i><i class="tick" style="left:66.6%"></i>
        <span class="skill-bar" style="width:${pct.toFixed(1)}%"></span></span>
      <span class="standval">${
        trend ? `<span class="trend ${trend > 0 ? 'up' : 'down'}">${trend > 0 ? '▲' : '▼'}</span>` : ''
      }<b class="mono">${value}</b></span>
      <span class="small">${esc(nextOf(sk.id))}</span>
    </${tap ? 'button' : 'div'}>`;
  };
  const offer =
    !P.assessed && !P.assessDismissed
      ? `<div class="offer row between">
           <span class="small grow">Not sure where you stand? An 8-minute check sets every level.</span>
           <button class="btn sm cover" type="button" data-act="assess">Start the check</button>
           <button class="btn sm ghost" type="button" data-act="later">Not now</button>
         </div>`
      : '';
  return `<section class="card">
    <div class="row between"><h2 class="h2">Where you are</h2>
      <span class="small">0–${MAX_LEVEL}: Foundations, Developing, Fluent</span></div>
    ${offer}
    <div class="standing">${SKILLS.map(row).join('')}</div>
    ${offer ? '' : '<button class="linkbtn small" type="button" data-act="assess">Measure again with the placement check</button>'}
  </section>`;
}

/* ---------- your week ---------- */
function weekCard() {
  const t = todayKey();
  const days = Array.from({ length: 7 }, (_, i) => addDays(t, i - 6));
  const mins = days.map(d => (Store.s.days[d] || {}).min || 0);
  const max = Math.max(10, ...mins);
  const total = Math.round(mins.reduce((a, b) => a + b, 0));
  const played = mins.filter(m => m >= 1).length;
  const bar = (d, i) =>
    `<i class="${mins[i] < 1 ? 'zero' : ''}${d === t ? ' today' : ''}" style="height:${Math.max(3, (mins[i] / max) * 28)}px"
      title="${d}: ${Math.round(mins[i])} min"></i>`;
  return `<button type="button" class="card weekcard" data-act="progress">
    <span class="grow"><b class="h2">Your week</b>
      <span class="small">${total} min · ${played} of 7 days · history and milestones</span></span>
    <span class="minibars" aria-hidden="true">${days.map(bar).join('')}</span>
  </button>`;
}

function bind(page, s) {
  const act = {
    start: () => go('practice'),
    keep: () => {
      chooseFocus(currentFocus().area);
      go('home');
    },
    focus: () =>
      focusSheet(() => {
        rebuildSession();
        go('home');
      }),
    areas: settingsSheet,
    assess: () => go('assess'),
    later: () => {
      Store.s.profile.assessDismissed = todayKey();
      Store.save();
      go('home');
    },
    progress: progressSheet,
    moods: () => {
      Store.s.path = 'moods';
      Store.save();
      go('home');
    },
  };
  $$('[data-act]', page).forEach(b => (b.onclick = () => act[b.dataset.act]()));
  $$('[data-start]', page).forEach(b => {
    b.onclick = () => {
      const i = +b.dataset.start;
      jumpTo(s, i);
      go('practice');
    };
  });
  $$('[data-skill]', page).forEach(b => {
    b.onclick = () => (b.dataset.skill === 'pieces' ? go('library') : skillSheet(b.dataset.skill));
  });
}

// ---- learn/echo.js ----
/* Echo: the app plays a short phrase, you play it back. Playing by ear, in small steps: a few notes close
   together first, then longer phrases, wider leaps, other keys and minor. Three right in a row moves up a
   level; two misses in a row moves down one, so it stays at the edge of what you can hear. */

const MAJOR = [0, 2, 4, 5, 7, 9, 11];
const MINOR = [0, 2, 3, 5, 7, 8, 10];
const PENTA = [0, 2, 4, 7, 9];

// len: notes; scale; span: highest scale step used (0 = the tonic); leap: largest step between notes
// (in scale steps); keys: tonics to choose from; gap: seconds between notes
const ECHO_LEVELS = [
  { len: 2, scale: PENTA, span: 2, leap: 1, keys: ['C'], gap: 0.6 },
  { len: 3, scale: PENTA, span: 2, leap: 1, keys: ['C'], gap: 0.6 },
  { len: 3, scale: PENTA, span: 3, leap: 2, keys: ['C'], gap: 0.55 },
  { len: 4, scale: PENTA, span: 4, leap: 2, keys: ['C', 'G', 'F'], gap: 0.55 },
  { len: 4, scale: MAJOR, span: 4, leap: 1, keys: ['C', 'G', 'F'], gap: 0.5 },
  { len: 5, scale: MAJOR, span: 7, leap: 2, keys: ['C', 'G', 'F', 'D'], gap: 0.5 },
  { len: 5, scale: MAJOR, span: 7, leap: 4, keys: ['C', 'G', 'F', 'D', 'Bb'], gap: 0.5 },
  { len: 5, scale: MINOR, span: 4, leap: 2, keys: ['A', 'D', 'E'], gap: 0.5 },
  { len: 6, scale: MINOR, span: 7, leap: 4, keys: ['A', 'D', 'E', 'G', 'C'], gap: 0.45 },
  { len: 6, scale: MAJOR, span: 9, leap: 5, keys: ['C', 'G', 'F', 'D', 'Bb', 'A', 'Eb'], gap: 0.45 },
  { len: 7, scale: MAJOR, span: 9, leap: 7, keys: ['C', 'G', 'F', 'D', 'Bb', 'A', 'Eb', 'E'], gap: 0.42 },
];
const MAX_ECHO = ECHO_LEVELS.length;

const TONIC = { C: 60, D: 62, E: 64, F: 65, G: 55, A: 57, Bb: 58, Eb: 63 };
const NAMES = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
const pcName = m => NAMES[((m % 12) + 12) % 12];

// a phrase for a level: {key, minor, tonic, notes: [midi], chord: [midi]}
function makePhrase(level, previous) {
  const L = ECHO_LEVELS[Math.max(1, Math.min(MAX_ECHO, level)) - 1];
  const key = pick(L.keys);
  const tonic = TONIC[key];
  const minor = L.scale === MINOR;
  // scale step k (may pass the octave) to midi
  const midi = k => tonic + 12 * Math.floor(k / L.scale.length) + L.scale[k % L.scale.length];
  for (let tries = 0; tries < 20; tries++) {
    const steps = [0]; // phrases start on the tonic at first, anywhere in the scale later
    if (level > 3) steps[0] = pick([0, 0, 2, 4].filter(k => k <= L.span));
    while (steps.length < L.len) {
      const last = steps[steps.length - 1];
      const options = [];
      for (let k = 0; k <= L.span; k++) if (k !== last && Math.abs(k - last) <= L.leap) options.push(k);
      steps.push(pick(options));
    }
    const notes = steps.map(midi);
    if (previous && notes.join() === previous.notes.join()) continue;
    const third = minor ? 3 : 4;
    return { key, minor, tonic, notes, chord: [tonic - 12, tonic - 12 + third, tonic - 12 + 7] };
  }
  return makePhrase(level, null);
}

// played: midis in order. Any octave counts; the order and the notes must match.
function judge(phrase, played) {
  const pc = m => ((m % 12) + 12) % 12;
  for (let i = 0; i < played.length; i++)
    if (i >= phrase.notes.length || pc(played[i]) !== pc(phrase.notes[i])) return { ok: false, wrongAt: i };
  return {
    ok: played.length === phrase.notes.length,
    wrongAt: -1,
    partial: played.length < phrase.notes.length,
  };
}

// the game's progress after an answer: {level, best, streak, misses}
function afterAnswer(g, ok) {
  const next = { level: g.level || 1, best: g.best || 1, streak: g.streak || 0, misses: g.misses || 0 };
  if (ok) {
    next.streak++;
    next.misses = 0;
    if (next.streak >= 3 && next.level < MAX_ECHO) {
      next.level++;
      next.streak = 0;
    }
  } else {
    next.streak = 0;
    next.misses++;
    if (next.misses >= 2 && next.level > 1) {
      next.level--;
      next.misses = 0;
    }
  }
  next.best = Math.max(next.best, next.level);
  return next;
}

// ---- views/echo.js ----
/* Echo, the call-and-response game (rules in learn/echo.js). */

const PAUSE_MS = { right: 1300, wrong: 3200 };

function drawEcho(body) {
  const games = (Store.s.games = Store.s.games || {});
  const g = (games.echo = Object.assign({ level: 1, best: 1, streak: 0, misses: 0 }, games.echo));
  const E = { phase: 'idle', phrase: null, played: [], timers: [] };
  const later = (fn, ms) => E.timers.push(setTimeout(fn, ms));
  const clear = () => {
    E.timers.forEach(clearTimeout);
    E.timers = [];
  };

  body.innerHTML = `
    <div class="card echo">
      <div class="row between">
        <div>
          <span class="eyebrow">Echo</span>
          <div class="h3" id="ecLevel"></div>
        </div>
        <div class="streak" id="ecStreak" aria-label="Right in a row"></div>
      </div>
      <p class="small">DaCapo plays a short phrase after a chord that sets the key. Play it back, in any
        octave. Three right in a row and the phrases grow.</p>
      <div class="echo-prompt" id="ecPrompt"></div>
      <div class="feedback pl-msg" id="ecMsg" aria-live="polite"></div>
      <div class="kbwrap scrollx"><div id="ecKb"></div></div>
      <div class="row">
        <button class="btn cover" type="button" id="ecGo">Play a phrase</button>
        <button class="btn" type="button" id="ecAgain" disabled>Hear it again</button>
      </div>
    </div>`;
  const msg = (t, cls = '') => {
    const e = $('#ecMsg', body);
    e.className = 'feedback pl-msg ' + cls;
    e.textContent = t;
  };
  const kb = (marks = {}) => ($('#ecKb', body).innerHTML = kbSVG({ from: 48, to: 84, marks, h: 110 }));

  function paintHead() {
    const L = ECHO_LEVELS[g.level - 1];
    $('#ecLevel', body).textContent = `Level ${g.level} of ${MAX_ECHO} · ${L.len} notes · best ${g.best}`;
    $('#ecStreak', body).innerHTML = [0, 1, 2]
      .map(i => `<i class="${i < g.streak ? 'on' : ''}"></i>`)
      .join('');
  }
  function prompt() {
    const p = E.phrase;
    $('#ecPrompt', body).innerHTML = p
      ? `<b>${esc(p.key.replace('b', '♭'))} ${p.minor ? 'minor' : 'major'}</b> · starts on ${esc(pcName(p.notes[0]))}
         · ${E.played.length} of ${p.notes.length}`
      : '';
  }

  // the key chord, then the phrase; listening starts when it has finished
  function playPhrase() {
    clear();
    const p = E.phrase;
    const L = ECHO_LEVELS[g.level - 1];
    E.phase = 'listen';
    E.played = [];
    const t = AudioEngine.now() + 0.08;
    AudioEngine.chord(p.chord, t, 0.9, 0.42);
    p.notes.forEach((m, i) => AudioEngine.note(m, t + 1.1 + i * L.gap, L.gap * 1.3, 0.62));
    const ends = (1.1 + p.notes.length * L.gap) * 1000;
    later(() => {
      E.phase = 'answer';
      msg('Your turn.');
    }, ends);
    msg('Listen…');
    $('#ecAgain', body).disabled = false;
    kb();
    prompt();
  }
  function newPhrase() {
    E.phrase = makePhrase(g.level, E.phrase);
    $('#ecGo', body).textContent = 'Skip';
    playPhrase();
    Log.ev('echo phrase', { level: g.level, notes: E.phrase.notes.length });
  }

  function answered(ok) {
    E.phase = 'shown';
    Object.assign(g, afterAnswer(g, ok));
    Store.save();
    const p = E.phrase;
    const marks = Object.fromEntries(p.notes.map(m => [m, { cls: 'rh' }]));
    kb(marks);
    if (ok) msg(g.streak === 0 && g.level > 1 ? `Right. Up to level ${g.level}.` : 'Right.', 'ok');
    else {
      msg(`It was ${p.notes.map(pcName).join(' – ')}. Listen once more.`, 'bad');
      const L = ECHO_LEVELS[Math.min(MAX_ECHO, g.level) - 1];
      const t = AudioEngine.now() + 0.5;
      p.notes.forEach((m, i) => AudioEngine.note(m, t + i * L.gap, L.gap * 1.3, 0.62));
    }
    paintHead();
    Log.ev('echo answer', { ok, level: g.level, streak: g.streak });
    later(newPhrase, ok ? PAUSE_MS.right : PAUSE_MS.wrong + p.notes.length * 400);
  }

  const off = Input.on(
    Log.guard('echo note', ev => {
      const svg = $('#ecKb svg', body);
      if (E.phase !== 'answer') return;
      E.played.push(ev.m);
      const r = judge(E.phrase, E.played);
      flashKey(svg, ev.m, r.wrongAt >= 0 ? 'bad' : 'ok', 260);
      prompt();
      if (r.wrongAt >= 0) answered(false);
      else if (r.ok) answered(true);
    }),
  );

  $('#ecGo', body).onclick = () => {
    AudioEngine.ensure();
    newPhrase();
  };
  $('#ecAgain', body).onclick = () => {
    if (!E.phrase) return;
    clear();
    playPhrase();
  };
  kb();
  paintHead();
  msg(Input.live ? 'Press "Play a phrase" when you are ready.' : 'Use your piano, or the keys below.');

  return () => {
    clear();
    off();
  };
}

// ---- music/takeread.js ----
/* A recorded take, read back into notes. Events are [ms, 'n', key, velocity], [ms, 'f', key] and
   [ms, 'p', 1|0] for the sustain pedal.
   Pair note-ons with offs. Each note has two lengths: how long the key was down (key) and how long it
   rang (dur): the sustain pedal keeps a released note sounding until the pedal lifts. Playback uses the
   ringing length; the picture shows the key length, with the ringing as a faint tail, so a take played
   with the pedal held down all the way still shows every note where it was played. */

function readTake(ev) {
  const out = [];
  const open = new Map(); // keys that are sounding: {t, m, vel, key, dur}
  let pedal = false;
  const pedalSpans = [];
  let pStart = 0;
  const end = ev.length ? ev[ev.length - 1][0] + 400 : 0;
  const close = (o, t) => {
    o.dur = t - o.t;
    if (o.key == null) o.key = o.dur;
    out.push(o);
  };
  ev.forEach(([t, k, m, v]) => {
    if (k === 'n') {
      if (open.has(m)) close(open.get(m), t); // the same key again: the old note stops
      open.set(m, { t, m, vel: v / 127, key: null, dur: 0 });
    } else if (k === 'f') {
      const o = open.get(m);
      if (!o || o.key != null) return;
      o.key = t - o.t;
      if (!pedal) {
        close(o, t);
        open.delete(m);
      }
    } else if (k === 'p') {
      if (m && !pedal) {
        pedal = true;
        pStart = t;
      } else if (!m && pedal) {
        pedal = false;
        pedalSpans.push([pStart, t]);
        open.forEach((o, mm) => {
          if (o.key != null) {
            close(o, t);
            open.delete(mm);
          }
        });
      }
    }
  });
  if (pedal) pedalSpans.push([pStart, end]);
  open.forEach(o => close(o, Math.max(o.t + 300, end)));
  out.forEach(o => {
    o.dur = Math.max(60, o.dur);
    o.key = Math.max(60, Math.min(o.key, o.dur));
  });
  // the pedal counts from the first note (it may go down before), and never beyond the end
  const first = out.length ? Math.min(...out.map(o => o.t)) : 0;
  const spans = pedalSpans.map(([a, b]) => [Math.max(a, first), b]).filter(([a, b]) => b > a);
  return {
    notes: out.sort((a, b) => a.t - b.t),
    pedal: spans,
    dur: Math.max(end, ...out.map(o => o.t + o.dur)),
  };
}

/* Recording yourself: takes kept on the device, with playback. */

      localStorage.setItem('dacapo.takes', JSON.stringify(l.slice(0, 8)));
    } catch (e) {
      toast('This browser is full; older takes were not kept.');
    }
  },
  start() {
    this.stopRec(true);
    this.rec = { t0: performance.now(), ev: [] };
    this.offs = [
      Input.on(
        ev =>
          this.rec && this.rec.ev.push([Math.round(ev.t - this.rec.t0), 'n', ev.m, Math.round(ev.vel * 127)]),
      ),
      Input.onOff(ev => {
        if (!this.rec) return;
        if (ev.pedal != null) this.rec.ev.push([Math.round(ev.t - this.rec.t0), 'p', ev.pedal ? 1 : 0]);
        else this.rec.ev.push([Math.round(ev.t - this.rec.t0), 'f', ev.m]);
      }),
    ];
  },
  stopRec(discard) {
    this.offs.forEach(f => f());
    this.offs = [];
    const r = this.rec;
    this.rec = null;
    if (discard || !r) return null;
    const ev = r.ev.filter(e => e[0] >= -200).sort((a, b) => a[0] - b[0]);
    if (!ev.some(e => e[1] === 'n')) return null;
    const first = ev.find(e => e[1] === 'n')[0];
    ev.forEach(e => (e[0] -= first));
    const take = { id: 't' + Date.now().toString(36), d: Date.now(), ev, name: '' };
    const l = this.list();
    l.unshift(take);
    this.saveList(l);
    return take;
  },
  notes: take => readTake(take.ev),
  play(take, onEnd) {
    this.stop();
    const { notes, dur } = this.notes(take);
    const t0 = AudioEngine.now() + 0.15;
    notes.forEach(n => AudioEngine.note(n.m, t0 + n.t / 1000, n.dur / 1000, clamp(n.vel, 0.08, 1)));
    const startPerf = performance.now() + 150;
    this.playing = {
      startPerf,
      dur,
      timer: setTimeout(() => {
        this.playing = null;
        onEnd && onEnd();
      }, dur + 400),
    };
    return startPerf;
  },
  stop() {
    if (this.playing) {
      clearTimeout(this.playing.timer);
      this.playing = null;
      AudioEngine.stopAll();
    }
  },
  stats(take) {
    const { notes, pedal, dur } = this.notes(take);
    if (!notes.length) return null;
    const vels = notes.map(n => n.vel);
    const lo = Math.min(...notes.map(n => n.m)),
      hi = Math.max(...notes.map(n => n.m));
    const onsets = groupSteps(
      notes.map(n => ({ t: n.t, m: n.m, vel: n.vel })),
      50,
    );
    let gap = 0;
    for (let i = 1; i < onsets.length; i++) gap = Math.max(gap, onsets[i].t - onsets[i - 1].t);
    const ped = pedal.reduce((a, [x, y]) => a + (y - x), 0);
    return {
      n: notes.length,
      dur,
      nps: notes.length / Math.max(1, dur / 1000),
      vlo: Math.min(...vels),
      vhi: Math.max(...vels),
      vavg: meanOf(vels),
      lo,
      hi,
      gap,
      pedalPct: dur ? Math.min(1, ped / dur) : 0,
    };
  },
  roll(take, w = 640) {
    const { notes, pedal, dur } = this.notes(take);
    if (!notes.length) return '';
    const lo = Math.min(...notes.map(n => n.m)) - 2,
      hi = Math.max(...notes.map(n => n.m)) + 2;
    const rows = hi - lo + 1;
    const rh = clamp(Math.floor(180 / rows), 3, 9);
    const H = rows * rh + 18;
    const sx = (w - 30) / Math.max(1, dur);
    let s = '';
    for (let m = lo; m <= hi; m++) {
      const y = (hi - m) * rh;
      if (isBlack(m)) s += `<rect x="28" y="${y}" width="${w - 28}" height="${rh}" fill="var(--sunk)"/>`;
      if (m % 12 === 0)
        s +=
          `<text x="0" y="${y + rh - 1}" font-size="8" fill="var(--muted)">C${m / 12 - 1}</text>` +
          `<line x1="28" x2="${w}" y1="${y + rh}" y2="${y + rh}" stroke="var(--line)"/>`;
    }
    for (let sec = 0; sec * 1000 < dur; sec += dur > 30000 ? 5 : 1) {
      const x = 30 + sec * 1000 * sx;
      s += `<line x1="${x}" x2="${x}" y1="0" y2="${rows * rh}" stroke="var(--line)" stroke-width=".5"/>`;
    }
    notes.forEach(n => {
      const y = (hi - n.m) * rh;
      const x = (30 + n.t * sx).toFixed(1);
      const keyW = Math.max(2, n.key * sx);
      const ringW = Math.max(0, (n.dur - n.key) * sx);
      const opacity = (0.35 + n.vel * 0.65).toFixed(2); // louder notes are darker
      // the pedal's ringing: a thin faint tail after the key comes up
      if (ringW > 1)
        s += `<rect class="ring" x="${(+x + keyW).toFixed(1)}" y="${y + rh / 2 - 1}" width="${ringW.toFixed(1)}" height="2" fill="var(--rh)" fill-opacity="0.25"/>`;
      s += `<rect class="key" x="${x}" y="${y + 0.5}" width="${keyW.toFixed(1)}" height="${rh - 1}" rx="1.5" fill="var(--rh)" fill-opacity="${opacity}"/>`;
    });
    pedal.forEach(([a, b]) => {
      const width = Math.max(2, (b - a) * sx);
      s += `<rect x="${30 + a * sx}" y="${rows * rh + 6}" width="${width}" height="6" rx="2" fill="var(--brass)"/>`;
    });
    const playhead = `<line class="playhead" x1="30" x2="30" y1="0" y2="${rows * rh}" stroke="var(--brass)" stroke-width="2" opacity="0"/>`;
    return `<svg class="roll" viewBox="0 0 ${w} ${H}" style="width:100%;height:auto" role="img"
      aria-label="Piano roll of the take"><g>${s}</g>${playhead}</svg>`;
  },
};

function takesCardHTML() {
  return `
    <div class="cardhead">
      <h2 class="h2">Takes</h2>
      <span class="small">Record, look, listen back</span>
    </div>
    <p class="small">Listening back is the most honest feedback there is. Record a run-through, then listen
      away from the keys: you hear rushing, uneven runs and muddy pedal that you miss while playing. Takes
      stay on this device (last 8).</p>
    <div class="row">
      <button class="btn cover" type="button" id="tkRec">● Record</button>
      <span class="small mono" id="tkTime"></span>
    </div>
    <div id="tkList" class="stack"></div>`;
}

function bindTakes(root) {
  const recBtn = $('#tkRec', root),
    timeEl = $('#tkTime', root),
    list = $('#tkList', root);
  let tick = 0;
  const paint = () => {
    const l = Takes.list();
    list.innerHTML = l.length
      ? l
          .map((t, i) => {
            const st = Takes.stats(t);
            if (!st) return '';
            const when = new Date(t.d).toLocaleString(undefined, {
              month: 'short',
              day: 'numeric',
              hour: 'numeric',
              minute: '2-digit',
            });
            const facts = [
              fmtTime(st.dur / 1000),
              `${st.n} notes`,
              `${midiName(st.lo, true)}–${midiName(st.hi, true)}`,
              st.vhi > 0 && `dynamics ${dynName(st.vlo)}–${dynName(st.vhi)}`,
              st.pedalPct && `pedal down ${Math.round(st.pedalPct * 100)}%`,
              st.gap > 2500 && `longest stop ${(st.gap / 1000).toFixed(1)}s`,
            ];
            return `<div class="take" data-id="${t.id}">
              <div class="row between">
                <b>${esc(t.name || when)}</b>
                <div class="row">
                  <button class="btn sm" type="button" data-play="${t.id}">▶ Play</button>
                  <button class="btn sm ghost" type="button" data-del="${t.id}" aria-label="Delete take">Delete</button>
                </div>
              </div>
              ${i === 0 ? `<div class="rollwrap">${Takes.roll(t)}</div>` : ''}
              <div class="small">${facts.filter(Boolean).join(' · ')}</div>
            </div>`;
          })
          .join('')
      : '<p class="small">No takes yet.</p>';
    list.querySelectorAll('[data-play]').forEach(
      b =>
        (b.onclick = () => {
          const t = Takes.list().find(x => x.id === b.dataset.play);
          if (!t) return;
          if (Takes.playing) {
            Takes.stop();
            paint();
            return;
          }
          b.textContent = '■ Stop';
          const start = Takes.play(t, paint);
          const svg = b.closest('.take').querySelector('svg.roll');
          if (svg) {
            const ph = svg.querySelector('.playhead');
            const W = svg.viewBox.baseVal.width;
            const dur = Takes.playing.dur;
            ph.setAttribute('opacity', 1);
            const anim = () => {
              if (!Takes.playing) {
                ph.setAttribute('opacity', 0);
                return;
              }
              const x = 30 + clamp((performance.now() - start) / dur, 0, 1) * (W - 30);
              ph.setAttribute('x1', x);
              ph.setAttribute('x2', x);
              requestAnimationFrame(anim);
            };
            requestAnimationFrame(anim);
          }
        }),
    );
    list.querySelectorAll('[data-del]').forEach(
      b =>
        (b.onclick = () => {
          const all = Takes.list();
          const i = all.findIndex(x => x.id === b.dataset.del);
          const [gone] = all.splice(i, 1);
          Takes.saveList(all);
          paint();
          toast('Take deleted', 6000, {
            label: 'Undo',
            run: () => {
              const a = Takes.list();
              a.splice(i, 0, gone);
              Takes.saveList(a);
              paint();
            },
          });
        }),
    );
  };
  recBtn.onclick = () => {
    if (Takes.rec) {
      clearInterval(tick);
      const t = Takes.stopRec();
      recBtn.textContent = '● Record';
      recBtn.classList.remove('bad');
      timeEl.textContent = '';
      if (!t) toast('Nothing was played, so nothing was saved.');
      paint();
      return;
    }
    AudioEngine.ensure();
    Takes.start();
    recBtn.textContent = '■ Stop';
    recBtn.classList.add('bad');
    const t0 = performance.now();
    tick = setInterval(() => {
      timeEl.textContent =
        '● ' +
        fmtTime((performance.now() - t0) / 1000) +
        (Takes.rec ? ` · ${Takes.rec.ev.filter(e => e[1] === 'n').length} notes` : '');
    }, 250);
  };
  paint();
  return () => {
    clearInterval(tick);
    if (Takes.rec) {
      const t = Takes.stopRec();
      if (t) toast('Take saved');
    }
    Takes.stop();
  };
}

// ---- views/free.js ----
/* Free play: play anything, nothing is scored. DaCapo names what it hears, keeps a loop going (Jam), plays
   an ear game (Echo), records you, and keeps time. Improvising over a style study is practice: it lives
   with the Improvisation skill. */

const freeView = (page, params) => {
  const st = Object.assign({ tab: 'live' }, UI.freeState || {}, params);
  UI.freeState = st;
  const tabs = [
    ['live', 'Listen'],
    ['jam', 'Jam'],
    ['echo', 'Echo'],
    ['takes', 'Record'],
    ['metro', 'Metronome'],
  ];
  page.innerHTML = `
    <h1 class="h1 pagetitle">Free <em>play</em></h1>
    ${seg('ftab', tabs, st.tab, 'wrap')}
    <div id="fBody" class="stack" style="gap:16px"></div>`;
  let off = null;
  const cleanup = () => {
    if (off) {
      try {
        off();
      } catch (e) {
        Log.err(e, 'free cleanup');
      }
      off = null;
    }
  };
  onUnmount(cleanup);
  bindSegs(page, {
    ftab: v => {
      st.tab = v;
      draw();
    },
  });
  const body = $('#fBody', page);
  const draw = () => {
    cleanup();
    const draws = {
      live: drawLive,
      jam: () => drawJam(body),
      echo: () => drawEcho(body),
      takes: drawTakes,
      metro: drawMetro,
    };
    off = (draws[st.tab] || drawLive)();
  };
  draw();

  function drawLive() {
    body.innerHTML = `${connectNotice()}
      <div class="card">
        <div class="readout">
          <div class="stack" style="gap:2px;min-width:0">
            <div class="chordname" id="lvChord">–</div>
            <div class="small" id="lvLong">Play a chord or a few notes</div>
          </div>
          <div class="stack" style="align-items:flex-end;gap:4px">
            <span class="tag" id="lvPedal">Pedal up</span>
            <span class="small mono" id="lvVel"></span>
          </div>
        </div>
        <div class="kbwrap scrollx" id="lvKbWrap">
          <div class="kb88" id="lvKb">${kbSVG({ from: 21, to: 108, h: 120 })}</div>
        </div>
        <div class="staffwrap" id="lvStaff"></div>
        <p class="small" id="lvKey"></p>
      </div>`;
    bindConnect();
    const wrap = $('#lvKbWrap', body);
    const kb = () => $('#lvKb svg', body);
    requestAnimationFrame(() => {
      const k = kb() && kb().querySelector('[data-m="60"]');
      if (k && wrap.scrollWidth > wrap.clientWidth)
        wrap.scrollLeft =
          k.getBoundingClientRect().left -
          wrap.getBoundingClientRect().left -
          wrap.clientWidth / 2 +
          wrap.scrollLeft;
    });
    let keyNow = null,
      lastChord = null,
      raf = 0,
      keyT = 0;
    // spell notes in the detected key once it is reasonably clear
    const keySig = () => (keyNow && keyNow.conf > 0.04 ? keyNow.best.sig : 0);
    const speller = () => spellerFor(keySig());
    const paint = () => {
      const svg = kb();
      if (!svg) return;
      svg.querySelectorAll('.held,.sus').forEach(e => e.classList.remove('held', 'sus'));
      Live.sustained.forEach(m => {
        const e = svg.querySelector(`[data-m="${m}"]`);
        if (e) e.classList.add('sus');
      });
      Input.held.forEach((_, m) => {
        const e = svg.querySelector(`[data-m="${m}"]`);
        if (e) {
          e.classList.remove('sus');
          e.classList.add('held');
        }
      });
      $('#lvPedal', body).textContent = Input.pedal ? 'Pedal down' : 'Pedal up';
      $('#lvPedal', body).className = 'tag ' + (Input.pedal ? 'lh' : '');
      const sounding = [...new Set([...Input.held.keys(), ...Live.sustained])];
      if (sounding.length) lastChord = detectChord(sounding, speller());
      $('#lvChord', body).textContent = lastChord ? lastChord.name : '–';
      $('#lvLong', body).textContent = lastChord ? lastChord.long : 'Play a chord or a few notes';
      $('#lvStaff', body).innerHTML = recentStaff();
    };
    // your last notes on a grand staff, the newest highlighted
    const recentStaff = () => {
      const steps = groupSteps(Live.hist.slice(-40)).slice(-14);
      if (!steps.length)
        return `<p class="small" style="padding:10px">Your last notes are written here, so you can see
          what you played on the staff.</p>`;
      const sp = speller();
      const items = steps.map((g, k) => ({
        notes: g.ms.map(m => ({
          n: sp(m),
          st: m >= 60 ? 't' : 'b',
          cls: k === steps.length - 1 ? 'cur' : '',
        })),
      }));
      const svg = staffSVG({ clef: 'grand', sig: keySig(), items, spacing: 30, minW: 320, bottom: 40 }).svg;
      return `<div style="max-width:720px;margin:0 auto">${svg}</div>`;
    };
    const paintKey = () => {
      keyNow = detectKey(Live.hist.slice(-60).map(h => h.m));
      const e = $('#lvKey', body);
      if (!e) return;
      if (!keyNow) {
        e.textContent = 'Play for a little while and I will work out the key.';
        return;
      }
      const { best, second, conf } = keyNow;
      const how = conf > 0.08 ? 'Clearly' : conf > 0.03 ? 'Probably' : 'Possibly';
      const or = conf <= 0.08 ? ` (or ${prettyKey(second.k)} ${second.mode})` : '';
      e.textContent = `${how} in ${prettyKey(best.k)} ${best.mode}${or}, from your last ${Math.min(60, Live.hist.length)} notes.`;
    };
    const sched = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0;
        paint();
      });
    };
    const o1 = Input.on(ev => {
      sched();
      if (ev.src === 'midi')
        $('#lvVel', body).textContent = `${dynName(ev.vel)} · ${Math.round(ev.vel * 127)}`;
      clearTimeout(keyT);
      keyT = setTimeout(paintKey, 600);
    });
    const o2 = Input.onOff(sched);
    paint();
    paintKey();
    return () => {
      o1();
      o2();
      cancelAnimationFrame(raf);
      clearTimeout(keyT);
    };
  }
  function drawTakes() {
    body.innerHTML = `${connectNotice()}<div class="card" id="fTakes">${takesCardHTML()}</div>`;
    bindConnect();
    return bindTakes($('#fTakes', body));
  }
  function drawMetro() {
    let bpm = Metro.bpm || 72;
    let beats = Metro.beats || 4;
    const meters = ['2', '3', '4', '6'].map(n => [n, n]);
    body.innerHTML = `
      <div class="card">
        <div class="cardhead"><h2 class="h2">Metronome</h2></div>
        <div class="row between">
          <div class="chordname mono" id="mBpm">${bpm}</div>
          <div class="row">
            <button class="btn" type="button" data-d="-1">−</button>
            <button class="btn" type="button" data-d="1">+</button>
            <button class="btn" type="button" id="mTap">Tap</button>
          </div>
        </div>
        <input type="range" id="mRange" min="30" max="220" value="${bpm}">
        <div class="row"><span class="small">Beats per bar</span>${seg('mBeats', meters, beats)}</div>
        <div class="beats" id="mDots">${'<i></i>'.repeat(beats)}</div>
        <button class="btn cover big" type="button" id="mGo">${Metro.running ? 'Stop' : 'Start'}</button>
      </div>`;
    const set = v => {
      bpm = clamp(Math.round(v), 30, 220);
      $('#mBpm', body).textContent = bpm;
      $('#mRange', body).value = bpm;
      if (Metro.running) Metro.start({ bpm, beats, sub: 1 });
    };
    body.querySelectorAll('[data-d]').forEach(b => (b.onclick = () => set(bpm + +b.dataset.d)));
    $('#mRange', body).oninput = e => set(+e.target.value);
    $('#mTap', body).onclick = () => {
      Metro.tap();
      set(Metro.bpm);
    };
    bindSegs(body, {
      mBeats: v => {
        beats = +v;
        $('#mDots', body).innerHTML = '<i></i>'.repeat(beats);
        if (Metro.running) Metro.start({ bpm, beats, sub: 1 });
      },
    });
    $('#mGo', body).onclick = e => {
      AudioEngine.ensure();
      if (Metro.running) {
        Metro.stop();
        e.target.textContent = 'Start';
      } else {
        Metro.start({ bpm, beats, sub: 1 });
        e.target.textContent = 'Stop';
      }
    };
    const offB = Metro.on((k, q) => {
      if (k !== 'beat') return;
      $$('#mDots i', body).forEach((d, j) => {
        d.classList.toggle('on', j === q.beat);
        d.classList.toggle('acc', q.beat === 0);
      });
    });
    return () => {
      offB();
      Metro.stop();
    };
  }
};

// ---- views/assess.js ----
/* The placement check, step by step (the scoring is in learn/assess.js). Every step can be skipped. */

const QUESTION_MS = 25000; // a theory question left unanswered this long counts as not known
const PULSE = { bpm: 80, withClick: 8, alone: 8 };

const assessView = page => {
  const R = { reading: {}, theory: [] };
  let cleanups = [];
  const cleanup = () => {
    cleanups.forEach(f => f());
    cleanups = [];
  };
  onUnmount(cleanup);
  const listen = fn => cleanups.push(Input.on(Log.guard('assess note', fn)));
  const timer = (fn, ms) => {
    const t = setTimeout(fn, ms);
    cleanups.push(() => clearTimeout(t));
  };
  const speller = spellerFor(0);
  const STEPS = [
    intro,
    () => reading('treble'),
    () => reading('bass'),
    () => scale('rh'),
    () => scale('ht'),
    theory,
    pulse,
    result,
  ];
  let step = 0;
  const next = () => {
    cleanup();
    step++;
    Log.ev('assess step', { step });
    STEPS[step]();
  };
  intro();

  // the frame every step shares: a title, instructions, the area to play in, a keyboard, skip
  function frame(title, how, { body = '', keyboard = true, skip = true } = {}) {
    const n = STEPS.length - 2;
    page.innerHTML = `
      <div class="stack">
        <span class="eyebrow">Placement check${step > 0 && step <= n ? ` · step ${step} of ${n}` : ''}</span>
        <h1 class="h2">${esc(title)}</h1>
      </div>
      ${step > 0 ? connectNotice() : ''}
      <div class="card assess">
        <p class="small" id="asHow">${how}</p>
        <div id="asBody">${body}</div>
        <div class="feedback pl-msg" id="asMsg" aria-live="polite"></div>
        ${keyboard ? `<div class="kbwrap scrollx"><div id="asKb">${kbSVG({ from: 36, to: 96, h: 96 })}</div></div>` : ''}
        <div class="row between">
          <span class="small" id="asInfo"></span>
          ${skip ? '<button class="btn sm ghost" type="button" id="asSkip">Skip this part</button>' : ''}
        </div>
      </div>`;
    bindConnect();
    const sk = $('#asSkip', page);
    if (sk) sk.onclick = next;
  }
  const msg = (t, cls = '') => {
    const e = $('#asMsg', page);
    if (e) {
      e.className = 'feedback pl-msg ' + cls;
      e.textContent = t;
    }
  };
  const info = t => {
    const e = $('#asInfo', page);
    if (e) e.textContent = t;
  };
  const flash = (m, ok) => flashKey($('#asKb svg', page), m, ok ? 'ok' : 'bad', 220);

  /* ---------- steps ---------- */
  function intro() {
    frame(
      'Find your starting points',
      `About eight minutes at the piano. You will read a few notes in each clef, play a C major scale, answer
       some questions by playing, and keep a steady beat. Nothing here can go wrong: it only decides where
       practice starts. Skip anything you like.`,
      {
        keyboard: false,
        skip: false,
        body: '<button class="btn cover big" type="button" id="asGo">Start</button>',
      },
    );
    $('#asGo', page).onclick = () => {
      AudioEngine.ensure();
      next();
    };
  }

  function reading(clef) {
    const notes = readingNotes(clef);
    const answers = [];
    let i = 0;
    let shownAt = 0;
    frame(
      clef === 'treble' ? 'Reading: treble clef' : 'Reading: bass clef',
      `A note appears on the staff. Play it on the piano, in the octave where it is written. Take the time you
       need, but don't guess: speed only counts when the note is right.`,
    );
    const show = () => {
      const nt = notes[i];
      $('#asBody', page).innerHTML = `<div class="assess-note" data-midi="${nt.midi}">${
        staffSVG({
          clef,
          sig: 0,
          items: [{ notes: [{ n: nt.n, st: clef === 'treble' ? 't' : 'b', cls: 'cur' }] }],
          spacing: 40,
          minW: 200,
          top: 46,
          bottom: 46,
        }).svg
      }</div>`;
      info(`Note ${i + 1} of ${notes.length}`);
      shownAt = performance.now();
    };
    const misses = level => answers.filter(a => a.level === level && !a.ok).length;
    listen(ev => {
      const nt = notes[i];
      if (!nt) return;
      const ok = ev.m === nt.midi;
      answers.push({ level: nt.level, ok, ms: ev.t - shownAt });
      flash(ev.m, ok);
      msg(ok ? 'Right.' : `That was ${nameOf(speller(ev.m))}; this is ${nameOf(nt.n)}.`, ok ? 'ok' : 'bad');
      i++;
      // two misses in a level: the harder levels can wait
      if (i >= notes.length || misses(nt.level) >= 2) {
        R.reading[clef] = scoreReading(clef, answers);
        Log.ev('assess reading', { clef, levels: R.reading[clef].map(l => `${l.ok}/${l.tried} ${l.ms}`) });
        return timer(next, 900);
      }
      timer(show, 450);
    });
    show();
  }

  function scale(hands) {
    if (hands === 'ht' && (!R.scale || !R.scale.rh || R.scale.rh.right < R.scale.rh.of - 2)) return next();
    const want = hands === 'rh' ? 15 : 58;
    const notes = [];
    frame(
      hands === 'rh' ? 'Scale: right hand' : 'Scale: hands together',
      hands === 'rh'
        ? 'Play a C major scale with the right hand, one octave up and back down (C to C to C), at a speed that feels comfortable. No metronome.'
        : 'Now both hands together, two octaves up and back down, at a comfortable speed.',
    );
    info(hands === 'rh' ? 'Start whenever you are ready' : 'Both hands, two octaves');
    let quiet = 0;
    let finished = false;
    const done = () => {
      // once only: notes played after the scale (or the quiet timer) must not score it again and skip a step
      if (finished) return;
      finished = true;
      clearTimeout(quiet);
      R.scale = R.scale || {};
      R.scale[hands] = scoreScale(notes, hands);
      const s = R.scale[hands];
      Log.ev('assess scale', { hands, ...s });
      msg(
        `${s.right} of ${s.of} notes right${s.bpm ? ` · about ♩ ${s.bpm} (two notes per beat)` : ''}${s.cv != null ? ` · ${s.cv < 0.12 ? 'even' : s.cv < 0.2 ? 'fairly even' : 'uneven'}` : ''}.`,
        s.right >= s.of - 1 ? 'ok' : '',
      );
      timer(next, 1800);
    };
    listen(ev => {
      if (finished) return;
      notes.push({ m: ev.m, t: ev.t });
      flash(ev.m, true);
      info(`${hands === 'rh' ? notes.length : Math.round(notes.length / 2)} notes`);
      clearTimeout(quiet);
      if (notes.length >= want) return done();
      quiet = setTimeout(() => notes.length >= 6 && done(), 3000);
    });
    cleanups.push(() => clearTimeout(quiet));
  }

  function theory() {
    let k = 0;
    let missedInRow = 0;
    frame(
      'Theory, by playing',
      'Answer each question on the piano. If you do not know one, skip it: that is useful to know too.',
    );
    const ask = () => {
      if (k >= THEORY_STEPS.length || missedInRow >= 2) return next();
      const unit = THEORY_STEPS[k];
      const q = makeQuestion(unit);
      $('#asBody', page).innerHTML =
        `<div class="quiz-q"><div class="quiz-prompt">${esc(q.prompt)}</div><div class="small">${esc(q.sub)}</div></div>`;
      info(`Question ${k + 1}`);
      msg('');
      let answered = false;
      const finish = ok => {
        if (answered) return;
        answered = true;
        listener.stop();
        R.theory.push({ unit, ok });
        missedInRow = ok ? 0 : missedInRow + 1;
        msg(ok ? 'Right.' : q.explain, ok ? 'ok' : '');
        k++;
        timer(ask, ok ? 900 : 2400);
      };
      const listener = collectAnswer(q, groups => finish(check(q, groups).ok));
      cleanups.push(() => listener.stop());
      timer(() => finish(false), QUESTION_MS);
      $('#asSkip', page).textContent = 'I do not know this one';
      $('#asSkip', page).onclick = () => finish(false);
    };
    listen(ev => flash(ev.m, true));
    ask();
  }

  function pulse() {
    frame(
      'A steady beat',
      `Play any key along with the click. After ${PULSE.withClick} clicks it stops: keep going on your own for
       about ${PULSE.alone} more beats, as evenly as you can.`,
      { body: '<button class="btn cover" type="button" id="asBeat">Start the click</button>' },
    );
    $('#asBeat', page).onclick = () => {
      AudioEngine.ensure();
      $('#asBody', page).innerHTML = '';
      const taps = [];
      const msBeat = 60000 / PULSE.bpm;
      const first = AudioEngine.toPerf(Metro.start({ bpm: PULSE.bpm, beats: 4 }));
      const clicks = Array.from({ length: PULSE.withClick }, (_, i) => first + i * msBeat);
      cleanups.push(() => Metro.stop());
      timer(
        () => {
          Metro.stop();
          msg('Keep going…');
        },
        clicks[clicks.length - 1] - performance.now() + msBeat * 0.6,
      );
      listen(ev => {
        taps.push(ev.t);
        flash(ev.m, true);
      });
      timer(
        () => {
          R.pulse = scorePulse(taps, clicks, msBeat);
          Log.ev('assess pulse', R.pulse || { taps: taps.length });
          msg(
            R.pulse
              ? `On your own: ± ${Math.round(R.pulse.sd * 100)}% of a beat.`
              : 'Not enough beats to measure.',
          );
          timer(next, 1600);
        },
        clicks[clicks.length - 1] - performance.now() + msBeat * (PULSE.alone + 1.5),
      );
    };
  }

  function result() {
    applyPlacement(R);
    const lines = [];
    for (const clef of ['treble', 'bass']) {
      const levels = R.reading[clef];
      if (!levels) continue;
      const passed = levels.filter(l => l.passed);
      const name = clef === 'treble' ? 'Treble reading' : 'Bass reading';
      lines.push(
        passed.length
          ? `${name}: secure up to "${itemDef(passed[passed.length - 1].unit).title.split(': ')[1]}".`
          : `${name}: starts from the beginning, with the first five notes.`,
      );
    }
    if (R.scale && R.scale.rh)
      lines.push(
        `Scales: C major ${R.scale.ht && R.scale.ht.right >= R.scale.ht.of - 2 ? 'hands together' : R.scale.rh.right >= R.scale.rh.of - 1 ? 'right hand' : 'is a good place to start'}.`,
      );
    const right = R.theory.filter(a => a.ok).length;
    if (R.theory.length) lines.push(`Theory: ${right} of ${R.theory.length} questions right.`);
    if (R.pulse) lines.push(`Steadiness: ± ${Math.round(R.pulse.sd * 100)}% of a beat on your own.`);
    const best = rankAreas()[0];
    frame(
      'Your starting points',
      'Practice now starts from here. Anything marked as known comes back for a quick review in a week, which confirms it.',
      {
        keyboard: false,
        skip: false,
        body: `<ul class="small">${lines.map(l => `<li>${esc(l)}</li>`).join('') || '<li>Everything starts from the beginning.</li>'}</ul>
          ${
            best
              ? `<div class="focusbar card"><span class="eyebrow">Suggested focus for this week</span>
                   <b class="h3">${esc(AREA_BY[best.area].n)}</b><div class="small">${esc(best.reason)}</div></div>`
              : ''
          }
          <button class="btn cover big" type="button" id="asDone">Start practicing</button>
          ${best ? '<button class="btn ghost" type="button" id="asOther">Choose another focus</button>' : ''}`,
      },
    );
    $('#asDone', page).onclick = () => {
      if (best) chooseFocus(best.area);
      go('practice');
    };
    const other = $('#asOther', page);
    if (other) other.onclick = () => focusSheet(() => go('home'));
  }
};

// ---- app.js ----
/* The entry point: wires the parts together and starts the app. */

/* ---------- boot ---------- */
// what a problem report says about the app, beyond the browser itself
function describeApp() {
  const s = Store.s;
  let audio = null;
  try {
    const c = AudioEngine.ctx;
    audio = c
      ? { state: c.state, sr: c.sampleRate, out: c.outputLatency || 0, base: c.baseLatency || 0 }
      : null;
  } catch (e) {}
  return {
    input: {
      mode: Input.mode,
      live: Input.live,
      devices: Input.midiNames,
      status: Input.status,
      err: Input.lastErr,
    },
    midiOut: { port: MidiOut.port ? MidiOut.port.name : null, on: !!s.settings.midiOut },
    audio,
    view: UI.view,
  };
}

function describeLearning() {
  const s = Store.s;
  const items = Object.entries(s.items || {}).map(([id, it]) =>
    [
      `${id} ${it.stage}${it.phase ? '/' + it.phase : ''}`,
      `bpm${it.bpm || '-'}${it.target ? '→' + it.target : ''}`,
      `pass${(it.passes || []).length}`,
      `last${it.last || '-'}`,
    ].join(' '),
  );
  return {
    v: s.v,
    savedAt: s.savedAt,
    session: s.session,
    pieces: s.piece && s.piece.working,
    focus: s.focus,
    prefs: s.profile,
    items: items.slice(0, 80),
    days: Object.keys(s.days || {}).length,
  };
}

function boot() {
  try {
    Log.setContext({ env: describeApp, state: describeLearning, openReport: () => reportSheet() });
    registerViews({
      home: homeView,
      practice: practiceView,
      mood: moodView,
      library: libraryView,
      free: freeView,
      assess: assessView,
    });
    startLive();
    Store.loadLocal();
    refreshItems();
    Log.ev('boot', {
      version: APP_VERSION,
      build: BUILD,
      inClaude: IN_CLAUDE,
      input: Store.s.settings.input,
      onboarded: Store.s.profile.onboarded,
    });
    $$('#tabs [data-view]').forEach(b => (b.onclick = () => go(b.dataset.view)));
    $('#inputChip').onclick = settingsSheet;
    $('#settingsBtn').onclick = settingsSheet;
    Input.mode = Store.s.settings.input || 'touch';
    if (Input.mode === 'midi') Input.setMode('midi');
    else if (Input.mode === 'mic') {
      Input.status = 'Microphone is off. Turn it on in Settings.';
      Input.live = false;
    }
    Input.paint();
    snapshotSkills();
    // a reload comes back to the same screen; a fresh start (or a session in progress) to Home
    let start = 'home';
    try {
      start = sessionStorage.getItem('dacapo.view') || 'home';
    } catch (e) {}
    const hv = (location.hash || '').slice(1);
    if (hasView(hv)) start = hv;
    go(start);
    // a newer state (from your Claude account, or a restored backup): redraw from it, so no screen keeps
    // working on objects from the old one
    Store.on(kind => {
      if (kind !== 'state') return;
      refreshItems();
      go(UI.view, UI.params);
    });
    Store.connect();
    // coming back to the app on a new day: note where the skills stand, and rebuild the session
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible' || !Store.s.session || Store.s.session.day === todayKey())
        return;
      snapshotSkills();
      if (UI.view === 'practice') go('practice');
    });
  } catch (e) {
    Log.err(e, 'boot');
    const p = document.getElementById('page');
    if (p)
      p.innerHTML =
        '<div class="card"><h2 class="h2">DaCapo could not start</h2><p class="small">The problem was logged. Reload the page; if it happens again, Settings → Report a problem includes the log.</p></div>';
  }
}

// A handle on the app's parts for the browser console and the end-to-end tests (tests/).
window.DaCapo = {
  // parts
  Store,
  Log,
  Input,
  Library,
  Player,
  Quiz,
  Transport,
  Sounds,
  AudioEngine,
  Metro,
  Activity,
  UI,
  // navigation and panels
  go,
  closeSheet,
  settingsSheet,
  reportSheet,
  pieceSheet,
  // the curriculum
  todayKey,
  addDays,
  itemDef,
  itemState,
  ensureItem,
  planFor,
  skillStatus,
  currentSession,
  rebuildSession,
  workOnPiece,
  setPieceDaily,
  pieceSession,
  // skills and focus
  skillLevel,
  rankAreas,
  currentFocus,
  chooseFocus,
  applyPlacement,
};

boot();
})();
