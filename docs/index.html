      out = { msg: `You know this. Now for speed: under ${secs(it.pace)} per answer.`, change: 'stage' };
    } else if (it.since >= THEORY_STALL && okCount(it, 8) < 4) {
      // not clicking: show how it works again, with the answer appearing early for a few questions
      it.since = 0;
      it.stalls = (it.stalls || 0) + 1;
      it.guided = 4;
      Log.ev('stall', { id, stage: 'learn' });
      out = {
        msg: "Let's look at how it works again. For the next few questions the answer appears sooner: watch it, then play it.",
        change: 'stall',
      };
    }
  } else if (it.stage === 'pace') {
    if (last(10).length >= 8 && okCount(it, 10) >= 9 && okMs(6) <= it.pace) {
      it.answers = [];
      it.since = 0;
      if (it.pace <= def.goal) {
        toCheck(id, it, t);
        out = { msg: 'Quick and sure. From tomorrow: a cold check of five questions.', change: 'stage' };
      } else {
        it.pace = roundPace(Math.max(def.goal, it.pace * 0.85));
        out = { msg: `Quicker now. New goal: ${secs(it.pace)} per answer.`, change: 'pace' };
      }
    } else if (it.since >= THEORY_STALL * 2) {
      it.since = 0;
      it.stalls = (it.stalls || 0) + 1;
      it.pace = roundPace(Math.min(def.goal * 2, it.pace * 1.15));
      Log.ev('stall', { id, stage: 'pace' });
      out = {
        msg: `Speed often jumps after a night's sleep. The goal is a little easier for now: ${secs(it.pace)}.`,
        change: 'stall',
      };
    }
  } else if (it.lastCold !== t && (it.stage === 'check' || (it.stage === 'done' && it.due && it.due <= t))) {
    // the cold check: the first five answers of the day, four of them right
    if (!it.coldSet || it.coldSet.d !== t) it.coldSet = { d: t, n: 0, ok: 0 };
    it.coldSet.n++;
    if (a.ok) it.coldSet.ok++;
    if (it.coldSet.n >= COLD_QUESTIONS) {
      const passed = it.coldSet.ok >= COLD_QUESTIONS - 1;
      out = (it.stage === 'check' ? coldCheck : coldReview)(id, def, it, passed, t);
    }
  }
  Store.save();
  return {
    ...out,
    reached:
      (out.change === 'stage' && it.stage === 'check') || out.change === 'done' || out.change === 'pass',
  };
}

/* ---------- improvisation minutes ---------- */
function recordImprov(id, ms, land, bars) {
  const def = itemDef(id);
  const it = ensureItem(id);
  const t = todayKey();
  if (!it || !def) return null;
  it.mins = Math.round(((it.mins || 0) + ms / 60000) * 10) / 10;
  it.last = t;
  if (land != null && bars >= 4) {
    it.land = Math.round(land);
    it.days = Array.from(new Set([...(it.days || []), t])).slice(-10);
  }
  if (it.stage !== 'done' && it.mins >= def.minutes && (it.days || []).length >= 2 && (it.land || 0) >= 55) {
    it.stage = 'done';
    milestone(id, 'done');
    Store.save();
    return 'done';
  }
  Store.save();
  return null;
}

// ---- music/render.js ----
/* Drawing music: staff notation for drills and real scores, rhythm lines and the keyboard. */

const SS = 10,
  GS = SS / 250; // staff space, glyph scale

function glyph(name, x, y, cls = 'gl', extra = '') {
  return `<path class="${cls}" d="${GLYPHS[name]}" transform="translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${GS},${-GS})" ${extra}/>`;
}

/* Staff geometry. Treble lines: dia 30..38 (E4..F5). Bass lines: dia 18..26 (G2..A3). */
function staffGeom(clef, opts = {}) {
  const top = opts.top ?? 40;
  const g = { clef, top };
  if (clef === 'treble') {
    g.yT = d => top + (38 - d) * 5;
    g.lines = [{ y: top }];
    g.h = top + 40 + (opts.bottom ?? 40);
  } else if (clef === 'bass') {
    g.yB = d => top + (26 - d) * 5;
    g.h = top + 40 + (opts.bottom ?? 40);
  } else {
    const yb = top + 90;
    g.yT = d => top + (38 - d) * 5;
    g.yB = d => yb + (26 - d) * 5;
    g.yb = yb;
    g.h = yb + 40 + (opts.bottom ?? 40);
  }
  g.y = (d, st) => ((st === 'b' ? g.yB : g.yT) || g.yT || g.yB)(d);
  return g;
}

function staffLines(g, x0, x1) {
  let s = '';
  const draw = ytop => {
    for (let i = 0; i < 5; i++)
      s += `<line class="ln" x1="${x0}" x2="${x1}" y1="${ytop + i * SS}" y2="${ytop + i * SS}"/>`;
  };
  if (g.clef === 'treble') draw(g.top);
  else if (g.clef === 'bass') draw(g.top);
  else {
    draw(g.top);
    draw(g.yb);
    s += `<line class="ln" x1="${x0}" x2="${x0}" y1="${g.top}" y2="${g.yb + 40}" style="stroke-width:1.4"/>`;
  }
  return s;
}

function clefsAndSig(g, sig, x = 6) {
  let s = '';
  const doClef = which => {
    if (which === 'treble') s += glyph('gClef', x, g.yT(32));
    else s += glyph('fClef', x, g.yB(24));
  };
  if (g.clef !== 'bass') doClef('treble');
  if (g.clef !== 'treble') doClef('bass');
  let xx = x + 34;
  const sigs = [];
  if (g.clef !== 'bass') sigs.push(['t', keySigNotes(sig, 'treble')]);
  if (g.clef !== 'treble') sigs.push(['b', keySigNotes(sig, 'bass')]);
  sigs.forEach(([st, arr]) =>
    arr.forEach((k, i) => {
      s += glyph(k.a > 0 ? 'sharp' : 'flat', xx + i * 9, g.y(k.d, st));
    }),
  );
  xx += Math.abs(sig) * 9 + (sig ? 8 : 0);
  return { s, x: xx };
}

function timeSig(g, top, bot, x) {
  let s = '';
  const put = (st, lineTop) => {
    s += glyph('t' + top, x, lineTop + 10) + glyph('t' + bot, x, lineTop + 30);
  };
  if (g.clef === 'bass') put('b', g.top);
  else {
    put('t', g.top);
    if (g.clef === 'grand') put('b', g.yb);
  }
  return s;
}

function ledgers(g, d, st, x) {
  let s = '';
  const L = yy =>
    (s += `<line class="ln" x1="${x - 4}" x2="${x + 16}" y1="${yy}" y2="${yy}" style="stroke-width:1.2"/>`);
  const lo = st === 'b' ? 18 : 30,
    hi = st === 'b' ? 26 : 38;
  for (let k = lo - 2; k >= d; k -= 2) L(g.y(k, st));
  for (let k = hi + 2; k <= d; k += 2) L(g.y(k, st));
  return s;
}

/* items: [{notes:[{n, st:'t'|'b', cls, f, fcls}], dur, x}] — notes in one item share an x (chord) */
function staffSVG({
  clef = 'treble',
  sig = 0,
  items = [],
  spacing = 30,
  minW = 0,
  showAcc = 'auto',
  time = null,
  startX = null,
  bottom,
  top,
  barEvery = 0,
  labels = false,
} = {}) {
  const g = staffGeom(clef, { bottom, top });
  const head = clefsAndSig(g, sig);
  let x = startX ?? head.x + 8;
  let body = head.s;
  if (time) {
    body += timeSig(g, time[0], time[1], head.x);
    x += 22;
  }
  const xs = [];
  // With bar lines, accidentals last to the end of the bar: a note needs a sign when it differs from what
  // is in force on its line or space (the key signature, or an earlier accidental in the same bar).
  // Without bar lines (scales, chords), every note differing from the key signature shows its sign.
  let inForce = new Map();
  const place = nn => `${nn.st || ''}:${diaOf(nn.n)}`;
  const current = nn =>
    barEvery && inForce.has(place(nn)) ? inForce.get(place(nn)) : sigAccidentalFor(sig, nn.n.l);
  items.forEach((it, i) => {
    const needAcc = nn => (showAcc === 'all' ? nn.n.a !== 0 : nn.n.a !== current(nn) || !!nn.natural);
    const nAcc = (it.notes || []).filter(needAcc).length;
    if (it.x == null && nAcc) x += nAcc > 1 ? 18 : 9;
    const ix = it.x ?? x;
    xs.push(ix);
    const sorted = (it.notes || []).slice().sort((a, b) => diaOf(a.n) - diaOf(b.n));
    let prevD = -99,
      prevShift = false;
    // accidentals stagger in columns from the top note down
    const accOrder = sorted.filter(needAcc).reverse();
    const accX = new Map();
    accOrder.forEach((nn, k) => accX.set(nn, ix - 12 - (k % 2) * 9));
    sorted.forEach(nn => {
      const st = nn.st || (diaOf(nn.n) >= 28 && clef !== 'bass' ? 't' : clef === 'treble' ? 't' : 'b');
      const d = diaOf(nn.n);
      const y = g.y(d, st);
      const shift = d - prevD === 1 && !prevShift;
      prevShift = shift;
      prevD = d; // seconds: displace the upper note
      const hx = shift ? ix + 11.4 : ix;
      body += ledgers(g, d, st, ix) + (shift ? ledgers(g, d, st, ix + 11.4) : '');
      if (needAcc(nn)) {
        const nm = nn.n.a > 0 ? 'sharp' : nn.n.a < 0 ? 'flat' : 'natural';
        body += glyph(nm, accX.get(nn), y, 'gl note ' + (nn.cls || ''));
      }
      const head = it.dur === 'w' ? 'nhW' : it.dur === 'h' ? 'nhH' : 'nhB';
      body += glyph(head, hx, y, 'note ' + (nn.cls || ''));
      if (nn.f) {
        const isL = (nn.fcls || '') === 'lh' || (nn.fcls == null && st === 'b');
        const fy = isL
          ? Math.max(y + 18, (st === 'b' ? g.yB(18) : g.yT(30)) + 14)
          : Math.min(y - 12, (st === 'b' ? g.yB(26) : g.yT(38)) - 8);
        body += `<text class="fing ${nn.fcls || (isL ? 'lh' : 'rh')}" x="${ix + 6}" y="${fy}">${nn.f}</text>`;
      }
      if (labels && nn.lbl) body += `<text class="lbl" x="${ix + 6}" y="${g.h - 8}">${esc(nn.lbl)}</text>`;
    });
    if (it.fstack && sorted.length) {
      // chord fingering, low→high, stacked
      const isL = it.fcls === 'lh';
      const st = sorted[0].st || (clef === 'bass' ? 'b' : 't');
      const lowY = g.y(diaOf(sorted[0].n), st),
        highY = g.y(diaOf(sorted[sorted.length - 1].n), st);
      it.fstack.forEach((f, k) => {
        const fy = isL
          ? Math.max(lowY + 18, (st === 'b' ? g.yB(18) : g.yT(30)) + 14) + (it.fstack.length - 1 - k) * 10
          : Math.min(highY - 12, (st === 'b' ? g.yB(26) : g.yT(38)) - 8) - k * 10;
        body += `<text class="fing ${it.fcls || 'rh'}" x="${ix + 6}" y="${fy}">${f}</text>`;
      });
    }
    if (it.stem && sorted.length) {
      // stem up, single notes only
      const nn = sorted[sorted.length - 1];
      const st = nn.st || 't';
      const y = g.y(diaOf(nn.n), st);
      body += `<line class="stem" x1="${ix + 11.3}" x2="${ix + 11.3}" y1="${y - 1}" y2="${y - 34}"/>`;
    }
    (it.notes || []).forEach(nn => inForce.set(place(nn), nn.n.a));
    if (barEvery && (i + 1) % barEvery === 0) inForce = new Map();
    if (barEvery && (i + 1) % barEvery === 0 && i < items.length - 1) {
      const bx = ix + spacing / 2 + 4;
      body += `<line class="ln" x1="${bx}" x2="${bx}" y1="${g.top}" y2="${clef === 'grand' ? g.yb + 40 : g.top + 40}"/>`;
    }
    if (it.x == null) x += spacing;
  });
  const W = Math.max(minW, (xs.length ? Math.max(...xs) : x) + 30);
  const lines = staffLines(g, 2, W - 2);
  return {
    svg: `<svg class="staff" viewBox="0 0 ${W} ${g.h}" role="img" aria-label="Staff notation">${lines}${body}</svg>`,
    W,
    g,
    xs,
  };
}

/* ---------- rhythm notation on a single line ---------- */
// events: [{d: beats, rest:bool}] ; timing in quarter-beats
function rhythmSVG(events, { beats = 4, marks = [], width = 420, cur = -1, total = 0 } = {}) {
  const H = 90,
    y = 52,
    x0 = 46,
    x1 = width - 16;
  const span = x1 - x0;
  const len = total || events.reduce((a, e) => a + e.d, 0) || beats; // time on the line, in beats
  let s = `<line class="ln" x1="8" x2="${width - 6}" y1="${y}" y2="${y}"/>`;
  s += `<line class="ln" x1="8" x2="8" y1="${y - 20}" y2="${y + 20}"/>`;
  s += `<line class="ln" x1="${width - 6}" x2="${width - 6}" y1="${y - 20}" y2="${y + 20}"/>`;
  s += glyph('t' + beats, 14, y - 10) + glyph('t4', 14, y + 10);
  let t = 0;
  const pos = [];
  events.forEach((e, i) => {
    pos.push({ x: x0 + 6 + (t / len) * span, t, e, i });
    t += e.d;
  });
  // beaming: consecutive eighths within same beat
  pos.forEach((p, k) => {
    const e = p.e;
    const cls = marks[k] || (k === cur ? 'cur' : '');
    if (e.rest) {
      const name = e.d >= 4 ? 'rW' : e.d >= 2 ? 'rH' : e.d >= 1 ? 'rQ' : 'r8';
      const ry = name === 'rW' ? y - 10 : name === 'rH' ? y : name === 'rQ' ? y : y;
      s += glyph(name, p.x, ry, 'note ' + cls);
      if (e.dot) s += glyph('dot', p.x + 14, y - 5, 'note ' + cls);
      return;
    }
    const head = e.d >= 4 ? 'nhW' : e.d >= 2 ? 'nhH' : 'nhB';
    s += glyph(head, p.x, y, 'note ' + cls);
    if (e.dot) s += glyph('dot', p.x + 16, y - 3, 'note ' + cls);
    if (e.d < 4)
      s += `<line class="stem" x1="${p.x + 11.3}" x2="${p.x + 11.3}" y1="${y - 1}" y2="${y - 32}"/>`;
    if (e.d <= 0.5 && !e.beam) s += glyph('flag8', p.x + 10.6, y - 32, 'gl');
  });
  // beams: a group runs from 'start' to 'end'; b2 marks notes that also take a second (16th) beam
  pos.forEach((p, k) => {
    if (p.e.beam !== 'start') return;
    let z = k;
    while (pos[z + 1] && pos[z].e.beam !== 'end') z++;
    const q = pos[z];
    s += `<rect x="${p.x + 10.6}" y="${y - 34}" width="${q.x - p.x + 0.8}" height="4.5" class="gl"/>`;
    for (let j = k; j < z; j++)
      if (pos[j].e.b2 && pos[j + 1].e.b2)
        s += `<rect x="${pos[j].x + 10.6}" y="${y - 27}" width="${pos[j + 1].x - pos[j].x + 0.8}" height="4" class="gl"/>`;
    if (p.e.tup)
      s += `<text x="${(p.x + q.x) / 2 + 11}" y="${y - 40}" text-anchor="middle" font-size="11" font-style="italic" font-weight="700" fill="var(--ink)">${p.e.tup}</text>`;
  });
  for (let b = 1; b < len; b++) {
    const bx = x0 + (b / len) * span;
    if (b % beats === 0) s += `<line x1="${bx}" x2="${bx}" y1="${y - 20}" y2="${y + 20}" class="ln"/>`;
    else s += `<line x1="${bx + 6}" x2="${bx + 6}" y1="${y + 26}" y2="${y + 30}" class="ln"/>`;
  }
  return `<svg class="staff" viewBox="0 0 ${width} ${H}" role="img" aria-label="Rhythm">${s}</svg>`;
}

/* ---------- keyboard ---------- */
const isBlack = m => [1, 3, 6, 8, 10].includes(((m % 12) + 12) % 12);

function kbSVG({ from = 48, to = 72, marks = {}, interactive = true, cLabels = true, h = 100 } = {}) {
  while (isBlack(from)) from--;
  while (isBlack(to)) to++;
  const WW = 24,
    BW = 14,
    BH = h * 0.62;
  let whites = '',
    blacks = '',
    labels = '',
    wi = 0;
  const wx = {};
  for (let m = from; m <= to; m++)
    if (!isBlack(m)) {
      wx[m] = wi * WW;
      wi++;
    }
  const W = wi * WW;
  for (let m = from; m <= to; m++) {
    const mk = marks[m] || {};
    const cls = mk.cls || '';
    if (!isBlack(m)) {
      const x = wx[m];
      whites += `<rect class="w ${cls}" data-m="${m}" x="${x + 0.5}" y="0.5" width="${WW - 1}" height="${h - 1}" rx="2"/>`;
      if (mk.f != null) labels += fingerLabel(x + WW / 2, h - 16, 8, mk.fc || cls, mk.f);
      else if (cLabels && m % 12 === 0)
        labels += `<text class="cl" x="${x + WW / 2}" y="${h - 7}">C${m / 12 - 1}</text>`;
    } else {
      const x = wx[m - 1] + WW - BW / 2;
      blacks += `<rect class="b ${cls}" data-m="${m}" x="${x}" y="0" width="${BW}" height="${BH}" rx="1.5"/>`;
      if (mk.f != null) labels += fingerLabel(x + BW / 2, BH - 12, 7, mk.fc || cls, mk.f, 'font-size:9px');
    }
  }
  const style = `max-width:${Math.round(W * 1.7)}px;margin:0 auto`;
  return `<svg class="kb" viewBox="0 0 ${W} ${h}" style="${style}" ${interactive ? 'data-play="1"' : ''}
    role="img" aria-label="Piano keyboard">${whites}${blacks}${labels}</svg>`;
}

// a finger number in a circle on a key
function fingerLabel(cx, cy, r, cls, finger, style = '') {
  return (
    `<circle class="fc ${cls}" cx="${cx}" cy="${cy}" r="${r}"/>` +
    `<text class="fn ${cls}" x="${cx}" y="${cy}"${style ? ` style="${style}"` : ''}>${esc(finger)}</text>`
  );
}

// fit a range around a list of midis, padded to whole octaves-ish
function kbRange(midis, pad = 2, minSpan = 24) {
  let lo = Math.min(...midis) - pad,
    hi = Math.max(...midis) + pad;
  while (hi - lo < minSpan) {
    lo--;
    hi++;
  }
  return { from: lo, to: hi };
}

function flashKey(svg, m, cls = 'down', ms = 260) {
  if (!svg) return;
  const el = svg.querySelector(`[data-m="${m}"]`);
  if (!el) return;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), ms);
}

/* ---------- real music on a grand staff ----------
   Horizontal position follows time (with a minimum gap), bar lines are drawn, note heads show long
   values (whole and half notes open), accidentals follow the bar rules, clefs follow the score. */
function pieceStaffSVG({
  steps = [],
  ghost = [],
  bars = [],
  total = 0,
  sig = 0,
  time = null,
  clefs = ['t', 'b'],
  clefChanges = [],
  hl = {},
  ppb = 34,
} = {}) {
  const top0 = 44,
    gap = 52;
  const tops = [top0, top0 + 40 + gap];
  const H = tops[1] + 40 + 46;
  const clefAt = (s, t) => {
    let c = clefs[s];
    clefChanges.forEach(ch => {
      if (ch.s === s && ch.t <= t + 1e-6) c = ch.k;
    });
    return c;
  };
  const topLine = c => (c === 't' ? 38 : 26);
  const yOf = (s, d, t) => tops[s] + (topLine(clefAt(s, t)) - d) * 5;
  // header: clefs, key signature, time signature
  let body = '';
  let x = 8;
  [0, 1].forEach(s => {
    const c = clefs[s];
    body += c === 't' ? glyph('gClef', x, tops[s] + 30) : glyph('fClef', x, tops[s] + 10);
  });
  x += 34;
  [0, 1].forEach(s => {
    const c = clefs[s];
    keySigNotes(sig, c === 't' ? 'treble' : 'bass').forEach((k, i) => {
      body += glyph(k.a > 0 ? 'sharp' : 'flat', x + i * 9, tops[s] + (topLine(c) - k.d) * 5);
    });
  });
  x += Math.abs(sig) * 9 + (sig ? 8 : 0);
  if (time) {
    [0, 1].forEach(s => {
      const n = String(time[0]),
        d = String(time[1]);
      body +=
        [...n].map((ch, i) => glyph('t' + ch, x + i * 11, tops[s] + 10)).join('') +
        [...d].map((ch, i) => glyph('t' + ch, x + i * 11, tops[s] + 30)).join('');
    });
    x += 12 + 11 * Math.max(String(time[0]).length, String(time[1]).length);
  }
  const x0 = x + 10;
  // columns by time
  const cols = new Map();
  const key = t => (Math.round(t * 1000) / 1000).toFixed(3);
  const addCol = (t, n) => {
    const k = key(t);
    if (!cols.has(k)) cols.set(k, { t: +k, notes: [] });
    cols.get(k).notes.push(n);
  };
  steps.forEach((s, i) => s.notes.forEach(n => addCol(s.beat, { ...n, step: i })));
  ghost.forEach(n => addCol(n.t, { ...n, step: -1 }));
  const barSet = bars
    .slice(1)
    .filter(b => b < total - 1e-6)
    .map(b => +key(b));
  const times = [...new Set([...cols.keys()].map(Number).concat(barSet))].sort((a, b) => a - b);
  // accidentals: per bar and staff, the key signature first, then what was written
  const sigAcc = l => sigAccidentalFor(sig, l);
  let accState = new Map();
  const pos = new Map();
  let cx = x0;
  let lastT = null;
  const xBar = new Map();
  times.forEach(t => {
    const k = key(t);
    const isBar = barSet.includes(t) && !xBar.has(k);
    const col = cols.get(k);
    if (isBar) {
      cx = Math.max(cx + (lastT == null ? 0 : 8), x0 + t * ppb - 6);
      xBar.set(k, cx);
      cx += 12;
    }
    if (col) {
      // which notes need an accidental, given the bar so far
      if (isBar || bars.slice(1).some(b => Math.abs(b - t) < 1e-6)) accState = new Map();
      const needs = col.notes.map(n => {
        const sk = (n.st === 'b' ? 1 : 0) + ':' + diaOf(n.n);
        const cur = accState.has(sk) ? accState.get(sk) : sigAcc(n.n.l);
        const need = n.n.a !== cur || n.natural;
        return need;
      });
      col.notes.forEach((n, j) => {
        const sk = (n.st === 'b' ? 1 : 0) + ':' + diaOf(n.n);
        accState.set(sk, n.n.a);
        n.acc = needs[j];
      });
      const accW = col.notes.some(n => n.acc) ? 12 : 0;
      const want = x0 + t * ppb;
      cx = Math.max(want, lastT == null ? x0 : cx + 22) + accW;
      pos.set(k, cx);
      lastT = t;
      cx += 2;
    }
  });
  const W = Math.max(cx + 30, 300);
  // staff lines and the brace line
  let lines = '';
  [0, 1].forEach(s => {
    for (let i = 0; i < 5; i++)
      lines += `<line class="ln" x1="2" x2="${W - 2}" y1="${tops[s] + i * SS}" y2="${tops[s] + i * SS}"/>`;
  });
  // the system's opening and closing bar lines
  lines += `<line class="ln" x1="2" x2="2" y1="${tops[0]}" y2="${tops[1] + 40}" style="stroke-width:1.6"/>`;
  lines += `<line class="ln" x1="${W - 2}" x2="${W - 2}" y1="${tops[0]}" y2="${tops[1] + 40}"/>`;
  xBar.forEach(bx => {
    lines += `<line class="ln bar" x1="${bx}" x2="${bx}" y1="${tops[0]}" y2="${tops[1] + 40}"/>`;
  });
  clefChanges.forEach(ch => {
    const bx = (xBar.get(key(ch.t)) ?? x0 + ch.t * ppb) + 2;
    body +=
      ch.k === 't'
        ? glyph('gClef', bx, tops[ch.s] + 30, 'gl small')
        : glyph('fClef', bx, tops[ch.s] + 10, 'gl small');
  });
  const xs = steps.map(s => pos.get(key(s.beat)));
  // notes
  cols.forEach((col, k) => {
    const ix = pos.get(k);
    if (ix == null) return;
    [0, 1].forEach(s => {
      const ns = col.notes.filter(n => (n.st === 'b' ? 1 : 0) === s).sort((a, b) => diaOf(a.n) - diaOf(b.n));
      let prevD = -99,
        prevShift = false;
      let accCol = 0;
      ns.slice()
        .reverse()
        .forEach(n => {
          if (n.acc) {
            n.ax = ix - 12 - (accCol % 2) * 9;
            accCol++;
          }
        });
      ns.forEach(n => {
        const d = diaOf(n.n);
        const y = yOf(s, d, col.t);
        const shift = d - prevD === 1 && !prevShift;
        prevShift = shift;
        prevD = d;
        const hx = shift ? ix + 11.4 : ix;
        const c = clefAt(s, col.t);
        const lo = topLine(c) - 8,
          hi = topLine(c);
        for (let dd = lo - 2; dd >= d; dd -= 2)
          lines += `<line class="ln" x1="${ix - 4}" x2="${ix + 16 + (shift ? 11 : 0)}" y1="${yOf(s, dd, col.t)}" y2="${yOf(s, dd, col.t)}" style="stroke-width:1.2"/>`;
        for (let dd = hi + 2; dd <= d; dd += 2)
          lines += `<line class="ln" x1="${ix - 4}" x2="${ix + 16 + (shift ? 11 : 0)}" y1="${yOf(s, dd, col.t)}" y2="${yOf(s, dd, col.t)}" style="stroke-width:1.2"/>`;
        const cls =
          n.step < 0
            ? 'ghost'
            : hl.bad && hl.bad.has(n.step)
              ? 'bad'
              : hl.ok && hl.ok.has(n.step)
                ? 'ok'
                : hl.cur === n.step
                  ? 'cur'
                  : '';
        if (n.acc) {
          const nm =
            n.n.a > 0
              ? n.n.a > 1
                ? 'dsharp'
                : 'sharp'
              : n.n.a < 0
                ? n.n.a < -1
                  ? 'dflat'
                  : 'flat'
                : 'natural';
          body += glyph(
            GLYPHS[nm] ? nm : n.n.a > 0 ? 'sharp' : n.n.a < 0 ? 'flat' : 'natural',
            n.ax,
            y,
            'gl note ' + cls,
          );
        }
        const dur = n.d || 0;
        const head = dur >= 3.9 ? 'nhW' : dur >= 1.9 ? 'nhH' : 'nhB';
        if (dur === 0 && n.step >= 0)
          body += `<g transform="translate(${hx + 3} ${y}) scale(.68) translate(${-hx - 3} ${-y})">${glyph('nhB', hx, y, 'note ' + cls)}</g>`;
        else body += glyph(head, hx, y, 'note ' + cls);
        if (n.f && n.step >= 0) {
          const above = s === 0;
          const fy = above ? Math.min(y - 12, tops[0] - 6) : Math.max(y + 18, tops[1] + 52);
          body += `<text class="fing ${n.fcls || ''}" x="${ix + 6}" y="${fy}">${n.f}</text>`;
        }
      });
    });
  });
  return {
    svg: `<svg class="staff piece" viewBox="0 0 ${W} ${H}" role="img" aria-label="Score">${lines}${body}</svg>`,
    W,
    H,
    xs,
    x0,
    ppb,
  };
}

// ---- music/technique.js ----
/* What a scale or arpeggio run says about technique, from MIDI timing and loudness alone.
   The app cannot see your hands, but some habits leave clear traces:
     hands not together  one hand consistently later than the other on the same beat
     late crossings      the note after a thumb-under (or a finger crossing over the thumb) comes late
     accented thumb      thumb notes louder than the others (the thumb drops instead of playing)
   One run proves little, so advice appears only when a trace shows up in most of the last few runs. */

const CROSSINGS = new Set(['3>1', '4>1', '1>3', '1>4']);
const LIMITS = { lag: 30, cross: 25, accent: 1.18 }; // ms, ms, loudness ratio

// a straight line through (beat, time) points; returns each point's distance from it in ms
function residuals(points) {
  const xs = points.map(p => p.beat);
  const ys = points.map(p => p.t);
  const mx = meanOf(xs);
  const my = meanOf(ys);
  let num = 0;
  let den = 0;
  xs.forEach((x, i) => {
    num += (x - mx) * (ys[i] - my);
    den += (x - mx) ** 2;
  });
  const b = den ? num / den : 0;
  return points.map(p => p.t - (my + b * (p.beat - mx)));
}

// one run: {lag:{hand, ms}, cross:{hand, ms}, accent:{hand, ratio}} for whatever stands out (or null)
function techniqueReport(an, drill) {
  if (!drill || !drill.even || drill.steps.length < 8 || !an) return null;
  const hands = { rh: [], lh: [] };
  for (const r of an.res) {
    if (!r.ok || !r.notes) continue;
    const s = drill.steps[r.i];
    s.notes.forEach((x, j) => {
      const hit = r.notes.find(n => n.m === s.midis[j]);
      if (hit && hands[x.fcls])
        hands[x.fcls].push({ i: r.i, beat: s.beat, t: hit.t, vel: hit.vel, f: +x.f || 0 });
    });
  }
  const out = {};
  // hands together: compare the two hands on the same steps
  if (hands.rh.length >= 6 && hands.lh.length >= 6) {
    const lh = new Map(hands.lh.map(p => [p.i, p.t]));
    const lags = hands.rh.filter(p => lh.has(p.i)).map(p => lh.get(p.i) - p.t);
    const m = median(lags);
    if (lags.length >= 6 && Math.abs(m) >= LIMITS.lag)
      out.lag = { hand: m > 0 ? 'lh' : 'rh', ms: Math.round(Math.abs(m)) };
  }
  for (const hand of ['rh', 'lh']) {
    const pts = hands[hand];
    if (pts.length < 8 || pts.some(p => !p.f)) continue;
    const res = residuals(pts);
    const cross = [];
    const other = [];
    pts.forEach((p, k) => (k && CROSSINGS.has(`${pts[k - 1].f}>${p.f}`) ? cross : other).push(res[k]));
    if (cross.length >= 2 && other.length >= 4) {
      const late = meanOf(cross) - meanOf(other);
      if (late >= LIMITS.cross && (!out.cross || late > out.cross.ms))
        out.cross = { hand, ms: Math.round(late) };
    }
    const thumb = pts.filter(p => p.f === 1).map(p => p.vel);
    const rest = pts.filter(p => p.f !== 1).map(p => p.vel);
    if (thumb.length >= 3 && rest.length >= 4 && meanOf(rest) > 0) {
      const ratio = meanOf(thumb) / meanOf(rest);
      if (ratio >= LIMITS.accent && (!out.accent || ratio > out.accent.ratio))
        out.accent = { hand, ratio: Math.round(ratio * 100) / 100 };
    }
  }
  return out;
}

const HAND = { rh: 'right hand', lh: 'left hand' };

// advice from the last few runs: {lesson, text} for the most persistent trace, or null
function techniqueAdvice(history) {
  const recent = (history || []).slice(-4);
  if (recent.length < 3) return null;
  const seen = kind => recent.filter(r => r && r[kind]).length >= 3;
  const last = kind => recent.filter(r => r && r[kind]).pop()[kind];
  if (seen('lag')) {
    const { hand, ms } = last('lag');
    return {
      lesson: 'together',
      text: `The ${HAND[hand]} is about ${ms} ms behind the other. Aim both thumbs at the same moment; play slower until the hands land as one.`,
    };
  }
  if (seen('cross')) {
    const { hand, ms } = last('cross');
    return {
      lesson: 'thumb',
      text: `In the ${HAND[hand]}, the notes where the thumb passes under (or a finger crosses over) come about ${ms} ms late. Move the thumb under early, while the 2nd and 3rd fingers play, so it is already waiting over its key.`,
    };
  }
  if (seen('accent')) {
    const { hand } = last('accent');
    return {
      lesson: 'thumb',
      text: `Thumb notes in the ${HAND[hand]} are louder than the rest. Let the thumb play from close to the key with the same small motion as the fingers, not a drop.`,
    };
  }
  return null;
}

// ---- learn/drill.js ----
/* What a drill is made of: the notes to play (steps), the meter, the tempo unit and the count-in,
   built from an item of the curriculum and the plan for the next rep. */

function buildDrill(def, plan) {
  const k = def.kind;
  const hand = plan.hand || 'ht';
  if (k === 'scale') {
    const r = scaleSteps(def.type, def.key, hand, 2, 2);
    return { ...r, npb: 2, even: true, beats: r.steps.length / 2, meter: [4, 4], unit: 1, clicks: 4 };
  }
  if (k === 'arp') {
    const r = arpSteps(def.type === 'major' ? 'major' : 'minor', def.key, hand, 2);
    return { ...r, npb: 2, even: true, beats: r.steps.length / 2, meter: [4, 4], unit: 1, clicks: 4 };
  }
  if (k === 'read') {
    const real = READ_UNITS[def.unit] && READ_UNITS[def.unit].real;
    if (real) {
      const r = realExcerpt(real);
      if (r) return { ...r, fresh: true };
    }
    // no excerpt found (rare): a generated line of the same kind instead
    const r = readingLine(real ? (real === 'ht' ? 'r12' : 'r5') : def.unit);
    return {
      ...r,
      npb: 1,
      even: true,
      beats: r.steps.length,
      meter: [4, 4],
      unit: 1,
      clicks: 4,
      fresh: true,
      barEvery: 4,
    };
  }
  if (k === 'rhythm') {
    const U = RHY_UNITS[def.unit];
    const meter = pick(U.meters);
    const bars = [rhythmBar(U.level, meter), rhythmBar(U.level, meter)];
    const events = bars.flat();
    const steps = rhythmSteps(events);
    return {
      kind: 'rhythm',
      events,
      bars,
      steps,
      beats: meter * 2,
      meter: [meter, 4],
      unit: 1,
      clicks: meter,
      fresh: true,
      any: true,
    };
  }
  if (k === 'pattern') {
    const r = patternSteps(PAL_BY_ID[def.pal]);
    const P = PAL_BY_ID[def.pal];
    return { ...r, even: true, beats: r.beats, meter: [P.meter, 4], unit: 1, clicks: P.meter, spacing: 40 };
  }
  if (k === 'section' || k === 'full') {
    const pid = def.pid;
    let a = k === 'full' ? 0 : def.sec.a;
    const z = k === 'full' ? Library.get(pid).nb : def.sec.z;
    // with the metronome, hands together: start a bar early to practice the join
    if (k === 'section' && a > 0 && plan.mode === 'tempo' && hand === 'ht') a -= 1;
    const r = Library.steps(pid, a, z, hand);
    const m = Library.meter(pid, a);
    return {
      ...r,
      piece: true,
      a,
      z,
      beats: r.total,
      meter: [m.n, m.d],
      unit: m.unit,
      clicks: m.clicks > 8 ? m.clicks / 2 : m.clicks,
      lead: a < (def.sec ? def.sec.a : 0) ? Library.bars(pid)[def.sec.a] - Library.bars(pid)[a] : 0,
    };
  }
  return null;
}

// ---- learn/improv.js ----
/* Improvising over a backing: the loop, and how often strong-beat notes land on chord tones. */

/* ---------- improvisation over a backing loop ---------- */
const Improv = {
  start(P, root, onEvent) {
    const Pal = PAL_BY_ID[P.def.pal];
    const chords = palChords(Pal);
    const scale = mms(Pal.scale);
    const pcs = new Set(scale.map(m => ((m % 12) + 12) % 12));
    const strong = Pal.meter === 4 ? [0, 2] : [0];
    const bpm = Pal.bpm;
    let timer = null,
      nextBar = 0,
      barIdx = 0,
      cur = 0;
    const bars = [],
      played = [];
    let ui = [];
    let activeMs = 0,
      lastNote = 0;
    const stage = root.querySelector('.pl-stage');
    const go = root.querySelector('#plGo');
    const info = root.querySelector('#plInfo');
    const chordChips = chords.map((c, i) => `<span class="chip" data-c="${i}">${esc(c.n)}</span>`).join('');
    stage.innerHTML = `<div class="improv-chords" id="ipChords">${chordChips}</div>
      <p class="small improv-how">${esc(Pal.how)}</p>`;
    const paint = () => {
      const marks = {};
      for (let k = 36; k <= 88; k++) if (pcs.has(k % 12)) marks[k] = { cls: 'tone' };
      const ch = chords[cur];
      for (let k = 36; k <= 88; k++) if (ch.pcs.has(k % 12)) marks[k] = { cls: 'rh', f: '•' };
      const kb = root.querySelector('#plKb');
      if (kb) kb.innerHTML = kbSVG({ from: 48, to: 84, marks, h: 110 });
      root
        .querySelectorAll('#ipChords [data-c]')
        .forEach((el, i) => el.setAttribute('aria-pressed', String(i === cur)));
    };
    const scheduleBar = (t, ch) => {
      const spb = 60 / bpm;
      const meter = Pal.meter;
      if (Pal.pat === 'oompah') {
        AudioEngine.note(ch.bass, t, spb * 2.5, 0.55);
        AudioEngine.chord(ch.tones, t + spb, spb * 2, 0.38);
      } else if (Pal.pat === 'arp') {
        const seq = [ch.bass, ...ch.tones, ch.tones[1], ch.tones[0], ch.tones[2], ch.tones[1]];
        seq.forEach((x, i) => AudioEngine.note(x, t + (i * spb) / 2, spb * 1.5, i === 0 ? 0.5 : 0.32));
      } else if (Pal.pat === 'bells') {
        AudioEngine.chord([ch.bass, ch.bass + 12], t, spb * 3, 0.6);
        AudioEngine.chord(ch.tones, t, spb * 2, 0.4);
        AudioEngine.chord(ch.tones, t + spb * 2, spb * 2, 0.32);
      } else {
        AudioEngine.note(ch.bass, t, spb * meter, 0.45);
        AudioEngine.chord(ch.tones, t, spb * meter, 0.3);
      }
    };
    const analyze = () => {
      const now = performance.now();
      const spbMs = 60000 / bpm;
      let land = 0,
        ct = 0,
        n = 0;
      bars
        .filter(b => b.end < now)
        .forEach(b => {
          n++;
          strong.forEach(sb => {
            const bt = b.start + sb * spbMs;
            const hit = played.filter(p => Math.abs(p.t - bt) < 150);
            if (hit.length) {
              land++;
              if (hit.some(p => b.pcs.has(p.m % 12))) ct++;
            }
          });
        });
      return { land, ct, bars: n, pct: land ? Math.round((ct / land) * 100) : null };
    };
    const paintInfo = () => {
      const a = analyze();
      if (info)
        info.textContent =
          `${fmtTime(activeMs / 1000)} played` + (a.pct != null ? ` · ${a.pct}% on chord tones` : '');
    };
    const stop = silent => {
      if (!timer) return;
      clearInterval(timer);
      timer = null;
      ui.forEach(clearTimeout);
      ui = [];
      go.textContent = 'Start backing';
      const a = analyze();
      const counted = activeMs > 0;
      const res = counted ? recordImprov(P.id, activeMs, a.pct, a.bars) : null;
      activeMs = 0;
      bars.length = 0;
      played.length = 0;
      Log.ev('improv stop', { pct: a.pct, bars: a.bars, res });
      if (!silent) {
        const it = itemState(P.id) || {};
        const m = root.querySelector('#plMsg');
        if (m) {
          m.className = 'feedback pl-msg ' + (res === 'done' ? 'ok' : '');
          m.textContent =
            res === 'done'
              ? 'Integrated: you can improvise in this style. New palette next.'
              : counted
                ? `Saved. ${criterion(P.id)}.`
                : 'Practice only: connect your piano to count the time.';
        }
        onEvent({ type: 'improv', res, mins: it.mins });
      }
      root.querySelector('#plCrit').textContent = criterion(P.id);
    };
    const start = () => {
      AudioEngine.ensure();
      lastNote = 0; // time between two sittings is not playing time
      go.textContent = 'Stop backing';
      nextBar = AudioEngine.now() + 0.2;
      barIdx = 0;
      Log.ev('improv start', { pal: Pal.id, bpm });
      const tick = () => {
        while (nextBar < AudioEngine.ctx.currentTime + 0.3) {
          const i = barIdx % chords.length;
          const ch = chords[i];
          scheduleBar(nextBar, ch);
          const st = AudioEngine.toPerf(nextBar);
          bars.push({ start: st, end: st + (60000 / bpm) * Pal.meter, pcs: ch.pcs });
          ui.push(
            setTimeout(
              () => {
                cur = i;
                if (!P.dead) {
                  paint();
                  paintInfo();
                }
              },
              Math.max(0, (nextBar - AudioEngine.ctx.currentTime) * 1000),
            ),
          );
          if (ui.length > 24) ui.splice(0, 12);
          nextBar += (60 / bpm) * Pal.meter;
          barIdx++;
        }
        if (activeMs >= 3 * 60000 && !P.goalSent) {
          P.goalSent = true;
          onEvent({ type: 'goal', why: 'time' });
        }
      };
      timer = setInterval(Log.guard('improv tick', tick), 60);
      tick();
    };
    P.offs.push(
      Input.on(ev => {
        if (!timer) return;
        played.push({ t: ev.t, m: ev.m });
        // only playing on the piano counts toward the minutes (the screen keys are for trying it out)
        if (ev.src !== 'touch') {
          const now = Date.now();
          if (lastNote && now - lastNote < 8000) activeMs += now - lastNote;
          lastNote = now;
        }
        const e = root.querySelector(`#plKb [data-m="${ev.m}"]`);
        if (e) {
          e.classList.add('held');
          setTimeout(() => e.classList.remove('held'), 250);
        }
      }),
    );
    go.hidden = false;
    go.textContent = 'Start backing';
    go.onclick = Log.guard('improv go', () => (timer ? stop() : start()));
    root.querySelector('#plHear').hidden = true;
    root.querySelector('#plMsg').textContent = Input.live
      ? 'Start the backing, then improvise with your right hand.'
      : 'Start the backing and improvise. Connect your piano to count the time.';
    root.querySelector('#plCue').innerHTML =
      `<span>Aim</span> Land on a chord tone (blue keys) on ${strong.length > 1 ? 'beats 1 and 3' : 'beat 1'}.
        Gold keys are the scale.`;
    paint();
    P.improv = { stop: () => stop(true) };
  },
};

// ---- learn/answer.js ----
/* Listening for the answer to a theory question, grouped the way you play it.
   For chords, keys pressed while others are still held (or within a moment) belong together, and
   releasing every key ends the chord; for melodies, every note counts on its own. The answer is complete
   when there are enough groups, or as soon as it is clearly wrong. */

const CHORD_GAP_MS = 1500; // a chord also ends after this long without a new key
const RELEASE_MS = 250; // ...or this long after every key was released

// done(groups, early) is called once; early is true when the answer went wrong before it was complete
function collectAnswer(q, done) {
  const groups = [];
  let cur = null;
  let gapT = 0;
  let finished = false;
  const chords = answersInChords(q);
  const finish = early => {
    if (finished) return;
    stop();
    done(groups, early);
  };
  const after = () => {
    if (wrongSoFar(q, groups)) return finish(true);
    if (groups.length >= answerSize(q)) finish(false);
  };
  const close = () => {
    clearTimeout(gapT);
    if (!cur || finished) return;
    groups.push([...new Set(cur.notes)].sort((a, b) => a - b));
    cur = null;
    after();
  };
  const onNote = Log.guard('answer note', ev => {
    if (finished) return;
    if (!chords) {
      groups.push([ev.m]);
      return after();
    }
    // a fresh attack after every key was released starts the next chord
    const othersHeld = [...Input.held.keys()].some(m => m !== ev.m);
    if (cur && !othersHeld && ev.t - cur.last > 150) close();
    if (finished) return;
    if (!cur) cur = { notes: [] };
    cur.notes.push(ev.m);
    cur.last = ev.t;
    clearTimeout(gapT);
    gapT = setTimeout(close, CHORD_GAP_MS);
  });
  const onOff = Log.guard('answer off', ev => {
    if (finished || !chords || !cur || ev.m == null || Input.held.size) return;
    clearTimeout(gapT);
    gapT = setTimeout(() => !Input.held.size && close(), RELEASE_MS);
  });
  const offs = [Input.on(onNote), Input.onOff(onOff)];
  function stop() {
    finished = true;
    clearTimeout(gapT);
    offs.forEach(f => f());
  }
  return { stop, groups };
}

// ---- views/drillinfo.js ----
/* About a drill: its short name, the (i) panel with where it stands, and how the stages work. Shared by
   the practice screen, the skills screen and the players. */

function shortTitle(d) {
  if (!d) return '';
  if (d.kind === 'section') return `${d.title} §${d.k + 1}`;
  if (d.kind === 'full') return `${d.title} (whole)`;
  if (d.kind === 'pattern') return d.title.split(':')[0] + ' pattern';
  if (d.kind === 'improv') return d.title.split(':')[0] + ' improv';
  return d.title;
}

function howSheet() {
  openSheet(
    `<div class="sheethead"><h2 class="h2">How it works</h2>${closeBtn}</div>
    <div class="prose small">
      <p><b>The goal is unconscious competence</b>: playing where the notes and movements run by themselves,
        so your attention is free for the music. DaCapo is built around the practice methods with the
        strongest evidence for getting there.</p>
      <p><b>One focus a week, a little of everything.</b> DaCapo suggests a focus for the week (your weakest
        area that matters to you, or one that has waited); you can keep it or choose another. Most of each
        session goes to it. The other areas get a few minutes of upkeep, so nothing fades. Each drill comes
        back session after session until it is integrated; consolidation happens between sessions, during
        sleep, so spreading the work over days beats one long push.</p>
      <p><b>Stages.</b> <i>Learning</i>: slowly, in wait mode, where the app waits for the right notes
        (hands separately when needed; key hints fade after a clean run). <i>Building speed</i> (note reading
        and theory): the same, with a time goal per note or per answer that tightens as you reach it.
        <i>Building tempo</i>: with the metronome; two clean runs out of three raise the tempo about 5%, and
        wrong notes lower it 10%. If you play steadily faster than the click, that becomes your tempo.
        <i>Checking</i>: the goal, cold, as the first thing you play that day. Right on two different days
        means it is integrated.</p>
      <p><b>When something stalls,</b> the approach changes instead of repeating the same thing: back to wait
        mode with the keys shown, one hand alone, an easier goal for the day, or (in theory) the explanation
        again with the answer shown sooner.</p>
      <p><b>Reviews.</b> Integrated items come back for one cold run after 3, 7, 15, 30 and 60 days, then
        every 120 days. If one slipped, it goes back a step, which usually takes a day or two.</p>
      <p><b>A practice day</b> runs from 4 in the morning to 4 the next morning, so a late session that goes
        past midnight still counts as one day.</p>
      <p><b>What counts.</b> Only playing on a real piano (MIDI, or the microphone for single notes). The
        on-screen keys are for trying things out. Timing is judged against your own steady tempo; uneven
        timing alone never counts as a messy run. Steadiness has its own place in your skills.</p>
      <p><b>Your pieces</b> are split into short sections. Each section is learned hands separately, then
        together, then brought to tempo starting one bar early so the joins are practiced too. Pieces come
        up when they are your focus, when you mark them for daily practice, or in a piece session.</p>
    </div>`,
    null,
    { label: 'How it works' },
  );
}

const DRILL_NOTES = {
  scale: `Keep the fingering shown fixed: the same fingers every time is what makes it automatic.
    Target: two notes per click at the target tempo, both hands together, two octaves up and down.`,
  read: `Read from the staff, not the keyboard: no key hints here (one appears if you are stuck for a
    few seconds). Find each note from the nearest landmark: middle C, treble G, bass F, and the C's.`,
};
DRILL_NOTES.arp = DRILL_NOTES.scale;

// the (i) panel of a drill: what it is, where it stands, recent days
function aboutDrill(id) {
  const d = itemDef(id);
  const it = itemState(id);
  if (!d) return;
  const piece = d.pid ? Library.get(d.pid) : null;
  const recent = ((it && it.log) || []).slice(-10).reverse();
  const edition = piece
    ? `<p class="small">${esc((COMPOSERS[piece.c] || {}).n || '')}${piece.y ? ', ' + piece.y : ''}.
         Edition: ${esc(piece.lic || '')}${piece.by ? ', typeset by ' + esc(piece.by) : ''} (Mutopia Project).
         The notation here is simplified: spacing shows timing, open note heads are half and whole notes.
         <a href="${scoreUrl(piece)}" target="_blank" rel="noopener">Full score</a>
         · <a href="${listenUrl(piece)}" target="_blank" rel="noopener">Listen</a></p>`
    : '';
  const dayRow = h => `<div class="row between small">
    <span>${esc(h.d)}</span>
    <span>${h.reps} reps · ${h.clean} ${d.kind === 'theory' ? 'right' : 'clean'}${h.bpm ? ' · best ♩ ' + h.bpm : ''}</span>
  </div>`;
  openSheet(
    `<div class="sheethead"><h2 class="h2">${esc(shortTitle(d))}</h2>${closeBtn}</div>
     ${d.about ? `<p>${esc(d.about)}</p>` : ''}
     ${d.use ? `<p class="small"><b>Where it helps:</b> ${esc(d.use)}</p>` : ''}
     ${DRILL_NOTES[d.kind] ? `<p class="small">${DRILL_NOTES[d.kind]}</p>` : ''}
     ${edition}
     <div class="stack" style="gap:4px">
       <span class="eyebrow">Where it stands</span>
       <p><b>${esc(STAGE_TXT[it ? it.stage : ''] || 'Not started')}</b> · ${esc(criterion(id))}</p>
     </div>
     ${
       recent.length
         ? `<div class="stack" style="gap:4px">
              <span class="eyebrow">Recent days</span>${recent.map(dayRow).join('')}
            </div>`
         : ''
     }
     <button class="btn sm ghost" type="button" id="adHow" style="align-self:flex-start">How stages work</button>`,
    sheet => {
      $('#adHow', sheet).onclick = howSheet;
    },
    { label: 'About this drill' },
  );
}

// ---- learn/quiz.js ----
/* The theory player: a question, you answer by playing, then the next.
   What you play is grouped into notes or chords by learn/answer.js. A wrong answer is shown and played,
   with what you played instead. */

const HINT_AFTER_MS = 6000;
const GUIDED_HINT_MS = 1500; // after a stall: the answer appears soon, to watch and copy
const NEXT_AFTER = { right: 1600, wrong: 4200 };

const Quiz = {
  mount(root, { id, role = 'focus', onEvent = () => {} }) {
    const def = itemDef(id);
    const U = THEORY_BY_ID[def.unit];
    const Q = {
      phase: 'idle',
      plan: null,
      q: null,
      listen: null,
      tAsk: 0,
      timers: [],
      dead: false,
      held: false,
      n: 0,
    };
    const $q = s => root.querySelector(s);
    const log = (m, d) => Log.ev('quiz ' + m, Object.assign({ id }, d || {}));
    const later = (fn, ms) => Q.timers.push(setTimeout(() => !Q.dead && fn(), ms));
    const clearTimers = () => {
      Q.timers.forEach(clearTimeout);
      Q.timers = [];
    };
    const speller = spellerFor(0);
    const noteName = m => nameOf(speller(m), false);

    root.innerHTML = `
      <div class="player card quiz" data-kind="theory">
        <div class="pl-head">
          <div class="pl-title"><b>${esc(def.title)}</b><span class="small">${esc(def.sub)}</span></div>
          <button class="iconbtn" type="button" id="plAbout" aria-label="About this unit" title="About this unit">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
          </button>
        </div>
        <div class="pl-stagebar"><span class="pill" id="plStage"></span><span class="small" id="plCrit"></span></div>
        <div class="quiz-intro" id="qzIntro" hidden></div>
        <div class="quiz-q">
          <div class="quiz-prompt" id="qzPrompt"></div>
          <div class="small" id="qzSub"></div>
        </div>
        <div class="staffwrap" id="qzStaff"></div>
        <div class="feedback pl-msg" id="plMsg" aria-live="polite"></div>
        <div class="cue" id="plCue"></div>
        <div class="kbwrap scrollx" id="plKbWrap"><div id="plKb"></div></div>
        <div class="st-bar pl-bar">
          <button class="iconbtn" type="button" id="plHear" aria-label="Hear it" title="Hear it">
            <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
          </button>
          <span class="small" id="plInfo"></span>
          <button class="btn cover sm" type="button" id="plGo">Skip</button>
        </div>
      </div>`;
    const msg = (t, cls = '') => {
      const e = $q('#plMsg');
      e.className = 'feedback pl-msg ' + cls;
      e.textContent = t;
    };

    /* ---------- painting ---------- */
    function paintHead() {
      const it = itemState(id) || {};
      const st = $q('#plStage');
      st.textContent = Q.plan.cold ? 'Cold check' : role === 'review' ? 'Review' : STAGE_TXT[it.stage] || '';
      st.className = 'pill ' + (it.stage === 'done' ? 'ok' : Q.plan.cold || role !== 'focus' ? 'brass' : '');
      $q('#plCrit').textContent = criterion(id);
      $q('#plCue').innerHTML =
        `<span>${Q.plan.cold ? 'Cold check' : 'Why'}</span> ${esc(Q.plan.cold ? Q.plan.label : U.use)}`;
      $q('#plInfo').textContent = Q.plan.pace ? `Goal ${(Q.plan.pace / 1000).toFixed(1)} s per answer` : '';
    }
    // the answer on the staff (shown after answering, or as a hint)
    function paintStaff(show) {
      const box = $q('#qzStaff');
      if (!show) {
        box.innerHTML = '';
        return;
      }
      const groups = Array.isArray(show[0])
        ? show
        : Q.q.kind === 'seq' || Q.q.kind === 'pair'
          ? show.map(n => [n])
          : [show];
      const items = groups.map(g => ({ notes: g.map(n => ({ n, st: n.o >= 4 ? 't' : 'b', cls: 'ok' })) }));
      box.innerHTML = `<div style="max-width:520px;margin:0 auto">${staffSVG({ clef: 'grand', sig: 0, items, spacing: 34, minW: 260, top: 30, bottom: 30 }).svg}</div>`;
    }
    function paintKb(marked = []) {
      const marks = {};
      marked.forEach(m => (marks[m] = { cls: 'rh' }));
      $q('#plKb').innerHTML = kbSVG({ from: 48, to: 84, marks, h: 96 });
    }

    /* ---------- one question ---------- */
    function ask() {
      clearTimers();
      Q.plan = planFor(id);
      Q.q = makeQuestion(def.unit, Q.q);
      Q.hinted = false;
      if (Q.listen) Q.listen.stop();
      Q.listen = collectAnswer(Q.q, groups => answer(check(Q.q, groups).ok, groups));
      Q.phase = 'ask';
      Q.tAsk = performance.now();
      paintHead();
      $q('#qzPrompt').textContent = Q.q.prompt;
      $q('#qzSub').textContent = Q.q.sub;
      $q('#plGo').textContent = 'Skip';
      paintStaff(null);
      paintKb();
      msg(Q.plan.cold ? 'First try today: no hints.' : 'Play your answer.');
      if (Q.plan.hints) later(hint, (itemState(id) || {}).guided > 0 ? GUIDED_HINT_MS : HINT_AFTER_MS);
      log('ask', { prompt: Q.q.prompt, cold: Q.plan.cold });
    }
    function hint() {
      if (Q.phase !== 'ask') return;
      Q.hinted = true;
      paintStaff(Q.q.show);
      paintKb(Q.q.play.flat());
      msg(`Hint: ${Q.q.explain}`);
    }

    /* ---------- listening ---------- */
    // keys light up as you play; after an answer is shown, any key moves on
    const onNote = Log.guard('quiz note', ev => {
      if (Q.dead || Q.held) return;
      if (Q.phase === 'ask') flashKey($q('#plKb svg'), ev.m, 'ok', 160);
      else if (Q.phase === 'shown' && performance.now() - Q.shownAt > 800) ask();
    });

    /* ---------- the answer ---------- */
    function describe(groups) {
      if (answersInChords(Q.q))
        return groups
          .map(g =>
            g.length >= 3
              ? (detectChord(g, speller) || {}).name || g.map(noteName).join('–')
              : g.map(noteName).join('–'),
          )
          .join(', ');
      return groups.map(g => noteName(g[0])).join(' – ');
    }
    function answer(ok, groups = []) {
      if (Q.phase !== 'ask') return;
      clearTimers();
      Q.listen.stop();
      const ms = Math.round(performance.now() - Q.tAsk);
      Q.phase = 'shown';
      Q.shownAt = performance.now();
      Q.n++;
      const chords = answersInChords(Q.q);
      // a microphone hears one note at a time: chords cannot count from it
      const valid = Input.live && Input.mode !== 'touch' && !(chords && Input.mode === 'mic');
      const right = ok && !Q.hinted;
      const out = recordAnswer(id, { ok: right, ms, valid });
      paintStaff(Q.q.show);
      if (ok) {
        msg(
          `${Q.hinted ? 'Right, with the hint' : 'Right'}: ${Q.q.explain}${out.msg ? ' ' + out.msg : ''}`,
          'ok',
        );
      } else {
        paintKb(Q.q.play.flat());
        const what = groups.length ? `You played ${describe(groups)}.` : 'Skipped.';
        msg(`${what} ${Q.q.explain}${out.msg ? ' ' + out.msg : ''}`, 'bad');
        playAnswer();
      }
      $q('#plGo').textContent = 'Next';
      if (out.change === 'stall') showIntro();
      paintHead();
      log('answer', { ok, hinted: Q.hinted, ms, valid, change: out.change });
      onEvent({ type: 'rep', r: { valid, clean: right, mode: 'quiz' }, out });
      if (!Q.held) later(ask, out.change ? NEXT_AFTER.wrong : right ? NEXT_AFTER.right : NEXT_AFTER.wrong);
    }
    function playAnswer() {
      const t = AudioEngine.now() + 0.05;
      const gap = answersInChords(Q.q) ? 0.9 : 0.42;
      Q.q.play.forEach((x, i) =>
        Array.isArray(x)
          ? AudioEngine.chord(x, t + i * gap, gap * 0.95, 0.5)
          : AudioEngine.note(x, t + i * gap, gap * 1.6, 0.55),
      );
    }

    /* ---------- controls ---------- */
    $q('#plGo').onclick = Log.guard('quiz next', () => {
      if (Q.phase === 'ask') {
        log('skip');
        return answer(false);
      }
      ask();
    });
    $q('#plHear').onclick = Log.guard('quiz hear', () => {
      AudioEngine.ensure();
      // before answering, hearing it is a hint (allowed while learning)
      if (Q.phase === 'ask') {
        if (!Q.plan.hints) return msg('Answer first; then you can hear it.');
        Q.hinted = true;
      }
      playAnswer();
    });
    $q('#plAbout').onclick = () => aboutDrill(id);
    // what the unit is about, above the questions: the first time, and again after a stall
    function showIntro() {
      const intro = $q('#qzIntro');
      intro.hidden = false;
      intro.innerHTML = `<b>${esc(U.t)}</b><p>${esc(U.about)}</p>`;
    }
    const it = itemState(id);
    if (!it || !it.reps) showIntro();
    const offs = [Input.on(onNote)];
    Quiz.debug = Q; // for automated tests
    ask();
    log('mounted', { role, stage: (itemState(id) || {}).stage });
    return {
      get phase() {
        return Q.phase;
      },
      get plan() {
        return Q.plan;
      },
      hold(on) {
        Q.held = on;
        if (on) clearTimers();
      },
      destroy() {
        if (Q.dead) return;
        Q.dead = true;
        clearTimers();
        if (Q.listen) Q.listen.stop();
        offs.forEach(f => f());
        log('destroyed');
      },
    };
  },
};

// ---- learn/lessons.js ----
/* Body and hands: short notes on how to play, shown where they matter.
   The app cannot see you, so these are guidance, not graded. They follow mainstream piano pedagogy
   (natural alignment, arm weight, freedom from tension); a teacher who can watch you is still the best
   check. None of it is medical advice: if playing hurts, stop. */

const LESSONS = [
  {
    id: 'sitting',
    t: 'Sitting at the piano',
    cue: 'Forearms level with the keys, feet flat, sit on the front half of the bench.',
    text: [
      'Set the bench height so your forearms are level with the keys or slightly above them, and sit far enough back that your elbows are a little in front of your body.',
      'Sit on the front half of the bench with both feet flat, and lean slightly forward from the hips. Your weight rests on the bench and your feet, not on your arms.',
    ],
  },
  {
    id: 'hand',
    t: 'Hand shape',
    cue: 'Let the hand keep the gentle curve it has when your arm hangs at your side.',
    text: [
      'Let your arm hang loosely at your side: the curve your fingers take is the shape to play with. Place that shape on the keys without flattening or clawing it.',
      'Play on the fleshy pad near the fingertip; the thumb plays on its outer corner. Keep the knuckles from collapsing, but never stiffen them to hold the shape.',
    ],
  },
  {
    id: 'release',
    t: 'Weight and release',
    cue: 'Let the key go down with arm weight, then release: no pressing after the note sounds.',
    text: [
      'Sound comes from the speed of the key going down, not from pressing it into the bottom. Play with the natural weight of the arm, then release at once: the key stays down with almost no effort.',
      'Check now and then: are your shoulders down? Can you wiggle the wrist while holding a note? If not, you are holding tension that will slow you down and tire you.',
    ],
  },
  {
    id: 'thumb',
    t: 'The thumb in scales',
    cue: 'Move the thumb under early and quietly, while the other fingers play.',
    text: [
      'The thumb starts moving under the hand as soon as it has played, gliding along close to the keys while the 2nd and 3rd fingers play, so it arrives over its next key early instead of jabbing at the last moment.',
      'Let the elbow drift slightly away from the body and the hand travel smoothly along the keyboard; keep the wrist level and avoid twisting it sideways. Coming back, the fingers cross over the thumb with the same quiet, early motion.',
    ],
  },
  {
    id: 'together',
    t: 'Hands together',
    cue: 'Listen for one sound from both hands, not two close together.',
    text: [
      'When both hands play a scale together, the two thumbs cross at different moments, which makes one hand want to rush or wait. Practice slowly enough to hear each pair of notes as one sound.',
      'If one hand keeps lagging, play that hand alone for a few runs, then together again at a slower tempo.',
    ],
  },
  {
    id: 'arpeggio',
    t: 'Arpeggios: let the arm travel',
    cue: 'Let the elbow lead along the keyboard; the hand follows without stretching.',
    text: [
      'An arpeggio covers too much keyboard for the fingers alone. Let the forearm and elbow carry the hand along, so each finger arrives above its key instead of stretching for it.',
      'A small rotation of the forearm helps the thumb pass under; the wrist stays loose and roughly level.',
    ],
  },
  {
    id: 'rotation',
    t: 'Forearm rotation',
    cue: 'Small turns of the forearm, like turning a door handle, do the work in broken chords.',
    text: [
      'In patterns that alternate between thumb and fingers (broken chords, Alberti bass, the left-hand patterns of nocturnes and waltzes), a small rotation of the forearm does much of the work, so the fingers do not have to lift and strike.',
      'Keep the rotation small and relaxed; the hand stays balanced over the key it is playing.',
    ],
  },
  {

    text: [

      'Look ahead to where you are going, not at where you are. Practicing the leap slowly with eyes closed builds the feel for the distance.',
    ],
  },
  {

    text: [

      'Melody notes can be a little louder than the accompaniment: let more arm weight into the melody finger and keep the others light.',
    ],
  },
];

const LESSON_BY = Object.fromEntries(LESSONS.map(l => [l.id, l]));

// which notes fit which kind of drill, most useful first
const FOR_KIND = {
  scale: ['thumb', 'release', 'together', 'hand', 'sitting'],
  arp: ['arpeggio', 'thumb', 'release', 'hand'],
  section: ['tone', 'leaps', 'rotation', 'release', 'sitting'],
  full: ['tone', 'release', 'leaps'],
  pattern: ['rotation', 'leaps', 'release'],
  read: ['sitting', 'hand'],
};

// one note for a kind of drill, rotating day by day
function lessonFor(kind, dayNumber) {
  const ids = FOR_KIND[kind];
  return ids ? LESSON_BY[ids[dayNumber % ids.length]] : null;
}

// ---- learn/status.js ----
/* Where each skill stands: in its ordered list of units, the one to work on now (the first not yet
   integrated) and the ones waiting for a cold check. Sessions, skills and the screens read this. */

const isDone = id => (itemState(id) || {}).stage === 'done';
const areaOn = area => Store.s.profile.areas[area] !== false;

/* ---------- where an ordered list of items stands ---------- */
// focus: the first item not yet integrated; checks: items waiting for their cold check
function orderStatus(order) {
  const checks = [];
  let focus = null;
  let done = 0;
  for (const id of order) {
    const it = itemState(id);
    if (id.endsWith(':full') && !order.slice(0, -1).every(isDone)) continue; // the whole piece opens last
    if (it && it.stage === 'done') done++;
    else if (it && it.stage === 'check') checks.push(id);
    else if (!focus) focus = id;
  }
  // do not open something new while two earlier things wait for their cold checks
  if (checks.length >= 2 && focus && !itemState(focus)) focus = null;
  return { order, focus, checks, done, total: order.length };
}

function sightUnlocked() {
  return SIGHT_NEEDS.every(isDone) || skillOrder('sight').some(id => itemState(id));
}

// status of one skill (treble, bass, sight, technique, theory, improv) or of one piece ('p:<pid>')
function skillStatus(skill) {
  if (skill.startsWith('p:')) return orderStatus(pieceOrder(skill.slice(2)));
  if (skill === 'sight' && !sightUnlocked())
    return { ...orderStatus(skillOrder('sight')), focus: null, locked: true };
  return orderStatus(skill === 'technique' ? techniqueOrder() : skillOrder(skill));
}

// the skills that make up an area
const areaSkills = area =>
  area === 'reading'
    ? ['treble', 'bass']
    : area === 'pieces'
      ? workingPieces().map(w => 'p:' + w.pid)
      : [area];

// something to practice in an area: a unit to learn, or (unless `learnable`) one waiting for its cold check
const areaHasWork = (area, { learnable = false } = {}) =>
  areaSkills(area).some(sk => skillStatus(sk).focus || (!learnable && skillStatus(sk).checks.length));

// ---- learn/skills.js ----
/* Skills: where you stand in each area, measured from your playing, and what to focus on next.
   A skill's level runs from 0 to 3, one point per tier (Foundations, Developing, Fluent): each tier adds
   the average progress of its units. Steadiness is measured instead of learned: the timing scatter of
   your runs with the metronome. The focus for the week is suggested from these levels, what matters
   to you (learned from the focus you choose), and how long an area has waited. */

const SKILLS = [
  { id: 'treble', n: 'Treble reading', area: 'reading' },
  { id: 'bass', n: 'Bass reading', area: 'reading' },
  { id: 'sight', n: 'Sight-reading', area: 'sight' },
  { id: 'technique', n: 'Technique', area: 'technique' },
  { id: 'theory', n: 'Theory', area: 'theory' },
  { id: 'pieces', n: 'Pieces', area: 'pieces' },
  { id: 'improv', n: 'Improvisation', area: 'improv' },
  { id: 'steadiness', n: 'Steadiness', area: null },
];
const MAX_LEVEL = 3;
const FOCUS_DAYS = 7;

/* ---------- progress of one item, 0 to 1 ---------- */
function itemProgress(id) {
  const it = itemState(id);
  const def = itemDef(id);
  if (!it || !def) return 0;
  const between = (v, a, b) => (b === a ? 1 : Math.max(0, Math.min(1, (v - a) / (b - a))));
  switch (it.stage) {
    case 'learn':
      return 0.05 + 0.2 * Math.min(1, (it.pc || 0) / 3);
    case 'pace': {
      const [start, goal] =
        def.kind === 'theory' ? [def.goal * 2, def.goal] : [def.pace.start, def.pace.target];
      return 0.3 + 0.5 * between(start - it.pace, 0, start - goal);
    }
    case 'tempo':
      return 0.3 + 0.5 * between(it.bpm, def.start, it.target);
    case 'create':
      return 0.3 + 0.5 * Math.min(1, (it.mins || 0) / (def.minutes || 8));
    case 'check':
      return 0.85 + 0.05 * (it.passes || []).length;
    case 'done':
      return 1;
    default:
      return 0;
  }
}

/* ---------- levels ---------- */
function tieredLevel(skill) {
  return skillTiers(skill).reduce(
    (sum, tier) => sum + tier.reduce((t, id) => t + itemProgress(id), 0) / tier.length,
    0,
  );
}

// pieces: an easy piece learned is level 1; a harder one counts for more
function piecesLevel() {
  const pids = new Set([...workingPieces().map(w => w.pid), ...Object.keys(Store.s.piece.added || {})]);
  let best = 0;
  for (const pid of pids) {
    const P = Library.get(pid);
    if (!P) continue;
    const order = pieceOrder(pid);
    const f = order.reduce((t, id) => t + itemProgress(id), 0) / Math.max(1, order.length);
    best = Math.max(best, Math.min(MAX_LEVEL, ((P.lvl || 1) - 1) / 2 + 1) * f);
  }
  return best;
}

// timing scatter of recent metronome runs, as a fraction of a beat (lower is steadier)
function steadiness() {
  const since = addDays(todayKey(), -21);
  const recent = (Store.s.timing || []).filter(x => x.d >= since).map(x => x.sd);
  if (recent.length >= 4) return median(recent);
  // until there are enough metronome runs: the pulse from the placement check
  return Store.s.steadyBase ? Store.s.steadyBase.sd : null;
}

function recordTiming(kind, sd, bpm) {
  if (!(sd >= 0) || sd > 0.6) return;
  const list = (Store.s.timing = Store.s.timing || []);
  list.push({ d: todayKey(), kind, sd: Math.round(sd * 1000) / 1000, bpm });
  if (list.length > 200) list.splice(0, list.length - 200);
}

function skillLevel(skill) {
  if (skill === 'pieces') return piecesLevel();
  if (skill === 'steadiness') {
    const sd = steadiness();
    return sd == null ? null : Math.max(0, Math.min(MAX_LEVEL, (MAX_LEVEL * (0.15 - sd)) / 0.12));
  }
  return tieredLevel(skill);
}

const tierName = level => TIER_NAMES[Math.min(MAX_LEVEL, Math.floor(level) + 1)];

// a short measurement under each skill, where there is one
function skillDetail(skill) {
  const items = Object.entries(Store.s.items).filter(([id]) => (itemDef(id) || {}).skill === skill);
  if (skill === 'treble' || skill === 'bass') {
    const paces = items.flatMap(([, it]) => it.paces || []).slice(-8);
    return paces.length ? `${(median(paces) / 1000).toFixed(1)} s per note` : '';
  }
  if (skill === 'theory') {
    const ok = items.flatMap(([, it]) => it.answers || []).filter(a => a.ok);
    return ok.length >= 3 ? `${(median(ok.map(a => a.ms)) / 1000).toFixed(1)} s per answer` : '';
  }
  if (skill === 'technique') {
    const best = Math.max(0, ...items.filter(([, it]) => it.stage !== 'learn').map(([, it]) => it.bpm || 0));
    return best ? `scales up to ♩ ${best}` : '';
  }
  if (skill === 'improv') {
    const mins = items.reduce((t, [, it]) => t + (it.mins || 0), 0);
    return mins >= 1 ? `${Math.round(mins)} minutes improvised` : '';
  }
  if (skill === 'steadiness') {
    const sd = steadiness();
    return sd == null ? 'measured from your metronome runs' : `± ${Math.round(sd * 100)}% of a beat`;
  }
  return '';
}

/* ---------- history, for trends ---------- */
function snapshotSkills() {
  const t = todayKey();
  const hist = (Store.s.skillHist = Store.s.skillHist || {});
  hist[t] = Object.fromEntries(
    SKILLS.map(s => [s.id, skillLevel(s.id)])
      .filter(([, v]) => v != null)
      .map(([k, v]) => [k, Math.round(v * 100) / 100]),
  );
  const days = Object.keys(hist).sort();
  days.slice(0, Math.max(0, days.length - 120)).forEach(d => delete hist[d]);
}

// change over the last two weeks (null when there is no older snapshot)
function skillTrend(skill) {
  const hist = Store.s.skillHist || {};
  const cutoff = addDays(todayKey(), -14);
  const older = Object.keys(hist)
    .filter(d => d <= cutoff && hist[d][skill] != null)
    .sort()
    .pop();
  const now = skillLevel(skill);
  if (!older || now == null) return null;
  return Math.round((now - hist[older][skill]) * 10) / 10;
}

/* ---------- focus ---------- */
const areaLevel = area =>
  area === 'reading' ? Math.min(skillLevel('treble'), skillLevel('bass')) : skillLevel(area) || 0;

function lastPracticed(area) {
  let last = null;
  for (const [id, it] of Object.entries(Store.s.items))
    if (it.last && (itemDef(id) || {}).area === area && (!last || it.last > last)) last = it.last;
  return last;
}

// every area worth suggesting, with a score and a reason. When a week's focus has run out, the area it was
// on ranks a little lower, so the focus moves around unless one area clearly needs it most.
function rankAreas() {
  // areas with something new to learn; an area whose units all wait for cold checks gets those anyway
  const on = AREAS.filter(a => Store.s.profile.areas[a.id] !== false);
  const learnable = on.filter(a => areaHasWork(a.id, { learnable: true }));
  const enabled = learnable.length ? learnable : on.filter(a => areaHasWork(a.id));
  const weights = Store.s.profile.weights || {};
  const levels = Object.fromEntries(enabled.map(a => [a.id, areaLevel(a.id)]));
  // how far each area is behind your strongest, as a share of a level (or of the strongest, past level 1)
  const top = Math.max(0, ...Object.values(levels));
  const f = Store.s.focus;
  const prev = f && f.until <= todayKey() ? f.area : null;
  return enabled
    .map(a => {
      const w = weights[a.id] ?? 1;
      const gap = (top - levels[a.id]) / Math.max(1, top); // 0 = your strongest area, 1 = far behind
      const last = lastPracticed(a.id);
      const waited = last ? daysBetween(last, todayKey()) : 14; // never practiced counts as a long wait
      const stalls = Object.entries(Store.s.items).some(
        ([id, it]) => it.stalls && it.last >= addDays(todayKey(), -7) && (itemDef(id) || {}).area === a.id,
      );
      const score =
        w * (1 + gap) + Math.min(0.3, waited * 0.03) - (a.id === prev ? 0.35 : 0) - (stalls ? 0.15 : 0);
      const reason =
        a.id === 'reading' && skillLevel('bass') + 0.3 < skillLevel('treble')
          ? 'Bass reading is behind treble, and it holds back both hands together.'
          : gap > 0.35
            ? `${AREA_BY[a.id].n} is behind your other skills.`
            : w > 1.15
              ? `${AREA_BY[a.id].n} matters to you.`
              : !last
                ? `${AREA_BY[a.id].n} is not started yet.`
                : waited >= 7
                  ? `${AREA_BY[a.id].n} has waited ${waited >= 14 ? 'two weeks or more' : 'a week'}.`
                  : `${AREA_BY[a.id].n} is ready for its next step.`;
      return { area: a.id, score, reason };
    })
    .sort((x, y) => y.score - x.score);
}

// this week's focus; suggested automatically when there is none or it has run out
function currentFocus() {
  const t = todayKey();
  let f = Store.s.focus;
  const valid = f && f.until > t && Store.s.profile.areas[f.area] !== false && areaHasWork(f.area);
  if (!valid) {
    const best = rankAreas()[0];
    if (!best) return null;
    f = Store.s.focus = {
      area: best.area,
      since: t,
      until: addDays(t, FOCUS_DAYS),
      how: 'suggested',
      reason: best.reason,
      confirmed: false,
    };
    Log.ev('focus suggested', { area: best.area, reason: best.reason });
  }
  return f;
}

// you confirm the suggestion, or choose another area; your choices teach the suggestions
function chooseFocus(area) {
  const t = todayKey();
  const f = Store.s.focus;
  const weights = (Store.s.profile.weights = Store.s.profile.weights || {});
  const nudge = (id, d) => (weights[id] = Math.max(0.6, Math.min(1.6, (weights[id] ?? 1) + d)));
  if (f && !f.confirmed && f.area !== area) {
    nudge(area, 0.1);
    nudge(f.area, -0.05);
  }
  Store.s.focus = {
    area,
    since: f && f.area === area ? f.since : t,
    until: f && f.area === area ? f.until : addDays(t, FOCUS_DAYS),
    how: f && f.area === area ? f.how : 'chosen',
    reason: f && f.area === area ? f.reason : '',
    confirmed: true,
  };
  Log.ev('focus chosen', { area });
  Store.save();
}

/* The player: one drill, rep after rep, hands on the keys
   One state machine with one timer slot, so nothing can be left half-switched:
     ready -> (first note) -> wait -> review -> ready ...          wait mode
     ready -> countin -> tempo -> review -> countin ...            metronome mode
     paused (nothing played for two reps) -> any key -> countin
   Every transition is logged. The curriculum decides what the next rep should be. */

const sentence = parts => {
