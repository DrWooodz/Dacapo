  return t ? t[0].toUpperCase() + t.slice(1) + '.' : '';
};

// timing scatter limits for a clean run (fraction of a beat or of the note spacing). Up to FAIR times the
// limit still counts as clean, with a word about it; beyond that it is a slip. Timing alone is never messy.
const LIMIT = { even: 0.08, evenMic: 0.12, piece: 0.1, read: 0.12, rhythmMax: 0.1 };
const FAIR = 1.6;
// the click and you may differ this much before it is mentioned
const TEMPO_TOLERANCE = 0.12;

// "2 wrong notes, 1 hint." for a wait-mode rep that was not clean
function waitModeSlips(wrong, hinted) {
  const plural = (n, word) => `${n} ${word}${n > 1 ? 's' : ''}`;
  return (
    [wrong && plural(wrong, 'wrong note'), hinted && plural(hinted, 'hint')].filter(Boolean).join(', ') + '.'
  );
}

// where you played, relative to the written note: "an octave higher", "two octaves lower"
const octaves = semis =>
  `${Math.abs(semis) === 12 ? 'an octave' : 'two octaves'} ${semis > 0 ? 'higher' : 'lower'}`;

const Player = {
  mount(root, { id, role = 'focus', onEvent = () => {} }) {
    if ((itemDef(id) || {}).kind === 'theory') return Quiz.mount(root, { id, role, onEvent });
    const P = {
      id,
      role,
      root,
      def: itemDef(id),
      plan: null,
      drill: null,
      phase: 'idle',
      timer: 0,
      offs: [],
      dead: false,
      idle: 0,
      repN: 0,
    };
    const $p = s => root.querySelector(s);
    const log = (m, d) => Log.ev('player ' + m, Object.assign({ id }, d || {}));
    const later = (fn, ms) => {
      clearTimeout(P.timer);
      P.timer = setTimeout(
        Log.guard('player timer', () => {
          if (!P.dead) fn();
        }),
        ms,
      );
    };
    const cancel = () => {
      clearTimeout(P.timer);
      P.timer = 0;
    };
    const setPhase = (ph, why) => {
      if (P.phase !== ph) log(`${P.phase} → ${ph}`, why ? { why } : undefined);
      P.phase = ph;
      paintBar();
    };
    if (!P.def) {
      root.innerHTML = '<div class="card"><p>This drill is no longer available.</p></div>';
      return { destroy() {} };
    }

    /* ---------- layout ---------- */
    const k = P.def.kind;
    // rhythm drills are tapped; everything else shows a keyboard with the key hints
    const input =
      k === 'rhythm'
        ? '<button class="tap" type="button" id="plTap">Tap here, press space, or play any key</button>'
        : '<div class="kbwrap scrollx" id="plKbWrap"><div id="plKb"></div></div>';
    root.innerHTML = `
      <div class="player card" data-kind="${k}">
        <div class="pl-head">
          <div class="pl-title"><b id="plTitle"></b><span class="small" id="plSub"></span></div>
          <button class="iconbtn" type="button" id="plAbout" aria-label="About this drill" title="About this drill">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
          </button>
        </div>
        <div class="pl-stagebar">
          <span class="pill" id="plStage"></span>
          <span class="small" id="plCrit"></span>
        </div>
        <div class="pl-stage">
          <div class="staffwrap scrollx" id="plStaffWrap"><div id="plStaff"></div></div>
          <div class="countin" id="plCount" hidden></div>
        </div>
        <div class="beats pl-beats" id="plBeats" hidden></div>
        <div class="feedback pl-msg" id="plMsg" aria-live="polite"></div>
        <div class="cue" id="plCue"></div>
        ${input}
        <div class="st-bar pl-bar">
          <button class="iconbtn" type="button" id="plHear" aria-label="Hear it" title="Hear it">
            <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
          </button>
          <span class="small" id="plInfo"></span>
          <button class="btn cover sm" type="button" id="plGo"></button>
        </div>
      </div>`;
    const msg = (t, cls = '') => {
      const e = $p('#plMsg');
      if (e) {
        e.className = 'feedback pl-msg ' + cls;
        e.textContent = t;
      }
    };

    /* ---------- painting ---------- */
    let staffRes = null;
    let hl = { cur: -1, ok: new Set(), bad: new Set() };
    function paintStaff(follow) {
      const d = P.drill;
      if (!d) return;
      const wrap = $p('#plStaffWrap');
      const box = $p('#plStaff');
      if (!wrap || !box) return;
      if (d.kind === 'rhythm') {
        const marks = d.events.map((e, i) => {
          const si = d.steps.findIndex(s => s.ev === i);
          return si < 0 ? '' : hl.bad.has(si) ? 'bad' : hl.ok.has(si) ? 'ok' : '';
        });
        box.innerHTML = `<div style="max-width:${200 + d.beats * 70}px;margin:0 auto">${rhythmSVG(d.events, { beats: d.meter[0], marks, width: 100 + d.beats * 64, total: d.beats })}</div>`;
        return;
      }
      if (d.piece) {
        // long music (a whole piece) is drawn a window of bars at a time around where you are
        P.win = null;
        if (d.steps.length > 140) {
          const at = clamp(follow == null ? P.winAt || 0 : follow, 0, d.steps.length - 1);
          P.winAt = at;
          const t0 = d.steps[Math.max(0, at - 6)].beat;
          let bi = 0;
          while (bi + 1 < d.bars.length && d.bars[bi + 1] <= t0 + 1e-6) bi++;
          const base = d.bars[bi];
          const bj = Math.min(d.bars.length - 1, bi + 6);
          const end = d.bars[bj];
          const idx = [];
          d.steps.forEach((x, i) => {
            if (x.beat >= base - 0.3 && x.beat < end - 0.01) idx.push(i);
          });
          const w0 = idx[0] ?? 0;
          const sub = idx.map(i => ({ ...d.steps[i], beat: d.steps[i].beat - base }));
          const map = new Map(idx.map((i, j) => [i, j]));
          const loc = set => new Set([...set].filter(i => map.has(i)).map(i => map.get(i)));
          P.win = { w0, w1: w0 + idx.length, map };
          staffRes = pieceStaffSVG({
            steps: sub,
            ghost: (d.ghost || []).filter(n => n.t >= base && n.t < end).map(n => ({ ...n, t: n.t - base })),
            bars: d.bars.slice(bi, bj + 1).map(b => b - base),
            total: end - base,
            sig: Library.keyAt(d.pid || P.def.pid, d.a + bi),
            time: null,
            clefs: [
              Library.clefAt(d.pid || P.def.pid, 0, d.a + bi),
              Library.clefAt(d.pid || P.def.pid, 1, d.a + bi),
            ],
            clefChanges: [],
            hl: { cur: map.has(hl.cur) ? map.get(hl.cur) : -1, ok: loc(hl.ok), bad: loc(hl.bad) },
            ppb: 30,
          });
          staffRes.xs = d.steps.map((_, i) => (map.has(i) ? staffRes.xs[map.get(i)] : null));
        } else
          staffRes = pieceStaffSVG({
            steps: d.steps,
            ghost: d.ghost,
            bars: d.bars,
            total: d.total,
            sig: d.sig,
            time: d.time,
            clefs: d.clefs,
            clefChanges: d.clefChanges,
            hl,
            ppb: d.steps.length > 60 ? 30 : 38,
          });
      } else {
        const items = d.steps.map((s, i) => ({
          notes: s.notes.map(x => ({
            ...x,
            f: (P.plan.mode === 'wait' && P.plan.hints) || k === 'scale' || k === 'arp' ? x.f : '',
            cls: hl.bad.has(i) ? 'bad' : hl.ok.has(i) ? 'ok' : hl.cur === i ? 'cur' : '',
          })),
          fstack: s.fstack,
          fcls: s.fcls,
        }));
        staffRes = staffSVG({
          clef: d.clef,
          sig: d.sig,
          items,
          spacing: d.spacing || (k === 'read' ? 36 : 28),
          top: 40,
          bottom: 44,
          barEvery: d.barEvery || 0,
        });
      }
      const big = staffRes.W > 560;
      const w = Math.round(staffRes.W * (big ? 1.1 : 1.6));
      box.innerHTML = `<div style="width:${big ? w + 'px' : '100%'};max-width:${big ? 'none' : w + 'px'};margin:0 auto">${staffRes.svg}</div>`;
      if (big && follow != null) scrollTo(follow);
    }
    function scrollTo(i) {
      const wrap = $p('#plStaffWrap');
      if (!wrap || !staffRes || staffRes.xs[i] == null) return;
      const w = wrap.scrollWidth;
      const px = (staffRes.xs[i] / staffRes.W) * w;
      const target = Math.max(0, px - wrap.clientWidth * 0.35);
      if (Math.abs(wrap.scrollLeft - target) > wrap.clientWidth * 0.25)
        wrap.scrollTo({ left: target, behavior: 'smooth' });
    }
    function paintKb(stepIdx, showHint) {
      const kb = $p('#plKb');
      if (!kb) return;
      const d = P.drill;
      const all = d.steps.flatMap(s => s.midis).concat((d.ghost || []).map(n => midiOf(n.n)));
      const r = all.length ? kbRange(all, 2, 17) : { from: 48, to: 72 };
      const marks = {};
      const s = d.steps[stepIdx];
      if (showHint && s)
        s.notes.forEach((x, j) => {
          const m = midiOf(x.n);
          marks[m] = { cls: x.fcls || 'rh', f: x.f || x.kf || (s.fstack ? s.fstack[j] : '') };
          if (!marks[m].f) delete marks[m].f;
        });
      kb.innerHTML = kbSVG({ ...r, marks, h: 104 });
      if (s && showHint) {
        const wrap = $p('#plKbWrap');
        const key = kb.querySelector(`[data-m="${s.midis[0]}"]`);
        if (wrap && key) {
          const kr = key.getBoundingClientRect(),
            wr = wrap.getBoundingClientRect();
          if (kr.left < wr.left || kr.right > wr.right) wrap.scrollLeft += kr.left - wr.left - wr.width / 2;
        }
      }
    }
    function paintHead() {
      const it = itemState(id) || {};
      const d = P.def;
      $p('#plTitle').textContent = d.title;
      $p('#plSub').textContent =
        d.sub +
        (P.plan && P.plan.hand && d.phases.length > 1 && P.plan.mode !== 'improv'
          ? ' · ' + handWord(P.plan.hand)
          : '');
      const st = $p('#plStage');
      const cold = P.plan && P.plan.cold;
      st.textContent = cold ? 'Cold check' : role === 'review' ? 'Review' : STAGE_TXT[it.stage] || '';
      st.className = 'pill ' + (it.stage === 'done' ? 'ok' : cold || it.stage === 'check' ? 'brass' : '');
      $p('#plCrit').textContent = criterion(id);
      paintCue();
    }
    // the line under the staff: technique advice when a habit shows up, a note on body and hands once a
    // day, otherwise what this rep is about
    function paintCue() {
      const cue = $p('#plCue');
      if (!cue || !P.plan) return;
      const advice = techniqueAdvice((itemState(id) || {}).tech);
      const seen = (Store.s.lessonsSeen = Store.s.lessonsSeen || {});
      const lesson =
        !advice &&
        P.repN === 0 &&
        seen[P.def.kind] !== todayKey() &&
        lessonFor(P.def.kind, Store.s.sessions || 0);
      if (advice || lesson) {
        const l = advice ? LESSON_BY[advice.lesson] : lesson;
        cue.innerHTML = `<span>${advice ? 'Technique' : 'Before you start'}</span> ${esc(advice ? advice.text : l.cue)}
          <button class="linkbtn" type="button" data-lesson="${l.id}">More</button>`;
        cue.querySelector('[data-lesson]').onclick = () => lessonSheet(l.id);
        if (lesson) seen[P.def.kind] = todayKey();
        return;
      }
      const cues = CUES[P.def.kind] || CUES.scale;
      cue.innerHTML = `<span>${P.plan.mode === 'tempo' ? 'This rep' : 'Focus'}</span> ${esc(P.plan.label || cues[P.repN % cues.length])}`;
    }
    function paintBar() {
      const go = $p('#plGo');
      if (!go) return;
      const info = $p('#plInfo');
      const mode = P.plan && P.plan.mode;
      if (mode === 'improv') return;
      if (mode === 'tempo') {
        go.hidden = false;
        go.textContent =
          { review: 'Pause', paused: 'Start', stopped: 'Start', needsound: 'Start' }[P.phase] || 'Stop';
      } else {
        go.hidden = P.phase !== 'wait';
        go.textContent = 'Restart';
      }
      if (info)
        info.textContent = !P.plan
          ? ''
          : mode === 'tempo'
            ? `♩ ${P.plan.bpm}`
            : P.plan.paced
              ? `Goal ${(P.plan.pace / 1000).toFixed(1)} s per note`
              : '';
    }

    /* ---------- (re)planning ---------- */
    function replan(reason) {
      const prevHand = P.plan && P.plan.hand,
        prevMode = P.plan && P.plan.mode;
      P.plan = planFor(id);
      if (!P.plan) return;
      if (P.plan.mode === 'improv') {
        P.drill = { steps: [], beats: 0 };
        paintHead();
        if (!P.improv) Improv.start(P, root, onEvent);
        return;
      }
      const needNew =
        !P.drill ||
        P.drill.fresh ||
        prevHand !== P.plan.hand ||
        prevMode !== P.plan.mode ||
        reason === 'init';
      if (needNew) {
        P.drill = buildDrill(P.def, P.plan);
        if (!P.drill) {
          msg('This drill could not be built.', 'bad');
          Log.warn('drill build failed', { id, plan: P.plan });
          return;
        }
      }
      P.lenient = Input.mode === 'mic' && P.drill.steps.some(s => s.midis.length > 1);
      log('plan', {
        reason,
        mode: P.plan.mode,
        hand: P.plan.hand,
        bpm: P.plan.bpm,
        hints: P.plan.hints,
        cold: P.plan.cold,
        steps: P.drill.steps.length,
        rebuilt: needNew,
      });
      if (P.forceHints) {
        // after a wrong-octave or wrong-hand run, show the keys once
        P.plan.hints = true;
        P.forceHints = false;
      }
      hl = { cur: P.plan.mode === 'wait' ? 0 : -1, ok: new Set(), bad: new Set() };
      paintHead();
      paintStaff(0);
      paintKb(
        0,
        P.plan.mode === 'wait'
          ? P.plan.hints
          : P.plan.hints ||
              (P.plan.mode === 'tempo' && !P.plan.cold && P.def.kind !== 'read' && P.def.kind !== 'rhythm'),
      );
    }
    function startRep() {
      // enter the ready state for the current plan
      cancel();
      W.reset();
      if (P.plan.mode === 'wait') {
        setPhase('ready');
        const s = P.drill.steps[0];
        msg(
          (P.drill.src ? P.drill.src + '. ' : '') +
            (P.plan.hints || P.def.kind !== 'read'
              ? `Play the first note to begin${P.plan.hints ? ': ' + label(s) : ''}.`
              : 'Play the first note to begin.'),
        );
      } else if (P.plan.mode === 'tempo') {
        T.countIn();
      }
    }
    const label = s => (s ? s.notes.map(x => `${nameOf(x.n)}${x.f ? ` (${x.f})` : ''}`).join(' + ') : '');

    /* ---------- wait mode ---------- */
    const W = {
      i: 0,
      got: new Set(),
      t0: 0,
      err: [],
      times: [],
      last: 0,
      hintT: 0,
      hinted: new Set(),
      reset() {
        this.i = 0;
        this.got = new Set();
        this.err = new Array(P.drill.steps.length).fill(0);
        this.times = [];
        this.last = 0;
        this.hinted = new Set();
        this.touch = false;
        clearTimeout(this.hintT);
      },
      armHint() {
        clearTimeout(this.hintT);
        if (P.plan.hints) return;
        const i = this.i;
        this.hintT = setTimeout(() => this.showHint(i), P.def.kind === 'read' ? 5000 : 7000);
      },
      showHint(i) {
        clearTimeout(this.hintT);
        if (P.dead || (P.phase !== 'wait' && P.phase !== 'ready') || this.i !== i || this.hinted.has(i))
          return;
        this.hinted.add(i);
        paintKb(i, true);
        msg(`Hint: ${label(P.drill.steps[i])}`);
      },
      note(ev) {
        const d = P.drill;
        const s = d.steps[this.i];
        if (!s) return;
        const fits = m => sameNote(ev.m, m, ev.src);
        if (P.phase === 'review') {
          // playing the first note again starts the next rep at once, if it is the same drill
          if (!P.sameNext || !d.steps[0].midis.some(fits)) return;
          cancel();
          P.plan = planFor(id);
          paintHead();
          W.reset();
          hl = { cur: 0, ok: new Set(), bad: new Set() };
          setPhase('ready');
        }
        if (P.phase === 'ready') {
          const s0 = d.steps[0];
          if (!s0.midis.some(fits)) {
            msg(`That was ${nameOf(spellerFor(d.sig)(ev.m))}. Start on ${label(s0)}.`, 'bad');
            flashKey($p('#plKb svg'), ev.m, 'bad', 400);
            return;
          }
          setPhase('wait');
          this.t0 = ev.t;
        }
        if (ev.src === 'touch') this.touch = true;
        const need = P.lenient && s.midis.length > 1 ? [s.midis.find(fits)].filter(x => x != null) : s.midis;
        const match = need.find(m => fits(m) && !this.got.has(m));
        if (match != null) {
          if (!this.got.size || ev.t - this.chordT > 1500) {
            this.got = new Set();
            this.chordT = ev.t;
          }
          this.got.add(match);
          flashKey($p('#plKb svg'), ev.m, 'ok', 180);
          if (this.got.size >= need.length) {
            this.times[this.i] = this.chordT;
            hl.ok.add(this.i);
            this.i++;
            this.got = new Set();
            if (this.i >= d.steps.length) return this.finish();
            hl.cur = this.i;
            paintStaff(this.i);
            paintKb(this.i, P.plan.hints);
            this.armHint(); // (windowed drawing follows this.i)
            msg(P.plan.hints ? `Next: ${label(d.steps[this.i])}` : `${this.i} of ${d.steps.length}`);
          }
        } else if (!s.midis.some(fits)) {
          this.err[this.i]++;
          flashKey($p('#plKb svg'), ev.m, 'bad', 450);
          const same = s.midis.find(m => m !== ev.m && (ev.m - m) % 12 === 0);
          msg(
            same != null
              ? `Right note, ${octaves(ev.m - same)} than written.`
              : `That was ${nameOf(spellerFor(d.sig)(ev.m))}.${P.plan.hints ? ' Next: ' + label(s) : ' Try again.'}`,
            'bad',
          );
          // two misses on one note: show it now rather than after the usual wait
          if (this.err[this.i] >= 2 && !P.plan.hints) this.showHint(this.i);
          if (!hl.bad.has(this.i)) {
            hl.bad.add(this.i);
            paintStaff(this.i);
          }
        }
      },
      finish() {
        clearTimeout(this.hintT);
        setPhase('review');
        hl.cur = -1;
        paintStaff();
        paintKb(-1, false);
        const d = P.drill;
        const n = d.steps.length;
        const gaps = [];
        for (let x = 1; x < this.times.length; x++) gaps.push(this.times[x] - this.times[x - 1]);
        // the time per note, from the second note on: how fast you find the notes
        const pace = gaps.length >= 3 ? Math.round(median(gaps)) : null;
        const med = median(gaps) || 600;
        // long pauses are noted, but wait mode is for taking your time: they never make a run unclean
        const hes = gaps.filter(g => g > Math.max(P.def.kind === 'read' ? 4000 : 3000, med * 3)).length;
        const hinted = P.plan.hints ? 0 : this.hinted.size;
        const wrongSteps = this.err.filter(e => e).length;
        const clean = wrongSteps === 0 && hinted === 0;
        const srcs = Input.mode;
        const valid = Input.live && Input.mode !== 'touch' && !P.lenient && !this.touch;
        const weak = weakHand(
          d,
          this.err.map((e, i) => (e ? i : -1)).filter(i => i >= 0),
        );
        report({
          mode: 'wait',
          hand: P.plan.hand,
          clean,
          rating: clean ? 'clean' : wrongSteps + hinted <= 1 ? 'slips' : 'messy',
          acc: 1 - wrongSteps / n,
          wrong: wrongSteps,
          hes,
          hinted,
          pace,
          valid,
          weak,
          src: srcs,
          msg: clean ? '' : waitModeSlips(wrongSteps, hinted),
        });
      },
    };
    function weakHand(d, badIdx) {
      const c = { rh: 0, lh: 0 };
      badIdx.forEach(i =>
        (d.steps[i] ? d.steps[i].notes : []).forEach(x => {
          if (x.fcls === 'rh' || x.fcls === 'lh') c[x.fcls]++;
        }),
      );
      return c.rh === c.lh ? null : c.rh > c.lh ? 'rh' : 'lh';
    }

    /* ---------- metronome mode ---------- */
    const T = {
      ons: [],
      t0: 0,
      msBeat: 1000,
      offBeat: null,
      raf: 0,
      countIn() {
        cancel();
        hl = { cur: -1, ok: new Set(), bad: new Set() };
        const ac = AudioEngine.ensure();
        if (ac.state !== 'running') {
          // browsers only allow sound after a tap on the page; a key on the piano does not count
          setPhase('needsound');
          msg(
            'Tap the screen once to switch on the metronome. Browsers need one tap before they can play sound.',
            '',
          );
          const wake = Log.guard('sound unlock', () => {
            if (P.dead) return;
            if (AudioEngine.ctx.state === 'running') {
              document.removeEventListener('pointerdown', wake, true);
              clearInterval(P.soundPoll);
              log('sound unlocked');
              this.countIn();
            }
          });
          document.addEventListener(
            'pointerdown',
            () => {
              AudioEngine.ensure();
              setTimeout(wake, 150);
            },
            { capture: true, once: true },
          );
          clearInterval(P.soundPoll);
          P.soundPoll = setInterval(wake, 500);
          P.offs.push(() => clearInterval(P.soundPoll));
          return;
        }
        paintStaff(0);
        paintKb(0, P.plan.hints || (!P.plan.cold && P.def.kind !== 'read' && P.def.kind !== 'rhythm'));
        const d = P.drill;
        const bpm = P.plan.bpm;
        this.msBeat = 60000 / bpm; // quarter-note beats
        const clickBpm = bpm / d.unit;
        const clicks = d.clicks || 4;
        this.ons = [];
        setPhase('countin');
        AudioEngine.ensure();
        const first = Metro.start({ bpm: clickBpm, beats: clicks, sub: 1, countIn: 1 });
        this.t0 = AudioEngine.toPerf(first) + (d.lead ? 0 : 0);
        this.watch(clicks);
        msg(
          P.plan.cold
            ? 'Cold check: count-in, then play it once at the target tempo.'
            : `Count-in, then play at ♩ ${bpm}. When you start exactly does not matter.`,
        );
        const totalMs = (d.beats || 8) * this.msBeat;
        later(
          () => this.finish('timeout'),
          Math.max(1000, this.t0 + totalMs * 1.6 + 2200 - performance.now()),
        );
        this.follow();
      },
      watch(clicks) {
        if (this.offBeat) this.offBeat();
        const cnt = $p('#plCount'),
          dots = $p('#plBeats');
        if (dots) {
          dots.hidden = false;
          dots.innerHTML = '<i></i>'.repeat(Math.min(clicks, 12));
        }
        this.offBeat = Metro.on((kind, q) => {
          if (kind !== 'beat' || P.dead) return;
          if (dots)
            $$('i', dots).forEach((el, j) => {
              el.classList.toggle('on', j === q.beat);
              el.classList.toggle('acc', q.beat === 0);
            });
          if (!cnt) return;
          if (q.idx < clicks) {
            cnt.hidden = false;
            cnt.textContent = clicks - q.idx;
            cnt.className = 'countin' + (q.idx === clicks - 1 ? ' last' : '');
          } else if (q.idx === clicks) {
            cnt.hidden = false;
            cnt.textContent = 'Play';
            cnt.className = 'countin go';
            setTimeout(() => {
              if (cnt) cnt.hidden = true;
            }, 450);
            if (P.phase === 'countin') setPhase('tempo');
          }
        });
      },
      follow() {
        // keep the staff scrolled near where you should be
        cancelAnimationFrame(this.raf);
        const d = P.drill;
        const tick = () => {
          if (P.dead || !['countin', 'tempo'].includes(P.phase)) return;
          const beat = (performance.now() - this.t0) / this.msBeat;
          let i = d.steps.findIndex(s => s.beat >= beat);
          if (i < 0) i = d.steps.length - 1;
          if (P.win && (i >= P.win.w1 - 8 || i < P.win.w0)) paintStaff(i);
          if (i >= 0 && staffRes && staffRes.W > 560) scrollTo(i);
          this.raf = requestAnimationFrame(() => setTimeout(tick, 250));
        };
        tick();
      },
      unwatch() {
        if (this.offBeat) {
          this.offBeat();
          this.offBeat = null;
        }
        cancelAnimationFrame(this.raf);
        const c = $p('#plCount');
        if (c) c.hidden = true;
        const d = $p('#plBeats');
        if (d) d.hidden = true;
      },
      note(ev) {
        if (P.phase === 'paused' || P.phase === 'stopped') {
          log('resume by key');
          msg('Counting in…');
          later(() => this.countIn(), 400);
          setPhase('resuming');
          return;
        }
        if (!['countin', 'tempo'].includes(P.phase)) return;
        this.ons.push(ev);
        const d = P.drill;
        const ok = d.any || d.steps.some(s => s.midis.some(m => sameNote(ev.m, m, ev.src)));
        flashKey($p('#plKb svg'), ev.m, ok ? 'ok' : 'bad', 180);
        if (d.any) {
          const tap = $p('#plTap');
          if (tap) {
            tap.classList.add('hit');
            setTimeout(() => tap.classList.remove('hit'), 90);
          }
        }
        // the last note: is the run complete? (also when the whole run is an octave or two off, so it
        // ends at once and can be named, instead of waiting for the time-out)
        const last = d.steps[d.steps.length - 1];
        const lateEnough = last && performance.now() > this.t0 + last.beat * this.msBeat * 0.7 - this.msBeat;
        const shift = d.any
          ? 0
          : [0, 12, -12, 24, -24].find(sh => last && last.midis.some(m => sameNote(ev.m - sh, m, ev.src)));
        if (lateEnough && shift != null) {
          const rel = this.ons
            .filter(o => o.t > this.t0 - this.msBeat * 1.5)
            .map(o => (shift ? { ...o, m: o.m - shift } : o));
          if (rel.length >= Math.max(2, d.steps.length * 0.6)) {
            const an = analyzeSeq(rel, d.steps, this.msBeat, { any: d.any, one: P.lenient });
            // an octave off: only right at the end, and only when nearly every note fits the shift
            const atEnd = performance.now() > this.t0 + (last.beat - 1.5) * this.msBeat;
            if (an.complete && (!shift || (atEnd && an.accuracy >= 0.8)))
              later(() => this.finish('complete'), 450);
          }
        }
      },
      finish(why) {
        if (!['countin', 'tempo'].includes(P.phase)) return;
        Metro.stop();
        this.unwatch();
        setPhase('review', why);
        const d = P.drill;
        const rel = this.ons.filter(o => o.t > this.t0 - this.msBeat * 1.5);
        if (rel.length < 2) {
          P.idle++;
          if (P.idle >= 2) {
            setPhase('paused');
            msg('Paused. Play any key when you are ready.', '');
            return;
          }
          msg(`I heard ${rel.length ? 'one note' : 'nothing'}. Again…`, 'bad');
          later(() => this.countIn(), 2600);
          return;
        }
        P.idle = 0;
        const an = analyzeSeq(rel, d.steps, this.msBeat, { any: d.any, one: P.lenient });
        an.res.forEach(r => {
          if (r.ok) hl.ok.add(r.i);
          else hl.bad.add(r.i);
        });
        hl.cur = -1;
        paintStaff();
        paintKb(-1, false);
        if (an.matched < d.steps.length * 0.5 && rel.length < d.steps.length * 0.5) {
          msg('That rep was cut short; it does not count. Again…');
          log('incomplete rep', { matched: an.matched });
          later(() => this.countIn(), 2600);
          return;
        }
        const judged = judgeTempoRun(an, d, rel);
        if (judged.ignore) {
          // the other hand's part: say so and run it again, without counting it
          msg(judged.note, 'bad');
          log('rep ignored', { why: judged.why });
          P.forceHints = true;
          later(() => {
            replan('after rep');
            startRep();
          }, 3200);
          return;
        }
        if (!d.any && an.accuracy >= 0.85 && an.matched >= 6)
          recordTiming(P.def.kind, d.even ? an.sdGap : an.sdBeat, P.plan.bpm);
        const valid = d.any
          ? true
          : Input.live && Input.mode !== 'touch' && !P.lenient && !rel.some(o => o.src === 'touch');
        const weak = weakHand(
          d,
          an.res.filter(r => !r.ok).map(r => r.i),
        );
        report({
          mode: 'tempo',
          hand: P.plan.hand,
          clean: judged.rating === 'clean',
          rating: judged.rating,
          acc: an.accuracy,
          wrong: an.wrong,
          tempoRatio: an.tempoRatio,
          sd: d.even ? an.sdGap : an.sdBeat,
          bpm: P.plan.bpm,
          played: judged.played,
          adopt: judged.adopt,
          valid,
          weak,
          msg: judged.note,
          tech: techniqueReport(an, d),
          an,
        });
      },
    };

    /* ---------- judging a run with the metronome ---------- */
    // rating: 'clean' | 'slips' | 'messy', with a note; adopt: steady and faster than the click;
    // ignore: the other hand's part was played (does not count)
    function judgeTempoRun(an, d, rel) {
      const opts = { any: d.any, one: P.lenient };
      const played = Math.round(P.plan.bpm * an.tempoRatio);
      const mic = Input.mode === 'mic';
      // right notes in the wrong octave, or the other hand's part
      if (!d.any && an.accuracy < 0.6) {
        for (const sh of [12, -12, 24, -24]) {
          const alt = analyzeSeq(
            rel.map(o => ({ ...o, m: o.m - sh })),
            d.steps,
            T.msBeat,
            opts,
          );
          if (alt.accuracy >= 0.8) {
            P.forceHints = true;
            return {
              rating: 'slips',
              played,
              note: `The right notes, but ${octaves(sh)} than written. Check the clef, then play it there.`,
            };
          }
        }
        if (d.ghost && d.ghost.length) {
          const other = new Set(d.ghost.map(n => midiOf(n.n)));
          const mine = new Set(d.steps.flatMap(s => s.midis));
          const theirs = rel.filter(o => other.has(o.m) && !mine.has(o.m)).length;
          if (theirs >= rel.length * 0.5)
            return {
              ignore: true,
              why: 'other hand',
              note: `That was the other hand's part. This run is ${handWord(P.plan.hand)}: play only the dark notes.`,
            };
        }
      }
      let timing; // 1 good, 2 fair, 3 uneven
      if (d.any) {
        let mg = 4;
        for (let x = 1; x < d.steps.length; x++) mg = Math.min(mg, d.steps[x].beat - d.steps[x - 1].beat);
        const lim = Math.min(LIMIT.rhythmMax, 0.2 * mg);
        timing = an.maxDevBeat < lim ? 1 : an.maxDevBeat < lim * 1.8 ? 2 : 3;
      } else {
        let v, lim;
        if (d.piece) {
          v = an.sdMs;
          lim = Math.max(40, LIMIT.piece * T.msBeat * Math.max(an.gapBeats, 0.5));
        } else if (P.def.kind === 'read') {
          v = an.sdBeat;
          lim = LIMIT.read;
        } else {
          v = an.sdGap;
          lim = mic ? LIMIT.evenMic : LIMIT.even;
        }
        timing = v < lim ? 1 : v < lim * FAIR ? 2 : 3;
      }
      const notesOk = an.accuracy === 1 && an.wrong <= (mic ? 1 : 0);
      const ratio = an.tempoRatio;
      if (notesOk && timing < 3) {
        if (Math.abs(ratio - 1) <= TEMPO_TOLERANCE)
          return {
            rating: 'clean',
            played,
            note: timing === 2 ? 'Clean; a few notes a little uneven. Let the click carry you.' : '',
          };
        if (ratio > 1)
          return {
            rating: 'clean',
            played,
            adopt: P.plan.mode === 'tempo' && !P.plan.cold,
            note: `Right notes and steady, at ♩ ${played}.`,
          };
        return {
          rating: 'slips',
          played,
          note: `Right notes and steady, a little behind the click: ♩ ${played} instead of ${P.plan.bpm}.`,
        };
      }
      if (notesOk)
        return {
          rating: 'slips',
          played,
          note: 'Right notes; the timing was uneven. Listen for the click and lean on it.',
        };
      if (an.accuracy >= 0.9 && an.wrong <= 2)
        return {
          rating: 'slips',
          played,
          note:
            sentence([
              an.accuracy < 1 && `${d.steps.length - an.matched} missed`,
              an.wrong && `${an.wrong} wrong note${an.wrong > 1 ? 's' : ''}`,
            ]) || 'Close.',
        };
      return {
        rating: 'messy',
        played,
        note: sentence([
          an.accuracy < 1 && `${d.steps.length - an.matched} of ${d.steps.length} missed`,
          an.wrong && `${an.wrong} wrong note${an.wrong > 1 ? 's' : ''}`,
        ]),
      };
    }

    /* ---------- after every rep ---------- */
    function report(r) {
      P.repN++;
      const before = itemState(id) ? itemState(id).stage : null;
      const out = recordRep(id, r);
      const next = planFor(id);
      P.sameNext = !!next && next.mode === P.plan.mode && next.hand === P.plan.hand && !P.drill.fresh;
      log('rep', {
        mode: r.mode,
        hand: r.hand,
        rating: r.rating,
        acc: Math.round((r.acc || 0) * 100) / 100,
        wrong: r.wrong,
        hes: r.hes,
        sd: r.sd != null ? Math.round(r.sd * 1000) / 1000 : undefined,
        tr: r.tempoRatio ? Math.round(r.tempoRatio * 100) / 100 : undefined,
        bpm: r.bpm,
        valid: r.valid,
        change: out.change,
      });
      msg(out.msg || r.msg || (r.clean ? 'Clean.' : 'Again.'), out.tone || (r.clean ? 'ok' : 'bad'));
      if (r.mode === 'tempo' && r.an) showTiming(r.an);
      onEvent({ type: 'rep', r, out, stageBefore: before });
      if (P.dead || P.held) return;
      const delay =
        out.change === 'stage' || out.change === 'done' || out.change === 'phase'
          ? 3200
          : r.mode === 'tempo'
            ? 2600
            : 1400;
      later(() => {
        replan('after rep');
        startRep();
      }, delay);
    }
    function showTiming(an) {
      if (!an || !an.res.length) return;
      // a strip of dots: how early or late each note was compared with your own steady tempo
      const n = an.res.length;
      const W = 300,
        H = 36;
      let s = `<line x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}" class="ln"/>`;
      an.res.forEach((r, i) => {
        const x = 8 + (i * (W - 16)) / Math.max(1, n - 1);
        if (!r.ok) {
          s += `<text x="${x}" y="${H / 2 + 4}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--bad)">×</text>`;
          return;
        }
        const y = H / 2 - clamp((r.dev || 0) / (an.msPerBeatPlayed || 1) / 0.25, -1, 1) * (H / 2 - 4);
        s += `<circle cx="${x}" cy="${y}" r="2.6" fill="var(--rh)"/>`;
      });
      const cue = $p('#plCue');
      if (cue)
        cue.innerHTML = `<span>Timing</span><svg viewBox="0 0 ${W} ${H}" class="timing-strip" aria-label="How early or late each note was">${s}</svg>`;
    }

    /* ---------- input ---------- */
    const onNote = Log.guard('player note', ev => {
      if (P.dead || !P.plan) return;
      if (P.plan.mode === 'improv') return;
      if (P.plan.mode === 'wait') {
        if (['ready', 'wait', 'review'].includes(P.phase)) W.note(ev);
      } else T.note(ev);
    });
    P.offs.push(Input.on(onNote));
    if (k === 'rhythm') {
      const tap = $p('#plTap');
      const fire = () => onNote({ m: 60, vel: 0.7, t: performance.now(), src: 'touch-tap' });
      tap.addEventListener('pointerdown', e => {
        e.preventDefault();
        fire();
      });
      const kd = e => {
        if (e.code === 'Space' && !e.repeat && !(e.target && /INPUT|TEXTAREA/.test(e.target.tagName))) {
          e.preventDefault();
          fire();
        }
      };
      document.addEventListener('keydown', kd);
      P.offs.push(() => document.removeEventListener('keydown', kd));
    }
    $p('#plGo').onclick = Log.guard('player go', () => {
      AudioEngine.ensure();
      if (P.plan.mode === 'wait') {
        log('restart');
        startRep();
        return;
      }
      if (['countin', 'tempo'].includes(P.phase)) {
        Metro.stop();
        T.unwatch();
        cancel();
        setPhase('stopped');
        msg('Stopped. Tap Start, or play any key, when you are ready.');
        return;
      }
      if (P.phase === 'review') {
        cancel();
        setPhase('stopped');
        msg('Paused. Tap Start, or play any key, when you are ready.');
        return;
      }
      T.countIn();
    });
    $p('#plHear').onclick = Log.guard('player hear', () => {
      const d = P.drill;
      if (!d) return;
      const bpm = P.plan.mode === 'tempo' ? P.plan.bpm : Math.min(P.plan.bpm || 60, P.def.target || 60);
      const spb = 60 / bpm;
      const t0 = AudioEngine.now() + 0.1;
      if (d.any) {
        for (let b = 0; b < d.beats; b++) AudioEngine.click(t0 + b * spb, b % d.meter[0] === 0, 0.5);
        d.steps.forEach(s => AudioEngine.note(72, t0 + s.beat * spb, 0.25, 0.6));
        return;
      }
      d.steps.forEach(s =>
        s.midis.forEach(m =>
          AudioEngine.note(m, t0 + s.beat * spb, Math.max(0.25, (s.dur || 0.5) * spb * 0.95), 0.55),
        ),
      );
    });
    $p('#plAbout').onclick = () => aboutDrill(id);
    // leaving the app (screen off, another app) stops the metronome; any key or Start resumes
    const onVis = () => {
      if (
        document.visibilityState === 'hidden' &&
        ['countin', 'tempo', 'review'].includes(P.phase) &&
        P.plan.mode === 'tempo'
      ) {
        Metro.stop();
        T.unwatch();
        cancel();
        setPhase('stopped');
        msg('Paused while the app was in the background. Tap Start, or play any key.');
      }
    };
    document.addEventListener('visibilitychange', onVis);
    P.offs.push(() => document.removeEventListener('visibilitychange', onVis));

    Player.debug = { P, W, T }; // for automated tests
    replan('init');
    if (P.plan && P.plan.mode !== 'improv') startRep();
    log('mounted', { role, stage: (itemState(id) || {}).stage });
    return {
      get phase() {
        return P.phase;
      },
      get plan() {
        return P.plan;
      },
      hold(on) {
        P.held = on;
        if (on) cancel();
      },
      destroy() {
        if (P.dead) return;
        P.dead = true;
        cancel();
        clearTimeout(W.hintT);
        T.unwatch();
        Metro.stop();
        if (P.improv) P.improv.stop();
        P.offs.forEach(f => {
          try {
            f();
          } catch (e) {}
        });
        log('destroyed');
      },
    };
  },
};

// ---- learn/sessions.js ----
/* Today's session: what to practice, in what order (where each skill stands is in status.js).
     1. cold checks (at most two): the first time you play something today is the honest test
     2. this week's focus: two items from the focus area, most of the time
     3. pieces marked for daily practice, when pieces are not the focus
     4. a little upkeep: spaced reviews that are due, or a few minutes on an area that has waited
   A piece session (for a longer sitting with your pieces) is built the same way from your pieces only. */

// the items an area works on today, most important first
function focusItems(area) {
  const ids = areaSkills(area)
    .map(sk => skillStatus(sk).focus)
    .filter(Boolean);
  if (area === 'reading') {
    // the weaker clef first: fewer integrated units
    const done = sk => skillStatus(sk).done;
    if (ids.length === 2 && done('bass') < done('treble')) ids.reverse();
  }
  if (area === 'technique' || area === 'theory' || area === 'sight') {
    // two neighbouring items, the current one and the next, so a session is not one thing for half an
    // hour; but only one at a time while its notes are still being learned (a new item starts there)
    const st = skillStatus(area);
    const next = st.order.find(id => id !== st.focus && !isDone(id) && !st.checks.includes(id));
    const learning = ids.length && (itemState(ids[0]) || { stage: 'learn' }).stage === 'learn';
    if (next && ids.length && !learning) ids.push(next);
  }
  return ids.slice(0, 2);
}

function dueReviews() {
  const t = todayKey();
  const working = new Set(workingPieces().map(w => w.pid));
  return Object.entries(Store.s.items)
    .filter(([id, it]) => {
      const d = itemDef(id);
      return (
        d &&
        d.review &&
        it.stage === 'done' &&
        it.due &&
        it.due <= t &&
        areaOn(d.area) &&
        (d.area !== 'pieces' || working.has(d.pid))
      );
    })
    .sort((a, b) => a[1].due.localeCompare(b[1].due))
    .map(([id]) => id);
}

function lastPlayed(area) {
  let last = '';
  for (const [id, it] of Object.entries(Store.s.items))
    if (it.last && it.last > last && (itemDef(id) || {}).area === area) last = it.last;
  return last;
}

function buildSession() {
  const t = todayKey();
  const focus = currentFocus();
  const list = [];
  const add = (id, role) => {
    if (id && !list.some(e => e.id === id) && itemDef(id))
      list.push({ id, role, reps: 0, ok: 0, ms: 0, state: 'todo' });
  };
  // 1. cold checks
  const checks = AREAS.filter(a => areaOn(a.id)).flatMap(a =>
    areaSkills(a.id).flatMap(sk => skillStatus(sk).checks.filter(id => (itemState(id) || {}).lastCold !== t)),
  );
  checks.slice(0, 2).forEach(id => add(id, 'check'));
  // 2. the focus
  if (focus) focusItems(focus.area).forEach(id => add(id, 'focus'));
  // 3. daily pieces (unless pieces are the focus already, or switched off)
  if (areaOn('pieces') && (!focus || focus.area !== 'pieces'))
    workingPieces()
      .filter(w => w.daily)
      .forEach(w => add(skillStatus('p:' + w.pid).focus, 'daily'));
  // 4. upkeep: reviews, or an area that has waited longest
  const reviews = dueReviews().slice(0, 2);
  reviews.forEach(id => add(id, 'review'));
  if (!reviews.length) {
    const waiting = AREAS.filter(a => areaOn(a.id) && a.id !== (focus && focus.area) && a.id !== 'pieces')
      .map(a => ({ a: a.id, last: lastPlayed(a.id), id: focusItems(a.id)[0] }))
      .filter(x => x.id && !list.some(e => e.id === x.id))
      .sort((x, y) => x.last.localeCompare(y.last));
    if (waiting[0]) add(waiting[0].id, 'warm');
  }
  // nothing new to start (everything waits for its cold check): keep those items warm
  if (!list.some(e => e.role === 'focus'))
    AREAS.filter(a => areaOn(a.id)).forEach(a =>
      areaSkills(a.id).forEach(sk =>
        skillStatus(sk).checks.forEach(id => list.length < 4 && add(id, 'focus')),
      ),
    );
  Store.s.sessions = (Store.s.sessions || 0) + 1;
  const s = { day: t, n: Store.s.sessions, list, idx: 0, started: Date.now(), focus: focus && focus.area };
  Log.ev('session built', { day: t, focus: focus && focus.area, list: list.map(e => e.role + ' ' + e.id) });
  return s;
}

// today's session, built on first use each day
function currentSession() {
  const t = todayKey();
  let s = Store.s.session;
  if (!s || s.day !== t || !Array.isArray(s.list)) {
    s = Store.s.session = buildSession();
    Store.save();
  }
  dropMissing(s);
  return s;
}

// rebuild today's session (after the focus changes), keeping what is already done
function rebuildSession() {
  const old = Store.s.session;
  const s = buildSession();
  if (old && old.day === s.day) {
    const done = old.list.filter(e => e.state === 'done');
    s.list = done.concat(s.list.filter(e => !done.some(d => d.id === e.id)));
    s.idx = done.length;
  }
  Store.s.session = s;
  Store.save();
  return s;
}

/* ---------- a longer sitting with your pieces ---------- */
function pieceSession(minutes) {
  const t = todayKey();
  const list = [];
  const add = (id, role, box) => {
    if (id && !list.some(e => e.id === id) && itemDef(id))
      list.push({ id, role, reps: 0, ok: 0, ms: 0, state: 'todo', box });
  };
  const pieces = workingPieces();
  const per = Math.max(8, Math.round(minutes / Math.max(1, pieces.length)));
  for (const w of pieces) {
    const st = skillStatus('p:' + w.pid);
    st.checks.filter(id => (itemState(id) || {}).lastCold !== t).forEach(id => add(id, 'check'));
    if (st.focus) add(st.focus, 'focus', Math.round(per * 0.7));
    // the next section too, when there is time: learning in overlapping chunks joins them
    const next = st.order.find(
      id => id !== st.focus && !isDone(id) && !st.checks.includes(id) && !id.endsWith(':full'),
    );
    if (next && per >= 12) add(next, 'focus', Math.round(per * 0.3));
  }
  dueReviews()
    .filter(id => id.startsWith('p:'))
    .forEach(id => add(id, 'review'));
  const s = { day: t, kind: 'pieces', minutes, list, idx: 0, started: Date.now() };
  Store.s.pieceSession = s;
  Log.ev('piece session built', { minutes, list: list.map(e => e.role + ' ' + e.id) });
  Store.save();
  return s;
}

function dropMissing(s) {
  // drop entries whose item no longer exists (a piece was removed)
  const before = s.list.length;
  s.list = s.list.filter(e => itemDef(e.id));
  if (s.list.length !== before) {
    s.idx = Math.min(s.idx, Math.max(0, s.list.length - 1));
    Store.save();
  }
}

/* ---------- the pieces you work on ---------- */
const MAX_PIECES = 4;

// start (or resume) working on a piece; progress on its sections is kept if you worked on it before
function workOnPiece(pid, { daily = false } = {}) {
  const P = Store.s.piece;
  if (P.working.some(w => w.pid === pid)) return true;
  if (P.working.length >= MAX_PIECES) return false;
  P.working.push({ pid, daily });
  P.added[pid] = P.added[pid] || todayKey();
  Log.ev('working on piece', { pid, daily });
  refreshToday();
  return true;
}

// stop working on a piece; its progress stays, ready if you come back
function stopPiece(pid) {
  const P = Store.s.piece;
  P.working = P.working.filter(w => w.pid !== pid);
  Log.ev('stopped piece', { pid });
  refreshToday();
}

function setPieceDaily(pid, daily) {
  const w = Store.s.piece.working.find(x => x.pid === pid);
  if (!w) return;
  w.daily = daily;
  Log.ev('piece daily', { pid, daily });
  refreshToday();
}

// a change in your pieces changes today's plan: rebuild the parts not started yet
function refreshToday() {
  const s = Store.s.session;
  if (s && s.day === todayKey()) rebuildSession();
  else Store.save();
}

// ---- learn/assess.js ----
/* The placement check: about eight minutes that set where each skill starts.
     reading  notes one at a time on the treble staff, then the bass, in rising levels
     scale    C major, right hand, then both hands, at a speed you choose
     theory   questions answered by playing, easiest first, until two in a row are missed
     pulse    play with the click, then keep the beat on your own when it stops
   A level counts as passed with at least two of three notes right, found within three seconds.
   Passed units are marked integrated (they come back for a review, which confirms the placement);
   the first level not passed becomes the next thing to learn. */

/* ---------- reading ---------- */
// per clef: the unit each level stands for, and the staff positions (diatonic steps) it draws from
const READ_LEVELS = {
  treble: [
    { unit: 'r:r1', dia: [28, 32] },
    { unit: 'r:r3', dia: [28, 35] },
    { unit: 'r:r5', dia: [28, 39] },
    { unit: 'r:r8t', dia: [25, 27, 40, 43] },
  ],
  bass: [
    { unit: 'r:r2', dia: [21, 25] },
    { unit: 'r:r4', dia: [21, 28] },
    { unit: 'r:r6', dia: [17, 28] },
    { unit: 'r:r8b', dia: [14, 16, 29, 31] },
  ],
};
const NOTES_PER_LEVEL = 3;
const FOUND_MS = 3000;

// the notes to show for a clef: three per level, never the same note twice in a row
function readingNotes(clef) {
  const out = [];
  for (const L of READ_LEVELS[clef]) {
    const [lo, hi, lo2, hi2] = L.dia;
    const pool = [];
    for (let d = lo; d <= hi; d++) pool.push(d);
    if (lo2 != null) for (let d = lo2; d <= hi2; d++) pool.push(d);
    for (let i = 0; i < NOTES_PER_LEVEL; i++) {
      let d = pick(pool);
      while (out.length && d === out[out.length - 1].dia && pool.length > 1) d = pick(pool);
      out.push({ dia: d, n: fromDia(d), midi: midiOf(fromDia(d)), level: READ_LEVELS[clef].indexOf(L) });
    }
  }
  return out;
}

// answers: [{level, ok, ms}] -> per level {ok, ms, passed}
function scoreReading(clef, answers) {
  return READ_LEVELS[clef].map((L, i) => {
    const a = answers.filter(x => x.level === i);
    const ok = a.filter(x => x.ok);
    const ms = median(ok.map(x => x.ms)) || null;
    return {
      unit: L.unit,
      tried: a.length,
      ok: ok.length,
      ms,
      passed: ok.length >= 2 && ms != null && ms <= FOUND_MS,
    };
  });
}

/* ---------- scale ---------- */
const C_MAJOR_UP_DOWN = [0, 2, 4, 5, 7, 9, 11, 12, 11, 9, 7, 5, 4, 2, 0];

// how many notes of the expected sequence were played in order: one extra or missed note costs one
// note, not everything after it (longest common subsequence)
function inOrder(played, expected, same) {
  const row = new Array(expected.length + 1).fill(0);
  for (const p of played) {
    let diag = 0;
    for (let j = 1; j <= expected.length; j++) {
      const up = row[j];
      row[j] = same(p, expected[j - 1]) ? diag + 1 : Math.max(row[j], row[j - 1]);
      diag = up;
    }
  }
  return row[expected.length];
}

// notes: [{m, t}] played; hands: 'rh' (one octave) or 'ht' (two octaves, both hands)
function scoreScale(notes, hands) {
  if (hands === 'rh') {
    if (!notes.length) return { right: 0, of: C_MAJOR_UP_DOWN.length, cv: null, bpm: null };
    // measured from the C nearest the first note
    const base = Math.round((notes[0].m - 60) / 12) * 12 + 60;
    const right = inOrder(
      notes.map(n => n.m - base),
      C_MAJOR_UP_DOWN,
      (a, b) => a === b,
    );
    return { right, of: C_MAJOR_UP_DOWN.length, ...evenness(notes.map(n => n.t)) };
  }
  // both hands: steps are pairs; a step is right when both hands play its pitch class
  const steps = [];
  for (const n of notes) {
    const last = steps[steps.length - 1];
    if (last && n.t - last.t < 120 && last.ms.length < 2) last.ms.push(n.m);
    else steps.push({ t: n.t, ms: [n.m] });
  }
  const octave = [0, 2, 4, 5, 7, 9, 11];
  const up = [...octave, ...octave.map(x => x + 12), 24];
  const seq = [...up, ...up.slice(0, -1).reverse()];
  const pc = m => ((m % 12) + 12) % 12;
  const right = inOrder(steps, seq, (s, x) => s.ms.length === 2 && s.ms.every(m => pc(m) === x % 12));
  return { right, of: seq.length, ...evenness(steps.map(s => s.t)) };
}

// spread of the time between notes (lower is more even) and the tempo, at two notes per beat
function evenness(ts) {
  const gaps = [];
  for (let i = 1; i < ts.length; i++) gaps.push(ts[i] - ts[i - 1]);
  const inner = gaps.slice(1, -1);
  if (inner.length < 4) return { cv: null, bpm: null };
  const mean = inner.reduce((a, b) => a + b, 0) / inner.length;
  const sd = Math.sqrt(inner.reduce((a, g) => a + (g - mean) ** 2, 0) / inner.length);
  return { cv: sd / mean, bpm: Math.round(60000 / (mean * 2)) };
}

/* ---------- theory ---------- */
// the questions, easiest first; each stands for a unit
const THEORY_STEPS = ['h1', 'h5', 'h2', 'h4', 'h3', 'h6', 'h8', 'h9', 'h10', 'h13', 'h12'];

// answers: [{unit, ok}] in order -> the units to mark integrated
function scoreTheory(answers) {
  const order = THEORY_UNITS.map(u => u.id);
  const firstMiss = answers.find(a => !a.ok);
  const passed = answers.filter(a => a.ok).map(a => order.indexOf(a.unit));
  if (!passed.length) return [];
  // everything up to the hardest right answer, but never past the first miss
  const limit = Math.min(Math.max(...passed), firstMiss ? order.indexOf(firstMiss.unit) - 1 : Infinity);
  return order.slice(0, limit + 1).filter(id => !answers.some(a => a.unit === id && !a.ok));
}

/* ---------- pulse ---------- */
// taps: [t]; clickTimes: the 8 clicks; returns timing scatter as a fraction of a beat, on your own
function scorePulse(taps, clickTimes, msBeat) {
  const lastClick = clickTimes[clickTimes.length - 1];
  const own = taps.filter(t => t > lastClick + msBeat * 0.5);
  if (own.length < 5) return null;
  const gaps = [];
  for (let i = 1; i < own.length; i++) gaps.push(own[i] - own[i - 1]);
  const mean = gaps.reduce((a, b) => a + b, 0) / gaps.length;
  const sd = Math.sqrt(gaps.reduce((a, g) => a + (g - mean) ** 2, 0) / gaps.length);
  return { sd: sd / msBeat, drift: Math.round((msBeat / mean - 1) * 100) };
}

/* ---------- applying the results ---------- */
function applyPlacement(r) {
  const done = [];
  for (const clef of ['treble', 'bass']) {
    const levels = r.reading && r.reading[clef];
    if (!levels) continue;
    for (const L of levels) {
      if (L.passed) {
        placeItem(L.unit, 'done');
        done.push(L.unit);
        continue;
      }
      // the first level not passed: start it at the right stage
      if (L.ok >= 2)
        placeItem(L.unit, 'pace', { pace: Math.round(Math.min(2600, Math.max(800, L.ms * 1.1)) / 50) * 50 });
      break;
    }
  }
  if (r.scale) {
    const { rh, ht } = r.scale;
    const rhOk = rh && rh.right >= rh.of - 1;
    const htOk = ht && ht.right >= ht.of - 2 && ht.cv != null && ht.cv < 0.18;
    if (htOk)
      placeItem('t:sc:major:C', 'tempo', {
        bpm: Math.max(52, Math.min(80, Math.round((ht.bpm || 52) * 0.9))),
      });
    else if (rhOk) placeItem('t:sc:major:C', 'learn', { phase: 'lh' });
  }
  for (const u of r.theory ? scoreTheory(r.theory) : []) {
    placeItem('h:' + u, 'done');
    done.push('h:' + u);
  }
  if (r.pulse) Store.s.steadyBase = { d: todayKey(), sd: r.pulse.sd };
  Store.s.profile.assessed = todayKey();
  Store.s.session = null; // today's session is rebuilt from the new starting points
  Store.s.focus = null;
  Log.ev('placement applied', { done, scale: !!r.scale, pulse: r.pulse && r.pulse.sd });
  Store.save();
  return done;
}

// ---- music/midiread.js ----
/* Reading a standard MIDI file: per track, its name and its events (notes, tempo, meter, key), with
   times in ticks. Making sense of them is in midifile.js. */

function parseMidiFile(buf) {
  const v = new DataView(buf);
  let p = 0;
  const str = n => {
    let s = '';
    for (let i = 0; i < n; i++) s += String.fromCharCode(v.getUint8(p + i));
    return s;
  };
  if (str(4) !== 'MThd') throw new Error('This is not a standard MIDI file.');
  const hl = v.getUint32(4);
  const fmt = v.getUint16(8),
    ntr = v.getUint16(10),
    div = v.getUint16(12);
  p = 8 + hl;
  if (div & 0x8000) throw new Error('This MIDI file uses SMPTE timing, which is not supported.');
  if (fmt === 2) throw new Error('MIDI format 2 files are not supported.');
  const tracks = [];
  for (let t = 0; t < ntr && p < buf.byteLength; t++) {
    if (str(4) !== 'MTrk') throw new Error('Damaged MIDI file (missing track header).');
    const len = v.getUint32(p + 4);
    let q = p + 8;
    const end = q + len;
    let tick = 0,
      rs = 0;
    const ev = [];
    let name = '';
    const vlq = () => {
      let x = 0,
        b;
      do {
        b = v.getUint8(q++);
        x = x * 128 + (b & 0x7f);
      } while (b & 0x80 && q < end);
      return x;
    };
    while (q < end) {
      tick += vlq();
      let st = v.getUint8(q);
      if (st & 0x80) q++;
      else st = rs;
      if (st === 0xff) {
        const type = v.getUint8(q++);
        const l = vlq();
        const data = new Uint8Array(buf, q, l);
        q += l;
        if (type === 0x51 && l === 3)
          ev.push({ tick, k: 'tempo', us: (data[0] << 16) | (data[1] << 8) | data[2] });
        else if (type === 0x58 && l >= 2) ev.push({ tick, k: 'time', n: data[0], d: Math.pow(2, data[1]) });
        else if (type === 0x59 && l >= 2) ev.push({ tick, k: 'key', sf: (data[0] << 24) >> 24, mi: data[1] });
        else if (type === 0x03) name = String.fromCharCode(...data);
        else if (type === 0x2f) break;
        continue;
      }
      if (st === 0xf0 || st === 0xf7) {
        const l = vlq();
        q += l;
        continue;
      }
      rs = st;
      const cmd = st & 0xf0,
        ch = st & 0x0f;
      const d1 = v.getUint8(q++);
      const d2 = cmd === 0xc0 || cmd === 0xd0 ? 0 : v.getUint8(q++);
      if (cmd === 0x90 && d2 > 0) ev.push({ tick, k: 'on', m: d1, vel: d2, ch });
      else if (cmd === 0x80 || (cmd === 0x90 && d2 === 0)) ev.push({ tick, k: 'off', m: d1, ch });
    }
    tracks.push({ name, ev });
    p = end;
  }
  return { div, tracks };
}

// ---- music/midifile.js ----
/* Importing your own MIDI files into the library. */

function importMidi(buf, fileName, split = 'auto') {
  const { div, tracks } = parseMidiFile(buf);
  const notes = [];
  const meta = { time: [], key: null, tempo: null };
  tracks.forEach((tr, ti) => {
    const open = new Map();
    tr.ev.forEach(e => {
      if (e.k === 'time') meta.time.push([e.tick, e.n, e.d]);
      else if (e.k === 'key' && !meta.key) meta.key = e;
      else if (e.k === 'tempo' && !meta.tempo) meta.tempo = e.us;
      if (e.ch === 9) return; // drums
      const key = e.ch * 128 + e.m;
      if (e.k === 'on') {
        if (open.has(key)) {
          const o = open.get(key);
          o.d = e.tick - o.t;
        }
        const n = { t: e.tick, d: 0, m: e.m, ti, ch: e.ch, vel: e.vel };
        open.set(key, n);
        notes.push(n);
      } else if (e.k === 'off' && open.has(key)) {
        const o = open.get(key);
        o.d = e.tick - o.t;
        open.delete(key);
      }
    });
  });
  if (notes.length < 4) throw new Error('No notes found in this file.');
  if (notes.length > 6000)
    throw new Error('This file is very long (over 6,000 notes). Split it into shorter files.');
  // hands: by track when there are two or more note tracks, otherwise split at middle C
  const byTrack = {};
  notes.forEach(n => (byTrack[n.ti] = byTrack[n.ti] || []).push(n.m));
  const tks = Object.keys(byTrack);
  const useTracks = split === 'tracks' || (split === 'auto' && tks.length >= 2);
  if (useTracks && tks.length >= 2) {
    const avg = Object.fromEntries(tks.map(k => [k, meanOf(byTrack[k])]));
    const hi = tks.slice().sort((a, b) => avg[b] - avg[a])[0];
    notes.forEach(n => (n.h = String(n.ti) === hi ? 0 : avg[n.ti] >= 60 && tks.length > 2 ? 0 : 1));
  } else notes.forEach(n => (n.h = n.m >= 60 ? 0 : 1));
  // snap onsets to a fine grid so chords line up even in hand-played files
  const grid = div / 24;
  notes.forEach(n => {
    n.t = Math.round(n.t / grid) * grid;
    n.d = Math.max(grid, Math.round(n.d / grid) * grid);
  });
  notes.sort((a, b) => a.t - b.t || a.h - b.h || a.m - b.m);
  const t0 = notes[0].t;
  notes.forEach(n => (n.t -= t0));
  // key and spelling
  let sig = meta.key ? clamp(meta.key.sf, -7, 7) : null;
  if (sig == null) {
    const k = detectKey(notes.map(n => n.m));
    sig = k ? k.best.sig : 0;
  }
  const sp = spellerFor(clamp(sig, -6, 6));
  // bars from the first time signature (later changes are applied too)
  const ts = meta.time.length ? meta.time.sort((a, b) => a[0] - b[0]) : [[0, 4, 4]];
  const endTick = Math.max(...notes.map(n => n.t + n.d));
  const bars = [0];
  let tk = 0,
    ti2 = 0;
  while (tk < endTick && bars.length < 2000) {
    while (ti2 + 1 < ts.length && ts[ti2 + 1][0] - t0 <= tk) ti2++;
    const [, n, d] = ts[ti2];
    tk += (div * 4 * n) / d;
    bars.push(tk);
  }
  const qbpm = meta.tempo ? Math.round(60e6 / meta.tempo) : 80;
  // pack like the built-in library (tpq = 24)
  const tpq = 24;
  const toTicks = x => Math.round((x / div) * tpq);
  const bytes = [];
  const vi = n => {
    do {
      let b = n & 0x7f;
      n = Math.floor(n / 128);
      if (n) b |= 0x80;
      bytes.push(b);
    } while (n);
  };
  let pt = 0;
  const prev = [60, 48];
  notes.forEach(n => {
    const t = toTicks(n.t);
    vi(t - pt);
    pt = t;
    vi(toTicks(n.d));
    const dz = n.m - prev[n.h];
    prev[n.h] = n.m;
    vi(dz >= 0 ? dz * 2 : -dz * 2 - 1);
    const s = sp(n.m);
    bytes.push(s.a + 2 + 5 * n.h + 10 * n.h);
  });
  const bb = [];
  let pb = 0;
  bars.forEach(b => {
    const t = toTicks(b);
    let x = t - pb;
    pb = t;
    do {
      let c = x & 0x7f;
      x = Math.floor(x / 128);
      if (x) c |= 0x80;
      bb.push(c);
    } while (x);
  });
  const b64 = arr => btoa(String.fromCharCode(...arr));
  const b64big = arr => {
    let s = '';
    for (let i = 0; i < arr.length; i += 8192) s += String.fromCharCode(...arr.slice(i, i + 8192));
    return btoa(s);
  };
  const nb = bars.length - 1;
  // sections of four bars; one in which no note starts (a long rest or a held chord) joins the one before
  const secs = [];
  const starts = (a, z) => notes.some(n => n.t >= bars[a] && n.t < bars[z]);
  for (let a = 0; a < nb; a += 4) {
    const z = Math.min(nb, a + 4);
    if (secs.length && !starts(a, z)) secs[secs.length - 1][1] = z;
    else secs.push([a, z, -1]);
  }
  const title =
    fileName
      .replace(/\.(mid|midi)$/i, '')
      .replace(/[_-]+/g, ' ')
      .trim() || 'My piece';
  return {
    id: 'mine-' + Date.now().toString(36),
    t: title,
    sub: '',
    c: 'mine',
    y: '',
    lvl: 3,
    bpm: clamp(qbpm, 30, 220),
    tip:
      'Imported from your MIDI file. Hands were assigned ' +
      (useTracks ? 'by track' : 'by splitting at middle C') +
      '.',
    tempos: [],
    tpq,
    shift: 0,
    pickup: false,
    nb,
    // time signatures by bar (one after the last bar is dropped)
    ts: ts.map(([tick, n, d]) => [bars.findIndex(b => b >= tick - t0), n, d]).filter(x => x[0] >= 0),
    keys: [[0, sig]],
    clefs: [
      [0, 0, 't'],
      [0, 1, 'b'],
    ],
    bars: b64(bb),
    notes: b64big(bytes),
    fing: '',
    n: notes.length,
    secs,
    lic: 'Your file',
    by: '',
    mut: '',
    src: fileName,
    imported: Date.now(),
  };
}

// ---- views/library.js ----
/* Library: the music you want to learn, and importing your own. */

const libraryView = (page, params = {}) => {
  const P = Store.s.profile;
  const fav = new Set(P.favorites);
  const all = Library.all();
  const composers = Object.keys(COMPOSERS);
  // your favorite composers first, otherwise in the usual order
  const order = composers
    .slice()
    .sort((a, b) => fav.has(b) - fav.has(a) || composers.indexOf(a) - composers.indexOf(b));
  const composerChip = ([k, c]) =>
    `<button type="button" class="chip" data-fav="${k}" aria-pressed="${fav.has(k)}">${esc(c.short)}</button>`;
  page.innerHTML = `
    <div class="stack">
      <span class="eyebrow">Library</span>
      <h1 class="h1">Music to <em>learn</em>.</h1>
      <p class="lead">Real scores, note for note, from public-domain and Creative Commons editions.
        DaCapo teaches each piece section by section and checks every note.</p>
    </div>
    ${workingCard()}
    <div class="card">
      <div class="cardhead">
        <h2 class="h2">Your composers</h2>
        <span class="small">Shown first; used for suggestions</span>
      </div>
      <div class="chips">${Object.entries(COMPOSERS)
        .filter(([k]) => k !== 'mine')
        .map(composerChip)
        .join('')}</div>
    </div>
    ${order.map(c => composerCard(c, all)).join('')}
    <p class="small">Scores: the Mutopia Project (mutopiaproject.org). Each piece shows its license and
      typesetter. Suggested listening and full scores open on YouTube and IMSLP.</p>`;
  page.querySelectorAll('[data-fav]').forEach(b => {
    b.onclick = () => {
      const k = b.dataset.fav;
      const s = new Set(P.favorites);
      if (s.has(k)) s.delete(k);
      else s.add(k);
      P.favorites = [...s];
      Store.save();
      go('library');
    };
  });
  page.querySelectorAll('[data-open]').forEach(b => {
    b.onclick = () => pieceSheet(b.dataset.open);
  });
  page.querySelectorAll('[data-practice]').forEach(b => {
    b.onclick = () => practicePiece(b.dataset.practice);
  });
  page.querySelectorAll('[data-daily]').forEach(input => {
    input.onchange = () => {
      setPieceDaily(input.dataset.daily, input.checked);
      toast(input.checked ? 'In daily practice' : 'Only when pieces are your focus, or in a piece session');
    };
  });
  const ps = $('#lbSession', page);
  if (ps) ps.onclick = pieceSessionSheet;
  const imp = $('#lbImport', page);
  if (imp) imp.onchange = () => importSheet(imp.files[0]);
  if (params.pieceSession && workingPieces().length) pieceSessionSheet();
};

const isWorking = pid => workingPieces().some(w => w.pid === pid);

// practice the next section of a piece (or its cold check)
function practicePiece(pid) {
  const st = skillStatus('p:' + pid);
  const id = st.focus || st.checks[0];
  if (id) go('practice', { item: id });
  else toast('Every section is integrated. It comes back for reviews.');
}

// the pieces you work on, each with a daily-practice switch
function workingCard() {
  const pieces = workingPieces();
  const row = w => {
    const p = Library.get(w.pid);
    const st = skillStatus('p:' + w.pid);
    return `<div class="workrow">
      <div class="row between">
        <div class="grow">
          <div class="ttl">${esc(p.t)}</div>
          <div class="small">${esc((COMPOSERS[p.c] || {}).short || '')} · ${st.done} of ${st.total} integrated</div>
        </div>
        <button class="btn sm" type="button" data-open="${esc(p.id)}">More</button>
        <button class="btn sm cover" type="button" data-practice="${esc(p.id)}">Practice</button>
      </div>
      ${sectionMap(p.id)}
      <label class="toggle small-toggle">
        <input type="checkbox" data-daily="${esc(p.id)}" ${w.daily ? 'checked' : ''}>
        <span><b>In daily practice</b><span class="small">Otherwise it comes up when pieces are your
          focus, or in a piece session.</span></span>
      </label>
    </div>`;
  };
  return `<div class="card">
    <div class="cardhead">
      <h2 class="h2">Working on</h2>
      <span class="small">Up to ${MAX_PIECES} pieces</span>
    </div>
    ${pieces.length ? pieces.map(row).join('') : '<p class="small">Nothing yet. Open a piece below and choose "Work on this piece".</p>'}
    ${
      pieces.length
        ? `<div class="row"><button class="btn cover" type="button" id="lbSession">Start a piece session</button>
           <span class="small">A longer sitting with your pieces, for when you have time.</span></div>`
        : ''
    }
  </div>`;
}

function pieceSessionSheet() {
  openSheet(
    `<div class="sheethead"><h2 class="h2">Piece session</h2>${closeBtn}</div>
     <p class="small">A longer sitting with the pieces you work on: cold checks first, then the next sections,
       with the time shared between your pieces. Your daily session stays as it is.</p>
     <div class="row">${[15, 30, 45].map(m => `<button class="btn cover" type="button" data-min="${m}">${m} minutes</button>`).join('')}</div>`,
    sheet => {
      sheet.querySelectorAll('[data-min]').forEach(b => {
        b.onclick = () => {
          pieceSession(+b.dataset.min);
          closeSheet();
          go('practice', { session: 'pieces' });
        };
      });
    },
    { label: 'Piece session' },
  );
}

// difficulty as five dots
const levelDots = n =>
  `<span class="lvl" title="${LEVEL_NAMES[n] || ''}">` +
  [1, 2, 3, 4, 5].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('') +
  '</span>';

function composerCard(c, all) {
  const list = all.filter(p => p.c === c).sort((a, b) => a.lvl - b.lvl || a.t.localeCompare(b.t));
  if (!list.length && c !== 'mine') return '';
  const rows =
    list.map(pieceRow).join('') ||
    `<p class="small">Import a MIDI file of a piece you want to learn. Files exported from notation
       software (MuseScore, IMSLP, Mutopia) work best.</p>`;
  const importButton = `
    <div class="row">
      <label class="btn sm cover" style="cursor:pointer">Import a MIDI file<input type="file" id="lbImport"
        accept=".mid,.midi,audio/midi,audio/x-midi" hidden></label>
    </div>`;
  return `
    <div class="card">
      <div class="cardhead">
        <h2 class="h2">${esc(COMPOSERS[c].n)}</h2>
        <span class="small">${esc(COMPOSERS[c].life)}</span>
      </div>
      <div class="stack" style="gap:0">${rows}</div>
      ${c === 'mine' ? importButton : ''}
    </div>`;
}

function pieceRow(p) {
  const tag = isWorking(p.id)
    ? ' <span class="tag rh">working on</span>'
    : Store.s.piece.added[p.id]
      ? ' <span class="tag">started</span>'
      : '';
  return `
    <div class="piecerow">
      <div class="grow">
        <div class="ttl">${esc(p.t)}${tag}</div>
        <div class="small">${p.sub ? esc(p.sub) + ' · ' : ''}${levelDots(p.lvl)} ${LEVEL_NAMES[p.lvl] || ''}
          · ${p.nb} bars</div>
      </div>
      <button class="btn sm" type="button" data-open="${esc(p.id)}">Open</button>
    </div>`;
}

// one square per section, colored by its stage
function sectionMap(pid) {
  const square = s => {
    const it = itemState(sectionOriginal(`p:${pid}:${s.k}`));
    const cls = s.same >= 0 && !(it && it.stage === 'done') ? 'same' : it ? it.stage : '';
    const name = `Section ${s.k + 1}${s.same >= 0 ? ` (same as ${s.same + 1})` : ''}`;
    return `<i class="${cls}" title="${name}: ${it ? STAGE_TXT[it.stage] : 'not started'}"></i>`;
  };
  return `<div class="secmap" aria-label="Sections">${Library.sections(pid).map(square).join('')}</div>`;
}

function pieceSheet(pid) {
  const p = Library.get(pid);
  if (!p) return;
  const working = isWorking(pid);
  const started = !!Store.s.piece.added[pid];
  const mine = p.c === 'mine';
  const secs = Library.sections(pid);
  const sig = p.keys && p.keys[0] ? p.keys[0][1] : 0;
  const major = MAJOR_KEYS.find(k => k.sig === sig);
  const minor = MINOR_KEYS.find(k => k.sig === sig);
  const keyName = major ? `${prettyKey(major.k)} major / ${prettyKey(minor.k)} minor signature` : '';
  const meter = p.ts && p.ts[0] ? `${p.ts[0][1]}/${p.ts[0][2]}` : '';
  const links = mine
    ? ''
    : `<a class="btn ghost" href="${scoreUrl(p)}" target="_blank" rel="noopener">Score</a>
       <a class="btn ghost" href="${listenUrl(p)}" target="_blank" rel="noopener">Listen</a>`;
  const full = workingPieces().length >= MAX_PIECES;
  const action = working
    ? `<button class="btn cover big" type="button" id="psGo">Practice now</button>
       <button class="btn sm ghost" type="button" id="psStop" style="align-self:flex-start">Stop working on it</button>`
    : `<button class="btn cover big" type="button" id="psLearn" ${full ? 'disabled' : ''}>${started ? 'Work on it again' : 'Work on this piece'}</button>
       ${full ? `<p class="small">You are working on ${MAX_PIECES} pieces. Stop one to add another.</p>` : ''}`;
  const source = mine
    ? esc(p.src || '') + ' · stays on this device'
    : `Edition: ${esc(p.lic)}${p.by ? ' · typeset by ' + esc(p.by) : ''}${p.mut ? ' · ' + esc(p.mut) : ''}`;
  openSheet(
    `<div class="sheethead"><h2 class="h2">${esc(p.t)}</h2>${closeBtn}</div>
     <p class="small">${p.sub ? esc(p.sub) + ' · ' : ''}${esc((COMPOSERS[p.c] || {}).n || '')}${p.y ? ', ' + p.y : ''}</p>
     <p>${esc(p.tip || '')}</p>
     <div class="stats">
       <div class="stat"><b>${p.nb}</b><span>bars</span></div>
       <div class="stat"><b>${secs.length}</b><span>sections</span></div>
       <div class="stat"><b>♩ ${p.bpm}</b><span>target tempo</span></div>
       <div class="stat">
         <b>${LEVEL_NAMES[p.lvl] ? p.lvl + '/5' : '–'}</b><span>${esc(LEVEL_NAMES[p.lvl] || '')}</span>
       </div>
     </div>
     <p class="small">${esc(meter)}${meter && keyName ? ' · ' : ''}${esc(keyName)}</p>
     ${started ? sectionMap(pid) : ''}
     <div class="row">
       <button class="btn" type="button" id="psHear">Hear the opening</button>
       ${links}
     </div>
     ${action}
     ${started && !working ? '<p class="small">Your progress on it is kept from before.</p>' : ''}
     <p class="small">${source}</p>
     ${
       mine
         ? `<button class="btn sm ghost" type="button" id="psDel" style="align-self:flex-start">
              Remove this file</button>`
         : ''
     }`,
    sheet => {
      $('#psHear', sheet).onclick = () => playOpening(p);
      const learn = $('#psLearn', sheet);
      if (learn)
        learn.onclick = () => {
          workOnPiece(pid);
          closeSheet();
          go('library');
          toast(`Working on ${p.t}`);
        };
      const practice = $('#psGo', sheet);
      if (practice)
        practice.onclick = () => {
          closeSheet();
          practicePiece(pid);
        };
      const stop = $('#psStop', sheet);
      if (stop)
        stop.onclick = () => {
          stopPiece(pid);
          closeSheet();
          go('library');
          toast('Stopped. Its progress is kept.');
        };
      const del = $('#psDel', sheet);
      if (del) del.onclick = () => removeImport(pid);
      return () => AudioEngine.stopAll();
    },
    { label: p.t },
  );
}

// the first four bars (plus a pickup), at the target tempo
function playOpening(p) {
  AudioEngine.ensure();
  const bars = Library.bars(p.id);
  const end = bars[Math.min(4 + (p.pickup ? 1 : 0), bars.length - 1)];
  const spb = 60 / p.bpm;
  const t0 = AudioEngine.now() + 0.1;
  for (const n of Library.notes(p.id)) {
    if (n.t >= end) continue;
    AudioEngine.note(n.m, t0 + Math.max(0, n.t) * spb, Math.max(0.15, n.d * spb), n.h ? 0.42 : 0.55);
  }
}

function removeImport(pid) {
  Library.saveImports(Library.imports().filter(x => x.id !== pid));
  Library.forget(pid);
  stopPiece(pid);
  for (const k of Object.keys(Store.s.items)) if (k.startsWith(`p:${pid}:`)) delete Store.s.items[k];
  Store.save();
  closeSheet();
  go('library');
  toast('Removed');
}

function importSheet(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let piece = null;
    let err = '';
    let split = 'auto';
    const build = () => {
      try {
        piece = importMidi(reader.result, file.name, split);
        err = '';
      } catch (e) {
        piece = null;
        err = e.message || String(e);
        Log.warn('midi import failed', { name: file.name, err });
      }
    };
    build();
    const paint = sheet => {
      const body = $('#imBody', sheet);
      if (err) {
        body.innerHTML = `<div class="notice">${esc(err)}</div>`;
        return;
      }
      const notes = Library.decode(piece);
      const rh = notes.filter(n => n.h === 0).length;
      const lh = notes.length - rh;
      const hands = [
        ['auto', 'Automatic'],
        ['tracks', 'By track'],
        ['split', 'Split at middle C'],
      ];
      body.innerHTML = `
        <label class="field">Title<input class="input" id="imTitle" value="${esc(piece.t)}"></label>
        <div class="stats">
          <div class="stat"><b>${piece.n}</b><span>notes</span></div>
          <div class="stat"><b>${piece.nb}</b><span>bars</span></div>
          <div class="stat"><b>${rh}/${lh}</b><span>right / left hand</span></div>
          <div class="stat"><b>♩ ${piece.bpm}</b><span>tempo in the file</span></div>
        </div>
        <div class="row"><span class="small">Hands:</span>${seg('imSplit', hands, split)}</div>
        <label class="field">Target tempo (♩)<input class="input" id="imBpm" type="number" min="30"
          max="220" value="${piece.bpm}"></label>
        <button class="btn cover" type="button" id="imSave">Add to my library</button>`;
      bindSegs(body, {
        imSplit: v => {
          split = v;
          build();
          paint(sheet);
        },
      });
      $('#imSave', sheet).onclick = () => {
        piece.t = ($('#imTitle', sheet).value || piece.t).slice(0, 80);
        piece.bpm = clamp(+$('#imBpm', sheet).value || piece.bpm, 30, 220);
        if (!Library.saveImports([...Library.imports(), piece])) {
          toast('Not enough space on this device to keep this file.');
          return;
        }
        Log.ev('midi imported', { id: piece.id, notes: piece.n, bars: piece.nb });
        closeSheet();
        go('library');
        pieceSheet(piece.id);
      };
    };
    openSheet(
      `<div class="sheethead"><h2 class="h2">Import ${esc(file.name)}</h2>${closeBtn}</div>
       <div id="imBody" class="stack"></div>
       <p class="small">Imported pieces stay on this device (and in backups). Files exported from notation
         software give the cleanest result; recordings of live playing are rounded to the nearest 1/24 beat.</p>`,
      sheet => paint(sheet),
      { label: 'Import' },
    );
  };
  reader.onerror = () => toast('Could not read that file.');
  reader.readAsArrayBuffer(file);
}

// ---- core/files.js ----
/* Saving a file to the device (or through the Claude app when running inside it). */

/* ---------- backup ---------- */
async function saveFile(filename, data, type = 'application/json') {
  if (IN_CLAUDE) {
    try {
      const dl = await window.claude.use('downloads');
      if (!dl) throw new Error('downloads unavailable');
      await dl.save({ filename, data });
      toast('Saved');
      return true;
    } catch (e) {
      if (e && e.code === 'declined') return false;
      Log.warn('download failed', String((e && e.message) || e));
      toast(
        e && /extension/.test(e.code || '')
          ? 'The Claude app cannot save this kind of file. Open DaCapo in your browser to save it.'
          : 'Saving files is not available here.',
      );
      return false;
    }
  }
  try {
    const url = URL.createObjectURL(new Blob([data], { type }));
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Saved to your downloads');
    return true;
  } catch (e) {
    Log.err(e, 'save file');
    toast('Could not save the file.');
    return false;
  }
}
