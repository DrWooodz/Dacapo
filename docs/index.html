      if (!go) return;
      const info = $p('#plInfo');
      const mode = P.plan && P.plan.mode;
      if (mode === 'tempo') {
        go.hidden = false;
        go.textContent =
          { review: 'Pause', paused: 'Start', stopped: 'Start', needsound: 'Start' }[P.phase] || 'Stop';
      } else {
        go.hidden = P.phase !== 'wait';
        go.textContent = 'Restart';
      }
      if (info)
        info.textContent = !P.plan
          ? ''
          : mode === 'tempo'
            ? `♩ ${P.plan.bpm}`
            : P.plan.paced
              ? `Goal ${(P.plan.pace / 1000).toFixed(1)} s per note`
              : '';
    }

    /* ---------- (re)planning ---------- */
    function replan(reason) {
      const prevHand = P.plan && P.plan.hand,
        prevMode = P.plan && P.plan.mode;
      P.plan = src.plan(id);
      if (!P.plan) return;
      const needNew =
        !P.drill ||
        P.drill.fresh ||
        prevHand !== P.plan.hand ||
        prevMode !== P.plan.mode ||
        reason === 'init';
      if (needNew) {
        P.drill = buildDrill(P.def, P.plan);
        if (!P.drill) {
          msg('This drill could not be built.', 'bad');
          Log.warn('drill build failed', { id, plan: P.plan });
          return;
        }
      }
      P.lenient = Input.mode === 'mic' && P.drill.steps.some(s => s.midis.length > 1);
      log('plan', {
        reason,
        mode: P.plan.mode,
        hand: P.plan.hand,
        bpm: P.plan.bpm,
        hints: P.plan.hints,
        steps: P.drill.steps.length,
        rebuilt: needNew,
      });
      if (P.forceHints) {
        // after a wrong-octave or wrong-hand run, show the keys once
        P.plan.hints = true;
        P.forceHints = false;
      }
      hl = { cur: P.plan.mode === 'wait' ? 0 : -1, ok: new Set(), bad: new Set() };
      paintHead();
      paintStaff(0);
      paintKb(0, P.plan.hints || P.plan.mode === 'tempo');
    }
    function startRep() {
      // enter the ready state for the current plan
      cancel();
      W.reset();
      if (P.plan.mode === 'wait') {
        setPhase('ready');
        const s = P.drill.steps[0];
        msg(`Play the first note to begin${P.plan.hints ? ': ' + label(s) : ''}.`);
      } else if (P.plan.mode === 'tempo') {
        T.countIn();
      }
    }
    const label = s => (s ? s.notes.map(x => `${nameOf(x.n)}${x.f ? ` (${x.f})` : ''}`).join(' + ') : '');

    /* ---------- wait mode ---------- */
    const W = {
      i: 0,
      got: new Set(),
      t0: 0,
      err: [],
      times: [],
      last: 0,
      hintT: 0,
      hinted: new Set(),
      reset() {
        this.i = 0;
        this.got = new Set();
        this.err = new Array(P.drill.steps.length).fill(0);
        this.times = [];
        this.last = 0;
        this.hinted = new Set();
        this.touch = false;
        clearTimeout(this.hintT);
      },
      armHint() {
        clearTimeout(this.hintT);
        if (P.plan.hints) return;
        const i = this.i;
        this.hintT = setTimeout(() => this.showHint(i), 7000);
      },
      showHint(i) {
        clearTimeout(this.hintT);
        if (P.dead || (P.phase !== 'wait' && P.phase !== 'ready') || this.i !== i || this.hinted.has(i))
          return;
        this.hinted.add(i);
        paintKb(i, true);
        msg(`Hint: ${label(P.drill.steps[i])}`);
      },
      note(ev) {
        const d = P.drill;
        const s = d.steps[this.i];
        if (!s) return;
        const fits = m => sameNote(ev.m, m, ev.src);
        if (P.phase === 'review') {
          // playing the first note again starts the next rep at once, if it is the same drill
          if (!P.sameNext || !d.steps[0].midis.some(fits)) return;
          cancel();
          P.plan = src.plan(id);
          paintHead();
          W.reset();
          hl = { cur: 0, ok: new Set(), bad: new Set() };
          setPhase('ready');
        }
        if (P.phase === 'ready') {
          const s0 = d.steps[0];
          if (!s0.midis.some(fits)) {
            msg(`That was ${nameOf(spellerFor(d.sig)(ev.m))}. Start on ${label(s0)}.`, 'bad');
            flashKey($p('#plKb svg'), ev.m, 'bad', 400);
            return;
          }
          setPhase('wait');
          this.t0 = ev.t;
        }
        if (ev.src === 'touch') this.touch = true;
        const need = P.lenient && s.midis.length > 1 ? [s.midis.find(fits)].filter(x => x != null) : s.midis;
        const match = need.find(m => fits(m) && !this.got.has(m));
        if (match != null) {
          if (!this.got.size || ev.t - this.chordT > 1500) {
            this.got = new Set();
            this.chordT = ev.t;
          }
          this.got.add(match);
          flashKey($p('#plKb svg'), ev.m, 'ok', 180);
          if (this.got.size >= need.length) {
            this.times[this.i] = this.chordT;
            hl.ok.add(this.i);
            this.i++;
            this.got = new Set();
            if (this.i >= d.steps.length) return this.finish();
            hl.cur = this.i;
            paintStaff(this.i);
            paintKb(this.i, P.plan.hints);
            this.armHint(); // (windowed drawing follows this.i)
            msg(P.plan.hints ? `Next: ${label(d.steps[this.i])}` : `${this.i} of ${d.steps.length}`);
          }
        } else if (!s.midis.some(fits)) {
          this.err[this.i]++;
          flashKey($p('#plKb svg'), ev.m, 'bad', 450);
          const same = s.midis.find(m => m !== ev.m && (ev.m - m) % 12 === 0);
          msg(
            same != null
              ? `Right note, ${octaves(ev.m - same)} than written.`
              : `That was ${nameOf(spellerFor(d.sig)(ev.m))}.${P.plan.hints ? ' Next: ' + label(s) : ' Try again.'}`,
            'bad',
          );
          // two misses on one note: show it now rather than after the usual wait
          if (this.err[this.i] >= 2 && !P.plan.hints) this.showHint(this.i);
          if (!hl.bad.has(this.i)) {
            hl.bad.add(this.i);
            paintStaff(this.i);
          }
        }
      },
      finish() {
        clearTimeout(this.hintT);
        setPhase('review');
        hl.cur = -1;
        paintStaff();
        paintKb(-1, false);
        const d = P.drill;
        const n = d.steps.length;
        const gaps = [];
        for (let x = 1; x < this.times.length; x++) gaps.push(this.times[x] - this.times[x - 1]);
        // the time per note, from the second note on: how fast you find the notes
        const pace = gaps.length >= 3 ? Math.round(median(gaps)) : null;
        const med = median(gaps) || 600;
        // long pauses are noted, but wait mode is for taking your time: they never make a run unclean
        const hes = gaps.filter(g => g > Math.max(3000, med * 3)).length;
        const hinted = P.plan.hints ? 0 : this.hinted.size;
        // how even the run was at your own pace: the spread of the gaps between notes (0 = perfectly even)
        const mean = gaps.length ? gaps.reduce((a, b) => a + b, 0) / gaps.length : 0;
        const cv =
          gaps.length >= 3
            ? Math.sqrt(gaps.reduce((a, g) => a + (g - mean) ** 2, 0) / gaps.length) / mean
            : null;
        const wrongSteps = this.err.filter(e => e).length;
        const clean = wrongSteps === 0 && hinted === 0;
        const srcs = Input.mode;
        const valid = Input.live && Input.mode !== 'touch' && !P.lenient && !this.touch;
        const weak = weakHand(
          d,
          this.err.map((e, i) => (e ? i : -1)).filter(i => i >= 0),
        );
        report({
          mode: 'wait',
          hand: P.plan.hand,
          clean,
          rating: clean ? 'clean' : wrongSteps + hinted <= 1 ? 'slips' : 'messy',
          acc: 1 - wrongSteps / n,
          wrong: wrongSteps,
          hes,
          hinted,
          pace,
          cv,
          valid,
          weak,
          src: srcs,
          msg: clean ? '' : waitModeSlips(wrongSteps, hinted),
        });
      },
    };
    function weakHand(d, badIdx) {
      const c = { rh: 0, lh: 0 };
      badIdx.forEach(i =>
        (d.steps[i] ? d.steps[i].notes : []).forEach(x => {
          if (x.fcls === 'rh' || x.fcls === 'lh') c[x.fcls]++;
        }),
      );
      return c.rh === c.lh ? null : c.rh > c.lh ? 'rh' : 'lh';
    }

    /* ---------- metronome mode ---------- */
    const T = {
      ons: [],
      t0: 0,
      msBeat: 1000,
      offBeat: null,
      raf: 0,
      countIn() {
        cancel();
        hl = { cur: -1, ok: new Set(), bad: new Set() };
        const ac = AudioEngine.ensure();
        if (ac.state !== 'running') {
          // browsers only allow sound after a tap on the page; a key on the piano does not count
          setPhase('needsound');
          msg(
            'Tap the screen once to switch on the metronome. Browsers need one tap before they can play sound.',
            '',
          );
          const wake = Log.guard('sound unlock', () => {
            if (P.dead) return;
            if (AudioEngine.ctx.state === 'running') {
              document.removeEventListener('pointerdown', wake, true);
              clearInterval(P.soundPoll);
              log('sound unlocked');
              this.countIn();
            }
          });
          document.addEventListener(
            'pointerdown',
            () => {
              AudioEngine.ensure();
              setTimeout(wake, 150);
            },
            { capture: true, once: true },
          );
          clearInterval(P.soundPoll);
          P.soundPoll = setInterval(wake, 500);
          P.offs.push(() => clearInterval(P.soundPoll));
          return;
        }
        paintStaff(0);
        paintKb(0, true);
        const d = P.drill;
        const bpm = P.plan.bpm;
        this.msBeat = 60000 / bpm; // quarter-note beats
        const clickBpm = bpm / d.unit;
        const clicks = d.clicks || 4;
        this.ons = [];
        setPhase('countin');
        AudioEngine.ensure();
        const first = Metro.start({ bpm: clickBpm, beats: clicks, sub: 1, countIn: 1 });
        this.t0 = AudioEngine.toPerf(first);
        this.watch(clicks);
        msg(`Count-in, then play at ♩ ${bpm}. When you start exactly does not matter.`);
        const totalMs = (d.beats || 8) * this.msBeat;
        later(
          () => this.finish('timeout'),
          Math.max(1000, this.t0 + totalMs * 1.6 + 2200 - performance.now()),
        );
        this.follow();
      },
      watch(clicks) {
        if (this.offBeat) this.offBeat();
        const cnt = $p('#plCount'),
          dots = $p('#plBeats');
        if (dots) {
          dots.hidden = false;
          dots.innerHTML = '<i></i>'.repeat(Math.min(clicks, 12));
        }
        this.offBeat = Metro.on((kind, q) => {
          if (kind !== 'beat' || P.dead) return;
          if (dots)
            $$('i', dots).forEach((el, j) => {
              el.classList.toggle('on', j === q.beat);
              el.classList.toggle('acc', q.beat === 0);
            });
          if (!cnt) return;
          if (q.idx < clicks) {
            cnt.hidden = false;
            cnt.textContent = clicks - q.idx;
            cnt.className = 'countin' + (q.idx === clicks - 1 ? ' last' : '');
          } else if (q.idx === clicks) {
            cnt.hidden = false;
            cnt.textContent = 'Play';
            cnt.className = 'countin go';
            setTimeout(() => {
              if (cnt) cnt.hidden = true;
            }, 450);
            if (P.phase === 'countin') setPhase('tempo');
          }
        });
      },
      follow() {
        // keep the staff scrolled near where you should be
        cancelAnimationFrame(this.raf);
        const d = P.drill;
        const tick = () => {
          if (P.dead || !['countin', 'tempo'].includes(P.phase)) return;
          const beat = (performance.now() - this.t0) / this.msBeat;
          let i = d.steps.findIndex(s => s.beat >= beat);
          if (i < 0) i = d.steps.length - 1;
          if (P.win && (i >= P.win.w1 - 8 || i < P.win.w0)) paintStaff(i);
          if (i >= 0 && staffRes && staffRes.W > 560) scrollTo(i);
          this.raf = requestAnimationFrame(() => setTimeout(tick, 250));
        };
        tick();
      },
      unwatch() {
        if (this.offBeat) {
          this.offBeat();
          this.offBeat = null;
        }
        cancelAnimationFrame(this.raf);
        const c = $p('#plCount');
        if (c) c.hidden = true;
        const d = $p('#plBeats');
        if (d) d.hidden = true;
      },
      note(ev) {
        if (P.phase === 'paused' || P.phase === 'stopped') {
          log('resume by key');
          msg('Counting in…');
          later(() => this.countIn(), 400);
          setPhase('resuming');
          return;
        }
        if (!['countin', 'tempo'].includes(P.phase)) return;
        this.ons.push(ev);
        const d = P.drill;
        const ok = d.steps.some(s => s.midis.some(m => sameNote(ev.m, m, ev.src)));
        flashKey($p('#plKb svg'), ev.m, ok ? 'ok' : 'bad', 180);
        // the last note: is the run complete? (also when the whole run is an octave or two off, so it
        // ends at once and can be named, instead of waiting for the time-out)
        const last = d.steps[d.steps.length - 1];
        const lateEnough = last && performance.now() > this.t0 + last.beat * this.msBeat * 0.7 - this.msBeat;
        const shift = [0, 12, -12, 24, -24].find(
          sh => last && last.midis.some(m => sameNote(ev.m - sh, m, ev.src)),
        );
        if (lateEnough && shift != null) {
          const rel = this.ons
            .filter(o => o.t > this.t0 - this.msBeat * 1.5)
            .map(o => (shift ? { ...o, m: o.m - shift } : o));
          if (rel.length >= Math.max(2, d.steps.length * 0.6)) {
            const an = analyzeSeq(rel, d.steps, this.msBeat, { one: P.lenient });
            // an octave off: only right at the end, and only when nearly every note fits the shift
            const atEnd = performance.now() > this.t0 + (last.beat - 1.5) * this.msBeat;
            if (an.complete && (!shift || (atEnd && an.accuracy >= 0.8)))
              later(() => this.finish('complete'), 450);
          }
        }
      },
      finish(why) {
        if (!['countin', 'tempo'].includes(P.phase)) return;
        Metro.stop();
        this.unwatch();
        setPhase('review', why);
        const d = P.drill;
        const rel = this.ons.filter(o => o.t > this.t0 - this.msBeat * 1.5);
        if (rel.length < 2) {
          P.idle++;
          if (P.idle >= 2) {
            setPhase('paused');
            msg('Paused. Play any key when you are ready.', '');
            return;
          }
          msg(`I heard ${rel.length ? 'one note' : 'nothing'}. Again…`, 'bad');
          later(() => this.countIn(), 2600);
          return;
        }
        P.idle = 0;
        const an = analyzeSeq(rel, d.steps, this.msBeat, { one: P.lenient });
        an.res.forEach(r => {
          if (r.ok) hl.ok.add(r.i);
          else hl.bad.add(r.i);
        });
        hl.cur = -1;
        paintStaff();
        paintKb(-1, false);
        if (an.matched < d.steps.length * 0.5 && rel.length < d.steps.length * 0.5) {
          msg('That rep was cut short; it does not count. Again…');
          log('incomplete rep', { matched: an.matched });
          later(() => this.countIn(), 2600);
          return;
        }
        const judged = judgeTempoRun(an, d, rel);
        if (judged.ignore) {
          // the other hand's part: say so and run it again, without counting it
          msg(judged.note, 'bad');
          log('rep ignored', { why: judged.why });
          P.forceHints = true;
          later(() => {
            replan('after rep');
            startRep();
          }, 3200);
          return;
        }
        const valid = Input.live && Input.mode !== 'touch' && !P.lenient && !rel.some(o => o.src === 'touch');
        const weak = weakHand(
          d,
          an.res.filter(r => !r.ok).map(r => r.i),
        );
        report({
          mode: 'tempo',
          hand: P.plan.hand,
          clean: judged.rating === 'clean',
          rating: judged.rating,
          acc: an.accuracy,
          wrong: an.wrong,
          tempoRatio: an.tempoRatio,
          sd: d.even ? an.sdGap : an.sdBeat,
          bpm: P.plan.bpm,
          played: judged.played,
          adopt: judged.adopt,
          valid,
          weak,
          msg: judged.note,
          tech: techniqueReport(an, d),
          an,
        });
      },
    };

    /* ---------- judging a run with the metronome ---------- */
    // rating: 'clean' | 'slips' | 'messy', with a note; adopt: steady and faster than the click;
    // ignore: the other hand's part was played (does not count)
    function judgeTempoRun(an, d, rel) {
      const opts = { one: P.lenient };
      const played = Math.round(P.plan.bpm * an.tempoRatio);
      const mic = Input.mode === 'mic';
      // right notes in the wrong octave, or the other hand's part
      if (an.accuracy < 0.6) {
        for (const sh of [12, -12, 24, -24]) {
          const alt = analyzeSeq(
            rel.map(o => ({ ...o, m: o.m - sh })),
            d.steps,
            T.msBeat,
            opts,
          );
          if (alt.accuracy >= 0.8) {
            P.forceHints = true;
            return {
              rating: 'slips',
              played,
              note: `The right notes, but ${octaves(sh)} than written. Check the clef, then play it there.`,
            };
          }
        }
        if (d.ghost && d.ghost.length) {
          const other = new Set(d.ghost.map(n => midiOf(n.n)));
          const mine = new Set(d.steps.flatMap(s => s.midis));
          const theirs = rel.filter(o => other.has(o.m) && !mine.has(o.m)).length;
          if (theirs >= rel.length * 0.5)
            return {
              ignore: true,
              why: 'other hand',
              note: `That was the other hand's part. This run is ${handWord(P.plan.hand)}: play only the dark notes.`,
            };
        }
      }
      // timing: 1 good, 2 fair, 3 uneven
      const [v, lim] = d.piece
        ? [an.sdMs, Math.max(40, LIMIT.piece * T.msBeat * Math.max(an.gapBeats, 0.5))]
        : [an.sdGap, mic ? LIMIT.evenMic : LIMIT.even];
      const timing = v < lim ? 1 : v < lim * FAIR ? 2 : 3;
      const notesOk = an.accuracy === 1 && an.wrong <= (mic ? 1 : 0);
      const ratio = an.tempoRatio;
      if (notesOk && timing < 3) {
        if (Math.abs(ratio - 1) <= TEMPO_TOLERANCE)
          return {
            rating: 'clean',
            played,
            note: timing === 2 ? 'Clean; a few notes a little uneven. Let the click carry you.' : '',
          };
        if (ratio > 1)
          return {
            rating: 'clean',
            played,
            adopt: P.plan.mode === 'tempo',
            note: `Right notes and steady, at ♩ ${played}.`,
          };
        return {
          rating: 'slips',
          played,
          note: `Right notes and steady, a little behind the click: ♩ ${played} instead of ${P.plan.bpm}.`,
        };
      }
      if (notesOk)
        return {
          rating: 'slips',
          played,
          note: 'Right notes; the timing was uneven. Listen for the click and lean on it.',
        };
      if (an.accuracy >= 0.9 && an.wrong <= 2)
        return {
          rating: 'slips',
          played,
          note:
            sentence([
              an.accuracy < 1 && `${d.steps.length - an.matched} missed`,
              an.wrong && `${an.wrong} wrong note${an.wrong > 1 ? 's' : ''}`,
            ]) || 'Close.',
        };
      return {
        rating: 'messy',
        played,
        note: sentence([
          an.accuracy < 1 && `${d.steps.length - an.matched} of ${d.steps.length} missed`,
          an.wrong && `${an.wrong} wrong note${an.wrong > 1 ? 's' : ''}`,
        ]),
      };
    }

    /* ---------- after every rep ---------- */
    function report(r) {
      P.repN++;
      const before = src.state(id) ? src.state(id).stage : null;
      const out = src.record(id, r);
      const next = src.plan(id);
      P.sameNext = !!next && next.mode === P.plan.mode && next.hand === P.plan.hand && !P.drill.fresh;
      log('rep', {
        mode: r.mode,
        hand: r.hand,
        rating: r.rating,
        acc: Math.round((r.acc || 0) * 100) / 100,
        wrong: r.wrong,
        hes: r.hes,
        sd: r.sd != null ? Math.round(r.sd * 1000) / 1000 : undefined,
        tr: r.tempoRatio ? Math.round(r.tempoRatio * 100) / 100 : undefined,
        bpm: r.bpm,
        valid: r.valid,
        change: out.change,
      });
      msg(out.msg || r.msg || (r.clean ? 'Clean.' : 'Again.'), out.tone || (r.clean ? 'ok' : 'bad'));
      if (r.mode === 'tempo' && r.an) showTiming(r.an);
      onEvent({ type: 'rep', r, out, stageBefore: before });
      if (P.dead || P.held) return;
      const delay =
        out.change === 'stage' || out.change === 'done' || out.change === 'phase'
          ? 3200
          : r.mode === 'tempo'
            ? 2600
            : 1400;
      later(() => {
        replan('after rep');
        startRep();
      }, delay);
    }
    function showTiming(an) {
      if (!an || !an.res.length) return;
      // a strip of dots: how early or late each note was compared with your own steady tempo
      const n = an.res.length;
      const W = 300,
        H = 36;
      let s = `<line x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}" class="ln"/>`;
      an.res.forEach((r, i) => {
        const x = 8 + (i * (W - 16)) / Math.max(1, n - 1);
        if (!r.ok) {
          s += `<text x="${x}" y="${H / 2 + 4}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--bad)">×</text>`;
          return;
        }
        const y = H / 2 - clamp((r.dev || 0) / (an.msPerBeatPlayed || 1) / 0.25, -1, 1) * (H / 2 - 4);
        s += `<circle cx="${x}" cy="${y}" r="2.6" fill="var(--rh)"/>`;
      });
      const cue = $p('#plCue');
      if (cue)
        cue.innerHTML = `<span>Timing</span><svg viewBox="0 0 ${W} ${H}" class="timing-strip" aria-label="How early or late each note was">${s}</svg>`;
    }

    /* ---------- input ---------- */
    /* any octave (Moods practice, unless you ask for the exact one): a note counts in whatever octave you
       play it. It is read as the nearest written note with its name: the one you are on, in wait mode */
    const fold = ev => {
      const d = P.drill;
      if (!P.plan.anyOctave || !d || !d.steps.length) return ev;
      const step = P.plan.mode === 'wait' ? d.steps[P.phase === 'review' ? 0 : W.i] : null;
      const near = list =>
        list
          .filter(m => (((m - ev.m) % 12) + 12) % 12 === 0)
          .sort((a, b) => Math.abs(a - ev.m) - Math.abs(b - ev.m))[0];
      const m =
        (step && near(step.midis.filter(x => !W.got.has(x)))) ??
        (step && near(step.midis)) ??
        near(d.steps.flatMap(x => x.midis));
      return m == null || m === ev.m ? ev : { ...ev, m, played: ev.m };
    };
    const onNote = Log.guard('player note', raw => {
      if (P.dead || !P.plan) return;
      const ev = fold(raw);
      if (P.plan.mode === 'wait') {
        if (['ready', 'wait', 'review'].includes(P.phase)) W.note(ev);
      } else T.note(ev);
    });
    P.offs.push(Input.on(onNote));
    $p('#plGo').onclick = Log.guard('player go', () => {
      AudioEngine.ensure();
      if (P.plan.mode === 'wait') {
        log('restart');
        startRep();
        return;
      }
      if (['countin', 'tempo'].includes(P.phase)) {
        Metro.stop();
        T.unwatch();
        cancel();
        setPhase('stopped');
        msg('Stopped. Tap Start, or play any key, when you are ready.');
        return;
      }
      if (P.phase === 'review') {
        cancel();
        setPhase('stopped');
        msg('Paused. Tap Start, or play any key, when you are ready.');
        return;
      }
      T.countIn();
    });
    $p('#plHear').onclick = Log.guard('player hear', () => {
      const d = P.drill;
      if (!d) return;
      const bpm = P.plan.mode === 'tempo' ? P.plan.bpm : Math.min(P.plan.bpm || 60, P.def.target || 60);
      const spb = 60 / bpm;
      const t0 = AudioEngine.now() + 0.1;
      d.steps.forEach(s =>
        s.midis.forEach(m =>
          AudioEngine.note(m, t0 + s.beat * spb, Math.max(0.25, (s.dur || 0.5) * spb * 0.95), 0.55),
        ),
      );
    });
    $p('#plAbout').onclick = () => (about || src.about)(id);
    // leaving the app (screen off, another app) stops the metronome; any key or Start resumes
    const onVis = () => {
      if (
        document.visibilityState === 'hidden' &&
        ['countin', 'tempo', 'review'].includes(P.phase) &&
        P.plan.mode === 'tempo'
      ) {
        Metro.stop();
        T.unwatch();
        cancel();
        setPhase('stopped');
        msg('Paused while the app was in the background. Tap Start, or play any key.');
      }
    };
    document.addEventListener('visibilitychange', onVis);
    P.offs.push(() => document.removeEventListener('visibilitychange', onVis));

    Player.debug = { P, W, T }; // for automated tests
    replan('init');
    if (P.plan) startRep();
    log('mounted', { stage: (src.state(id) || {}).stage });
    return {
      get phase() {
        return P.phase;
      },
      get plan() {
        return P.plan;
      },
      hold(on) {
        P.held = on;
        if (on) cancel();
      },
      destroy() {
        if (P.dead) return;
        P.dead = true;
        cancel();
        clearTimeout(W.hintT);
        T.unwatch();
        Metro.stop();
        P.offs.forEach(f => {
          try {
            f();
          } catch (e) {}
        });
        log('destroyed');
      },
    };
  },
};

// ---- learn/sitting.js ----
/* Recording what you play: a recorder (any input: notes, releases, the pedal), used for takes you record
   yourself and for each sitting at Play, which is kept automatically (the last few) so its read-back in the
   journal can be listened to. Events: [ms, 'n', midi, velocity] | [ms, 'f', midi] | [ms, 'p', 0|1]. */

// when a sitting ends (this long without a note), and what counts as one
const SITTING = { quiet: 90000, minMs: 30000, minNotes: 30 };

function createRecorder() {
  const t0 = performance.now();
  const ev = [];
  const offs = [
    Input.on(e => ev.push([Math.round(e.t - t0), 'n', e.m, Math.round(e.vel * 127)])),
    Input.onOff(e => {
      if (e.pedal != null) ev.push([Math.round(e.t - t0), 'p', e.pedal ? 1 : 0]);
      else ev.push([Math.round(e.t - t0), 'f', e.m]);
    }),
  ];
  return {
    get notes() {
      return ev.filter(e => e[1] === 'n').length;
    },
    // the events from the first note, or null if nothing was played
    stop() {
      offs.splice(0).forEach(f => f());
      const out = ev.filter(e => e[0] >= -200).sort((a, b) => a[0] - b[0]);
      const first = out.find(e => e[1] === 'n');
      if (!first) return null;
      const at = first[0];
      out.forEach(e => (e[0] -= at));
      // (a very long sitting keeps its first part)
      return out.slice(0, 40000);
    },
  };
}

// the recordings of the last sittings, by journal entry
const KEY = 'dacapo.sittings';
const KEEP = 6;
const Sittings = {
  list() {
    try {
      const l = JSON.parse(localStorage.getItem(KEY) || '[]');
      return Array.isArray(l) ? l : [];
    } catch (e) {
      return [];
    }
  },
  get(id) {
    return this.list().find(x => x.id === id) || null;
  },
  save(id, ev) {
    let l = [{ id, d: Date.now(), ev, name: '' }, ...this.list()].slice(0, KEEP);
    // if the browser is full, keep fewer
    while (l.length)
      try {
        localStorage.setItem(KEY, JSON.stringify(l));
        return true;
      } catch (e) {
        l = l.slice(0, l.length - 1);
      }
    return false;
  },
};

// ---- core/files.js ----
/* Saving a file to the device (or through the Claude app when running inside it). */

/* ---------- backup ---------- */
async function saveFile(filename, data, type = 'application/json') {
  if (IN_CLAUDE) {
    try {
      const dl = await window.claude.use('downloads');
      if (!dl) throw new Error('downloads unavailable');
      await dl.save({ filename, data });
      toast('Saved');
      return true;
    } catch (e) {
      if (e && e.code === 'declined') return false;
      Log.warn('download failed', String((e && e.message) || e));
      toast(
        e && /extension/.test(e.code || '')
          ? 'The Claude app cannot save this kind of file. Open DaCapo in your browser to save it.'
          : 'Saving files is not available here.',
      );
      return false;
    }
  }
  try {
    const url = URL.createObjectURL(new Blob([data], { type }));
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Saved to your downloads');
    return true;
  } catch (e) {
    Log.err(e, 'save file');
    toast('Could not save the file.');
    return false;
  }
}

/* ---------- reading a score ---------- */
// the text of a MusicXML file: plain (.musicxml, .xml) or compressed (.mxl, a zip with the score inside)
async function scoreText(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  if (!(buf[0] === 0x50 && buf[1] === 0x4b)) return decodeText(buf);
  const entries = zipEntries(buf);
  const read = async e => {
    const raw = buf.subarray(e.data, e.data + e.size);
    if (e.method === 0) return decodeText(raw);
    if (e.method !== 8) throw new Error('This .mxl is compressed in a way DaCapo cannot read.');
    const out = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return decodeText(new Uint8Array(await new Response(out).arrayBuffer()));
  };
  // META-INF/container.xml names the score; otherwise the first .xml outside META-INF
  const box = entries.find(e => e.name === 'META-INF/container.xml');
  let name = null;
  if (box) name = (/full-path="([^"]+)"/.exec(await read(box)) || [])[1];
  const e =
    entries.find(x => x.name === name) ||
    entries.find(x => !x.name.startsWith('META-INF') && /\.(xml|musicxml)$/i.test(x.name));
  if (!e) throw new Error('No score inside this .mxl file.');
  return read(e);
}

// text in UTF-8, or UTF-16 when it starts with a byte-order mark (some notation apps write that)
function decodeText(b) {
  const enc =
    b[0] === 0xff && b[1] === 0xfe ? 'utf-16le' : b[0] === 0xfe && b[1] === 0xff ? 'utf-16be' : 'utf-8';
  return new TextDecoder(enc).decode(b);
}

// the files in a zip, from its central directory: {name, method, size, data (offset)}
function zipEntries(buf) {
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--)
    if (dv.getUint32(i, true) === 0x06054b50) {
      eocd = i;
      break;
    }
  if (eocd < 0) throw new Error('This .mxl file is damaged.');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = [];
  for (let k = 0; k < count && dv.getUint32(p, true) === 0x02014b50; k++) {
    const method = dv.getUint16(p + 10, true);
    const size = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extra = dv.getUint16(p + 30, true);
    const comment = dv.getUint16(p + 32, true);
    const local = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(buf.subarray(p + 46, p + 46 + nameLen));
    const data = local + 30 + dv.getUint16(local + 26, true) + dv.getUint16(local + 28, true);
    out.push({ name, method, size, data });
    p += 46 + nameLen + extra + comment;
  }
  return out;
}

// ---- views/report.js ----
/* The problem report: describe what happened and send it with the diagnostic log. */

function reportSheet(prefill = '') {
  const hint = IN_CLAUDE
    ? 'Send stores the report with this app so Claude can read it when you ask.'
    : 'Then paste it (or attach the file) in your conversation with Claude.';
  openSheet(
    `<div class="sheethead"><h2 class="h2">Report a problem</h2>${closeBtn}</div>
    <p class="small">Describe what happened and what you expected. The diagnostic log (what the app did,
      any errors, your device and browser, no personal data) is attached so the problem can be found.</p>
    <label class="field">What happened?<textarea class="input" id="rpText"
      placeholder="For example: I played the first note of the scale and nothing happened after the count-in…"
      >${esc(prefill)}</textarea></label>
    <label class="toggle">
      <input type="checkbox" id="rpLog" checked>
      <span><b>Attach the diagnostic log</b>
        <span class="small">${Log.buf.length} events, ${Log.errCount} errors this visit</span></span>
    </label>
    <div class="row">
      ${IN_CLAUDE ? '<button class="btn cover" type="button" id="rpSend">Send to Claude</button>' : ''}
      <button class="btn ${IN_CLAUDE ? '' : 'cover'}" type="button" id="rpCopy">Copy report</button>
      <button class="btn" type="button" id="rpSave">Save as file</button>
    </div>
    <p class="small" id="rpHint">${hint}</p>
    <details>
      <summary>Saved reports and log</summary>
      <div class="stack">
        <div id="rpSaved" class="small"></div>
        <div class="row"><button class="btn sm ghost" type="button" id="rpClear">Clear the log</button></div>
      </div>
    </details>`,
    sheet => {
      const text = () => Log.report($('#rpText', sheet).value, $('#rpLog', sheet).checked);
      const keep = rep => {
        try {
          const l = JSON.parse(localStorage.getItem('dacapo.reports') || '[]');
          l.unshift({ t: Date.now(), note: $('#rpText', sheet).value.slice(0, 200), size: rep.length });
          localStorage.setItem('dacapo.reports', JSON.stringify(l.slice(0, 10)));
        } catch (e) {}
      };
      const paintSaved = () => {
        let l = [];
        try {
          l = JSON.parse(localStorage.getItem('dacapo.reports') || '[]');
        } catch (e) {}
        $('#rpSaved', sheet).innerHTML = l.length
          ? l
              .map(x => `<div>${new Date(x.t).toLocaleString()} · ${esc(x.note || '(no description)')}</div>`)
              .join('')
          : 'No reports made yet.';
      };
      paintSaved();
      Log.ev('report opened');
      $('#rpCopy', sheet).onclick = async () => {
        const rep = text();
        Log.ev('report copied', { size: rep.length });
        try {
          await navigator.clipboard.writeText(rep);
          toast('Report copied. Paste it to Claude.');
          keep(rep);
          paintSaved();
        } catch (e) {
          const ta = document.createElement('textarea');
          ta.value = rep;
          ta.className = 'input';
          ta.style.minHeight = '160px';
          $('#rpHint', sheet).replaceWith(ta);
          ta.select();
          toast('Select all and copy the text below.');
        }
      };
      $('#rpSave', sheet).onclick = async () => {
        const rep = text();
        Log.ev('report saved as file');
        const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
        if (await saveFile(`dacapo-report-${stamp}.txt`, rep, 'text/plain')) {
          keep(rep);
          paintSaved();
        }
      };
      const send = $('#rpSend', sheet);
      if (send)
        send.onclick = async () => {
          const rep = text();
          try {
            if (!Store.db || !Store.uid) throw new Error('storage unavailable');
            const id = 'report-' + Date.now().toString(36);
            await Store.db.doc('data/users/' + Store.uid + '/' + id).set({
              text: rep.slice(0, 200000),
              at: Date.now(),
              note: $('#rpText', sheet).value.slice(0, 500),
              version: APP_VERSION,
            });
            Log.ev('report sent', { id });
            keep(rep);
            paintSaved();
            toast('Report sent. Ask Claude to read your DaCapo reports.');
            closeSheet();
          } catch (e) {
            Log.warn('report send failed', String((e && e.message) || e));
            toast('Could not send; use Copy instead.');
          }
        };
      $('#rpClear', sheet).onclick = () => {
        Log.clear();
        toast('Log cleared');
        closeSheet();
      };
    },
    { label: 'Report a problem' },
  );
}

// ---- music/moodtools.js ----
/* Tools for improvising in a mood (pure): the left-hand patterns, each written out over a voice-led
   progression with fingers; how to read what the left hand played; and the right hand's ideas (color
   note, targets, motif and sequence, thirds and sixths, call and response) with what each listens for. */

const pc12 = m => ((m % 12) + 12) % 12;

/* ---------- the left hand ----------
   Each pattern is one bar of 4/4 over one chord: [{b, ms, f, d}]: the beat it starts on, its notes, their
   fingers (null where the hand has a choice) and how many beats it lasts. Chords are voiced so each takes
   the inversion nearest the one before: the hand barely moves while the harmony changes. */
const LH_PATTERNS = [
  { id: 'fifth', n: 'Root and fifth', how: 'Root and fifth together on beat 1, held. Simple and strong.' },
  { id: 'octave', n: 'Octaves', how: 'The root in octaves on beats 1 and 3: a big, open floor.' },
  {
    id: 'block',
    n: 'Chord on the beat',
    how: 'The chord on beats 1 and 3, each the nearest shape to the last.',
  },
  {
    id: 'broken',
    n: 'Broken chord',
    how: 'Root, fifth, octave, fifth, one note per beat: the left hand keeps moving.',
  },
  {
    id: 'oompah',
    n: 'Bass and chord',
    how: 'The root alone on 1, the chord above it on 2, 3 and 4. Jump, and land.',
  },
  {
    id: 'alberti',
    n: 'Alberti bass',
    how: 'The chord broken low, high, middle, high in even eighths: the classical accompaniment.',
  },
  {
    id: 'tenth',
    n: 'Open tenth',
    how: 'Root, fifth, then the third an octave up: the tenth. A wide, warm sound, the ballad left hand.',
  },
  {
    id: 'sweep',
    n: 'Sweep',
    how: 'Root, fifth, octave, tenth and back down, six even notes a bar: the hand rolls, finger 2 crossing over the thumb.',
  },
  {
    id: 'walking',
    n: 'Walking bass',
    how: 'Root, third, fifth, then the note a half step below the next chord: the bass walks into each change.',
  },
  {
    id: 'pedal',
    n: 'Pedal point',
    how: 'The home note stays in the bass, in octaves, while the chords change above it: tension against a floor.',
  },
];
const LH_BY = Object.fromEntries(LH_PATTERNS.map(p => [p.id, p]));

// the left hand's chords for a progression: a close voicing from C3 up, and the root from E2 to D♯3
const lhVoicing = (mood, pc, chords) => voiceProgression(mood, pc, chords, { lo: 47, hi: 55 });

// one bar of a pattern over chord i of a voiced progression V
function patternBar(id, V, i, tonicPc) {
  const v = V[i];
  const next = V[(i + 1) % V.length];
  const R = v.root;
  const [, third, fifth] = CHORD_TONES[v.info.type];
  const ch = v.right;
  const q = (ms, f) => ms.map((m, k) => ({ b: k, ms: [m], f: [f[k]], d: 1 }));
  switch (id) {
    case 'fifth':
      return [{ b: 0, ms: [R, R + fifth], f: [5, 1], d: 4 }];
    case 'octave':
      return [0, 2].map(b => ({ b, ms: [R, R + 12], f: [5, 1], d: 1.8 }));
    case 'block':
      return [0, 2].map(b => ({ b, ms: ch, f: [5, 3, 1], d: 1.8 }));
    case 'broken':
      return q([R, R + fifth, R + 12, R + fifth], [5, 2, 1, 2]);
    case 'oompah':
      return [{ b: 0, ms: [R], f: [5], d: 1 }, ...[1, 2, 3].map(b => ({ b, ms: ch, f: [5, 3, 1], d: 0.9 }))];
    case 'alberti':
      return [0, 2, 1, 2, 0, 2, 1, 2].map((k, j) => ({ b: j / 2, ms: [ch[k]], f: [[5, 3, 1][k]], d: 0.5 }));
    case 'tenth':
      return q([R, R + fifth, R + 12 + third, R + fifth], [5, 2, 1, 2]);
    case 'sweep':
      return [R, R + fifth, R + 12, R + 12 + third, R + 12, R + fifth].map((m, j) => ({
        b: (j * 2) / 3,
        ms: [m],
        f: [[5, 2, 1, 2, 1, 2][j]],
        d: 2 / 3,
      }));
    case 'walking': {
      // the half step below the next root, in the octave nearest the fifth (above it when the chord repeats)
      const target = next.root === R ? R + 1 : next.root - 1;
      const approach = R + fifth + ((((pc12(target) - pc12(R + fifth) + 6) % 12) + 12) % 12) - 6;
      return q([R, R + third, R + fifth, approach], [5, 3, 1, null]);
    }
    case 'pedal': {
      const T = 40 + pc12(tonicPc - 40);
      return [{ b: 0, ms: [T, T + 12], f: [5, 1], d: 4 }];
    }
    default:
      return [];
  }
}

/* what one left-hand gesture was (notes struck within a moment of each other): a chord, an octave, root
   and fifth, a broken chord tone (3rd or 7th), the home note held under another chord (a pedal), or a
   passing note outside the chord (walking) */
function lhKind(ms, rootPc, type, tonicPc) {
  const tones = CHORD_TONES[type].map(x => pc12(rootPc + x));
  const pcs = [...new Set(ms.map(pc12))];
  if (ms.length >= 2) {
    if (pcs.length === 1)
      return pcs[0] === pc12(tonicPc) && pc12(rootPc) !== pc12(tonicPc) ? 'pedal' : 'octaves';
    if (pcs.length === 2 && pcs.every(p => p === tones[0] || p === tones[2])) return 'rootFifth';
    return 'chords';
  }
  const p = pcs[0];
  if (p === pc12(tonicPc) && pc12(rootPc) !== pc12(tonicPc)) return 'pedal';
  if (p === tones[0] || p === tones[2]) return 'rootFifth';
  if (tones.includes(p)) return 'broken';
  return 'passing';
}
const LH_KINDS = ['chords', 'octaves', 'rootFifth', 'broken', 'pedal', 'passing'];

/* ---------- the right hand ---------- */
const RH_TOOLS = [
  { id: 'free', n: 'Free' },
  { id: 'color', n: 'Color note' },
  { id: 'targets', n: 'Targets' },
  { id: 'motif', n: 'Motif and sequence' },
  { id: 'dyads', n: 'Thirds and sixths' },
  { id: 'call', n: 'Call and response' },
];

// the mood's color note in this key: {pc, name, what, tip}
function colorNote(mood, pc) {
  const M = MOOD_BY[mood];
  const [semis, what, tip] = M.color;
  const scale = moodScale(mood, pc);
  const i = M.semis.indexOf(semis);
  const n = scale[i];
  return { pc: pc12(midiOf(n)), name: nameOf(n, false), what, tip };
}

function toolHow(id, mood, pc) {
  const c = colorNote(mood, pc);
  return {
    free: 'Anything with the lit keys. A good start: a few notes, a rest, the same few notes again.',
    color: `${c.name} is ${c.what}: ${c.tip}. It is marked on the keyboard.`,
    targets:
      'Land on a note of the chord (marked) on beats 1 and 3; anything in the scale between them. The melody follows the harmony.',
    motif:
      'Play a short idea, three or four notes, then play it again starting a step higher or lower: a sequence. Most melodies are built this way.',
    dyads:
      'Two notes at once from the scale, a third or a sixth apart (skip one note, or five). Move them together: instant harmony.',
    call: 'Tap Play a call: DaCapo plays a short phrase, then you answer it. Echo its rhythm, and end on the home note.',
  }[id];
}

// where a note sits in the scale, counted in scale steps from the tonic (across octaves); null if outside
function degreeOf(m, semis, tonicPc) {
  const rel = m - tonicPc;
  const i = semis.indexOf(pc12(rel));
  return i < 0 ? null : Math.floor(rel / 12) * semis.length + i;
}

/* a motif came back: the last three notes have the same shape (in scale steps) as three notes just before
   them. 'sequence' when it starts on another note, 'repeat' when on the same one; else null */
function motifEcho(degrees) {
  const n = degrees.length;
  if (n < 6) return null;
  const shape = (k, j) => [degrees[k + 1] - degrees[k], degrees[k + 2] - degrees[k + 1], j];
  const [a, b] = shape(n - 3);
  // (a plain run up or down the scale is not a motif: every three notes of it have the same shape)
  if ((a === 0 && b === 0) || (a === b && Math.abs(a) === 1)) return null;
  for (let k = Math.max(0, n - 12); k <= n - 6; k++) {
    const [x, y] = shape(k);
    if (x === a && y === b) return degrees[k] === degrees[n - 3] ? 'repeat' : 'sequence';
  }
  return null;
}

// two right-hand notes at once: a third or a sixth (or their octave-up versions), else null
function dyadKind(ms) {
  if (ms.length !== 2) return null;
  const d = Math.abs(ms[1] - ms[0]) % 12;
  return d === 3 || d === 4 ? 'third' : d === 8 || d === 9 ? 'sixth' : null;
}

/* a call: a short phrase in the scale, mostly steps, that ends away from home (on the 2nd, 5th or 7th
   degree) so it asks for an answer. rnd is a function returning [0, 1). [{m, b, d}] in beats. */
function callPhrase(mood, pc, rnd = Math.random) {
  const M = MOOD_BY[mood];
  const tonic = 60 + pc12(midiOf(moodScale(mood, pc)[0]));
  const L = M.semis.length;
  const at = d => tonic + Math.floor(d / L) * 12 + M.semis[((d % L) + L) % L];
  const RHYTHMS = [
    [0, 0.5, 1, 2],
    [0, 1, 1.5, 2],
    [0, 0.5, 1, 1.5, 2],
    [0, 1, 2, 2.5, 3],
  ];
  const rh = RHYTHMS[Math.floor(rnd() * RHYTHMS.length)];
  let d = Math.floor(rnd() * 3) + Math.floor(L / 2) - 1; // start around the middle of the scale
  // (it stays between home and an octave and a half up, in the right hand)
  const degs = rh.map((_, i) => {
    if (i) {
      const s = [-2, -1, -1, 1, 1, 2][Math.floor(rnd() * 6)];
      d += d + s < 0 || d + s > L + (L >> 1) ? -s : s;
    }
    return d;
  });
  // end on a degree that wants to move: the scale's 2nd or 5th-ish note, or the one below home
  const ends = [1, Math.round(L * 0.6), L - 1];
  const last = degs[degs.length - 2];
  const end = ends
    .map(e => e + Math.max(0, Math.round((last - e) / L)) * L)
    .filter(e => e !== last)
    .sort((x, y) => Math.abs(x - last) - Math.abs(y - last))[0];
  degs[degs.length - 1] = end;
  return rh.map((b, i) => ({ m: at(degs[i]), b, d: (rh[i + 1] ?? b + 1) - b }));
}

// an answer: how many notes, and whether it ended on the home note (or at least on a scale note)
function judgeAnswer(ms, semis, tonicPc) {
  const last = ms[ms.length - 1];
  return {
    n: ms.length,
    home: ms.length > 0 && pc12(last) === pc12(tonicPc),
    inScale: ms.length > 0 && semis.includes(pc12(last - tonicPc)),
  };
}

/* ---------- ear: which mood? ----------
   A phrase in a mood: its first progression under the scale rising, then the color note held and home. */
function earPhrase(mood, pc, bar = 1.6) {
  const M = MOOD_BY[mood];
  const chords = M.progs[0].chords;
  const V = voiceProgression(mood, pc, chords);
  const out = [];
  for (let i = 0; i < 4; i++) {
    const v = V[i % V.length];
    out.push({ m: v.root, t: i * bar, d: bar, v: 0.45 });
    v.right.forEach(m => out.push({ m, t: i * bar, d: bar, v: 0.25 }));
  }
  const top = Math.max(...V.flatMap(v => v.right));
  const tonic = top + 1 + pc12(midiOf(moodScale(mood, pc)[0]) - top - 1); // the first tonic above the chords
  const run = [...M.semis.map(s => tonic + s), tonic + 12];
  const step = (bar * 2) / run.length;
  run.forEach((m, i) => out.push({ m, t: i * step, d: step, v: 0.55 }));
  // the color note, then the nearest home
  out.push({ m: tonic + M.color[0], t: bar * 2, d: bar * 0.9, v: 0.6 });
  out.push({ m: tonic + (M.color[0] > 6 ? 12 : 0), t: bar * 3, d: bar, v: 0.55 });
  return out;
}

// a round: a mood (the ones you miss come back more), a key, and four choices from more than one family
function earRound(by = {}, rnd = Math.random, pool = Object.keys(MOOD_BY)) {
  const weight = id => {
    const [n = 0, right = 0] = by[id] || [];
    return 1 + (n - right) * 2 + (n < 2 ? 1 : 0);
  };
  const total = pool.reduce((a, id) => a + weight(id), 0);
  let x = rnd() * total;
  const mood = pool.find(id => (x -= weight(id)) < 0) || pool[0];
  const pick = list => list.splice(Math.floor(rnd() * list.length), 1)[0];
  const fam = MOOD_BY[mood].fam;
  const same = pool.filter(id => id !== mood && MOOD_BY[id].fam === fam);
  const other = pool.filter(id => MOOD_BY[id].fam !== fam);
  const options = [mood];
  if (same.length) options.push(pick(same));
  while (options.length < 4 && other.length) options.push(pick(other));
  // shuffle
  for (let i = options.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [options[i], options[j]] = [options[j], options[i]];
  }
  return { mood, pc: Math.floor(rnd() * 12), options };
}

// a left-hand pattern as a drill: one bar of it over each chord of one of the mood's progressions
function lhPatternRun(mood, pc, id, prog = 0) {
  const chords = MOOD_BY[mood].progs[prog].chords;
  const V = lhVoicing(mood, pc, chords);
  const tonic = midiOf(moodScale(mood, pc)[0]);
  const sp = spellerFor(moodSig(mood, pc));
  const steps = V.flatMap((v, i) =>
    patternBar(id, V, i, tonic).map((g, j) => ({
      midis: g.ms,
      notes: g.ms.map((m, k) => ({ n: sp(m), st: 'b', fcls: 'lh', f: g.f[k] ?? undefined })),
      beat: i * 4 + g.b,
      dur: g.d,
      chord: j === 0 ? v.info.name : undefined,
    })),
  );
  return { steps, sig: moodSig(mood, pc), clef: 'bass' };
}

/* which mood a passage is probably in, from its notes ([{m, t?, d?}], durations in any unit; without
   them each note counts once). Every mood in every key is scored: how much of what sounds is in its scale,
   how much of its scale sounds (a five-note tune is pentatonic, not major with two notes missing), and how
   strongly its home is heard (the last note and the lowest notes, where tunes and bass lines come to rest).
   The common moods get a small head start. {mood, pc, alt: {mood, pc}, sure (0..1)} or null. */
const COMMON = new Set(['major', 'natural', 'harmonic']);
function guessMood(notes, { min = 12 } = {}) {
  if (notes.length < min) return null;
  const timed = notes.every(n => n.t != null && n.d > 0);
  const w = new Array(12).fill(0);
  notes.forEach(n => (w[pc12(n.m)] += timed ? n.d : 1));
  const total = w.reduce((a, b) => a + b, 0);
  // the bass: the lowest note sounding, moment by moment; and what sounds at the very end
  const low = new Array(12).fill(0);
  let finalBass;
  let finalTop;
  if (timed) {
    const sorted = notes.slice().sort((a, b) => a.t - b.t);
    const times = [...new Set(sorted.map(n => n.t))];
    times.forEach((x, i) => {
      const next = i + 1 < times.length ? times[i + 1] : x + 1;
      let lo = null;
      for (const n of sorted) {
        if (n.t > x + 1e-6) break;
        if (n.t + n.d > x + 1e-6 && (!lo || n.m < lo.m)) lo = n;
      }
      if (lo) low[pc12(lo.m)] += next - x;
    });
    const end = Math.max(...notes.map(n => n.t + n.d));
    const last = notes.filter(n => n.t + n.d >= end - 1e-3);
    finalBass = pc12(Math.min(...last.map(n => n.m)));
    finalTop = pc12(Math.max(...last.map(n => n.m)));
  } else {
    // (played live: below middle C is the bass)
    notes.forEach(n => n.m < 60 && (low[pc12(n.m)] += 1));
    const lastLow = notes.filter(n => n.m < 60).pop();
    finalBass = lastLow ? pc12(lastLow.m) : null;
    finalTop = pc12(notes[notes.length - 1].m);
  }
  const lowTotal = low.reduce((a, b) => a + b, 0) || 1;
  const all = [];
  for (const M of Object.values(MOOD_BY))
    for (let t = 0; t < 12; t++) {
      const pcs = new Set(M.semis.map(s => (t + s) % 12));
      let fit = 0;
      pcs.forEach(p => (fit += w[p]));
      fit /= total;
      const missing = [...pcs].filter(p => w[p] < total * 0.03).length;
      const home =
        (finalBass === t ? 0.4 : 0) +
        (finalTop === t ? 0.15 : 0) +
        (low[t] / lowTotal) * 0.3 +
        (w[t] / Math.max(...w)) * 0.1;
      const score = fit - missing * 0.06 + home * 0.3 + (COMMON.has(M.id) ? 0.02 : 0);
      all.push({ mood: M.id, pc: t, score });
    }
  all.sort((a, b) => b.score - a.score);
  const best = all[0];
  const alt = all.find(x => x.mood !== best.mood);
  return {
    mood: best.mood,
    pc: best.pc,
    alt: { mood: alt.mood, pc: alt.pc },
    sure: Math.min(1, (best.score - alt.score) * 5),
  };
}

// ---- music/harmony.js ----
/* Harmony: which chord a set of notes makes (Play's readout). The mood and key of a passage is
   guessMood in moodtools.js. */

const CHORD_T = [
  ...Object.entries(CHORDS).map(([k, v]) => ({ k, s: v.s, sym: v.sym, n: v.n })),
  { k: 'sus2', s: [0, 2, 7], sym: 'sus2', n: 'Suspended 2nd' },
  { k: 'sus4', s: [0, 5, 7], sym: 'sus4', n: 'Suspended 4th' },
  { k: 'six', s: [0, 4, 7, 9], sym: '6', n: 'Major 6th' },
  { k: 'm6', s: [0, 3, 7, 9], sym: 'm6', n: 'Minor 6th' },
  { k: 'add9', s: [0, 2, 4, 7], sym: 'add9', n: 'Major add 9' },
  { k: 'maj9', s: [0, 2, 4, 7, 11], sym: 'maj9', n: 'Major 9th' },
  { k: 'm9', s: [0, 2, 3, 7, 10], sym: 'm9', n: 'Minor 9th' },
  { k: 'dom9', s: [0, 2, 4, 7, 10], sym: '9', n: 'Dominant 9th' },
];

// a chord tone spelled from the root, as the chord spells it: C7's 7th is B♭, never A♯
const LETTERS_UP = [0, 1, 1, 2, 2, 3, 4, 4, 5, 5, 6, 6];
function bassName(root, semis, type) {
  const letters =
    semis === 8 && type.startsWith('aug') ? 4 : semis === 9 && type === 'dim7' ? 6 : LETTERS_UP[semis];
  return nameOf(spellAbove(root, letters, semis), false);
}

function detectChord(midis, spell) {
  const ms = [...new Set(midis)].sort((a, b) => a - b);
  if (!ms.length) return null;
  const pcs = [...new Set(ms.map(m => m % 12))];
  const bass = ms[0] % 12;
  const nm = m => nameOf(spell(m), false);
  if (pcs.length === 1) return { name: nm(ms[0]), long: ms.length > 1 ? 'Octave' : 'Single note' };
  if (pcs.length === 2) {
    const iv = INTERVALS.find(i => i.s === ((ms[ms.length - 1] - ms[0]) % 12 || 12));
    return {
      name: nm(ms[0]) + '–' + nm(ms[ms.length - 1]),
      long: iv.s === 7 ? 'Open 5th' : iv.long[0].toUpperCase() + iv.long.slice(1),
    };
  }
  let best = null;
  for (const r of pcs) {
    const iv = new Set(pcs.map(p => (p - r + 12) % 12));
    for (const T of CHORD_T) {
      const ts = new Set(T.s);
      const all = [...iv].every(x => ts.has(x));
      const exact = all && iv.size === ts.size;
      const no5 = !exact && all && T.s.length >= 4 && !iv.has(7) && iv.size === ts.size - 1;
      if (!exact && !no5) continue;
      const score = (exact ? 10 : 6) + (r === bass ? 3 : 0) - T.s.length * 0.1;
      if (!best || score > best.score) best = { r, T, score };
    }
  }
  if (!best) return { name: ms.map(nm).join(' '), long: 'Cluster or unusual voicing' };
  const rootM = ms.find(m => m % 12 === best.r);
  const rootName = nm(rootM);
  // the inversion goes by which chord tone is lowest: the 3rd, the 5th, the 7th (else name the tone)
  const low = (bass - best.r + 12) % 12;
  const inv =
    low === 0
      ? 'root position'
      : low === 3 || low === 4
        ? '1st inversion'
        : low >= 6 && low <= 8
          ? '2nd inversion'
          : low === 10 || low === 11 || (low === 9 && best.T.k === 'dim7')
            ? '3rd inversion'
            : `${{ 2: 'the 9th', 5: 'the 4th', 9: 'the 6th' }[low] || 'another note'} in the bass`;
  return {
    name: rootName + best.T.sym + (bass !== best.r ? '/' + bassName(spell(rootM), low, best.T.k) : ''),
    long: `${rootName} ${best.T.n.toLowerCase()}, ${inv}`,
    root: best.r,
    type: best.T.k,
    rootName,
  };
}

// ---- music/takeread.js ----
/* A recorded take, read back into notes. Events are [ms, 'n', key, velocity], [ms, 'f', key] and
   [ms, 'p', 1|0] for the sustain pedal.
   Pair note-ons with offs. Each note has two lengths: how long the key was down (key) and how long it
   rang (dur): the sustain pedal keeps a released note sounding until the pedal lifts. Playback uses the
   ringing length; the picture shows the key length, with the ringing as a faint tail, so a take played
   with the pedal held down all the way still shows every note where it was played. */

function readTake(ev) {
  const out = [];
  const open = new Map(); // keys that are sounding: {t, m, vel, key, dur}
  let pedal = false;
  const pedalSpans = [];
  let pStart = 0;
  const end = ev.length ? ev[ev.length - 1][0] + 400 : 0;
  const close = (o, t) => {
    o.dur = t - o.t;
    if (o.key == null) o.key = o.dur;
    out.push(o);
  };
  ev.forEach(([t, k, m, v]) => {
    if (k === 'n') {
      if (open.has(m)) close(open.get(m), t); // the same key again: the old note stops
      open.set(m, { t, m, vel: v / 127, key: null, dur: 0 });
    } else if (k === 'f') {
      const o = open.get(m);
      if (!o || o.key != null) return;
      o.key = t - o.t;
      if (!pedal) {
        close(o, t);
        open.delete(m);
      }
    } else if (k === 'p') {
      if (m && !pedal) {
        pedal = true;
        pStart = t;
      } else if (!m && pedal) {
        pedal = false;
        pedalSpans.push([pStart, t]);
        open.forEach((o, mm) => {
          if (o.key != null) {
            close(o, t);
            open.delete(mm);
          }
        });
      }
    }
  });
  if (pedal) pedalSpans.push([pStart, end]);
  open.forEach(o => close(o, Math.max(o.t + 300, end)));
  out.forEach(o => {
    o.dur = Math.max(60, o.dur);
    o.key = Math.max(60, Math.min(o.key, o.dur));
  });
  // the pedal counts from the first note (it may go down before), and never beyond the end
  const first = out.length ? Math.min(...out.map(o => o.t)) : 0;
  const spans = pedalSpans.map(([a, b]) => [Math.max(a, first), b]).filter(([a, b]) => b > a);
  return {
    notes: out.sort((a, b) => a.t - b.t),
    pedal: spans,
    dur: Math.max(end, ...out.map(o => o.t + o.dur)),
  };
}

// ---- music/pack.js ----
/* Making a piece from notes (pure): packing them the way the library stores them, cutting practice
   sections of about four bars (a repeat shares its first time's section), and naming the chords for a lead
   sheet. Used for the tunes (tools/build_songs.mjs) and for scores you import. */

// a varint, 7 bits at a time, as library.js reads them
function varint(n, out) {
  let v = Math.max(0, Math.round(n));
  do {
    let b = v % 128;
    v = Math.floor(v / 128);
    if (v) b += 128;
    out.push(b);
  } while (v);
}
const zz = n => (n < 0 ? -2 * n - 1 : 2 * n);
const b64 = bytes => {
  let s = '';
  for (const b of bytes) s += String.fromCharCode(b);
  return typeof btoa === 'function' ? btoa(s) : globalThis.Buffer.from(s, 'binary').toString('base64');
};

/* notes: [{t, d, m, acc, h, s, f}] in quarter-note beats (h: 0 right hand, 1 left; s: 0 treble staff, 1
   bass; acc: the accidental as written, -2..2; f: finger or 0). bars: bar starts in beats, then the end.
   Returns the packed fields of a piece: notes, n, fing, bars, tpq. */
function packNotes(notes, bars, tpq = 48) {
  const sorted = notes.slice().sort((a, b) => a.t - b.t || a.h - b.h || a.m - b.m);
  const bytes = [];
  const fing = [];
  const prev = [60, 48];
  let t = 0;
  let lastF = 0;
  sorted.forEach((n, i) => {
    const ticks = Math.round(n.t * tpq);
    varint(ticks - t, bytes);
    t = ticks;
    varint(Math.round(n.d * tpq), bytes);
    varint(zz(n.m - prev[n.h]), bytes);
    prev[n.h] = n.m;
    bytes.push(Math.max(-2, Math.min(2, n.acc || 0)) + 2 + 5 * n.h + 10 * (n.s || 0));
    if (n.f) {
      varint(i - lastF, fing);
      varint(n.f, fing);
      lastF = i;
    }
  });
  const barBytes = [];
  let b0 = 0;
  bars.forEach(b => {
    const ticks = Math.round(b * tpq);
    varint(ticks - b0, barBytes);
    b0 = ticks;
  });
  return { notes: b64(bytes), n: sorted.length, fing: b64(fing), bars: b64(barBytes), tpq };
}

/* practice sections: about four bars each (a pickup bar joins the first). A section with exactly the notes
   of an earlier one (same pitches, same rhythm) points at it: learned once. [[a, z, same]] */
function sectionsOf(notes, bars, { len = 4, pickup = false } = {}) {
  const nb = bars.length - 1;
  const cuts = [0];
  let b = pickup ? 1 : 0;
  while (b + len < nb) {
    b += len;
    // (never leave a last section of a single bar)
    if (nb - b < 2) break;
    cuts.push(b);
  }
  cuts.push(nb);
  const sig = (a, z) =>
    notes
      .filter(n => n.t >= bars[a] - 1e-6 && n.t < bars[z] - 1e-6)
      .map(n => `${(n.t - bars[a]).toFixed(3)}:${n.m}:${n.d.toFixed(3)}:${n.h}`)
      .sort()
      .join(' ');
  const out = [];
  for (let k = 0; k + 1 < cuts.length; k++) {
    const [a, z] = [cuts[k], cuts[k + 1]];
    const me = sig(a, z);
    const same = out.findIndex(
      (x, j) => x[2] < 0 && cuts[j + 1] - cuts[j] === z - a && sig(x[0], x[1]) === me,
    );
    out.push([a, z, me && same >= 0 ? same : -1]);
  }
  return out;
}

/* the chords of a passage, for a lead sheet: one per window (a half bar in 4/4, a bar in 3/4 or 6/8),
   joined where it repeats. A chord scores what sounds in the window that belongs to it, weighted by
   length and with the bass counting extra, minus what does not. A 7th is added only when it really sounds.
   Chords of the key are preferred on a tie. [[t, name]] */
const TRIADS = ['maj', 'min', 'dim', 'aug'];
// a triad's 7ths, the more usual first: a major triad with a minor 7th is a dominant 7th
const SEVENTHS = {
  maj: [
    [10, 'dom7'],
    [11, 'maj7'],
  ],
  min: [[10, 'min7']],
  dim: [[10, 'hdim7']],
  aug: [],
};
function chordSymbols(notes, bars, { sig = 0, window = null } = {}) {
  const spell = spellerFor(sig);
  const scale = new Set(majorScalePcs(sig));
  const out = [];
  for (let b = 0; b + 1 < bars.length; b++) {
    const len = bars[b + 1] - bars[b];
    const w = window || (len >= 4 && len % 2 === 0 ? len / 2 : len);
    for (let t0 = bars[b]; t0 < bars[b + 1] - 1e-6; t0 += w) {
      const t1 = Math.min(bars[b + 1], t0 + w);
      const weight = new Array(12).fill(0);
      let bass = null;
      for (const n of notes) {
        const ov = Math.min(t1, n.t + Math.max(n.d, 0.25)) - Math.max(t0, n.t);
        if (ov <= 0) continue;
        weight[((n.m % 12) + 12) % 12] += ov * (n.t >= t0 - 1e-6 ? 1.2 : 1);
        if (!bass || n.m < bass.m) bass = n;
      }
      if (!bass) continue;
      const bassPc = ((bass.m % 12) + 12) % 12;
      weight[bassPc] += w * 0.6;
      const total = weight.reduce((a, b) => a + b, 0);
      // the best triad first; then its 7th only if the 7th really sounds (a good share of the window)
      let best = null;
      for (let root = 0; root < 12; root++) {
        if (!weight[root]) continue;
        for (const k of TRIADS) {
          const tones = CHORDS[k].s.map(x => (root + x) % 12);
          let sc = 0;
          for (let p = 0; p < 12; p++) sc += tones.includes(p) ? weight[p] : -weight[p] * 1.1;
          sc -= k === 'aug' ? w * 0.3 : 0;
          if (tones.every(p => scale.has(p))) sc += w * 0.05;
          if (root === bassPc) sc += w * 0.2;
          if (!best || sc > best.sc) best = { sc, root, k };
        }
      }
      // a diminished triad is usually a dominant 7th without its root (B D F in G7): name the dominant when
      // its root sounds at all
      if (best && best.k === 'dim' && weight[(best.root + 8) % 12] >= total * 0.08)
        best = { ...best, root: (best.root + 8) % 12, k: 'dom7' };
      if (best && best.k !== 'dom7') {
        const seventh = SEVENTHS[best.k].find(([x]) => weight[(best.root + x) % 12] >= total * 0.2);
        if (seventh) best.k = seventh[1];
      }
      if (!best) continue;
      const name = spell(60 + best.root);
      const sym = 'CDEFGAB'[name.l] + (name.a > 0 ? '♯' : name.a < 0 ? '♭' : '') + CHORDS[best.k].sym;
      if (!out.length || out[out.length - 1][1] !== sym) out.push([+t0.toFixed(4), sym]);
    }
  }
  return out;
}

// the pitch classes of the major scale with this signature (sharps positive, flats negative)
function majorScalePcs(sig) {
  const tonic = (((sig * 7) % 12) + 12) % 12;
  return [0, 2, 4, 5, 7, 9, 11].map(x => (tonic + x) % 12);
}

// a chord symbol back to its root and kind: 'E♭m7' -> {pc: 3, type: 'min7'} (null if it is not one)
function parseChordSymbol(text) {
  const m = /^([A-G])([♯♭#b]?)(.*)$/.exec(String(text).trim());
  if (!m) return null;
  const type = Object.keys(CHORDS).find(k => CHORDS[k].sym === m[3]);
  if (!type) return null;
  const pc =
    ({ C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (/[♯#]/.test(m[2]) ? 1 : m[2] ? -1 : 0) + 12) % 12;
  return { pc, type };
}

/* a tune's chords as a backing: each with its length in beats and where in its bar it starts.
   syms [[t, name]], bars (starts, then the end). [{pc, type, name, beats, b0}] */
function songChords(syms, bars) {
  const end = bars[bars.length - 1];
  const out = [];
  syms.forEach(([t, name], i) => {
    const c = parseChordSymbol(name);
    const until = i + 1 < syms.length ? syms[i + 1][0] : end;
    if (!c || until <= t) return;
    let b = 0;
    while (b + 1 < bars.length && bars[b + 1] <= t + 1e-6) b++;
    out.push({ ...c, name, beats: until - t, b0: t - bars[b] });
  });
  return out;
}

// ---- learn/moods.js ----
/* Practice: a mood's scale, chords and arpeggios in one key, on your terms. You choose the hand, the
   octaves and the help; nothing moves on by itself, and a note counts in any octave unless you ask for the
   exact one. A key is known once you pass a check: both hands together, two octaves, no help, every note
   right and even at your own pace. Checks happen only when you ask. */

const EVEN = 0.35; // a check's notes may spread this much around your own pace (spread of gaps / mean)

const M = () => Store.s.moods;
const prefs = () => M().prefs;
const keyOf = (mood, pc) => `${mood}:${pc}`;
const keyState = (mood, pc) => M().keys[keyOf(mood, pc)] || null;
function ensureKey(mood, pc) {
  const k = keyOf(mood, pc);
  if (!M().keys[k]) M().keys[k] = { checks: [], extra: {}, last: todayKey() };
  return M().keys[k];
}
const isKnown = (mood, pc) => ((keyState(mood, pc) || {}).checks || []).length > 0;

// what to learn first: major and minor (natural and harmonic) in every key; everything else is optional
const CORE = ['major', 'natural', 'harmonic'];

/* ---------- drills for the player ----------
   id: m:<mood>:<pc>:<hand>:<octaves>[:<what>]. what: (the scale) | check | arp<semis>.<type> |
   inv<semis>.<type> (inversions) | prog<n> | lh<pattern>.<n> (a left-hand pattern over progression n) |
   circle (major home chords around the circle of fifths) */
const runId = (mood, pc, hand, octs, what = '') =>
  `m:${mood}:${pc}:${hand}:${octs}${what ? ':' + what : ''}`;
function parseRun(id) {
  const [, mood, pc, hand, octs, what = ''] = id.split(':');
  const chord = re => {
    const x = re.exec(what);
    return x ? [+x[1], x[2]] : null;
  };
  const lh = /^lh(\w+)\.(\d+)$/.exec(what);
  const prog = /^prog(\d+)$/.exec(what);
  return {
    mood,
    pc: +pc,
    hand,
    octs: +octs,
    what,
    check: what === 'check',
    circle: what === 'circle',
    arp: chord(/^arp(\d+)\.(\w+)$/),
    inv: chord(/^inv(\d+)\.(\w+)$/),
    prog: prog ? +prog[1] : null,
    lh: lh ? { id: lh[1], prog: +lh[2] } : null,
  };
}
const HAND_WORD = { rh: 'right hand', lh: 'left hand', ht: 'hands together' };
const cap = s => s[0].toUpperCase() + s.slice(1);
const octWord = n => `${n} octave${n > 1 ? 's' : ''}`;

// what a drill plays, and how the player should treat it (kind: its cues and finger numbers; npb: notes
// per beat with the metronome; even: the notes come evenly)
function drillOf(r) {
  if (r.circle)
    return {
      title: 'Around the circle of fifths',
      sub: r.hand === 'ht' ? 'right hand chords, left hand roots' : HAND_WORD[r.hand],
      run: circleRun(r.hand),
      kind: 'pattern',
      npb: 0.5,
    };
  if (r.arp) {
    const run = arpeggioRun(r.mood, r.pc, r.arp, r.hand, r.octs);
    return {
      title: `${run.info.name} arpeggio`,
      sub: `${HAND_WORD[r.hand]} · ${octWord(r.octs)}`,
      run,
      kind: 'arp',
    };
  }
  if (r.inv) {
    const run = inversionRun(r.mood, r.pc, r.inv, r.hand);
    return { title: `${run.info.name}: inversions`, sub: HAND_WORD[r.hand], run, kind: 'pattern', npb: 0.5 };
  }
  if (r.lh) {
    const run = lhPatternRun(r.mood, r.pc, r.lh.id, r.lh.prog);
    return {
      title: LH_BY[r.lh.id].n,
      sub: run.steps
        .map(s => s.chord)
        .filter(Boolean)
        .join(' – '),
      run,
      kind: 'pattern',
      npb: 1,
      even: false,
    };
  }
  if (r.prog != null) {
    const run = progressionRun(r.mood, r.pc, r.prog, r.hand);
    return {
      title: run.steps.map(s => s.chord).join(' – '),
      sub: r.hand === 'ht' ? 'right hand chords, left hand roots' : HAND_WORD[r.hand],
      run,
      kind: 'pattern',
      npb: 0.5,
    };
  }
  return {
    title: r.check ? 'Check' : cap(HAND_WORD[r.hand]),
    sub: `${r.check ? 'hands together · ' : ''}${octWord(r.octs)}`,
    run: moodRun(r.mood, r.pc, r.hand, r.octs),
    kind: 'scale',
  };
}

// the player's source for a Moods drill: free practice, with the help you choose; checks are strict
function moodSource() {
  return {
    def(id) {
      const r = parseRun(id);
      if (!MOOD_BY[r.mood]) return null;
      const D = drillOf(r);
      const npb = D.npb || 2;
      const beats = D.run.steps.length ? D.run.steps[D.run.steps.length - 1].beat + 1 / npb : 0;
      return {
        kind: D.kind,
        title: D.title,
        sub: D.sub,
        phases: [r.hand],
        target: prefs().bpm,
        build: () => ({
          ...D.run,
          npb,
          even: D.even !== false,
          beats,
          meter: [4, 4],
          unit: 1,
          clicks: 4,
        }),
      };
    },
    plan(id) {
      const r = parseRun(id);
      const p = prefs();
      return {
        mode: p.tempo && !r.check ? 'tempo' : 'wait',
        hand: r.hand,
        hints: r.check ? false : p.keys,
        fingers: r.check ? false : p.fingers,
        anyOctave: !r.check && !p.exactOctave,
        bpm: p.bpm,
        label: r.check ? 'Check: no help. Every note right, evenly, at your own pace.' : null,
      };
    },
    record: (id, rep) => recordRun(id, rep),
    // traces of technique from a key's runs (see music/technique.js): advice when a habit shows up
    state: id => {
      const r = parseRun(id);
      return { tech: (keyState(r.mood, r.pc) || {}).tech || [] };
    },
    stage: id => (parseRun(id).check ? { text: 'Check', cls: 'brass' } : { text: '', cls: '' }),
    criterion: id => criterionOf(parseRun(id)),
  };
}

function criterionOf(r) {
  const k = keyState(r.mood, r.pc) || { checks: [], extra: {} };
  if (r.check || !r.what) return isKnown(r.mood, r.pc) ? 'Known' : 'A check makes it known';
  const n = (k.extra || {})[`${r.what}:${r.hand}`] || 0;
  return n ? `Played clean ${n} time${n > 1 ? 's' : ''}` : 'Not played clean yet';
}

// a run is done: count it, and (for a check) see whether it passes
function recordRun(id, rep) {
  const r = parseRun(id);
  const k = ensureKey(r.mood, r.pc);
  k.last = todayKey();
  const counted = rep.clean && rep.valid !== false;
  if (rep.tech && rep.valid !== false) k.tech = (k.tech || []).concat([rep.tech]).slice(-6);
  if (r.what && !r.check) {
    if (counted) {
      k.extra = k.extra || {};
      const x = `${r.what}:${r.hand}`;
      k.extra[x] = (k.extra[x] || 0) + 1;
    }
    Store.save();
    return { msg: rep.clean ? 'Clean.' : rep.msg || 'Again.', tone: rep.clean ? 'ok' : 'bad', change: null };
  }
  if (!r.check) {
    Store.save();
    return { msg: rep.clean ? 'Clean.' : rep.msg || 'Again.', tone: rep.clean ? 'ok' : 'bad', change: null };
  }
  const was = isKnown(r.mood, r.pc);
  const even = rep.cv == null || rep.cv <= EVEN;
  const pass = counted && even;
  if (pass && !k.checks.includes(todayKey())) k.checks.push(todayKey());
  Store.save();
  return {
    msg: pass
      ? was
        ? 'Check passed. Still yours.'
        : `Check passed: ${moodName(r.mood, r.pc)} is known.`
      : rep.valid === false
        ? 'Checks count only from your piano (MIDI or microphone).'
        : !rep.clean
          ? 'Not this time: a check needs every note right with no help.'
          : 'Every note right, but uneven: let the notes come at a steady pace.',
    tone: pass ? 'ok' : 'bad',
    change: pass && !was ? 'stage' : null,
  };
}

// ---- learn/moodplay.js ----
/* Play's listening and backing, without the screen. With a mood chosen, it plays a backing (a held drone,
   or one of the mood's progressions with a bass) and listens: notes outside the scale and whether they
   resolved by a step, the color note, chord tones on the strong beats, motifs that came back, thirds and
   sixths, call and response, and what the left hand did against a pattern. Nothing is scored. The view
   (views/play.js) draws it; onChange tells it something moved (a new chord, new counts). */

const SPLIT = 60; // below middle C is the left hand
const TOGETHER = 50; // ms: notes this close are one gesture (a chord, a dyad)
const blankStats = () => ({
  ms: 0,
  notes: 0,
  outside: 0, // notes outside the scale
  resolved: 0, // ...followed by a step into the scale
  pedalMs: 0,
  lh: Object.fromEntries(['n', 'fit', ...LH_KINDS].map(k => [k, 0])),
  rh: {
    color: 0,
    resolved: 0,
    strong: 0,
    onChord: 0,
    sequences: 0,
    repeats: 0,
    thirds: 0,
    sixths: 0,
    calls: 0,
    answers: 0,
    home: 0,
  },
});

// the sitting so far, across moods (for the read-back afterwards: learn/journal.js)
const blankTally = () => ({ ms: 0, notes: 0, lh: 0, pedalMs: 0, lo: 108, hi: 21, chords: {}, moods: {} });

function createCompanion({ onChange = () => {} } = {}) {
  const st = {
    mood: null,
    pc: 0,
    backing: 'off',
    prog: 0,
    song: null, // a tune whose chords the backing plays instead: {id, t, chords: [[s, type, beats, b0, name]]}
    bpm: 72,
    pattern: 'fifth',
    bars: [], // the backing's bars as they sound: {t (performance ms), i (chord)}
    nextBar: 0,
    bar: 0,
    held: [], // the drone's sounding notes
    call: null, // {from, until (performance ms), ms: the answer so far}
    lastAnswer: null,
  };
  let S = blankStats();
  let T = blankTally();
  let lastChord = { name: '', t: 0 };
  const inMood = () =>
    K ? (T.moods[st.mood + ':' + st.pc] ||= { ms: 0, notes: 0, outside: 0, resolved: 0, color: 0 }) : null;
  // the chord your hands hold (three or more notes sounding together), counted once per change
  const countChord = t => {
    const ms = [...Input.held.keys()];
    if (new Set(ms.map(pc12)).size < 3) return;
    const c = detectChord(ms, spellerFor(K ? moodSig(st.mood, st.pc) : 0));
    if (!c || c.root == null) return;
    if (c.name === lastChord.name && t - lastChord.t < 4000) return;
    lastChord = { name: c.name, t };
    const x = (T.chords[c.name] ||= { n: 0, root: c.root, type: c.type });
    x.n++;
  };
  let lastNote = 0;
  let lastTick = performance.now();
  let lhGroup = null;
  let rhGroup = null;
  let degrees = [];
  const lastIn = { rh: null, lh: null }; // the previous note of each hand: {m, outside}
  const timers = [];
  let K = null; // the chosen mood in its key: {M, tonic, tPc, scalePcs, color}

  const prog = () => (st.song ? st.song.chords : K.M.progs[st.prog].chords);
  const beatsOf = i => (st.song ? st.song.chords[i][2] : 4);
  const voiced = () => voiceProgression(st.mood, st.pc, prog());
  const lhVoiced = () => lhVoicing(st.mood, st.pc, prog());
  // the chord sounding at a moment (performance ms): the backing's when it plays, else the home chord
  const chordAt = t => {
    if (!K) return null;
    if (st.backing !== 'chords' || !st.bars.length) return { i: 0, beat: null, ...chordOf(0) };
    let b = st.bars[0];
    for (const x of st.bars) if (x.t <= t + 80) b = x;
    const b0 = st.song ? st.song.chords[b.i][3] : 0; // (a tune's chord can start mid-bar)
    return { i: b.i, beat: b0 + (t - b.t) / (60000 / st.bpm), ...chordOf(b.i) };
  };
  function chordOf(i) {
    const [s, type, , , name] = prog()[i];
    return { rootPc: pc12(K.tonic + s), type, name };
  }

  /* ---------- the backing: a pad that holds, a bass that plays ---------- */
  const stopSound = () => {
    st.held.forEach(h => Sounds.stop(h));
    st.held = [];
    Sounds.stopAll();
    timers.splice(0).forEach(clearTimeout);
  };
  const playBar = (t, i) => {
    const v = voiced()[i];
    const spb = 60 / st.bpm;
    const beats = beatsOf(i);
    v.right.forEach(m => {
      const h = Sounds.start('pad', m, 0.5, t);
      if (h) Sounds.stop(h, t + spb * beats - 0.05);
    });
    // the bass on beats 1 and 3 of a 4/4 bar; once for a shorter chord
    (beats >= 4 ? [0, 2] : [0]).forEach(b => {
      const h = Sounds.start('bass', v.root, b ? 0.45 : 0.6, t + b * spb);
      if (h) Sounds.stop(h, t + (b + Math.min(1.7, beats - 0.3)) * spb);
    });
  };
  const schedule = () => {
    if (!K || st.backing !== 'chords') return;
    const now = AudioEngine.now();
    while (st.nextBar < now + 0.3) {
      const at = Math.max(now, st.nextBar);
      const i = st.bar % prog().length;
      const bar = (60 / st.bpm) * beatsOf(i);
      playBar(at, i);
      st.bars.push({ t: AudioEngine.toPerf(at), i });
      if (st.bars.length > 16) st.bars.shift();
      timers.push(setTimeout(() => onChange('chord'), Math.max(0, (at - now) * 1000)));
      st.nextBar = at + bar;
      st.bar++;
    }
  };
  const restartBacking = () => {
    stopSound();
    st.bars = [];
    st.bar = 0;
    if (!K) return;
    if (st.backing !== 'off') AudioEngine.ensure();
    st.nextBar = AudioEngine.now() + 0.1;
    if (st.backing === 'drone') {
      // home and its fifth, held, in the middle of the piano where any speaker can play them
      const r = 48 + pc12(K.tPc - 48);
      st.held = [r, r + 7, r + 12].map(m => Sounds.start('pad', m, 0.55)).filter(Boolean);
    }
    onChange('chord');
  };

  /* ---------- listening ---------- */
  const countLh = g => {
    const c = chordAt(g.t);
    if (!c) return;
    S.lh.n++;
    S.lh[lhKind(g.ms, c.rootPc, c.type, K.tPc)]++;
    const want = new Set(patternBar(st.pattern, lhVoiced(), c.i, K.tPc).flatMap(x => x.ms.map(pc12)));
    if (g.ms.every(m => want.has(pc12(m)))) S.lh.fit++;
  };
  const countRh = g => {
    const d = dyadKind(g.ms);
    if (d === 'third') S.rh.thirds++;
    if (d === 'sixth') S.rh.sixths++;
  };
  const onNote = ev => {
    if (ev.m == null) return;
    const t = ev.t || performance.now();
    lastNote = performance.now();
    T.notes++;
    if (ev.m < SPLIT) T.lh++;
    T.lo = Math.min(T.lo, ev.m);
    T.hi = Math.max(T.hi, ev.m);
    clearTimeout(chordT);
    chordT = setTimeout(() => countChord(t), 120);
    if (!K) return;
    S.notes++;
    const B = inMood();
    B.notes++;
    if (pc12(ev.m) === K.color.pc) B.color++; // (either hand, for the read-back)
    const hand = ev.m < SPLIT ? 'lh' : 'rh';
    // a note outside the scale, and whether the same hand stepped from it into the scale
    const outside = !K.scalePcs.has(pc12(ev.m));
    const prev = lastIn[hand];
    if (prev && prev.outside && !outside && Math.abs(ev.m - prev.m) <= 2) (S.resolved++, B.resolved++);
    if (outside) (S.outside++, B.outside++);
    lastIn[hand] = { m: ev.m, outside };
    if (hand === 'lh') {
      if (lhGroup && t - lhGroup.t < TOGETHER) lhGroup.ms.push(ev.m);
      else {
        if (lhGroup) countLh(lhGroup);
        lhGroup = { t, ms: [ev.m] };
      }
      return;
    }
    if (rhGroup && t - rhGroup.t < TOGETHER) rhGroup.ms.push(ev.m);
    else {
      if (rhGroup) countRh(rhGroup);
      rhGroup = { t, ms: [ev.m] };
    }
    if (prev && pc12(prev.m) === K.color.pc && Math.abs(ev.m - prev.m) <= 2 && ev.m !== prev.m)
      S.rh.resolved++;
    if (pc12(ev.m) === K.color.pc) S.rh.color++;
    const c = chordAt(t);
    if (c && c.beat != null) {
      const off = Math.abs(c.beat % 2 < 1 ? c.beat % 2 : (c.beat % 2) - 2); // distance to beat 1 or 3
      if (off < 0.25) {
        S.rh.strong++;
        if (CHORD_TONES[c.type].some(x => pc12(c.rootPc + x) === pc12(ev.m))) S.rh.onChord++;
      }
    }
    const deg = degreeOf(ev.m, K.M.semis, K.tPc);
    if (deg != null) {
      degrees.push(deg);
      if (degrees.length > 16) degrees.shift();
      const echo = motifEcho(degrees);
      if (echo) {
