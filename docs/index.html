        S.rh[echo === 'sequence' ? 'sequences' : 'repeats']++;
        degrees = degrees.slice(-3); // count each return once
      }
    }
    if (st.call && t >= st.call.from - 150) st.call.ms.push(ev.m);
  };
  let chordT = 0;
  const offInput = Input.on(onNote);

  const tick = setInterval(
    Log.guard('companion tick', () => {
      const now = performance.now();
      const dt = now - lastTick;
      lastTick = now;
      // time counts while you play (a note in the last four seconds)
      if (now - lastNote < 4000) {
        S.ms += dt;
        T.ms += dt;
        if (K) inMood().ms += dt;
        if (Input.pedal) ((S.pedalMs += dt), (T.pedalMs += dt));
      }
      // a gesture is over once nothing joins it
      if (lhGroup && now - lhGroup.t > 200) (countLh(lhGroup), (lhGroup = null));
      if (rhGroup && now - rhGroup.t > 200) (countRh(rhGroup), (rhGroup = null));
      if (st.call && now > st.call.until) {
        const a = judgeAnswer(st.call.ms, K.M.semis, K.tPc);
        st.call = null;
        if (a.n) S.rh.answers++;
        if (a.home) S.rh.home++;
        st.lastAnswer = a;
        onChange('answer');
      }
      schedule();
      onChange('tick');
    }),
    250,
  );

  return {
    st,
    get stats() {
      return S;
    },
    get key() {
      return K;
    },
    get tally() {
      return T;
    },
    // since the last note (ms), and a fresh tally for the next sitting
    get quiet() {
      return lastNote ? performance.now() - lastNote : Infinity;
    },
    newSitting() {
      T = blankTally();
      lastChord = { name: '', t: 0 };
    },
    chordAt,
    voiced,
    lhVoiced,
    setMood(mood, pc) {
      if (mood && !MOOD_BY[mood]) mood = null;
      st.mood = mood;
      st.pc = pc || 0;
      st.prog = 0;
      st.song = null;
      if (!mood) K = null;
      else {
        const scale = moodScale(mood, st.pc);
        const tonic = midiOf(scale[0]);
        K = {
          M: MOOD_BY[mood],
          tonic,
          tPc: pc12(tonic),
          scalePcs: new Set(scale.map(n => pc12(midiOf(n)))),
          color: colorNote(mood, st.pc),
        };
      }
      S = blankStats();
      degrees = [];
      lastIn.rh = lastIn.lh = null;
      if (!K) st.backing = 'off';
      restartBacking();
      Log.ev('companion mood', { mood, pc: st.pc });
    },
    setBacking(v) {
      st.backing = v;
      restartBacking();
    },
    setProg(i) {
      st.prog = i;
      st.song = null;
      restartBacking();
    },
    /* noodle over a tune's chords: its mood and key, its tempo, its chords looping as the backing.
       song: {id, t, mood, pc, bpm, chords: songChords(...)} */
    setSong(song) {
      this.setMood(song.mood, song.pc);
      if (!K) return;
      st.song = {
        id: song.id,
        t: song.t,
        chords: song.chords.map(c => [pc12(c.pc - K.tPc), c.type, c.beats, c.b0, c.name]),
      };
      st.bpm = Math.max(48, Math.min(132, song.bpm || st.bpm));
      st.backing = 'chords';
      restartBacking();
    },
    setBpm(bpm) {
      st.bpm = Math.max(48, Math.min(132, bpm));
      restartBacking();
    },
    setPattern(id) {
      st.pattern = id;
    },
    // the left-hand pattern over the progression, once, on the piano voice
    hearPattern() {
      if (!K) return;
      AudioEngine.ensure();
      const V = lhVoiced();
      const spb = 60 / st.bpm;
      const t0 = AudioEngine.now() + 0.1;
      // (a tune's first four chords)
      V.slice(0, 4).forEach((_, i) =>
        patternBar(st.pattern, V, i, K.tPc).forEach(g =>
          g.ms.forEach(m => AudioEngine.note(m, t0 + (i * 4 + g.b) * spb, g.d * spb, 0.55)),
        ),
      );
    },
    // call and response: a phrase from DaCapo, then a window as long again (and two beats) for your answer
    playCall() {
      if (!K) return;
      AudioEngine.ensure();
      const phrase = callPhrase(st.mood, st.pc);
      const spb = 60 / st.bpm;
      const t0 = AudioEngine.now() + 0.1;
      phrase.forEach(n => AudioEngine.note(n.m, t0 + n.b * spb, n.d * spb * 0.95, 0.6));
      const last = phrase[phrase.length - 1];
      const len = (last.b + last.d) * spb;
      const start = AudioEngine.toPerf(t0 + len);
      st.call = { from: start, until: start + (len + 2 * spb) * 1000, ms: [] };
      st.lastAnswer = null;
      S.rh.calls++;
    },
    destroy() {
      clearInterval(tick);
      clearTimeout(chordT);
      offInput();
      stopSound();
      AudioEngine.stopAll();
    },
  };
}

// ---- learn/journal.js ----
/* After a sitting: what you played, read back plainly, and one thing to try next time. Pure: it reads the
   tally Play's companion kept (learn/moodplay.js) and writes a journal entry. Nothing is scored.

   tally: {ms, notes, lh, pedalMs, lo, hi, chords: {name: {n, root, type}}, ms, moods: {'mood:pc': {ms,
   notes, outside, resolved, color}}}; guess: guessMood() of the sitting's notes, for when no mood was
   chosen. */

const pct = (a, b) => (b ? Math.round((100 * a) / b) : 0);

function readBack(tally, { guess = null, day = '', at = 0, id = '' } = {}) {
  // the mood: the one you were in longest, else what it sounded like
  const longest = Object.entries(tally.moods || {}).sort((a, b) => b[1].ms - a[1].ms)[0];
  const chosen = longest && longest[1].ms >= tally.ms * 0.3 ? longest : null;
  const [mood, pc] = chosen
    ? [chosen[0].split(':')[0], +chosen[0].split(':')[1]]
    : guess
      ? [guess.mood, guess.pc]
      : [null, 0];
  const M = mood && MOOD_BY[mood] ? MOOD_BY[mood] : null;
  const tonic = M ? pc12(pc) : 0;
  const tones = M ? new Set(M.semis.map(s => pc12(tonic + s))) : null;
  // the chords, most played first, with their numerals when they belong to the mood (or near it)
  const chords = Object.entries(tally.chords || {})
    .sort((a, b) => b[1].n - a[1].n)
    .slice(0, 8)
    .map(([name, c]) => {
      const fits =
        tones && CHORD_TONES[c.type] && CHORD_TONES[c.type].every(x => tones.has(pc12(c.root + x)));
      return {
        name,
        n: c.n,
        num: M && CHORD_TONES[c.type] ? chordInfo(mood, pc, [pc12(c.root - tonic), c.type]).num : '',
        out: M ? !fits : false,
      };
    });
  const m = chosen ? chosen[1] : null;
  const color = M ? colorNote(mood, pc) : null;
  const sig = M ? moodChords(mood, pc).find(c => c.signature) : null;
  const usedRoots = new Set(Object.values(tally.chords || {}).map(c => c.root));
  const out = {
    id,
    day,
    at,
    min: Math.max(1, Math.round(tally.ms / 60000)),
    notes: tally.notes,
    mood,
    pc,
    chosen: !!chosen,
    sure: chosen ? 1 : guess ? guess.sure : 0,
    alt: !chosen && guess ? guess.alt : null,
    chords,
    outside: m ? m.outside : null,
    resolved: m ? m.resolved : null,
    color: m && color ? { name: color.name, n: m.color } : null,
    lh: pct(tally.lh, tally.notes),
    pedal: pct(tally.pedalMs, tally.ms),
    range: tally.notes ? [tally.lo, tally.hi] : null,
  };
  out.tip = suggestion(out, { M, sig, color, usedRoots, tonic });
  return out;
}

// one thing to try next time: the most useful of these, in order
function suggestion(r, { M, sig, color, usedRoots, tonic }) {
  if (r.outside >= 4 && r.resolved < r.outside / 2)
    return {
      text: `${r.outside - r.resolved} of your ${r.outside} notes outside the scale did not resolve. Next time, step from an outside note to its neighbor in the scale, a half step away: that turns a wrong-sounding note into tension and release.`,
    };
  if (r.lh < 10 && r.notes > 40)
    return {
      text: 'Your left hand mostly rested. Try root and fifth under each chord (Try something → left hand), even just once a bar.',
    };
  if (M && sig && r.chosen && !usedRoots.has(pc12(tonic + sig.semis)))
    return {
      text: `You did not play ${sig.name} (${sig.num}), the chord that gives ${M.n.toLowerCase()} its sound. Try it next to the home chord.`,
    };
  if (M && color && r.color && r.color.n < 3)
    return {
      text: `The color note, ${color.name} (${color.what}), hardly came up. ${color.tip[0].toUpperCase() + color.tip.slice(1)}.`,
    };
  if (r.pedal > 90 && r.chords.length > 1)
    return {
      text: 'The pedal was down almost the whole time. Lift it as each chord changes and the harmony stays clear.',
    };
  if (M) {
    const n = moodNeighbors(r.mood)[0];
    if (n)
      return {
        text: `Next time, try ${moodName(n.id, r.pc)}: ${n.change}. One note different, a new color.`,
        mood: n.id,
      };
  }
  return { text: 'Next time, choose a mood first: its scale lights up and you can play with a backing.' };
}

// ---- views/settings.js ----
/* Settings, backups and the About panel. */

function settingsSheet() {
  const S = Store.s.settings;
  const T = S.thru;
  const toggle = (id, on, label, hint = '') => `
    <label class="toggle">
      <input type="checkbox" id="${id}" ${on ? 'checked' : ''}>
      <span><b>${label}</b>${hint ? `<span class="small">${hint}</span>` : ''}</span>
    </label>`;
  const modes = [
    ['midi', 'MIDI (USB)'],
    ['mic', 'Microphone'],
    ['touch', 'On-screen keys'],
  ];
  openSheet(
    `<div class="sheethead"><h2 class="h2">Settings</h2>${closeBtn}</div>
    <h3 class="h3">Your piano</h3>
    ${seg('sMode', modes, Input.mode)}
    <div id="sStatus" class="small"></div>
    <div class="prose small">
      <p><b>MIDI</b> hears exactly what you play: chords, timing, loudness, pedal. Use the piano's square
        "USB to Host" port with a data cable (USB-B to USB-C on a phone). Chrome or Edge on Android or a
        computer; iPhone and iPad browsers have no MIDI.</p>
      <p><b>Microphone</b> works with any piano but hears one note at a time, so chords and
        hands-together drills are practice only.</p>
      ${
        IN_CLAUDE
          ? `<p class="notice">Inside the Claude app, MIDI and the microphone are blocked. Open your hosted
               copy of DaCapo in Chrome to play with your piano; your progress syncs only within Claude.</p>`
          : ''
      }
    </div>
    <div id="sOut"></div>
    <button class="btn sm ghost" type="button" id="sGuide" style="align-self:flex-start">
      Guide to your piano →</button>
    <div class="divider"></div>
    <h3 class="h3">Your piano through this device</h3>
    ${toggle('sThru', T.on, 'Play my piano through this device', "What you play sounds here too, with another sound. Turn the piano's own volume down to hear only this.")}
    <div class="row">
      <label class="field">Sound<select class="input sm" id="sThruR">${SOUNDS.map(x => `<option value="${x.id}" ${x.id === T.right ? 'selected' : ''}>${esc(x.n)}</option>`).join('')}</select></label>
      <label class="field">Below middle C<select class="input sm" id="sThruL"><option value="">the same</option>${SOUNDS.map(x => `<option value="${x.id}" ${T.split && x.id === T.left ? 'selected' : ''}>${esc(x.n)}</option>`).join('')}</select></label>
    </div>
    <div class="divider"></div>
    <h3 class="h3">Sound and screen</h3>
    ${toggle('sSnd', S.sound, 'App sounds', 'Examples and the backing. The metronome always clicks.')}
    <label class="field">Volume<input type="range" id="sVol" min="0" max="1" step="0.05" value="${S.volume}"></label>
    ${toggle('sWake', S.keepAwake, 'Keep the screen on while practicing', 'Releases after 20 minutes without playing.')}
    ${toggle('sOct', S.octaveTolerant, 'Microphone: forgive octave mix-ups', 'Low piano notes are often heard an octave off.')}
    <div class="divider"></div>
    <h3 class="h3">Your data</h3>
    <p class="small">Progress is saved on this device${IN_CLAUDE ? ' and in your Claude account' : ''}.
      A backup file moves it to another device.</p>
    <div class="row">
      <button class="btn sm" type="button" id="sBackup">Save a backup file</button>
      <label class="btn sm" style="cursor:pointer">Restore from file<input type="file" id="sRestore"
        accept=".json,application/json" hidden></label>
    </div>
    <div class="divider"></div>
    <h3 class="h3">Help</h3>
    <div class="row">
      <button class="btn sm" type="button" id="sBody">Body and hands</button>
      <button class="btn sm" type="button" id="sReport">Report a problem</button>
      <button class="btn sm ghost" type="button" id="sAbout">About</button>
    </div>
    <details>
      <summary>Start over</summary>
      <div class="stack">
        <p class="small">Erases all progress on this device (save a backup first). Your recordings stay.</p>
        <button class="btn sm bad" type="button" id="sReset">Erase my progress</button>
      </div>
    </details>
    <p class="small">DaCapo ${APP_VERSION} · ${BUILD}</p>`,
    sheet => {
      const status = () => {
        const connected = `<span class="tag ${Input.live ? 'ok' : ''}">${Input.live ? 'Connected' : 'Not connected'}</span>`;
        $('#sStatus', sheet).innerHTML = `${connected} ${esc(Input.lastErr || Input.status || '')}`;
        const o = $('#sOut', sheet);
        o.innerHTML =
          Input.mode === 'midi' && Input.live && MidiOut.port
            ? toggle(
                'sMidiOut',
                S.midiOut,
                "Play the app's sounds on the piano",
                "Examples and backing tracks come out of the piano's own speakers.",
              ) +
              toggle(
                'sClick',
                S.clickOnPiano,
                'Metronome on the piano too',
                "Uses the piano's drum sounds on channel 10 if it has them; otherwise leave this off.",
              )
            : '';
        const mo = $('#sMidiOut', sheet);
        if (mo)
          mo.onchange = e => {
            S.midiOut = e.target.checked;
            Store.save();
            Log.ev('midi out ' + S.midiOut);
          };
        const mc = $('#sClick', sheet);
        if (mc)
          mc.onchange = e => {
            S.clickOnPiano = e.target.checked;
            Store.save();
          };
      };
      status();
      let changed = false;
      bindSegs(sheet, {
        sMode: async v => {
          changed = true;
          AudioEngine.ensure();
          await Input.setMode(v);
          status();
        },
      });
      const offS = Store.on(k => {
        if (k === 'input') status();
      });
      $('#sGuide', sheet).onclick = pianoGuideSheet;
      $('#sThru', sheet).onchange = e => {
        T.on = e.target.checked;
        Store.save();
      };
      $('#sThruR', sheet).onchange = e => {
        T.right = e.target.value;
        Store.save();
      };
      $('#sThruL', sheet).onchange = e => {
        T.split = e.target.value ? 60 : 0;
        if (e.target.value) T.left = e.target.value;
        Store.save();
      };
      $('#sSnd', sheet).onchange = e => {
        S.sound = e.target.checked;
        Store.save();
      };
      $('#sVol', sheet).oninput = e => {
        S.volume = +e.target.value;
        if (AudioEngine.master) AudioEngine.master.gain.value = S.volume;
      };
      $('#sVol', sheet).onchange = () => Store.save();
      $('#sWake', sheet).onchange = e => {
        S.keepAwake = e.target.checked;
        Store.save();
        if (!S.keepAwake) Wake.release();
      };
      $('#sOct', sheet).onchange = e => {
        S.octaveTolerant = e.target.checked;
        Store.save();
      };
      $('#sBackup', sheet).onclick = saveBackupFile;
      $('#sRestore', sheet).onchange = e => restoreFile(e.target.files[0]);
      $('#sBody', sheet).onclick = bodySheet;
      $('#sReport', sheet).onclick = () => reportSheet();
      $('#sAbout', sheet).onclick = aboutSheet;
      $('#sReset', sheet).onclick = () => {
        if (!confirmTwice(sheet)) return;
        const keep = { settings: Store.s.settings, favorites: Store.s.profile.favorites };
        Store.s = DEFAULT_STATE();
        Store.s.settings = keep.settings;
        Store.s.profile.favorites = keep.favorites;
        Store.save();
        Log.ev('progress erased');
        closeSheet();
        go('play');
        toast('Progress erased');
      };
      return () => {
        offS();
        // the screen you are on may show a connection notice: redraw it for the new input
        if (changed) setTimeout(() => go(UI.view, UI.params), 0);
      };
    },
    { label: 'Settings' },
  );
}

function confirmTwice(sheet) {
  const b = $('#sReset', sheet);
  if (b.dataset.armed) return true;
  b.dataset.armed = '1';
  b.textContent = 'Tap again to erase';
  setTimeout(() => {
    if (b.isConnected) {
      delete b.dataset.armed;
      b.textContent = 'Erase my progress';
    }
  }, 4000);
  return false;
}

function saveBackupFile() {
  const data = JSON.stringify({
    dacapo: 5,
    state: Store.s,
    imports: Library.imports(),
  });
  saveFile(`dacapo-backup-${todayKey()}.json`, data);
}

function restoreFile(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      const st = o.state || o;
      if (!st || typeof st !== 'object' || !st.settings) throw new Error('This is not a DaCapo backup.');
      Store.s = migrate(st);
      Store.s.savedAt = Date.now();
      Store.save();
      if (Array.isArray(o.imports)) Library.saveImports(o.imports);
      Library.cache.clear();
      Store.emit(); // brings the restored items up to date (see app.js)
      Log.ev('restored backup', { v: st.v });
      closeSheet();
      go('play');
      toast('Progress restored');
    } catch (e) {
      Log.warn('restore failed', String(e.message || e));
      toast(e.message || 'That file could not be read.');
    }
  };
  r.readAsText(file);
}

function aboutSheet() {
  openSheet(
    `<div class="sheethead"><h2 class="h2">About DaCapo</h2>${closeBtn}</div>
    <div class="prose small">
      <p>Free and open source (<a href="https://github.com/drwooodz/dacapo" target="_blank"
        rel="noopener">github.com/drwooodz/dacapo</a>). Everything runs in your browser; nothing is sent
        anywhere unless you send a report yourself.</p>

/* The line that asks you to connect your piano, where it matters. */

function connectNotice(always) {
  if (Input.live && Input.mode === 'midi')
    return always
      ? `<div class="notice info row between">
           <span>Piano connected: ${esc(Input.midiNames[0] || 'MIDI')}.</span>
         </div>`
      : '';
  if (IN_CLAUDE)
    return `<div class="notice info"><span>MIDI is blocked inside the Claude app. To play with your piano,
      open the hosted copy of DaCapo in Chrome. Here you can try everything with the on-screen keys
      (practice only, not counted).</span></div>`;
  if (Input.mode === 'mic' && Input.live)
    return always
      ? '<div class="notice info">Listening through the microphone: single notes only.</div>'
      : '';
  const text =
    Input.mode === 'midi'
      ? 'Your piano is not connected. Plug it in by USB (the square port), then tap Connect.'
      : 'Connect your piano so DaCapo can hear you.';
  return `<div class="notice info row between">
    <span>${text}</span>
    <button class="btn sm" type="button" data-connect>Connect</button>
  </div>`;
}

function bindConnect() {
  $$('[data-connect]').forEach(b => {

}

// ---- views/takes.js ----
/* Recording yourself: takes kept on the device, with playback. */

/* ---------- takes: record what you play (any input), see it as a piano roll, play it back ---------- */
const Takes = {
  rec: null,
  playing: null,
  list() {
    try {
      return JSON.parse(localStorage.getItem('dacapo.takes') || '[]');
    } catch (e) {
      return [];
    }
  },
  saveList(l) {
    try {
      localStorage.setItem('dacapo.takes', JSON.stringify(l.slice(0, 8)));
    } catch (e) {
      toast('This browser is full; older takes were not kept.');
    }
  },
  start() {
    this.stopRec(true);
    this.rec = createRecorder();
  },
  stopRec(discard) {
    const r = this.rec;
    this.rec = null;
    const ev = r && r.stop();
    if (discard || !ev) return null;
    const take = { id: 't' + Date.now().toString(36), d: Date.now(), ev, name: '' };
    const l = this.list();
    l.unshift(take);
    this.saveList(l);
    return take;
  },
  notes: take => readTake(take.ev),
  play(take, onEnd) {
    this.stop();
    const { notes, dur } = this.notes(take);
    const t0 = AudioEngine.now() + 0.15;
    notes.forEach(n => AudioEngine.note(n.m, t0 + n.t / 1000, n.dur / 1000, clamp(n.vel, 0.08, 1)));
    const startPerf = performance.now() + 150;
    this.playing = {
      startPerf,
      dur,
      timer: setTimeout(() => {
        this.playing = null;
        onEnd && onEnd();
      }, dur + 400),
    };
    return startPerf;
  },
  stop() {
    if (this.playing) {
      clearTimeout(this.playing.timer);
      this.playing = null;
      AudioEngine.stopAll();
    }
  },
  stats(take) {
    const { notes, pedal, dur } = this.notes(take);
    if (!notes.length) return null;
    const vels = notes.map(n => n.vel);
    const lo = Math.min(...notes.map(n => n.m)),
      hi = Math.max(...notes.map(n => n.m));
    const onsets = groupSteps(
      notes.map(n => ({ t: n.t, m: n.m, vel: n.vel })),
      50,
    );
    let gap = 0;
    for (let i = 1; i < onsets.length; i++) gap = Math.max(gap, onsets[i].t - onsets[i - 1].t);
    const ped = pedal.reduce((a, [x, y]) => a + (y - x), 0);
    return {
      n: notes.length,
      dur,
      nps: notes.length / Math.max(1, dur / 1000),
      vlo: Math.min(...vels),
      vhi: Math.max(...vels),
      vavg: meanOf(vels),
      lo,
      hi,
      gap,
      pedalPct: dur ? Math.min(1, ped / dur) : 0,
    };
  },
  roll(take, w = 640) {
    const { notes, pedal, dur } = this.notes(take);
    if (!notes.length) return '';
    const lo = Math.min(...notes.map(n => n.m)) - 2,
      hi = Math.max(...notes.map(n => n.m)) + 2;
    const rows = hi - lo + 1;
    const rh = clamp(Math.floor(180 / rows), 3, 9);
    const H = rows * rh + 18;
    const sx = (w - 30) / Math.max(1, dur);
    let s = '';
    for (let m = lo; m <= hi; m++) {
      const y = (hi - m) * rh;
      if (isBlack(m)) s += `<rect x="28" y="${y}" width="${w - 28}" height="${rh}" fill="var(--sunk)"/>`;
      if (m % 12 === 0)
        s +=
          `<text x="0" y="${y + rh - 1}" font-size="8" fill="var(--muted)">C${m / 12 - 1}</text>` +
          `<line x1="28" x2="${w}" y1="${y + rh}" y2="${y + rh}" stroke="var(--line)"/>`;
    }
    for (let sec = 0; sec * 1000 < dur; sec += dur > 30000 ? 5 : 1) {
      const x = 30 + sec * 1000 * sx;
      s += `<line x1="${x}" x2="${x}" y1="0" y2="${rows * rh}" stroke="var(--line)" stroke-width=".5"/>`;
    }
    notes.forEach(n => {
      const y = (hi - n.m) * rh;
      const x = (30 + n.t * sx).toFixed(1);
      const keyW = Math.max(2, n.key * sx);
      const ringW = Math.max(0, (n.dur - n.key) * sx);
      const opacity = (0.35 + n.vel * 0.65).toFixed(2); // louder notes are darker
      // the pedal's ringing: a thin faint tail after the key comes up
      if (ringW > 1)
        s += `<rect class="ring" x="${(+x + keyW).toFixed(1)}" y="${y + rh / 2 - 1}" width="${ringW.toFixed(1)}" height="2" fill="var(--rh)" fill-opacity="0.25"/>`;
      s += `<rect class="key" x="${x}" y="${y + 0.5}" width="${keyW.toFixed(1)}" height="${rh - 1}" rx="1.5" fill="var(--rh)" fill-opacity="${opacity}"/>`;
    });
    pedal.forEach(([a, b]) => {
      const width = Math.max(2, (b - a) * sx);
      s += `<rect x="${30 + a * sx}" y="${rows * rh + 6}" width="${width}" height="6" rx="2" fill="var(--brass)"/>`;
    });
    const playhead = `<line class="playhead" x1="30" x2="30" y1="0" y2="${rows * rh}" stroke="var(--brass)" stroke-width="2" opacity="0"/>`;
    return `<svg class="roll" viewBox="0 0 ${w} ${H}" style="width:100%;height:auto" role="img"
      aria-label="Piano roll of the take"><g>${s}</g>${playhead}</svg>`;
  },
};

function takesCardHTML() {
  return `
    <div class="cardhead">
      <h2 class="h2">Takes</h2>
      <span class="small">Record, look, listen back</span>
    </div>
    <p class="small">Listening back is the most honest feedback there is. Record a run-through, then listen
      away from the keys: you hear rushing, uneven runs and muddy pedal that you miss while playing. Takes
      stay on this device (last 8).</p>
    <div class="row">
      <button class="btn cover" type="button" id="tkRec">● Record</button>
      <span class="small mono" id="tkTime"></span>
    </div>
    <div id="tkList" class="stack"></div>`;
}

function bindTakes(root) {
  const recBtn = $('#tkRec', root),
    timeEl = $('#tkTime', root),
    list = $('#tkList', root);
  let tick = 0;
  const paint = () => {
    const l = Takes.list();
    list.innerHTML = l.length
      ? l
          .map((t, i) => {
            const st = Takes.stats(t);
            if (!st) return '';
            const when = new Date(t.d).toLocaleString(undefined, {
              month: 'short',
              day: 'numeric',
              hour: 'numeric',
              minute: '2-digit',
            });
            const facts = [
              fmtTime(st.dur / 1000),
              `${st.n} notes`,
              `${midiName(st.lo, true)}–${midiName(st.hi, true)}`,
              st.vhi > 0 && `dynamics ${dynName(st.vlo)}–${dynName(st.vhi)}`,
              st.pedalPct && `pedal down ${Math.round(st.pedalPct * 100)}%`,
              st.gap > 2500 && `longest stop ${(st.gap / 1000).toFixed(1)}s`,
            ];
            return `<div class="take" data-id="${t.id}">
              <div class="row between">
                <b>${esc(t.name || when)}</b>
                <div class="row">
                  <button class="btn sm" type="button" data-play="${t.id}">▶ Play</button>
                  <button class="btn sm ghost" type="button" data-del="${t.id}" aria-label="Delete take">Delete</button>
                </div>
              </div>
              ${i === 0 ? `<div class="rollwrap">${Takes.roll(t)}</div>` : ''}
              <div class="small">${facts.filter(Boolean).join(' · ')}</div>
            </div>`;
          })
          .join('')
      : '<p class="small">No takes yet.</p>';
    list.querySelectorAll('[data-play]').forEach(
      b =>
        (b.onclick = () => {
          const t = Takes.list().find(x => x.id === b.dataset.play);
          if (!t) return;
          if (Takes.playing) {
            Takes.stop();
            paint();
            return;
          }
          b.textContent = '■ Stop';
          const start = Takes.play(t, paint);
          const svg = b.closest('.take').querySelector('svg.roll');
          if (svg) {
            const ph = svg.querySelector('.playhead');
            const W = svg.viewBox.baseVal.width;
            const dur = Takes.playing.dur;
            ph.setAttribute('opacity', 1);
            const anim = () => {
              if (!Takes.playing) {
                ph.setAttribute('opacity', 0);
                return;
              }
              const x = 30 + clamp((performance.now() - start) / dur, 0, 1) * (W - 30);
              ph.setAttribute('x1', x);
              ph.setAttribute('x2', x);
              requestAnimationFrame(anim);
            };
            requestAnimationFrame(anim);
          }
        }),
    );
    list.querySelectorAll('[data-del]').forEach(
      b =>
        (b.onclick = () => {
          const all = Takes.list();
          const i = all.findIndex(x => x.id === b.dataset.del);
          const [gone] = all.splice(i, 1);
          Takes.saveList(all);
          paint();
          toast('Take deleted', 6000, {
            label: 'Undo',
            run: () => {
              const a = Takes.list();
              a.splice(i, 0, gone);
              Takes.saveList(a);
              paint();
            },
          });
        }),
    );
  };
  recBtn.onclick = () => {
    if (Takes.rec) {
      clearInterval(tick);
      const t = Takes.stopRec();
      recBtn.textContent = '● Record';
      recBtn.classList.remove('bad');
      timeEl.textContent = '';
      if (!t) toast('Nothing was played, so nothing was saved.');
      paint();
      return;
    }
    AudioEngine.ensure();
    Takes.start();
    recBtn.textContent = '■ Stop';
    recBtn.classList.add('bad');
    const t0 = performance.now();
    tick = setInterval(() => {
      timeEl.textContent =
        '● ' + fmtTime((performance.now() - t0) / 1000) + (Takes.rec ? ` · ${Takes.rec.notes} notes` : '');
    }, 250);
  };
  paint();
  return () => {
    clearInterval(tick);
    if (Takes.rec) {
      const t = Takes.stopRec();
      if (t) toast('Take saved');
    }
    Takes.stop();
  };
}

// ---- views/journal.js ----
/* The journal: each sitting at Play, read back (learn/journal.js), with its recording when it is one of the
   last few. The read-back shows right after you stop, and again from the list. */

const when = at =>
  new Date(at).toLocaleString(undefined, {
    weekday: 'short',
    month: 'short',
    day: 'numeric',
    hour: 'numeric',
    minute: '2-digit',
  });

// what was heard, plainly
function readBackHTML(e) {
  const moodLine = e.mood
    ? e.chosen
      ? `In <b>${esc(moodName(e.mood, e.pc))}</b>.`
      : `It sounded like <b>${esc(moodName(e.mood, e.pc))}</b>${e.alt ? ` (or ${esc(moodName(e.alt.mood, e.alt.pc))})` : ''}.`
    : '';
  const facts = [
    `${e.min} min`,
    `${e.notes} notes`,
    e.range && `${midiName(e.range[0], true)} to ${midiName(e.range[1], true)}`,
    `left hand ${e.lh}%`,
    `pedal down ${e.pedal}%`,
  ].filter(Boolean);
  const chords = e.chords.length
    ? `<div class="chips">${e.chords
        .map(
          c =>
            `<span class="chip${c.out ? ' out' : ''}" title="${c.n}×">${esc(c.name)}${c.num ? ` <span class="small">${esc(c.num)}</span>` : ''}</span>`,
        )
        .join('')}</div>`
    : '<p class="small">No chords held (three notes or more together).</p>';
  const scale =
    e.outside == null
      ? ''
      : `<p class="small">${
          e.outside
            ? `${e.outside} note${e.outside === 1 ? '' : 's'} outside the scale, ${e.resolved} resolved by a step.`
            : 'Every note in the scale.'
        }${e.color ? ` The color note ${esc(e.color.name)}: ${e.color.n}×.` : ''}</p>`;
  const hasRec = !!Sittings.get(e.id);
  return `
    <p>${moodLine}</p>
    <p class="small">${esc(facts.join(' · '))}</p>
    <span class="eyebrow">Chords you held</span>
    ${chords}
    ${scale}
    <div class="callout"><b>Next time</b><p>${esc(e.tip.text)}</p></div>
    <div class="row">
      ${hasRec ? `<button class="btn sm" type="button" data-rb="hear">▶ Hear it</button>` : ''}
      ${e.mood ? `<button class="btn sm ghost" type="button" data-rb="about">About ${esc(moodName(e.mood, e.pc))}</button>` : ''}
      ${e.mood ? `<button class="btn sm ghost" type="button" data-rb="practice">Practice it</button>` : ''}
      ${e.tip.mood ? `<button class="btn sm ghost" type="button" data-rb="try">Try ${esc(moodName(e.tip.mood, e.pc))}</button>` : ''}
    </div>`;
}

// the read-back's buttons; onTry(mood, pc) changes Play's mood
function bindReadBack(root, e, { onTry } = {}) {
  $$('[data-rb]', root).forEach(b => {
    b.onclick = () => {
      const k = b.dataset.rb;
      if (k === 'hear') {
        const take = Sittings.get(e.id);
        if (!take) return;
        if (Takes.playing) {
          Takes.stop();
          b.textContent = '▶ Hear it';
          return;
        }
        b.textContent = '■ Stop';
        Takes.play(take, () => (b.textContent = '▶ Hear it'));
        return;
      }
      closeSheet();
      if (k === 'about') go('explore', { mood: e.mood, pc: e.pc });
      if (k === 'practice') go('practice', { mood: e.mood, pc: e.pc });
      if (k === 'try') onTry ? onTry(e.tip.mood, e.pc) : go('play', { mood: e.tip.mood, pc: e.pc });
    };
  });
}

// the list of sittings, newest first
function journalHTML() {
  const list = (Store.s.journal || []).slice().reverse();
  if (!list.length)
    return '<p class="small">Each time you sit down and play here, it is read back and kept.</p>';
  return `<div class="stack" style="gap:0">${list
    .slice(0, 30)
    .map(
      e => `<button type="button" class="piecerow" data-sit="${esc(e.id)}">
        <span class="grow"><span class="ttl">${esc(when(e.at))}</span>
          <span class="small">${e.min} min${e.mood ? ' · ' + esc(moodName(e.mood, e.pc)) : ''}${
            e.chords.length
              ? ' · ' +
                esc(
                  e.chords
                    .slice(0, 4)
                    .map(c => c.name)
                    .join(' '),
                )
              : ''
          }</span></span>
        <span class="chev" aria-hidden="true">›</span></button>`,
    )
    .join('')}</div>`;
}

function bindJournal(root, opts) {
  $$('[data-sit]', root).forEach(b => {
    b.onclick = () => {
      const e = (Store.s.journal || []).find(x => x.id === b.dataset.sit);
      if (!e) return;
      openSheet(
        `<div class="sheethead"><h2 class="h2">${esc(when(e.at))}</h2>${closeBtn}</div>${readBackHTML(e)}`,
        sheet => {
          bindReadBack(sheet, e, opts);
          return () => Takes.stop();
        },
        { label: 'A sitting' },
      );
    };
  });
}

// ---- views/play.js ----
/* Play: sit down and play; DaCapo keeps up. It names each chord as you play it (with its numeral, once a
   mood is chosen), says which key you seem to be in, and writes your last notes on the staff. Choose a
   mood (or take the key it heard) and the scale lights up across the whole keyboard, a backing can play,
   and notes outside the scale are noted with whether they resolved. "Try something" gives one idea for
   each hand at a time. Recording and a metronome are at the bottom. Nothing here is scored. */

const playView = (page, params = {}) => {
  const p = prefs();
  const C = createCompanion({ onChange: kind => changed(kind) });
  const ui = Object.assign({ tool: 'free', tryOpen: false }, UI.playState || {});
  UI.playState = ui;
  onUnmount(() => C.destroy());

  page.innerHTML = `
    <h1 class="h1 pagetitle">Play</h1>
    ${
      Store.s.profile.onboarded
        ? ''
        : `<section class="card welcome" id="plyWelcome">
      <span class="eyebrow">Welcome to DaCapo</span>
      <p>Connect your piano and play. DaCapo names each chord, hears which key you are in, and keeps your
        playing correct. <b>Explore</b> finds a mood by the feel you want, with its chords and the circle of
        fifths; <b>Practice</b> is there when you want to work on something; <b>Songs</b> has pieces to learn.</p>
      <button class="btn sm cover" type="button" id="plyHi" style="align-self:flex-start">Got it</button>
    </section>`
    }
    ${connectNotice()}
    <div id="plyReadback"></div>
    <section class="card stack">
      <div class="readout">
        <div class="stack" style="gap:2px;min-width:0">
          <div class="chordname" id="plyChord">–</div>
          <div class="small" id="plyLong">Play a chord or a few notes</div>
        </div>
        <div class="stack" style="align-items:flex-end;gap:4px">
          <span class="tag" id="plyPedal">Pedal up</span>
          <span class="small mono" id="plyVel"></span>
        </div>
      </div>
      <div id="plyMood"></div>
      <div class="kbwrap scrollx" id="plyKbWrap"><div class="kb88" id="plyKb"></div></div>
      <p class="small mono" id="plyOut"></p>
      <div class="row between" id="plySit" hidden><span class="small" id="plySitTime"></span>
        <button class="btn sm ghost" type="button" id="plyDone">Done</button></div>
      <div class="staffwrap" id="plyStaff"></div>
    </section>
    <div id="plyBacking"></div>
    <div id="plyTry"></div>
    <details class="card" id="plyTakesBox"><summary><b>Recordings</b> <span class="small">record a run, listen back</span></summary>
      <div id="plyTakes"></div></details>
    <details class="card" id="plyJournalBox"><summary><b>Journal</b> <span class="small">each sitting, read back</span></summary>
      <div id="plyJournal"></div></details>
    <section class="card row between" id="plyMetro"></section>`;
  bindConnect();
  const hi = $('#plyHi', page);
  if (hi)
    hi.onclick = () => {
      Store.s.profile.onboarded = true;
      Store.save();
      $('#plyWelcome', page).remove();
    };

  /* ---------- the mood you are in ---------- */
  const setMood = (mood, pc) => {
    C.setMood(mood, pc);
    if (mood) Object.assign(p, { mood, pc });
    Store.save();
    paintMood();
    paintBacking();
    paintTry();
    paintKb();
  };
  const paintMood = () => {
    const box = $('#plyMood', page);
    if (C.st.mood) {
      box.innerHTML = `<div class="row between">
          <span><span class="eyebrow">In</span> <b>${esc(moodName(C.st.mood, C.st.pc))}</b>
            <span class="small">${esc(MOOD_BY[C.st.mood].feel)}</span></span>
          <span class="row" style="gap:6px">
            <button class="btn sm ghost" type="button" id="plyAbout">About it</button>
            <button class="btn sm" type="button" id="plyChoose">Change</button>
            <button class="btn sm ghost" type="button" id="plyClear" aria-label="Stop following a mood">×</button>
          </span>
        </div>`;
      $('#plyAbout', box).onclick = () => go('explore', { mood: C.st.mood, pc: C.st.pc });
      $('#plyClear', box).onclick = () => setMood(null);
    } else {
      box.innerHTML = `<div class="row between">
          <span class="small" id="plyKey">Play for a little while and I will work out the key.</span>
          <span class="row" style="gap:6px">
            <button class="btn sm ghost" type="button" id="plyUse" hidden></button>
            <button class="btn sm" type="button" id="plyChoose">Choose a mood</button>
          </span>
        </div>`;
      paintKey();
    }
    $('#plyChoose', box).onclick = chooseSheet;
  };
  // the key it hears, while no mood is chosen; one tap takes it
  let keyNow = null;
  const paintKey = () => {
    keyNow = guessMood(Live.hist.slice(-80));
    const e = $('#plyKey', page);
    if (!e) return;
    const use = $('#plyUse', page);
    if (!keyNow) {
      e.textContent = 'Play for a little while and I will work out the key.';
      use.hidden = true;
      return;
    }
    const { mood, pc, alt, sure } = keyNow;
    const how = sure > 0.5 ? 'Sounds like' : sure > 0.2 ? 'Probably' : 'Possibly';
    const or = sure <= 0.5 ? ` (or ${moodName(alt.mood, alt.pc)})` : '';
    e.textContent = `${how} ${moodName(mood, pc)}${or}.`;
    use.hidden = false;
    use.textContent = 'Use it';
    use.onclick = () => setMood(mood, pc);
  };

  function chooseSheet() {
    let mood = C.st.mood || p.mood || 'natural';
    const body = () => `
      <div class="stack" style="gap:10px">${MOOD_FAMILIES.map(
        f => `<div><span class="eyebrow">${esc(f.n)}</span>
          <div class="chips">${MOODS.filter(m => m.fam === f.id)
            .map(
              m =>
                `<button type="button" class="chip" data-m="${m.id}" aria-pressed="${m.id === mood}">${esc(m.n)}</button>`,
            )
            .join('')}</div></div>`,
      ).join('')}</div>
      <p class="small">${esc(MOOD_BY[mood].feel)}</p>
      <span class="eyebrow">Key</span>
      <div class="chips">${PCS.map(
        x => `<button type="button" class="chip" data-k="${x}">${esc(tonicName(mood, x))}</button>`,
      ).join('')}</div>
      <p class="small">Not sure which? <button type="button" class="linkbtn small" id="chFeel">Find one by feel</button></p>`;
    openSheet(
      `<div class="sheethead"><h2 class="h2">Choose a mood</h2>${closeBtn}</div><div id="chBody" class="stack"></div>`,
      sheet => {
        const paint = () => {
          $('#chBody', sheet).innerHTML = body();
          $$('[data-m]', sheet).forEach(b => {
            b.onclick = () => {
              mood = b.dataset.m;
              paint();
            };
          });
          $$('[data-k]', sheet).forEach(b => {
            b.onclick = () => {
              closeSheet();
              setMood(mood, +b.dataset.k);
            };
          });
          $('#chFeel', sheet).onclick = () => {
            closeSheet();
            go('explore', { tab: 'feel' });
          };
        };
        paint();
      },
      { label: 'Choose a mood' },
    );
  }

  /* ---------- the keyboard: what you hold, the scale, the idea's notes ---------- */
  const kb = () => $('#plyKb svg', page);
  const paintKb = () => {
    const marks = {};
    const K = C.key;
    if (K) {
      const c = C.chordAt(performance.now());
      const tones = new Set(CHORD_TONES[c.type].map(x => pc12(c.rootPc + x)));
      for (let m = 21; m <= 108; m++) {
        if (!K.scalePcs.has(m % 12)) continue;
        const special =
          ui.tryOpen &&
          ((ui.tool === 'color' && m % 12 === K.color.pc) || (ui.tool === 'targets' && tones.has(m % 12)));
        marks[m] = { cls: special ? 'color' : 'tone' };
      }
      if (ui.tryOpen)
        patternBar(C.st.pattern, C.lhVoiced(), c.i, K.tPc).forEach(g =>
          g.ms.forEach((m, k) => (marks[m] = { cls: 'lh', f: g.f[k] })),
        );
    }
    $('#plyKb', page).innerHTML = kbSVG({ from: 21, to: 108, h: 120, marks });
    paintHeld();
  };
  const paintHeld = () => {
    const svg = kb();
    if (!svg) return;
    svg.querySelectorAll('.held,.sus').forEach(e => e.classList.remove('held', 'sus'));
    Live.sustained.forEach(m => {
      const e = svg.querySelector(`[data-m="${m}"]`);
      if (e) e.classList.add('sus');
    });
    Input.held.forEach((_, m) => {
      const e = svg.querySelector(`[data-m="${m}"]`);
      if (e) {
        e.classList.remove('sus');
        e.classList.add('held');
      }
    });
  };

  /* ---------- the readout ---------- */
  let lastChord = null;
  const sig = () =>
    C.key ? moodSig(C.st.mood, C.st.pc) : keyNow && keyNow.conf > 0.04 ? keyNow.best.sig : 0;
  const paintReadout = () => {
    $('#plyPedal', page).textContent = Input.pedal ? 'Pedal down' : 'Pedal up';
    $('#plyPedal', page).className = 'tag ' + (Input.pedal ? 'lh' : '');
    const sounding = [...new Set([...Input.held.keys(), ...Live.sustained])];
    if (sounding.length >= 2) lastChord = detectChord(sounding, spellerFor(sig()));
    $('#plyChord', page).textContent = lastChord ? lastChord.name : '–';
    let long = lastChord ? lastChord.long : 'Play a chord or a few notes';
    if (lastChord && lastChord.type && C.key) {
      const num = chordInfo(C.st.mood, C.st.pc, [pc12(lastChord.root - C.key.tPc), lastChord.type]).num;
      long = `${num} · ${long}`;
    }
    $('#plyLong', page).textContent = long;
    $('#plyStaff', page).innerHTML = recentStaff();
  };
  // your last notes on a grand staff, the newest highlighted
  const recentStaff = () => {
    const steps = groupSteps(Live.hist.slice(-40)).slice(-14);
    if (!steps.length) return '';
    const sp = spellerFor(sig());
    const items = steps.map((g, k) => ({
      notes: g.ms.map(m => ({ n: sp(m), st: m >= 60 ? 't' : 'b', cls: k === steps.length - 1 ? 'cur' : '' })),
    }));
    const svg = staffSVG({ clef: 'grand', sig: sig(), items, spacing: 30, minW: 320, bottom: 40 }).svg;
    return `<div style="max-width:720px;margin:0 auto">${svg}</div>`;
  };
  const paintOut = () => {
    const S = C.stats;
    const e = $('#plyOut', page);
    if (!C.key || !S.notes) {
      e.textContent = '';
      return;
    }
    e.textContent =
      `${S.notes} notes · ${fmtTime(S.ms / 1000)}` +
      (S.outside
        ? ` · ${S.outside} outside the scale, ${S.resolved} resolved by a step`
        : ' · all in the scale');
  };

  /* ---------- backing ---------- */
  const paintBacking = () => {
    const box = $('#plyBacking', page);
    if (!C.key) {
      box.innerHTML = '';
      return;
    }
    const st = C.st;
    const M = C.key.M;
    const V = C.voiced();
    const c = C.chordAt(performance.now());
    if (st.song && st.backing === 'chords') {
      box.innerHTML = `<section class="card stack">
        <div class="row between"><span><span class="eyebrow">Over the chords of</span> <b>${esc(st.song.t)}</b></span>
          <button class="btn sm ghost" type="button" id="plySongOff">Stop</button></div>
        <div class="row between">
          <div class="improv-chords" id="plyChords">${songChips(c.i)}</div>
          <span class="row" style="gap:4px"><span class="small mono">♩ ${st.bpm}</span>
            <button class="btn sm ghost" type="button" data-bbpm="-6" aria-label="Slower">−</button>
            <button class="btn sm ghost" type="button" data-bbpm="6" aria-label="Faster">+</button></span>
        </div>
        <p class="small">The tune's chords loop, with its numerals in ${esc(moodName(st.mood, st.pc))}.
          Play the tune over them, or your own line.</p>
        ${Sounds.on() ? '' : '<p class="small">Sound is off in Settings.</p>'}
      </section>`;
      $('#plySongOff', box).onclick = () => {
        C.setProg(0);
        C.setBacking('off');
        paintBacking();
      };
      $$('[data-bbpm]', box).forEach(b => {
        b.onclick = () => {
          C.setBpm(st.bpm + +b.dataset.bbpm);
          paintBacking();
        };
      });
      return;
    }
    box.innerHTML = `<section class="card stack">
      <div class="row between"><span class="eyebrow">Backing</span>
        ${Sounds.on() ? '' : '<span class="small">Sound is off in Settings.</span>'}</div>
      ${seg(
        'plyBack',
        [
          ['off', 'Off'],
          ['drone', 'Drone'],
          ['chords', 'Chords'],
        ],
        st.backing,
        'sm',
      )}
      ${
        st.backing === 'chords'
          ? `${seg(
              'plyProg',
              M.progs.map((pr, k) => [
                String(k),
                pr.chords.map(x => chordInfo(st.mood, st.pc, x).num).join(' – '),
              ]),
              String(st.prog),
              'sm wrap',
            )}
            <p class="small">${esc(M.progs[st.prog].why)}.</p>
            <div class="row between">
              <div class="improv-chords" id="plyChords">${V.map((v, k) => `<span class="chip" aria-pressed="${k === c.i}">${esc(v.info.name)}</span>`).join('')}</div>
              <span class="row" style="gap:4px"><span class="small mono">♩ ${st.bpm}</span>
                <button class="btn sm ghost" type="button" data-bbpm="-6" aria-label="Slower">−</button>
                <button class="btn sm ghost" type="button" data-bbpm="6" aria-label="Faster">+</button></span>
            </div>`
          : st.backing === 'drone'
            ? '<p class="small">Home and its fifth, held: anything in the scale fits.</p>'
            : ''
      }
    </section>`;
    bindSegs(box, {
      plyBack: v => {
        C.setBacking(v);
        paintBacking();
      },
      plyProg: v => {
        C.setProg(+v);
        paintBacking();
      },
    });
    $$('[data-bbpm]', box).forEach(b => {
      b.onclick = () => {
        C.setBpm(st.bpm + +b.dataset.bbpm);
        paintBacking();
      };
    });
  };
  // a tune's chord now and the three after it, with their numerals
  const songChips = i => {
    const ch = C.st.song.chords;
    return [0, 1, 2, 3]
      .map(k => {
        const [s, type, , , name] = ch[(i + k) % ch.length];
        const num = chordInfo(C.st.mood, C.st.pc, [s, type]).num;
        return `<span class="chip" aria-pressed="${k === 0}">${esc(name)} <span class="small">${esc(num)}</span></span>`;
      })
      .join('');
  };
  const paintChordChips = () => {
    const c = C.chordAt(performance.now());
    if (c && C.st.song) {
      const box = $('#plyChords', page);
      if (box) box.innerHTML = songChips(c.i);
    } else if (c)
      $$('#plyChords .chip', page).forEach((el, k) => el.setAttribute('aria-pressed', String(k === c.i)));
  };

  /* ---------- try something: one idea for each hand ---------- */
  const paintTry = () => {
    const box = $('#plyTry', page);
    if (!C.key) {
      box.innerHTML = '';
      return;
    }
    if (!ui.tryOpen) {
      box.innerHTML = `<section class="card pathcard"><div class="grow"><b>Try something</b>
        <span class="small">An idea for the right hand and a pattern for the left, one at a time.</span></div>
        <button class="btn sm" type="button" id="plyTryGo">Show me</button></section>`;
      $('#plyTryGo', box).onclick = () => {
        ui.tryOpen = true;
        paintTry();
        paintKb();
      };
      return;
    }
    const tool = RH_TOOLS.find(t => t.id === ui.tool) || RH_TOOLS[0];
    const pat = LH_BY[C.st.pattern];
    const opt = (list, sel) =>
      list
        .map(x => `<option value="${x.id}" ${x.id === sel ? 'selected' : ''}>${esc(x.n)}</option>`)
        .join('');
    box.innerHTML = `<section class="card stack">
      <div class="row between"><b>Try something</b>
        <button class="btn sm ghost" type="button" id="plyTryHide">Hide</button></div>
      <div class="stack" style="gap:4px">
        <div class="row between"><span class="eyebrow">Right hand</span>
          <span class="row" style="gap:6px"><select class="input sm" id="plyTool" aria-label="Right-hand idea">${opt(RH_TOOLS, tool.id)}</select>
          <button class="btn sm ghost" type="button" id="plyToolNext" aria-label="Another idea">↻</button></span></div>
        <p class="small">${esc(toolHow(tool.id, C.st.mood, C.st.pc))}</p>
        ${tool.id === 'call' ? '<button class="btn sm" type="button" id="plyCall" style="align-self:flex-start">Play a call</button>' : ''}
        <p class="small mono" id="plyRh"></p>
      </div>
      <div class="stack" style="gap:4px">
        <div class="row between"><span class="eyebrow">Left hand</span>
          <span class="row" style="gap:6px"><select class="input sm" id="plyPat" aria-label="Left-hand pattern">${opt(LH_PATTERNS, pat.id)}</select>
          <button class="btn sm ghost" type="button" id="plyPatNext" aria-label="Another pattern">↻</button></span></div>
        <div class="row"><p class="small grow">${esc(pat.how)} Its notes are marked on the keyboard.</p>
          <button class="btn sm ghost" type="button" id="plyHearLh">Hear it</button></div>
        <p class="small mono" id="plyLh"></p>
      </div>
    </section>`;
    $('#plyTryHide', box).onclick = () => {
      ui.tryOpen = false;
      paintTry();
      paintKb();
    };
    const setTool = id => {
      ui.tool = id;
      // landing on chord tones needs chords to land on
      if (id === 'targets' && C.st.backing !== 'chords') {
        C.setBacking('chords');
        paintBacking();
      }
      paintTry();
      paintKb();
    };
    const setPat = id => {
      C.setPattern(id);
      paintTry();
      paintKb();
    };
    $('#plyTool', box).onchange = e => setTool(e.target.value);
    $('#plyPat', box).onchange = e => setPat(e.target.value);
    $('#plyToolNext', box).onclick = () =>
      setTool(RH_TOOLS[(RH_TOOLS.indexOf(tool) + 1) % RH_TOOLS.length].id);
    $('#plyPatNext', box).onclick = () =>
      setPat(LH_PATTERNS[(LH_PATTERNS.indexOf(pat) + 1) % LH_PATTERNS.length].id);
    $('#plyHearLh', box).onclick = () => C.hearPattern();
    const call = $('#plyCall', box);
    if (call)
      call.onclick = () => {
        C.playCall();
        $('#plyRh', page).textContent = 'Your turn: answer when the call ends.';
      };
    paintFeedback();
  };
  const paintFeedback = () => {
    const rh = $('#plyRh', page);
    const lhEl = $('#plyLh', page);
    if (!rh || !C.key) return;
    const S = C.stats;
    const r = S.rh;
    const lh = S.lh;
    const K = C.key;
    if (ui.tool === 'call') {
      const a = C.st.lastAnswer;
      if (C.st.call) return;
      rh.textContent = a
        ? !a.n
          ? 'No answer heard. Play a call again when you are ready.'
          : `Answered with ${a.n} note${a.n > 1 ? 's' : ''}${a.home ? ', home at the end. Settled.' : '; it ended away from home. Try ending on the home note.'}`
        : r.calls
          ? `${r.answers} of ${r.calls} calls answered · ${r.home} ended home`
          : '';
    } else
      rh.textContent = {
        free: '',
        color: r.color
          ? `${K.color.name} ${r.color} time${r.color > 1 ? 's' : ''}, resolved ${r.resolved}`
          : `${K.color.name} not played yet`,
        targets:
          C.st.backing !== 'chords'
            ? 'Needs the chords backing.'
            : r.strong
              ? `On beats 1 and 3: ${r.onChord} of ${r.strong} notes were chord tones`
              : 'Nothing on beats 1 and 3 yet',
        motif:
          r.sequences + r.repeats ? `${r.sequences} sequences · ${r.repeats} repeats` : 'No motif back yet',
        dyads: r.thirds + r.sixths ? `${r.thirds} thirds · ${r.sixths} sixths` : 'No thirds or sixths yet',
      }[ui.tool];
    lhEl.textContent = lh.n ? `${Math.round((lh.fit / lh.n) * 100)}% on the pattern · ${lhWord(lh)}` : '';
  };
  const lhWord = lh => {
    const kinds = ['chords', 'octaves', 'rootFifth', 'broken', 'pedal', 'passing'];
    const top = kinds.reduce((a, k) => (lh[k] > lh[a] ? k : a), kinds[0]);
    return lh[top] < lh.n * 0.5
      ? 'a mix'
      : {
          chords: 'mostly chords',
          octaves: 'mostly octaves',
          rootFifth: 'mostly roots and fifths',
          broken: 'moving through the chords',
          pedal: 'holding home under the chords',
          passing: 'walking between chord tones',
        }[top];
  };

  /* ---------- recordings and the metronome ---------- */
  $('#plyTakes', page).innerHTML = takesCardHTML();
  const offTakes = bindTakes($('#plyTakes', page));
  if (typeof offTakes === 'function') onUnmount(offTakes);
  const paintMetro = () => {
    const box = $('#plyMetro', page);
    box.innerHTML = `<span><b>Metronome</b> <span class="small mono">♩ ${Metro.bpm || 72}</span></span>
      <span class="row" style="gap:4px">
        <button class="btn sm ghost" type="button" data-mbpm="-4" aria-label="Slower">−</button>
        <button class="btn sm ghost" type="button" data-mbpm="4" aria-label="Faster">+</button>
        <button class="btn sm ghost" type="button" id="plyTap">Tap</button>
        <button class="btn sm ${Metro.running ? 'cover' : ''}" type="button" id="plyMetroGo">${Metro.running ? 'Stop' : 'Start'}</button>
      </span>`;
    const run = bpm => Metro.start({ bpm, beats: Metro.beats || 4, sub: 1 });
    $$('[data-mbpm]', box).forEach(b => {
      b.onclick = () => {
        const bpm = clamp((Metro.bpm || 72) + +b.dataset.mbpm, 30, 220);
        if (Metro.running) run(bpm);
        else Metro.bpm = bpm;
        paintMetro();
      };
    });
    $('#plyTap', box).onclick = () => {
      Metro.tap();
      if (Metro.running) run(Metro.bpm);
      paintMetro();
    };
    $('#plyMetroGo', box).onclick = () => {
      AudioEngine.ensure();
      if (Metro.running) Metro.stop();
      else run(Metro.bpm || 72);
      paintMetro();
    };
  };
  paintMetro();
  onUnmount(() => Metro.stop());

  /* ---------- keeping up ---------- */
  let raf = 0;
  let keyT = 0;
  const sched = () => {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      paintHeld();
      paintReadout();
    });
  };
  const o1 = Input.on(ev => {
    sched();
    if (ev.src === 'midi')
      $('#plyVel', page).textContent = `${dynName(ev.vel)} · ${Math.round(ev.vel * 127)}`;
    if (!C.key) {
      clearTimeout(keyT);
      keyT = setTimeout(paintKey, 600);
    }
  });
  const o2 = Input.onOff(sched);
  onUnmount(() => {
    o1();
    o2();
    cancelAnimationFrame(raf);
    clearTimeout(keyT);
  });
  /* ---------- a sitting: from your first note until you stop (90 s quiet, Done, or leaving Play) ---------- */
  let rec = createRecorder();
  const endSitting = reason => {
    const T = C.tally;
    const ev = rec ? rec.stop() : null;
    rec = reason === 'leave' ? null : createRecorder();
    C.newSitting();
    $('#plySit', page).hidden = true;
    // a few notes in passing are not a sitting
    if (!ev || T.notes < SITTING.minNotes || T.ms < SITTING.minMs) return;
    const { notes } = readTake(ev);
    const id = 's' + Date.now().toString(36);
    const entry = readBack(T, {
      guess: guessMood(notes.map(n => ({ m: n.m, t: n.t, d: n.dur }))),
      day: todayKey(),
      at: Date.now(),
      id,
    });
    Store.s.journal.push(entry);
    Store.save();
    Sittings.save(id, ev);
    Log.ev('sitting', { min: entry.min, notes: entry.notes, mood: entry.mood, reason });
    if (reason === 'leave') {
      toast('Your sitting is in the journal');
      return;
    }
    showReadBack(entry);
    paintJournal();
  };
  const showReadBack = entry => {
    const box = $('#plyReadback', page);
    box.innerHTML = `<section class="card stack readback">
      <div class="row between"><h2 class="h2">That sitting</h2>
        <button class="btn sm ghost" type="button" id="plyRbClose" aria-label="Close">×</button></div>
      ${readBackHTML(entry)}</section>`;
    bindReadBack(box, entry, { onTry: (mood, pc) => setMood(mood, pc) });
    $('#plyRbClose', box).onclick = () => (box.innerHTML = '');
    box.scrollIntoView({ block: 'nearest' });
  };
  const paintJournal = () => {
    const box = $('#plyJournal', page);
    box.innerHTML = journalHTML();
    bindJournal(box, { onTry: (mood, pc) => setMood(mood, pc) });
  };
  paintJournal();
  $('#plyDone', page).onclick = () => endSitting('done');
  const paintSit = () => {
    const T = C.tally;
    if (!T.notes) return;
    if (C.quiet > SITTING.quiet) {
      endSitting('quiet');
      return;
    }
    $('#plySit', page).hidden = false;
    $('#plySitTime', page).textContent = `This sitting: ${fmtTime(T.ms / 1000)} · ${T.notes} notes`;
  };
  onUnmount(() => endSitting('leave'));

  function changed(kind) {
    if (kind === 'chord') {
      paintChordChips();
      if (ui.tryOpen) paintKb();
    } else if (kind === 'answer' || kind === 'tick') {
      paintOut();
      paintFeedback();
      if (kind === 'tick') paintSit();
    }
  }

  // a mood to start in: from Explore or Practice ("Noodle in this"), else none until you choose one
  const start = params.mood && MOOD_BY[params.mood] ? params.mood : null;
  setMood(start, start ? (Number.isInteger(+params.pc) ? +params.pc % 12 : plainestKey(start)) : 0);
  // or a tune's chords (Songs: "Noodle over its chords")
  const song = params.song && Library.get(params.song);
  if (song && song.syms && song.mood) {
    C.setSong({ ...song, chords: songChords(song.syms, Library.bars(song.id)) });
    Object.assign(p, { mood: song.mood, pc: song.pc });
    paintMood();
    paintBacking();
    paintTry();
    paintKb();
  }
  // keep the middle of the keyboard in view
  requestAnimationFrame(() => {
    const wrap = $('#plyKbWrap', page);
    const k = kb() && kb().querySelector('[data-m="60"]');
    if (k && wrap && wrap.scrollWidth > wrap.clientWidth)
      wrap.scrollLeft =
        k.getBoundingClientRect().left -
        wrap.getBoundingClientRect().left -
        wrap.clientWidth / 2 +
        wrap.scrollLeft;
  });
  paintReadout();
  Log.ev('play open', { mood: start });
};

// ---- views/hear.js ----
/* Hearing a mood: its scale, its chords (each voiced nearest the one before, the root below), and a short
   phrase (the progression under the scale rising, then the color note and home). */

function hearScale(mood, pc) {
  AudioEngine.ensure();
  AudioEngine.stopAll();
  AudioEngine.seq(
    moodRun(mood, pc, 'rh', 1).steps.map(s => s.midis[0]),
    0.32,
    0.6,
    0.55,
  );
}

function hearChords(mood, pc, chords, { bar = 1.8, melody = false } = {}) {
  AudioEngine.ensure();
  AudioEngine.stopAll();
  const V = voiceProgression(mood, pc, chords);
  const scale = moodScale(mood, pc).map(midiOf);
  const t0 = AudioEngine.now() + 0.1;
  V.forEach((v, i) => {
    const t = t0 + i * bar;
    AudioEngine.note(v.root, t, bar, 0.45);
    AudioEngine.chord(v.right, t, bar, 0.28);
    // a few scale notes above, stepping toward a chord tone
    if (melody)
      [0, 1, 2].forEach(j =>
        AudioEngine.note(scale[(i * 2 + j * 2) % scale.length] + 12, t + j * (bar / 3), bar / 3, 0.4),
      );
  });
}

function hearPhrase(mood, pc) {
  AudioEngine.ensure();
  AudioEngine.stopAll();
  const t0 = AudioEngine.now() + 0.1;
  earPhrase(mood, pc).forEach(n => AudioEngine.note(n.m, t0 + n.t, n.d, n.v));
}

// ---- music/musicxml.js ----
/* Reading a MusicXML score (score-partwise, as MuseScore, Finale, Sibelius and Dorico export it) into a
   piece: the notes of every part (a piano part's two staves, or a melody part and a bass part), ties
   joined, bars, time and key signatures, clefs, the tempo, fingerings and chord symbols when the file has
   them. Repeats are played as written once; grace notes are left out. Pure except for DOMParser. */

const STEP = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
// MusicXML's chord kinds, as the chord types the app names
const KIND = {
  major: 'maj',
  minor: 'min',
  diminished: 'dim',
  augmented: 'aug',
  dominant: 'dom7',
  'major-seventh': 'maj7',
  'minor-seventh': 'min7',
  'half-diminished': 'hdim7',
  'diminished-seventh': 'dim7',
  'major-minor': 'minmaj7',
  'suspended-second': 'sus2',
  'suspended-fourth': 'sus4',
  // (6ths, 9ths and the rest are named by their triad)
  'major-sixth': 'maj',
  'minor-sixth': 'min',
  'dominant-ninth': 'dom7',
  'major-ninth': 'maj7',
  'minor-ninth': 'min7',
  'dominant-11th': 'dom7',
  'dominant-13th': 'dom7',
  power: 'maj',
};
const SYM = {
  maj: '',
  min: 'm',
  dim: '°',
  aug: '+',
  dom7: '7',
  maj7: 'maj7',
  min7: 'm7',
  hdim7: 'ø7',
  dim7: '°7',
  minmaj7: 'm(maj7)',
  sus2: 'sus2',
  sus4: 'sus4',
};

const kids = (el, name) => (el ? [...el.children].filter(c => c.localName === name) : []);
const kid = (el, name) => kids(el, name)[0] || null;
const num = (el, name, def = 0) => {
  const k = kid(el, name);
  return k ? +k.textContent.trim() : def;
};
const text = (el, name) => {
  const k = kid(el, name);
  return k ? k.textContent.trim() : '';
};

function parseMusicXML(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('This file is not readable MusicXML.');
  const root = doc.documentElement;
  if (root.localName === 'score-timewise')
    throw new Error('This MusicXML is “timewise”; export it again as a normal (partwise) score.');
  if (root.localName !== 'score-partwise') throw new Error('This is not a MusicXML score.');
  const title =
    text(kid(root, 'work'), 'work-title') ||
    text(root, 'movement-title') ||
    [...root.querySelectorAll('credit-words')].map(c => c.textContent.trim()).find(Boolean) ||
    '';
  const composer = [...root.querySelectorAll('identification > creator')].find(
    c => c.getAttribute('type') === 'composer',
  );
  const parts = kids(root, 'part');
  if (!parts.length) throw new Error('The score has no parts.');

  const notes = [];
  const harmony = [];
  const measureLen = []; // the longest each measure runs, over all parts (beats)
  const ts = [];
  const keys = [];
  const clefs = [];
  let bpm = null;
  let pickup = false;
  // which staff a part's staff goes on: a two-staff part is the piano; otherwise a bass-clef part is the
  // lower staff
  const partStaves = parts.map(p => {
    const attrs = p.querySelector('measure > attributes');
    const staves = attrs ? num(attrs, 'staves', 1) : 1;
    const clef = attrs && kid(attrs, 'clef');
    return { staves, low: staves === 1 && clef && text(clef, 'sign') === 'F' };
  });
  parts.forEach((part, pi) => {
    const { staves, low } = partStaves[pi];
    const staffOf = n => (staves > 1 ? Math.min(1, num(n, 'staff', 1) - 1) : low ? 1 : 0);
    let div = 1;
    let start = 0; // the measure's start, in beats
    const open = new Map(); // tied notes waiting for their continuation: "staff:midi" -> note
    kids(part, 'measure').forEach((meas, mi) => {
      if (mi === 0 && meas.getAttribute('implicit') === 'yes') pickup = true;
      let pos = 0; // in divisions, from the measure's start
      let maxPos = 0;
      let lastStart = 0;
      for (const el of meas.children) {
        const tag = el.localName;
        if (tag === 'attributes') {
          div = num(el, 'divisions', div) || div;
          if (pi === 0) {
            const time = kid(el, 'time');
            if (time && kid(time, 'beats')) ts.push([mi, num(time, 'beats', 4), num(time, 'beat-type', 4)]);
            const key = kid(el, 'key');
            if (key && kid(key, 'fifths')) keys.push([mi, num(key, 'fifths', 0)]);
          }
          kids(el, 'clef').forEach(c => {
            const s = staves > 1 ? Math.min(1, +(c.getAttribute('number') || 1) - 1) : low ? 1 : 0;
            const k = text(c, 'sign') === 'F' ? 'b' : 't';
            // (only changes from what the staff has: treble on top, bass below to begin with)
            const prev = clefs.filter(x => x[1] === s).pop();
            if ((prev ? prev[2] : s ? 'b' : 't') !== k) clefs.push([mi, s, k]);
          });
        } else if (tag === 'backup') pos -= num(el, 'duration');
        else if (tag === 'forward') {
          pos += num(el, 'duration');
          maxPos = Math.max(maxPos, pos);
        } else if (tag === 'direction' || tag === 'sound') {
          const snd = tag === 'sound' ? el : el.querySelector('sound');
          if (bpm == null && snd && snd.getAttribute('tempo')) bpm = Math.round(+snd.getAttribute('tempo'));
          const per = el.querySelector('metronome > per-minute');
          const unit = el.querySelector('metronome > beat-unit');
          if (bpm == null && per && +per.textContent) {
            const f = { half: 2, quarter: 1, eighth: 0.5 }[unit ? unit.textContent.trim() : 'quarter'] || 1;
            bpm = Math.round(
              +per.textContent * f * (el.querySelector('metronome > beat-unit-dot') ? 1.5 : 1),
            );
          }
        } else if (tag === 'harmony') {
          const r = kid(el, 'root');
          if (!r) continue;
          const pc = (STEP[text(r, 'root-step')] + num(r, 'root-alter', 0) + 12) % 12;
          const k = KIND[text(el, 'kind')] || 'maj';
          const step = text(r, 'root-step');
          const alt = num(r, 'root-alter', 0);
          const t = start + (pos + num(el, 'offset', 0)) / div;
          harmony.push({ t, sym: step + (alt > 0 ? '♯' : alt < 0 ? '♭' : '') + SYM[k], pc, k });
        } else if (tag === 'note') {
          if (kid(el, 'grace')) continue;
          const dur = num(el, 'duration', 0);
          const chord = !!kid(el, 'chord');
          const at = chord ? lastStart : pos;
          if (!chord) {
            lastStart = pos;
            pos += dur;
            maxPos = Math.max(maxPos, pos);
          }
          const p = kid(el, 'pitch');
          if (!p || kid(el, 'rest')) continue;
          const alter = num(p, 'alter', 0);
          const m = 12 * (num(p, 'octave', 4) + 1) + STEP[text(p, 'step')] + alter;
          const s = staffOf(el);
          const ties = kids(el, 'tie').map(x => x.getAttribute('type'));
          const key = s + ':' + m;
          const t = start + at / div;
          const d = dur / div;
          if (ties.includes('stop') && open.has(key)) {
            const n = open.get(key);
            n.d = t + d - n.t;
            if (!ties.includes('start')) open.delete(key);
            continue;
          }
          const f = +(el.querySelector('notations > technical > fingering') || {}).textContent || 0;
          const n = { t, d, m, acc: Math.round(alter), h: s, s, f: f >= 1 && f <= 5 ? f : 0 };
          notes.push(n);
          if (ties.includes('start')) open.set(key, n);
        }
      }
      measureLen[mi] = Math.max(measureLen[mi] || 0, maxPos / div);
      start += maxPos / div;
    });
  });
  if (!notes.length) throw new Error('The score has no notes.');
  // bar lines from the longest measure in each place (parts agree in a well-made score)
  const bars = [0];
  measureLen.forEach(l => bars.push(bars[bars.length - 1] + (l || 0)));
  const clean = bars.filter((b, i) => i === 0 || b > bars[i - 1] + 1e-6);
  return {
    title,
    composer: composer ? composer.textContent.trim() : '',
    notes,
    bars: clean,
    ts: ts.length ? ts : [[0, 4, 4]],
    keys: keys.length ? keys : [[0, 0]],
    clefs,
    bpm,
    pickup,
    harmony: harmony.sort((a, b) => a.t - b.t),
  };
}

// how hard a piece looks: notes per beat and how many sound at once
function levelOf(notes, beats) {
  const perBeat = notes.length / Math.max(1, beats);
  const at = new Map();
  notes.forEach(n => at.set(n.t.toFixed(3), (at.get(n.t.toFixed(3)) || 0) + 1));
  const thick = Math.max(...at.values());
  return Math.max(1, Math.min(5, Math.round(perBeat / 1.2 + (thick > 4 ? 1 : 0))));
}

/* a parsed score as a piece in Songs (your own: c 'mine'). Chord symbols written in the file are shown on
   the score; without them DaCapo names the chords itself for noodling, and does not print its guesses. */
function pieceFromScore(sc, { file = '', id = '' } = {}) {
  const notes = sc.notes.slice().sort((a, b) => a.t - b.t || a.h - b.h || a.m - b.m);
  const bars = sc.bars;
  const nb = bars.length - 1;
  const sig = sc.keys[0][1];
  const [n0, d0] = sc.ts[0].slice(1);
  const barBeats = (n0 * 4) / d0;
  const written = sc.harmony.map(h => [+h.t.toFixed(4), h.sym]);
  const syms = written.length ? written : chordSymbols(notes, bars, { sig });
  // the mood and key, for noodling over its chords (the signature's major if the notes say little)
  const g = guessMood(notes);
  const majPc = (((sig * 7) % 12) + 12) % 12;
  const t = sc.title || file.replace(/\.(musicxml|xml|mxl)$/i, '') || 'Untitled';
  return {
    id: id || 'mine-' + Date.now().toString(36),
    t,
    sub: sc.composer || '',
    c: 'mine',
    y: '',
    lvl: levelOf(notes, bars[nb]),
    bpm: Math.max(30, Math.min(200, sc.bpm || 80)),
    tempos: [],
    shift: 0,
    pickup: sc.pickup,
    nb,
    ts: sc.ts,
    keys: sc.keys,
    clefs: sc.clefs,
    syms,
    showSyms: written.length > 0,
    mood: g ? g.mood : 'major',
    pc: g ? g.pc : majPc,
    lic: '',
    by: '',
    mut: '',
    src: file,
    tip: '',
    ...packNotes(notes, bars),
    secs: sectionsOf(notes, bars, { len: barBeats >= 6 ? 2 : 4, pickup: sc.pickup }),
  };
}

// ---- views/songs.js ----
/* Songs: the pieces you are learning, and the music to choose from, one composer at a time. Hard pieces
   are here on purpose: goals to aim for. A piece is learned a section at a time (about four bars): each
   hand, then together, then up to tempo with the metronome; the whole piece last. Tap any section. */

const isWorking = pid => workingPieces().some(w => w.pid === pid);
// how far along a piece is: sections at tempo, of all
const progressOf = pid => {
  const ids = pieceOrder(pid);
  return { done: ids.filter(id => (itemState(id) || {}).stage === 'done').length, total: ids.length };
};
// the section to play next: the first not yet at tempo
const nextItem = pid =>
  pieceOrder(pid).find(id => (itemState(id) || {}).stage !== 'done') || pieceOrder(pid)[0];

const songsView = (page, params = {}) => {
  if (params.pid && Library.get(params.pid)) return piecePage(page, params.pid, params.item);
  const fav = Store.s.profile.favorites || [];
  const all = Library.all();
  // shelves by era (a shelf remembered as a composer opens that composer's era)
  const eraOf = c => (COMPOSERS[c] || {}).era;
  const shelves = Object.keys(ERAS).filter(e => all.some(p => eraOf(p.c) === e));
  const want = ERAS[UI.shelf] ? UI.shelf : eraOf(UI.shelf);
  const shelf = shelves.includes(want)
    ? want
    : shelves.find(e => fav.some(c => eraOf(c) === e)) || shelves[0];
  const shelfName = e => ERAS[e];
  const working = workingPieces();
  page.innerHTML = `
    <h1 class="h1 pagetitle">Songs</h1>
    ${
      working.length
        ? `<section class="card"><h2 class="h2">Learning</h2>${working
            .map(w => {
              const P = Library.get(w.pid);
              const pr = progressOf(w.pid);
              return `<div class="workrow"><div class="row between">
                <button type="button" class="grow linkrow" data-piece="${esc(P.id)}">
                  <span class="ttl">${esc(P.t)}</span>
                  <span class="small">${esc((COMPOSERS[P.c] || {}).short || '')} · ${pr.done} of ${pr.total} at tempo</span>
                </button>
                <button class="btn sm cover" type="button" data-piece="${esc(P.id)}">Open</button>
              </div>${sectionMap(P.id)}</div>`;
            })
            .join('')}</section>`
        : ''
    }
    <section class="card">
      ${seg(
        'sgShelf',
        shelves.map(c => [c, shelfName(c)]),
        shelf,
        'wrap',
      )}
      ${shelfBody(shelf, all)}
    </section>
    <section class="card stack">
      <div class="row between"><b>Add a song</b>
        <label class="btn sm">Choose a MusicXML file<input type="file" id="sgFile" accept=".musicxml,.xml,.mxl" hidden></label></div>
      <p class="small">MusicXML is the score format every notation app exports (MuseScore: File, Export,
        MusicXML). Many scores on musescore.com and IMSLP download as MusicXML too. Chord symbols in the file
        show on the score. The song stays on this device.</p>
    </section>
    <p class="small">Scores: the Mutopia Project (mutopiaproject.org); tunes: the Open Hymnal Project
      (openhymnal.org), public domain. Each piece shows its license and typesetter. Suggested listening and
      full scores open on YouTube and IMSLP.</p>`;
  bindSegs(page, {
    sgShelf: v => {
      UI.shelf = v;
      go('songs');
    },
  });
  $$('[data-piece]', page).forEach(b => {
    b.onclick = () => go('songs', { pid: b.dataset.piece });
  });
  $$('[data-open]', page).forEach(b => {
    b.onclick = () => pieceSheet(b.dataset.open);
  });
  $('#sgFile', page).onchange = e => e.target.files[0] && addScore(e.target.files[0]);
};

// a MusicXML file becomes one of your songs
async function addScore(file) {
  try {
    const sc = parseMusicXML(await scoreText(file));
    const p = pieceFromScore(sc, { file: file.name });
    if (!Library.saveImports(Library.imports().concat(p))) {
      toast('Not enough room on this device for that score.');
      return;
    }
    Log.ev('score added', { n: p.n, nb: p.nb, syms: p.showSyms });
    UI.shelf = 'mine';
    go('songs');
    toast(`Added ${p.t}`);
    pieceSheet(p.id);
  } catch (e) {
    Log.warn('score not read', String((e && e.message) || e));
    toast((e && e.message) || 'Could not read that file.');
  }
}

// difficulty as five dots
const levelDots = n =>
  `<span class="lvl" title="${LEVEL_NAMES[n] || ''}">` +
  [1, 2, 3, 4, 5].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('') +
  '</span>';

// the pieces on one shelf: an era's composers, oldest first, each one's pieces easiest first (or your own)
function shelfBody(era, all) {
  // a tune is listed once; its four-part setting is a switch in its panel
  const list = all.filter(p => (COMPOSERS[p.c] || {}).era === era && !(p.pair && p.id.endsWith('-4')));
  if (era === 'mine')
    return `<p class="small">Songs you added. They stay on this device.</p><div class="stack" style="gap:0">${list
      .sort((a, b) => a.t.localeCompare(b.t))
      .map(pieceRow)
      .join('')}</div>`;
  return Object.keys(COMPOSERS)
    .filter(c => list.some(p => p.c === c))
    .map(
      c => `<p class="small shelfhead"><b>${esc(COMPOSERS[c].n)}</b> · ${esc(COMPOSERS[c].life)}</p>
        <div class="stack" style="gap:0">${list
          .filter(p => p.c === c)
          .sort((a, b) => a.lvl - b.lvl || a.t.localeCompare(b.t))
          .map(pieceRow)
          .join('')}</div>`,
    )
    .join('');
}

function pieceRow(p) {
  const tag = isWorking(p.id) ? ' <span class="tag rh">learning</span>' : '';
  return `
    <button type="button" class="piecerow" data-open="${esc(p.id)}">
      <span class="grow">
        <span class="ttl">${esc(p.t)}${tag}</span>
        <span class="small">${p.sub ? esc(p.sub) + ' · ' : ''}${levelDots(p.lvl)} ${LEVEL_NAMES[p.lvl] || ''}
          · ${p.nb} bars</span>
      </span>
      <span class="chev" aria-hidden="true">›</span>
    </button>`;
}

// one square per section, colored by its stage
function sectionMap(pid) {
  const square = s => {
    const it = itemState(sectionOriginal(`p:${pid}:${s.k}`));
    const cls = s.same >= 0 && !(it && it.stage === 'done') ? 'same' : it ? it.stage : '';
    const name = `Section ${s.k + 1}${s.same >= 0 ? ` (same as ${s.same + 1})` : ''}`;
    return `<i class="${cls}" title="${name}: ${it ? STAGE_TXT[it.stage] : 'not started'}"></i>`;
  };
  return `<div class="secmap" aria-label="Sections">${Library.sections(pid).map(square).join('')}</div>`;
}

// a piece in a panel: what it is, how hard, and a way in
function pieceSheet(pid) {
  const p = Library.get(pid);
  if (!p) return;
  const mine = p.c === 'mine';
  const secs = Library.sections(pid);
  const sig = p.keys && p.keys[0] ? p.keys[0][1] : 0;
  const major = MAJOR_KEYS.find(k => k.sig === sig);
  const minor = MINOR_KEYS.find(k => k.sig === sig);
  const keyName = major ? `${prettyKey(major.k)} major / ${prettyKey(minor.k)} minor signature` : '';
  const meter = p.ts && p.ts[0] ? `${p.ts[0][1]}/${p.ts[0][2]}` : '';
  const tune = p.c === 'tunes';
  const links = mine
    ? ''
    : tune
      ? `<a class="btn ghost" href="${listenUrl(p)}" target="_blank" rel="noopener">Listen</a>`
      : `<a class="btn ghost" href="${scoreUrl(p)}" target="_blank" rel="noopener">Score</a>
       <a class="btn ghost" href="${listenUrl(p)}" target="_blank" rel="noopener">Listen</a>`;
  const source = mine
    ? esc(p.src || '') + ' · stays on this device'
    : tune
      ? `${esc(p.lic)} · from the ${esc(p.by)} (${esc(p.src)})`
      : `Edition: ${esc(p.lic)}${p.by ? ' · typeset by ' + esc(p.by) : ''}${p.mut ? ' · ' + esc(p.mut) : ''}`;
  openSheet(
    `<div class="sheethead"><h2 class="h2">${esc(p.t)}</h2>${closeBtn}</div>
     <p class="small">${p.sub ? esc(p.sub) + ' · ' : ''}${esc((COMPOSERS[p.c] || {}).n || '')}${p.y ? ', ' + p.y : ''}</p>
     <p>${esc(p.tip || '')}</p>
     ${
       p.pair
         ? `<div class="seg" role="group" aria-label="Arrangement">${[pid, p.pair]
             .map(id => Library.get(id))
             .sort((a, b) => a.lvl - b.lvl)
             .map(
               q =>
                 `<button type="button" data-arr="${esc(q.id)}" aria-pressed="${q.id === pid}">${esc(q.sub)}</button>`,
             )
             .join('')}</div>`
         : ''
     }
     <div class="stats">
       <div class="stat"><b>${p.nb}</b><span>bars</span></div>
       <div class="stat"><b>${secs.length}</b><span>sections</span></div>
       <div class="stat"><b>♩ ${p.bpm}</b><span>target tempo</span></div>
       <div class="stat">
         <b>${LEVEL_NAMES[p.lvl] ? p.lvl + '/5' : '–'}</b><span>${esc(LEVEL_NAMES[p.lvl] || '')}</span>
       </div>
     </div>
     <p class="small">${esc(meter)}${meter && keyName ? ' · ' : ''}${esc(keyName)}</p>
     <div class="row">
       <button class="btn" type="button" id="psHear">Hear the opening</button>
       ${links}
     </div>
     <button class="btn cover big" type="button" id="psGo">${isWorking(pid) ? 'Open' : 'Learn this piece'}</button>
     ${
       p.syms && p.syms.length
         ? '<button class="btn" type="button" id="psNoodle">Noodle over its chords</button>'
         : p.mood
           ? `<button class="btn" type="button" id="psMood">Noodle in ${esc(moodName(p.mood, p.pc))}</button>`
           : ''
     }
     <p class="small">${source}</p>
     ${mine ? '<button class="btn sm ghost" type="button" id="psDel">Remove this song</button>' : ''}`,
    sheet => {
      $('#psHear', sheet).onclick = () => playOpening(p);
      $('#psGo', sheet).onclick = () => {
        startPiece(pid);
        go('songs', { pid });
      };
      $$('[data-arr]', sheet).forEach(b => {
